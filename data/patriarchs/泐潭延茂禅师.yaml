id: 泐潭延茂禅师
name: 泐潭延茂
school: 青原系
teacher: 九峰虔
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0210a06。
sayings:
- text: 僧问。如何是古佛心。师曰。终不道土木瓦砾是
  ref: X80n1565_p0210a06（五灯会元）
- text: 问。日落西山去。林中事若何。师曰。庭前花盛发。室内不知春
  ref: X80n1565_p0210a06（五灯会元）
- text: 问。如何是闭门造车。师曰。失却斑猫儿。曰。如何是出门合辙。师曰。坐地到长安
  ref: X80n1565_p0210a06（五灯会元）
- text: 问。如何是和尚正主。师曰。画鼓连槌响。耳畔不闻声
  ref: X80n1565_p0210a06（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0210a06），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
