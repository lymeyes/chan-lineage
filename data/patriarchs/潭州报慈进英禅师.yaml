id: 潭州报慈进英禅师
name: 潭州报慈进英
school: 黄龙派
teacher: 宝峰文禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0682b13。
sayings:
- text: 僧问。远涉长途即不
  ref: X80n1565_p0682b13（五灯会元）
- text: 问。到家一句事如何。师曰。雪满长空。曰。此犹是时人知有。转身一路。又作么生。师便喝
  ref: X80n1565_p0682b13（五灯会元）
- text: 上堂。报慈有一公案。诸方未曾结断。幸遇改旦拈出。各请高著眼看。遂趯下一只鞋。曰。还知这个消息也无。达磨西归时。提𢹂在身畔
  ref: X80n1565_p0682b13（五灯会元）
- text: 上堂。与么上来。猛虎出林。与么下去。惊虵入草。不上不下。日轮杲杲。喝一喝。曰。潇湘江水碧溶溶。出门便是长安道
  ref: X80n1565_p0682b13（五灯会元）
- text: 上堂。掷下拄杖。却召大众曰。拄杖吞却祖师了也。教甚么人说禅。还有人救得也无。喝一喝
  ref: X80n1565_p0682b13（五灯会元）
- text: 上堂。蓦拈拄杖曰。三世一切佛。同入这窠窟。衲僧唤作辽天鹘。卓拄杖一下
  ref: X80n1565_p0682b13（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0682b13），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
