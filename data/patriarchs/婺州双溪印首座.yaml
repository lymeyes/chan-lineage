bio: 婺州双溪印首座，北宋临济宗黄龙派，宝峰克文（云庵真净）弟子。自见真净，彻证宗猷，归遁双溪，隐而不出。
sayings:
- text: 偶书曰：「折脚铛儿谩自煨，饭余长是坐堆堆。一从近日生涯拙，百鸟衔华去不来。」
  ref: 五灯会元·卷十七·宝峰文禅师法嗣
- text: 以触衣碎甚，作偈曰：「不挂寸丝方免寒，何须特地袅长竿。而今落落零零也，七佛之名甚处安？」
  ref: 五灯会元·卷十七·宝峰文禅师法嗣
