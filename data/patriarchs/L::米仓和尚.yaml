bio: 新到参。绕师三匝。敲禅床曰。不见主人公。终不下参众。师曰。甚么处情识去来。曰。果然不在。师便打一拄杖。僧曰。几落情识。师曰。村草步头逢著一个。有甚么话处。曰。且参众去
