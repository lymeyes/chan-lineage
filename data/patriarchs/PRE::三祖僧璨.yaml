id: PRE::三祖僧璨
name: 僧璨
honorific: 东土三祖 · 鉴智禅师（谥）
school: 东土祖师
dynasty: 隋
region: 舒州皖公山
teacher: 慧可
source_ref: 五灯会元·卷一·三祖僧璨 / 景德传灯录·卷三
cbeta: T51n2076 卷三
bio: '初以居士身患风疾，谒二祖求忏罪，言下契悟，嗣法。隐于舒州皖公山，往来太湖县司空山，不与世接。

  著《信心铭》一卷，为禅宗早期重要文献，开「至道无难，唯嫌拣择」之旨，扫荡情尘、直显性源。后传法于道信。'
sayings:
- text: 《信心铭》：「至道无难，唯嫌拣择。但莫憎爱，洞然明白。」
  ref: 信心铭 / 景德传灯录·卷三
