bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0138b18。
sayings:
- text: 问。摩尼珠人不识。如来藏里亲收得。如何是藏。泉曰。与汝往来者是。师曰。不往来者如何。泉曰。亦是。曰。如何是珠。泉召师祖。师应诺。泉曰。去。汝不会我语。师从此信入
  ref: X80n1565_p0138b18（五灯会元）
