id: 杭州罗汉院宗彻禅师
name: 杭州罗汉院宗彻
school: 南岳系
teacher: 黄檗希运禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0151a10。
sayings:
- text: 上堂。僧问。如何是祖师西来意。师曰。骨锉也师对机多用此语。时号骨锉和尚
  ref: X80n1565_p0151a10（五灯会元）
- text: 问。如何是南宗北宗。师曰。心为宗。曰。还看教也无。师曰。教是心
  ref: X80n1565_p0151a10（五灯会元）
- text: 问。性地多昏。如何了悟。师曰。烦云风卷。太虗廓清。曰。如何得明去。师曰。一轮皎洁。万里腾光
  ref: X80n1565_p0151a10（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0151a10），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
