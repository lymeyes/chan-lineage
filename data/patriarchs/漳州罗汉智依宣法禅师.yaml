id: 漳州罗汉智依宣法禅师
name: 漳州罗汉智依宣法
school: 法眼宗
teacher: 清凉益
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0358a13。
sayings:
- text: 上堂。尽十方世界。无一微尘许法。与汝作见闻觉知。还信么。然虽如此。也须悟始得。莫将为等闲。不见道。单明自己。不悟目前。此人祇具一只眼。还会么
  ref: X80n1565_p0358a13（五灯会元）
- text: 僧问。纤尘不立。为甚么好丑现前。师曰。分明记取。别处问人
  ref: X80n1565_p0358a13（五灯会元）
- text: 问。大众云集。谁是得者。师曰。还曾失么
  ref: X80n1565_p0358a13（五灯会元）
- text: 问。如何是佛。师曰。汝是行脚僧
  ref: X80n1565_p0358a13（五灯会元）
- text: 问。如何是宝寿家风。师曰。一任观看。曰。恁么则大众有赖。师曰。汝作么生。曰。终不敢谩大众。师曰。嫌少作么。问僧。受业在甚么处。曰。在佛迹。师曰。佛在甚么处。曰。甚么处不是
  ref: X80n1565_p0358a13（五灯会元）
- text: 师举起拳曰。作么生。曰。和尚收取。师曰。放阇黎七棒。问僧。今夏在甚么处。僧曰。在无言上座处。师曰。还曾问讯他否。僧曰。也曾问讯。师曰。无言作么生问得。僧曰。若得无言。甚么处不问得。师喝曰。恰似问老兄。师与彦端长老吃饼餤。端曰。百种千般。其体不二。师曰。作么生是不二体。端拈起饼餤。师曰。祇守百种千般。端曰。也是和尚见处。师曰。汝也是罗公咏梳头样。师将示灭。乃谓众曰。今晚四大不和畅。云腾鸟飞。风动尘起。浩浩地还有人治得么。若治得。永劫不相识。若治不得。时时常见我。言讫告寂
  ref: X80n1565_p0358a13（五灯会元）
