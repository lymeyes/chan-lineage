bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0309a05。
sayings:
- text: 僧问。如何是齐云水。师曰。龙潭常彻底。拟问即波澜。曰。莫祇这个便是么。师曰。古殿无香烟。谁人辩清浊。曰。未审深深处如何。师曰。阇黎欲识深深处。直须脚下绝云生
  ref: X80n1565_p0309a05（五灯会元）
