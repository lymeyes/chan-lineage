id: 灌州灵岩和尚
name: 灌州灵岩
school: 青原系
teacher: 罗山闲
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0276b08。
sayings:
- text: 僧问。如何是道中宝。师曰。地倾东南。天高西北。曰。学人不会。师曰。落照机前异。师颂石巩接三平曰。解擘当胸箭。因何祇半人。为从途路晓。所以不全身。吉州󱞢山和尚示徒颂曰。匡山路。匡山路。岩崖崄峻人难措。游人拟议隔千山。一句分明超佛祖。白牛颂曰。我有古坛真白牛。父子藏来经几秋。出门直往孤峰顶。回来暂跨虎溪头
  ref: X80n1565_p0276b08（五灯会元）
