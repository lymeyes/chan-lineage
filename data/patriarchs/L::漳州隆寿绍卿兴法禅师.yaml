id: L::漳州隆寿绍卿兴法禅师
name: 漳州隆寿绍卿兴法
school: —
teacher: 雪峰存
status: draft
bio: 泉州陈氏子。因侍雪峰。山行见芋叶动。峰指动叶示之。师曰。绍卿甚生怕怖。峰曰。是汝屋里底。怕怖甚么。师于此有省。寻居龙谿
sayings:
- text: 僧问。古人道。摩尼殿有四角。一角常露。如何是常露底角
  ref: X80n1565_p0265a12（五灯会元）
- text: 师举拂子。问。粮不畜一粒。如何济得万人饥。师曰。侠客面前如夺剑。看君不是黠儿郎
  ref: X80n1565_p0265a12（五灯会元）
- text: 问。耳目不致处如何。师曰。汝无此作。曰。恁么即闻也。师曰。真个聋汉。福州迁宗院行󱒧
  ref: X80n1565_p0265a12（五灯会元）
