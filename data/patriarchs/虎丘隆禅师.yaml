id: 虎丘隆禅师
name: 虎丘绍隆
honorific: 平江虎丘绍隆禅师（圆悟克勤法嗣，虎丘派开祖）
school: 杨岐派
dynasty: 北宋—南宋（1077—1136）
region: 平江虎丘山（今江苏苏州）
teacher: 圆悟克勤（昭觉勤禅师）
source_ref: 五灯会元·卷十九·平江虎丘绍隆 / 嘉泰普灯录
cbeta: X78n1543（嘉泰普灯录）相关章次
bio: 圆悟克勤之法嗣，杨岐派第四代，虎丘派开祖。和州含山人。初参长芦崇信，后谒圆悟，随侍日久。圆悟以「竹篾子」「有句无句，如藤倚树」等话头勘验，绍隆于参究中彻悟，圆悟以「这汉彻也」印之。住平江虎丘山，道望甚隆。门下应庵昙华，昙华传密庵咸杰；密庵下出破庵祖先、松源崇岳，破庵出无准师范、雪窦元聪——虎丘一派遂为南宋临济之正宗，元代高峰原妙、中峰明本皆其远裔。
sayings:
- text: 圆悟举「竹篾子」话：「唤作竹篾子则触，不唤作竹篾子则背」；绍隆于此有省。后举「有句无句，如藤倚树」，绍隆闻圆悟道「树倒藤枯」而大悟。
  ref: 五灯会元·卷十九·虎丘绍隆 / 大慧宗杲机缘
- text: 师上堂：「参玄之士，触境遇缘，不能明得，盖为不遇本分作家；若是本分人，才闻举着，如龙得水，似虎靠山。」
  ref: 五灯会元·卷十九·虎丘绍隆
status: draft
verify: 待 CBETA 校对虎丘绍隆机缘；虎丘派下传谱系（应庵→密庵→破庵→无准→高峰→中峰）须逐代核实。
