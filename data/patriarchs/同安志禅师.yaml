id: 同安志禅师
name: 同安志
school: 曹洞宗
teacher: 同安丕
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0513b13。
sayings:
- text: 上堂曰。多子塔前宗子秀。五老峰前事若何。如是三举。未有对者。末后师出曰。夜明帘外排班立。万里歌谣道太平。安曰。须是这驴汉始得。住后
  ref: X80n1565_p0513b13（五灯会元）
- text: 僧问。二机不到处。如何举唱。师曰。遍处不逢。玄中不失
  ref: X80n1565_p0513b13（五灯会元）
- text: 问。凡有言句。尽落今时。学人上来。请师直指。师曰。目前不现。句后不迷。曰。向上事如何。师曰。迥然不换。标的即乖
  ref: X80n1565_p0513b13（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0513b13），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
