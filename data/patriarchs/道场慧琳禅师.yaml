sayings:
- text: 上堂。有漏笊篱无漏木杓。庭白牡丹槛红芍药。因思九年面壁人。到头不识这一著。且道作么生是这一著。以拄杖击禅床下座
  ref: T51n2077_p0673c23（续传灯录）
- text: 上堂。一即多多即一。毘卢顶上明如日。也无一也无多。现成公案没誵讹。拈起旧来毡拍板。明时共唱太平歌
  ref: T51n2077_p0673c23（续传灯录）
