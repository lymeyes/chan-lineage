id: 瑞州洞山清禀禅师
name: 瑞州洞山清禀
school: 曹洞宗
teacher: 云门文偃禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0572a02。
sayings:
- text: 问。今日离甚处。曰。慧林。门举拄杖曰。慧林大师恁么去。汝见么。曰。深领此
  ref: X80n1565_p0572a02（五灯会元）
- text: 问。门顾左右微笑而已。师自此入室印悟。金陵主请居光睦。未几命入澄心堂。集诸方语要。经十稔迎住洞山。开堂日。维那白槌曰。法筵龙象众。当观第一义。师曰。好个消息。祇恐错会。时有
  ref: X80n1565_p0572a02（五灯会元）
- text: 僧问。云门一曲师亲唱。今日新丰事若何。师曰。也要道却
  ref: X80n1565_p0572a02（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0572a02），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
