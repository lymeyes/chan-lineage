id: 越州石佛晓通禅师
name: 越州石佛晓通
school: 云门宗
teacher: 慧林本
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0631a02。
sayings:
- text: 上堂。冷似秋潭月。无心合太虗。山高流水急。何处驻游鱼
  ref: X80n1565_p0631a02（五灯会元）
- text: 僧问。如何是顿教。师曰。月落寒潭。曰。如何是渐教。师曰。云生碧汉。曰。不渐不顿时如何。师曰。八十老婆不言嫁
  ref: X80n1565_p0631a02（五灯会元）
