id: 澧州钦山文邃禅师
name: 澧州钦山文邃
school: 曹洞宗
teacher: 洞山良价禅师
status: draft
bio: 福州人也。少依杭州大慈山寰中禅师受业。时岩头．雪峰在众。睹师吐论。知是法器。相率游方。二大士各承德山印记。师虽屡激扬。而终然凝滞。一日。问德山曰。天皇也恁么道。龙潭也恁么道。未审和尚作么生道。山曰。汝试举天皇龙潭道底看。师拟进语。山便打。师被打归延寿堂。曰。是则是。打我太煞。岩头曰。汝恁么道。他后不得道见德山来法眼别云。是则是错打我。后于洞山言下发解。乃为之嗣。年二十七。止于钦山。对大众前自省过。举参洞山时语。山
sayings:
- text: 问。甚么处来。师曰。大慈来。曰。还见大慈么。师曰。见。曰。色前见。色后见。师曰。非色前后见。洞山默置。师乃曰。离师太早。不尽师意法眼云。不尽师意。不易承嗣得他
  ref: X80n1565_p0491b18（五灯会元）
- text: 僧问。如何是祖师西来意。师曰。梁公曲尺。志公剪刀
  ref: X80n1565_p0491b18（五灯会元）
- text: 问。一切诸佛及诸佛法。皆从此经出。如何是此经。师曰。常转。曰。未审经中说甚么。师曰。有疑请
  ref: X80n1565_p0491b18（五灯会元）
- text: 问。问。如何是和尚家风。师曰。锦绣银香囊。风吹满路香。岩头闻。令僧去云。传语十八子。好好事潘郎。有僧写师真呈。师曰。还似我也无。僧无对。师自代曰。众僧看取。德山侍者来参。才礼拜。师把住曰。还甘钦山与么也无。者曰。某甲却悔久住德山。今日无言可对。师乃放手曰。一任祇对。者拨开𮌎曰。且听某通气一上。师曰。德山门下即得。这里一点用不著。者曰。久闻钦山不通人情。师曰。累他德山眼目。参堂去。师与岩头．雪峰坐次。洞山行茶来。师乃闭眼。洞曰。甚么处去来。曰。入定来。洞曰。定本无门。从何而入。师入浴院。见僧踏水轮。僧下问讯。师曰。幸自辘辘地转。何须恁么。曰。不恁么又争得。师曰。若不恁么。钦山眼堪作甚么。曰。作么生是师眼。师以手作拨眉势。曰。和尚又何得恁么。师曰。是我恁么。你便不恁么。僧无对。师曰。索战无功。一场气闷。良久。乃问曰。会么。曰。不会。师曰。钦山为汝担取一半。师与岩头．雪峰过江西。到一茶店吃茶次。师曰。不会转身通气者。不得茶吃。头曰。若恁么我定不得茶吃。峰曰。某甲亦然。师曰。这两个老汉话头也不识。头曰。甚处去也。师曰。布袋里老鸦虽活如死。头退后曰。看。看。师曰。奯公且置。存公作么生。峰以手画一圆相。师曰。不得不
  ref: X80n1565_p0491b18（五灯会元）
- text: 问。头呵呵曰。太远生。师曰。有口不得茶吃者多。巨良禅客参。礼拜了便
  ref: X80n1565_p0491b18（五灯会元）
- text: 问。一镞破三关时如何。师曰。放出关中主看。良曰。恁么则知过必改。师曰。更待何时。良曰。好只箭。放不著所在。便出去。师曰。且来。阇黎。良回首。师下禅床擒住曰。一镞破三关即且置。试为钦山发箭看。良拟议。师打七棒曰。且听个乱綂汉疑三十年。有僧举似同安察。安曰。良公虽解发箭。要且未中的。僧便
  ref: X80n1565_p0491b18（五灯会元）
- text: 问。未审如何得中的去。安曰。关中主是甚么人。僧回举似师。师曰。良公若解恁么。也免得钦山口。然虽如此。同安不是好心。亦须看始得。僧参。师竖起拳曰。开即成掌。五指参差。如今为拳。必无高下。汝道钦山还通商量也无。僧近前。却竖起拳。师曰。你恁么祇是个无开合汉。曰。未审和尚如何接人。师曰。我若接人。共汝一般去也。曰。特来参师。也须吐露个消息。师曰。汝若特来。我须吐露。曰。便请。师便打。僧无语。师曰。守株待兔。枉用心神
  ref: X80n1565_p0491b18（五灯会元）
- text: 上堂。横按拄杖。顾视大众曰。有么有么。如无。钦山唱菩萨蛮去也。啰啰哩哩。便下座。师与道士论义。士立义曰。麤言及细语。皆归第一义。师曰。道士是佛家奴。士曰。太麤生。师曰。第一义何在。士无语
  ref: X80n1565_p0491b18（五灯会元）
