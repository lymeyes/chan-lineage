id: L::镇州永泰智航禅师
name: 镇州永泰智航
school: 云门宗
teacher: 慧林冲
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0633b03。
sayings:
- text: 上堂。散为气者。乃道之漓。适于变者。为法之弊。灵机不昧。亘古亘今。大用现前。何得何失。虽然如是。忽遇无孔铁槌。作么生话会。拈拄杖曰。穿过了也
  ref: X80n1565_p0633b03（五灯会元）
- text: 上堂。龙腾碧汉。变化无方。凤翥青霄。谁知踪迹。可行则行。不出百千三昧。可止则止。宁忘万象森罗。所以道取不得。舍不得。不可得中祇么得。且道得个甚么。良久曰。莫妄想。江阴军寿圣子󳬛
  ref: X80n1565_p0633b03（五灯会元）
