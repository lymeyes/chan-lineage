id: L::嘉州白水禅师
name: 嘉州白水
school: 青原系
teacher: 夹山会
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0206b11。
sayings:
- text: 僧问。如何是西来意。师曰。四溟无窟宅。一滴润乾坤
  ref: X80n1565_p0206b11（五灯会元）
- text: 问。曹溪一路。合谭何事。师曰。㵎松千载鹤来聚。月中香桂凤凰归
  ref: X80n1565_p0206b11（五灯会元）
- text: 问。如何是此经。师曰。抛梭石女辽空响。海底泥牛夜叫频
  ref: X80n1565_p0206b11（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0206b11），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
