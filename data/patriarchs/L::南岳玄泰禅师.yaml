id: L::南岳玄泰禅师
name: 南岳玄泰
school: 青原系
teacher: 石霜诸
status: draft
bio: 沉静寡言。未尝衣帛。时谓之泰布衲。始见德山。升于堂矣。后谒石霜。遂入室焉。掌翰二十年。与贯休齐己为友。后居兰若。曰金刚台。誓不立门徒。四方后进依附。皆用交友之礼。尝以衡山多被山民斩伐烧畬。为害滋甚。乃作畬山谣曰。畬山儿。畬山儿。无所知。年年斫断青山嵋。就中最好衡岳色。杉松利斧摧贞枝。灵禽野鹤无因依。白云回避青烟飞。猿猱路绝岩崖出。芝术失根茆草肥。年年斫罢仍再鉏。千秋终是难复初。又道今年种不来。来年更斫当阳坡。国家岳域向如此。不知此理如之何。远迩传播。达于九重。有诏禁止。故岳中兰若无复延燎。师之力也。将示灭。乃召一僧令备薪蒸。留偈曰。今年六十五。四大将离主。其道自玄玄。个中无佛祖。不用剃头。不须澡浴。一堆猛火。千足万足。端坐垂一足而逝。阇维收舍利。建塔于迎云亭侧
