sayings:
- text: 僧问。如何是佛。师曰。发白面皱。曰。如何是法。师曰。暑往寒来
  ref: X80n1565_p0593b02（五灯会元）
- text: 问。如何是三界外事。师曰。洛阳千里余。不得旧时书
  ref: X80n1565_p0593b02（五灯会元）
