bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0288a17。
sayings:
- text: 上堂。于座前侧立曰。大众各归堂得也未。还会得么。若也未会。山僧谩诸人去也。遂升座
  ref: X80n1565_p0288a17（五灯会元）
- text: 僧问。海众云臻。请师开方便门。示真实相。师曰。这个是方便门。曰。恁么则大众侧聆去也。师曰。空侧聆作么
  ref: X80n1565_p0288a17（五灯会元）
