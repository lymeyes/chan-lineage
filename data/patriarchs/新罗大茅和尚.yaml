id: 新罗大茅和尚
name: 新罗大茅
school: 南岳系
teacher: 归宗常
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0141b11。
sayings:
- text: 上堂。欲识诸佛师。向无明心内识取。欲识常住不凋性。向万物迁变处识取
  ref: X80n1565_p0141b11（五灯会元）
- text: 僧问。如何是大茅境。师曰。不露锋。曰。为甚么不露锋。师曰。无当者
  ref: X80n1565_p0141b11（五灯会元）
