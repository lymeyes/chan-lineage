sayings:
- text: 问：镇州萝卜即不问，庐陵米作么价？师云：可贵可贱。僧曰：小出大遇也。师云：君子爱财，取之有道。僧曰：大众沾恩。师云：有人索汝米钱在。师乃云：美玉藏顽石，莲华出淤泥，须知烦恼处，悟得即菩提。咄！
  ref: X78n1556_p0233b12（建中靖国续灯录）
