bio: 杭州报慈院从瓌禅师，福州陈氏子。师承法眼宗长庆慧棱，初住越州称心寺，后住杭州报慈院，为法眼一脉在杭州的重要传人。开宝六年（973）六月十四日辰时沐浴易衣，告门人付嘱讫，右胁而逝。
sayings:
- text: 僧问：「承古有言，今人看古教，未免心中闹。欲免心中闹，应须看古教。如何是古教？」师曰：「如是我闻。」曰：「如何是心中闹？」师曰：「那畔雀儿声。」
  ref: 景德传灯录·卷二十一（T51n2076_p0377a21-24）；五灯会元·卷八（X80n1565_p0289a15-17）
