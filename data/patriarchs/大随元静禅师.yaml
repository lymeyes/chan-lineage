id: 大随元静禅师
name: 大随元静
alias: 大随静
school: 杨岐派
teacher: 五祖法演禅师
status: draft
bio: 后名道兴。阆之玉山大儒赵公约仲之子也。十岁病甚。母祷之。感异梦舍令出家。师成都大慈宝生院宗裔。元祐三年通经得度。留讲聚有年而南下。首参永安恩禅师。于临济三顿棒话发明。次依诸名宿无有当意者。闻五祖机峻。欲抑之。遂谒祖。祖乃曰。我此间不比诸方。凡于室中不要汝进前退后竖指擎拳绕禅床作女人拜提起坐具千般伎俩。只要尔一言下谛当。便是汝见处。师茫然退。参三载。一日入室罢。祖谓曰子所下语已得十分。试更与我说看。师即剖而陈之。祖曰。说亦说得十分。更与我断看。师随所问而判之。祖曰。好即好只是未曾得老僧说话在。斋后可来祖师塔所。与汝一一按过始得。及至彼。祖便以即心即佛非心非佛。睦州担板汉。南泉斩猫儿。赵州狗子无佛性有佛性之语。编辟之其所对了无凝滞。至子胡狗话。祖遽转面曰。不是。师曰。不是却如何。祖曰。此不是则和前面皆不是。师曰。望和尚慈悲指示。祖曰。看他道。子胡有一狗。上取人头中取人腰下取人脚。入门者好看。才见僧入门便道看狗。向子胡道看狗处。下一转语教子胡结舌。老僧钤口便是尔了当处。次日入室师默启其说。祖笑曰。不道尔不是千了百当底人。此语只似先师下底语。师曰。某何人得似端和尚。祖曰。不然。老僧虽承嗣他。谓他语拙。盖只用远录公手段接人故也。如老僧共远录公。便与百丈黄檗南泉赵州辈把手共行。才见语拙即不堪。师以为不然迺拽杖渡江。适大水泛涨因留。四祖侪辈挽其归。又二年祖方许可。尝商略古今次。执师手曰。得汝说须是吾举。得汝举须是吾说。而今而后佛祖秘要诸方关键。无逃子掌握矣。遂创南堂以居之。于是名冠寰海。成都帅席公旦请开法嘉祐。未几徙昭觉迁能仁及大随
sayings:
- text: 上堂。君王了了将帅惺惺。一回得胜六国平宁
  ref: T51n2077_p0637c22（续传灯录）
- text: 上堂举临济参黄檗之语。白云端和尚颂云。一拳拳倒黄鹤楼。一趯趯翻鹦鹉洲。有意气时添意气。不风流处也风流。师曰。大随即不然。行年七十老𨀁蹱。眼目精明耳不聋。忽地有人欺负我。一拳打倒过关东
  ref: T51n2077_p0637c22（续传灯录）
- text: 上堂问答已。乃曰。有祖已来时人错会。只将言句以为禅道。殊不知道本无体因体而得名。道本无名因名而立号。只如适来上座才恁么出来便恁么归众。且道具眼不具眼。若道具眼。才恁么出来。眼在甚么处。若道不具眼。争合便恁么去。诸仁者。于此见得倜傥分明。则知二祖礼拜依位而立真得其髓。只这些子是三世诸佛命根。六代祖师命脉。天下老和尚安身立命处。虽然如是。须是亲到始得
  ref: T51n2077_p0637c22（续传灯录）
- text: 上堂。自己田园任运耕。祖宗基业力须争。悟得千圣头边坐。用向三途底下行
  ref: T51n2077_p0637c22（续传灯录）
- text: 僧问。祖师心印请师直指。师曰。尔闻热么。曰闻。师曰。且不闻寒。曰和尚还闻热否。师曰。不闻。曰为甚么不闻。师摇扇曰。为我有这个。问如何是夺人不夺境。师曰。活捉魔王鼻孔穿。曰如何是夺境不夺人。师曰。中心树子属吾曹。曰如何是人境两俱夺。师曰。一钓三山连六鳖。曰如何是人境俱不夺。师曰。白日骑牛穿市过。问莲华未出水时如何。师曰好。曰出水后如何。师曰好。曰如何是莲华。师曰好。僧礼拜。师曰。与他三个好。万事一时休。问藏天下于天下。即不
  ref: T51n2077_p0637c22（续传灯录）
- text: 问。乃举拳曰。只如这个作么生藏。师曰。有甚么难。曰且作么生藏。师曰。衫袖里曰未审如何是纪纲佛法底人。师曰。不可是鬼。曰忽遇杀佛杀祖底来。又作么生支遣。师曰。老僧有眼不曾见。问学人乍入丛林乞师指示。师曰。吃粥吃饭莫教放在脑后。曰终日吃时未尝吃。师曰。负心衲子不识好恶。问劫火洞然大千俱坏。未审这个坏也无。师曰。阿谁教尔恁么。问僧进前鞠躬。曰。不审。师曰。是坏不坏。僧无语。问如何是山里禅。师曰。庭前嫩竹先生笋。㵎下枯松长老枝。曰如何是市里禅。师曰。六街钟鼓韵冬冬。即处铺金世界中。曰如何是村里禅。师曰。贼盗消亡蚕麦熟。讴歌鼓舞乐升平。问如何是诸佛出身处。师曰。问得甚当。曰便恁么去时如何。师曰。答得更奇。问因山见水见水忘山。山水俱忘理归何所。师曰。山僧坐却舌头天地黯黑。有一老宿垂语云。十字街头起一间茅厕。只是不许人屙。僧举以扣师。师曰。是尔先屙了。更教甚么人屙。宿闻焚香遥望大随再拜谢之。绍兴乙卯秋七月大雨雪山中有异象。师曰。吾期至矣。十七日别郡守。以次越三日示少恙于天彭。二十四日夜谓侍僧曰。天晓无月时如何。僧无对。师曰。倒教我与汝下火始得。翌日还堋口廨院。留遗诫。蜕然示寂。门弟子奉全身归。烟雾四合猿鸟悲鸣。茶毘异香遍野。舌本如故设利五色者不可计。瘗于定光塔之西。后住天童天目文礼作师画像赞。可补行实之缺。因并录此。赞曰。东山一会人。唯他不唧𠺕。别处著闲房。丛林难讲究。邡水潭蛇出惊人。钝铁锅鸡啼白昼。杂剧打来。全火只候。晚岁放疏慵。却与俗和同。勤巴子使人勘验。掷香贴便显家风。定光无佛枉费罗笼。临行摇铎虚空。那知丧尽白云宗
  ref: T51n2077_p0637c22（续传灯录）
