id: 金山善宁禅师
name: 金山善宁
alias: 金山宁
school: 云门宗
teacher: 慧林本禅师
status: draft
bio: 江州人。受业于甘露寺。至圆照禅师法席。师资机感缘如夙契。戮力赞弼以扬法化。出世万寿规矩严肃。躬己力行众无不服
sayings:
- text: 上堂僧问。天皇也恁么道龙潭也恁么道。未审和尚作么生道。师曰。手握白玉鞭。骊珠尽击碎。云退身有分。师曰。知过必改。问如何是祖师西来意。师曰。秤尾无星。云未审此意如何。师曰。斗方有底。云如何是佛。师曰。眉如初月眼似流星。云如何是法。师曰。义列交罗星分大野。云如何是僧。师曰。古貌棱层。丈夫意气。问竿木随身逢场作戏。今朝选佛场开请师方便。师曰。文不加点。云可谓古今罕闻。师曰。且道是什么题目。僧拟议。师便打。乃顾视左右曰。古人道。在眼曰见。在耳曰闻。在鼻嗅香。在舌谈论。在身觉触。在意攀缘。虽然如是。只见锥头利。不见凿头方。若是万寿即不然。有眼觑不见。有耳听不闻。有鼻不知香。有舌无谈论。有身不觉触。有意不攀缘。一念相应六根解脱。敢问诸禅德。且道与前来是同是别。莫有具眼衲僧出来通个消息。若无复为诸人重重注破。放开则私通车马。捏聚则高下不存。若是惯战作家。一任是非贬剥。又曰。撮玄机于掌上。挂古鉴于台前。有何妖孽谁敢当御。可谓昭昭法界自他而境智全收。历历真源彼此而圣凡俱寂。以此而推。僧堂佛殿对现色身。厨库三门共扬斯事。但请拗折拄杖向目前参取。又曰。若也谈禅说道。便见有生有灭。更乃举扬古今。大似不观时节。昨夜风雨潇潇。今朝顿除烦热。到此善能参详。达磨迷是不别。又曰。尽大地未尝有一人真正举扬宗教。若有一人。举扬宗教。尽大地人并须铓锋结舌。莫是教诸人杜绝见闻契合斯道也无。如此见解譬如萤火烧须弥山。经尘沙劫终不能著。殊不知古圣垂示只要后人眼正。眼正达者实谓古今罕闻。光前绝后。放行言言见谛句句明宗。收来眼眼从方明明侧立。向什么处见古人。良久曰。须知海岳归明主。未信乾坤别有天
