sayings:
- text: 问。来作甚么。山曰。来亲近和尚。师曰。若是亲近。用动这两片皮作么。山无对曹山云。一子亲得
  ref: X80n1565_p0176a16（五灯会元）
- text: 僧问。如何是佛。师曰。猫儿上露柱。曰。学人不会。师曰。问取露柱去
  ref: X80n1565_p0176a16（五灯会元）
