id: 仰山行伟禅师
name: 仰山行伟
alias: 仰山伟
school: 黄龙派
teacher: 黄龙慧南禅师
status: draft
bio: 河朔人也。东京大佛寺受具。听习圆觉微有所疑。挈囊游方专扣祖意。至南禅师法席六迁星序。一日扣请寻被喝出。足拟跨门顿省玄旨。出世仰山道风大著
sayings:
- text: 上堂。大众会么。古今事掩不得。日用事藏不得。既藏掩不得则日用现前。且问诸人。现前作么生参
  ref: T51n2077_p0568b23（续传灯录）
- text: 上堂。大众见么。开眼则普观十方。合眼则包含万有。不开不合是何模样。还见模样么。久参高德举处便晓。后进初机识取模样。莫只管贪睡。睡时眼见个甚么。若道不见与死人何别。直饶丹青处士笔头上画出。青山绿水夹竹桃花。只是相似模样。设使石匠锥头钻出群羊走兽。也只是相似模样。若是真模样。任是处士石匠无尔下手处。诸人要见须是著眼始得。良久曰。广则一线道。狭则一寸半。以拂子击禅床。鼓声才动大众云臻。诸人上观山僧下觑。上观观个甚么。下觑觑个甚么。良久曰。对面不相识
  ref: T51n2077_p0568b23（续传灯录）
- text: 上堂。道不在声色而不离声色。凡一语一默一动一静隐显纵横无非佛事。日用现前古今凝然理何差互。师自题其像曰。吾真难貌斑斑驳驳拟欲安排下笔便错示寂。阇维获五色舍利骨石栓索句连。塔于寺之东
  ref: T51n2077_p0568b23（续传灯录）
