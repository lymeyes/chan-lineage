bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0524a07。
sayings:
- text: 僧问。如何是佛。师曰。骑牛趁春草。背却少年爷
  ref: X80n1565_p0524a07（五灯会元）
- text: 问。宝剑未磨时如何。师曰。乌龟啖黑豆。曰。磨后如何。师曰。庭柱挂灯笼。曰。如何是修行。师曰。庭柱伤寒
  ref: X80n1565_p0524a07（五灯会元）
