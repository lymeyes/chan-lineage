id: L::漳州罗汉和尚
name: 漳州罗汉
school: 南岳系
teacher: 关南常
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0158b09。
sayings:
- text: 问。如何是大道之源。南打师一拳。师遂有省。乃为歌曰。咸通七载初参道。到处逢言不识言。心里疑团若栲栳。三春不乐止林泉。忽遇法王毡上坐。便陈疑恳向师前。师从毡上那伽起。袒膊当胸打一拳。骇散疑团獦狚落。举头看见日初圆。从兹蹬蹬以碣碣。直至如今常快活。只闻肚里饱膨脝。更不东西去持钵。又述偈曰。宇内为闲客。人中作野僧。任从他笑我。随处自腾腾
  ref: X80n1565_p0158b09（五灯会元）
