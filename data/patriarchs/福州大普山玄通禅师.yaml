bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0263b14。
sayings:
- text: 僧问。骊龙颔下珠如何取得。师乃拊掌瞬视
  ref: X80n1565_p0263b14（五灯会元）
- text: 问。方便以前事如何。师便推出。其
  ref: X80n1565_p0263b14（五灯会元）
- text: 僧问。如何是祖师西来意。师曰。𫜪骨头汉出去
  ref: X80n1565_p0263b14（五灯会元）
- text: 问。拨尘见佛时如何。师曰。脱枷来商量
  ref: X80n1565_p0263b14（五灯会元）
- text: 问。急急相投。请师接。师曰。钝汉
  ref: X80n1565_p0263b14（五灯会元）
