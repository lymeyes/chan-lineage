id: 福州东山云顶禅师
name: 福州东山云顶
school: —
teacher: 未详
status: draft
bio: 泉州人遗其氏。以再下春闱。往云台大吼寺剃染具戒。即谒大愚．芝神．鼎𬤇。后见罗汉下尊宿。始彻己事。道学有闻丛林。称为顶三教
sayings:
- text: 僧问。如何是和尚日用事。师曰。我吃饭。汝受饥。曰。法法不相到。又作么生。师曰。汝作罪。我皆知
  ref: X80n1565_p0220b14（五灯会元）
- text: 问。如何是和尚一枝拂。师曰。打破修行窟。曰。恁么则本来无一物也。师曰。知无者是谁。曰。学人罪过。师曰。再思可矣。居士问洞山道。有一物上拄天。下拄地。未审是甚么物。师曰。担铁架。吃铁棒。曰。天地黑。山河走。师曰。阎老殿前添一鬼。北邙山下卧千年。士叫。快活。快活。师曰。也是野狐吞老鼠。九龙观道士并三士人。请
  ref: X80n1565_p0220b14（五灯会元）
- text: 上堂。儒门画八卦。造契书。不救六道轮回。道门朝九皇。炼真气。不达三祇劫数。我释迦世尊。洞三祇劫数。救六道轮回。以大愿摄人天。如风轮持日月。以大智破生死。若劫火焚秋毫。入得我门者。自然转变天地。幽察鬼神。使须弥．铁围．大地．大海入一毛孔中。一切众生。不觉不知。我说此法门。如虗空俱含万象。一为无量。无量为一。若人得一。即万事毕。珍重
  ref: X80n1565_p0220b14（五灯会元）
