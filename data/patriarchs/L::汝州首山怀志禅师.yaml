id: L::汝州首山怀志禅师
name: 汝州首山怀志
school: 临济宗
teacher: 首山念
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0421b12。
sayings:
- text: 僧问。如何是祖师西来意。师曰。三尺杖子破瓦盆
  ref: X80n1565_p0421b12（五灯会元）
- text: 问。如何是佛。师曰。桶底脱
  ref: X80n1565_p0421b12（五灯会元）
- text: 问。从上诸圣有何言句。师曰。如是我闻。曰。不会。师曰。信受奉行
  ref: X80n1565_p0421b12（五灯会元）
