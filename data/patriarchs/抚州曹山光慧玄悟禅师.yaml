id: 抚州曹山光慧玄悟禅师
name: 抚州曹山光慧玄悟
school: 曹洞宗
teacher: 曹山寂
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0496a04。
sayings:
- text: 上堂。良久曰。雪峰和尚为人。如金翅鸟入海取龙相似。僧出
  ref: X80n1565_p0496a04（五灯会元）
- text: 问。未审和尚此间如何。师曰。甚处去来
  ref: X80n1565_p0496a04（五灯会元）
- text: 问。如何是西来的的意。师曰。不礼拜更待何时
  ref: X80n1565_p0496a04（五灯会元）
- text: 问。如何是密传底心。师良久。僧曰。恁么则徒劳侧耳也。师唤。侍者来。烧香著
  ref: X80n1565_p0496a04（五灯会元）
- text: 问。古人云。如红𬬻上一点雪。意旨如何。师曰。惜取眉毛好
  ref: X80n1565_p0496a04（五灯会元）
- text: 问。如何指示。即得不昧去。师曰。不可雪上更加霜。曰。恁么则全因和尚去也。师曰。因个甚么
  ref: X80n1565_p0496a04（五灯会元）
- text: 问。如何是妙明真性。师曰。款款莫磕损
  ref: X80n1565_p0496a04（五灯会元）
- text: 上堂。良久。僧出曰。为众竭力。祸出私门。未审放过不放过。师默然
  ref: X80n1565_p0496a04（五灯会元）
- text: 问。古人道。生也不道。死也不道。意旨如何。师良久。僧礼拜。师曰。会么。曰。不会。师曰。也是厨寒甑足尘
  ref: X80n1565_p0496a04（五灯会元）
- text: 上堂。举拄杖曰。从上皆留此一路。方便接人。有僧出曰。和尚又是从头起也。师曰。谢相委悉
  ref: X80n1565_p0496a04（五灯会元）
- text: 问。机关不转。请师商量。师曰。痖得我口么
  ref: X80n1565_p0496a04（五灯会元）
- text: 问。路逢猛虎时如何。师曰。放憨作么
  ref: X80n1565_p0496a04（五灯会元）
