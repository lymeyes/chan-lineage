id: 天童正觉禅师
name: 天童正觉
alias: 天童觉
school: 法眼宗
teacher: 丹霞淳禅师
status: draft
bio: 隰州李氏子。母梦五台一僧解环与环其右臂。乃孕遂斋戒。及生右臂特起若环状。七岁日诵数千言。祖寂父宗道久参佛陀逊禅师。尝指师谓其父曰。此子道韵胜甚非尘埃中人。苟出家必为法器。十一得度于净明本宗。十四具戒十八游方。诀其祖曰。若不发明大事誓不归矣。及至汝州香山。成枯木一见深所器重。一日闻僧诵莲经。至父母所生眼悉见三千界。瞥然有省。即诣丈室陈所悟。山指台上香合曰。里面是甚么物。师曰。是甚么心行。山曰。汝悟处又作么生。师以手画一圆相呈之。复抛向后。山曰。弄泥团汉有甚么限。师曰错。山曰。别见人始得。师应喏喏。即造丹霞。霞
sayings:
- text: 问。如何是空劫以前自己。师曰。井底虾蟆吞却月。三更不借夜明帘。霞曰。未在更道。师拟议。霞打一拂子曰。又道不借。师言下释然遂作礼。霞曰。何不道取一句。师曰。某甲今日失钱遭罪。霞曰。未暇打得尔且去。霞领大洪师掌笺记。后命首众。得法者已数人。四年过圆通。时真歇初住长芦。遣僧邀至众出迎。见其衣舃穿弊且易之。真歇俾侍者易以新履。师却曰。吾为鞋来邪。众闻心服恳求说法。居第一座六年。出住泗州普照。次补太平圆通能仁。及长芦天童屋庐湫隘。师至创辟一新衲子争集
  ref: T51n2077_p0579a13（续传灯录）
- text: 上堂。黄合帘垂谁传家信。紫罗帐合暗撒真珠。正恁么时视听有所不到。言诠有所不及。如何通得个消息去。梦回夜色依稀晓。笑指家风烂熳春
  ref: T51n2077_p0579a13（续传灯录）
- text: 上堂。心不能缘口不能议。直饶退步荷担。切忌当头触讳。风月寒清古渡头。夜船拨转琉璃地
  ref: T51n2077_p0579a13（续传灯录）
- text: 上堂。空劫有真宗。声前问己躬。赤穷新活计。清白旧家风。的的三乘外。寥寥一印中。却来行异类。万派自朝东
  ref: T51n2077_p0579a13（续传灯录）
- text: 上堂。今日是释迦老子降诞之辰。长芦不解说禅与诸人画个样子。只如在摩耶胎时作么生。以拂子画此⊙相曰。只如以清净水浴金色身时又作么生。复画此󱐜相曰。只如周行七步。目顾四方指天指地。成道说法神通变化。智慧辩才四十九年三百余会。说青道黄指东画西入般涅槃时又作么生。乃画此⊕相。复曰。若是具眼衲僧必也相许。其或未然一一历过始得
  ref: T51n2077_p0579a13（续传灯录）
- text: 上堂僧问。如何是向去底人。师曰。白云投壑尽。青嶂倚空高。曰如何是却来底人。师曰。满头白发离岩谷。半夜穿云入市鄽。曰如何是不来不去底人。师曰。石女唤回三界梦。木人坐断六门机。乃曰。句里明宗则易。宗中辩的则难。良久曰。还会么。冻鸡未报家林晓。隐隐行人过雪山
  ref: T51n2077_p0579a13（续传灯录）
- text: 僧问。一丝不著时如何。师曰。合同船子并头行。曰其中事作么生。师曰。快刀快斧斫不入。问布袋头开时如何。师曰。一任填沟塞壑。问清虚之理毕竟无身时如何。师曰。文彩未痕初。消息难传际。曰一步密移玄路转。通身放下劫壶空。师曰。诞生就父时合体无遗照。曰理既如是事作么生。师曰。历历才回分化事。十方机应又何妨。曰恁么则尘尘皆现本来身去也。师曰。透一切色超一切心。曰如理如事又作么生。师曰。路逢死蛇莫打杀。无底篮子盛将归。曰入市能长啸。归家著短衫。师曰。木人岭上歌。石女溪边舞
  ref: T51n2077_p0579a13（续传灯录）
- text: 上堂。诸禅德。吞尽三世佛底人。为甚么开口不得。照破四天下底人。为甚么合眼不得。许多病痛与尔一时拈却了也。且作么生得十成通畅去。还会么。擘开华岳连天色。放出黄河到海声。师住持以来受无贪而施无厌。岁艰食竭己有及瞻众之余赖全活者数万。日常过午不食。绍兴丁丑九月谒郡僚及檀度。次谒越帅赵公令𬣳与之言别。十月七日还山。翌日辰巳间沐浴更衣端坐告众。顾侍僧索笔作书遗育王大慧禅师请主后事。仍书偈曰。梦幻空花六十七年白鸟烟没秋水连天。掷笔而逝。龛留七日颜貌如生。奉全躯塔于东谷。谥宏智。塔名妙光
  ref: T51n2077_p0579a13（续传灯录）
