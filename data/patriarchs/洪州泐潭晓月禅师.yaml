bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0446b02。
sayings:
- text: 僧问。修多罗教。如标月指。未审指个甚么。师曰。请高著眼。曰。曙色未分人尽望。及乎天晓也寻常。师曰。年衰鬼弄人
