sayings:
- text: 上堂曰。秋光将半。暑气渐消。鸿雁横空。点破碧天似水。猿猱挂树。撼翻玉露如珠。直饶对此明机。未免认龟作鳖。且道应时应节一句作么生道。野色并来三岛月。溪光分破五湖秋
  ref: X80n1565_p0821b08（五灯会元）
