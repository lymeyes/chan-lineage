sayings:
- text: 上堂。若论此事。在天则列万象而齐现。在地则运四时而发生。在人则出没卷舒。六根互用。且道在山僧拄杖头上。又作么生。良久。卓一下曰。高也著。低也著
  ref: X80n1565_p0633a17（五灯会元）
