id: 元康和尚
name: 元康
school: 沩仰宗
teacher: 沩山祐
status: draft
bio: 因访石楼。楼才见便收足坐。师曰。得恁么威仪周足。楼曰。汝适来见个甚么。师曰。无端被人领过。楼曰。须是与么始为真见。师曰。苦哉。赚杀几人来。楼便起身。师曰。见则见矣。动则不动。楼曰。尽力道不出定也。师拊掌三下。后有僧举似南泉。泉曰。天下人断这个汉是非不得。若断得。与他同参。蕲州三角山法遇庵主蕲州三角山法遇庵主因荒乱。魁师入山。执刃而
sayings:
- text: 问。和尚有甚财宝。师曰。僧家之宝。非君所宜。魁曰。是何宝。师震声一喝。魁不悟。以刃加之。襄州王敬初常侍襄州王敬初常侍视事次。米和尚至。公乃举笔示之。米曰。还判得虗空否。公掷笔入宅。更不复出。米致疑。明日凭鼓山供养主入探其意。米亦随至。潜在屏蔽间侦伺。供养主才坐。问曰。昨日米和尚有甚么言句。便不相见。公曰。师子𫜪人。韩獹逐块。米闻此语。即省前谬。遽出朗笑曰。我会也。我会也。公曰。会即不无。你试道看。米曰。请常侍举。公乃竖起一只箸。米曰。这野狐精。公曰。这汉彻也。问僧。一切众生还有佛性也无。曰。有。公指壁上画狗子曰。这个还有也无。僧无对。公自代曰。看𫜪著汝。南岳下五世南岳下五世
