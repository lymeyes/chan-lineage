id: L::南康军云居昌禅师
name: 南康军云居昌
school: 曹洞宗
teacher: 云居膺
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0502b02。
sayings:
- text: 僧问。相逢不相识时如何。师曰。既相逢为甚么不相识
  ref: X80n1565_p0502b02（五灯会元）
- text: 问。红炉猛焰时如何。师曰。里头是甚么
  ref: X80n1565_p0502b02（五灯会元）
- text: 问。不受商量时如何。师曰。来作甚么。曰。来亦不商量。师曰。空来何益
  ref: X80n1565_p0502b02（五灯会元）
- text: 问。方丈前容身时如何。师曰。汝身大小
  ref: X80n1565_p0502b02（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0502b02），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
