id: 谏议彭汝霖居士
name: 谏议彭汝霖
school: 黄龙派
teacher: 圆通旻禅师
status: draft
bio: 手写观音经施圆通。通拈起曰。这个是观音经。那个是谏议经。公曰。此是某亲写。通曰。写底是字。那个是经。公笑曰。却了不得也。通曰。即现宰官身而为说法。公曰。人人有分。通曰。莫谤经好。公曰。如何即是。通举经示之。公拊掌大笑曰。嗄。通曰。又道了不得。公礼拜
