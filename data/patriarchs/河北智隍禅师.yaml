id: 河北智隍禅师
name: 河北智隍
school: —
teacher: 六祖大鉴旁出
status: draft
bio: 始参五祖。虽尝咨决而循乎渐行。乃往河北结庵长坐。积二十余载。不见惰容。后遇䇿禅师激励。遂往参六祖。祖愍其远来。便垂开决。师于言下豁然契悟。前二十年所得心都无影响。其夜。河北檀越士庶。忽闻空中有声曰。隍禅师今日得道也。后回河北。开化四众。南阳慧忠国师南阳慧忠国师者越州诸暨人也。姓冉氏。自受心印。居南阳白崖山党子谷。四十余祀不下山。道行闻于帝里。唐肃宗上元二年。𠡠中使孙朝进赍诏征赴京。待以师礼。初居千福寺西禅院。及代宗临御。复迎止光宅精蓝十有六载。随机说法。时有西天大耳三藏到京。云得他心通。肃宗命国师试验。三藏才见师便礼拜。立于右边。师问曰。汝得他心通那。对曰。不敢。师曰。汝道老僧即今在甚么处。曰。和尚是一国之师。何得却去西川看竞渡。良久。再
sayings:
- text: 问。汝道老僧即今在甚么处。曰。和尚是一国之师。何得却在天津桥上看弄猢狲。师良久。复
  ref: X80n1565_p0065b16（五灯会元）
- text: 问。汝道老僧只今在甚么处。藏罔测。师叱曰。这野狐精。他心通在甚么处。藏无对
  ref: X80n1565_p0065b16（五灯会元）
- text: 僧问仰山曰。大耳三藏第三度为甚么不见国师。山曰。前两度是涉境心。后入自受用三昧。所以不见。又有
  ref: X80n1565_p0065b16（五灯会元）
- text: 僧问玄沙。沙曰。汝道前两度还见么。玄觉云。前两度见。后来为甚么不见。且道利害在甚么处
  ref: X80n1565_p0065b16（五灯会元）
- text: 僧问赵州。大耳三藏第三度不见国师。未审国师在甚么处。州云。在三藏鼻孔上。僧后问玄沙。既在鼻孔上。为甚么不见。沙云。只为太近。一日唤侍者。者应诺。如是三召三应。师曰。将谓吾孤负汝。却是汝孤负吾
  ref: X80n1565_p0065b16（五灯会元）
- text: 僧问玄沙。国师唤侍者。意作么生。沙云。却是侍者会。云居锡云。且道侍者会不会。若道会。国师又道汝孤负吾。若道不会。玄沙又道却是侍者会。且作么生商量。玄觉征问僧。甚么处是侍者会处
  ref: X80n1565_p0065b16（五灯会元）
- text: 僧云。若不会。争解恁么应。玄觉云。汝少会在。又云。若于这里商量得去。便识玄沙
  ref: X80n1565_p0065b16（五灯会元）
- text: 僧问法眼。国师唤侍者意作么生。眼云。且去。别时来。云居锡云。法眼恁么道。为复明国师意。不明国师意
  ref: X80n1565_p0065b16（五灯会元）
- text: 僧问赵州。国师唤侍者。意作么生。赵州云。如人暗里书字。字虽不成。文彩已彰。南泉到参
  ref: X80n1565_p0065b16（五灯会元）
- text: 师问。甚么处来。曰。江西来。师曰。还将得马师真来否。曰。只这是。师曰。背后底𫆏。南泉便休长庆棱云。大似不知。保福展云。几不到和尚此间。云居锡云。此二尊宿。尽扶背后。只如南泉休去。为当扶面前。扶背后。麻谷到参。绕禅床三匝。振锡而立。师曰。汝既如是。吾亦如是。谷又振锡。师叱曰。这野狐精出去
  ref: X80n1565_p0065b16（五灯会元）
- text: 上堂。禅宗学者。应遵佛语。一乘了义。契自心源。不了义者。互不相许。如师子身中虫。夫为人师。若涉名利。别开异端。则自他何益。如世大匠。斤斧不伤其手。香象所负。非驴能堪
  ref: X80n1565_p0065b16（五灯会元）
- text: 僧问。若为得成佛去。师曰。佛与众生。一时放却。当处解脱。曰。作么生得相应去。师曰。善恶不思。自见佛性。曰。若为得证法身。师曰。越毗卢之境界。曰。清净法身作么生得。师曰。不著佛求耳。曰。阿那个是佛。师曰。即心是佛。曰。心有烦恼否。师曰。烦恼性自离。曰。岂不断邪。师曰。断烦恼者。即名二乘。烦恼不生。名大涅槃。曰。坐禅看静。此复若为。师曰。不垢不净。宁用起心而看净相
  ref: X80n1565_p0065b16（五灯会元）
- text: 问。禅师见十方虗空。是法身否。师曰。以想心取之。是颠倒见
  ref: X80n1565_p0065b16（五灯会元）
- text: 问。即心是佛。可更修万行否。师曰。诸圣皆具二严。岂拨无因果邪。又曰。我今答汝。穷劫不尽。言多去道远矣。所以道。说法有所得。斯则野干鸣。说法无所得。是名师子吼
  ref: X80n1565_p0065b16（五灯会元）
- text: 上堂。青萝夤缘。直上寒松之顶。白云淡泞。出没太虗之中。万法本闲而人自闹。师问僧。近离甚处。曰。南方。师曰。南方知识以何法示人。曰。南方知识。只道一朝风火散后。如蛇退皮。如龙换骨。本尔真性。宛然无坏。师曰。苦哉。苦哉。南方知识说法。半生半灭。曰。南方知识即如是。未审和尚此间说何法。师曰。我此间身心一如。身外无余。曰。和尚何得将泡幻之身同于法体。师曰。你为甚么入于邪道。曰。甚么处是某甲入于邪道处。师曰。不见教中道。若以色见我。以音声求我。是人行邪道。不能见如来。南阳张𣸣行者
  ref: X80n1565_p0065b16（五灯会元）
- text: 问。承和尚说无情说法。某甲未体其事。乞和尚垂示。师曰。汝若问无情说法。解他无情。方得闻我说法。汝但闻取无情说法去。𣸣曰。只约如今有情方便之中。如何是无情因缘。师曰。如今一切动用之中。但凡圣两流都无少分起灭便是出。识不属有无。炽然见觉。只闻无其情识系执。所以六祖云。六根对境。分别非识。有僧到参礼
  ref: X80n1565_p0065b16（五灯会元）
- text: 师问。蕴何事业。曰。讲金刚经。师曰。最初两字是甚么。曰。如是。师曰。是甚么。僧无对。有人
  ref: X80n1565_p0065b16（五灯会元）
- text: 问。如何是解脱。师曰。诸法不相到。当处解脱。曰。恁么即断去也。师曰。向汝道诸法不相到。断甚么。师见僧来。以手作圆相。相中书日字。僧无对。师问本净禅师。汝已后见奇特言语如何净。曰。无一念心爱。师曰。是汝屋里事。肃宗
  ref: X80n1565_p0065b16（五灯会元）
- text: 问。师在曹谿得何法。师曰。陛下还见空中一片云么。帝曰。见。师曰。钉钉著。悬挂著。帝又
  ref: X80n1565_p0065b16（五灯会元）
- text: 问。如何是十身调御。师乃起立曰。会么。帝曰。不会。师曰。与老僧过净瓶来。帝又曰。如何是无诤三昧。师曰。檀越蹋毗卢顶上行。帝曰。此意如何。师曰。莫认自己清净法身。帝又
  ref: X80n1565_p0065b16（五灯会元）
- text: 问。师都不视之。曰。朕是大唐天子。师何以殊不顾视。师曰。还见虗空么。帝曰。见。师曰。他还眨目视陛下否。鱼军容
  ref: X80n1565_p0065b16（五灯会元）
- text: 问。师住白崖山。十二时中如何修道。师唤童子来。摩顶曰。惺惺直言惺惺。历历直言历历。已后莫受人谩。师与紫璘供奉论议。师升座。奉曰。请师立义。某甲破。师曰。立义竟。奉曰。是甚么义。师曰。果然不见。非公境界。便下座。一日。师问紫璘供奉。佛是甚么义。曰。是觉义。师曰。佛曾迷否。曰。不曾迷。师曰。用觉作么。奉无对。奉问如何是实相。师曰。把将虗底来。曰。虗底不可得。师曰。虗底尚不可得。问实相作么
  ref: X80n1565_p0065b16（五灯会元）
- text: 僧问。如何是佛法大意。师曰。文殊堂里万菩萨。曰。学人不会。师曰。大悲千手眼。师以化缘将毕。涅槃时至。乃辞代宗。代宗曰。师灭度后。弟子将何所记。师曰。告檀越造取一所无缝塔。帝曰。就师请取塔样。师良久。曰。会么。帝曰。不会。师曰。贫道去后。有侍者应真却知此事。乞诏问之。大历十年十二月十九日。右胁长往。塔于党子谷。谥大证禅师。代宗后诏应真问前语。真良久。曰。圣上会么。帝曰。不会。真述偈曰。湘之南。潭之北。中有黄金充一国。无影树下合同船。瑠璃殿上无知识
  ref: X80n1565_p0065b16（五灯会元）
