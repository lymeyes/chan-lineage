id: 安吉州何山然首座
name: 安吉州何山然首座
school: 杨岐派
teacher: 道场辩
status: draft
bio: 姑苏人。侍正堂之久。入室次。堂
sayings:
- text: 问。猫儿为甚么偏爱捉老鼠。曰。物见主。眼卓竖。堂欣然。因命分座
  ref: X80n1565_p0821a17（五灯会元）
