id: 福州龟山正元禅师
name: 福州龟山正元
school: 南岳系
teacher: 五泄默禅师
status: draft
bio: 宣州蔡氏子。尝述偈示徒。一曰。沧溟几度变桑田。唯有虗空独湛然。已到岸人休恋筏。未曾度者要须船。二曰。寻师认得本心源。两岸俱玄一不全。是佛不须更觅佛。祇因如此便忘缘。咸通十年终于本山。谥性空大师
