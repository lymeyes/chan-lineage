id: 韶州灵树如敏禅师
name: 韶州灵树如敏
school: 南岳系
teacher: 长庆大安禅师
status: draft
bio: 闽人也。广主刘氏奕世钦重。署知圣大师
sayings:
- text: 僧问。佛法至理如何。师展手而已
  ref: X80n1565_p0153a11（五灯会元）
- text: 问。如何是和尚家风。师曰。千年田．八百主。曰。如何是千年田．八百主。师曰。郎当屋舍没人修
  ref: X80n1565_p0153a11（五灯会元）
- text: 问。如何是西来意。师曰。童子莫傜儿。曰。乞师指示。师曰。汝从虔州来
  ref: X80n1565_p0153a11（五灯会元）
- text: 问。是甚么得恁么难会。师曰。火官头上风车子。有尼送瓷钵与师。师拓起问曰。这个出在甚么。曰。出在定州法灯别云。不远此间。师乃扑破。尼无对保福代云。欺敌者亡
  ref: X80n1565_p0153a11（五灯会元）
- text: 问。和尚年多少。师曰。今日生。来朝死。又
  ref: X80n1565_p0153a11（五灯会元）
- text: 问。和尚生缘甚么处。师曰。日出东。月落西。师四十余年化被岭表。颇有异迹。广主将兴兵。躬入院请师决臧𠘶。师已先知。怡然坐化。主怒知事曰。和尚何时得疾。对曰。不曾有疾。适封一函子。令呈大王。主开函得一帖子云。人天眼目。堂中上座。主悟师旨。遂寝兵。乃召第一座开堂说法即云门也。龛塔葬仪。广主具办。谥灵树禅师。真身塔焉
  ref: X80n1565_p0153a11（五灯会元）
