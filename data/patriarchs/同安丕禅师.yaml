id: 同安丕禅师
name: 同安丕
school: 曹洞宗
teacher: 云居膺
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0498a15。
sayings:
- text: 僧问。如何是无缝塔。师曰。吽。吽。曰。如何是塔中人。师曰。今日大有人从建昌来
  ref: X80n1565_p0498a15（五灯会元）
- text: 问。一见便休去时如何。师曰。是也。更来这里作么
  ref: X80n1565_p0498a15（五灯会元）
- text: 问。如何是点额鱼。师曰。不透波澜。曰。惭耻时如何。师曰。终不仰面。曰。恁么则不变其身也。师曰。是也。青云事作么生
  ref: X80n1565_p0498a15（五灯会元）
- text: 问。如何是和尚家风。师曰。金鸡抱子归霄汉。玉兔怀胎入紫微。曰。忽遇客来。将何祇待。师曰。金果朝来猿摘去。玉花晚后凤衔归
  ref: X80n1565_p0498a15（五灯会元）
- text: 问。无情还解说法也无。师曰。玉犬夜行。不知天晓
  ref: X80n1565_p0498a15（五灯会元）
- text: 问。路逢达道人。不将语默对。未审将甚么对。师曰。要踢要拳
  ref: X80n1565_p0498a15（五灯会元）
- text: 问。才有言诠。尽落今时。不落言诠。请师直说。师曰。木人解语非干舌。石女抛梭岂乱丝
  ref: X80n1565_p0498a15（五灯会元）
- text: 问。依经解义。三世佛冤。离经一字。即同魔说。此理如何。师曰。孤峰迥秀。不挂烟萝。片月行空。白云自在。新到参
  ref: X80n1565_p0498a15（五灯会元）
- text: 师问。甚处来。曰。湖南。师曰。还知同安这里风云体道。花槛璇玑么。曰。知。师曰。非公境界。僧便喝。师曰。短贩樵人。徒夸书剑。僧拟进语。师曰。剑甲未施。贼身已露
  ref: X80n1565_p0498a15（五灯会元）
- text: 问。佛未出世时如何。师曰。藕丝系大象。曰。出世后如何。师曰。铁锁锁石牛
  ref: X80n1565_p0498a15（五灯会元）
- text: 问。不伤王道如何。师曰。吃粥吃饭。曰。莫便是不伤王道也无。师曰。迁流左降
  ref: X80n1565_p0498a15（五灯会元）
- text: 问。玉印开时。何人受信。师曰。不是恁么人。曰。亲宫事如何。师曰。道甚么
  ref: X80n1565_p0498a15（五灯会元）
- text: 问。如何是毗卢师。师曰。阇黎在甚么处出家
  ref: X80n1565_p0498a15（五灯会元）
- text: 问。如何是触目菩提。师曰。面前佛殿
  ref: X80n1565_p0498a15（五灯会元）
- text: 问。片玉无瑕。请师不触。师曰。落汝后
  ref: X80n1565_p0498a15（五灯会元）
- text: 问。玉印开时。何人受信。师曰。不是小小
  ref: X80n1565_p0498a15（五灯会元）
- text: 问。迷头认影如何止。师曰。告阿谁。曰。如何即是。师曰。从人觅。即转远也。曰。不从人觅时如何。师曰。头在甚么处
  ref: X80n1565_p0498a15（五灯会元）
- text: 问。如何是同安一只箭。师曰。脑后看。曰。脑后事如何。师曰。过也
  ref: X80n1565_p0498a15（五灯会元）
- text: 问。亡僧衣众人唱。祖师衣甚么人唱。师曰。打
  ref: X80n1565_p0498a15（五灯会元）
- text: 问。将来不相似。不将来时如何。师曰。甚么处著
  ref: X80n1565_p0498a15（五灯会元）
- text: 问。未有这个时。作么生行履。师曰。寻常又作么生。曰。恁么则不改旧时人也。师曰。作何行履
  ref: X80n1565_p0498a15（五灯会元）
- text: 问。如何是异类中人。师曰。露地藏白牛。溪山笼日月。师看经次。见僧来参。遂以衣袖盖却头。僧近前作吊慰势。师放下衣袖。提起经曰。会么。僧却以衣袖盖头。师曰。苍天。苍天
  ref: X80n1565_p0498a15（五灯会元）
