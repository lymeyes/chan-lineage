id: L::参政钱端礼居士
name: 参政钱端礼
school: 杨岐派
teacher: 护国元
status: draft
bio: 字处和。号松窗。从此庵发明己事。后于宗门旨趣一一极之。淳熙丙申冬。简堂归住平田。遂与往来。丁酉秋微恙。修书召堂及国清瑞岩主僧。有诀别之语。堂与二禅诣榻次。公起趺坐。言笑移时。即书曰。浮世虗幻。本无去来。四大五蕴。必归终尽。虽佛祖具大威德力。亦不能免。这一著子。天下老和尚．一切善知识还有跳得过者无。盖为地水火风。因缘和合。暂时凑泊。不可错认为己有。大丈夫磊磊落落。当用处把定。立处皆真。顺风使帆。上下水皆可。因斋庆赞。去留自在。此是上来诸圣。开大解脱。一路涅槃门。本来清净空寂境界。无为之大道也。今吾如是。岂不快哉。尘劳外缘。一时扫尽。荷诸山垂顾。咸愿证明。伏惟珍重。置笔顾简堂曰。某坐去好。卧去好。堂曰。相公去便了。理会甚坐与卧耶。公笑曰。法兄当为祖道自爱。遂敛目而逝
