bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0543b17。
sayings:
- text: 上堂。空劫中事。自肯承当。日用全彰。有何渗漏。正好归家稳坐。任他雪覆青山。不留元字挂怀。谁顾波翻水面。且道正不立玄．偏不附物一句。如何举似。机丝不挂梭头事。文彩纵横意自殊
  ref: X80n1565_p0543b17（五灯会元）
