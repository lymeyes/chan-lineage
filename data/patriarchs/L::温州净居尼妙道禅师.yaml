id: L::温州净居尼妙道禅师
name: 温州净居尼妙道
school: 杨岐派
teacher: 径山杲
status: draft
bio: 延平尚书黄公裳之女。开堂日。乃曰。问话且止。直饶有倾湫之辩．倒岳之机。衲僧门下一点用不著。且佛未出世时。一事全无。我祖西来。便有许多建立。列刹相望。星分派列。以至今日。累及儿孙。遂使山僧于人天大众前无风起浪。向第二义门通个消息。语默该不尽底。弥亘大方。言诠说不及处。遍周沙界。通身是眼。觌面当机。电卷星驰。如何凑泊。有时一喝。生杀全威。有时一喝。佛祖莫辨。有时一喝。八面受敌。有时一喝。自救不了。且道那一喝是生杀全威。那一喝是佛祖莫辨。那一喝是八面受敌。那一喝是自救不了。若向这里荐得。堪报不报之恩。脱或未然。山僧无梦说梦去也。拈起拂子曰。还见么。若见。被见刺所障。击禅床曰。还闻么。若闻。被声尘所惑。直饶离见绝闻。正是二乘小果。跳出一步。盖色骑声。全放全收。主宾互换。所以道。欲知佛性义。当观时节因缘。敢问诸人。即今是甚么时节。荡荡仁风扶圣化。熙熙和气助升平。掷拂子。下座。尼
sayings:
- text: 问。如何是佛。师曰。非佛。曰。如何是佛法大意。师曰。骨底骨董
  ref: X80n1565_p0801a10（五灯会元）
- text: 问。言无展事。语不投机时如何。师曰。未屙已前。堕坑落壍
  ref: X80n1565_p0801a10（五灯会元）
