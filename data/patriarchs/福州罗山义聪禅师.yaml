id: 福州罗山义聪禅师
name: 福州罗山义聪
school: —
teacher: 安国瑫禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0299a16。
sayings:
- text: 上堂。僧问。如何是出窟师子。师曰。甚么处不震裂。曰。作何音响。师曰。聋者不闻
  ref: X80n1565_p0299a16（五灯会元）
- text: 问。手指天地。唯我独尊。为甚么却被傍观者责。师曰。谓言胡须赤。曰。只如傍观者。有甚么长处。师曰。路见不平。所以按剑。师乃曰。若有分付处。罗山即不具眼。若无分付处。即劳而无功。所以维摩昔日对文殊。且问如今会也无。久立。珍重
  ref: X80n1565_p0299a16（五灯会元）
