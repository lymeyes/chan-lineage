bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0146b03。
sayings:
- text: 上堂。言不落句。佛祖徒施。玄韵不坠。谁人知得
  ref: X80n1565_p0146b03（五灯会元）
- text: 僧问。如何识得自己佛。师曰。一叶明时消不尽。松风韵罢怨无人。曰。如何是自己佛。师曰。草前骏马实难穷。妙尽还须畜生行。有人
  ref: X80n1565_p0146b03（五灯会元）
- text: 问。师年多少。师曰。五六四三不得类。岂同一二实难穷。师有偈曰。猛炽𦦨中人有路。旋风顶上屹然栖。镇常历劫谁差互。杲日无言运照齐。南岳下四世南岳下四世
  ref: X80n1565_p0146b03（五灯会元）
