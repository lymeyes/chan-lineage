id: L::鼓山智严了觉禅师
name: 鼓山智严了觉
school: —
teacher: 鼓山晏
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《景德传灯录》T51n2076_p0378c11。
sayings:
- text: 上堂曰。多言复多语。由来返相误。珍重
  ref: T51n2076_p0378c11（景德传灯录）
- text: 僧问。石门之句即不敢
  ref: T51n2076_p0378c11（景德传灯录）
- text: 问。请师方便。师曰。问取露柱。问国王出世三边静。法王出世有何恩。师曰。还会么。僧曰。幸遇明朝辄伸呈献。师曰。吐却著。僧曰。若不礼拜几成无孔铁锤。师曰。何异无孔铁锤
  ref: T51n2076_p0378c11（景德传灯录）
