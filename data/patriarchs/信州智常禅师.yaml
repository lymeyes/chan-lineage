id: 信州智常禅师
name: 信州智常
school: —
teacher: 六祖大鉴旁出
status: draft
bio: 本州贵谿人也。髫年出家。志求见性。一日参六祖。祖
sayings:
- text: 问。汝从何来。欲求何事。师曰。学人近礼大通和尚。蒙示见性成佛之义。未决狐疑。至吉州遇人指迷。令投和尚。伏愿垂慈摄受。祖曰。彼有何言句。汝试举看。吾与汝证明。师曰。初到彼三月。未蒙开示。以为法切。故于中夜独入方丈。礼拜哀请。大通乃曰。汝见虗空否。对曰。见。彼曰。汝见虗空有相貌否。对曰。虗空无形。有何相貌。彼曰。汝之本性犹如虗空。返观自性。了无一物可见。是名正见。无一物可知。是名真知。无有青黄长短。但见本源清净。觉体圆明。即名见性成佛。亦名极乐世界。亦名如来知见。学人虽闻此说。犹未决了。乞和尚示诲。令无凝滞。祖曰。彼师所说。犹存见知。故令汝未了。吾今示汝一偈曰。不见一法存无见。大似浮云遮日面。不知一法守空知。还如太虗生闪电。此之知见瞥然兴。错认何曾解方便。汝当一念自知非。自己灵光常显见。师闻偈已。心意豁然。乃述一偈曰。无端起知解。著相求菩提。情存一念悟。宁越昔时迷。自性觉源体。随照枉迁流。不入祖师室。茫然趣两头
