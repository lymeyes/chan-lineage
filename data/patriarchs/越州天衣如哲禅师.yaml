id: 越州天衣如哲禅师
name: 越州天衣如哲
school: —
teacher: 长芦崇信禅师
status: draft
bio: 族里未详。自退席寓平江之万寿。饮啖无择。人多侮之。有以瑞岩唤主人公话问者。师答以偈曰。瑞岩长唤主人公。突出须弥最上峰。大地掀翻无觅处。笙歌一曲画楼中。一日曰。吾行矣。令拂拭所乘笋舆。乃书偈告众曰。道在用处。用在死处。时人祇管贪欢乐。不肯学无为。叙平昔参
sayings:
- text: 问。勉众进修已。忽竖起拳曰。诸人且道。这个落在甚么处。众无对。师挥案一下曰。一齐分付与秋风。遂入舆。端坐而逝
