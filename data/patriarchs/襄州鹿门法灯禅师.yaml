id: 襄州鹿门法灯禅师
name: 襄州鹿门法灯
school: 曹洞宗
teacher: 芙蓉道楷禅师
status: draft
bio: 成都刘氏子。依大慈宝范为僧。俾听华严。得其要。弃谒芙蓉。蓉问曰。如何是空劫已前自己。师于言下。心迹泯然。从容进曰。灵然一句超群象。迥出三乘不假修。蓉抚而印之。开法鹿门
sayings:
- text: 僧问。虗玄不犯。宝鉴光寒时如何。师曰。掘地深埋
  ref: X80n1565_p0537b14（五灯会元）
- text: 问。如何是逍遥物外底人。师曰。遍身红烂。不可扶持
  ref: X80n1565_p0537b14（五灯会元）
