id: 提刑郭祥正
name: 提刑郭祥正
school: 杨岐派
teacher: 白云端
status: draft
bio: 字功甫，号净空，喜泉石而不羡纷华。因谒白云守端禅师，值端说法，以上大人一篇
sayings:
- text: 示众，公切疑。后闻小儿诵之有省，书报白云，云答偈曰：藏身不用缩头，敛迹何须收脚？金乌半夜辽天，玉兔赶他不著。元祐中，往衢之南禅谒泉万卷，请升堂，公趋前拈香曰：海边枯木入手成香，𦶟向炉中横穿香积。如来鼻孔作此大事，须是对众白过始得。云居老人有个无缝布衫分付南禅，禅师著得不长不短，进前则诸佛让位，退步则海水澄波。今日颦伸，六种震动。遂召曰：大众还委悉么？有意气时添意气，不风流处也风流。泉曰：递相钝置。公曰：因谁致得？崇宁初，到五祖拜演禅师，命演举扬，演就座，公复趋前拈香曰：此一辨香𦶟向炉中，供养我堂头法兄禅师，伏愿于方广座上擘开面门，放出先师形相，与他诸人描邈。何以如此？白云岩畔旧相逢，往日今朝事不同。夜静水寒鱼不食，一炉香散白莲风。演拍禅床一下，僧出问云云
