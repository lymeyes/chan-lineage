id: 云居法如禅师
name: 云居法如
alias: 云居如
school: 杨岐派
teacher: 龙门清远禅师
status: draft
bio: 丹丘胡氏子。依护国瑞禅师祝发登具。遍参浙右诸宗匠。晚至龙门以平日所证白佛眼。眼曰此皆学解非究竟事。欲了生死当求妙悟。师骇然谛信。一日命主香积。以道业未办固辞。眼勉曰。姑就职。其中大有人为汝说法。未几晨兴开厨门望见圣僧契所未证即白佛眼。眼曰这里还见圣僧么。师诣前问讯叉手而立。眼曰。向汝道。大有人为汝说法。住后
sayings:
- text: 上堂。一法若有毘卢堕在凡夫。万法若无普贤失其境界。向这里有无俱遣得失两亡。直得十方诸佛不见。诸人且道。十二时中向甚么处安身立命。披蓑侧立千峰外。引水浇蔬五老前
  ref: T51n2077_p0669c23（续传灯录）
- text: 上堂。乾坤之内宇宙之间。中有一宝秘在形山。云居又且不然。乾坤之内宇宙之间。中有一宝。掷下拄杖云。大众也须识取
  ref: T51n2077_p0669c23（续传灯录）
