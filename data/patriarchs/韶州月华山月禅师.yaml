id: 韶州月华山月禅师
name: 韶州月华山月
school: —
teacher: 白云祥禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0577b18。
sayings:
- text: 问。业个甚么。曰。念孔雀经。云曰。好个人家男女。随鸟雀后走。师闻语惊异。遂依附。久之乃契旨。寻住月华
  ref: X80n1565_p0577b18（五灯会元）
- text: 僧问。如何是月华家风。师曰。若问家风。即答家风。曰。学人问家风。师曰。金铜罗汉
  ref: X80n1565_p0577b18（五灯会元）
- text: 上堂。举一句语。遍大千界。还有人会得这个时节么。试出来道看。要知亲切。良久曰。不出头。是好手。久立。珍重
  ref: X80n1565_p0577b18（五灯会元）
- text: 僧问。如何是祖师西来意。师曰。梁王不识。曰。意旨如何。师曰。只履西归。师入京
  ref: X80n1565_p0577b18（五灯会元）
- text: 上堂。有一官人出。礼拜起。低头良久。师曰。掣电之机。徒劳伫思。有一老宿上法堂。东西顾视曰。好个法堂。要且无主。师闻。乃召曰。且坐吃茶。宿问曰。玄中最的。犹是龟毛兔角。不向二谛中修。如何密用。师曰。测。宿曰。恁么则拗折拄杖。割断草鞋去也。师曰。细而详之
  ref: X80n1565_p0577b18（五灯会元）
