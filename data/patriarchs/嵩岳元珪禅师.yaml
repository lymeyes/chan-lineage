id: 嵩岳元珪禅师
name: 嵩岳元珪
school: —
teacher: 嵩岳安国师
status: draft
bio: 伊阙人也。姓李氏。幼岁出家。唐永淳二年。受具戒。隶闲居寺。习毗尼无懈。后谒安国师。顿悟玄旨。遂卜庐于岳之庞坞。一日。有异人峩冠袴褶徒颊切而至。从者极多。轻步舒徐。称谒大师。师睹其形貌。奇伟非常。乃谕之曰。善来仁者胡为而至。彼曰。师宁识我邪。师曰。吾观佛与众生等。吾一目之。岂分别邪。彼曰。我此岳神也。能生死于人。师安得一目我哉。师曰。吾本不生。汝焉能死。吾视身与空等。视吾与汝等。汝能坏空与汝乎。苟能坏空及汝。吾则不生不灭也。汝尚不能如是。又焉能生死吾邪。神稽首曰。我亦聦明正直于余神。讵知师有广大之智辩乎。愿授以正戒。令我度世。师曰。汝既乞戒。即既戒也。所以者何。戒外无戒。又何戒哉。神曰。此理也我闻茫昧。止求师戒我身为门弟子。师即为张座。秉炉正几曰。付汝五戒。若能奉持。即应曰能。不能。即曰否。曰。谨受教。师曰。汝能不淫乎。曰。我亦娶也。师曰。非谓此也。谓无罗欲也。曰。能。师曰。汝能不盗乎。曰。何乏我也。焉有盗取哉。师曰。非谓此也。谓飨而福淫。不供而祸善也。曰。能。师曰。汝能不杀乎。曰。实司其柄。焉曰不杀。师曰。非谓此也。谓有滥误疑混也。曰。能。师曰。汝能不妄乎。曰。我正直。焉有妄乎。师曰。非谓此也。谓先后不合天心也。曰。能。师曰。汝不遭酒败乎。曰。能。师曰。如上是为佛戒也。又言。以有心奉持而无心拘执。以有心为物而无心想身。能如是。则先天地生不为精。后天地死不为老。终日变化而不为动。毕尽寂默而不为休。信此则虽娶非妻也。虽飨非取也。虽柄非权也。虽作非故也。虽醉非惽也。若能无心于万物。则罗欲不为淫。福淫祸善不为盗。滥误疑混不为杀。先后违天不为妄。惽荒颠倒不为醉。是谓无心也。无心则无戒。无戒则无心。无佛无众生。无汝及无我。孰为戒哉。神曰。我神通亚佛。师曰。汝神通十句．五能五不能。佛则十句．七能三不能。神悚然避席。跪启曰。可得闻乎。师曰。汝能戾上帝．东天行而西七曜乎。曰。不能。师曰。汝能……（原文更长，见 cbeta 锚点）
