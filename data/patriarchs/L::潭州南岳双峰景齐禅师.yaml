name: 潭州南岳双峰景齐
school: 黄龙派
teacher: 黄龙心
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0671a14。
sayings:
- text: 上堂。拈拄杖曰。横拈倒用。诸方虎步龙行。打狗撑门。双峰掉在无事甲里。因风吹火。别是一家。以拄杖靠肩。顾视大众曰。唤作无事得么。良久曰。刀尺高悬著眼看。志公不是闲和尚。卓拄杖一下
  ref: X80n1565_p0671a14（五灯会元）
