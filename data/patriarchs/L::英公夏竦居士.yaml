id: L::英公夏竦居士
name: 英公夏竦
school: 临济宗
teacher: 谷隐聪
status: draft
bio: 字子乔。自契机于谷隐。日与老衲游。偶上蓝溥禅师至。公
sayings:
- text: 问。百骸溃散时。那个是长老自家底。蓝曰。前月二十离蕲阳。公休去。蓝却
  ref: X80n1565_p0438a05（五灯会元）
- text: 问。百骸溃散时。那个是相公自家底。公便喝。蓝曰。喝则不无。毕竟那个是相公自家底。公对以偈曰。休认风前第一机。太虗何处著思惟。山僧若要通消息。万里无云月上时。蓝曰。也是弄精魂
  ref: X80n1565_p0438a05（五灯会元）
