bio: 隆兴府祐圣法居禅师，潮阳郑氏子。晚见黄龙慧南，深蒙印可，为黄龙派二代传人。
sayings:
- text: 上堂：「此事如医家验病方，且杂毒满腹，未易攻治，必瞑眩之药，而后可瘳。就令徇意投之，适足狂惑，增其沉痼。求其已病，不亦左乎？法堂前草深，于心无愧。」
  ref: 五灯会元·卷十七·黄龙慧南法嗣
