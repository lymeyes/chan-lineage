bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0268b18。
sayings:
- text: 僧问。如何是佛性。师曰。汝无佛性。曰。蠢动含灵。皆有佛性。学人为何却无。师曰。为汝向外求
  ref: X80n1565_p0268b18（五灯会元）
- text: 问。如何是玄玄之珠。师曰。这个不是。曰。如何是玄玄珠。师曰。失却也
  ref: X80n1565_p0268b18（五灯会元）
