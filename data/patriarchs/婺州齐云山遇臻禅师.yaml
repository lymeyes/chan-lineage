id: 婺州齐云山遇臻禅师
name: 婺州齐云山遇臻
school: 法眼宗
teacher: 天台德韶国师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0374a13。
sayings:
- text: 僧问。如何是无缝塔。师曰。五六尺。其僧礼拜。师曰。塔倒也
  ref: X80n1565_p0374a13（五灯会元）
- text: 问。圆明了知。为甚么不因心念。师曰。圆明了知。曰。何异心念。师曰。汝唤甚么作心念。秋夕闲坐。偶成颂曰。秋庭肃肃风𮨱𮨱。寒星列空蟾魄高。搘󰬇静坐神不劳。鸟窠无端吹布毛
  ref: X80n1565_p0374a13（五灯会元）
