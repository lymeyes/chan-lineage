id: 郢州林谿竟脱禅师
name: 郢州林谿竟脱
school: 云门宗
teacher: 云门文偃禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0570b11。
sayings:
- text: 僧问。如何是法身。师曰。四海五湖宾。曰。如何是透法身句。师曰。明眼人笑汝
  ref: X80n1565_p0570b11（五灯会元）
- text: 问。如何是本来人。师曰。风吹满面尘
  ref: X80n1565_p0570b11（五灯会元）
- text: 问。牛头未见四祖时如何。师曰。富贵多宾客。曰。见后如何。师曰。贫穷绝往还
  ref: X80n1565_p0570b11（五灯会元）
- text: 问。如何是佛。师曰。十字路头。曰。如何是法。师曰。三家村里。曰。佛之与法。是一是二。师曰。露柱渡三江。犹怀感恨长
  ref: X80n1565_p0570b11（五灯会元）
- text: 问。如何是无缝塔。师曰。复州城。曰。如何是塔中人。师曰。龙兴寺
  ref: X80n1565_p0570b11（五灯会元）
