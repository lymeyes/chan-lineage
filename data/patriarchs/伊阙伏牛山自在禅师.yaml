id: 伊阙伏牛山自在禅师
name: 伊阙伏牛山自在
school: 南岳系
teacher: 马祖道一禅师
status: draft
bio: 吴兴李氏子。初依国一禅师。受具后参马祖发明心地。祖令送书与忠国师。国师曰。马大师以何法示徒。曰。即心即佛。国师曰。是甚么语话。良久又问曰。此外更有何言教。师曰。非心非佛。或曰不是心。不是佛。不是物。国师曰。犹较些子。师曰。马大师即恁么。未审和尚此间如何。国师曰。三点如流水。曲似刈禾镰。师后居伏牛山
sayings:
- text: 上堂曰。即心即佛。是无病求药句。非心非佛。是药病对治句
  ref: X80n1565_p0109b04（五灯会元）
- text: 僧问。如何是脱洒底句。师曰。伏牛山下古今传。示灭于随州开元寺
  ref: X80n1565_p0109b04（五灯会元）
