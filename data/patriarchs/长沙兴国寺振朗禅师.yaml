bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0170b16。
sayings:
- text: 问。如何是祖师西来意。头曰。问取露柱。曰。振朗不会。头曰。我更不会。师俄省悟。住后。有僧来参。师召上座。僧应诺。师曰。孤负去也。曰。师何不鉴。师乃拭目而见之。僧无语时谓小朗
  ref: X80n1565_p0170b16（五灯会元）
