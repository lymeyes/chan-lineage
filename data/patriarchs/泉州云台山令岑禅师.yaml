id: 泉州云台山令岑禅师
name: 泉州云台山令岑
school: 法眼宗
teacher: 崇寿稠禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0380a13。
sayings:
- text: 僧问。如何是云台境。师曰。前山后山。曰。如何是境中人。师曰。瞌睡汉。杭州资国圆进山主杭州资国圆进山主
  ref: X80n1565_p0380a13（五灯会元）
- text: 僧问。丹霞烧木佛。意旨如何。师曰。招因带果
  ref: X80n1565_p0380a13（五灯会元）
- text: 问。庭前柏树子。意旨如何。师曰。碧眼胡僧笑点头
  ref: X80n1565_p0380a13（五灯会元）
- text: 问。古人道。东家作驴。西家作马。意旨如何。师曰。相识满天下
  ref: X80n1565_p0380a13（五灯会元）
