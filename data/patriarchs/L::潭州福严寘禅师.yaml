id: L::潭州福严寘禅师
name: 潭州福严寘
school: —
teacher: 大沩喆
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《嘉泰普灯录》X79n1559_p0139b11。
sayings:
- text: 上堂曰：禅严山上云，舒卷任朝昏。忽尔落平地，客来难讨门
  ref: X79n1559_p0139b11（嘉泰普灯录）
- text: 上堂，举：赵州问僧：近离甚么处？云：雪峰。曰：雪峰近日有何言句？云：和尚尝
  ref: X79n1559_p0139b11（嘉泰普灯录）
- text: 示众道：尽大地是沙门一只眼。汝等诸人向甚么处屙？曰：汝回去么？云：便行。曰：我寄汝一锹子去。师曰：如今诸方商量，赵州寄锹子与雪峰，便是刬却那屙底。我当时若问这僧：汝回去么？云：便行。只向他道：我寄你一副钵孟去。你又如何商量？
  ref: X79n1559_p0139b11（嘉泰普灯录）
