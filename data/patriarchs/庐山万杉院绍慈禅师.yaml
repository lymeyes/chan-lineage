id: 庐山万杉院绍慈禅师
name: 庐山万杉院绍慈
school: 黄龙派
teacher: 东林总
status: draft
bio: 桂州赵氏子。参照觉。问曰。世尊付金襕外。别传何物。觉举拂子。师曰。毕竟作么生。觉以拂子蓦口打。师拟开口。觉又打。师于是有省。遂夺拂子。便礼拜。觉曰。汝见何道理。便礼拜。师曰。拂子属某甲了也。觉曰。三十年老将。今日被小卒折倒。自此玄风大振。推为东林上首
sayings:
- text: 上堂。先行不到。若须弥立乎巨川。末后太过。犹猛士发乎狂矢。或高或下。未有准绳。以是还非。遭人点检。且道如何得相应去。良久曰。红炉焰里重添火。炟赫金刚眼自开。咄
  ref: X80n1565_p0674b07（五灯会元）
- text: 上堂。我祖别行最上机。纵横生杀绝猜疑。虽然塞断群狐路。返掷须还师子儿。众中还有金毛炟赫．牙爪生狞者么。试出哮吼一声看。良久曰。直饶有。也不免玉溪寨主撩钩搭索。参
  ref: X80n1565_p0674b07（五灯会元）
