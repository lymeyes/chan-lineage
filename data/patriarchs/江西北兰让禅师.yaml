id: 江西北兰让禅师
name: 江西北兰让
school: 南岳系
teacher: 马祖道一禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0107a05。
sayings:
- text: 问。承闻师兄画得先师真。暂请瞻礼。师以两手擘胸开示之。亮便礼拜。师曰。莫礼。莫礼。亮曰。师兄错也。某甲不礼师兄。师曰。汝礼先师真那。亮曰。因甚么教莫礼。师曰。何曾错
  ref: X80n1565_p0107a05（五灯会元）
