id: L::福州保明院道诚通法禅师
name: 福州保明院道诚通法
school: 法眼宗
teacher: 报恩明
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0379b17。
sayings:
- text: 上堂。如为一人。众多亦然。珍重
  ref: X80n1565_p0379b17（五灯会元）
- text: 僧问。圆音普震。三等齐闻。竺土仙心。请师密付。师良久。僧曰。恁么则意马已成于宝马。心牛顿作于白牛去也。师曰。七颠八倒。曰。若然者几招哂笑。师曰。礼拜了退
  ref: X80n1565_p0379b17（五灯会元）
- text: 问。如何是和尚西来意。师曰。我不曾到西天。曰。如何是学人西来意。师曰。汝在东土多少时。报慈言导师法嗣报慈言导师法嗣
  ref: X80n1565_p0379b17（五灯会元）
