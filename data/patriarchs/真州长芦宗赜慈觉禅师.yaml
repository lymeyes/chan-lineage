id: 真州长芦宗赜慈觉禅师
name: 真州长芦宗赜慈觉
school: 云门宗
teacher: 长芦夫
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0633b17。
sayings:
- text: 僧问。达磨面壁。此理如何。师良久。僧礼拜。师曰。今日被这僧一
  ref: X80n1565_p0633b17（五灯会元）
- text: 上堂。冬去寒食。一百单五。活人路上。死人无数。头钻荆棘林。将谓众生苦。拜扫事如何。骨堆上添土。唯有出家人。不踏无生路。大众且道。向甚么处去。还会么。南天台。北五台。参
  ref: X80n1565_p0633b17（五灯会元）
- text: 上堂。新罗别无妙诀。当言不避截舌。但能心口相应。一生受用不彻。且道如何是心口相应底句。良久曰。焦砖打著连底冻。参
  ref: X80n1565_p0633b17（五灯会元）
- text: 问。六门未息时如何。师曰。鼻孔里烧香。曰。学人不会。师曰。耳朵里打鼓
  ref: X80n1565_p0633b17（五灯会元）
- text: 问。如何是无功之功。师曰。泥牛不运步。天下没荒田。曰。恁么则功不浪施也。师曰。虽然广大神通。未免遭他痛棒
  ref: X80n1565_p0633b17（五灯会元）
- text: 上堂。金屑虽贵。落眼成翳。金屑既除。眼在甚么处。若如此者。未出荆棘林中。棒头取证。喝下承当。正在金峰窠里
  ref: X80n1565_p0633b17（五灯会元）
- text: 上堂。楼外紫金山色秀。门前甘露水声寒。古槐阴下清风里。试为诸人再指看。拈拄杖曰。还见么。击香卓曰。还闻么。靠却拄杖曰。眼耳若通随处足。水声山色自悠悠
  ref: X80n1565_p0633b17（五灯会元）
