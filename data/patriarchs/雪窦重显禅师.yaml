id: 雪窦重显禅师
name: 雪窦重显
honorific: 明州雪窦重显禅师（智门光祚法嗣，云门宗）
school: 云门宗
dynasty: 北宋（980—1052）
region: 明州雪窦山（今浙江奉化）
teacher: 智门光祚（香林澄远法嗣）
source_ref: 五灯会元·卷十五·明州雪窦重显 / 雪窦明觉禅师语录
cbeta: T47n1994（雪窦明觉禅师语录）
bio: 智门光祚之法嗣，云门宗第三代，世称「雪窦明觉」。学养淹博，机辩纵横，继汾阳善昭「颂古」之风，选古则百则，各系以颂，成《颂古百则》，后圆悟克勤逐则评唱，成禅宗第一奇书《碧岩录》。雪窦又善「一字关」「师子窟」之接人，云门宗至雪窦而文采斐然、影响广远。
sayings:
- text: 师以「一字关」接人：有僧才出，师便喝；或书一「牛」字、一「佛」字勘验来机。
  ref: 五灯会元·卷十五·雪窦重显
- text: 《颂古百则》开卷举「梁武帝问达磨」一则，颂曰：「圣谛廓然，何当辨的？……对朕者谁，还云不识。」（其颂古为《碧岩录》所本）
  ref: 雪窦明觉禅师语录·颂古百则 / 碧岩录第一则
status: draft
verify: 待 CBETA 核对《雪窦明觉禅师语录》《碧岩录》；颂古原文须逐字核实。
