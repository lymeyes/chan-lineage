id: 道场明辩禅师
name: 道场明辩
alias: 道场辩
school: 杨岐派
teacher: 龙门清远禅师
status: draft
bio: 本郡人，族俞氏。年十九，事报本蕴禅师圆颅受具。辞谒径山妙湛慧禅师，慧移补净慈。因与月堂昌、翠岩宗往扣保宁玑禅师及诸名宿。晚依佛眼，眼
sayings:
- text: 问：从上祖师方𠕋因缘，许你会得。忽举拳曰：这个因何唤作拳？师拟对，眼筑其口曰：不得作道理。于是顿去知见，遂作礼。眼曰：这钝汉！师笑而趋出。后造道林，参圆悟禅师，深蒙印可。既而旋里，父母亡，乃庐其墓。待制葛公胜仲访师，议论警合。守郡日，檄徐簿敦济以天圣致请。师遁古墓中，使者往返数四。后为吏所迹，不得辞。久之，左亟叶公梦得以积善命为第一祖。谢事庵居，作颂古百首。继住何山，众数千指。又迁道场，徙卫林为鼻祖
  ref: X79n1559_p0248a03（嘉泰普灯录）
- text: 上堂曰：猛虎口边拾得，毒虵头上安排。更不钉桩摇橹，回头别有生涯。婆子被我勘破了，大悲院里有村齐
  ref: X79n1559_p0248a03（嘉泰普灯录）
- text: 上堂：净五眼，涌金春色晚。得五力，吹落碧桃华。唯证乃知难可测。卓拄杖曰：一片何人得，流经十万家
  ref: X79n1559_p0248a03（嘉泰普灯录）
- text: 上堂：三祖道：但莫憎爱，洞然明白。当时老僧若见，便与一掴。且道是憎耶？是爱耶？近来经界稍严，不许诡名挟佃。解夏，
  ref: X79n1559_p0248a03（嘉泰普灯录）
- text: 上堂：十五日已前不得去，少林双履无藏处。十五日已后不得住，桂子天香和雨露。正当十五日，又且如何？阿呵呵！风流不在著衣多。育王遗书至，
  ref: X79n1559_p0248a03（嘉泰普灯录）
- text: 上堂：黄龙头角从来异，不与今时岁月争。复妙回途何处去，月明终夜照虗堂。呜呼！无示老人道传龙岫，德播寰中。居常咤咤呀呀时，塞断天下人舌头。有时玲玲珑珑时，通透卓长灵鼻孔。驴脚行时收佛手，谁是知音？拳头举处觅生缘，了无向背。三十载入泥入水，今年五月十三日始见长人。回途大地觅无踪，只有衲僧知去处。山僧今日尽施三昧，大展神通，直得荡荡地绝丝毫，巍巍然无背面，犹觅他踪迹不得。适来为甚么却道衲僧知去处？还道得么？拄杖子忍俊不禁，为你诸人道去也。卓一下，曰：春前得雨华开早，秋后无霜叶落迟
  ref: X79n1559_p0248a03（嘉泰普灯录）
- text: 上堂，举：僧问投子：大死底人却活时如何？子云：不许夜行，投明须到。师曰：我疑千年苍玉精，化为一片秋水骨。海神欲护护不得，一旦鳌头忽擎出
  ref: X79n1559_p0248a03（嘉泰普灯录）
- text: 上堂，举：须菩提持钵，维摩诘家满盛香饭，云：汝能谤于佛，毁于法，不入众数，乃可取食。须菩提不知是义，置钵而去。师曰：当时若有个汉，倒拈蝎尾，逆捋虎须，摆手出荆棘林，才见他道：谤于佛，毁于法，不入众数，乃可取食。但对他道：贤贤易色，事父母能竭其力，事君能致其身，与朋友交言而有信。直饶净名老人，也须倒退三千里
  ref: X79n1559_p0248a03（嘉泰普灯录）
- text: 上堂：华开陇上，绽柳堤边。黄莺调叔夜之琴，芳草入谢公之句。何必闻声悟道，见色明心？非唯水上觅沤，已是眼中著屑。擘开𮌎，曰：汝等当观吾紫磨金色之身，今日则有，明日则无，大似无风起浪，全不知羞。且道今日事作么生？好个迷逢达磨，不知谁解承当？　双槐居士郑参议入山
  ref: X79n1559_p0248a03（嘉泰普灯录）
- text: 上堂：佛鉴脑后眼不亲，瞎却何山珣佛灯？佛灯照破四天下，又被禹功吹灭却。从兹大地黑漫漫，物物拈来总一般。试问一般何所似？莲华在水叶长干。禹功参议中，大使斾俯临，既是屋里人，方说屋里话，不欲世谛饰词，浼渎台听。今日到这里，所以杨歧门下锅子大小、枸柄短长、鼻孔轻重，一时被他覰见了也，汝等诸人各自照顾。虽然如是，要且有一处未知端的。且道道场八功德，池水深多少？有几个赤捎鲤鱼？且宽数日方知底里，始信道场逐日吞却三个四个、吐却七个八个。岂不见百灵和尚问庞居士曰：居士得力句还曾举似人么？云：曾举来。曰：举似阿谁？庞以手指胸云：庞公。庞却问百灵：阿师得力句还曾举似人么？曰：曾举来。云：举似阿谁？灵戴笠子便行。庞云：善为道路。师曰：庞公大似堂前开饭店，经纪屋里人；百灵正如马前相扑，步步不亏。今日忽有人问道场：如何是参议见佛灯得力句？只向道：上士由山水，中仁坐竹林。渠若云：曾举似人么？只向道：立行方回也，文才比仲壬
  ref: X79n1559_p0248a03（嘉泰普灯录）
- text: 上堂，举沩山问仰山天寒人寒话，师曰：一问一答，玉线交罗，云锦段成，了无渗漏。若也见得，方知沩仰父子唱拍相随。其或未然，更为诸人颂出：吹尽风流大石调，唱出富贵黄钟宫。舞腰催拍月当晓，更进蒲萄酒一钟
  ref: X79n1559_p0248a03（嘉泰普灯录）
- text: 上堂，举僧问赵州：狗子还有佛性也无？州云：无。师曰：若于这一句下见得，千句万句一时百杂碎。遂喝曰：切忌立地作梦。且道毕竟如何？狗子佛性有，毗卢爱饮弥勒酒。狗子佛性无，文殊醉倒普贤扶。扶到家中全酩酊，胡言汉语骂妻孥
  ref: X79n1559_p0248a03（嘉泰普灯录）
- text: 僧问：莲华未出水时如何？曰：七尺八尺。云：出水后如何？曰：三尺四尺
  ref: X79n1559_p0248a03（嘉泰普灯录）
- text: 问：如何是祖师西来意？曰：毒虵无角最威狞。云：便恁么会时如何？曰：梁山务长。云：只如教意又作么生？曰：长江滚不休
  ref: X79n1559_p0248a03（嘉泰普灯录）
- text: 问：如何是曹洞宗？曰：鶴宿梧枝。云：如何是云门宗？曰：木马上金梯。云：如何是沩仰宗？曰：目前无异草。云：如何是临济宗？曰：我终不向你说
  ref: X79n1559_p0248a03（嘉泰普灯录）
- text: 问：如是何佛？师乃鸣指三下
  ref: X79n1559_p0248a03（嘉泰普灯录）
- text: 问：语点涉离微，如何通不犯？曰：横身三界外，独脱万机前。云：只如风冗道：长忆江南三月里，鹧鸪啼处百华香。又作么生？曰：说这不唧𠺕汉作么？云：嫩竹摇金风细细，百华铺地日迟迟。曰：你向甚么处见风冗？云：眼里耳里绝潇洒。曰：料掉没交涉
  ref: X79n1559_p0248a03（嘉泰普灯录）
- text: 问：莲华未出水时如何？曰：未过冬至莫道寒。云：出水后如何？曰：未过夏至莫道热。云：出与未出时如何？曰：三十年后不要错举
  ref: X79n1559_p0248a03（嘉泰普灯录）
- text: 问：如何是佛？曰：无柴猛烧火。云：如何是法？曰：贫做富装裹。云：如何是僧？曰：卖扇老婆手遮日。云：如何是和尚栗棘蓬？曰：不答此话。云：为甚么不答？师大笑曰：吞不进，吐不出
  ref: X79n1559_p0248a03（嘉泰普灯录）
- text: 问：如何是一喝如金刚王宝剑？曰：古墓毒虵头戴角。云：如何是一喝如踞地师子？曰：虗空笑点头。云：如何是一喝如探竿影草？曰：石人拍手笑呵呵。云：如何是一喝不作一喝用？曰：布袋里猪头。云：四喝已蒙师指示，向上还有事也无？曰：有。云：如何是向上事？曰：锯解秤锤。随声便喝。　佛眼禅师忌。师拈香曰：龙门和尚，阐提潦倒。不信佛法，灭除禅道。拶破毗卢向上关，猫儿洗面自道好。一炷沉香炉上然，换手槌𮌎空懊恼。遂摇手曰：休懊恼。以坐具搭肩上，作女人拜曰：莫怪下房媳妇触忤大人好。　室中垂问曰：猫儿为甚么爱捉老鼠？又曰：板鸣因甚么狗吠？绍兴二十七年二月上澣，游寺之西原，指地谓侍僧，令役工治小塔。三月旦，示少恙。翌日，卫侯遣医来，师笑曰：药能愈人，世无死者。寄语卫公，佐国厚自重。初六日，侍僧告塔将就，师遣击鼓集众。师登座，拈拄杖于左边卓一下曰：三十二相无此相。于右边卓一下曰：八十种好无此好。僧瑶一笔𦘕成，志公露出藁草。又卓一下，顾大众曰：莫懊恼，直下承当休更讨。下座归方丈，俨然趺坐而逝。寿七十有三，夏五十有四。火后收灵骨设利，藏所建之塔曰仙人山
  ref: X79n1559_p0248a03（嘉泰普灯录）
