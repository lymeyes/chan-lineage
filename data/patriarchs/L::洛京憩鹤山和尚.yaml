bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0268b05。
sayings:
- text: 僧问。如何是憩鹤。师以两手斗云。鹁鸠鸠风穴云。鹤唳一声喧宇宙。群鸡莫谓报知时
  ref: X80n1565_p0268b05（五灯会元）
- text: 问。骏马不入西秦时如何。师曰。向甚么处去
  ref: X80n1565_p0268b05（五灯会元）
