id: L::韶州后白云和尚
name: 韶州后白云
school: —
teacher: 白云祥
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0578b12。
sayings:
- text: 僧问。古琴绝韵请师弹。师曰。伯牙虽妙手。时人听者希。曰。恁么则再遇子期也。师曰。笑发惊弦断。宁知调不同
  ref: X80n1565_p0578b12（五灯会元）
- text: 问。昔日灵山一会。梵王为主。未审白云甚么人为主。师曰。有常侍在。曰。恁么则法雨霶𩃱。群生有赖。师曰。汝莫这里卖栀子
  ref: X80n1565_p0578b12（五灯会元）
