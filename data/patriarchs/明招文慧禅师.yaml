sayings:
- text: 僧问。百尺竿头如何进步。师曰。南天台北五台
  ref: T51n2077_p0648c14（续传灯录）
- text: 僧云。处处逢归路时时达本源。师曰。对面若无青山白云。相识犹如不相识
  ref: T51n2077_p0648c14（续传灯录）
- text: 僧云。争奈学人有转身一路师曰。切忌丧身失命。师乃良久曰。便与么散去。早自落七落八了也。俯为初机不免重重话会。今朝五月五为汝等诸人举个父母未生底句。光明烜赫耀乾坤。且是无今亦无古。三世诸佛强诠量。六代祖师徒指注。殿上迦叶谩擎拳。门外金刚眉卓竖。师拊掌呵呵大笑曰。笑个什么。笑灯笼入露柱
  ref: T51n2077_p0648c14（续传灯录）
