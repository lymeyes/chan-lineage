id: 池州鲁祖山教禅师
name: 池州鲁祖山教
school: 临济宗
teacher: 灌谿闲禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0404a17。
sayings:
- text: 僧问。如何是祖师西来意。师曰。今日不答话。曰。大好不答话。师便打
  ref: X80n1565_p0404a17（五灯会元）
- text: 问。如何是双林树。师曰。有相身中无相身。曰。如何是有相身中无相身。师曰。金香炉下铁昆仑
  ref: X80n1565_p0404a17（五灯会元）
- text: 问。如何是孤峰独宿底人。师曰。半夜日头明。日午打三更
  ref: X80n1565_p0404a17（五灯会元）
- text: 问。如何是格外事。师曰。化道缘终后。虗空更那边
  ref: X80n1565_p0404a17（五灯会元）
- text: 问。进向无门时如何。师曰。太钝生。曰。不是钝生。直下进向无门时如何。师曰。灵机未曾论边际。执法无门在暗中
  ref: X80n1565_p0404a17（五灯会元）
- text: 问。如何是学人著力处。师曰。春来草自青。月上已天明。曰。如何是不著力处。师曰。崩山石头落。平川烧火行
  ref: X80n1565_p0404a17（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0404a17），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
