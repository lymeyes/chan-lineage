id: L::真州真如院方禅师
name: 真州真如院方
school: —
teacher: 琅邪觉
status: draft
bio: 参琅邪。唯看柏树子话。每入室。陈其所见。不容措词。常被喝出。忽一日大悟。直入方丈曰。我会也。琅邪曰。汝作么生会。师曰。夜来床荐暖。一觉到天明。琅邪可之
