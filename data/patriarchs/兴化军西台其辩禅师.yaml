id: 兴化军西台其辩禅师
name: 兴化军西台其辩
school: 云门宗
teacher: 天衣怀
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0623b06。
sayings:
- text: 上堂。举临济无位真人语。乃召大众曰。临济老汉。寻常一条脊梁硬似铁。及乎到这里。大似日中迷路。眼见空花。直饶道无位真人是干屎橛。正是泥龟曳尾。其僧祇知季夏极热。不知仲冬严寒。若据当时。合著得甚么语。塞断天下人舌头。西台祇恁么休去。又乃眼不见为净。不免出一只手。狼籍去也。临济一担。西台一堆。一担一堆。分付阿谁。从教撒向诸方去。笑杀当年老古锥
  ref: X80n1565_p0623b06（五灯会元）
