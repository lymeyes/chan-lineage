bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0813a05。
sayings:
- text: 上堂。兜率降生。双林示灭。掘地讨天。虗空钉橛。四十九年。播土扬尘。三百余会。纳尽败缺。尽力布网张罗。未免唤龟作鳖。末后拘尸城畔。椁示双趺。旁人冷眼。看来大似弄巧成拙。卓拄杖曰。若无这个道理。千古之下。谁把口说。且道是甚么道理。痴人面前切忌漏泄
  ref: X80n1565_p0813a05（五灯会元）
