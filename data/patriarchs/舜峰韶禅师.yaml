id: 舜峰韶禅师
name: 舜峰韶
school: 云门宗
teacher: 云门偃
status: draft
bio: 初问云门和尚。宝月为什么于此分辉。云门曰。千光同照。师曰。谢和尚指示。云门曰。见什么。僧正入师方丈乃曰。方丈得恁么黑。师曰。老鼠窟。僧正曰。放猫儿入好。师曰。试放看。僧正无对。师拊掌笑。师与老宿渡江次。师取钱与渡子。老宿曰。囊中若有青铜片。师揖曰。长老莫笑
