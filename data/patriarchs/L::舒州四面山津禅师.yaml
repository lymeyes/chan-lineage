id: L::舒州四面山津禅师
name: 舒州四面山津
school: 曹洞宗
teacher: 石门彻
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0521a09。
sayings:
- text: 僧问。如何是佛。师曰。王字不著点。曰。学人不会。师曰。点
  ref: X80n1565_p0521a09（五灯会元）
- text: 问。如何是祖师西来意。师曰。山寒水冷。师有挂杖颂曰。四面一条杖。当机验龙象。头角稍低昂。电光临背上
  ref: X80n1565_p0521a09（五灯会元）
