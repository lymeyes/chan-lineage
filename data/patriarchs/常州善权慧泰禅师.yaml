id: 常州善权慧泰禅师
name: 常州善权慧泰
school: 云门宗
teacher: 云居元
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0625a08。
sayings:
- text: 上堂。诸佛出世。广演三乘。达磨西来。密传大事。上根之者。言下顿超。中下之流。须当渐次。发明心地。或一言唱道。或三句敷扬。或善巧应机。遂成多义。撮其枢要。总是空花。一句穷源。沉埋祖道。敢问诸人。作么生是依时及节底句。良久曰。微云淡河汉。疏雨滴梧桐。参
  ref: X80n1565_p0625a08（五灯会元）
