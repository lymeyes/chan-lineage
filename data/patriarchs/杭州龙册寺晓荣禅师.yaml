id: 杭州龙册寺晓荣禅师
name: 杭州龙册寺晓荣
school: 法眼宗
teacher: 天台德韶国师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0372b02。
sayings:
- text: 僧问。祖祖相传。未审和尚传阿谁。师曰。汝还识得祖也未。僧慧文
  ref: X80n1565_p0372b02（五灯会元）
- text: 问。如何是真实沙门。师曰。汝是慧文
  ref: X80n1565_p0372b02（五灯会元）
- text: 问。如何是般若大神珠。师曰。般若大神珠。分形万亿躯。尘尘彰妙体。刹刹尽毗卢
  ref: X80n1565_p0372b02（五灯会元）
- text: 问。如何是日用事。师曰。一念周沙界。日用万般通。湛然常寂灭。常展自家风。小参次
  ref: X80n1565_p0372b02（五灯会元）
- text: 僧问。向上事即不
  ref: X80n1565_p0372b02（五灯会元）
- text: 问。如何是妙善台中的的意。师曰。若到诸方。分明举似。曰。恁么则云有出山势。水无投㵎声。师乃叱之
  ref: X80n1565_p0372b02（五灯会元）
