bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0313a14。
sayings:
- text: 僧问。如何是佛法大意。师曰。近前来。僧近前。师曰。会么。曰。不会。师曰。石火电光。已经尘劫
  ref: X80n1565_p0313a14（五灯会元）
- text: 问。如何是为人底一句。师曰。开口入耳。曰。如何理会。师曰。逢人告人。青原下九世青原下九世
  ref: X80n1565_p0313a14（五灯会元）
