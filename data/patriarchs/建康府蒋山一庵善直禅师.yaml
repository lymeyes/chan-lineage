id: 建康府蒋山一庵善直禅师
name: 建康府蒋山一庵善直
school: 杨岐派
teacher: 径山杲
status: draft
bio: 德安云梦人。初参妙喜于回雁峰下。一日。喜问之曰。上座甚处人。师曰。安州人。喜曰。我闻你安州人会厮扑。是否。师便作相扑势。喜曰。湖南人吃鱼。因甚湖北人著鲠。师打筋斗而出。喜曰。谁知冷灰里。有粒豆𪹼出。住保宁
sayings:
- text: 上堂。诸佛不曾出世。人人鼻孔辽天。祖师不曾西来。个个壁立千仞。高揖释迦。不拜弥勒。理合如斯。坐断千圣路头。独步大千沙界。不为分外。若向诸佛出世处会得。祖师西来处承当。自救不了。一生受屈。莫有大丈夫承当大丈夫事者么。出来与保宁争交。其或未然。不如拽破好。便下座。一日。留守阵丞相俊卿会诸山茶话次。举有句无句。如藤倚树公案。令诸山批判。皆以奇语取奉。师最后曰。张打油。李打油。不打浑身只打头。陈大喜
