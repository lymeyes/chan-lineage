id: L::福州长庆常慧禅师
name: 福州长庆常慧
school: —
teacher: 长庆棱
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0287b12。
sayings:
- text: 僧问。王侯请命。法嗣怡山。锁口之言。请师不谬。师曰。得。曰。恁么则深领尊慈。师曰。莫钝置人好
  ref: X80n1565_p0287b12（五灯会元）
- text: 问。不犯宗风。不伤物义。请师满口道。师曰。今日岂不是开堂
  ref: X80n1565_p0287b12（五灯会元）
- text: 问。焰续雪峰。印传超觉。不违于物。不负于人。不在当头。即今何道。师曰。违负即道。曰。恁么则善副来言。浅深已辨。师曰。也须识好恶
  ref: X80n1565_p0287b12（五灯会元）
