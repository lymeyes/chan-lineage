status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0142a07。
sayings:
- text: 上堂。大众莫待老僧上来便上来。下去便下去。各有华藏性海。具足功德。无碍光明。各各参取。珍重
  ref: X80n1565_p0142a07（五灯会元）
- text: 僧问。如何得出三界去。师曰。汝即今在甚么处
  ref: X80n1565_p0142a07（五灯会元）
