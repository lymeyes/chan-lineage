id: 信州龟峰晦庵慧光禅师
name: 信州龟峰晦庵慧光
school: 杨岐派
teacher: 乌巨行
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0820a10。
sayings:
- text: 上堂。数日暑气如焚。一个浑身无处安著。思量得也是烦恼人。这个未是烦恼。更有己躬下事不明。便是烦恼。所以达磨大师烦恼。要为诸人吞却。又被咽喉小。要为诸人吐却。又被牙齿碍。取不得。舍不得。烦恼九年。若不得二祖不惜性命。往往转身无路。烦恼教死。所谓祖祢不了。殃及儿孙。后来莲华峰庵主到这里。烦恼不肯住。南岳思大到这里。烦恼不肯下山。更有临济德山。用尽自己查棃。烦恼钵盂无柄。龟峰今日为他闲事长无明。为你诸人从头点破。卓拄杖一下。曰。一人脑后露腮。一人当门无齿。更有数人鼻孔没半边。不劳再勘。你诸人休向这里立地瞌睡。殊不知家中饭箩锅子一时失却了也。你若不信。但归家检点看
  ref: X80n1565_p0820a10（五灯会元）
