id: 百灵和尚
name: 百灵
school: 南岳系
teacher: 马祖一
status: draft
bio: 一日与庞居士路次相逢。问曰。南岳得力句。还曾举向人也无。士曰。曾举来。师曰。举向甚么人。士以手自指曰。庞公。师曰。真是妙德．空生也赞叹不及。士却
sayings:
- text: 问。阿师得力句。是谁得知。师戴笠子便行。士曰。善为道路。师更不回首
  ref: X80n1565_p0116a17（五灯会元）
