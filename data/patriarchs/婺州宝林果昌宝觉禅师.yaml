id: 婺州宝林果昌宝觉禅师
name: 婺州宝林果昌宝觉
school: 云门宗
teacher: 法云善本禅师
status: draft
bio: 安州时氏子。师与提刑杨次公入山同游山次。杨拈起大士饭石
sayings:
- text: 问。既是饭石。为甚么𫜪不破。师曰。祇为太硬。杨曰。犹涉繁词。师曰。未审提刑作么生。杨曰。硬。师曰。也是第二月。杨为写七佛殿额。乃
  ref: X80n1565_p0637b12（五灯会元）
- text: 问。七佛重出世时如何。师曰。一回相见一回新
  ref: X80n1565_p0637b12（五灯会元）
- text: 上堂。一即一。二即二。齅著直是无香气。蓦拈拄杖卓一下。曰。识得山僧楖栗条。莫向南山寻鳖鼻
  ref: X80n1565_p0637b12（五灯会元）
