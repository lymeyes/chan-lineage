bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0272b08。
sayings:
- text: 僧问。四山相逼时如何。师曰。红日不垂影。暗地莫知音。曰。学人不会。师曰。鹤透群峰。何伸向背
  ref: X80n1565_p0272b08（五灯会元）
- text: 问。雪峰一曲千人唱。月里挑灯谁最明。师曰。无音和不齐。明暗岂能收
  ref: X80n1565_p0272b08（五灯会元）
