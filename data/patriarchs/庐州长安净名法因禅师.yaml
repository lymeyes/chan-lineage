bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0632a15。
sayings:
- text: 上堂。天上月圆。人间月半。七八是数。事却难算。隐显不辨即且置。黑白未分一句作么生道。良久曰。相逢秋色里。共话月明中
  ref: X80n1565_p0632a15（五灯会元）
- text: 上堂。祖师妙诀。别无可说。直饶钉觜铁舌。未免弄巧成拙。净名已把天机泄
  ref: X80n1565_p0632a15（五灯会元）
