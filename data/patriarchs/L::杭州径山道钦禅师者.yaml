id: L::杭州径山道钦禅师者
name: 杭州径山道钦
school: —
teacher: 鹤林素
status: draft
bio: 苏州昆山人也。姓朱氏。初服膺儒教。年二十八。遇素禅师。谓之曰。观子神气温粹。真法宝也。师感悟。因求为弟子。素躬与落发。乃戒之曰。汝乘流而行。逢径即止。师遂南迈。抵临安。见东北一山。因问樵者。樵曰。此径山也。乃驻锡焉
sayings:
- text: 僧问。如何是道。师曰。山上有鲤鱼。海底有蓬尘。马祖令人送书到。书中作一圆相。师发缄。于圆相中著一点。却封回忠国师闻。乃云。钦师犹被马师惑
  ref: X80n1565_p0046b15（五灯会元）
- text: 问。如何是祖师西来意。师曰。汝问不当。曰。如何得当。师曰。待吾灭后。即向汝说。马祖令智藏来
  ref: X80n1565_p0046b15（五灯会元）
- text: 问。十二时中以何为境。师曰。待汝回去时有信。藏曰。如今便回去。师曰。传语却须问取曹溪。崔赵公
  ref: X80n1565_p0046b15（五灯会元）
- text: 问。弟子今欲出家。得否。师曰。出家乃大丈夫事。非将相之所能为。公于是有省。唐大历三年。代宗诏至阙下。亲加瞻礼。一日。同忠国师在内庭坐次。见帝驾来。师起立。帝曰。师何以起。师曰。檀越何得向四威仪中见贫道。帝悦。谓国师曰。欲锡钦师一名。国师欣然奉诏。乃赐号国一焉。后辞归本山。于贞元八年十二月示疾。说法而逝。谥大觉禅师
  ref: X80n1565_p0046b15（五灯会元）
