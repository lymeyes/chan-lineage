bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0611b01。
sayings:
- text: 僧问。如何是佛法大意。师曰。一年三百六十日。曰。便恁么会时如何。师曰。迢迢十万不是远
  ref: X80n1565_p0611b01（五灯会元）
- text: 上堂。鼓声错落。山色崔嵬。本既不有。甚处得来。良久曰。高著眼
  ref: X80n1565_p0611b01（五灯会元）
