id: 婺州双溪保初禅师
name: 婺州双溪保初
school: 青原系
teacher: 明招谦
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0305a10。
sayings:
- text: 上堂。未透彻。不须呈。十方世界廓然明。孤峰顶上通机照。不用看他北斗星
  ref: X80n1565_p0305a10（五灯会元）
- text: 僧问。九夏灵峰剑。请师不露锋。师曰。未拍金锁前何不
  ref: X80n1565_p0305a10（五灯会元）
- text: 问。曰。千般徒设用。难出髑髅前。师曰。背后碍杀人
  ref: X80n1565_p0305a10（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0305a10），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
