bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0534a08。
sayings:
- text: 僧问。师唱谁家曲。宗风嗣阿谁。师曰。杨广山头云霭霭。月华庵畔柏青青。曰。恁么则投子嫡嗣。大阳亲孙也。师曰。未跨铁牛。棒如雨点。曰。今日已知端的。师曰。一任敲砖打瓦。青原下十二世青原下十二世
