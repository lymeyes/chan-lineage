bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0297b01。
sayings:
- text: 僧问。师既是铁脚。为甚么却骑马。师曰。腰带不因遮腹痛。幞头岂是御天寒。官人问师。和尚恁么后生。为甚么却为尊宿。师曰。千岁祇言朱顶鹤。朝生便是凤凰儿
  ref: X80n1565_p0297b01（五灯会元）
- text: 上堂。此个事得恁么难道。时有僧出曰。请师道。师曰。睦州溪苔。锦军石耳
  ref: X80n1565_p0297b01（五灯会元）
- text: 问。众手淘金。谁是得者。师曰。谿畔披砂徒自困。家中有宝速须还。曰。恁么即始终不从人得去也。师曰。饶君便有擎山力。未免肩头有担胝
  ref: X80n1565_p0297b01（五灯会元）
