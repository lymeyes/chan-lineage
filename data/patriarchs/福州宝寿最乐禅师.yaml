bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0689b10。
sayings:
- text: 上堂。诸佛不真实。说法度群生。菩萨有智慧。见性不分明。白云无心意。洒为世间雨。大地不含情。能长诸草木。若也会得。犹存知解。若也不会。堕在无记。去此二途。如何即是。海阔难藏月。山深分外寒
  ref: X80n1565_p0689b10（五灯会元）
