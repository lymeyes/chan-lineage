id: 汾州无业禅师
name: 汾州无业
school: 南岳系
teacher: 马祖一
bio: 马祖道一禅师法嗣，貌古神清。尝讲经论，马祖以「大德讲经，将何讲说」勘之，遂回心入宗。世称「无业国师」。
sayings:
- text: 祖（马祖）见师端坐讲经，谓曰：「大德讲经，将何讲说？」师曰：「大讲说。」祖曰：「大德未识讲说。」师罔措，礼祖求法，言下契悟。
  ref: 五灯会元·卷三·汾州无业禅师
