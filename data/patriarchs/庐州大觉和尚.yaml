id: 庐州大觉和尚
name: 庐州大觉
school: 临济宗
teacher: 魏府大觉和尚
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0403b07。
sayings:
- text: 僧问。牛头未见四祖时。为甚么鸟兽衔华。师曰。有恁么畜生无所知。曰。见后为甚么不衔华。师曰。无恁么畜生有所知
  ref: X80n1565_p0403b07（五灯会元）
