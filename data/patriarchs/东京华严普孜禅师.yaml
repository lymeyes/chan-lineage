bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0453a02。
sayings:
- text: 僧问。如何是宾中宾。师曰。客路如天远。曰。如何是宾中主。师曰。侯门似海深。曰。如何是主中主。师曰。寰中天子𠡠。曰。如何是主中宾。师曰。塞外将军令。乃曰。宾中问主。互换机锋。主中问宾。同生同死。主中辩主。饮气吞声。宾中觅宾。白云万里。故句中无意。意在句中。于斯明得。一双孤雁扑地高飞。于斯未明。一对鸳鸯池边独立。知音禅客。相共证明。影响异流。切须子细。良久曰。若是陶渊明。攒眉便归去
  ref: X80n1565_p0453a02（五灯会元）
