cbeta: T51n2076 卷三
bio: '武牢姬氏子，少通世典，博览群书。闻达摩少林面壁，往参承，晨夕参寻。

  雪夜坚立，积雪过膝，复断臂置师前，曰：「弟子心未安，乞师安心。」达摩曰：「将心来，与汝安。」可良久曰：「觅心了不可得。」达摩曰：「我与汝安心竟。」言下大悟，嗣法。

  后传法于僧璨，晚年行化邺都，屡遭非难，从容就义。'
