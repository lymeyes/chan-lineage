id: L::金陵报恩院清护崇因妙行禅师
name: 金陵报恩院清护崇因妙行
school: —
teacher: 鼓山晏
status: draft
bio: 福州长乐陈氏子。六岁礼鼓山。披削于国师。言下发明。开堂日
sayings:
- text: 僧问。诸佛出世。天花乱坠。和尚出世。有何祥瑞。师曰。昨日新雷发。今朝细雨飞
  ref: X80n1565_p0295b14（五灯会元）
- text: 问。如何是诸佛玄旨。师曰。草鞋木履。开宝三年示寂。茶毗收舍利三百余粒。并灵骨归于建州鸡足山卧云院建塔
  ref: X80n1565_p0295b14（五灯会元）
