id: L::台州国清简堂行机禅师
name: 台州国清简堂行机
school: 杨岐派
teacher: 护国元
status: draft
bio: 本郡人。姓杨氏。风姿挺异。才压儒林。年二十五。弃妻孥。学出世法。晚见此庵。密有契证。出应莞山。刀耕火种。单丁者一十七年。尝有偈云。地炉无火客囊空。雪似杨华落岁穷。拾得断麻穿坏衲。不知身在寂寥中。每谓人曰。某犹未稳在。岂以住山乐吾事邪。一日偶看斫树倒地。忽然大悟。平昔碍膺之物。泮然冰释。未几。有江州圆通之命。乃曰。吾道将行。即欣然曳杖而去。登座说法云。圆通不开生药铺。单单只卖死猫头。不知那个无思算。吃著通身冷汗流
sayings:
- text: 上堂。单明自已。乐是苦因。趣向宗乘。地狱劫住。五日一参。三八普说。自扬家丑。更若问理问事。问心问性。克由叵耐。若是英灵汉。窥藩不入。据鼎不尝。便于未有生佛已前转得身。却于今时大官路上捷行阔步。终不向老鼠窟．草窠里头出头没。若也根性陋劣。要去有滋味处咬嚼。遇著义学阿师。递相锢鏴。直饶说得云兴雨现。也是虾蟆化龙。下梢依旧。吃泥吃土。堪作甚么
  ref: X80n1565_p0811a08（五灯会元）
- text: 上堂。仲秋八月旦。庭户入新凉。不露风骨句。愁人知夜长
  ref: X80n1565_p0811a08（五灯会元）
- text: 上堂。无隔宿恩。可参临济禅。有肯诺意。难续杨岐派。穷厮煎。饿厮炒。大海祇将折箸搅。你死我活。猛火然铛煮佛喋。恁么作用。方可撑门拄户。更说声和响顺。形直影端。驴年也未梦见
  ref: X80n1565_p0811a08（五灯会元）
- text: 僧问。三圣问雪峰。透网金鳞。未审以何为食。峰云。待汝出网来。即向汝道。意旨如何。师曰。同途不同辙。曰。三圣道。一千五百人善知识。话头也不识。峰云。老僧住持事繁。又作么生。师曰。前箭犹轻后箭深。曰。祇如雪窦道。可惜放过。好与三十棒。这棒一棒也较不得。直是罕遇作家。意又作么生。师曰。阵败说兵书。曰。这棒是三圣合吃。雪峰合吃。师以拂子击禅床曰。这里荐取
  ref: X80n1565_p0811a08（五灯会元）
- text: 示众云。衲僧拄杖子。不用则已。用则如鸩鸟落水。鱼鳖皆死。正按傍提。风飒飒地。独步大方。杀活在我。所以道。千人排门。不如一人拔关。若一人拔关。千人万人得到安乐田地。还知么。鸳鸯绣出从君看。不把金针度与人
  ref: X80n1565_p0811a08（五灯会元）
- text: 示众云。观色即空成大智。故不住生死。观空即色成大悲。故不证涅槃。生死不住。涅槃不证。汉地不收。秦地不管。且道在甚么处安身立命。莫是昭昭于心目之间。而相不可睹。晃晃于色尘之内。而理不可分么。莫是起坐镇相随。语默同居止么。若恁么。总是髑髅前敲磕。须知过量人自有过量用。且作么生是过量用。北斗藏身虽有语。出群消息少人知
  ref: X80n1565_p0811a08（五灯会元）
