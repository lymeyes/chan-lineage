id: 歙州朱谿谦禅师
name: 歙州朱谿谦
school: 曹洞宗
teacher: 云居膺
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0501b01。
sayings:
- text: 问。是甚么声。师曰。犬𫜪灵鼠声。国师曰。既是灵鼠。为甚么却被犬𫜪。师曰。𫜪杀也。国师曰。好个犬。师便打。国师曰。莫打。某甲话在。师休去。因造佛殿毕。一僧同看。师曰。此殿著得甚么佛。曰。著即不无。有人不肯。师曰。我不问那个人。曰。恁么。则某甲亦未曾祇对和尚
  ref: X80n1565_p0501b01（五灯会元）
