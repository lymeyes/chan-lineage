bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0302a18。
sayings:
- text: 僧问。师唱谁家曲。宗风嗣阿谁。师曰。楷师岩畔祥云起。宝寿峰前震法雷。临终遗偈曰。吾年八十八。满头垂白发。颙颙镇双峰。明明千江月。黄梅扬祖教。白兆承宗诀。日日告儿孙。勿令有断绝
  ref: X80n1565_p0302a18（五灯会元）
