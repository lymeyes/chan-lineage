id: L::益州铁幢觉禅师
name: 益州铁幢觉
school: 云门宗
teacher: 云门偃
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0576a13。
sayings:
- text: 僧问。十二时中如何履践。师曰。光剃头。净洗钵
  ref: X80n1565_p0576a13（五灯会元）
- text: 问。如何是道。师曰。踏著。曰。如何是道中人。师曰。退后三步
  ref: X80n1565_p0576a13（五灯会元）
- text: 问。诸佛出世。当为何事。师曰。截耳卧街
  ref: X80n1565_p0576a13（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0576a13），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
