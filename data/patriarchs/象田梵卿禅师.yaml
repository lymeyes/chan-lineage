id: 象田梵卿禅师
name: 象田梵卿
alias: 象田卿
school: 黄龙派
teacher: 东林常总禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《续传灯录》T51n2077_p0600c23。
sayings:
- text: 僧问。大悲菩萨用许多手眼作甚么。师曰。富嫌千口少。曰毕竟如何是正眼。师曰。从来共住不知名。问寒风乍起衲子开炉。忽忆丹霞烧木佛。因何院主堕眉须。师曰。张公吃酒李公醉。曰为复是逢强即弱。为复是妙用神通。师曰。堂中圣僧却谙此事
  ref: T51n2077_p0600c23（续传灯录）
- text: 僧问。象田有屠龙之剑。欲借一观时如何。师横按拄杖。僧便喝。师掷下拄杖。僧无语。师曰。这死虾蟆
  ref: T51n2077_p0600c23（续传灯录）
- text: 上堂。春已暮落花纷纷下红雨。南北行人归不归。千林万林鸣杜宇。我无家兮何处归。十方刹土奚相依。老天有个真消息。昨夜三更月在池。上在。佛法到此命若悬丝。异目超宗亦难承绍。竖起拂子曰。赖有这个堪作流通。于此觑得便见三世诸佛向灯笼露柱里转大法轮。六趣众生于铁围山得闻法。要声非声见色非色。随异类四生各得解脱。如斯举唱非但埋没宗风。亦乃平沈自己。且道如何得不犯令去。拍禅床下座
  ref: T51n2077_p0600c23（续传灯录）
