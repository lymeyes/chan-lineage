id: L::泉州后招庆和尚
name: 泉州后招庆
school: —
teacher: 保福展
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0292a05。
sayings:
- text: 僧问。末后一句。请师商量。师曰。尘中人自老。天际月常明
  ref: X80n1565_p0292a05（五灯会元）
- text: 问。如何是和尚家风。师曰。一缾兼一钵。到处是生涯
  ref: X80n1565_p0292a05（五灯会元）
- text: 问。如何是佛法大意。师曰。扰扰忩忩。晨鸡暮钟
  ref: X80n1565_p0292a05（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0292a05），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
