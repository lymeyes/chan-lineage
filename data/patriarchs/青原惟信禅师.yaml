bio: 生平部分原文未载，仅存机缘语（见下）；据《续传灯录》T51n2077_p0614c01。
sayings:
- text: 上堂。老僧三十年前未参禅时。见山是山见水是水。及至后来亲见知识有个入处。见山不是山。见水不是水。而今得个休歇处。依然见山只是山。见水只是水。大众这三般见解是同是别。有人缁素得出。许汝亲见老僧
  ref: T51n2077_p0614c01（续传灯录）
