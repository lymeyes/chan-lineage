status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0521a13。
sayings:
- text: 僧问。如何是承天境。师曰。两江夹却青盲汉。一带山藏赤脚蛮
  ref: X80n1565_p0521a13（五灯会元）
- text: 问。如何是谛实之言。师曰。措大巾子黑
  ref: X80n1565_p0521a13（五灯会元）
