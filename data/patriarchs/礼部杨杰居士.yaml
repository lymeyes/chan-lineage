id: 礼部杨杰居士
name: 礼部杨杰
school: 云门宗
teacher: 天衣怀
status: draft
bio: 字次公。号无为。历参诸名宿。晚从天衣游。衣每引老庞机语。令研究深造。后奉祠泰山。一日鸡一鸣。睹日如盘涌。忽大悟。乃别有男不婚．有女不嫁之偈曰。男大须婚。女长须嫁。讨甚闲工夫。更说无生话。书以寄衣。衣称善。后会芙蓉楷禅师。公曰。与师相别几年。蓉曰。七年。公曰。学道来。参禅来。蓉曰。不打这鼓笛。公曰。恁么则空游山水。百无所能也。蓉曰。别来未久。善能高鉴。公大笑。公有辞世偈曰。无一可恋。无一可舍。太虗空中。之乎者也。将错就错。西方极乐
