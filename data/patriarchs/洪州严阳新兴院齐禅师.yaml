status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0365a07。
sayings:
- text: 僧问。如何得出三界去。师曰。汝还信么。曰。信则深信。乞和尚慈悲。师曰。祇此信心。亘古亘今。快须究取。何必沉吟。要出三界。三界唯心。师因雪谓众曰。诸上座还见雪么。见即有眼。不见无眼。有眼即常。无眼即断。恁么会得。佛身充满
  ref: X80n1565_p0365a07（五灯会元）
- text: 问。学人辞去泐潭。乞和尚示个入路。师曰。好个入路。道心坚固。随众参请。随众作务。要去便去。要住便住。去之与住。更无他故。若到泐潭。不审马祖
  ref: X80n1565_p0365a07（五灯会元）
