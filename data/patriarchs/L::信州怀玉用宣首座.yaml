bio: 四明彭氏子。幼为僧。径趋丛席。侍泐潭于黄檗。一日自临川持钵归。值潭晚参。有云。一叶飘空便见秋。法身须透闹啾啾。师闻领旨。潭为证据。后依大慧。慧亦谓其类己。以是名卿巨公列刹迎礼。不就。尝有颂大愚答佛语曰锯解秤锤。出老杜诗。红稻󲣅残鹦鹉颗。碧梧栖老凤凰枝
