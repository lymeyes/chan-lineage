id: L::澧州夹山灵泉自龄禅师
name: 澧州夹山灵泉自龄
school: 云门宗
teacher: 佛日才
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0634b02。
sayings:
- text: 僧问。金鸡󲣅破琉璃壳。玉兔挨开碧海门。此是人间光影。如何是祖师机。师曰。针札不入。曰。祇如朕兆未生已前。作么生道
  ref: X80n1565_p0634b02（五灯会元）
- text: 师举起拂子。僧曰。如何领会。师曰。斫额望扶桑
  ref: X80n1565_p0634b02（五灯会元）
- text: 问。混沌未分时如何。师曰。春风𩖼𩖼。曰。分后如何。师曰。春日迟迟。曰。向上更有事也无。师曰。一年三百六十日
  ref: X80n1565_p0634b02（五灯会元）
- text: 上堂。良久顾大众曰。月里走金乌。谁云一物无。赵州东壁上。挂个大葫芦。参
  ref: X80n1565_p0634b02（五灯会元）
- text: 上堂。良久打一圆相曰。大众。五千余卷诠不尽。三世诸佛赞不及。令人却忆卖油翁。狼忙走下绳床立。参
  ref: X80n1565_p0634b02（五灯会元）
- text: 上堂。便乃忘机守默。已被金粟占先。拟欲展演词锋。落在瞿昙之后。离此二途。作么生是衲僧透脱一路。良久曰。好笑南泉提起处。刈茆镰子曲弯弯。参
  ref: X80n1565_p0634b02（五灯会元）
