bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0601a17。
sayings:
- text: 上堂。心生则种种法生。心灭则种种法灭。拈起拄杖曰。此个是法。那个是灭底心。若人道得。许你顶门上具眼。其或未然。云暗不知天早晚。雪深难辩路高低。参
  ref: X80n1565_p0601a17（五灯会元）
