id: 潭州东明迁禅师
name: 潭州东明迁
school: —
teacher: 大沩喆禅师
status: draft
bio: 久侍真如。晚居沩山。真如庵忠道者高其风。每叩之。一日阅首楞严次。忠
sayings:
- text: 问。如我按指。海印发光。佛意如何。师曰。释迦老子好与二十棒。曰。为甚么如此。师曰。用按指作么。曰。汝暂举心。尘劳先起又作么生。师曰。亦是海印发光
  ref: X80n1565_p0460b08（五灯会元）
