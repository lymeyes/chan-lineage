id: 昭觉勤禅师
name: 圆悟克勤（昭觉克勤）
honorific: 成都昭觉克勤禅师·圆悟（五祖法演法嗣，杨岐派第三代）
school: 杨岐派
dynasty: 北宋（1063—1135）
region: 成都昭觉寺 / 汴京天宁寺（今四川成都 / 河南开封）
teacher: 五祖法演（五祖演禅师）
source_ref: 五灯会元·卷十九·昭觉克勤 / 碧岩录 / 圆悟佛果禅师语录
cbeta: T48n2003（碧岩录）十卷
bio: 五祖法演之法嗣，杨岐派第三代，世称「圆悟」。成都人，姓骆。初业儒，后出家，遍历诸方。参五祖法演，法演举「频呼小玉元无事，只要檀郎认得声」之艳诗勘验，克勤闻而大悟，呈偈「少年一段风流事，只许佳人独自知」，法演印可。历住成都昭觉、汴京天宁等刹，道声洋溢。克勤以雪窦重显《颂古百则》为本，逐则评唱，成《碧岩录》十卷，为禅宗「文字禅」之巅峰；然其繁富解会亦启后世「葛藤」「药语」之讥（圆悟晚年尝自焚其稿以警学人）。传法大慧宗杲，倡「看话禅」。又传「茶禅一味」之旨（传统上谓其以四字墨迹授日僧荣西，东传日本茶道，此说待考）。
sayings:
- text: 闻艳诗悟道：法演举「频呼小玉元无事，只要檀郎认得声」，克勤闻而大悟，呈偈云「少年一段风流事，只许佳人独自知」，法演曰「你见得便从今日去，已后与天下人作是非，去在」。
  ref: 五灯会元·卷十九·圆悟克勤 / 碧岩录序
- text: 《碧岩录》评唱之体：先「垂示」纲宗，次举古则「本则」，次「著语」夹评，次「颂古」，次「评唱」发其奥——开禅宗评唱一体，影响千年。
  ref: 碧岩录·卷一（体例说明）
status: draft
verify: 待 CBETA 核对《圆悟佛果禅师语录》《碧岩录》；悟道艳诗与「茶禅一味」东传轶闻须注明待考。
