id: 舒州法华院全举禅师
name: 舒州法华院全举
school: —
teacher: 汾阳善昭禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0430a03。
sayings:
- text: 问。作么生是伽蓝。师曰。深山藏独虎。浅草露群蛇。曰。作么生是伽蓝中人。师曰。青松盖不得。黄叶岂能遮。曰。道甚么。师曰。少年玩尽天边月。潦倒扶桑没日头。曰。一句两句。云开月露。作么生。师曰。照破佛祖。到大愚芝和尚处。愚
  ref: X80n1565_p0430a03（五灯会元）
- text: 问。古人见桃花意作么生。师曰。曲不藏直。曰。那个且从。这个作么生。师曰。大街拾得金。四邻争得知。曰。上座还知么。师曰。路逢剑客须呈剑。不是诗人不献诗。曰。作家诗客。师曰。一条红线两人牵。曰。玄沙道。谛当甚谛当。敢保老兄未彻在。又作么生。师曰。海枯终见底。人死不知心。曰。却是。师曰。楼阁凌云势。峰峦叠翠层。到琅邪觉和尚处。邪
  ref: X80n1565_p0430a03（五灯会元）
- text: 问。近离甚处。师曰。两浙。曰。船来陆来。师曰。船来。曰。船在甚处。师曰。步下。曰。不涉程途一句。作么生道。师以坐具摵一摵曰。杜撰长老。如麻似粟。拂袖而出。邪问侍者。此是甚么人。者曰。举上座。邪曰。莫是举师叔么。先师教我寻见伊。遂下。旦过问上座。莫是举师叔么。莫怪适来相触忤。师便喝。复
  ref: X80n1565_p0430a03（五灯会元）
- text: 问。长老何时到汾阳。邪曰。某时到。师曰。我在浙江早闻你名。元来见解祇如此。何得名播寰宇。邪遂作礼曰。某甲罪过。师到杭州西庵。庵主曾见明招。主举颂曰。绝顶西峰上。峻机谁敢当。超然凡圣外。瞥起两重光。师曰。如何是两重光。主曰。月从东出。日向西没。师曰。庵主未见明招时如何。主曰。满盏油难尽。师曰。见后如何。主曰。多心易得干。住后
  ref: X80n1565_p0430a03（五灯会元）
- text: 僧问。如何是夺人不夺境。师曰。白菊乍开重日暖。百年公子不逢春。曰。如何是夺境不夺人。师曰。大地绝消息。翛然独任真。曰。如何是人境两俱夺。师曰。草荒人变色。凡圣两齐空。曰。如何是人境俱不夺。师曰。清风与明月。野老笑相亲
  ref: X80n1565_p0430a03（五灯会元）
- text: 上堂。释迦不出世。达磨不西来。佛法遍天下。谈玄口不开
  ref: X80n1565_p0430a03（五灯会元）
- text: 上堂。钟鸣鼓响。鹊噪鸦鸣。为你诸人说般若．讲涅槃了也。诸人还信得及么。观音菩萨向诸人面前作大神通。若信不及。却往他方救苦利生去也
  ref: X80n1565_p0430a03（五灯会元）
- text: 上堂。开口又成增语。不开口又成剩语。乃曰。金轮天子𠡠。草店家风别
  ref: X80n1565_p0430a03（五灯会元）
- text: 上堂。三世诸佛。口挂壁上。天下老和尚作么生措手。你诸人到诸方作么生举。山僧恁么道。也是久日桦来唇。喝一喝
  ref: X80n1565_p0430a03（五灯会元）
- text: 上堂。古者道。我若一向举扬宗教。法堂里草深一丈。不可为阇黎锁却僧堂门去也。虽然如是。也是乌龟陆地弄尘行
  ref: X80n1565_p0430a03（五灯会元）
- text: 上堂。语渐也返常合道。论顿也不留朕迹。直饶论其顿返其常。也是抑而为之
  ref: X80n1565_p0430a03（五灯会元）
- text: 问。牛头未见四祖时。为甚么百鸟衔花献。师曰。果熟猿兼重。曰。见后为甚么不衔花。师曰。林疏鸟不过
  ref: X80n1565_p0430a03（五灯会元）
- text: 问。七星光彩天将晓。不犯皇风试道看。师曰。将军马蹄红。曰。错。师便打。僧礼拜。展坐具始收。师曰。一展一收。法法皆周。拟欲更
  ref: X80n1565_p0430a03（五灯会元）
- text: 问。著甚来由。遂
  ref: X80n1565_p0430a03（五灯会元）
- text: 问。会么。僧曰。不会。师便打
  ref: X80n1565_p0430a03（五灯会元）
