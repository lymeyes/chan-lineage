id: L::安吉州天圣守道禅师
name: 安吉州天圣守道
school: 云门宗
teacher: 金山新
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0601b04。
sayings:
- text: 上堂。日月绕须弥。人间分昼夜。南阎浮提人祇被明暗色空留碍。且道不落明暗一句作么生道。良久曰。柳色黄金嫩。梨花白雪香。参
  ref: X80n1565_p0601b04（五灯会元）
- text: 上堂。不从一地至一地。寂灭性中宁有位。释迦稽首问然灯。仁者何名为受记。便下座。五灯会元灯会元青原下十世下青原下十世下
  ref: X80n1565_p0601b04（五灯会元）
