id: 建州白云令弇禅师
name: 建州白云令弇
school: 青原系
teacher: 罗山闲
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0275b10。
sayings:
- text: 上堂。遣往先生门。谁云对丧主。珍重
  ref: X80n1565_p0275b10（五灯会元）
- text: 僧问。己事未明。以何为验。师曰。木镜照素容。曰。验后如何。师曰。不争多
  ref: X80n1565_p0275b10（五灯会元）
- text: 问。三台有请。四众临筵。既处当仁。请师一唱。师曰。要唱也不难。曰。便请。师曰。夜静水寒鱼不食。满船空载月明归
  ref: X80n1565_p0275b10（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0275b10），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
