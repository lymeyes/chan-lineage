name: 常德府德山无诤慧初
school: 黄龙派
teacher: 黄龙道震禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0715a15。
sayings:
- text: 上堂。顾视大众曰。见么。在天成象。在地成形。在日月为晦为朔。在四时为寒为暑。鼓之以雷霆。润之以风雨。且道在衲僧分上。又作么生。一趯趯翻四大海。一拳拳倒须弥山。佛祖位中留不住。又吹渔笛汨罗湾
  ref: X80n1565_p0715a15（五灯会元）
- text: 上堂。九月二十五。聚头相共举。瞎却正法眼。拈却云门普。德山不会说禅。赢得村歌社舞。阿呵呵。逻啰哩。遂作舞。下座
  ref: X80n1565_p0715a15（五灯会元）
