id: 福州玉泉义隆禅师
name: 福州玉泉义隆
school: 法眼宗
teacher: 天台德韶国师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0372a15。
sayings:
- text: 上堂。山河大地。尽在诸人眼睛里。因甚么说会与不会。时有
  ref: X80n1565_p0372a15（五灯会元）
- text: 僧问。山河大地眼睛里。师今欲更指归谁。师曰。祇为上座去处分明。曰。若不上来伸此
  ref: X80n1565_p0372a15（五灯会元）
- text: 问。焉知方便不虗施。师曰。依俙似曲才堪听。又被风吹别调中
  ref: X80n1565_p0372a15（五灯会元）
