bio: 生平部分原文未载，仅存机缘语（见下）；据《续传灯录》T51n2077_p0551b12。
sayings:
- text: 僧问。壁立千仞水泄不通。还许学人请益也无。师曰。汝待问什么
  ref: T51n2077_p0551b12（续传灯录）
- text: 僧云。向上事。师曰。维那不在
  ref: T51n2077_p0551b12（续传灯录）
- text: 僧云。触忤和尚。师曰。正令已行。乃曰。穷外无方究内非里。应用万般无可比拟。分明向汝诸人道。佛性精魂总不是
  ref: T51n2077_p0551b12（续传灯录）
