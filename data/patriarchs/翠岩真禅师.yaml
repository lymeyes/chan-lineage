id: 翠岩真禅师
name: 翠岩真
school: —
teacher: 石霜楚圆禅师
status: draft
bio: 语录序石霜山中有三角虎，孤游独坐，万木生风，至于千里无人，艸深一丈。有一人撩其头而得道，是为黄龙慧南；有一人履其尾而得道，是为翠岩可真。南之子孙，江西、湖南若揭日月，而真得子晚，所乳之子是为沩山道人慕喆。林栖谷隐，坚密深静，霜露果熟，诸圣推出，枯木朽株，云行雨施，然后翠岩之道光明。盖翠岩之入石霜，适遭一吼，凡圣情尽，参承咨决，彻佛彻祖，行住坐卧，亘古亘今。如行川之水，无不盈之科；似走盘之珠，无可留之影。十圣三贤当路，亦须艸偃风行；四方八面俱来，无不投戈散地。金章玉句，具在可知。然明月夜光，多逢桉剑；阳春白雪，难为赏音。维黄龙罢参之客，必遣之曰：百炼精金，直须入翠岩炉𫖔。今坐镇诸方，龙吟虎啸者，无不称翠岩室中之句，以接大根器凡夫，而丛林号为真点胸者。盖同门数老，虽目视耽耽，文彩炳焕，似从慈明法窟中来，实不解石霜上树之机耳。各梦同床，不妨殊调，冷灰𪹼豆，聊为解嘲云
