id: 天衣义怀禅师
name: 天衣义怀
alias: 天衣怀
school: 云门宗
teacher: 雪窦重显禅师
status: draft
bio: 永嘉乐清陈氏子也。世以渔为业。母梦星殒于屋乃孕。及产尤多吉祥。儿时坐船尾。父得鱼付师贯之。师不忍乃私投江中。父怒笞之。师恬然如故。长游京师依景德寺为童行。天圣中试经得度。谒金銮善叶县省。皆蒙印可。遂由洛抵龙门。复至都下欲继宗风。意有未决。忽遇言法华拊师背曰。云门临济。去及至姑苏礼明觉于翠峰。觉
sayings:
- text: 问。汝名甚么。曰义怀。觉曰。何不名怀义。曰当时致得。觉曰。谁为汝立名。曰受戒来十年矣。觉曰。汝行脚费多少草鞋。曰和尚莫瞒人好。觉曰。我也没量罪过汝也没量罪过尔作么生。师无语。觉打曰。脱空谩语汉出去。入室次。觉曰。恁么也不得不恁么也不得恁么不恁么总不得。师拟议。觉又打出。如是者数四。寻为水头。因汲水折担忽悟。作投机偈曰。一二三四五六七。万仞峰头独足立。骊龙颔下夺明珠。一言勘破维摩诘。觉闻拊几称善。后七坐道场。化行海内嗣法者甚众。住后
  ref: T51n2077_p0501b09（续传灯录）
- text: 僧问。如何是佛。师曰。布发掩泥横身卧地。曰意旨如何。师曰。任是波旬也皱眉。曰恁么则谢师指示。师曰。西天此土。问学人上来请师说法。师曰。林间鸟噪水底鱼行
  ref: T51n2077_p0501b09（续传灯录）
- text: 上堂。须弥顶上不扣金钟。毕钵岩中无人聚会。山僧倒骑佛殿。诸人反著草鞋。朝游檀特暮到罗浮。拄杖针筒自家收取
  ref: T51n2077_p0501b09（续传灯录）
- text: 上堂。衲僧横说竖说。未知有顶门上眼。时有
  ref: T51n2077_p0501b09（续传灯录）
- text: 僧问。如何是顶门上眼。师曰。衣穿瘦骨露。屋破看星眠
  ref: T51n2077_p0501b09（续传灯录）
- text: 上堂。夫为宗师须是驱耕夫之牛夺饥人之食。遇贱即贵遇贵即贱。驱耕夫之牛令他苗稼丰登。夺饥人之食令他永绝饥渴。遇贱即贵握土成金。遇贵即贱变金成土。老僧亦不驱耕夫之牛亦不夺饥人之食。何谓耕夫之牛。我复何用。饥人之食。我复何餮。我也不握土成金也不变金作土。何也。金是金土是土。玉是玉石是石。僧是僧俗是俗。古今天地古今日月古今山河古今人伦。虽然如是。打破大散关几个迷逢达磨
  ref: T51n2077_p0501b09（续传灯录）
- text: 上堂。雁过长空影沈寒水。雁无遗踪之意。水无留影之心。若能如是方解向异类中行。不用续凫截鹤夷岳盈壑。放行也百丑千拙。收来也挛挛拳拳。用之则敢与八大龙王斗富。不用都来不直半分钱。参
  ref: T51n2077_p0501b09（续传灯录）
- text: 僧问。天不能盖地不能载。未审是甚么人。师曰。掘地深埋。曰此人还受安排也无。师曰。土上更加泥。问牛头未见四祖时如何。师曰。长江无六月。曰见后如何。师曰。一年一度春。室中问僧。无手人能行拳。无舌人解言语。忽然无手人打无舌人。无舌人道个甚么又曰。蜀魄连宵叫。鵽鸠终夜啼。圆通门大启。何事隔云泥。晚年以疾居池阳杉山庵。门弟子智才住临平之佛日。迎归侍奉。才如苏城未还。师速其归。及踵门师告之曰。时至吾行矣。才曰。师有何语示徒。乃说偈曰。红日照扶桑。寒云封华岳。三更过铁围。拶折骊龙角。才
  ref: T51n2077_p0501b09（续传灯录）
- text: 问。卵塔已成如何是毕竟事
  ref: T51n2077_p0501b09（续传灯录）
- text: 师举拳示之。遂就寝推枕而寂。塔全身寺东之原。崇宁中谥振宗禅师
  ref: T51n2077_p0501b09（续传灯录）
