id: 桂州寿宁善资禅师
name: 桂州寿宁善资
school: 黄龙派
teacher: 宝峰文
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0681b16。
sayings:
- text: 上堂。若论此事。如鸦󲣅铁牛。无下口处。无用心处。更向言中问觅。句下寻思。纵饶卜度将来。翻成戏论边事。殊不知本来具足。直下分明。佛及众生。纤毫不立。寻常向诸人道。凡夫具足圣人法。凡夫不知。圣人具足凡夫法。圣人不会。圣人若会。即同凡夫。凡夫若知。即是圣人。然则凡圣一致。名相互陈。不识本源。迷其真觉。所以逐境生心。徇情附物。苟能一念情忘。自然真常体露。良久曰。便请荐取
  ref: X80n1565_p0681b16（五灯会元）
- text: 上堂。诸方五日一参。寿宁日日升座。莫怪重说偈言。过在西来达磨。上士处处逢渠。后学时时蹉过。且道蹉过一著。落在甚么处。举起拂子曰。一片月生海。几家人上楼
  ref: X80n1565_p0681b16（五灯会元）
