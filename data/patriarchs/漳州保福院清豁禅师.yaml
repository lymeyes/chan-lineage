id: 漳州保福院清豁禅师
name: 漳州保福院清豁
school: —
teacher: 睡龙溥禅师
status: draft
bio: 福州人也。少而聪敏。礼鼓山国师。落发禀具。后谒大章山如庵主语具如庵主章。后参睡龙。龙问曰。豁阇黎见何尊宿来。还悟也未。曰。清豁尝访大章。得个信处。龙于是
sayings:
- text: 上堂集众。召曰。豁阇黎出来。对众烧香说悟处。老僧与汝证明。师出众。乃拈香曰。香已拈了。悟即不悟。龙大悦而许之
  ref: X80n1565_p0301a14（五灯会元）
- text: 上堂。山僧今与诸人作个和头。和者默然。不和者说。良久曰。和与不和。切在如今。山僧带些子事。珍重
  ref: X80n1565_p0301a14（五灯会元）
- text: 僧问。家贫遭劫时如何。师曰。不能尽底去。曰。为甚么不能尽底去。师曰。贼是家亲。曰。既是家亲。为甚么翻成家贼。师曰。内既无应。外不能为。曰。忽然捉败时如何。师曰。内外绝消息。曰。捉败后功归何所。师曰。赏亦未曾闻。曰。恁么则劳而无功也。师曰。功即不无。成而不处。曰。既是成功。为甚么不处。师曰。不见道。太平本是将军致。不使将军见大平
  ref: X80n1565_p0301a14（五灯会元）
- text: 问。如何是西来意。师曰。胡人泣。汉人悲。师忽舍众。欲入山待灭。乃遗偈曰。世人休说路行难。鸟道羊肠咫尺间。珍重苧谿谿畔水。汝归沧海我归山。即往贵湖卓庵。未几谓门人曰。吾灭后将遗骸施诸虫蚁。勿置坟塔。言讫入湖头山。坐磐石。俨然长往。门人禀遗命。延留七日。竟无虫蚁之所侵食。遂就阇维。散于林野
  ref: X80n1565_p0301a14（五灯会元）
