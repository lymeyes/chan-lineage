id: 净因道臻禅师
name: 净因道臻
alias: 净因臻
school: 临济宗
teacher: 浮山法远禅师
status: draft
bio: 福州古田戴氏子也。父梦伟然黄冠裳者导从至舍。母遂妊。又梦天乐黄幡梵呗引厖眉碧眼一僧至。即诞师。幼不茹荤。十四岁投上生院出家持头陀行。十九为大僧。阅大小经论。置不读曰。此方便说耳。即持一钵走江淮。所参知识甚多而得旨于浮山。江州承天虚席欲致师。非师所欲。乃游丹阳寓止因圣寺。一日行江上顾舟默计曰。当随所往信吾缘也。问舟师曰。载我船尾可乎。舟师笑曰。师欲何之我入汴船也。师因曰。吾偶欲游京师。遂载之而北。谒净因大觉琏禅师。琏使首众于坐下。及琏归吴。众请以师嗣焉。开法之日英宗遣中使。降香赐紫方袍觉照师号。京师都会好恶万端。贵人达官盈门。而师一目之。万口一辞咸以为本色道人。莫不加敬。积数年元丰三年春。慈圣光献上仙。神宗诏至庆寿宫说法
sayings:
- text: 僧问。慈圣仙游定归何所。师曰。水流元在海。月落不离天。上大悦。诏设高广坐恣人问答。左右上下得未曾有。欢声动宫殿。赐与甚厚。又语执政。道臻素有德行。可择一美号进呈。乃赐号净照禅师。京城创诸禅刹。辟相国寺为慧林智海二禅寺。其命主僧必使师择之。宿老皆从风而靡。高丽使三僧来就学。师随根开导皆契宗旨。师为人渠渠静退似不能言。性慈祥纯谨奉身至约。一布裙二十年不易。无所嗜好。尝雪方丈之西壁。请文与可扫墨竹。谓人曰。吾使游人见之心自清凉。此君盖替我说法也。所居都城西隅衲子四十余辈。颓然不出户。三十年如一日。元祐八年八月十七日。忽语门弟子净圆曰。吾更三日行矣。及期沐浴更衣说偈已跏趺而化。阅世八十。坐六十一夏。黄鲁直尝题其像曰。老虎无齿卧龙不吟。千林月黑六合云阴。远山作眉红杏腮。嫁与春风不用媒。老婆三五少年日。也解东涂西抹来。可想见其高致也。师初出世
  ref: T51n2077_p0519c02（续传灯录）
- text: 僧问。师唱谁家曲宗风嗣阿谁。师曰。有钱使钱无钱守贫
  ref: T51n2077_p0519c02（续传灯录）
- text: 僧云。月华嫡子临济儿孙。师曰。放尔三十棒。问如何是净因境。师曰。法广殿牌仁宗亲写
  ref: T51n2077_p0519c02（续传灯录）
- text: 僧云。如何是境中人。师曰。六代祖师天下闻。问如何是道中人。师曰。万家烟火外一枕水云间。问如何是佛。师曰。朝妆香暮换火。问如何是观音妙智力。师曰。河南犬吠河北驴鸣。问如何是祖师西来意。师曰。拄杖横担不到肩
  ref: T51n2077_p0519c02（续传灯录）
- text: 僧云。谢师答话。师曰。错认定盘星。乃曰。一问一答无有尽时。古人唤作无尽藏海。亦呼为方便门。于纳僧面前远矣。何故权柄在手纵夺自由。坐断毘卢壁立千忉。善财楼阁孰肯闲游。华藏琅函岂能看取。丈夫猛利本合如然。过后思量成第二月。除兹投机徇器止宿草庵。就下平高曲成万物。周流无滞触处皆通。苟不尽毫毛自取其咎。如斯谈说笑杀衲僧。且道谁是解笑者。良久曰。看取。便下座。又
  ref: T51n2077_p0519c02（续传灯录）
- text: 示众拈拄杖曰。楖栗木杖子。善能谈佛祖。聋人既得闻。哑人亦解语。指白石为玉。点黄金为土。便恁么会去。他家未相许。不相许莫莽卤。南街打鼓北街舞。卓一下
  ref: T51n2077_p0519c02（续传灯录）
