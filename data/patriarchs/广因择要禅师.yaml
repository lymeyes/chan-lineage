bio: 生平部分原文未载，仅存机缘语（见下）；据《续传灯录》T51n2077_p0497c14。
sayings:
- text: 上堂。王临宝位胡汉同风。纽半破三佛殿倒卓藏身句即不
  ref: T51n2077_p0497c14（续传灯录）
- text: 问。尔透出一字作么生道。拈拄杖曰。春风开竹户。夜雨滴花心
  ref: T51n2077_p0497c14（续传灯录）
- text: 上堂。古者道。只恐为僧心不了。为僧心了总输僧。且如何是诸上座了底心。良久曰。渔翁睡重春潭阔。白鸟不飞舟自横
  ref: T51n2077_p0497c14（续传灯录）
- text: 僧问。如何是祖师西来意。师曰。长安东洛阳西。问如何是佛。师曰。福州橄榄两头尖。问佛未出世时如何。师曰。隈岩傍壑。曰出世后如何。师曰。前山后山
  ref: T51n2077_p0497c14（续传灯录）
