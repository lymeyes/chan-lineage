id: 潭州神山僧密禅师
name: 潭州神山僧密
school: 青原系
teacher: 云岩晟
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0185a05。
sayings:
- text: 问。作甚么。师曰。打罗。曰。手打脚打。师曰。却请和尚道。泉曰。分明记取。向后遇明眼作家。但恁么举似云岩代云。无手脚者始解打。师与洞山渡水。山曰。莫错下脚。师曰。错即过不得也。山曰。不错底事作么生。师曰。共长老过水。一日。与洞山鉏茶园。山掷下镢头曰。我今日一点气力也无。师曰。若无气力。争解恁么道。山曰。汝将谓有气力底是。裴大夫问僧。供养佛。佛还吃否。僧曰。如大夫祭家神。大夫举似云岩。岩曰。这僧未出家在。曰。和尚又如何。岩曰。有几般饭食。但一时下来。岩却问师。一时下来又作么生。师曰。合取钵盂。岩肯之
  ref: X80n1565_p0185a05（五灯会元）
- text: 问。一地不见二地时如何。师曰。汝莫错否。汝是何地
  ref: X80n1565_p0185a05（五灯会元）
- text: 问。生死事。乞师一言。师曰。汝何时死去来。曰。某甲不会。请师说。师曰。不会须死一场始得。师与洞山行次。忽见白兔走过。师曰。俊哉。洞曰。作么生。师曰。大似白衣拜相。洞曰。老老大大。作这个说话。师曰。你作么生。洞曰。积代簪缨。暂时落魄。师把针次。洞山问曰。作甚么。师曰。把针。洞曰。把针事作么生。师曰。针针相似。洞曰。二十年同行。作这个语话。岂有与么工夫。师曰。长老又作么生。洞曰。如大地火发底道理。师问洞山。智识所通。莫不游践。径截处乞师一言。洞曰。师伯意何得取功。师因斯顿觉。下语非常。后与洞山过独木桥。洞先过了。拈起木桥曰。过来。师唤价阇黎。洞乃放下桥木
  ref: X80n1565_p0185a05（五灯会元）
