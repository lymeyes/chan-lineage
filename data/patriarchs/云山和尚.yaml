id: 云山和尚
name: 云山
school: 临济宗
teacher: 临济义玄禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0398b02。
sayings:
- text: 问。还将得西京主人书来否。曰。不敢妄通消息。师曰。作家师僧。天然有在。曰。残羹馊饭谁吃。师曰。独有阇黎不甘吃。其僧乃作吐势。师唤侍者曰。扶出这病僧著。僧便出去。师见僧来。便作起势。僧便出去。师曰。得恁么灵利。僧便喝曰。作这个眼目。承嗣临济。也太屈哉。师曰。且望阇黎善传。僧回首。师喝曰。作这个眼目。错判诸方名言。随后便打。虎谿庵主虎谿庵主
  ref: X80n1565_p0398b02（五灯会元）
- text: 僧问。庵主在这里多少年也。师曰。祗见冬凋夏长。年代总不记得。曰。大好不记得。师曰。汝道我在这里得多少年也。曰。冬凋夏长。𫆏。师曰。闹市里虎。僧到相看。师不顾。僧曰。知道庵主有此机锋。师鸣指一下。僧曰。是何宗旨。师便打。僧曰。知道今日落人便宜。师曰。犹要棒吃在。有僧才入门。师便喝。僧默然。师便打。僧却喝。师曰。好个草贼。有僧到。近前曰。不审庵主。师曰。阿谁。僧便喝。师曰。得恁么无宾主。曰。犹要第二喝在。师便喝。有
  ref: X80n1565_p0398b02（五灯会元）
- text: 僧问。和尚何处人事。师曰。陇西人。曰。承闻陇西出鹦鹉。是否。师曰。是。曰。和尚莫不是否。师便作鹦鹉声。僧曰。好个鹦鹉。师便打
  ref: X80n1565_p0398b02（五灯会元）
