bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0551a01。
sayings:
- text: 上堂。有句无句。明来暗去。活捉生擒。捷书露布。如藤倚树。物以类聚。海外人参。蜀中绵附。树倒藤枯。切忌名模。句归何处。苏𠰷苏𠰷。呵呵大笑。破镜不照。大地茫茫。一任𨁝跳
  ref: X80n1565_p0551a01（五灯会元）
