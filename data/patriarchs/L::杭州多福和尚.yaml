id: L::杭州多福和尚
name: 杭州多福
school: 南岳系
teacher: 赵州谂
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0156b17。
sayings:
- text: 僧问。如何是多福一丛竹。师曰。一茎两茎斜。曰。学人不会。师曰。三茎四茎曲
  ref: X80n1565_p0156b17（五灯会元）
- text: 问。如何是衲衣下事。师曰。大有人疑著在。曰。为甚么如是。师曰。月里藏头
  ref: X80n1565_p0156b17（五灯会元）
