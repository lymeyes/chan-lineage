id: 安吉州道场有规禅师
name: 安吉州道场有规
school: 云门宗
teacher: 法云本
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0639a07。
sayings:
- text: 上堂。拈拄杖曰。还见么。穷诸玄辩。若一毫置于太虗。竭世枢机。似一滴投于巨壑。德山老人虽则焚其疏钞。也是贼过后张弓。且道文彩未彰以前。又作么生理论。三千剑客今何在。独许庄周致太平
  ref: X80n1565_p0639a07（五灯会元）
- text: 上堂。种田博饭。地藏家风。客来吃茶。赵州礼度。且道护圣门下。别有甚么长处。良久曰。寻常不放山泉出。屋底清池冷照人。化士出
  ref: X80n1565_p0639a07（五灯会元）
- text: 问。促装已办。乞师一言。师曰。好看前路事。莫比在家时。曰。恁么则三家村里。十字街头。等个人去也。师曰。照顾打失布袋
  ref: X80n1565_p0639a07（五灯会元）
