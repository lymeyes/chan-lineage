id: L::安吉州景清院居素禅师
name: 安吉州景清院居素
school: 临济宗
teacher: 谷隐聪
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0437a07。
sayings:
- text: 僧问。即此见闻非见闻。为甚么法身有三种病。二种光。师曰。填凹就缺
  ref: X80n1565_p0437a07（五灯会元）
- text: 问。承和尚有言。寰中天子𠡠。塞外将军令。如何是塞外将军令。师曰。揭。曰。其中事如何。师曰。蹴。曰。莫便是和尚为人处也无。师弹指一下
  ref: X80n1565_p0437a07（五灯会元）
- text: 问。远远投师。乞师一接。师曰。新罗人打鼓。曰。如何领会。师曰。舶主未曾逢
  ref: X80n1565_p0437a07（五灯会元）
- text: 问。如何是末上一句。师曰。金刚树下。曰。如何是末后一句。师曰。拘尸城边。曰。向上更有事也无。师曰。有。曰。如何是向上事。师曰。波旬拊掌呵呵笑。迦叶头擡不识人
  ref: X80n1565_p0437a07（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0437a07），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
