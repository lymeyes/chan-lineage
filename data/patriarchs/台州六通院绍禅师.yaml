id: 台州六通院绍禅师
name: 台州六通院绍
school: 青原系
teacher: 涌泉欣
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0212b11。
sayings:
- text: 问。甚么处去来。师曰。烧畬来。泉曰。火后事作么生。师曰。铁蛇钻不入。住后
  ref: X80n1565_p0212b11（五灯会元）
- text: 僧问。不出咽喉唇吻事如何。师曰。待汝一镢𣃁断巾子山。我亦不向汝道
  ref: X80n1565_p0212b11（五灯会元）
- text: 问。南山有一毒蛇。如何近得。师曰。非但阇黎。千圣亦近不得。人
  ref: X80n1565_p0212b11（五灯会元）
- text: 问。承闻南方有一剑话。如何是一剑。师曰。不当锋。曰。头落又作么生。师曰。我道不当锋。有甚么头。其人礼谢而去
  ref: X80n1565_p0212b11（五灯会元）
- text: 问。父母未生时。那人何处立。师曰。卦兆未兴。孙膑失算
  ref: X80n1565_p0212b11（五灯会元）
- text: 问。如何是大千顶。师曰。不与众峰齐。师休夏。入天台山华顶峰晦迹。莫知所终
  ref: X80n1565_p0212b11（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0212b11），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
