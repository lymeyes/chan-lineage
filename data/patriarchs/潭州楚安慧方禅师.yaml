id: 潭州楚安慧方禅师
name: 潭州楚安慧方
school: 杨岐派
teacher: 文殊道禅师
status: draft
bio: 本郡许氏子。参道禅师于大别。未几改寺为神霄宫。附商舟过湘南。舟中闻岸人操乡音。厉声云。叫那。由是有省。即说偈曰。沔水江心唤一声。此时方得契平生。多年相别重相见。千圣同归一路行。住后
sayings:
- text: 上堂。临老方称住持。全无些子玄机。开口十字九乖。问东便乃答西。如斯出世。讨甚玄微。有时拈三放两。有时就令而施。虽然如是。同道方知。且道知底事作么生。直须打翻鼻孔始得
  ref: X80n1565_p0817a01（五灯会元）
- text: 上堂。达磨祖师在脚底。踏不著兮提不起。子细当头放下看。病在当时谁手里。张公会看脉。李公会使药。两个竞头医。一时用不著。药不相投。错错。吃茶去
  ref: X80n1565_p0817a01（五灯会元）
