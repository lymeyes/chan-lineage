id: 眉州象耳山袁觉禅师
name: 眉州象耳山袁觉
school: 杨岐派
teacher: 圆悟克勤禅师
status: draft
bio: 郡之袁氏子。出家传灯。试经得度。本名圆觉。郡守填祠牒。误作袁字。疑师慊然。戏谓之曰。一字名可乎。师笑曰。一字已多。郡守异之。既受具出蜀。遍谒有道尊宿。后往大沩。依佛性。顷之。入室陈所见。性曰。汝忒煞远在。然知其为法器。俾充侍者。掌宾客。师每侍性。性必举法华开示悟入四字。令下语。又曰。直待我竖点头时。汝方是也。偶不职。被斥。制中无依。寓俗士家。一日诵法华至亦复不知。何者是火。何者为舍。乃豁然。制罢归省。性见首肯之。圆悟再得旨住云居。师至彼。以所得白悟。悟呵云。本是净地。屙屎作么。师所疑顿释。绍兴丁巳。眉之象耳虗席。郡守谓此道场久为蟊螣囊槖。非名流胜士。莫能起废。诸禅举师应聘。尝语客曰。东坡云。我持此石归。袖中有东海。山谷云。惠崇烟雨芦雁。坐我潇湘洞庭。欲唤扁舟归去。傍人谓是丹青。此禅髓也。又曰。我敲床竖拂时。释迦老子．孔夫子都齐立在下风。有举此语似佛海远禅师。远曰。此觉老语也。我此间即不恁么
