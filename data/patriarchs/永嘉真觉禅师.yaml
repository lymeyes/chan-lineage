id: 永嘉真觉禅师
name: 永嘉真觉
school: —
teacher: 六祖大鉴旁出
status: draft
bio: 讳玄觉。本郡戴氏子。丱岁出家。遍探三藏。精天台止观圆妙法门。于四威仪中。常冥禅观。后因左谿朗禅师激励。与东阳䇿禅师同诣曹溪。初到振锡。绕祖三匝。卓然而立。祖曰。夫沙门者。具三千威仪。八万细行。大德自何方而来。生大我慢。师曰生死事大。无常迅速。祖曰。何不体取无生．了无速乎。师曰。体即无生。了本无速。祖曰。如是。如是。于时大众无不愕然。师方具威仪参礼。须臾告辞。祖曰。返大速乎。师曰。本自非动。岂有速邪。祖曰。谁知非动。师曰。仁者自生分别。祖曰。汝甚得无生之意。师曰。无生岂有意邪。祖曰。无意谁当分别。师曰。分别亦非意。祖叹曰。善哉。善哉。少留一宿。时谓一宿觉矣。师翌日下山。乃回温州。学者辐凑。著证道歌一首。及禅宗悟修圆旨。自浅之深。庆州刺史魏靖缉而序之。成十篇。目为永嘉集。并行于世　慕道志仪第一。夫欲修道。先须立志。及事师仪则。彰乎轨训。故标第一。明慕道仪式。戒㤭奢意第二。初虽立志修道。善识轨仪。若三业㤭奢。妄心扰动。何能得定。故次第二。明戒㤭奢意也。净修三业第三。前戒㤭奢。略标纲要。今子细检责。令麁过不生。故次第三。明净修三业。戒乎身口意也。奢摩他颂第四。已检责身口。令麁过不生。次须入门修道渐次。不出定慧五种起心。六种料拣。故次第四。明奢摩他颂也。毗婆舍那颂第五。非戒不禅。非禅不慧。上既修定。定久慧明。故次第五。明毗婆舍那颂也。优毕叉颂第六。偏修于定。定久则沈。偏学于慧。慧多心动。故次第六。明优毕叉颂等于定慧。令不沈动。使定慧均等。舍于二边。三乘渐次第七。定慧既均。则寂而常照。三观一心。何疑不遣。何照不圆。自解虽明。悲他未悟。悟有深浅。故次第七。明三乘渐次也。事理不二第八。三乘悟理。理无不穷。穷理在事。了事即理。故次第八。明事理不二。即事而真。用祛倒见也。劝友人书第九。事理既融。内心自莹。复悲远学。虗掷寸阴。故次第九。明劝友人书也。发愿文第十。劝友虽是悲他。专心在一。情犹未普。……（原文更长，见 cbeta 锚点）
sayings:
- text: 问。甚处来。曰。大日山来。峰曰。日出也未。师曰。若出则镕却雪峰峰曰。汝名甚么。师曰。玄机。峰曰。日织多少。师曰。寸丝不挂。遂礼拜退。才行三五步。峰召曰。袈裟角拖地也。师回首。峰曰。大好寸丝不挂世传玄机乃永嘉大师女弟。尝同游方。以景云岁日考之。是矣．第所见雪峰。非真觉存也。永嘉既到曹谿。必岭下雪峰也。未详法嗣。故附于此
