id: 邓州中度禅师
name: 邓州中度
school: 青原系
teacher: 洛浦安禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0215b05。
sayings:
- text: 僧问。海内不逢师。如何是寰中主。师曰。金鸡常报晓。时人自不闻
  ref: X80n1565_p0215b05（五灯会元）
- text: 问。如何是暗中明镜。师曰。昧不得。曰。未审照何物。师曰。甚么物不照
  ref: X80n1565_p0215b05（五灯会元）
- text: 问。如何是实际理地不受一尘。佛事门中不舍一法。师曰。真常尘不染。海纳百川流。曰。请和尚离声色外答。师曰。木人常对语。有性不能言
  ref: X80n1565_p0215b05（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0215b05），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
