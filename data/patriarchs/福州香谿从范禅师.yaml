id: 福州香谿从范禅师
name: 福州香谿从范
school: 青原系
teacher: 岩头奯
status: draft
bio: 新到参。师曰。汝岂不是鼓山僧。僧曰。是。师曰。额上珠为何不见。僧无对。僧辞。师门送。复召。上座。僧回首。师曰。满肚是禅。曰。和尚是甚么心行。师大笑而已。师披衲衣次。说偈曰。迦叶上行衣。披来须捷机。才分招的箭。密露不藏龟
