id: 福州安国院慧球寂照禅师
name: 福州安国院慧球寂照
school: —
teacher: 玄沙师备禅师
status: draft
bio: 亦曰。中塔泉州莆田人也。玄沙室中。参讯居首。因
sayings:
- text: 问。如何是第一月。沙曰。用汝个月作么。师从此悟入。梁开平二年。玄沙将示灭。闽帅王氏遣子至。问疾。仍请密示继踵说法者谁。沙曰。球子得。王默记遗旨。乃问鼓山。卧龙法席。孰当其任。鼓山举城下宿德具道眼者十有二人。皆堪出世。王亦默之。至开堂日。官僚与僧侣俱会法筵。王忽问众曰。谁是球上座。于是众人指出师。王氏便请升座。师良久曰。莫嫌寂寞。莫道不堪。未详涯际。作么生论量。所以寻常用其音响。聊拨一两下。助他发机。若论来十方世界。觅一人为伴侣。不可得
  ref: X80n1565_p0281a03（五灯会元）
- text: 僧问。佛法大意。从何方便顿入。师曰。入是方便
  ref: X80n1565_p0281a03（五灯会元）
- text: 问。云自何山起。风从何㵎生。师曰。尽力施为。不离中塔
  ref: X80n1565_p0281a03（五灯会元）
- text: 上堂。我此间粥饭因缘。为兄弟举唱。终是不常。欲得省要。却是山河大地与汝发明。其道既常。亦能究竟。若从文殊门入者。一切无为。土木瓦砾。助汝发机。若从观音门入者。一切音响。虾蟆蚯蚓。助汝发机。若从普贤门入者。不动步而到。以此三门方便示汝。如将一只折箸搅大海水。令彼鱼龙知水为命。会么。若无智眼而审谛之。任汝百般巧妙。不为究竟
  ref: X80n1565_p0281a03（五灯会元）
- text: 问。学人近入丛林。不明己事。乞师指示。师以杖指之曰。会么。曰。不会。师曰。我恁么为汝。却成抑屈人。还知么。若约当人分上。从来底事。不论初入丛林。及过去诸佛。不曾乏少。如大海水。一切鱼龙初生及至老死。所受用水。悉皆平等
  ref: X80n1565_p0281a03（五灯会元）
- text: 问。不谬正宗。请师真实。师曰。汝替我道。曰。或有不辨者作么生。师曰。待不辨者来
  ref: X80n1565_p0281a03（五灯会元）
- text: 问。诸佛还有师否。师曰。有。曰。如何是诸佛师。师曰。一切人识不得
  ref: X80n1565_p0281a03（五灯会元）
- text: 上堂良久。有僧出礼拜。师曰。莫教髑髅拶损。僧参
  ref: X80n1565_p0281a03（五灯会元）
- text: 问。曰。去却仆从。便请相见。师曰。眨上眉毛看。曰。不与么时如何。师曰。山北去也
  ref: X80n1565_p0281a03（五灯会元）
- text: 问。从上宗乘事如何。师良久。僧再
  ref: X80n1565_p0281a03（五灯会元）
- text: 问。如何是大庾岭头事。师曰。料汝承当不得。曰。重多少。师曰。这般底论劫不奈何。师问了院主。祇如先师道。尽十方世界是真实人体。你还见僧堂么。了曰。和尚莫眼花。师曰。先师迁化。肉犹煖在
  ref: X80n1565_p0281a03（五灯会元）
