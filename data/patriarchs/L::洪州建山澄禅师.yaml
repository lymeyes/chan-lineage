id: L::洪州建山澄禅师
name: 洪州建山澄
school: —
teacher: 保福展
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0292a11。
sayings:
- text: 僧问。如何是法王剑。师曰。可惜许。曰。如何是人王剑。师曰。尘埋床下履。风动架头巾
  ref: X80n1565_p0292a11（五灯会元）
- text: 问。一代时教接引今时。未审祖宗如何示人。师曰。一代时教已有人问了也。曰。和尚如何示人。师曰。惆怅庭前红苋树。年年生叶不生花
  ref: X80n1565_p0292a11（五灯会元）
- text: 问。故岁已去。新岁到来。还有不受岁者也无。师曰。作么生。曰。恁么则不受岁也。师曰。城上已吹新岁角。窗前犹点旧年灯。曰。如何是旧年灯。师曰。腊月三十日
  ref: X80n1565_p0292a11（五灯会元）
