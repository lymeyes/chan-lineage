bio: 临济义玄之法嗣，临济宗第二代。临济将入灭，以正法眼藏付三圣慧然、兴化存奖等，嘱「吾灭后不得灭却吾正法眼藏」。存奖继主魏府兴化寺，机锋绵密，善勘验学人，于临济宗法脉之延续居功至要。门下高安大愚、保寿沼等。
sayings:
- text: 克宾维那公案：宾维那问「如何是佛法大意」，师便打，云：「者瞎汉，来者里纳败阙！」宾云：「诺。」（以峻烈钳锤折伏我慢）
  ref: 五灯会元·卷十一·兴化存奖
- text: 师示众：「我逢人即出，出即不为人；我逢人即不出，出即便为人。」（临济「人境」门风之流衍）
  ref: 五灯会元·卷十一·兴化存奖
