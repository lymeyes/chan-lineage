id: 越州石佛寺显忠祖印禅师
name: 越州石佛寺显忠祖印
school: —
teacher: 金山昙颖禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0454b01。
sayings:
- text: 僧问。如何是不动尊。师曰。热鏊上猢狲。曰。如何是千百亿化身。师曰。添香换水。点灯扫地。曰。如何是毗卢师法身主。师曰。系马柱。曰。有甚么交涉。师曰。缚杀这汉
  ref: X80n1565_p0454b01（五灯会元）
- text: 问。会杀佛祖底始是作家。如何是杀佛祖底剑。师曰。不斩死汉。曰。如何是和尚剑。师曰。令不重行
  ref: X80n1565_p0454b01（五灯会元）
- text: 问。如何是相生。师曰。山河大地。曰。如何是想生。师曰。兔子望月。曰。如何是流注生。师曰。无间断。曰。如何是色空。师曰。五彩屏风
  ref: X80n1565_p0454b01（五灯会元）
- text: 上堂。咄咄咄。海底鱼龙尽枯竭。三脚虾蟆飞上天。脱壳乌龟火中活
  ref: X80n1565_p0454b01（五灯会元）
- text: 上堂。点时不到。皂白未分。到时不点。和泥合水。露柱𨁝跳入灯笼里。即且从他。汝眉毛因甚么却拖在脚跟下。直饶于此明得。也是猢狲戴席帽。于此未明。何异曲󳭰穿靴。然虽如此。笑我者多。哂我者少
  ref: X80n1565_p0454b01（五灯会元）
