bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0572b10。
sayings:
- text: 僧问。如何是相轮峰。师曰。直耸烟岚际。曰。向上事如何。师曰。入地三尺五
  ref: X80n1565_p0572b10（五灯会元）
- text: 问。如何是佛法大意。师曰。兴义门前𭽸冬鼓。曰。学人不会。师曰。朝打三千。暮打八百
  ref: X80n1565_p0572b10（五灯会元）
