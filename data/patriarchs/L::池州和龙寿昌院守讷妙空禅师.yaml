id: L::池州和龙寿昌院守讷妙空禅师
name: 池州和龙寿昌院守讷妙空
school: —
teacher: 雪峰存
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0268a01。
sayings:
- text: 僧问。未到龙门。如何凑泊。师曰。立命难存。新到参
  ref: X80n1565_p0268a01（五灯会元）
- text: 师问。近离甚处。曰。不离方寸。师曰。不易来。僧亦曰。不易来。师与一掌
  ref: X80n1565_p0268a01（五灯会元）
- text: 问。如何是传底心。师曰。再三嘱汝。莫向人说
  ref: X80n1565_p0268a01（五灯会元）
- text: 问。如何是从上宗乘。师曰。向阇黎口里著得么
  ref: X80n1565_p0268a01（五灯会元）
- text: 问。省要处请师一接。师曰。甚是省要
  ref: X80n1565_p0268a01（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0268a01），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
