id: 临安府净慈肯堂彦充禅师
name: 临安府净慈肯堂彦充
school: 杨岐派
teacher: 东林道颜禅师
status: draft
bio: 于潜盛氏子。幼依明空院义堪为师。首参大愚宏智．正堂大圆。后闻东林谓众曰。我此间别无玄妙。祇有木札羹。铁钉饭。任汝咬嚼。师窃喜之。直造谒。陈所见解。林曰。据汝见处。正坐在鉴觉中。师疑不已。将从前所得底一时飏下。一日。闻僧举南泉道。时人见此一株华。如梦相似。默有所觉。曰。打草祇要虵惊。次日入室。林
sayings:
- text: 问。那里是岩头密启其意处。师曰。今日捉败这老贼。林曰。达磨大师性命在汝手里。师拟开口。蓦被拦胸一拳。忽大悟。直得汗流浃背。点首自谓曰。临济道。黄檗佛法无多子。岂虗语邪。遂呈颂曰。为人须为彻。杀人须见血。德山与岩头。万里一条铁。林然之。住后
  ref: X80n1565_p0825b12（五灯会元）
- text: 上堂。世尊不说说。迦叶不闻闻。卓拄杖曰。水流黄叶来何处。牛带寒鸦过远村
  ref: X80n1565_p0825b12（五灯会元）
- text: 示众云。尽大地是个解脱门。因甚把手拽不入。师曰。大小雪峰话作两橛。既尽大地是个解脱门。用拽作么
  ref: X80n1565_p0825b12（五灯会元）
- text: 上堂。一向与么去。法堂前草深一丈。一向与么来。脚下泥深三尺。且道如何即是。三年逢一闰。鸡向五更啼
  ref: X80n1565_p0825b12（五灯会元）
- text: 上堂。举卍庵先师道。坐佛床。斫佛脚。不敬东家孔夫子。却向他乡习礼乐。师曰。入泥入水即不无。先师争奈寒蝉抱枯木。泣尽不回头。卓拄杖曰。灼然。有不回头底。净慈向升子里礼汝三拜
  ref: X80n1565_p0825b12（五灯会元）
- text: 上堂。三世诸佛。无中说有。󰖀𦿆拾华针。六代祖师。有里寻无。猿猴探水月。去此二途。如何话会。侬家不管兴亡事。尽日和云占洞庭。元庵受智者请。引座曰。南山有个老魔王。烱烱双眸放电光。口似血盆呵佛祖。牙如剑树骂诸方。几度业风吹不动。吹得动。云黄山畔与嵩头陀．傅大士。一火破落户。依旧孟八郎。赚他无限痴男女。开眼堂堂入镬汤。忽有个衲僧出来道。既是善知识。为甚赚人入镬汤。只向他道。非公境界。后示寂。塔于寺之南庵
  ref: X80n1565_p0825b12（五灯会元）
