sayings:
- text: 上堂拈拄杖曰。日月不能并明。河海不能竞深。须弥不能同高。乾坤不能同固。圣凡智慧不及。且道这个有甚么长处。良久曰。节目分明生来条直。冰雪敲开片片分。白云点破承伊力。击禅床下座
  ref: T51n2077_p0536b17（续传灯录）
