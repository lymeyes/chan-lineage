id: L::安吉州道场山如讷禅师
name: 安吉州道场山如讷
school: 青原系
teacher: 翠微学
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0192a03。
sayings:
- text: 僧问。如何是教意。师曰。汝自看。僧礼拜。师曰。明月铺霄汉。山川势自分
  ref: X80n1565_p0192a03（五灯会元）
- text: 问。如何得闻性不随缘去。师曰。汝听看。僧礼拜。师曰。聋人也唱胡笳调。好恶高低自不闻。曰。恁么则闻性宛然也。师曰。石从空里立。火向水中焚
  ref: X80n1565_p0192a03（五灯会元）
- text: 问。虗空还有边际否。师曰。汝也太多知。僧礼拜。师曰。三尺杖头挑日月。一尘飞起任遮天
  ref: X80n1565_p0192a03（五灯会元）
- text: 问。如何是道人。师曰。行运无踪迹。起坐绝人知。曰。如何即是。师曰。三炉力尽无烟𦦨。万顷平田水不流
  ref: X80n1565_p0192a03（五灯会元）
- text: 问。一念不生时如何。师曰。堪作甚么。僧无语。师又曰。透出龙门云雨合。山川大地入无踪。师目有重瞳。手垂过膝。自翠微受诀。止于此山。薙草卓庵。学徒四至。广阐法化。遂成丛社焉
  ref: X80n1565_p0192a03（五灯会元）
