id: 报本有兰禅师
name: 报本有兰
alias: 报本兰
school: —
teacher: —
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《续传灯录》T51n2077_p0502b24。
sayings:
- text: 僧问。道无横径立者皆危。如何是道。师曰。日耀祥光澹
  ref: T51n2077_p0502b24（续传灯录）
- text: 僧云。意旨如何。师曰。风摇瑞色浓。僧礼拜。师曰。犹欠一著。问拨尘见佛即不
  ref: T51n2077_p0502b24（续传灯录）
- text: 问。宝剑挥空事若何。师曰。脚下看
  ref: T51n2077_p0502b24（续传灯录）
- text: 僧云。脚下且置。向上事又且如何。师曰。天晴日出雨下云兴。问法本无说当说何明。师曰。水中盐味色里胶青
  ref: T51n2077_p0502b24（续传灯录）
- text: 僧云。便恁么时如何。师曰。三十年后。师乃曰。衣中至宝何假披沙。各自持来复将何用。交光牙入不隐不彰。达磨九年不敢动著。恐屈儿孙。报本不惜眉毛普示大众拈起拄杖。大众拟议一时打散。又
  ref: T51n2077_p0502b24（续传灯录）
- text: 上堂曰。大无方小无所。半合半开未可相许。岭梅初折众花荣。微雨微晴春力普。春力普到头。莫问曹溪祖。又曰。法无有尔理见非常。至道无方刹尘应物。直得风行草偃响顺声和。无纤芥可齐。见卓牌闹市。要得不伤和气。闲与露柱商量。苟能自契点头。莫谓山僧多口
  ref: T51n2077_p0502b24（续传灯录）
