id: L::台州六通院志球禅师
name: 台州六通院志球
school: —
teacher: 龙华照
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0296a07。
sayings:
- text: 僧问。全身佩剑时如何。师曰。落。曰。当者如何。师曰。熏天炙地
  ref: X80n1565_p0296a07（五灯会元）
- text: 问。如何是六通境。师曰。满目江山一任看。曰。如何是境中人。师曰。古今自去来。曰。离此二途。还有向上事也无。师曰。有。曰。如何是向上事。师曰。云水千徒与万徒
  ref: X80n1565_p0296a07（五灯会元）
- text: 问。拥毳玄徒。请师指示。师曰。红炉不坠雁门关。曰。如何是红炉不坠雁门关。师曰。青霄岂吝众人攀。曰。还有不知者也无。师曰。有。曰。如何是不知者。师曰。金榜上无名
  ref: X80n1565_p0296a07（五灯会元）
- text: 问。如何是和尚家风。师曰。万家明月朗
  ref: X80n1565_p0296a07（五灯会元）
- text: 问。如何是第二月。师曰。山河大地
  ref: X80n1565_p0296a07（五灯会元）
