sayings:
- text: 上堂。佛之一字孰云无。木马泥牛满道途。倚遍栏干春色晚。海风吹断碧珊瑚。还有同声相应。同气相求者么。百鸟不来楼阁闭。祇闻夜雨滴芭蕉
  ref: X80n1565_p0647a12（五灯会元）
