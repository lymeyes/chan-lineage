id: 鄂州无等禅师
name: 鄂州无等
school: 南岳系
teacher: 马祖道一禅师
status: draft
bio: 尉氏人也。出家于龚公山。密受心要。出住随州土门。一日谒州牧王常侍。辞退将出门。牧召曰。和尚。师回顾。牧敲柱三下。师以手作圆相。复三拨之。便行。后住武昌大寂寺。一日大众晚参。师见人人上来师前道不审。廼谓众曰。大众。适来声向甚么处去也。有一僧竖起指头。师曰。珍重。其僧至来朝上参。师乃转身面壁而卧。佯作呻吟声曰。老僧三两日来。不多安乐。大德身边有甚么药物。与老僧些。小僧以手拍净缾曰。这个净缾甚么处得来。师曰。这个是老僧底。大德底在甚么处。曰。亦是和尚底。亦是某甲底
