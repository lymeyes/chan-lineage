sayings:
- text: 僧问玄沙。向上宗乘。此间如何言论。沙曰。少人听。未审玄沙意旨如何。师曰。待汝移却石耳峰。我即向汝道归宗柔别云。且低声
  ref: X80n1565_p0366b10（五灯会元）
