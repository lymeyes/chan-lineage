sayings:
- text: 僧问。道泰不传天子令。时人尽唱太平歌。未审师今意旨如何。师曰。山僧罪过。问如何是佛。师曰。须弥山
  ref: T51n2077_p0535a04（续传灯录）
- text: 上堂。生死涅槃犹如昨梦。且道三世诸佛释迦老子有甚么长处。虽然如是莫错会好。拍手一下便下座。问承古有言。东山西岭青。未审意旨如何。师曰。东山西岭青。雨下却天晴。更问个中意。鹁鸠生鹞鹰。续传灯录终大鉴下第十三世目录续传灯录目录大鉴下第十三世法云秀禅师法嗣五十九人法云惟白禅师保宁子英禅师仙岩景纯禅师广教守讷禅师慈济聪禅师白兆珪禅师净名法因禅师福严守初禅师德山仁绘禅师广慧宝琳禅师霍丘归才禅师安国自方禅师香积用旻禅师瑞相子来禅师真空从一禅师乾明广禅师开先智珣禅师甘露德颙禅师蒋山良策禅师吉祥讷禅师广慧冲云禅师承天月禅师安福子胜禅师正觉道清禅师澄慧义端禅师北天王益禅师栖贤智柔庵主天禧慧严永禅师已上二十八人见录明水法逊禅师德山妙湛禅师大愚如照禅师石霜居晦禅师兴化当禅师兴化净甄禅师钦山继明禅师三角清禅师时雍清禅师大别道常禅师巴焦宗谅禅师安丰法信禅师云峰又月禅师永庆惟简禅师觉林遂禅师宝池慧月禅师天王义安禅师崇德仙禅师兴教济禅师荐福永坚禅师罗浮齐德禅师护国淳禅师普照有朋禅师灵鹫慧明禅师开和法颙禅师天峰佛印禅师元丰宗灯禅师神光道芳禅师禅慧法钦禅师兜率景常禅师颕叔蒋之奇居士已上三十一人无录佛日才禅师法嗣九人夹山自龄禅师见录千顷允良禅师广教有全禅师宝岩灵禅师慧日道祥禅师千顷省孜禅师龟峰重仁禅师善权珊禅师龙兴如邃禅师已上八人无录长芦应夫禅师法嗣二十五人洪济宗赜禅师琅邪宗初禅师龙蟠道成禅师普满明禅师褒禅普禅师宝林道辉禅师云岩志愿禅师等觉法思禅师寿春法岸禅师定山文彦禅师护国绍通禅师法宝德一禅师乾明宝慧禅师开圣觉禅师雪窦道荣禅师慧日智觉禅师已上一十六人见录建隆智因禅师普光献昭禅师宝林智皋禅师雍熙叔则禅师寿圣重洪禅师普满法海禅师五峰普良禅师大愚喜禅师滁州宝林和尚已上九人无录栖贤迁禅师法嗣五人王屋灯禅师法雨惟镇禅师东明慧迁禅师已上三人见录漳江宝泉禅师彰法文素和尚已上二人无录开元智谭禅师法嗣二人开元宗祐禅师见录南禅道诚禅师无录善果演庵主法嗣一人玉池冲俨禅师见录天宁楷禅师法嗣二十六人香山法成禅师大智齐琏禅师丹霞淳禅师净因觉禅师资圣南禅师白水修已禅师石门元易禅师洞山道微禅师韶州誧禅师鹿门法灯禅师宝峰惟照禅师普贤善秀禅师太傅高世则居士已上十三人见录龙门南禅师招提宝禅师大洪恭禅师大智　禅师灵岩应禅师合州鉴禅师少林江禅师景山居禅师慧日南禅师朝请崔公居士齐州善应禅师西京尼道深提刑杨居士已上十三人无录大洪山报恩禅师法嗣五人大洪山守遂禅师见录大洪山智禅师善光琎禅师大阳旦禅师西禅远禅师已上四人无录归宗通禅师法嗣五人资福素月禅师同安庆通禅师子陵辨禅师罗汉法医禅师开圣道彰和尚已上三人无录福昌信禅师法嗣三人法兴期禅师见录善庆楚升禅师均庆清皡禅师已上二人无录慈云庆珰禅师法嗣二人广慈道传禅师虔州慈云和尚已上二人无录慧日尧禅师法嗣一人大随道开禅师无录佛慧泉禅师法嗣五人清献赵抃居士一人见录幽谷祐禅师兴国法云禅师九峰殊甫禅师荐福忠实禅师已上四人无录续传灯录目录终续传灯录大鉴下第十三世
