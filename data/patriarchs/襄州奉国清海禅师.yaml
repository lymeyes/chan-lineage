id: 襄州奉国清海禅师
name: 襄州奉国清海
school: 云门宗
teacher: 云门偃
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0573b08。
sayings:
- text: 僧问。青青翠竹。尽是真如。如何是真如。师曰。点铁成金客。闻名不见形。曰。恁么则礼谢去也。师曰。昔时妄想。至今犹存
  ref: X80n1565_p0573b08（五灯会元）
- text: 问。承古有云。见月休观指。归家罢问程。如何是家。师曰。试举话头看
  ref: X80n1565_p0573b08（五灯会元）
- text: 问。放过即东道西说。不放过怎生道。师曰。二年同一春
  ref: X80n1565_p0573b08（五灯会元）
