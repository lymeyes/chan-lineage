id: 东京华严真懿慧兰禅师
name: 东京华严真懿慧兰
school: 法眼宗
teacher: 净因觉禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0545b06。
sayings:
- text: 上堂。达磨大师。九年面壁。未开口已前。不妨令人疑著。却被神光座主一󳬇。脚手忙乱。便道。吾本来兹土。传法救迷情。一华开五叶。结果自然成。当时若有个汉。脑后有照破古今底眼目。手中有截断虗空底钳锤。才见恁么道。便与蓦𮌎搊住。问他道。一华五叶且拈放一边。作么生是你传底法。待伊开口。便与掀倒禅床。直饶达磨全机。也倒退三千里。免见千古之下。负累儿孙。华严今日。岂可徒然。非唯重整颓纲。且要为诸人雪屈。遂拈拄杖横按。召大众曰。达磨大师向甚处去也。掷拄杖。下座
  ref: X80n1565_p0545b06（五灯会元）
- text: 上堂。拈拄杖曰。灵山会上。唤作拈花。少室峰前。名为得髓。从上古德。祇可傍观。末代宗师。尽皆拱手。华严今日不可逐浪随波。拟向万仞峰前点出普天春色。会么。髑髅无喜识。枯木有龙吟
  ref: X80n1565_p0545b06（五灯会元）
