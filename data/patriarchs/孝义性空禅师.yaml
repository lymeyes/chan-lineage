id: 孝义性空禅师
name: 孝义性空
school: 青原系
teacher: 丹霞天然禅师
status: draft
bio: 僧参。师乃展手示之。僧近前。却退后。师曰。父母俱丧。略不惨颜。僧呵呵大笑。师曰。少间与阇黎举哀。僧打筋斗而出。师曰。苍天。苍天。僧参人事毕。师曰。与么下去。还有佛法道理也无。曰。某甲结舌有分。师曰。老僧又作么生。曰。素非好手。师便仰身合掌。僧亦合掌。师乃抚掌三下。僧拂袖便出。师曰。乌不前。兔不后。几人于此茫然走。祇有阇黎达本源。结舌何曾著空有
