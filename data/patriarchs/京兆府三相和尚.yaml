bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0506a05。
sayings:
- text: 僧问。如何是无缝塔。师曰。觅缝不得。曰。如何是塔中人。师曰。对面不相见
  ref: X80n1565_p0506a05（五灯会元）
- text: 问。如何是西来意。师曰。雪覆孤峰白。残照露瑕痕
  ref: X80n1565_p0506a05（五灯会元）
