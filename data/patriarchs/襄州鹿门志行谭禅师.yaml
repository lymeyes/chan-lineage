id: 襄州鹿门志行谭禅师
name: 襄州鹿门志行谭
school: 曹洞宗
teacher: 鹿门真禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0512b12。
sayings:
- text: 僧问。如何是实际理地。师曰。南赡部洲。北郁单越。曰。恁么则事同一家也。师曰。隔须弥在
  ref: X80n1565_p0512b12（五灯会元）
- text: 问。远远投师。请师一接。师曰。从甚么处来。曰。江北来。师曰。南堂里安下
  ref: X80n1565_p0512b12（五灯会元）
- text: 问。如何是清净法身。师曰。戌亥年生
  ref: X80n1565_p0512b12（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0512b12），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
