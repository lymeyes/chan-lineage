id: 泐潭善清禅师
name: 泐潭善清
alias: 泐潭清
school: 黄龙派
teacher: 黄龙祖心禅师
status: draft
bio: 南雄州何氏子。初谒大沩哲禅师无所得。后谒黄龙。龙示以风旛话。久而不契。一日龙
sayings:
- text: 问。风旛话子作么生会。师曰。迥无入处乞师方便。龙曰。子见猫儿捕鼠乎。目睛不瞬四足踞地。诸根顺向首尾一直拟无不中。子诚能如是。心无异缘六根自静。默然而究万无失一也。师从是屏去闲缘岁余。豁然契悟。以偈告龙曰。随随随昔昔昔随随随后无人识。夜来明月上高峰。元来只是这个贼。龙颔之。复告之曰。得道非难弘道为难。弘道犹在己。说法为人难。既明之后在力行之。大凡宗师说法。一句中具三玄。一玄中具三要。子入处真实。得坐披衣向后自看。自然七通八达去。师复依止七年。乃辞遍访丛林。后出世黄龙终于泐潭
  ref: T51n2077_p0614a23（续传灯录）
- text: 僧问。牛头未见四祖时如何。师曰。京三卞四。曰见后如何。师曰。灰头土面。曰毕竟如何。师曰。一场懡㦬。开堂
  ref: T51n2077_p0614a23（续传灯录）
- text: 上堂。举浮山远和尚云。欲得英俊么。仍须四事俱备。方显宗师蹊径。何谓也。一者祖师巴鼻。二具金刚眼睛。三有师子爪牙。四得衲僧杀活。拄杖得此四事。方可纵横变态任运卷舒。高耸人天壁立千仞。倘不如是守死善道者败军之地。何故棒打石人贵论实事。是以到这里得不。修江耿耿大野云凝。绿竹含烟青山锁翠。风云一致水月齐观。一句该通已彰残朽。师曰。黄龙今日出世。时当末季佛法浇漓。不用祖师巴鼻。不用金刚眼睛。不用师子爪牙。不用杀活拄杖。只有一枝拂子以为蹊径。亦能纵横变态任运卷舒。亦能高耸人天壁立千仞。有时逢强即弱。有时遇贵即贱。拈起则群魔屏迹佛祖潜踪。放下则合水和泥圣凡同辙。且道。拈起好放下好。竿头丝线从君弄。不犯清波意自殊
  ref: T51n2077_p0614a23（续传灯录）
- text: 上堂。色心不异彼我无差。竖起拂子曰。若唤作拂子入地狱如箭。不唤作拂子有眼如盲。直饶透脱两头。也是黑牛卧死水
  ref: T51n2077_p0614a23（续传灯录）
