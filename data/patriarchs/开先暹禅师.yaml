bio: 一首寄莲华峰祥庵主寄莲华峰祥庵主莲华峰色撑寥沈，中有高人眠岁月。劳劳尘虑不经心，凛凛寒姿天欲雪。腰间佩文殊逼佛剑，手中握龙猛金膏笔。又不肯扫荡妖氛，又不肯点化顽石。殷勤问师住山得几秋，报我百年只是三万六千日
