id: 大慧宗杲禅师
name: 大慧宗杲
honorific: 临安径山大慧宗杲禅师（圆悟克勤法嗣，看话禅集大成者）
school: 杨岐派
dynasty: 南宋（1089—1163）
region: 临安径山（今浙江余杭）
teacher: 圆悟克勤（昭觉勤禅师）
source_ref: 五灯会元·卷十九·径山宗杲 / 大慧普觉禅师语录 / 正法眼藏
cbeta: T47n1998A（大慧普觉禅师语录）三十卷
bio: 圆悟克勤之法嗣，杨岐派第五代，临济宗看话禅（看话头）之集大成者，世称「大慧」。宣城人，姓奚。十七出家，遍历诸方，后依圆悟，于「有句无句，如藤倚树」话头下，闻圆悟道「树倒藤枯」而大悟，圆悟以「威音王已前，无师自悟」印之。住临安径山，学徒逾千，为南宋禅门之冠。鉴于当时「默照禅」（宏智正觉所倡）流于静坐昏住之弊，宗杲力倡「看话禅」，以「起疑情」为要，著《正法眼藏》《大慧书》等。因卷入张浚、秦桧和战之争，被褫夺衣牒，流放衡州、梅州十五年，后赦归，再住径山。其弟子道谦、蕴闻等编其语录；看话禅遂成后世临济主流，东传高丽、日本。
sayings:
- text: '看话禅纲宗：「但将一段生死无常底心，贴在『狗子无佛性』话头上，如靠一座须弥山相似，摇撼不动，抖擞不下；蓦然打个失惊，却觑见也。」（以''起疑情''破妄情) '
  ref: 大慧书 / 正法眼藏·卷一
- text: 竹篾子话：圆悟以竹篾子问「唤作竹篾子则触，不唤作竹篾子则背」，宗杲云「唤作竹篾子则触，不唤作竹篾子则背——要且没人缚你」；圆悟笑云「你只管将去了」。
  ref: 五灯会元·卷十九·大慧宗杲
- text: '示众：「善恶都不思量，一切处通彻；通彻处，莫守著——才守著，便被他换却眼睛。」（破「默照」之滞) '
  ref: 大慧普觉禅师语录
