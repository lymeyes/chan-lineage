id: 破灶堕和尚
name: 破灶堕
school: —
teacher: 嵩岳安
status: draft
bio: 不称名氏。言行叵测。隐居嵩岳。山坞有庙甚灵。殿中唯安一灶。远近祭祀不辍。烹杀物命甚多。师一日领侍僧入庙。以杖敲灶三下曰。咄。此灶只是泥瓦合成。圣从何来。灵从何起。恁么烹宰物命。又打三下。灶乃倾破堕落。须臾。有一人青衣峩冠。设拜师前。师曰。是甚么人。曰。我本此庙灶神。久受业报。今日蒙师说无生法。得脱此处。生在天中。特来致谢。师曰。是汝本有之性。非吾彊言。神再礼而没。少选。侍
sayings:
- text: 僧问曰。某等久侍和尚。不蒙示诲。灶神得甚么径旨。便得生天。师曰。我只向伊道是泥瓦合成。别也无道理为伊。侍僧无言。师曰。会么。僧曰。不会。师曰。本有之性。为甚么不会。侍僧等乃礼拜。师曰。堕也。堕也。破也。破也。后义丰禅
  ref: X80n1565_p0051b01（五灯会元）
- text: 师举似安国师。安叹曰。此子会尽。物我一如。可谓如朗月处空。无不见者。难构伊语脉。丰问曰。未审甚么人构得他语脉。安曰。不知者。时号为破灶堕
  ref: X80n1565_p0051b01（五灯会元）
- text: 僧问。物物无形时如何。师曰。礼即唯汝非我。不礼即唯我非汝。其僧乃礼谢。师曰。本有之物。物非物也。所以道心能转物。即同如来。有僧从牛头处来。师问曰。来自何人法会。僧近前叉手。绕师一匝而出。师曰。牛头会下。不可有此人。僧乃回师上肩叉手而立。师曰。果然。果然。僧却问曰。应物不由他时如何。师曰。争得不由他。曰。恁么则顺正归元去也。师曰。归元何顺。曰。若非和尚。几错招愆。师曰。犹是未见四祖时道理。见后道将来。僧却绕师一匝而出。师曰。顺正之道。今古如然。僧作礼。又僧侍立久。师乃曰。祖祖佛佛。只说如人本性本心。别无道理。会取。会取。僧礼谢。师乃以拂子打之曰。一处如是。千处亦然。僧乃叉手近前。应喏一声。师曰。更不信。更不信
  ref: X80n1565_p0051b01（五灯会元）
- text: 僧问。如何是大阐提人。师曰。尊重礼拜。曰。如何是大精进人。师曰。毁辱嗔恚。其后莫知所终
  ref: X80n1565_p0051b01（五灯会元）
