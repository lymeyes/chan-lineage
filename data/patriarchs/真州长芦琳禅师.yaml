id: 真州长芦琳禅师
name: 真州长芦琳
school: 法眼宗
teacher: 天童正觉禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0550a16。
sayings:
- text: 上堂拈拄杖曰。其宗也离心意识。其旨也超去来今。离心意识。故品万类不见差殊。超去来今。故尽十方更无渗漏。当头不犯。彻底无依。悟向朕兆未生已前。用在功勋不犯之处。平常活计。不用踌蹰。拟议之间。即没交涉
  ref: X80n1565_p0550a16（五灯会元）
