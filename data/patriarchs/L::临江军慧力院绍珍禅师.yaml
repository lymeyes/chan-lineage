id: L::临江军慧力院绍珍禅师
name: 临江军慧力院绍珍
school: 法眼宗
teacher: 罗汉林
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0382b13。
sayings:
- text: 僧问。金鸡未鸣时如何。师曰。是何时节。曰。鸣后如何。师曰。却不知时
  ref: X80n1565_p0382b13（五灯会元）
- text: 问。师子未出窟时如何。师曰。在那里。曰。出窟后如何。师曰。且走
  ref: X80n1565_p0382b13（五灯会元）
