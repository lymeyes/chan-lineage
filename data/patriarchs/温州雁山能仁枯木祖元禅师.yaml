id: 温州雁山能仁枯木祖元禅师
name: 温州雁山能仁枯木祖元
school: 杨岐派
teacher: 径山杲
status: draft
bio: 七闽林氏子。初谒雪峰预次依佛心才。皆已机契。及依大慧于云门庵。夜坐次睹僧剔灯始彻证。有偈曰。剔起灯来是火。历劫无明照破。归堂撞见圣僧。几乎当面蹉过。不蹉过是甚么。十五年前奇特。依前只是这个。慧以偈赠之曰。万仞崖头解放身。起来依旧却惺惺。饥餐渴饮浑无事。那论昔人非昔人。绍兴乙巳春出住能仁
sayings:
- text: 上堂。有佛处不得住。踏著秤锤硬似铁。无佛处急走过。脚下草深三尺。三千里外逢人不得错举。北斗挂须弥。恁么则不去也。棒头挑日月。摘杨花摘杨花。眼里瞳人著绣鞋。卓拄杖下座
  ref: T51n2077_p0690c13（续传灯录）
- text: 上堂。雁山枯木实头禅。不在尖新语句边。背手忽然摸得著。长鲸吞月浪滔天
  ref: T51n2077_p0690c13（续传灯录）
