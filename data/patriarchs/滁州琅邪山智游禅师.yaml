id: 滁州琅邪山智游禅师
name: 滁州琅邪山智游
school: —
teacher: 琅邪觉
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0447b05。
sayings:
- text: 僧问。如何是琅邪境。师曰。松因有限萧踈老。花为无情取次开。曰。如何是境中人。师曰。发长僧貌丑
  ref: X80n1565_p0447b05（五灯会元）
- text: 问。如何是和尚为人句。师曰。眼前三尺雪。曰。莫便是也无。师曰。脑后一枝花
  ref: X80n1565_p0447b05（五灯会元）
