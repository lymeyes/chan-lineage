id: 澧州茗谿道行禅师
name: 澧州茗谿道行
school: 南岳系
teacher: 马祖道一禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0106a17。
sayings:
- text: 僧问曹山。古人曰。吾有大病。非世所医。未审是甚么病。山曰。攒簇不得底病。曰。一切众生还有此病也无。山曰。人人尽有。曰。和尚还有此病也无。山曰。正觅起处不得。曰。一切众生为甚么不病。山曰。一切众生若病。即非众生。曰。未审诸佛还有此病也无。山曰。有。曰。既有。为甚么不病。山曰。为伊惺惺
  ref: X80n1565_p0106a17（五灯会元）
- text: 僧问。如何修行。师曰。好个阿师。莫客作。曰。毕竟如何。师曰。安置即不堪
  ref: X80n1565_p0106a17（五灯会元）
- text: 问。如何是正修行路。师曰。涅槃后有。曰。如何是涅槃后有。师曰。不洗面。曰。学人不会。师曰。无面得洗
  ref: X80n1565_p0106a17（五灯会元）
