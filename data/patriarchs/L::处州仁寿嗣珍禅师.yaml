bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0437a16。
sayings:
- text: 僧问。知师已得禅中旨。当阳一句为谁宣。师曰。土鸡瓦犬。曰。如何领会。师曰。门前不与山童扫。任意松钗满路岐
  ref: X80n1565_p0437a16（五灯会元）
- text: 上堂。明明无悟。有法即迷。日上无云。丽天普照。眼中无翳。空本无花。无智人前。不得错举。参
  ref: X80n1565_p0437a16（五灯会元）
