id: 南康军云居道简禅师
name: 南康军云居道简
school: 曹洞宗
teacher: 云居膺
status: draft
bio: 范阳人也。久入先云居之室。密受真印。而分掌寺务。典司樵㸑。以腊高。堂中为第一座。属先云居将顺寂。主事请
sayings:
- text: 问。谁堪继嗣。居曰。堂中简。主事虽承言而意不在师。谓。令拣择可当说法者。佥曰。第二座可。然且备礼。先请第一座。若谦让。即坚请第二座。师既密承授记。略不辞免。即自持道具入方丈。摄众演法。主事等不惬素志。罔循规式。师察其情。乃潜弃去。其夜安乐树神号泣诘旦。主事大众奔至麦庄悔过。哀请归院。众闻空中连声唱曰。和尚来也
  ref: X80n1565_p0501b10（五灯会元）
- text: 僧问。如何是和尚家风。师曰。随处得自在
  ref: X80n1565_p0501b10（五灯会元）
- text: 问。维摩岂不是金粟如来。师曰。是。曰。为甚么却在释迦会下听法。师曰。他不担人我
  ref: X80n1565_p0501b10（五灯会元）
- text: 问。横身盖覆时如何。师曰。还盖覆得么
  ref: X80n1565_p0501b10（五灯会元）
- text: 问。蛇子为甚么吞却蛇师。师曰。在里何伤
  ref: X80n1565_p0501b10（五灯会元）
- text: 问。诸圣道不得处。和尚还道得么。师曰。汝道甚么处诸圣道不得
  ref: X80n1565_p0501b10（五灯会元）
- text: 问。路逢猛虎时如何。师曰。千人万人不逢。为甚么阇黎偏逢
  ref: X80n1565_p0501b10（五灯会元）
- text: 问。孤峰独宿时如何。师曰。闲却七间僧堂不宿。阿谁教汝孤峰独宿。师后无疾而寂。塔于本山
  ref: X80n1565_p0501b10（五灯会元）
