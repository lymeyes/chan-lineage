id: L::彭州承天院辞确禅师
name: 彭州承天院辞确
school: 沩仰宗
teacher: 芭蕉清
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0337b11。
sayings:
- text: 僧问。学人有一只箭。射即是。不射即是。师曰。作么生是阇黎箭。僧便喝。师曰。这个是草箭子。曰。如何是和尚箭。师曰。禁忌须屈指。祷祈便扣牙
  ref: X80n1565_p0337b11（五灯会元）
- text: 问。心随万境转。阿那个是转万境底心。师曰。嘉州大像古人镌
  ref: X80n1565_p0337b11（五灯会元）
- text: 问。众罪如霜露。慧日能消除时如何。师曰。亭台深夜雨。楼阁静时钟。曰。为甚么因缘会遇时。果报还自受。师曰。管笔能书。片舌解语。开堂日
  ref: X80n1565_p0337b11（五灯会元）
- text: 示众。正令提纲。犹是捏窠造伪。佛法祗对。特地谩蓦上流。问著即参差。答著即交互。大德拟向甚么处下口。然则如是。事无一向。权柄在手。纵夺临机。有疑请
  ref: X80n1565_p0337b11（五灯会元）
- text: 问。僧问。如何是第一义。师曰。群峰穿海去。滴水下岩来
  ref: X80n1565_p0337b11（五灯会元）
- text: 问。师唱谁家曲。宗风嗣阿谁。师曰。道头会尾。举意知心
  ref: X80n1565_p0337b11（五灯会元）
