id: 福州玉泉昙懿禅师
name: 福州玉泉昙懿
school: 杨岐派
teacher: 径山杲
status: draft
bio: 久依圆悟。自谓不疑。绍兴初。出住兴化祥云。法席颇盛。大慧入闽。知其所见未谛。致书令来。师迟迟。慧小参。且痛斥。仍榜告四众。师不得已。破夏谒之。慧鞫其所证。既而曰。汝恁么见解。敢嗣圆悟老人邪。师退院亲之。一日入室。慧
sayings:
- text: 问。我要个不会禅底做国师。师曰。我做得国师去也。慧喝出。居无何。语之曰。香严悟处不在击竹边。俱胝得处不在指头上。师乃顿明。后住玉泉。为慧拈香。继省慧于小溪。慧升座。举。云门一日拈拄杖
  ref: X80n1565_p0796b10（五灯会元）
- text: 示众曰。凡夫实谓之有。二乘析谓之无。缘觉谓之幻有。菩萨当体即空。衲僧见拄杖子但唤作拄杖子。行但行。坐但坐。总不得动著。慧曰。我不似云门老人。将虗空剜窟竉。蓦拈拄杖曰。拄杖子不属有。不属无。不属幻。不属空。卓一下曰。凡夫．二乘．缘觉．菩萨。尽向这里。各随根性。悉得受用。唯于衲僧分上。为害为冤。要行不得行。要坐不得坐。进一步。则被拄杖子迷却路头。退一步。则被拄杖子穿却鼻孔。即今莫有不甘底么。试出来与拄杖子相见。如无。来年更有新条在。恼乱春风卒未休。正恁么时合作么生。下座。烦玉泉为众拈出。师登座。叙谢毕。遂举前话。曰。适来堂头和尚恁么批判。大似困鱼止泺。病鸟栖芦。若是玉泉则不然。拈拄杖曰。拄杖子能有．能无．能幻．能空。凡夫．二乘．缘觉．菩萨。卓一下曰。向这里百杂碎。唯于衲僧分上。如龙得水。似虎靠山。要行便行。要坐便坐。进一步则乾坤震动。退一步则草偃风行。且道不进不退一句作么生道。良久曰。闲持经卷倚松立。笑问客从何处来
  ref: X80n1565_p0796b10（五灯会元）
