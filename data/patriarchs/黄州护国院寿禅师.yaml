sayings:
- text: 僧问。如何是一路涅槃门。师曰。寒松青有千年色。一径风飘四季香
  ref: X80n1565_p0592a04（五灯会元）
- text: 问。如何是灵山一会。师曰。如来才一顾。迦叶便低眉
  ref: X80n1565_p0592a04（五灯会元）
