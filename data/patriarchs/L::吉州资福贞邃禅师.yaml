id: L::吉州资福贞邃禅师
name: 吉州资福贞邃
school: 云门宗
teacher: 资福宝
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0336a09。
sayings:
- text: 僧问。和尚见古人。得何意旨便歇去。师作此󳮁相示之
  ref: X80n1565_p0336a09（五灯会元）
- text: 问。如何是古人歌。师作此○相示之
  ref: X80n1565_p0336a09（五灯会元）
- text: 问。如何是最初一句。师曰。未具世界时。阇黎亦在此
  ref: X80n1565_p0336a09（五灯会元）
- text: 问。百丈卷席。意旨如何。师良久
  ref: X80n1565_p0336a09（五灯会元）
- text: 问。古人道。前三三。后三三。意旨如何。师曰。汝名甚么。曰。某甲。师曰。吃茶去
  ref: X80n1565_p0336a09（五灯会元）
- text: 上堂。隔江见资福刹竿便回去。脚跟下好与三十棒。况过江来。时有僧才出。师曰。不堪共语
  ref: X80n1565_p0336a09（五灯会元）
- text: 问。如何是古佛心。师曰。山河大地
  ref: X80n1565_p0336a09（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0336a09），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
