id: 天台莲华峰祥庵主
name: 天台莲华峰祥
school: 云门宗
teacher: 奉先深
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0584a02。
sayings:
- text: 僧问。如何是雪岭泥牛吼。师曰。听。曰。如何是云门木马嘶。师曰。响。示寂曰。拈拄杖
  ref: X80n1565_p0584a02（五灯会元）
- text: 示众曰。古人到这里。为甚么不肯住。众无对。师乃曰。为他途路不得力。复曰。毕竟如何。以杖横肩曰。楖栗横担不顾人。直入千峰万峰去。言毕而逝
  ref: X80n1565_p0584a02（五灯会元）
