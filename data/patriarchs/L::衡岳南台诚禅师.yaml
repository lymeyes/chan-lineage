id: L::衡岳南台诚禅师
name: 衡岳南台诚
school: —
teacher: 玄沙备
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0282a01。
sayings:
- text: 僧问。玄沙宗旨。请
  ref: X80n1565_p0282a01（五灯会元）
- text: 师举扬。师曰。甚么处得此消息。曰。垂接者何。师曰。得人不迷己
  ref: X80n1565_p0282a01（五灯会元）
- text: 问。潭清月现。是何境界。师曰。不干你事。曰。借问又何妨。师曰。觅潭月不可得
  ref: X80n1565_p0282a01（五灯会元）
- text: 问。离地四指。为甚么却有鱼纹。师曰。有圣量在。曰。此量为甚么人施。师曰。不为圣人
  ref: X80n1565_p0282a01（五灯会元）
