id: 南岳西园兰若昙藏禅师
name: 南岳西园兰若昙藏
school: 南岳系
teacher: 马祖道一禅师
status: draft
bio: 受心印于大寂。后谒石头。莹然明彻。出住西园。禅侣日盛。师一日自烧浴次
sayings:
- text: 僧问。何不使沙弥。师抚掌三下僧举似曹山。山云。一等是拍手抚掌。就中西园奇怪。俱胝一指头禅。葢为承当处不谛当。僧却问曹山。西园抚掌。岂不是奴儿婢子边事。山云。是。云。向上更有事也无。山云。有。云。如何是向上事。山叱云。这奴儿婢子。师养一犬。常夜经行时。其犬衔师衣。师即归方丈。又常于门侧伏守。忽一夜频吠。奋身作猛噬之势。诘旦。东厨有一大蟒。长数丈。张口呀气。毒𦦨炽然。侍者请避之。师曰。死可逃乎。彼以毒来。我以慈受。毒无实性。激发则强。慈苟无缘。冤亲一揆。言讫。其蟒按首徐行。倏然不见。复一夕。有群盗至。犬亦衔衣。师语盗曰。茅舍有可意物。一任将去。终无所吝。盗感其言。皆稽首而散
