id: L::寿州智通禅师者
name: 寿州智通
school: —
teacher: 六祖大鉴旁出
status: draft
bio: 者安丰人也。初看楞伽经约千余遍。而不会三身四智。礼拜六祖。求解其义。祖曰。三身者。清净法身。汝之性也。圆满报身。汝之智也。千百亿化身。汝之行也。若离本性。别说三身。即名有身无智。若悟三身无有自性。即名四智菩提。听吾偈曰。自性具三身。发明成四智。不离见闻缘。超然登佛地。吾今为汝说。谛信永无迷。莫学驰求者。终日说菩提。师曰。四智之义。可得闻乎。祖曰。既会三身。便明四智。何更问邪。若离三身。别谭四智。此名有智无身也。即此有智。还成无智。复说偈曰。大圆镜智性清净。平等性智心无病。妙观察智见非功。成所作智同圆镜。五八六七果因转。但用名言无实性。若于转处不留情。繁兴永处那伽定转识为智者。教中云。转前五识为成所作智。转第六识为妙观察智。转第七识为平等性智。转第八识为大圆镜智。虽六七因中转。五八果上转。但转其名而不转其体也。师礼谢。以偈赞曰。三身元我体。四智本心明。身智融无碍。应物任随形。起修皆妄动。守住匪真精。妙旨因师晓。终亡污染名
