id: L::潭州石霜山性空禅师
name: 潭州石霜山性空
school: 南岳系
teacher: 百丈海
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0125b08。
sayings:
- text: 僧问。如何是祖师西来意。师曰。如人在千尺井中。不假寸绳。出得此人。即答汝西来意。僧曰。近日湖南畅和尚出世。亦为人东语西话。师唤沙弥。拽出这死尸著沙弥即仰山。山后问耽源。如何出得井中人。源曰。咄。痴汉。谁在井中。山复问沩山。沩召慧寂。山应诺。沩曰。出也。仰山住后。常举前语谓众曰。我在耽源处得名。沩山处得地
  ref: X80n1565_p0125b08（五灯会元）
