id: 南康军云居高庵善悟禅师
name: 南康军云居高庵善悟
school: 杨岐派
teacher: 龙门远
status: draft
bio: 洋州李氏子。年十一去家。业经得度。有夙慧。闻冲禅师举武帝问达磨因缘。如获旧物。遽曰。我既廓然。何圣之有。冲异其语。勉之南询。蒙授记于龙门。一日。有僧被虵伤足。佛眼问曰。既是龙门。为甚么却被虵𫜪。师即应曰。果然现大人相。眼益器之。后传此语到昭觉。圆悟云。龙门有此僧耶。东山法道未寂寥尔。住后
sayings:
- text: 上堂。少林面壁。怀藏东土西天。欧阜升堂。充塞四维上下。致使山巍巍而砥掌平。水昏昏而常自清。华非艳而结空果。风不摇而片叶零。人无法而得咨
  ref: X80n1565_p0777b03（五灯会元）
- text: 问。佛无心而更可成。野蔬淡饭延时日。任运随缘道自灵。毕竟如何。日午打三更
  ref: X80n1565_p0777b03（五灯会元）
