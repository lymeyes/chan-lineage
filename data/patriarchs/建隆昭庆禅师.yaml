sayings:
- text: 示众曰。始见新岁倏忽早是二月初一天气和融。拟举个时节因缘与诸人商量。却被帝释梵王在门外柳眼中努出头来。先说偈言。袅袅飏轻絮。且逐风来去。相次走绵球。休言道我絮。当时撞著阿修罗。把住云。任尔絮忽逢西风吹。渭水落叶满长安。一句作么生道。于是帝释缩头入柳眼中。良久曰。参
  ref: T51n2077_p0575b12（续传灯录）
