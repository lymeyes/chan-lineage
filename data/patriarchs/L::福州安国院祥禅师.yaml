id: L::福州安国院祥禅师
name: 福州安国院祥
school: —
teacher: 安国𤦆
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0301a06。
sayings:
- text: 上堂。良久失声曰。大是无端。虽然如此。事不得已。于中若有未觏者。更开方便。还会么。时有
  ref: X80n1565_p0301a06（五灯会元）
- text: 僧问。不涉方便。乞师垂慈。师曰。汝问我答。即是方便
  ref: X80n1565_p0301a06（五灯会元）
- text: 问。应物现形。如水中月。如何是月。师提起拂子。僧曰。古人为甚么道水月无形。师曰。见甚么
  ref: X80n1565_p0301a06（五灯会元）
- text: 问。如何是宗乘中事。师曰。淮军散后
  ref: X80n1565_p0301a06（五灯会元）
- text: 问。如何是和尚家风。师曰。众眼难谩
  ref: X80n1565_p0301a06（五灯会元）
