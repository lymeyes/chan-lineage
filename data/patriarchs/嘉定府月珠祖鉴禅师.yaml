bio: 僧请笔师语要。师曰。达磨西来。单传心印。曹谿六祖。不识一字。今日诸方出世。语句如山。重增绳索。乃拍禅床曰。于斯荐得。犹是钝根。若也未然。白云深处从君卧。切忌寒猿中夜啼
