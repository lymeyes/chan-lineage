id: L::舒州天柱山崇慧禅师者
name: 舒州天柱山崇慧
school: —
teacher: 金陵牛头山威
status: draft
bio: 彭州人也。姓陈氏。唐乾元初。往舒州天柱山创寺。永泰元年赐额
sayings:
- text: 僧问。如何是天柱境。师曰。主簿山高难见日。玉镜峰前易晓人
  ref: X80n1565_p0045b09（五灯会元）
- text: 问。达磨未来此土时。还有佛法也无。师曰。未来且置。即今事作么生。曰。某甲不会。乞师指示。师曰。万古长空。一朝风月。僧无语。师复曰。阇梨会么。曰。不会。师曰。自己分上作么生。干他达磨来与未来作么。他家来。大似卖卜汉。见汝不会。为汝锥破卦文。才生吉㐫。尽在汝分上。一切自看。僧曰。如何是解卜底人。师曰。汝才出门时。便不中也
  ref: X80n1565_p0045b09（五灯会元）
- text: 问。如何是天柱家风。师曰。时有白云来闭户。更无风月四山流
  ref: X80n1565_p0045b09（五灯会元）
- text: 问。亡僧迁化向甚么处去也。师曰。𤅬岳峰高长积翠。舒江明月色光晖
  ref: X80n1565_p0045b09（五灯会元）
- text: 问。如何是大通智胜佛。师曰。旷大劫来。未曾壅滞。不是大通智胜佛是甚么。曰。为甚么佛法不现前。师曰。只为汝不会。所以成不现前。汝若会去。亦无佛可成
  ref: X80n1565_p0045b09（五灯会元）
- text: 问。如何是道。师曰。白云覆青嶂。蜂蝶恋庭华
  ref: X80n1565_p0045b09（五灯会元）
- text: 问。从上诸圣有何言说。师曰。汝今见吾有何言说
  ref: X80n1565_p0045b09（五灯会元）
- text: 问。宗门中事。请
  ref: X80n1565_p0045b09（五灯会元）
- text: 师举唱。师曰。石牛长吼真空外。木马嘶时月隐山
  ref: X80n1565_p0045b09（五灯会元）
- text: 问。如何是和尚利人处。师曰。一雨普滋。千山秀色
  ref: X80n1565_p0045b09（五灯会元）
- text: 问。如何是天柱山中人。师曰。独步千峰顶。优游九曲泉
  ref: X80n1565_p0045b09（五灯会元）
- text: 问。如何是西来意。师曰。白猿抱子来青嶂。蜂蝶衔华绿蘂间。大历十四年归寂。塔于山之北
  ref: X80n1565_p0045b09（五灯会元）
