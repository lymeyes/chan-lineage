id: L::新罗国卧龙禅师
name: 新罗国卧龙
school: 青原系
teacher: 云葢元
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0213a08。
sayings:
- text: 僧问。如何是大人相。师曰。紫罗帐里不垂手。曰。为甚么不垂手。师曰。不尊贵
  ref: X80n1565_p0213a08（五灯会元）
- text: 问。十二时中如何用心。师曰。猢狲吃毛虫
  ref: X80n1565_p0213a08（五灯会元）
- text: 问。如何是潭中意。师曰。丝纶垂不到。磻溪谩放钩。曰。如何是潭外事。师曰。日里金乌叫。蟾中玉兔惊
  ref: X80n1565_p0213a08（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0213a08），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
