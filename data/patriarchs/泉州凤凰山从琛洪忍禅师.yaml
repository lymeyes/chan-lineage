id: 泉州凤凰山从琛洪忍禅师
name: 泉州凤凰山从琛洪忍
school: —
teacher: 保福展
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0291a03。
sayings:
- text: 僧问。如何是和尚家风。师曰。门风相似。即无阻矣。汝不是其人。曰。忽遇其人时又如何。师曰。不可预搔待痒
  ref: X80n1565_p0291a03（五灯会元）
- text: 问。学人根思迟回。方便门中乞师傍瞥。师曰。傍瞥。曰。深领师旨。安敢言乎。师曰。太多也
  ref: X80n1565_p0291a03（五灯会元）
- text: 上堂。有僧出礼拜起。退身立。师曰。我不如汝。僧应诺。师曰。无人处放下著
  ref: X80n1565_p0291a03（五灯会元）
- text: 问。如何是学人自己事。师曰。暗算流年事可知
  ref: X80n1565_p0291a03（五灯会元）
- text: 问。如何是凤凰境。师曰。雪夜观明月
  ref: X80n1565_p0291a03（五灯会元）
- text: 问。如何是西来意。师曰。作人丑差。曰。为人何在。师曰。莫屈著汝么
  ref: X80n1565_p0291a03（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0291a03），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
