bio: 生平部分原文未载，仅存机缘语（见下）；据《续传灯录》T51n2077_p0558a06。
sayings:
- text: 上堂曰。建立宗乘群魔屏迹。播扬大事三藏忘言。况阿逸多未离兜率。黄面老已灭拘尸。大唐国里无禅师。天下衲僧味糟粕。众中莫有英灵衲子变豹作家出来。掀倒禅床喝散大众。岂不快哉。良久曰。瑞兽藏头角。珍禽惜羽毛。又曰。雨过山青云横水碧。宝陀岩上瑞草将敷。王舍城中幽花欲绽。空生宴坐帝释奔驰。彼此一时今古曷异。良久曰。万般施设不如常。又曰。住住百千妙门同归一路。青山常在知识难逢。争如识取主人公。高声召云。主人公。复曰。今日自买自卖。又
  ref: T51n2077_p0558a06（续传灯录）
- text: 上堂顾视曰。杨子江心无风起浪。石公山畔平地骨堆。会得左右逢原。争似寂然不动。良久曰。堪笑寒山忘却归。十年不识来时道
  ref: T51n2077_p0558a06（续传灯录）
