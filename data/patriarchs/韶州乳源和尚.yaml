id: 韶州乳源和尚
name: 韶州乳源
school: 南岳系
teacher: 马祖一
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0117a01。
sayings:
- text: 上堂。西来的的意不妨。难道众中莫有道得者。出来试道看。时有僧出礼拜。师便打。曰。是甚么时节。出头来。便归方丈僧举似长庆。庆云。不妨。不妨。资福代云。为和尚不惜身命。仰山作沙弥时。念经声高。师咄曰。这沙弥念经恰似哭。曰。慧寂只恁么。未审和尚如何。师乃顾视。仰曰。若恁么。与哭何异。师便休
  ref: X80n1565_p0117a01（五灯会元）
