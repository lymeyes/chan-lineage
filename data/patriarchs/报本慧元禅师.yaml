id: 报本慧元禅师
name: 报本慧元
alias: 报本元
school: 黄龙派
teacher: 黄龙慧南禅师
status: draft
bio: 潮州倪氏。垂髫凛然如老成人。群儿戏于前袖手趺坐而已。父母商略云。儿材如此岂堪世用。令事佛僧乃可耳。师闻之即矍然起拜。遂依城南精舍诵法华经。年十九剃发受具。游方至京师寓止华严。有圆明法师者。见而异之云。上人齿少从何至此所求何事。曰慧元从南海来无他求惟求佛法。圆明笑云。王城声利捷径酒色樊笼横目争夺日有万端。宁有佛法乎。佛法尽在南方也。师乃自洛京游襄汉遍历名山。所至亲近知识。然俱无解悟。治平二年春至黄龙。时南新自积翠来龙象四集。师每坐下板。辄自引手反复视之曰。宁有道理而云似佛手。知吾家潮阳。而乃复
sayings:
- text: 问。生缘何处乎。一日顿悟尽释所疑遂发去。熙宁元年入吴。开法于吴江寿圣寺。遣僧造黄龙投法嗣书。南视其名谓专使。吾偶忘此僧。书未欲开。可令亲来见老僧。专使反命。师即日腰包而来至豫章。而南已圆寂因留叹息。适晦堂老人出城相会。与师语大奇之。深恨老师不及见。留逾月乃复还吴中。道俗师尊之。又延住昆山慧严院十年。尝夜舟归自霅川。寇劫舟白刃交错。舟人惊怖不知所出。师安坐徐曰。钱帛皆施汝。人命不可害也。盗既去。至旦人来视舟意师死矣。而貌和神凝如常日。其临生死祸福能脱然无累如此。元祐四年移住承天万寿寺众益盛。躬自持钵至湖州。湖人云。师到处为家。何苦独爱姑苏。固留不使还。苏人闻之争持杖捶哗以入湖。云何为夺我邦善知识。政当见还。否则有死而已。师怡然不悋情去留曰。吾任缘耳。相守弥月。苏人食尽乃去。竟为湖人所有。遂住报本禅院。六年十一月十六日升坐说偈曰。五十五年梦幻身。东西南北孰为亲。白云散尽青山外。万里秋空片月新。言讫而化。右司谏陈公莹中在湖亲见其事云。师为人孤硬风度甚高。威仪端重危坐终日。南禅师门弟子能踪迹其行藏者惟师而已遗言葬岘山之阳。门弟子元正
  ref: T51n2077_p0574c28（续传灯录）
- text: 问。何独念岘山乎。师曰。他日可建寺。后三十年太师楚国公王黼追想师道。为请于朝赐谥证悟禅师。塔曰定应。有旨建显化寺。岁度僧以奉香火云
  ref: T51n2077_p0574c28（续传灯录）
