id: L::清献公赵抃居士
name: 清献公赵抃
school: 曹洞宗
teacher: 蒋山泉
status: draft
bio: 字悦道。年四十余。摈去声色。系心宗教。会佛慧来居衢之南禅。公日亲之。慧未尝容措一词。后典青州。政事之余。多宴坐。忽大雷震惊。即契悟作偈曰。默坐公堂虗隐几。心源不动湛如水。一声霹雳顶门开。唤起从前自家底。慧闻笑曰。赵悦道撞彩耳。富郑公初于宗门。未有所趣。公勉之书曰。伏惟执事。富贵如是之极。道德如是之盛。福寿康宁如是之备。退休闲逸如是之高。其所未甚留意者。如来一大事因缘而已。能专诚求所证悟。则他日为门下贺也。公年七十有二。以太子少保致仕而归。亲旧里民。遇之如故。作高斋以自适。题偈见意曰。腰佩黄金已退藏。个中消息也寻常。世人欲识高斋老。祇是柯村赵四郎。复曰。切忌错认。临薨遗佛慧书曰。非师平日警诲。至此必不得力矣。慧悼以偈曰。仕也󳬛为瑞。归欤世作程。人间金粟去。天上玉楼成。慧剑无纤缺。冰壶彻底清。春风󳯐水路。孤月照云明
