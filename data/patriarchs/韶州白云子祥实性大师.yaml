id: 韶州白云子祥实性大师
name: 韶州白云子祥实性
school: 云门宗
teacher: 云门偃
status: draft
bio: 初住慈光院。广主召入府说法。时有
sayings:
- text: 僧问。觉华才绽。正遇明时。不昧宗风。乞师方便。师曰。我王有令
  ref: X80n1565_p0561a06（五灯会元）
- text: 问。祖意教意。是同是别。师曰。不别。曰。恁么则同也。师曰。不妨领话
  ref: X80n1565_p0561a06（五灯会元）
- text: 问。诸佛出世。普遍大千。白云一会。如何举扬。师曰。赚却几人来。曰。恁么则四众何依。师曰。没交涉
  ref: X80n1565_p0561a06（五灯会元）
- text: 问。即心即佛。示诲之辞。不涉前言。如何指教。师曰。东西且置。南北作么生
  ref: X80n1565_p0561a06（五灯会元）
- text: 问。如何是和尚家风。师曰。石桥那畔有。这边无。会么。曰。不会。师曰。且作丁公吟
  ref: X80n1565_p0561a06（五灯会元）
- text: 问。衣到六祖。为甚么不传。师曰。海晏河清
  ref: X80n1565_p0561a06（五灯会元）
- text: 问。从上宗乘。如何举扬。师曰。今日未吃茶
  ref: X80n1565_p0561a06（五灯会元）
- text: 上堂。诸人会么。但向街头市尾．屠儿魁刽．地狱镬汤处会取。若恁么会得。堪与人天为师。若向衲僧门下。天地悬殊。更有一般底。祇向长连床上作好人去。汝道此两般人。那个有长处。无事。珍重。问僧。甚么处来。曰。云门来。师曰。里许有多少水牛。曰。一个两个。师曰。好水牛。问僧。不坏假名而谈实相。作么生。僧指倚子曰。这个是倚子。师以手拨倚曰。与我将鞋袋来。僧无对。师曰。这虗头汉云门闻。乃云。须是我祥兄始得。师将示灭。白众曰。某甲虽提祖印。未尽其中事。诸仁者且道其中事作么生。莫是无边中间内外已否。若如是会。即大地如铺沙。良久曰。去此即他方相见。言讫而寂
  ref: X80n1565_p0561a06（五灯会元）
