bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0198a08。
sayings:
- text: 僧问。如何是未出世边事。师曰。髻中珠未解。石女敛双眉。曰。出世后如何。师曰。灵龟呈卦兆。失却自家身
  ref: X80n1565_p0198a08（五灯会元）
- text: 问。此地名甚么。师曰。肥田。曰。宜种甚么。师便打。师有偈曰。修多好句枉工夫。返本还源是大愚。祖佛不从修证得。纵行玄路也崎岖
  ref: X80n1565_p0198a08（五灯会元）
