school: —
teacher: 翠岩参
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0296b17。
sayings:
- text: 僧问。正位中还有人成佛否。师曰。谁是众生。曰。若恁么则总成佛去也。师曰。还我正位来。曰。如何是正位。师曰。汝是众生
  ref: X80n1565_p0296b17（五灯会元）
- text: 问。如何是无价珍。师曰。卞和空抱璞。曰。忽遇楚王。还进也无。师曰。凡圣相继续
  ref: X80n1565_p0296b17（五灯会元）
- text: 问。古人拈布毛意作么生。师曰。阇黎举不全。曰。如何举得全
  ref: X80n1565_p0296b17（五灯会元）
