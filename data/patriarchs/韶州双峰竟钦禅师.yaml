id: 韶州双峰竟钦禅师
name: 韶州双峰竟钦
school: 云门宗
teacher: 云门文偃禅师
status: draft
bio: 慧真广悟禅师益州人也。受业于峨眉洞溪山黑水寺。观方慕道。预云门法席密承指喻。乃开山创院渐成丛林。开堂日云门和尚躬临证明
sayings:
- text: 僧问。如何是佛法大意。师曰。日出方知天下朗。无油那点佛前灯。问如何是双峰境。师曰。夜听水流庵后竹。昼看云起面前山。问如何是法王剑。师曰。铅刀徒逞不若龙泉。曰用者如何。师曰。藏锋犹不许。露刃更何堪。问宾头卢应供四天下还得遍也无。师曰。如月入水。问如何是用而不杂。师曰。明月堂前垂玉露。水精殿里撒真珠。有行者
  ref: T51n2076_p0385b05（景德传灯录）
- text: 问。某甲遇贼来时。若杀即违佛教不杀又违王敕。未审师意如何。师曰。官不容针私通车马。广主刘氏尝亲问法要。至太平兴国二年三月戒门人曰。吾不久去世。汝可就本山顶预修坟塔。至五月二十三日工毕。师曰。后日子时行矣。及期会云门爽和尚温门舜峰长老等七人夜话。侍者报三更。师索香焚之合掌而逝
  ref: T51n2076_p0385b05（景德传灯录）
