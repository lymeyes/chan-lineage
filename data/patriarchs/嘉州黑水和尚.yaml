bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0303b12。
sayings:
- text: 问。雪覆芦花时如何。龙曰。猛烈。师曰。不猛烈。龙又曰。猛烈。师又曰。不猛烈。龙便打。师于此有省。即便礼拜
  ref: X80n1565_p0303b12（五灯会元）
