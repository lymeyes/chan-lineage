id: 镇州金牛和尚
name: 镇州金牛
school: 南岳系
teacher: 马祖一
status: draft
bio: 每自做饭。供养众僧。至斋时。舁饭桶到堂前作舞。呵呵大笑曰。菩萨子。吃饭来
sayings:
- text: 僧问长庆。古人抚掌唤僧吃饭。意旨如何。庆云。大似因斋庆赞
  ref: X80n1565_p0116b04（五灯会元）
- text: 僧问大光。未审庆赞个甚么。光作舞。僧礼拜。光云。这野狐精。东禅齐云。古人自出手作饭。舞了唤人来吃。意作么生。还会么。祇如长庆与大光。是明古人意。别为他分析。今问上座。每日持钵掌盂时。迎来送去时。为当与古人一般。别有道理。若道别。且作么生得别来。若一般。恰到他舞。又被唤作野狐精。有会处么。若未会。行脚眼在甚么处
  ref: X80n1565_p0116b04（五灯会元）
