id: L::通州狼山萝庵慧温禅师
name: 通州狼山萝庵慧温
school: 杨岐派
teacher: 龙翔珪
status: draft
bio: 福州人。姓郑氏。遍参诸老。晚依竹庵于东林。未几。庵谢事。复谒高庵悟．南华昺．草堂清。皆蒙赏识。会竹庵徙闽之乾元。师归省次。庵
sayings:
- text: 问。情生智隔。想变体殊。不用停囚长智。道将一句来。师乃释然。述偈曰。拶出通身是口。何妨骂雨诃风。昨夜前村猛虎。咬杀南山大虫。庵首肯。住后
  ref: X80n1565_p0818b08（五灯会元）
- text: 上堂。释迦老子。四十九年。坐筹帷幄。弥勒大士。九十一劫。带水拖泥。凡情圣量。不能刬除。理照觉知。犹存露布。佛意祖意。如将鱼目作明珠。大乘小乘。似认橘皮为猛火。诸人须是豁开𮌎襟宝藏。运出自己家珍。向十字街头普施贫乏。众中忽有个灵利汉出来道。美食不中饱人吃。山僧只向他道。幽州犹自可。最苦是新罗
  ref: X80n1565_p0818b08（五灯会元）
