id: L::潭州伏龙山禅师
name: 潭州伏龙山
school: 青原系
teacher: 大光诲
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0208b12。
sayings:
- text: 僧问。搅长河为酥酪。变大地作黄金时如何。师曰。臂长衫袖短
  ref: X80n1565_p0208b12（五灯会元）
- text: 问。随缘认得时如何。师曰。雪内牡丹花
  ref: X80n1565_p0208b12（五灯会元）
- text: 问。如何是祖师西来意。师曰。你得恁么不识痛痒
  ref: X80n1565_p0208b12（五灯会元）
