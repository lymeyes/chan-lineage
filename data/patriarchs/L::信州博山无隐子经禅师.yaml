status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0697b08。
sayings:
- text: 上堂。和气生枯枿。寒云散远郊。木人占吉兆。夜半露龟爻。诸禅德。龟爻露处。文彩已彰。便见一年十二月。月月如然。一日十二时。时时相似。到这里直似黄金之黄。白玉之白。自从旷大劫来。未尝异色。还见么。其或未然。且徇张三通节序。从教李四鬓苍浪
  ref: X80n1565_p0697b08（五灯会元）
