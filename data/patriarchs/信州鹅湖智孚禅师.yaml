id: 信州鹅湖智孚禅师
name: 信州鹅湖智孚
school: —
teacher: 雪峰存
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0264b02。
sayings:
- text: 僧问。万法归一。一归何所。师曰。非但阇黎一人忙
  ref: X80n1565_p0264b02（五灯会元）
- text: 问。虗空讲经。以何为宗。师曰。阇黎不是听众。出去
  ref: X80n1565_p0264b02（五灯会元）
- text: 问。五逆之子。还受父约也无。师曰。虽有自裁。未免伤己
  ref: X80n1565_p0264b02（五灯会元）
- text: 问。如何是佛向上人。师曰。情知阇黎不奈何。曰。为甚么不奈何。师曰。未必小人得见君子
  ref: X80n1565_p0264b02（五灯会元）
- text: 问。在前一句。请师道。师曰。脚跟下探取甚么。曰。即今见
  ref: X80n1565_p0264b02（五灯会元）
- text: 问。师曰。看阇黎变身不得
  ref: X80n1565_p0264b02（五灯会元）
- text: 问。雪峰抛下拄杖。意作么生。师以香匙抛下地。僧曰。未审此意如何。师曰。不是好种。出去
  ref: X80n1565_p0264b02（五灯会元）
- text: 问。如何是鹅湖第一句。师曰。道甚么。曰。如何即是。师曰。妨我打睡
  ref: X80n1565_p0264b02（五灯会元）
- text: 问。不问不答时如何。师曰。问人焉知
  ref: X80n1565_p0264b02（五灯会元）
- text: 问。迷子未归家时如何。师曰。不在途。曰。归后如何。师曰。正迷在
  ref: X80n1565_p0264b02（五灯会元）
- text: 问。如何是源头事。师曰。途中觅甚么
  ref: X80n1565_p0264b02（五灯会元）
- text: 问。如何是一句。师曰。会么。曰。恁么莫便是否。师曰。苍天。苍天。镜清
  ref: X80n1565_p0264b02（五灯会元）
- text: 问。如何是即今底。师曰。何更即今。清曰。几就支荷。师曰。语逆言顺。师一日不赴堂。侍者来请赴堂。师曰。我今日在庄吃油糍饱。者曰。和尚不曾出入。师曰。你但去问取庄主。者方出门。忽见庄主归谢和尚到庄吃油糍
  ref: X80n1565_p0264b02（五灯会元）
