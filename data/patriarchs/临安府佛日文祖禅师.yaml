id: 临安府佛日文祖禅师
name: 临安府佛日文祖
school: 云门宗
teacher: 天衣怀
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0622b18。
sayings:
- text: 僧问。峭峻之机。请师垂示。师曰。十字街头八字立。曰。祇如大洋海底行船。须弥山上走马。又作么生。师曰。乌龟向火。曰。恁么则能骑虎头。善把虎尾。师以拄杖点一下。曰。礼拜著
  ref: X80n1565_p0622b18（五灯会元）
