id: L::汀州水塘和尚
name: 汀州水塘
school: 南岳系
teacher: 马祖一
status: draft
bio: 问归宗。甚么人。宗曰。陈州人。师曰。年多少。宗曰。二十二。师曰。阇黎未生时。老僧去来。宗曰。和尚几时生。师竖起拂子。宗曰。这个岂有生邪。师曰。会得即无生。曰。未会在。师无语
sayings: []
