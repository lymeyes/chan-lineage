id: 平江府泗洲用元禅师
name: 平江府泗洲用元
school: 黄龙派
teacher: 建隆昭庆禅师
status: draft
bio: 一日问建隆曰。临济在黄檗。三回问佛法大意。三回被打。意旨如何。语犹未了。被打一拂子。师顿领宗旨。开堂日
sayings:
- text: 僧问。四众云臻。请师说法。师曰。有眼无耳朵。六月火边坐。曰。一句截流。万机顿息。师曰。听事不真。唤钟作瓮
  ref: X80n1565_p0690a03（五灯会元）
- text: 问。朝参暮请。成得甚么边事。师曰。祇要你歇去。曰。早知灯是火。饭熟已多时。师曰。你鼻孔因甚么著拄杖子穿却。曰。拗曲作直又争得。师曰。且教出气
  ref: X80n1565_p0690a03（五灯会元）
- text: 上堂。一二三四五。火里蝍蟟吞却虎。六七八九十。水底泥牛波上立。一日一夜雨霖霖。无孔铁锤洒不入。洒不入。著底急。百川汹涌须弥岌。八臂那咤撞出来。稽首赞叹道难及。咦
  ref: X80n1565_p0690a03（五灯会元）
- text: 上堂。横按拄杖。顾视大众曰。今日平地上吃交。便下座
  ref: X80n1565_p0690a03（五灯会元）
