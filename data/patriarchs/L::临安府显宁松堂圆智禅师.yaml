bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0714b17。
sayings:
- text: 上堂。芦华白。蓼华红。溪边修竹碧烟笼。闲云抱幽石。玉露滴岩丛。昨夜乌龟变作鳖。今朝水牯悟圆通。咄
