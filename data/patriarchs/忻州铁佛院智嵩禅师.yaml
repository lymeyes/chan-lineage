id: 忻州铁佛院智嵩禅师
name: 忻州铁佛院智嵩
school: 临济宗
teacher: 首山念
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0421b06。
sayings:
- text: 问。还记得相识么。参头拟议。第二僧打参头一坐具曰。何不快祇对和尚。师曰。一箭两垛
  ref: X80n1565_p0421b06（五灯会元）
- text: 师问。僧甚处来。曰。台山来。师曰。还见龙王么。曰。和尚试道看。师曰。我若道。即瓦解冰消。僧拟议。师曰。不信道
  ref: X80n1565_p0421b06（五灯会元）
- text: 问。亡僧迁化向甚么处去也。师曰。下坡不走。快便难逢
  ref: X80n1565_p0421b06（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0421b06），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
