bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0505b08。
sayings:
- text: 僧问。国内按剑者是谁。师曰。天王
  ref: X80n1565_p0505b08（五灯会元）
- text: 问。百骸俱溃散。一物镇长灵时如何。师曰。不堕无坏烂
  ref: X80n1565_p0505b08（五灯会元）
- text: 问。如何是佛。师曰。错
  ref: X80n1565_p0505b08（五灯会元）
- text: 问。如何是无相道场。师曰。门外列金刚
  ref: X80n1565_p0505b08（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0505b08），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
