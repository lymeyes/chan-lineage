school: 南岳系
dynasty: 唐
region: 南岳观音台（般若寺）
teacher: 六祖慧能
source_ref: 五灯会元·卷三·南岳怀让 / 景德传灯录·卷五
cbeta: T51n2076 卷五
bio: '金州杜氏子，谒六祖慧能，言下顿悟，侍左右十五年。后居南岳观音台，六祖尝预言「汝足下出一马驹，踏杀天下人」，即马祖道一。

  以「磨砖作镜」启悟马祖：问「磨砖岂得成镜？」马祖曰「磨砖既不成镜，坐禅岂得成佛？」遂豁然。南岳一系下衍临济、沩仰二宗。'
sayings:
- text: 怀让问马祖：「坐禅图作佛，如牛驾车；车若不行，打车即是，打牛即是？」
  ref: 五灯会元·卷三·南岳怀让
