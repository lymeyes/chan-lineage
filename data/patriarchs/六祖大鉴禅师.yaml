id: 六祖大鉴禅师
name: 慧能
honorific: 东土六祖 · 大鉴禅师（谥）· 曹溪大师
school: 东土祖师
dynasty: 唐
region: 曹溪宝林寺（韶州）
teacher: 弘忍
source_ref: 六祖坛经·行由品 / 五灯会元·卷一·六祖慧能 / 景德传灯录·卷五
cbeta: T48n2008（南宗顿教最上大乘摩诃般若波罗蜜经六祖慧能大师于韶州大梵寺施法坛经）
bio: '岭南新州卢氏子，樵采为业，闻客诵《金刚经》「应无所住而生其心」而悟，远赴黄梅谒弘忍。八月踏碓，因作偈「菩提本无树，明镜亦非台；本来无一物，何处惹尘埃」蒙弘忍夜半说法、传衣钵，为第六代祖。

  南归曹溪宝林寺，说法不辍，门人集为《坛经》（唯一被尊为「经」的中国僧人之述）。倡「顿悟」「直指人心、见性成佛」「佛法在世间，不离世间觉」，下开南岳、青原两系，为五家七宗之共祖。'
sayings:
- text: 慧能偈：「菩提本无树，明镜亦非台；本来无一物，何处惹尘埃。」
  ref: 六祖坛经·行由品
- text: 开悟语：「何期自性本自清净，何期自性本不生灭，何期自性本自具足，何期自性本无动摇，何期自性能生万法。」
  ref: 六祖坛经·行由品
- text: 「佛法在世间，不离世间觉；离世觅菩提，恰如求兔角。」
  ref: 六祖坛经·般若品
- text: 风幡公案：广州法性寺，值印宗法师讲《涅槃经》；风吹幡动，二僧对论「风动」「幡动」。师曰「不是风动，不是幡动，仁者心动」。印宗闻之悚然，延问深义，遂为六祖剃发、开东山法门。
  ref: 六祖坛经·行由品 / 景德传灯录·卷五·慧能
- text: 示众：「若欲修行，在家亦得，不由在寺。在家能行，如东方人心善；在寺不修，如西方人心恶。」（后创「无相戒」「在家出家」之普摄门风）
  ref: 六祖坛经·疑问品
