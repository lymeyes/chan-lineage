id: 长庆慧稜禅师
name: 长庆慧稜
alias: 长庆棱 / 超觉大师
school: 南岳系
teacher: 雪峰义存禅师
bio: 福州长庆院慧稜禅师，杭州盐官人，姓孙氏，禀性淳澹。年十三于苏州通玄寺出家登戒，历参禅苑。后参灵云，问「如何是佛法大意」，灵云答「驴事未去，马事到来」。往来雪峰、玄沙二十年间，坐破七个蒲团不明此事；一日卷帘，忽然大悟。住雪峰二十九载，天祐三年泉州刺史王延彬请住招庆，后闽帅请居长庆，号超觉大师。
sayings:
- text: 一日卷帘，忽然大悟，乃有颂曰：「也大差，也大差，卷起帘来见天下；有人问我解何宗，拈起拂子劈口打。」
  ref: 五灯会元·卷七（X80n1565_p0250b07-09）
- text: 又颂曰：「万象之中独露身，唯人自肯乃方亲；昔时谬向途中觅，今日看来火里冰。」
  ref: 五灯会元·卷七（X80n1565_p0250b12-13）
- text: 师问峰曰：「从上诸圣传受一路，请师垂示。」峰良久，师设礼而退，峰乃微笑。师入方丈参，峰曰：「是甚么？」师曰：「今日天晴好普请。」自此酬问，未尝爽于玄旨。
  ref: 五灯会元·卷七（X80n1565_p0250b14-16）
- text: 上堂，良久曰：「还有人相悉么？若不相悉，欺谩兄弟去也。只今有甚么事，莫有窒塞也无？复是谁家屋里事，不肯担荷，更待何时？」
  ref: 五灯会元·卷七（X80n1565_p0251a14-17）
- text: 僧问：「如何是正法眼？」师曰：「有愿不撒沙。」
  ref: 五灯会元·卷七（X80n1565_p0251a11-12）
