id: L::连州宝华和尚
name: 连州宝华
school: —
teacher: 白云祥
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0577b05。
sayings:
- text: 上堂。看天看地。新罗国里。和南不审。日销万两黄金。虽然如此。犹是少分。又曰。尽十方世界。是个木罗汉。幡竿头上道将一句来。又曰。天上龙飞凤走。山间虎啸猿啼。拈向鼻孔。道将一句来。问僧。甚处来。曰。大容来。师曰。大容近日作么生。曰。近来合得一瓮酱。师唤沙弥将一椀水来。与这僧照影。因有
  ref: X80n1565_p0577b05（五灯会元）
- text: 僧问大容曰。天赐六铢披挂后。将何报答我皇恩。容曰。来披三事衲。归挂六铢衣。师闻之。乃曰。这老冻齈作恁么语话。容闻。令人传语曰。何似奴缘不断。师曰。比为抛砖。祇图引玉。师见一僧从法堂堦下过。师乃敲绳床。僧曰。若是这个。不请拈出。师喜。下地诘之。僧无语。师便打。师有时戴冠子。谓众曰。若道是俗。且身披袈裟。若道是僧。又头戴冠子。众无对
  ref: X80n1565_p0577b05（五灯会元）
