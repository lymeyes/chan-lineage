id: L::泉州龟洋无了禅师
name: 泉州龟洋无了
school: 南岳系
teacher: 马祖一
status: draft
bio: 本郡沈氏子。年七岁。父𢹂入白重院。视之如家。因而舍爱。至十八。剃度受具于灵岩寺。后参大寂。了达祖乘。即还本院之北。樵采路绝。师一日策杖披榛而行。遇六眸巨龟。斯须而失。乃庵此峰。因号龟洋。一日。有虎逐鹿入庵。师以杖格虎。遂存鹿命。洎将示化。乃述偈曰。八十年来辨西东。如今不要白头翁。非长非短非大小。还与诸人性相同。无来无去兼无住。了却本来自性空。偈毕。俨然告寂。瘗于正堂垂二十载。为山泉淹没。门人发塔。见全身水中而浮。闽王闻之。遣使舁入府庭供养。忽臭气远闻。王焚香祝之曰。可还龟洋旧址建塔。言讫。异香普熏。倾城瞻礼。本道奏谥真寂大师。塔曰灵觉。后弟子慧忠葬于塔左。今龟洋二真身存焉。忠得法于草庵义和尚
