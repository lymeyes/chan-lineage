id: 紫陵微禅师
name: 紫陵微
school: 曹洞宗
teacher: 紫陵一禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0518a01。
sayings:
- text: 问。近离甚处。师曰。向北山。曰。是何宗徒。师曰。昔日老胡师子吼。顶门一裂至如今。住后
  ref: X80n1565_p0518a01（五灯会元）
- text: 僧问。如何是紫陵境。师曰。寂照灯光夜已深。曰。如何是境中人。师曰。猿啼虎啸
  ref: X80n1565_p0518a01（五灯会元）
- text: 问。宝剑未出匣时如何。师曰。磐陀石上栽松柏
  ref: X80n1565_p0518a01（五灯会元）
- text: 问。如何是大猛烈底人。师曰。石牛步步火中行。返顾休衔日中草。曰。如何是五逆底人。师曰。放火夜烧无相宅。天明戴帽入长安。曰。如何是孝顺底人。师曰。步步手提无米饭。敛手堂前不举头
  ref: X80n1565_p0518a01（五灯会元）
- text: 问。如何是祖师西来意。师曰。红炉焰上碧波流
  ref: X80n1565_p0518a01（五灯会元）
