id: 泐潭祥禅师
name: 泐潭祥
school: —
teacher: 大沩喆禅师
status: draft
bio: 二则举祖师道：心随万境转，转处实能幽。随流认得性，无喜亦无忧。师曰：雁过霜秋，山含红树。文殊与普贤二人争功，未分胜负。遂喝曰：却被宝峰一喝，依旧安家立业。举：云门一日
sayings:
- text: 示众，将拂子摵一下，云：这里得个入处，捏怪去也。日本国里说禅，三十三天上有个人出来唤云：吽！吽！特厍儿。师曰：后来丛林道：云门脚跟不点地。诫实苦哉！宝峰道：日本国人说禅得困，却来宝峰拄杖头上歇息，要为大宋人说法。还闻么？良久，曰：矢上加尖
