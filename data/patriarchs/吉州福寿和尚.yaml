bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0336a17。
sayings:
- text: 僧问。祖意教意。是同是别。师展手
  ref: X80n1565_p0336a17（五灯会元）
- text: 问。文殊骑师子。普贤骑象王。未审释迦骑甚么
  ref: X80n1565_p0336a17（五灯会元）
- text: 师举手云。㖿。㖿
  ref: X80n1565_p0336a17（五灯会元）
