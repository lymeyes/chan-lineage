id: L::南岳法轮齐添禅师
name: 南岳法轮齐添
school: 黄龙派
teacher: 泐潭英
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0690b13。
sayings:
- text: 僧问。学人上来。乞师指示。师曰。汝适来闻鼓声么。曰。闻。师曰。还我话头来。僧礼拜。师曰。令人疑著
  ref: X80n1565_p0690b13（五灯会元）
- text: 上堂。喝一喝曰。师子哮吼。又喝一喝曰。象王嚬呻。又喝一喝曰。狂狗趁块。又喝一喝曰。𫚥跳不出斗。乃曰。此四喝。有一喝堪与祖佛为师。明眼衲僧试请拣看。若拣不出。大似日中迷路
  ref: X80n1565_p0690b13（五灯会元）
- text: 上堂。良久曰。性静情逸。乃喝一喝曰。心动神疲。遂顾左右曰。守真志满。拈拄杖曰。逐物意移。蓦召大众曰。见怪不怪。其怪自坏。靠拄杖。便下座
  ref: X80n1565_p0690b13（五灯会元）
