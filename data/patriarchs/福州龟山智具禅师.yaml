id: 福州龟山智具禅师
name: 福州龟山智具
school: —
teacher: 章敬𣍯禅师
status: draft
bio: 扬州柳氏子。初谒章敬。敬
sayings:
- text: 问。何所而至。师曰。至无所至。来无所来。敬虽默然。师亦自悟。住后
  ref: X80n1565_p0145a12（五灯会元）
- text: 上堂。动容瞬目。无出当人一念净心。本来是佛。仍说偈曰。心本绝尘何用洗。身中无病岂求医。欲知是佛非身处。明鉴高悬未照时。后值武宗沙汰。有偈
  ref: X80n1565_p0145a12（五灯会元）
- text: 示众曰。𠡠命如雷下翠微。风前垂泪脱禅衣。云中有寺不容住。尘里无家何处归。明月分形处处新。白衣宁坠解空人。谁言在俗妨修道。金粟曾为居士身。忍仙林下坐禅时。曾被歌王割截肢。况我圣朝无此事。祇令休道亦何悲。暨宣宗中兴。乃不复披缁。咸通六年终于本山。谥归寂禅师
  ref: X80n1565_p0145a12（五灯会元）
