id: 荆门军玉泉穷谷宗琏禅师
name: 荆门军玉泉穷谷宗琏
school: 杨岐派
teacher: 大沩果
status: draft
bio: 合州董氏子。开堂日。问答已。乃曰。衲僧向人天众前一问一答。一擒一纵。一卷一舒。一挨一拶。须是具金刚睛眼始得。若是念话之流。君向西秦。我之东鲁。于宗门中殊无所益。这一段事。不在有言。不在无言。不碍有言。不碍无言。古人垂一言半句。正如国家兵器。不得已而用之。横说竖说。祇要控人入处。其实不在言句上。今时人不能一径彻证根源。祇以语言文字而为至道。一句来。一句去。唤作禅道。唤作向上向下。谓之菩提涅槃。谓之祖师巴鼻。正似郑州出曹门。从上宗师会中。往往真个以行脚为事底。才有疑处。便对众决择。祇一句下见谛明白。造佛祖直指不传之宗。与诸有情尽未来际。同得同证。犹未是泊头处。岂是空开唇皮。胡言汉语来。所以南院
sayings:
- text: 示众云。诸方祇具啐󲣅同时眼。不具啐󲣅同时用。时有
  ref: X80n1565_p0821b18（五灯会元）
- text: 僧问。如何是啐󲣅同时用。院曰。作家不啐󲣅。啐󲣅同时失。僧曰。犹是学人问处。院曰。如何是你问处。僧曰。失。院便打。其僧不契。后至云门会中。因二僧举此话。一僧曰。当时南院棒折那。其僧忽悟。即回南院。院已迁化。时风穴作维那。问曰。你是问先师啐󲣅同时话底僧那。僧曰。是。穴曰。你当时如何。曰。我当时如在灯影里行。穴曰。你会也。师乃召大众曰。暗穿玉线。密度金针。如水入水。似金博金。敢问大众。啐󲣅同时是亲切处。因甚却失。若也会得。堪报不报之恩。共助无为之化。便可横身宇宙。独步大方。若跳不出。依前祇在架子下
  ref: X80n1565_p0821b18（五灯会元）
- text: 上堂。拈拄杖曰。破无明暗。截生死流。度三有城。泛无为海。须是识这个始得。乃召大众曰。唤作拄杖则触。不唤作拄杖则背。若也识得。荆棘林中撒手。是非海里横身。脱或未然。普贤乘白象。土宿跨泥牛。参
  ref: X80n1565_p0821b18（五灯会元）
- text: 上堂。一切数句非数句。与吾灵觉何交涉。师曰。永嘉恁么道。大似含元殿上更觅长安。殊不知有水皆含月。无山不带云。虽然如是。三十年后赵婆酤醋
  ref: X80n1565_p0821b18（五灯会元）
- text: 上堂。宗乘一唱殊途绝。万别千差俱泯灭。通身是口难分雪。金刚脑后三斤铁。好大哥
  ref: X80n1565_p0821b18（五灯会元）
- text: 僧问。保寿开堂。三圣推出一僧。保寿便打。意旨如何。师曰。利动君子。曰。为复棒头有眼。为复见机而作。师曰。猕猴系露柱。曰。祇如三圣道。你恁么为人。瞎却镇州一城人眼。又作么生。师曰。锦上铺华又一重
  ref: X80n1565_p0821b18（五灯会元）
- text: 问。行脚逢人时如何。师曰。一不成。二不是。曰。行脚不逢人时如何。师曰。虎咬大虫。曰。祇如慈明道。钓丝绞水。意作么生。师曰。水浸钢石卵
  ref: X80n1565_p0821b18（五灯会元）
- text: 问。三圣道。我逢人即出。出则不为人。意旨如何。师曰。兵行诡道。曰。兴化道。我逢人则不出。出则便为人。又作么生。师曰。绵裹秤锤
  ref: X80n1565_p0821b18（五灯会元）
- text: 问。不落因果。为甚么堕野狐身。师曰。庐山五老峰。曰。不昧因果。为甚么脱野狐身。师曰。南岳三生藏。曰。祇如不落不昧。未审是同是别。师曰。倚天长剑逼人寒
  ref: X80n1565_p0821b18（五灯会元）
- text: 问。初生孩子还具六识也无。赵州道。急水上打球子。意旨如何。师曰。两手扶犂水过膝。曰。祇如僧又问投子急水上打球子。意旨如何。曰。念念不停流。又作么生。师曰。水晶瓮里浸波斯
  ref: X80n1565_p0821b18（五灯会元）
- text: 问。杨岐道。三脚驴子弄蹄行。意旨如何。师曰。过蓬州了。便到巴州
  ref: X80n1565_p0821b18（五灯会元）
