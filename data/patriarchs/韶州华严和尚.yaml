id: 韶州华严和尚
name: 韶州华严
school: 曹洞宗
teacher: 曹山寂
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0498a08。
sayings:
- text: 僧问。既是华严。还将得华来么。师曰。孤峰顶上千枝秀。一句当机对圣明。僧录
  ref: X80n1565_p0498a08（五灯会元）
- text: 问。法身无相。不可言宣。皇帝诏师。将何接引。师曰。金钟迥出云中响。万里归朝贺圣君
  ref: X80n1565_p0498a08（五灯会元）
- text: 问。如何是佛法大意。师曰。惊天动地。曰。还当也无。师曰。灵机永布千家月。祇这如今万世传
  ref: X80n1565_p0498a08（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0498a08），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
