id: 松山和尚
name: 松山
school: 南岳系
teacher: 马祖道一禅师
status: draft
bio: 同庞居士吃茶。士举橐子曰。人人尽有分。为甚么道不得。师曰。祇为人人尽有。所以道不得。士曰。阿兄为甚么却道得。师曰。不可无言也。士曰。灼然。灼然。师便吃茶。士曰。阿兄吃茶。为甚么不揖客。师曰。谁。士曰。庞公。师曰。何须更揖。后丹霞闻。乃曰。若不是松山。几被个老翁惑乱一上。士闻之。乃令人传语霞曰。何不会取未举橐子时
