id: 临安府净慈混源昙密禅师
name: 临安府净慈混源昙密
school: 杨岐派
teacher: 教忠弥光禅师
status: draft
bio: 天台卢氏子。依资福道荣出家。十六圆具。习台教。弃参大慧于径山。谒雪巢一此庵元。入闽。留东．西禅。无省发。之泉南。教忠俾悦众。解职归前资。偶举香严击竹因缘。豁然契悟。述偈呈忠。忠举玄沙未彻语诘之。无滞。忠曰。子方可见妙喜。即辞往梅阳。服勤四载。住后
sayings:
- text: 上堂。诸佛出世。打劫杀人。祖师西来。吹风放火。古今善知识。佛口虵心。天下衲僧。自投笼槛。莫有天然气槩。特达丈夫。为宗门出一只手。主张佛法者么。良久曰。设有。也须斩为三段
  ref: X80n1565_p0825a02（五灯会元）
- text: 上堂。德山小参不答话。千古丛林成话霸。问话者三十棒。惯能说诃说夯。时有僧出。的能破的。德山便打风流儒雅。某甲话也未
  ref: X80n1565_p0825a02（五灯会元）
- text: 问。头上著枷。脚下著匣。你是那里人。一回相见一伤神。新罗人把手笑欣欣。未跨船舷。好与三十棒。依前相厮诳。混源今日恁么批判责情。好与三十棒。且道是赏是罚。具参学眼者试辨看
  ref: X80n1565_p0825a02（五灯会元）
- text: 上堂。举云门问僧光明寂照遍河沙因缘。师曰。平地摝鱼𫚥。辽天射飞鹗。跛脚老云门。千错与万错。后示寂。塔于本山
  ref: X80n1565_p0825a02（五灯会元）
