id: 东京慧海仪禅师
name: 东京慧海仪
school: 黄龙派
teacher: 法云杲禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0707a06。
sayings:
- text: 上堂。无相如来示现身。破魔兵众绝纤尘。七星斜暎风生处。四海还归旧主人。诸仁者。大迦叶灵山会上。见佛拈华。投机微笑。须菩提闻佛说法。深解义趣。涕泪悲泣。且道笑者是。哭者是。不见道。万派横流总向东。超然八面自玲珑。万人胆破沙场上。一箭双雕落碧空
  ref: X80n1565_p0707a06（五灯会元）
- text: 上堂。举。沩山坐次。仰山
  ref: X80n1565_p0707a06（五灯会元）
- text: 问。和尚百年后。有人问先师法道。如何祇对。沩曰。一粥一󰕖。仰曰。前面有人不肯。又作么生。沩曰。作家师僧。仰便礼拜。沩曰。逢人不得错举。师曰。自古及今。多少人下语道。严而不威。恭而无礼。横按拄杖。竖起拳头。若祇恁么。却如何知得他父子相契处。山僧今日也要诸人共知。莫分彼我。彼我无殊。困鱼止泺。病鸟栖芦。逡巡不进泥中履。争得先生一卷书。西蜀銮法师西蜀銮法师通大小乘。佛照谢事。居景德。师问照曰。禅家言多不根。何也。照曰。汝习何经论。曰。诸经粗知。颇通百法。照曰。祇如昨日雨。今日晴。是甚么法中收。师懵然。照举痒和子击曰。莫道禅家所言不根好。师愤曰。昨日雨。今日晴。毕竟是甚么法中收。照曰。第二十四时分。不相应法中收。师恍悟。即礼谢。后归蜀居讲会。以直道示徒。不泥名相。而众多引去。遂说偈罢讲曰。众卖华兮独卖松。青青颜色不如红。算来终不与时合。归去来兮翠霭中。由是隐居二十年。道俗追慕。复命演法。笑答偈曰。遁迹隐高峰。高峰又不容。不如归锦里。依旧卖青松。众列拜悔过。两川讲者争依之
  ref: X80n1565_p0707a06（五灯会元）
