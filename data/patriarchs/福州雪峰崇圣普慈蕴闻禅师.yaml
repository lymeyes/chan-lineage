bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0800a02。
sayings:
- text: 示众云。旃檀丛林。旃檀围绕。师子丛林。师子围绕。虎狼丛林。虎狼围绕。荆棘丛林。荆棘围绕。大众。四种丛林。合向那一种丛林安居好。若也明得。九十日内。管取个个成佛作祖。其或未然。般若丛林岁岁凋。无明荒草年年长
  ref: X80n1565_p0800a02（五灯会元）
