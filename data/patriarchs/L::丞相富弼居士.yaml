id: L::丞相富弼居士
name: 丞相富弼
school: 云门宗
teacher: 投子颙
status: draft
bio: 字彦国。由清献公警励之后。不舍昼夜。力进此道。闻颙禅师主投子。法席冠淮甸。往质所疑。会颙为众登座。见其顾视如象王回旋。公微有得。因执弟子礼。趋函丈。命侍者请为入室。颙见即曰。相公已入来。富弼犹在外。公闻汗流浃背。即大悟。寻以偈寄圆照本曰。一见颙公悟入深。夤缘传得老师心。东南谩说江山远。目对灵光与妙音。后奏署颙师号。颙
sayings:
- text: 上堂谢语。有曰。彼一期之悮我。亦将错而就错。公作偈赞曰。万木千花欲向荣。卧龙犹未出沧溟。彤云彩雾呈嘉瑞。依旧南山一色青
