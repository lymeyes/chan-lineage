id: 福州怡山长庆藏用禅师
name: 福州怡山长庆藏用
school: —
teacher: 安国𤦆
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0299b16。
sayings:
- text: 上堂。众集。以扇子抛向地上曰。愚人谓金是土。智者作么生。后生可畏。不可总守愚去也。还有人道得么。出来道看。时有僧出礼拜。退后而立。师曰。别更作么生。曰。请和尚明鉴。师曰。千年桃核
  ref: X80n1565_p0299b16（五灯会元）
- text: 问。如何是伽蓝。师曰。长溪莆田。曰。如何是伽蓝中人。师曰。新罗白水
  ref: X80n1565_p0299b16（五灯会元）
- text: 问。如何是灵泉正主。师曰。南山北山
  ref: X80n1565_p0299b16（五灯会元）
- text: 问。如何是和尚家风。师曰。斋前厨蒸南国饭。午后炉煎北苑茶
  ref: X80n1565_p0299b16（五灯会元）
- text: 问。法身还受苦也无。师曰。地狱岂是天堂。曰。恁么则受苦去也。师曰。有甚么罪过
  ref: X80n1565_p0299b16（五灯会元）
