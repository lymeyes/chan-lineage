id: 升州奉先寺慧同净照禅师
name: 升州奉先寺慧同净照
school: —
teacher: 清凉复
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0314a15。
sayings:
- text: 僧问。教中道。唯一坚密身。一切尘中见。又道。佛身充满于法界。普见一切群生前。于此二途。请师说。师曰。唯一坚密身。一切尘中见
  ref: X80n1565_p0314a15（五灯会元）
- text: 问。如何是古佛心。师曰。汝拟阿那个不是
  ref: X80n1565_p0314a15（五灯会元）
- text: 问。如何是常在底人。师曰。更问阿谁
  ref: X80n1565_p0314a15（五灯会元）
