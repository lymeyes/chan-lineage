id: 邓州香严倚松如璧禅师
name: 邓州香严倚松如璧
school: 云门宗
teacher: 香严月禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0647a17。
sayings:
- text: 上堂。变化密移何太急。刹那念念一呼吸。八万四千方便门。且道何门不可入。入不入。晓来雨打芭蕉湿。殷勤更问个中人。门外堂堂相对立。闻󲣅木鸟鸣。说偈曰。剥剥剥。里面有虫外面󲣅。多少茫茫瞌睡人。顶后一锥犹未觉。若不觉。更听山僧剥剥剥
  ref: X80n1565_p0647a17（五灯会元）
