id: 杭州龙华寺慧居禅师
name: 杭州龙华寺慧居
school: 法眼宗
teacher: 天台韶
status: draft
bio: 闽人也。自天台领旨。忠懿王命住上寺。开堂
sayings:
- text: 示众曰。从上宗乘。到这里如何举唱。祇如释迦如来说一代时教。如瓶注水。古德尚云。犹如梦事寱语一般。且道据甚么道理便恁么道。还会么。大施门开。何曾壅塞。生凡育圣。不漏纤尘。言凡则全凡。举圣则全圣。凡圣不相待。个个独称尊。所以道。山河大地。长时说法。长时放光。地水火风。一一如是。时有僧出礼拜。师曰。好个问头。如法问著。僧拟进前。师曰。又没交涉也
  ref: X80n1565_p0373b18（五灯会元）
- text: 问。诸佛出世。放光动地。和尚出世。有何祥瑞。师曰。话头自破
  ref: X80n1565_p0373b18（五灯会元）
- text: 上堂。龙华这里。也祇是拈柴择菜。上来下去。晨朝一粥。斋时一饭。睡后吃茶。但恁么参取。珍重
  ref: X80n1565_p0373b18（五灯会元）
- text: 问。学人未明自己。如何辨得浅深。师曰。识取自己眼。曰。如何是自己眼。师曰。向汝道甚么
  ref: X80n1565_p0373b18（五灯会元）
