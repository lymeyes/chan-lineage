bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0296b05。
sayings:
- text: 上堂。我若全机。汝向甚么处摸索。葢为根器不等。便成不具惭愧。还委得么。如今与诸仁者作个入底门路。乃敲绳床两下曰。还见么。还闻么。若见便见。若闻便闻。莫向意识里卜度。却成妄想颠倒。无有出期。珍重。佛塔被雷霹。有
  ref: X80n1565_p0296b05（五灯会元）
- text: 问。祖佛塔庙为甚么却被雷霹。师曰。通天作用。曰。既是通天作用。为甚么却霹佛。师曰。作用何处见有佛。曰。争奈狼藉何。师曰。见甚么
  ref: X80n1565_p0296b05（五灯会元）
