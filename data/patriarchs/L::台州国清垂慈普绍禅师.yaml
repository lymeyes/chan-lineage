bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0647b17。
sayings:
- text: 上堂。灵云悟桃花。玄沙傍不肯。多少痴禅和。担雪去填井。今春花又开。此意谁能领。端的少人知。花落春风静
  ref: X80n1565_p0647b17（五灯会元）
