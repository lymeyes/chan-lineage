id: L::本生禅师
name: 本生
school: 青原系
teacher: 大颠通
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0180b05。
sayings:
- text: 示众曰。我若拈起。你便向未拈起时作道理。我若不拈起。你便向拈起时作主宰。且道老僧为人在甚处。时有僧出曰。不敢妄生节目。师曰。也知阇黎不分外。曰。低低处平之有余。高高处观之不足。师曰。节目上更生节目。僧无语。师曰。掩鼻偷香。空招罪犯
  ref: X80n1565_p0180b05（五灯会元）
