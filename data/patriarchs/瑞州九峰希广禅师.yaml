id: 瑞州九峰希广禅师
name: 瑞州九峰希广
school: 黄龙派
teacher: 宝峰文禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0683b10。
sayings:
- text: 问。兴化打克宾。意旨如何。智下禅床。展两手吐舌示之。师打一坐具。智曰。此是风力所转。又问石霜琳禅师。琳曰。你意作么生。师亦打一坐具。琳曰。好一坐具。祇是不知落处。又问真净。净曰。你意作么生。师复打一坐具。净曰。他打你也打。师于言下大悟。净因有颂曰。丈夫当断不自断。兴化为人彻底汉。已后从教眼自开。棒了罚钱趁出院。后住九峰。衲子宗仰
  ref: X80n1565_p0683b10（五灯会元）
