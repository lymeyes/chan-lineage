bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0310b08。
sayings:
- text: 僧问。古人道不从请益得。祖师为甚么道谁得作佛。师曰。悟了方知
  ref: X80n1565_p0310b08（五灯会元）
- text: 问。从上宗乘次第指授。未审今日如何举唱。师曰。透出白云深洞里。名华异草岭头生
  ref: X80n1565_p0310b08（五灯会元）
