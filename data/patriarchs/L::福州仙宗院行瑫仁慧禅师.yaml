id: L::福州仙宗院行瑫仁慧禅师
name: 福州仙宗院行瑫仁慧
school: 雪峰宗
teacher: 雪峰存
status: draft
bio: 福州仙宗院仁慧大师行瑫，泉州王氏子，本州开元寺受业，预雪峰禅会，声闻四远。闽帅请转法轮，玄徒奔至。赐号仁慧大师。注意：谱系树中法讳作「行瑫仁慧」，景录原文作「仁慧行瑫大师」（仁慧为号、行瑫为讳）。
sayings:
- text: 上堂曰：「我与释迦同参。汝道参什么人？」时一僧出礼拜，拟伸问，师曰：「错。」
  ref: 景德传灯录·卷十八（T51n2076_p0352a03-04）
- text: 问：「如何是西来意？」师曰：「熊耳不曾藏。」
  ref: 景德传灯录·卷十八（T51n2076_p0352a05）
- text: 问：「如何是西来意？」师曰：「白日无闲人。」
  ref: 景德传灯录·卷十八（T51n2076_p0352a07）
verify: 已对校 CBETA XML P5：《景德传灯录》卷十八 T51n2076_p0352a01-07 逐字命中；三条机缘语均据原文录入。原文寺院作「僊宗院」，此前转写作「迁宗院」系形近之误，已更正。
