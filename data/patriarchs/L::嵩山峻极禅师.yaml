id: L::嵩山峻极禅师
name: 嵩山峻极
school: —
teacher: 破灶堕
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0054a16。
sayings:
- text: 僧问。如何是修善行人。师曰。担枷带鏁。曰。如何是作恶行人。师曰。修禅入定。曰。某甲浅机。请师直指。师曰。汝问我恶。恶不从善。汝问我善。善不从恶。僧良久。师曰。会么僧。曰。不会。师曰。恶人无善念。善人无恶心。所以道善恶如浮云。俱无起灭处。僧于言下大悟。后破灶堕闻举。乃曰。此子会尽诸法无生。五祖下四世五祖下四世
  ref: X80n1565_p0054a16（五灯会元）
