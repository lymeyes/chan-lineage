id: L::常德府文殊思业禅师
name: 常德府文殊思业
school: 杨岐派
teacher: 文殊道
status: draft
bio: 世为屠宰。一日戮猪次。忽洞彻心源。即弃业为比丘。述偈曰。昨日夜叉心。今朝菩萨面。菩萨与夜叉。不隔一条线。往见文殊。殊曰。你正杀猪时见个甚么。便乃剃头行脚。师遂作鼓刀势。殊喝曰。这屠儿参堂去。师便下参堂。住文殊日
sayings:
- text: 上堂举赵州勘婆话。乃曰。勘破婆子。面青眼黑。赵州老汉。瞒我不得
  ref: X80n1565_p0817a12（五灯会元）
