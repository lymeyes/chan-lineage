id: 鄂州菜萸山和尚
name: 鄂州菜萸山
school: 南岳系
teacher: 南泉愿
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0138a04。
sayings:
- text: 上堂。擎起一橛竹曰。还有人虗空里钉得橛么。时有灵虗上座出众曰。虗空是橛。师掷下竹。便下座。赵州到云居。居曰。老老大大。何不觅个住处。曰。甚么处住得。居曰。山前有个古寺基。州曰。和尚自住取。后到师处。师曰。老老大大。何不觅个住处。州曰。向甚处住。师曰。老老大大。住处也不知。州曰。三十年弄马骑。今日却被驴扑云居锡云。甚么处是赵州被驴扑处。众僧侍立次。师曰。祇恁么白立。无个说处。一场气闷。僧拟
  ref: X80n1565_p0138a04（五灯会元）
- text: 问。师便打。曰。为众竭力。便入方丈。有行者参。师曰。会去看赵州么。曰。和尚敢道否。师曰。非但茱萸。一切人道不得。曰。和尚放某甲过。师曰。这里从前不通人情。曰。要且慈悲心在。师便打。曰。醒后来为汝
  ref: X80n1565_p0138a04（五灯会元）
