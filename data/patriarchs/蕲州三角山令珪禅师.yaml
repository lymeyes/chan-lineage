id: 蕲州三角山令珪禅师
name: 蕲州三角山令珪
school: 青原系
teacher: 清平遵
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0207a02。
sayings:
- text: 问。来作么。师曰。来礼拜。平曰。礼拜阿谁。师曰。特来礼拜和尚。平咄曰。这钝根阿师。师乃礼拜。平以手斫师颈一下。从此领旨。住后
  ref: X80n1565_p0207a02（五灯会元）
- text: 僧问。如何是佛。师曰。明日来。向汝道。如今道不得
  ref: X80n1565_p0207a02（五灯会元）
