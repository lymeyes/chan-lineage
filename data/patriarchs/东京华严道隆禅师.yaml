id: 东京华严道隆禅师
name: 东京华严道隆
school: 临济宗
teacher: 广慧琏
status: draft
bio: 初参石门彻和尚。问曰。古者道。但得随处安闲。自然合他古辙。虽有此语。疑心未歇时如何。门曰。知有乃可随处安闲。如人在州县住。或闻或见。千奇百怪。他总将作寻常。不知有而安闲。如人在村落住。有少声色则惊怪传说。师于言下有省。门尽授其洞上厥旨。后为广慧嗣。一日。福严承和尚问曰。禅师亲见石门。如何却嗣广慧。师曰。我见广慧。渠欲剃发。使我擎凳子来。慧曰。道者。我有凳子诗听取。乃曰。放下便平稳。我时便肯伊。因叙在石门处所得。广慧曰。石门所示。如百味珍羞。祇是饱人不得。师至和初游京。客景德寺。日纵观都市。归常二鼓。一夕不得入。卧于门之下。仁宗皇帝梦至寺门。见龙蟠地。惊觉。中夜遣中使视之。睹师熟睡鼻鼾。撼之惊矍。问名归奏。帝闻名道隆。乃喜曰。吉征也。明日召至便殿。问宗旨。师奏对详允。帝大悦。后以偈句相酬唱。络绎于道。或入对留宿禁中。礼遇特厚。赐号应制明悟禅师。皇祐间。诏大觉琏禅师于化成殿演法。召师问话。机锋迅捷。帝大悦。侍卫皆山呼。师即奏疏举琏自代。禁林待
sayings:
- text: 问。秘殿谭禅。乞归庐山。帝覧表不允。有旨。于曹门外建精舍延师。赐号华严禅院。开堂
  ref: X80n1565_p0438a13（五灯会元）
- text: 僧问。如何是道。师曰。高高低低。曰。如何是道中人。师曰。脚瘦草鞋宽。师年八十余。示寂于盛暑。安坐七日。手足柔和。全身塔于寺之东
  ref: X80n1565_p0438a13（五灯会元）
