id: L::澧州药山禅师
name: 澧州药山
school: —
teacher: 藤霞
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0217b15。
sayings:
- text: 上堂。夫学般若菩萨。不惧得失。有事近前。时有
  ref: X80n1565_p0217b15（五灯会元）
- text: 僧问。药山祖裔。请
  ref: X80n1565_p0217b15（五灯会元）
- text: 师举唱。师曰。万机挑不出。曰。为甚么万机挑不出。师曰。他缘岸谷
  ref: X80n1565_p0217b15（五灯会元）
- text: 问。如何是药山家风。师曰。叶落不如初
  ref: X80n1565_p0217b15（五灯会元）
- text: 问。法雷哮吼时如何。师曰。宇宙不曾震。曰。为甚么不曾震。师曰。遍地娑婆。未尝哮吼。曰。不哮吼底事如何。师曰。阖国无人知
  ref: X80n1565_p0217b15（五灯会元）
