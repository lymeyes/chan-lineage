id: L::常州华藏伊庵有权禅师
name: 常州华藏伊庵有权
school: 杨岐派
teacher: 道场全
status: draft
bio: 临安昌化祁氏子。年十四得度。十八岁。礼佛智裕禅师于灵隐。时无庵为第一座。室中以从无住本。建一切法问之。师久而有省。答曰。暗里穿针。耳中出气。庵可之。遂密付心印。尝夜坐达旦。行粥者至。忘展钵。邻僧以手触之。师感悟。为偈曰。黑漆昆仑把钓竿。古帆高挂下惊湍。芦华影里弄明月。引得盲龟上钓船。佛智尝
sayings:
- text: 问。心包太虗。量廓沙界时如何。师曰。大海不宿死尸。智抚其座曰。此子他日当据此座。呵佛骂祖去在。师自是埋藏头角。益自韬晦。游历湖湘江浙几十年。依应庵于归宗。参大慧于径山。无庵住道场。招师分座说法。于是声名隐然。住后
  ref: X80n1565_p0830a14（五灯会元）
- text: 上堂。今朝结却布袋口。明眼衲僧莫乱走。心行灭处解翻身。喷嚏也成师子吼。栴檀林。任驰骤。剔起眉毛顶上生。剜肉成疮露家丑
  ref: X80n1565_p0830a14（五灯会元）
- text: 上堂。禅禅。无党无偏。迷时千里隔。悟在口皮边。所以
  ref: X80n1565_p0830a14（五灯会元）
- text: 僧问石霜。如何是禅。霜云㼾砖。又
  ref: X80n1565_p0830a14（五灯会元）
- text: 僧问睦州。如何是禅。州云。猛火著油煎。又
  ref: X80n1565_p0830a14（五灯会元）
- text: 僧问首山。如何是禅。山云。猢狲上树尾连颠。大众。道无横径。立处孤危。此三大老。行声前活路。用劫外灵机。若以衲僧正眼检点将来。不无优劣。一人如张良入阵。一人如项羽用兵。一人如孔明料敌。若人辨白得。可与佛祖齐肩。虽然如是。忽有个衲僧出来道。长老话作两橛也。适来道。道无横径。无党无偏。而今又却分许多优劣。且作么生祇对。还委悉么。把手上山齐著力。咽喉出气自家知。淳熙庚子秋。示微疾。留偈。趺坐而逝。茶毗齿舌不坏。获五色舍利无数。瘗于横山之塔。分骨归葬万年山寺
  ref: X80n1565_p0830a14（五灯会元）
