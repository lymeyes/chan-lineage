bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0622b01。
sayings:
- text: 僧问。如何是祖师西来意。师曰。九年空面壁。懡㦬又西归。曰。为甚么如此。师曰。美食不中饱人餐
  ref: X80n1565_p0622b01（五灯会元）
- text: 问。如何是无情说法。师曰。灯笼挂露柱。曰。甚么人得闻。师曰。墙壁有耳
  ref: X80n1565_p0622b01（五灯会元）
