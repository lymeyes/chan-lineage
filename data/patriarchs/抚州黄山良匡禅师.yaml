id: 抚州黄山良匡禅师
name: 抚州黄山良匡
school: 法眼宗
teacher: 法眼文益禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《景德传灯录》T51n2076_p0412c27。
sayings:
- text: 上堂谓众曰。高山顶上空蔬饭无可祇待。诸道者。唯有金刚眼睛凭助汝发明真心。汝若会得能破无明黑暗。汝若不会真个不坏。便起归方丈
  ref: T51n2076_p0412c27（景德传灯录）
- text: 僧问。如何是黄山家风。师曰。筑著汝鼻孔。问如何是物不迁义。师曰。春夏秋冬。问如何是一路涅槃门。师曰。汝问宗乘中一句岂不是。曰恁么即不哆哆。师曰。莫哆哆好。问众星攒月时如何。师曰。唤什么作月。曰莫即遮个便是也无。师曰。遮个是什么。问明镜当台森罗为什么不现。师曰。那里当台曰争奈即今何。师曰。又道不现。问如何是禅。师曰。三界绵绵。曰如何是道。师曰。四生浩浩
  ref: T51n2076_p0412c27（景德传灯录）
