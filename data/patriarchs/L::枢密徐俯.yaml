id: L::枢密徐俯
name: 枢密徐俯
school: 杨岐派
teacher: 昭觉勤
status: draft
bio: 字师川，号东湖。每侍先龙图谒法昌及灵源，语论终日。公闻之，藐如也。及法昌归寂，在笑谈间，公异之，始笃信此道。后丁父忧，念无以报罔极，即命灵源至孝址说法。源登座问答已，乃曰：诸仁者！只如龙图平日读万卷书，如水传器，涓滴不遗。且道寻常著在甚么处？而今舍识之后，这著万卷书底又却向甚么处著？公闻，洒然有得，遂曰：吾无憾矣。源下座，问曰：学士适来见个甚么便恁么道？公曰：若有所见，则钝置和尚去也。源曰：恁地则老僧不如。公曰：和尚是何心行？源大笑。靖康初，为尚书外郎，与朝士同志者挂钵于天宁寺之择木堂，力参圜悟。悟亦喜其见地超迈。一日，至书记寮，指悟顶相曰：这老汉脚跟犹未点地在。悟󳬱面曰：瓮里何曾走却鳖？公曰：且喜老汉脚跟点地。悟曰：莫谤他好。公休去
