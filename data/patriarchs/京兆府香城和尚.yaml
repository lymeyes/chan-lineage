id: 京兆府香城和尚
name: 京兆府香城
school: 曹洞宗
teacher: 北院通
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0511b09。
sayings:
- text: 僧问。三光景色谢照烛事如何。师曰。朝邑峰前卓五彩。曰。不涉文彩事作么生。师曰。如今特地过江来
  ref: X80n1565_p0511b09（五灯会元）
- text: 问。向上一路。请
  ref: X80n1565_p0511b09（五灯会元）
- text: 师举唱。师曰。钓丝钩不出
  ref: X80n1565_p0511b09（五灯会元）
- text: 问。牛头还得四祖意否。师曰。沙书下点落千字。曰。下点后如何。师曰。别将一撮表人天。曰。恁么则人人有也。师曰。汝又作么生
  ref: X80n1565_p0511b09（五灯会元）
- text: 问。囊无系蚁之丝。厨绝聚蝇之糁时如何。师曰。日舍不求。思从妄得。五灯会元灯会元青原下七世青原下七世
  ref: X80n1565_p0511b09（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0511b09），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
