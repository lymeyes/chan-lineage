id: L::韶州净法禅想章禅师
name: 韶州净法禅想章
school: 云门宗
teacher: 云门偃
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0570a02。
sayings:
- text: 问。如何是禅。师乃良久。主罔测。因署其号
  ref: X80n1565_p0570a02（五灯会元）
- text: 僧问。日月重明时如何。师曰。日月虽明。不鉴覆盆之下
  ref: X80n1565_p0570a02（五灯会元）
- text: 问。既是金山。为甚么凿石。师曰。金山凿石
  ref: X80n1565_p0570a02（五灯会元）
- text: 问。如何是道。师曰。迢迢十万余
  ref: X80n1565_p0570a02（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0570a02），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
