id: 九峰道虔禅师
name: 九峰道虔
school: 曹洞宗
teacher: 石霜诸
bio: 洞山良价禅师法嗣，住九峰。于洞山迁化后力撑曹洞门庭，辨别师承甚严，世称「九峰和尚」。
sayings:
- text: 僧问：「师唱谁家曲？」师（九峰）曰：「曹洞谱。」
  ref: 五灯会元·卷十三·九峰道虔禅师
