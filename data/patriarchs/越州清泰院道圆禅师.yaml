sayings:
- text: 僧问。亡僧迁化向甚么处去也。师曰。今日迁化岭中。上座
  ref: X80n1565_p0373a08（五灯会元）
- text: 问。如何是祖师西来意。师曰。不可向汝道庭前柏树子
