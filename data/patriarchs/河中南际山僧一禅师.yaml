id: 河中南际山僧一禅师
name: 河中南际山僧一
school: 青原系
teacher: 石霜诸
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0196b17。
sayings:
- text: 僧问。幸获亲近。乞师指示。师曰。我若指示。即屈著汝。曰。教学人作么生即是。师曰。切忌是非
  ref: X80n1565_p0196b17（五灯会元）
- text: 问。如何是衲僧气息。师曰。还曾薰著汝也无
  ref: X80n1565_p0196b17（五灯会元）
- text: 问。如何是异类。师曰。要头斫将去
  ref: X80n1565_p0196b17（五灯会元）
- text: 问。如何是法身主。师曰。不过来
  ref: X80n1565_p0196b17（五灯会元）
- text: 问。如何是毗卢师。师曰。不超越。师终于长庆。谥本净大师
  ref: X80n1565_p0196b17（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0196b17），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
