id: 隆寿法骞禅师
name: 隆寿法骞
school: —
teacher: 隆寿逸禅师
status: draft
bio: 泉州施氏子。漳州刺史陈洪铦请开法
sayings:
- text: 上堂。今日隆寿出世。三世诸佛森罗万象。同时出世。同时转法轮。诸人还见么
  ref: X80n1565_p0314b15（五灯会元）
- text: 僧问。如何是隆寿境。师曰。无汝插足处。曰。如何是境中人。师曰。未识境在。有僧来参。次日请问心要。师曰。昨日相逢序起居。今朝相见事还如。如何却觅呈心要。心要如何特地疏。五灯会元灯会元沩仰宗沩仰宗南岳下三世南岳下三世
  ref: X80n1565_p0314b15（五灯会元）
