id: L::宝学刘彦修居士
name: 宝学刘彦修
school: 杨岐派
teacher: 径山杲
status: draft
bio: 字子羽。出知永嘉。问道于大慧禅师。慧曰
sayings:
- text: 僧问赵州。狗子还有佛性也无。赵州道无。但恁么看。公后乃于柏树子上发明。有颂曰。赵州柏树太无端。境上追寻也大难。处处绿杨堪系马。家家门底透长安
