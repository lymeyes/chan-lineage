id: 石门元易禅师
name: 石门元易
alias: 石门易
school: 法眼宗
teacher: 芙蓉道楷禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《续传灯录》T51n2077_p0543c19。
sayings:
- text: 上堂。十方同聚会。个个学无为。此是选佛场。心空及第归。大众只如闻见觉知未尝有间。作么生说个心空底道理。莫是见而不见闻而不闻为之心空耶错。莫是忘机息虑万法俱捐。销能所以入玄宗。泯性相而归法界。为之心空耶错。恁么也不得。不恁么也不得。恁么不恁么总不得。未审毕竟作么生。还会么。良久曰。若实无为无不为。天堂地狱长相随。三尺杖子搅黄河。八臂那咤冷眼窥。无限鱼龙尽奔走。捉得循河三脚龟。脱取壳铁锥锥。吉凶之兆便分辉。借问东村白头老。吉凶未兆若何为。休休休。古往今来春复秋。白日腾腾随分过。更嫌何处不风流咄
  ref: T51n2077_p0543c19（续传灯录）
- text: 上堂。皓月当空澄潭无影。紫微转处夕阳辉。彩凤归时天欲晓。碧霄云外石笋横空。绿水波中泥牛驾浪。怀胎玉兔晓过西岑。抱子金鸡夜栖东岭。于斯明得始知。夜明帘外别是家风。空王殿中圣凡绝迹。且道作么生是夜明帘外事。还委悉么。正值秋风来入户。一声砧杵落谁家
  ref: T51n2077_p0543c19（续传灯录）
- text: 僧问。古镜未磨时如何。师曰。精灵皱眉。曰磨后如何。师曰。波斯弹指。曰为什么如此。师曰。好事不出门。绍兴丁丑七月二十五日坐寂。火后收舍利塔于学射山。洞山道微禅师瑞州洞山微禅
  ref: T51n2077_p0543c19（续传灯录）
- text: 师上堂。日暖风和柳眼青。冰消鱼跃浪花生。当锋妙得空王印。半夜昆仑戴雪行
  ref: T51n2077_p0543c19（续传灯录）
- text: 僧问。如何是默默相应底事。师曰。痖子吃苦瓜。韶州誧禅师西京天宁禧誧禅师。蔡州宋氏子。初住韶山次过天宁丹霞
  ref: T51n2077_p0543c19（续传灯录）
- text: 上堂。韶山近日没巴鼻。眼里闻声鼻尝味。有时一觉到天明。不在床上不落地。大众且道在甚么处。诸人于斯下得一转语。非唯救得韶山。亦乃不孤行脚。其或未然。三级浪高鱼化龙。痴人犹戽夜塘水。问如何是君。师曰。宇宙无双日乾坤只一人。曰如何是臣。师曰。德分明主化道契物情机。曰如何是臣向君。师曰。赤心归舜日尽节报尧天。曰如何是君视臣。师曰。玄眸凝不瞬妙体鉴旁来。曰如何是君臣道合。师曰。帐符尊贱隔潜信往来通。政和五年九月四日忽召主事。令以楮囊分而为四众僧童行常住津送各一。既而复曰。丹霞有个公案。从来推到扶起今朝普示诸人。且道是个甚底。顾视左右曰。会么。曰不会。师曰。伟哉大丈夫不会末后句。遂就寝右胁而化
  ref: T51n2077_p0543c19（续传灯录）
