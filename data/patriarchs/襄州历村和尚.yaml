id: 襄州历村和尚
name: 襄州历村
school: 临济宗
teacher: 临济义玄禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0398a01。
sayings:
- text: 僧问。如何是观其音声而得解脱。师将火箸敲柴曰。汝还闻么。曰。闻。师曰。谁不解脱。师煎茶次
  ref: X80n1565_p0398a01（五灯会元）
- text: 僧问。如何是祖师西来意
  ref: X80n1565_p0398a01（五灯会元）
- text: 师举起茶匙。僧曰。莫祇这便当否。师掷向火中
  ref: X80n1565_p0398a01（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0398a01），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
