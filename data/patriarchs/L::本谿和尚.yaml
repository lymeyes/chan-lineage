id: L::本谿和尚
name: 本谿
school: 南岳系
teacher: 马祖一
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0115a10。
sayings:
- text: 问。丹霞打侍者。意在何所。师曰。大老翁见人长短在。士曰。为我与师同参。方敢借
  ref: X80n1565_p0115a10（五灯会元）
- text: 问。师曰。若恁么从头举来。共你商量。士曰。大老翁不可共你说人是非。师曰。念翁年老。士曰。罪过。罪过
  ref: X80n1565_p0115a10（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0115a10），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
