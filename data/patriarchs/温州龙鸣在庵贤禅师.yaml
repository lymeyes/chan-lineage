id: 温州龙鸣在庵贤禅师
name: 温州龙鸣在庵贤
school: 黄龙派
teacher: 万年贲
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0720b17。
sayings:
- text: 示众曰。识得凳子。周匝有余。云门道。识得凳子。天地悬殊。师曰。崇寿老汉。坐杀天下人。云门大师。走杀天下人。龙鸣则不然。识得凳子。四脚著地。要坐便坐。要起便起
  ref: X80n1565_p0720b17（五灯会元）
- text: 上堂。举赵州勘婆话颂曰。冰雪佳人貌最奇。常将玉笛向人吹。曲中无限华心动。独许东君第一枝
  ref: X80n1565_p0720b17（五灯会元）
