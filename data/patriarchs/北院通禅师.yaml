id: 北院通禅师
name: 北院通
school: 曹洞宗
teacher: 洞山价
status: draft
bio: 初参夹山。问曰。目前无法。意在目前。不是目前法。非耳目之所到。岂不是和尚语。山曰。是。师乃掀倒禅床。叉手而立。山起来打一拄杖。师便下去法眼云。是他掀倒禅床。何不便去。须待他打一棒了去。意在甚么处。次参洞山。山
sayings:
- text: 上堂曰。坐断主人公。不落第二见。师出众曰。须知有一人不合伴。山曰。犹是第二见。师便掀倒禅床。山曰。老兄作么生。师曰。待某甲舌头烂。即向和尚道。后辞洞山拟入岭。山曰。善为。飞猿岭峻好看。师良久。山召。通阇黎。师应诺。山曰。何不入岭去。师因有省。更不入岭。住后
  ref: X80n1565_p0489b04（五灯会元）
- text: 上堂。诸上座有甚么事。出来论量取。若上上根机。不假如斯。若是中下之流。直须刬削门头户底。教索索地。莫教入泥水。第一速须省事。直须无心去。学得千般万般。祇成知解。与衲僧门下有甚么交涉
  ref: X80n1565_p0489b04（五灯会元）
- text: 僧问。直须无心学时如何。师曰。不管系
  ref: X80n1565_p0489b04（五灯会元）
- text: 问。如何是佛。师曰。峭壁本无苔。洒墨图斑駮
  ref: X80n1565_p0489b04（五灯会元）
- text: 问。二龙争珠。谁是得者。师曰。得者失。曰。不得者如何。师曰。还我珠来
  ref: X80n1565_p0489b04（五灯会元）
- text: 问。如何是清净法身。师曰。无点污
  ref: X80n1565_p0489b04（五灯会元）
- text: 问。转不得时如何。师曰。功不到
  ref: X80n1565_p0489b04（五灯会元）
- text: 问。如何是大富贵底人。师曰。如轮王宝藏。曰。如何是赤穷底人。师曰。如酒店腰带
  ref: X80n1565_p0489b04（五灯会元）
- text: 问。水洒不著时如何。师曰。干剥剥地
  ref: X80n1565_p0489b04（五灯会元）
- text: 问。一槌便成时如何。师曰。不是偶然
  ref: X80n1565_p0489b04（五灯会元）
- text: 问。如何是祖师西来意。师曰。壁上画枯松。游蜂竞采蘂。灭后谥证真禅师
  ref: X80n1565_p0489b04（五灯会元）
