id: 药山俨禅师
name: 药山惟俨
honorific: 药山惟俨禅师 · 弘道大师（谥）
school: 青原系
dynasty: 唐
region: 澧州药山（道场寺）
teacher: 石头希迁（亦参马祖）
source_ref: 五灯会元·卷五·澧州药山惟俨 / 景德传灯录·卷十四
cbeta: T51n2076 卷十四
bio: 绛州韩氏子，初参石头希迁，言下有省，后亦谒马祖。住澧州药山，律行精严，禅律并弘。刺史李翱问道，师示「云在青天水在瓶」，翱遂悟。弟子云岩昙晟，昙晟传洞山良价，为曹洞宗之源。
sayings:
- text: 李翱问「如何是道」，师以手指上下，曰「云在青天水在瓶」。翱作礼，呈偈：「练得身形似鹤形，千株松下两函经；我来问道无余说，云在青天水在瓶。」
  ref: 五灯会元·卷五·药山惟俨
status: draft
