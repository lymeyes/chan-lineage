id: L::隆兴府兜率慧照禅师
name: 隆兴府兜率慧照
school: 黄龙派
teacher: 兜率悦
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0704b10。
sayings:
- text: 上堂。龙安山下。道路纵横。兜率宫中。楼阁重叠。虽非天上。不是人间。到者安心。全忘诸念。善行者不移双足。善入者不动双扉。自能笑傲烟萝。谁管坐消岁月。既然如是。且道向上还有事也无。良久曰。莫教推落岩前石。打破下方遮日云
  ref: X80n1565_p0704b10（五灯会元）
- text: 上堂。举拂子曰。端午龙安亦鼓桡。青山云里得逍遥。饥餐渴饮无穷乐。谁爱争先夺锦标。却向干地上划船。高山头起浪。明椎玉鼓。暗展铁旗。一盏菖蒲茶。数个沙糖粽。且移取北郁单越。来与南阎浮提鬬额看。击禅床。下座
  ref: X80n1565_p0704b10（五灯会元）
- text: 上堂。兜率都无伎俩。也敩诸方榜样。五日一度升堂。起动许多龙象。禅道佛法又无。到此将何供养。须知达磨西来。分付一条拄杖。乃拈起曰。所以道。你有拄杖子。我与你拄杖子。你无拄杖子。我夺你拄杖子。且道那个是宾句。那个是主句。若断得去。即途中受用。若断不得。且世谛流布。乃抛下拄杖
  ref: X80n1565_p0704b10（五灯会元）
