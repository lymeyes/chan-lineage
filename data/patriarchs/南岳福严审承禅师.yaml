id: 南岳福严审承禅师
name: 南岳福严审承
school: 法眼宗
teacher: 大阳玄
status: draft
bio: 侍立大阳次。阳曰。有一人遍身红烂。卧在荆棘林中。周匝火围。若亲近得此人。大敞鄽开。若亲近不得。时中以何为据。师曰。六根不具。七识不全。阳曰。你教伊出来。我要见伊。师曰。适来别无左右祇对和尚。阳曰。官不容针。师便礼拜师后至华严隆和尚处。举前话。隆曰。冷如毛粟。细如冰雪。李相公特上山
sayings:
- text: 问。如何是祖师西来意。师指庭前柏树。公如是三
  ref: X80n1565_p0526b08（五灯会元）
- text: 问。师如是三答。公欣然。乃有颂曰。出没云闲满太虗。元来真相一尘无。重重请问西来意。唯指庭前柏一株
  ref: X80n1565_p0526b08（五灯会元）
