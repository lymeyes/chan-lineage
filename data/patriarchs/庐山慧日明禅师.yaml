bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0689a11。
sayings:
- text: 上堂。不用求心。唯须息见。三祖大师。虽然回避金钩。殊不知已吞红线。慧日又且不然。不用求真并息见。倒骑牛兮入佛殿。牧笛一声天地宽。稽首瞿昙。真个黄面
  ref: X80n1565_p0689a11（五灯会元）
