id: 湖南祇林和尚
name: 湖南祇林
school: —
teacher: 永泰湍禅师
status: draft
bio: 每叱文殊普贤皆为精魅。手持木剑。自谓降魔。才见僧来参。便曰。魔来也。魔来也。以剑乱挥。归方丈。如是十二年后。置剑无言
sayings:
- text: 僧问。十二年前为甚么降魔。师曰。贼不打贫儿家。曰。十二年后为甚么不降魔。师曰。贼不打贫儿家
  ref: X80n1565_p0146a15（五灯会元）
