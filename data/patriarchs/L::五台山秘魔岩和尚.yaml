id: L::五台山秘魔岩和尚
name: 五台山秘魔岩
school: —
teacher: 永泰湍
status: draft
bio: 常持一木叉。每见僧来礼拜。即叉却颈曰。那个魔魅教汝出家。那个魔魅教汝行脚。道得也叉下死。道不得也叉下死。速道。速道。学徒鲜有对者法眼代云。乞命。法灯代。但引颈示之。玄觉代云。老儿家放下叉子得也。霍山通和尚访师。才见不礼拜。便撺入怀里。师拊通背三下。通起拍手曰。师兄三千里外赚我来。三千里外赚我来。便回
