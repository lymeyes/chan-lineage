id: 南岳般若惟劲宝闻禅师
name: 南岳般若惟劲宝闻
school: —
teacher: 雪峰义存禅师
status: draft
bio: 福州人也。师雪峰而友玄沙。深入玄奥。一日问鉴上座。闻汝注楞严。是否。鉴曰。不敢。师曰。二文殊作么生注。曰。请师鉴。师乃扬袂而去。师尝续宝林传四卷。纪贞元之后宗门继踵之源流者。又别著南岳高僧传。皆行于世
