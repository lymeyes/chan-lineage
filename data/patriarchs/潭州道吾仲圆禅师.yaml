bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0671b08。
sayings:
- text: 上堂。不是心。不是佛。不是物。古人恁么道。譬如管中窥豹。但见一斑。设或入林不动草。入水不动波。亦如骑马向冰凌上行。若是射雕手。何不向虵头上揩痒。具正眼者试辨看。良久曰。鸳鸯绣出自金针
  ref: X80n1565_p0671b08（五灯会元）
