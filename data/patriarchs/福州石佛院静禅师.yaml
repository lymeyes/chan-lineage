bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0287b18。
sayings:
- text: 上堂。若道素面相呈。犹添脂粉。纵离添过。犹有负𠎝。诸人且作么生体悉
  ref: X80n1565_p0287b18（五灯会元）
- text: 僧问。学人欲见和尚本来面目。师曰。洞上有言亲体取。曰。恁么则不得见去也。师曰。灼然。客路如天远。侯门似海深
  ref: X80n1565_p0287b18（五灯会元）
