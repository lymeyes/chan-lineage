id: 常德府梁山廓庵师远禅师
name: 常德府梁山廓庵师远
school: 杨岐派
teacher: 大随元静禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0786b10。
sayings:
- text: 上堂。举杨岐三脚驴子话。乃召大众曰。扬其汤者。莫若扑其火。壅其流者。莫若杜其源。此乃智人之明鉴。佛法之至论。正在斯焉。这因缘。如今丛林中提唱者甚多。商量者不少。有般底。祇道宗师家无固必。凡有所
  ref: X80n1565_p0786b10（五灯会元）
- text: 问。随口便答。似则也似。是即未是。若恁么。祇作个干无事会。不见杨岐用处。乃至祖师。千差万别。方便门庭。如何消遣。又有般底。祇向佛边会。却与自己没交涉。古人道。凡有言句。须是一一消归自己。又作么生。又有般底。一向祇作自己会。弃却古人用处。唯知道明自己事。古人方便却如何消遣。既消遣不下。却似抱桥柱澡洗。要且放手不得。此亦是一病。又有般底。却去脚多少处会。若恁么会。此病最难医也。所以他语有巧妙处。参学人卒难摸索。才拟心则差了也。前辈谓之杨岐宗旨。须是他屋里人。到恁么田地。方堪传授。若不然者。则守死善道之谓也。这公案直须还他透顶彻底汉。方能了得。此非止禅和子会不得。而今天下丛林中。出世为人底。亦少有会得者。若要会去。直须向威音那畔。空劫已前。轻轻󳬇著。提起便行。捺著便转。却向万仞峰前进一步。可以笼󰋪古今。坐断天下人舌头。如今还有恁么者么。有则出来道看。如无。更听一颂。三脚驴子弄蹄行。直透威音万丈坑。云在岭头闲不彻。水流㵎下太忙生。湖南长老谁解会。行人更在青山外
  ref: X80n1565_p0786b10（五灯会元）
- text: 上堂。天得一以清。地得一以宁。君王得一以治天下。这个说话。是家常茶饭。须知衲僧家。别有奇特处始得。且道衲僧门下有甚奇特处。天得一。斗牛女虗危室壁。地得一。万象森罗及瓦砾。君王得一。上下四维无等匹。且道衲僧得一时如何。要见客从何处来。闲持经卷倚松立。浴佛
  ref: X80n1565_p0786b10（五灯会元）
- text: 上堂。举药山浴佛公案。拈云。这
  ref: X80n1565_p0786b10（五灯会元）
- text: 僧问处。依稀越国。髣髴杨州。药山答来。眼似流星。机如掣电。点检将来。二俱不了。若是山僧即不然。当是时。才见他
  ref: X80n1565_p0786b10（五灯会元）
- text: 问。只浴得这个。且不浴得那个。但转木杓柄与伊。待他拟议之间。拦面便泼。假饶这僧有大神通。具大智慧。也无施展处。敢问大众。这个即且置。唤甚么作那个。下座。佛殿烧香。为你说破。师有十牛图并颂行于世
  ref: X80n1565_p0786b10（五灯会元）
