bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0266b16。
sayings:
- text: 上堂。若是名言妙句。诸方总道了也。今日众中还有超第一义者。致将一问来。若有。即不孤负于人
  ref: X80n1565_p0266b16（五灯会元）
- text: 僧问。如何是第一义。师曰。何不问第一义。曰。见
  ref: X80n1565_p0266b16（五灯会元）
- text: 问。师曰。已落第二义也
  ref: X80n1565_p0266b16（五灯会元）
- text: 问。古佛曲调请师和。师曰。我不和汝杂乱底。曰。未审为甚么人和。师曰。甚么处去来
  ref: X80n1565_p0266b16（五灯会元）
