id: 万年法一禅师
name: 万年法一
alias: 万年一
school: 黄龙派
teacher: 泐潭善清禅师
status: draft
bio: 太师襄阳郡王李公遵勉之玄孙也。世居开封祥符县。母梦一老僧至而产。年十七试上庠从祖仕淮南。欲官之不就。将弃家。事长芦慈觉赜禅师。祖弗许。母曰。此必宿世沙门。愿勿夺其志。未几慈觉没。大观改元。礼灵岩通照愿禅师祝发登具。依愿十年迷闷不能入。谒圆悟于蒋山。悟曰。此法器也。悟奉诏徙京师天宁。师侍行。靖康末谒草堂于疏山。一语之及大法顿明。绍兴七年泉守宝文刘公彦修请居延福。后四迁巨刹
sayings:
- text: 上堂拈拄杖曰。拄杖子有时作出水蛟龙。万里云烟不断。有时作踞地师子。百年妖怪潜踪。有时心法两忘照体独立。有时照用同时主宾互用。以拄杖画曰。延福门下总用不著。且道延福寻常用个甚么。卓拄杖喝一喝下座
  ref: T51n2077_p0625c08（续传灯录）
- text: 上堂。仰面不见天。低头不见地。古剑髑髅前。大海波涛沸。退长芦归天台万年观音院。忽示微疾。书偈曰。今年七十五。归作庵中主。珍重观世音。泥蛇吞石虎。入龛趺坐而逝
  ref: T51n2077_p0625c08（续传灯录）
