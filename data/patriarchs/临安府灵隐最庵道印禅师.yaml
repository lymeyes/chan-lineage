id: 临安府灵隐最庵道印禅师
name: 临安府灵隐最庵道印
school: 杨岐派
teacher: 径山杲
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0800a17。
sayings:
- text: 上堂。大雄山下虎。南山鳖鼻虵。等闲撞著。抱赏归家。若也不惜好手。便与拔出重牙。有么有么
  ref: X80n1565_p0800a17（五灯会元）
- text: 上堂。五五二十五。击碎虗空鼓。大地不容针。十方无寸土。春生夏长复何云。甜者甜兮苦者苦。中秋
  ref: X80n1565_p0800a17（五灯会元）
- text: 上堂。举马大师与西堂百丈南泉玩月公案。师云。马大师垂丝千尺。意在深潭。西堂振𩮻。百丈摆尾。虽则冲波激浪。未免上他钩线。南泉自谓跃过禹门。谁知依前落在巨网。即今莫有绝罗笼．出窠臼底么。也好出来露个消息。贵知华藏门下。不致寂寥。其或未然。此夜一轮满。清光何处无。建宁府竹原宗元庵主建宁府竹原宗元庵主本郡连氏子。久依大慧。分座西禅。丞相张公浚帅三山。以数院迎之。不就。归旧里。结茆号众妙园。宿衲士夫。交请开法
  ref: X80n1565_p0800a17（五灯会元）
- text: 示众曰。若究此事。如失却鏁匙相似。祇管寻来寻去。忽然撞著。恶。在这里。开个鏁了。便见自家库藏。一切受用。无不具足。不假他求。别有甚么事
  ref: X80n1565_p0800a17（五灯会元）
- text: 示众曰。诸方为人抽钉󳫠楔。解黏去缚。我这里为人添钉著楔。加绳加缚了。送向深潭里。待他自去理会
  ref: X80n1565_p0800a17（五灯会元）
- text: 示众曰。主法之人。气吞宇宙。为大法王。若是释迦老子．达磨大师出来。也教伊叉手。向我背后立地。直得寒毛卓竖。亦未为分外。一日。举。世尊生下。一手指天。一手指地。云。天上天下。唯我独尊。师乃曰。见怪不怪。其怪自坏。垂语云。这一些子。恰如撞著杀人汉相似。你若不杀了他。他便杀了你。近礼侍者近礼侍者三山人。久侍大慧。尝默究竹篦话。无所入。一日。入室罢。求指示。慧曰。你是福州人。我说个喻向你。如将名品荔枝。和皮壳一时剥了。以手送在你口里。祇是你不解吞。师不觉失笑曰。和尚。吞却即祸事。慧后问师曰。前日吞了底荔枝。祇是你不知滋味。师曰。若知滋味。转见祸事
  ref: X80n1565_p0800a17（五灯会元）
