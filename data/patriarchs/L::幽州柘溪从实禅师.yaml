id: L::幽州柘溪从实禅师
name: 幽州柘溪从实
school: 青原系
teacher: 中云葢
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0214a07。
sayings:
- text: 僧问。如何是道。师曰。个中无紫皂。曰。如何是禅。师曰。不与白云连
  ref: X80n1565_p0214a07（五灯会元）
- text: 师问。僧作甚么来。曰。亲近来。师曰。任你白云朝岳顶。争奈青山不展眉
  ref: X80n1565_p0214a07（五灯会元）
