id: 道场法全禅师
name: 道场法全
alias: 道场全
school: 杨岐派
teacher: 育王端裕禅师
status: draft
bio: 姑苏陈氏子。东斋川和尚为落发。师久依佛智。每入室智以狗子无佛性话问之。师罔对。一日闻僧举五祖颂云。赵州露刀剑。忽大悟。有偈曰。鼓吹轰轰袒半肩。龙楼香喷益州船。有时赤脚弄明月。踏破五湖波底天。住后
sayings:
- text: 上堂。欲得现前莫存顺逆。卓拄杖云。三祖大师变作马面夜叉。向东弗于逮西瞿耶尼南赡部洲北郁单越。却来山僧手里呈身。元来只是一条黑漆拄杖。还见么。直饶见得入地狱如箭射。卓拄杖下座
  ref: T51n2077_p0680c06（续传灯录）
- text: 上堂。拈拄杖曰。汝等诸人个个顶天立地肩横楖栗。到处行脚勘验诸方。更来这里觅个甚么。才轻轻拶著。便言。天台普请南岳游山。我且问尔。还曾收得大食国里宝刀么。卓拄杖曰。切忌口衔羊角
  ref: T51n2077_p0680c06（续传灯录）
- text: 僧问。牛头未见四祖时如何。师曰。天下无贫人。曰见后如何。师曰。四海无富汉。乾道己丑七月二十五日将入寂。众求偈。师瞪目下视。众请益坚。遂书无无二字弃笔而逝。火后设利五色。塔于金斗峰
  ref: T51n2077_p0680c06（续传灯录）
