id: 福州鼓山木庵安永禅师
name: 福州鼓山木庵安永
school: 杨岐派
teacher: 西禅需
status: draft
bio: 闽县人，族吴氏。弱冠，依安国慈济为苾刍。未几，谒懒庵于云门。一日入室，庵曰：不问有言，不问无言。世尊良久，不得向世尊良久处会。随后便喝，条然契悟，作礼曰：不因今日问，争丧目前机？庵许之。及徙怡山，命师首众。阅二年，庵将顺寂，以大慧所传磨衲授之，嘱令剪拂学者。安抚尚书张公澄请师继席，不数月，拂袖云门庵。乾道甲申，郡师大资王公之望，从众衲请居乾元，迁黄檗。又三年，移鼓山
sayings:
- text: 上堂曰：要明个事，须是具击石火、闪电光底手段，方能崄峻崖头全身放舍，白云深处得大安居。如其󳬇地觅金针，直下脑门须逆裂。到这里，假饶见机而变，不犯锋铓，全身独脱，犹涉泥水。只如本分全提一句又作么生道？击拂子曰：淬出七星光灿烂，解拈天下任横行
  ref: X79n1559_p0297a16（嘉泰普灯录）
- text: 上堂：布网垂钩阔，长江不系舟。水寒鱼不食，特地过沧洲。恁么举似，著甚来由？半夜黑风翻大海，直得波涛绝点流
  ref: X79n1559_p0297a16（嘉泰普灯录）
- text: 上堂，拈拄杖曰：临济小厮儿，未曾当头道著。今日全身放憨，也要诸人知有。遂掷拄杖，下座
  ref: X79n1559_p0297a16（嘉泰普灯录）
- text: 示众云：诸人未得个入处，须得个入处。既得个入处，不得忘却老僧。师曰：恁么说话，面皮厚多少？木庵则不然，诸人未得个入处，须得个入处。既得个入处，直须飏下入处始得
  ref: X79n1559_p0297a16（嘉泰普灯录）
- text: 僧问：须弥顶上翻身倒卓时如何？曰：未曾见毛头星现。云：恁么则倾湫倒岳去也。曰：莫乱做。僧便喝。师曰：雷声浩大，雨点全无。南剑州剑门安分庵主南剑州剑门安分庵主号分禅。少与木庵同肄业安国，后依懒庵，未有深证。辞谒径山大慧禅师，行次，江于仰瞻　宫阙，闻街司喝侍郎来，释然大悟，作偈曰：几年个事挂𮌎怀，问尽诸方眼不开。肝胆此时俱决尽，一声江上侍郎来。径回西禅，懒庵迎之，付以伽梨，自尔不规所寓。后庵居剑门，化被岭表，学者从之。所作偈颂，走手而成，凡千余首，盛行于世
  ref: X79n1559_p0297a16（嘉泰普灯录）
- text: 示众曰：这一片田地，汝等诸人且道：天地未分已前在甚么处？直下彻去，已是钝置分上座不少了也。更若拟议思量，何啻白云万里？蓦拈拄杖，打散大众
  ref: X79n1559_p0297a16（嘉泰普灯录）
- text: 示众：上至诸佛，下及众生，性命总在山僧手里。捡点将来，有没量罪过？山僧亦有没量罪过？还有检点得出者么？卓拄杖一下，曰：冤有头，债有主。遂左顾右视，曰：自出洞来无敌手，得饶人处且饶人
  ref: X79n1559_p0297a16（嘉泰普灯录）
- text: 示众：十五日已前，天上有星皆拱北。十五日已后，人间无水不朝东。已前已后总拈却，到处乡谈各不同。屈指曰：一、二、三、四、五、六、七、八、九、十、十一、十二、十三、十四，诸兄弟且道：今日是几？良久，曰：本店买卖，分文不賖
  ref: X79n1559_p0297a16（嘉泰普灯录）
