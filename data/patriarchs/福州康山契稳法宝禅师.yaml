bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0293a15。
sayings:
- text: 僧问。威音王佛已后。次第相承。未审师今一会法嗣何方。师曰。象骨举手。龙谿点头
  ref: X80n1565_p0293a15（五灯会元）
- text: 问。圆明湛寂非师意。学人因底却无明。师曰。辨得也未。曰。恁么则识性无根去也。师曰。隔靴搔痒
  ref: X80n1565_p0293a15（五灯会元）
