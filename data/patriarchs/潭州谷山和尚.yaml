bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0276a11。
sayings:
- text: 僧问。省要处乞师一言。师便起去
  ref: X80n1565_p0276a11（五灯会元）
- text: 问。𦏪羊挂角时如何。师曰。你向甚么处觅。曰。挂角后如何。师曰。走
  ref: X80n1565_p0276a11（五灯会元）
