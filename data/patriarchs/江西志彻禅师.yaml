id: 江西志彻禅师
name: 江西志彻
school: —
teacher: 六祖大鉴旁出
status: draft
bio: 姓张氏。名行昌。少任侠。自南北分化。二宗主虽亡彼我。而徒侣竞起爱憎。时北宗门人自立秀禅师为第六祖。而忌大鉴传衣为天下所闻。然祖预知其事。即置金十两于方丈。时行昌受北宗门人之嘱。怀刃入祖室。将欲加害。祖舒颈而就。行昌挥刃者三。都无所损。祖曰。正剑不邪。邪剑不正。只负汝金。不负汝命。行昌惊仆。久而方苏。求哀悔过。即愿出家。祖遂与金曰。汝且去。恐徒众翻害于汝。汝可他日易形而来。吾当摄受。行昌禀旨宵遁。投僧出家。具戒精进。一日忆祖之言。远来礼觐。祖曰。吾久念于汝。汝来何晚。曰。昨蒙和尚舍罪。今虽出家苦行。终难报于深恩。其唯传法度生乎。弟子尝览涅槃经。未晓常无常义。乞和尚慈悲。略为宣说。祖曰。无常者。即佛性也。有常者。即善恶一切诸法分别心也。曰。和尚所说。大违经文。祖曰。吾传佛心印。安敢违于佛经。曰。经说佛性是常。和尚却言无常。善恶诸法乃至菩提心。皆是无常。和尚却言是常。此即相违。令学人转加疑惑。祖曰。涅槃经。吾昔者听尼无尽藏读诵一遍。便为讲说。无一字一义不合经文。乃至为汝。终无二说。曰。学人识量浅昧。愿和尚委曲开示。祖曰。汝知否佛性若常。更说甚么善恶诸法。乃至穷劫。无有一人发菩提心者。故吾说无常。正是佛说真常之道也。又一切诸法若无常者。即物物皆有自性。容受生死。而真常性有不遍之处。故吾说常者。正是佛说真无常义也。佛比为凡夫外道。执于邪常诸二乘人。于常计无常。共成八倒。故于涅槃了义教中。破彼偏见而显说真常．真乐．真我．真净。汝今依言背义。以断灭无常。及确定死常而错解佛之圆妙最后微言。纵覧千遍。有何所益。行昌忽如醉醒。乃说偈曰。因守无常心。佛演有常性。不知方便者。犹春池拾砾。我今不施功。佛性而见前。非师相授与。我亦无所得。祖曰。汝今彻也。宜名志彻。师礼谢而去
