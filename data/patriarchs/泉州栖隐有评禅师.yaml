id: 泉州栖隐有评禅师
name: 泉州栖隐有评
school: 云门宗
teacher: 天衣义怀禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0621b01。
sayings:
- text: 僧问。如何是平常道。师曰。和尚合掌。道士擎拳
  ref: X80n1565_p0621b01（五灯会元）
- text: 问。十二时中如何趣向。师曰。著衣吃饭。曰。别还有事也无。师曰。有。曰。如何即是。师曰。斋余更请一瓯茶
  ref: X80n1565_p0621b01（五灯会元）
