id: L::比部孙居士
name: 比部孙
school: 杨岐派
teacher: 杨歧会
status: draft
bio: 因杨岐会禅师来谒。值视断次。公曰。某为王事所牵。何由免离。岐指曰。委悉得么。公曰。望师点破。岐曰。此是比部弘愿深广。利济群生。公曰。未审如何。岐示以偈曰。应现宰官身。广弘悲愿深。为人重指处。棒下血淋淋。公于此有省。南岳下十三世南岳下十三世
