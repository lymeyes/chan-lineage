bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0051a13。
sayings:
- text: 问。放旷郊鄽。谓之腾腾和尚。唐天册万岁中。天后诏入殿前。仰视天后。良久曰。会么。后曰。不会。师曰。老僧持不语戒。言讫而出。翌日。进短歌一十九首。天后览而嘉之。厚加赐赉。师皆不受。又令写歌辞传布天下。其辞并敷演真理。以警时俗。唯了元歌一首盛行于世
  ref: X80n1565_p0051a13（五灯会元）
