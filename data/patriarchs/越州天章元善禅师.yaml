id: 越州天章元善禅师
name: 越州天章元善
school: 云门宗
teacher: 天衣怀
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0620b04。
sayings:
- text: 僧问。大无外。小无内。既无内外。毕竟是甚么物。师曰。开口见胆。曰。学人未晓。师曰。苦中苦。曰。为众竭力。祸出私门。师打曰。教休不肯休。须待雨淋头
  ref: X80n1565_p0620b04（五灯会元）
- text: 问。如何是最初句。师曰。末后问将来。曰。为甚如此。师曰。先行不到。曰。入水见长人也。师曰。秦皇击缶
  ref: X80n1565_p0620b04（五灯会元）
- text: 上堂。君问西来意。马师踏水潦。若认一毛头。何曾知起倒。劫火才洞然。愚夫觅干草。宁知明眼人。为君长懊恼
  ref: X80n1565_p0620b04（五灯会元）
