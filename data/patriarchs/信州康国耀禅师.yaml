bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0571b03。
sayings:
- text: 僧问。文殊与维摩对谈何事。师曰。汝向髑髅后会。始得。曰。古人道。髑髅里荐取又如何。师曰。汝还荐得么。曰。恁么则远人得遇于师去也。师曰。莫谩语
  ref: X80n1565_p0571b03（五灯会元）
