id: L::常州正勤院希奉禅师
name: 常州正勤院希奉
school: 法眼宗
teacher: 清凉益
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0357b09。
sayings:
- text: 上堂。古圣道。圆同太虗。无欠无余。又道。一一法．一一宗。众多法一法宗。又道。起唯法起。灭唯法灭。又道。起时不言我起。灭时不言我灭。据此说话。屈滞久在丛林上座。若是初心。兄弟且须体道。人身难得。正法难闻。莫同等闲。施王衣食。不易消遣。若不明道。个个尽须还他。上座要会道么。珍重
  ref: X80n1565_p0357b09（五灯会元）
- text: 僧问。如何是祖师西来意。师曰。甚么处得这个消息
  ref: X80n1565_p0357b09（五灯会元）
- text: 问。如何是诸法空相。师曰。山河大地
  ref: X80n1565_p0357b09（五灯会元）
- text: 问。僧众云集。请
  ref: X80n1565_p0357b09（五灯会元）
- text: 师举唱宗乘。师曰。举来久矣
  ref: X80n1565_p0357b09（五灯会元）
- text: 问。佛法付嘱国王大臣。今日正勤将何付嘱。师曰。万岁。万岁
  ref: X80n1565_p0357b09（五灯会元）
- text: 问。古人有言。山河大地是汝真善知识。如何得山河大地为善知识去。师曰。汝唤甚么作山河大地
  ref: X80n1565_p0357b09（五灯会元）
- text: 问。如何是合道之言。师曰。汝问我答
  ref: X80n1565_p0357b09（五灯会元）
- text: 问。灵山会上。迦叶亲闻。未审今日谁人得闻。师曰。迦叶亲闻个甚么
  ref: X80n1565_p0357b09（五灯会元）
- text: 问。古佛道场。学人如何得到。师曰。汝今在甚么处
  ref: X80n1565_p0357b09（五灯会元）
- text: 问。如何是和尚圆通。师敲禅床三下
  ref: X80n1565_p0357b09（五灯会元）
- text: 问。如何是脱却根尘。师曰。莫妄想
  ref: X80n1565_p0357b09（五灯会元）
- text: 问。人王法王。是一是二。师曰。人王法王
  ref: X80n1565_p0357b09（五灯会元）
- text: 问。如何是诸法寂灭相。师曰。起唯法起。灭唯法灭
  ref: X80n1565_p0357b09（五灯会元）
- text: 问。如何是未曾生底法。师曰。汝争得知
  ref: X80n1565_p0357b09（五灯会元）
- text: 问。无著见文殊。为甚么不识。师曰。汝道文殊还识无著么
  ref: X80n1565_p0357b09（五灯会元）
- text: 问。得意谁家新曲妙。正勤一句请师宣。师曰。道甚么。曰。岂无方便也。师曰。汝不会我语
  ref: X80n1565_p0357b09（五灯会元）
