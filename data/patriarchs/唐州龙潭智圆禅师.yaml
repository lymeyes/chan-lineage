id: 唐州龙潭智圆禅师
name: 唐州龙潭智圆
school: —
teacher: 汾阳昭
status: draft
bio: 辞汾阳。阳曰。别无送路。与子一枝拄杖。一条手巾。师曰。手巾和尚受用。拄杖即不消得。阳曰。汝但将去。有用处在。师便収。阳曰。又道不用。师便喝。阳曰。已后不让临济。师曰。正令已行。阳来日送出三门。乃
sayings:
- text: 问。汝介山逢尉迟时如何。师曰。一刀两段。阳曰。彼现那叱。又作么生。师便拽拄杖。阳喝曰。这回全体分付。住后
  ref: X80n1565_p0432a13（五灯会元）
- text: 僧问。承教有言。是真精进。是名真法。供养如来。如何是真法。师曰。夜聚晓散
  ref: X80n1565_p0432a13（五灯会元）
- text: 问。如何是龙潭剑。师曰。触不得。曰。用者如何。师曰。白骨连山
  ref: X80n1565_p0432a13（五灯会元）
- text: 问。昔日穷经。今日参禅。此理如何。师曰。两彩一赛。曰。作么生领会。师曰。去后不留踪。曰。如何是佛。师曰。火烧不燃
  ref: X80n1565_p0432a13（五灯会元）
- text: 问。古殿无佛时如何。师曰。三门前合掌
  ref: X80n1565_p0432a13（五灯会元）
