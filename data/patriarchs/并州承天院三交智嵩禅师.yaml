id: 并州承天院三交智嵩禅师
name: 并州承天院三交智嵩
school: 临济宗
teacher: 首山省念禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0420a18。
sayings:
- text: 问。如何是佛法的的大意。山曰。楚王城畔。汝水东流。师于此有省。顿契佛意。乃作三玄偈曰。须用直须用。心意莫定动。三岁师子吼。十方没狐种。我有真如性。如同幕里隐。打破六门关。显出毗卢印。真骨金刚体可夸。六尘一拂永无遮。廓落世界空为体。体上无为真到家。山闻乃请吃茶
  ref: X80n1565_p0420a18（五灯会元）
- text: 问。这三颂是汝作来邪。师曰。是。山曰。或有人教汝现三十二相时如何。师曰。某甲不是野狐精。山曰。惜取眉毛。师曰。和尚落了多少。山以竹篦头上打。曰。这汉向后乱作去在。住后
  ref: X80n1565_p0420a18（五灯会元）
- text: 上堂。文殊仗剑。五台横行。唐明一路。把断妖讹。三世诸佛。未出教乘。网底游鱼。龙门难渡。垂钩四海。祇钓狞龙。格外玄谈。为求知识。若也举扬宗旨。须弥直须粉碎。若也说佛说祖。海水便须枯竭。宝剑挥时。毫光万里。放汝一路。通方说话。把断咽喉。诸人甚处出气
  ref: X80n1565_p0420a18（五灯会元）
- text: 僧问。钝根乐小法。不自信作佛。作佛后如何。师曰。水里捉麒麟。曰。与么则便登高座也。师曰。骑牛上三十三天
  ref: X80n1565_p0420a18（五灯会元）
- text: 问。古人拈推竖拂。意旨如何。师曰。骑驴不著靴
  ref: X80n1565_p0420a18（五灯会元）
- text: 问。如何是夺人不夺境。师曰。家乡有路无人到。曰。如何是夺境不夺人。师曰。暗传天子𠡠。陪行一百程。曰。如何是人境两俱夺。师曰。无头虾蟆脚指天。曰。如何是人境俱不夺。师曰。晋祠南畔长柳巷
  ref: X80n1565_p0420a18（五灯会元）
- text: 问。古人东山西岭青。意作么生。师曰。波斯鼻孔大。曰。与么则西天迦叶。东土我师。师曰。金刚手板阔
  ref: X80n1565_p0420a18（五灯会元）
- text: 问。大悲千手眼。那个是正眼。师曰。开化石佛拍手笑。晋祠娘子解讴歌
  ref: X80n1565_p0420a18（五灯会元）
- text: 问。临济推倒黄檗。因甚维那吃棒。师曰。正狗不偷油。鸡衔灯盏走
  ref: X80n1565_p0420a18（五灯会元）
- text: 问。如何是截人之机。师曰。要用便用。曰。请和尚用。师曰。拖出这死汉。郑工部
  ref: X80n1565_p0420a18（五灯会元）
- text: 问。百尺竿头独打球。万丈悬崖丝系腰时如何。师曰。幽州著脚。广南厮扑。郑无语。师曰。勘破这胡汉。郑曰。二十年江南界里。这回却见禅师。师曰。瞎老婆吹火
  ref: X80n1565_p0420a18（五灯会元）
- text: 僧问。二边纯莫立。中道不须安。未审意旨如何。师曰。广南出象牙。曰。不会。请师直指。师曰。番国皮球八百价
  ref: X80n1565_p0420a18（五灯会元）
- text: 上堂。寒温冷暖。著衣吃饭。自不欠少。波波地觅个甚么。祇是诸人不肯承当。如今还有承当底么。有则不得孤负山河大地。珍重
  ref: X80n1565_p0420a18（五灯会元）
- text: 问。祖师西来。三藏东去。当明何事。师曰。佛殿部署修。僧堂老僧盖。僧曰。与么则全明今日事也。师曰。今日事作么生。僧便喝。师便打
  ref: X80n1565_p0420a18（五灯会元）
- text: 问。如何是学人用心处。师曰。光剃头。净洗钵。曰。如何是学人行履处。师曰。僧堂前。佛殿后
  ref: X80n1565_p0420a18（五灯会元）
- text: 上堂。举法眼偈曰。见山不是山。见水何曾别。山河与大地。都是一轮月。大小法眼未出涅槃堂。三交即不然。见山河与大地。锥刀各自用。珍重
  ref: X80n1565_p0420a18（五灯会元）
