school: —
teacher: 汾阳善昭禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0432b09。
sayings:
- text: 僧问。如何是佛。师曰。卖扇老婆手遮日
  ref: X80n1565_p0432b09（五灯会元）
- text: 问。红轮未出时如何。师曰。照烛分明。曰。出后如何。师曰。捞天摸地
  ref: X80n1565_p0432b09（五灯会元）
- text: 问。如何是学人亲切处。师曰。慈母抱婴儿。曰。如何是学人转身处。师曰。街头巷尾。曰。如何是学人著力处。师曰。千斤担子两头摇
  ref: X80n1565_p0432b09（五灯会元）
- text: 问。古曲无音韵。如何和得齐。师曰。三九二十七。篱头吹觱栗。曰。宫商角征非关妙。石人拊掌笑呵呵。师曰。同道方知
  ref: X80n1565_p0432b09（五灯会元）
