id: PRE::东土初祖菩提达摩
name: 菩提达摩
honorific: 东土初祖 · 圆觉大师（谥）
school: 东土祖师
dynasty: 南朝梁
region: 嵩山少林寺 / 广州 / 建康
teacher: 西天二十七祖般若多罗
source_ref: 五灯会元·卷一·东土初祖菩提达摩 / 景德传灯录·卷三
cbeta: T51n2076 卷三
bio: '南天竺香至王第三子，从般若多罗得法，嘱其「待震旦（中国）缘熟而后往」。

  梁武帝普通年间泛海至广州，北上见武帝。帝问「如何是圣谛第一义」，答「廓然无圣」；问「对朕者谁」，答「不识」。机缘不契，遂一苇渡江，止于嵩山少林寺，面壁而坐，终日默然，世称「壁观婆罗门」，历九年。

  后付法于慧可，并授袈裟与《楞伽经》四卷，谓「吾灭后二百年，此经盛行」。临别授偈：「吾本来兹土，传法救迷情。一花开五叶，结果自然成。」'
sayings:
- text: 帝问：「如何是圣谛第一义？」师曰：「廓然无圣。」帝曰：「对朕者谁？」师曰：「不识。」
  ref: 五灯会元·卷一·菩提达摩
- text: 师付慧可偈：「吾本来兹土，传法救迷情。一花开五叶，结果自然成。」
  ref: 景德传灯录·卷三·菩提达摩
