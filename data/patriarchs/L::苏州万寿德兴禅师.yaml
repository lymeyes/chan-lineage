id: L::苏州万寿德兴禅师
name: 苏州万寿德兴
school: 法眼宗
teacher: 百丈恒
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0378b18。
sayings:
- text: 僧问。如何是佛。师曰。大众一时瞻仰
  ref: X80n1565_p0378b18（五灯会元）
- text: 问。如何是和尚为人一句。师曰。汝且自为。乃曰。问答俱备。其谁得意。若向他求。还成特地。老僧久处深山。比为藏拙。何期今日入到万寿门下。可谓藏之不得。既藏不得。分明露现。未审诸人。阿谁先见。如有见处。出来对众吐露个消息。良久曰。久立。珍重
  ref: X80n1565_p0378b18（五灯会元）
