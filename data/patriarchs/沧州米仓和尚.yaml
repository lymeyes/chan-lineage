id: 沧州米仓和尚
name: 沧州米仓
school: 临济宗
teacher: 临济义玄禅师
status: draft
bio: 州牧请师与宝寿入厅供养。令人传语。请二长老谭论佛法。寿曰。请师兄答话。师便喝。寿曰。某甲话也未
sayings:
- text: 问。喝作么。师曰。犹嫌少在。寿却与一喝
  ref: X80n1565_p0398a05（五灯会元）
