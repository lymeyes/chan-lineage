bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0570b07。
sayings:
- text: 上堂。至道无难。唯嫌拣择。还有拣择者么。时有
  ref: X80n1565_p0570b07（五灯会元）
- text: 僧问。十方国土中。唯有一乘法。如何是一乘法。师曰。日月分明。曰。学人不会。师曰。清风满路
  ref: X80n1565_p0570b07（五灯会元）
