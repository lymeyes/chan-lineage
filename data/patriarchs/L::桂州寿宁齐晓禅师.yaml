id: L::桂州寿宁齐晓禅师
name: 桂州寿宁齐晓
school: —
teacher: 云峰悦
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0458a08。
sayings:
- text: 上堂。触目不会道。犹较些子。运足焉知路。错下名言。诸仁者。山僧今日将错就错。汝等诸人。见有眼。闻有耳。嗅有鼻。味有舌。因甚么却不会。良久曰。武帝求仙不得仙。王乔端坐却升天。咄
  ref: X80n1565_p0458a08（五灯会元）
- text: 僧问。大众云臻。合谈何事。师曰。波斯入闹市。曰。恁么则草偃风行去也。师曰。万里望乡关
  ref: X80n1565_p0458a08（五灯会元）
