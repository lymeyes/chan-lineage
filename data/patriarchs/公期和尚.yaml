id: 公期和尚
name: 公期
school: —
teacher: 未详
status: draft
bio: 因往罗汉。路逢一骑牛公子。师
sayings:
- text: 问。罗汉路向甚么处去。公拍牛曰。道。道。师喝曰。这畜生。公曰。罗汉路向甚么处去。师却拍牛曰。道。道。公曰。直饶恁么。犹少蹄角在。师便打。公拍牛便走
