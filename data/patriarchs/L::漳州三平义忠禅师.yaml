id: L::漳州三平义忠禅师
name: 漳州三平义忠
school: 青原系
teacher: 大颠通
status: draft
bio: 福州杨氏子。初参石巩。巩常张弓架箭接机。师诣法席。巩曰。看箭。师乃拨开胸曰。此是杀人箭。活人箭又作么生。巩弹弓弦三下。师乃礼拜。巩曰。三十年张弓架箭。只射得半个圣人。遂拗折弓箭。后参大颠。举前话。颠曰。既是活人箭。为甚么向弓弦上辨。平无对。颠曰。三十年后。要人举此话也难得。师问大颠。不用指东划西。便请直指。颠曰。幽州江口石人蹲。师曰。犹是指东划西。颠曰。若是凤凰儿。不向那边讨。师作礼。颠曰。若不得后句。前话也难圆。师住三平
sayings:
- text: 上堂曰。今时人出来尽学驰求造作。将当自己眼目。有甚么相当。阿汝欲学么。不要诸余。汝等各有本分事。何不体取。作么心愤愤．口悱悱。有甚么利益。分明向汝说。若要修行路及诸圣建立化门。自有大藏教文在。若是宗门中事宜。汝切不得错用心
  ref: X80n1565_p0179a15（五灯会元）
- text: 僧问。宗门中还有学路也无。师曰。有一路滑如苔。曰。学人还摄得否。师曰。不拟心。汝自看
  ref: X80n1565_p0179a15（五灯会元）
- text: 问。黑豆未生芽时如何。师曰。佛亦不知。讲
  ref: X80n1565_p0179a15（五灯会元）
- text: 僧问。三乘十二分教。某甲不疑。如何是祖师西来意。师曰。龟毛拂子。兔角拄杖。大德藏向甚么处。曰。龟毛兔角岂是有邪。师曰。肉重千斤。智无铢两
  ref: X80n1565_p0179a15（五灯会元）
- text: 上堂。诸人若未曾见知识即不可。若曾见作者来。便合体取些子意度。向岩谷间木食草衣恁么去。方有少分相应。若驰求知解义句。即万里望乡关去也。珍重。问侍者。姓甚么。者曰。与和尚同姓。师曰。你道三平姓甚么。者曰。问头何在。师曰。几时问汝。者曰。问姓者谁。师曰。念汝初机。放汝三十棒。师有偈曰。即此见闻非见闻。无余声色可呈君。个中若了全无事。体用何妨分不分。升座次。有道士出众从东过西。一僧从西过东。师曰。适来道士却有见处。师僧未在。士出礼曰。谢师接引。师便打。僧出作礼曰。乞师指示。师亦打。复谓众曰。此两件公案作么生断。还有人断得么。如是三
  ref: X80n1565_p0179a15（五灯会元）
- text: 问。众无对。师曰。既无人断得。老僧为断去。乃掷下拄杖。归方丈
  ref: X80n1565_p0179a15（五灯会元）
