id: L::令滔首座
name: 令滔首座
school: 云门宗
teacher: 泐潭澄
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0600a12。
sayings:
- text: 问。祖师西来。单传心印。直指人心。见性成佛。子作么生会。师曰。某甲不会。潭曰。子未出家时。作个甚么。师曰。牧牛。潭曰。作么生牧。师曰。早朝骑出去。晚后复骑归。潭曰。子大好不会。师于言下大悟。遂成颂曰。放却牛绳便出家。剃除须发著袈裟。有人问我西来意。拄杖横挑啰哩啰
  ref: X80n1565_p0600a12（五灯会元）
