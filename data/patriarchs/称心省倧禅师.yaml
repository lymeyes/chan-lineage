bio: 生平部分原文未载，仅存机缘语（见下）；据《续传灯录》T51n2077_p0502a07。
sayings:
- text: 僧问。如何是祖师西来意。师曰。行人念路。僧曰。不会。师曰。紧峭草鞋
  ref: T51n2077_p0502a07（续传灯录）
- text: 上堂。佛种从缘起。是故说一乘。拈拄杖曰。拄杖是缘。那个是佛种。拄杖是一乘法。那个是缘。这里参见释迦老子。了却买草鞋行脚。不得向衲僧门下过。打折汝腰。且道衲僧据个甚么。良久曰。三十年后莫孤负人。卓拄杖下座
  ref: T51n2077_p0502a07（续传灯录）
