id: L::瑞州黄檗山慧禅师
name: 瑞州黄檗山慧
school: —
teacher: 疏山仁
status: draft
bio: 洛阳人也。少出家。业经论。因增受菩萨戒。而叹曰。大士摄律仪。与吾本受声闻戒。俱止持作犯也。然于篇聚增减。支本通别。制意且殊。既微细难防。复于摄善中未尝行于少分。况饶益有情乎。且世间泡幻。身命何可留恋哉。由是置讲课。欲以身捐于水中。饲鳞甲之类。念已将行。偶二禅者接之款话。说。南方颇多知识。何滞于一隅。师从此回志参寻。属关津严紧。乃谓守吏曰。吾非玩山水。誓求祖道。他日必不忘恩也。吏者察其志。遂不苛留。且谓之曰。师既为法忘身。回时愿无吝所闻。师欣谢。直造疏山。时仁和尚坐法堂受参。师先顾视大众。然后致问曰。刹那便去时如何。山曰。畐塞虗空。汝作么生去。师曰。畐塞虗空。不如不去。山便休。师下堂参第一座。座曰。适来祇对甚奇特。师曰。此乃率尔。敢望慈悲。开示愚昧。座曰。一刹那间还有拟议否。师于言下顿省。礼谢。住后
sayings:
- text: 僧问。黄檗一路荒来久。今日当阳事若何。师曰。虗空不假金锤炼。日月何曾待照人。师示灭。塔于本山。肉身至今如生
