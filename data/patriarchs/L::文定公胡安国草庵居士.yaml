name: 文定公胡安国草庵
school: 黄龙派
teacher: 上封秀
status: draft
bio: 字康侯。久依上封。得言外之旨。崇宁中过药山。有禅人举南泉斩猫话问公。公以偈答曰。手握乾坤杀活机。纵横施设在临时。玉堂兔马非龙象。大用堂堂总不知。又寄上封。有曰。祝融峰似杜城天。万古江山在目前。须信死心元不死。夜来秋月又同圆
