id: 太傅王延彬居士
name: 太傅王延彬
school: —
teacher: 长庆棱
status: draft
bio: 一日入招庆佛殿。指钵盂问殿主。这个是甚么钵。主曰。药师钵。公曰。祇闻有降龙钵。主曰。待有龙即降。公曰。忽遇拏云󱐽浪来时作么生。主曰。他亦不顾。公曰。话堕也玄沙曰。尽你神力。走向甚么处去。保福曰。归依佛．法．僧。百丈恒作覆钵势。云门曰。他日生天。莫孤负老僧。长庆谓太傅曰。雪峰竖拂子示僧。其僧便出去。若据此僧。合唤转痛与一顿。公曰。是甚么心行。庆曰。洎合放过。公到招庆煎茶。朗上座与明招把铫。忽翻茶铫。公
sayings:
- text: 问。茶炉下是甚么。朗曰。捧炉神。公曰。既是捧炉神。为甚么翻却茶。朗曰。事官千日。失在一朝。公拂袖便出。明招曰。朗上座吃却招庆饭了。却向外边打野榸。朗曰。上座作么生。招曰。非人得其便
