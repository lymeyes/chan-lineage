id: L::苏州长寿法齐禅师
name: 苏州长寿法齐
school: 法眼宗
teacher: 长寿彦
status: draft
bio: 婺州人。始讲明门。因明二论。寻置游方。受心印于广法禅师。节使钱仁奉礼。请继广法住持。开堂日。有百法座主
sayings:
- text: 问。令公请命。四众云臻。向上宗乘。请
  ref: X80n1565_p0381b06（五灯会元）
- text: 师举唱。师曰。百法明门论。曰。毕竟作么生。师曰。一切法无我
  ref: X80n1565_p0381b06（五灯会元）
- text: 问。城东老母与佛同生。为甚么却不见佛。师曰。不见即道。曰。恁么则见去也。师曰。城东老母与佛同生
  ref: X80n1565_p0381b06（五灯会元）
