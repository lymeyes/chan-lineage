id: 舒州天柱山和尚
name: 舒州天柱山
school: 云门宗
teacher: 云门偃
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0577a01。
sayings:
- text: 上堂曰。莫有作家战将么。试出来与山僧相见。时有僧出礼拜。师曰。山僧打退鼓。曰。和尚是甚么心行。师曰。败将不战
  ref: X80n1565_p0577a01（五灯会元）
- text: 问。北斗藏身。意旨如何。师曰。阇黎岂不是荆南人。曰。是。师曰。祇见波澜起。不测洞庭深。韶州云门山朗上座韶州云门山朗上座自幼肄业讲肆。闻
  ref: X80n1565_p0577a01（五灯会元）
- text: 僧问云门。如何是透法身句。门曰。北斗里藏身。师罔测微旨。遂造云门。门才见便把住曰。道。道。师拟议。门拓开。乃示颂曰。云门耸峻白云低。水急游鱼不敢栖。入户已知来见解。何劳再举轹中泥。师因斯大悟。即便礼拜。自此依云门为上座
  ref: X80n1565_p0577a01（五灯会元）
- text: 僧问。如何是解脱。师曰。穿靴水上行
  ref: X80n1565_p0577a01（五灯会元）
- text: 问。如何是透脱一路。师曰。南赡部州北郁单越。曰。学人不会。意旨如何。师曰。朝游罗浮。暮归檀特
  ref: X80n1565_p0577a01（五灯会元）
