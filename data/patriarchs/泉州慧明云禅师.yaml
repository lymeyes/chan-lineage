bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0691a04。
sayings:
- text: 僧问。般若海中。如何为人。师曰。云开银汉迥。曰。毕竟如何。师曰。棒头见血
  ref: X80n1565_p0691a04（五灯会元）
- text: 问。毗婆尸佛早留心。直至如今不得妙。意旨如何。师曰。丑拙不堪当
  ref: X80n1565_p0691a04（五灯会元）
