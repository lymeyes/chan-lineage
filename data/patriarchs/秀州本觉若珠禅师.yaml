id: 秀州本觉若珠禅师
name: 秀州本觉若珠
school: 临济宗
teacher: 浮山法远禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0452b14。
sayings:
- text: 僧问。如何是道
  ref: X80n1565_p0452b14（五灯会元）
- text: 师举起拳。僧曰。学人不会。师曰。拳头也不识
  ref: X80n1565_p0452b14（五灯会元）
- text: 上堂。说佛说祖。埋没宗乘。举古谈今。淹留衲子。拨开上路。谁敢当头。齐立下风。不劳拈出。无星秤子。如何辩得斤两。若也辩得。须弥祇重半铢。若辩不得。拗折秤衡。向日本国与诸人相见
  ref: X80n1565_p0452b14（五灯会元）
