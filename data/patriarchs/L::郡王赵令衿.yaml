name: 郡王赵令衿
school: 杨岐派
teacher: 昭觉勤
status: draft
bio: 字表之，号超然。任南康，政成事简，多与禅衲游公堂间，为摩诘丈室。适圆悟禅师奉旨来居瓯阜，公欣然就其𬬻锤，悟不少假，公固请，悟曰：此事要得相应，直须是死一回始得。公默契，尝自疏之，其略曰：家贫遭劫，谁知尽底不存？空屋无人，几度贼来亦打。悟见，嘱令加护。绍兴庚申冬，公与汪内翰藻、李参政邴、曾侍郎开诣径山谒大慧禅师，慧闻至，令行者击鼓为众入室，公欣然袖香趋之，慧曰：赵州洗钵盂话，居士作么生会？公曰：讨甚么碗？拂袖便出，慧起搊住曰：古人向这里悟去，你因甚么却不悟？公拟对，扣揓之曰：讨甚么碗？公曰：还这老汉始得
