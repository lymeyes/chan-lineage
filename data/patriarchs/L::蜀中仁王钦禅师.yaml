bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0222a06。
sayings:
- text: 僧问。如何是佛。师曰。闻名不如见面。曰。如何是祖师西来意。师曰。闹市里弄猢狲。曰。如何是道。曰。大虫看水磨。金陵铁索山主金陵铁索山主遗其名
  ref: X80n1565_p0222a06（五灯会元）
- text: 僧问。久向铁索。未审作何面目。主打露柱。僧曰。谢见示。主曰。你据个甚么便恁么道。僧却打露柱。主曰。且道索在恁么处。僧作量势。主曰。今日遇个同参
  ref: X80n1565_p0222a06（五灯会元）
