bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0518b09。
sayings:
- text: 僧问。曩劫共住。为甚么不识亲疏。师曰。谁。曰。更待某甲道。师曰。将谓不领话
  ref: X80n1565_p0518b09（五灯会元）
- text: 问。千山万水。如何登陟。师曰。青霄无间路。到者不迷机
  ref: X80n1565_p0518b09（五灯会元）
