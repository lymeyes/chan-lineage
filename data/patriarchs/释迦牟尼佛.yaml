bio: |
  姓瞿昙，名悉达多，中天竺迦毗罗卫国净饭王太子。出家苦行六年后，于菩提树下成等正觉，
  说法四十九年，度人无算。禅宗尊西天诸祖之教主；灯录以摩诃迦叶为西天初祖，佛陀为教法之源。
