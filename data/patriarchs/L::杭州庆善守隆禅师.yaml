bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0461a18。
sayings:
- text: 僧问。知师久蕴囊中宝。今日当筵略借看。师曰。多少分明。曰。师子吼时全露现。文殊仗剑又如何。师曰。惊杀老僧
  ref: X80n1565_p0461a18（五灯会元）
- text: 问。千佛出世。各有奇祥。和尚今日。以何为验。师曰。木人把板云中拍。曰。意旨如何。师曰。石女拈笙水底吹
  ref: X80n1565_p0461a18（五灯会元）
- text: 上堂。花簇簇。锦簇簇。盐酱年来事事足。留得南泉打破锅。分付沙弥煮晨粥。晨粥一任诸人吃。洗钵盂一句作么生会。多少人疑著
  ref: X80n1565_p0461a18（五灯会元）
