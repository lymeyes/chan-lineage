id: 西天二祖阿难
name: 阿难陀
honorific: 西天二祖 · 多闻尊者
school: 西天祖师
dynasty: 佛在世
teacher: 西天初祖摩诃迦叶
source_ref: 五灯会元·卷一·西天二祖阿难尊者 / 景德传灯录·卷一
cbeta: T51n2076 卷一
bio: '佛之堂弟，博闻强记、多闻第一。佛灭后，迦叶集众结集，阿难登座诵出经藏，诸经首标「如是我闻」即始于此，以证信于众。

  迦叶将入鸡足山灭度前，以正法付阿难，阿难传法于商那和修。灯录载二人机缘：迦叶索「世尊传金襕袈裟外更传何物」，阿难于言下领悟。'
sayings:
- text: 阿难问迦叶：「世尊传金襕袈裟外，别传何物？」迦叶召阿难，阿难应诺，迦叶曰：「倒却门前刹竿著！」阿难言下领悟。
  ref: 五灯会元·卷一·阿难尊者
