bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0438b18。
sayings:
- text: 僧问。师唱谁家曲。宗风嗣阿谁。师曰。铁牛不吃栏边草。直上须弥顶上眠。曰。恁么则昔日汝阳亲得旨。临江今日大敷扬。师曰。礼拜了退
  ref: X80n1565_p0438b18（五灯会元）
- text: 问。如何是佛。师曰。头大尾小。曰。未晓玄言。乞师再指。师曰。眉长三尺二。曰。恁么则人人皆顶戴。见者尽攒眉。师长嘘一声。僧拍一拍便礼拜。师曰。一任𨁝跳
  ref: X80n1565_p0438b18（五灯会元）
