id: L::仙天禅师
name: 仙天
school: 青原系
teacher: 大川
status: draft
bio: 新罗僧参。方展坐具。拟礼拜。师捉住云。未发本国时道取一句。僧无语。师便推出曰。问伊一句。便道两句。僧参。展坐具。师曰。这里会得孤负平生去也。曰。不向这里会得。又作么生。师曰。不向这里会。更向那里会。便打出。僧参。才展坐具。师曰。不用通时暄。还我文彩未生时道理来。曰。某甲有口。痖却即闲。苦死觅个腊月扇子作么。师拈棒作打势。僧把住曰。还我未拈棒时道理。师曰。随我者随之南北。不随我者死住东西。曰。随与不随且置。请师指出东西南北。师便打。披云和尚来。才入方丈。师便
sayings:
- text: 问。未见东越老人时。作么生为物。云曰。祇见云生碧嶂。焉知月落寒潭。师曰。祇与么也难得。曰。莫是未见时么。师便喝。云展两手。师曰。错怪人者有甚么限。云掩耳而出。师曰。死却这汉平生也。洛瓶和尚参
  ref: X80n1565_p0178b08（五灯会元）
- text: 师问。甚处来。瓶曰。南溪。师曰。还将南溪消息来么。曰。消即消已。息即未息。师曰。最苦是未息。瓶曰。且道未息个甚么。师曰。一回见面。千载忘名。瓶拂袖便出。师曰。弄死虵手有甚么限。僧参。拟礼拜。师曰。野狐儿见甚么了便礼拜。曰。老秃奴见甚么了便恁么
  ref: X80n1565_p0178b08（五灯会元）
- text: 问。师曰。苦哉。苦哉。仙天今日忘前失后。曰。要且得时。终不补失。师曰。争不如此。曰。谁甘。师呵呵大笑曰。远之远矣。僧四顾便出
  ref: X80n1565_p0178b08（五灯会元）
