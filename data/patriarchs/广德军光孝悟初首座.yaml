sayings:
- text: 示众。举风幡话。至仁者心动处。乃曰。祖师恁么道。赚杀一船人。今时衲僧。也不可恁么会。既不恁么会。毕竟作么生。良久曰。六月好合酱。切忌著盐多。南岳下十七世南岳下十七世
  ref: X80n1565_p0720b11（五灯会元）
