bio: 三首女子出定女子出定抹粉涂杯恰我呆，神头鬼面舞三台。千千万万人窥看，子细不知谁见来。风幡风幡非风幡动唯心动，犹涉廉纤强指陈。大地未曾添寸土，不知谁是点头人。风头稍硬风头稍硬风头坐断进还难，衲子相将不易看。未到潼关天已晓，不堪回首望长安
