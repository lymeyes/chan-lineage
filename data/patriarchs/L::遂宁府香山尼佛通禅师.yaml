id: L::遂宁府香山尼佛通禅师
name: 遂宁府香山尼佛通
school: 法眼宗
teacher: 石门易
status: draft
bio: 因诵莲经有省。往见石门。乃曰。成都吃不得也。遂宁吃不得也。门拈拄杖打出。通忽悟曰。荣者自荣。谢者自谢。秋露春风。好不著便。门拂袖归方丈。师亦不顾而出。由此道俗景从。得法者众
