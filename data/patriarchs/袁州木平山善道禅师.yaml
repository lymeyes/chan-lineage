id: 袁州木平山善道禅师
name: 袁州木平山善道
school: 青原系
teacher: 蟠龙文
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0216b04。
sayings:
- text: 问。一沤未发已前。如何辨其水脉。浦曰。移舟谙水脉。举棹别波澜。师不契。乃参蟠龙。语同前
  ref: X80n1565_p0216b04（五灯会元）
- text: 问。龙曰。移舟不别水。举棹即迷源。师从此悟入
  ref: X80n1565_p0216b04（五灯会元）
- text: 僧问。如何是西来意。师曰。石羊头子向东看
  ref: X80n1565_p0216b04（五灯会元）
- text: 问。如何是正法眼。师曰。拄杖孔
  ref: X80n1565_p0216b04（五灯会元）
- text: 问。如何是不动尊。师曰。浪浪荡荡
  ref: X80n1565_p0216b04（五灯会元）
- text: 问。如何是木平一句。师曰。畐塞虗空。曰。畐塞虗空即不
  ref: X80n1565_p0216b04（五灯会元）
- text: 问。如何是一句。师便打。凡有新到。未许参礼。先令运土三担。而示偈曰。南山路侧东山低。新到莫辞三转泥。嗟汝在途经日久。明明不晓却成迷。师肉髻螺纹。金陵李氏向其道誉。迎请供养。待以师礼。尝
  ref: X80n1565_p0216b04（五灯会元）
- text: 问。如何是木平。师曰。不劳斤斧。曰。为甚么不劳斤斧。师曰。木平。法眼禅师有偈赠曰。木平山里人。貌古言复少。相看陌路同。论心秋月皎。坏衲线非蚕。助歌声有鸟。城阙今日来。一沤曾已晓。灭后。门人建塔。谥真寂禅师
  ref: X80n1565_p0216b04（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0216b04），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
