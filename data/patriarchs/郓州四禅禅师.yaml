id: 郓州四禅禅师
name: 郓州四禅
school: 青原系
teacher: 夹山会
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0206a18。
sayings:
- text: 僧问。古人有请不背。今请和尚入井。还去也无。师曰。深深无别源。饮者消诸患
  ref: X80n1565_p0206a18（五灯会元）
- text: 问。如何是和尚家风。师曰。会得底人意。须知月色寒
  ref: X80n1565_p0206a18（五灯会元）
- text: 问。诸佛未出世时如何。师曰。王宫绝消息。曰。出世后如何。师曰。荣枯各不同
  ref: X80n1565_p0206a18（五灯会元）
