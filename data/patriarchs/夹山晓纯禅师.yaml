school: 黄龙派
teacher: 黄龙祖心禅师
status: draft
bio: 尝以木刻作一兽。师子头。牛足马身。每升堂时持出
sayings:
- text: 示众曰。唤作师子又是马身。唤作马身又是牛足。且道毕竟唤作甚么。令僧下语莫有契者。师示颂曰。轩昂师子首。牛足马身材。三道如能入。玄门叠叠开
  ref: T51n2077_p0614c07（续传灯录）
- text: 上堂。有个汉自从旷大劫无住亦无依。上无片瓦盖头。下无寸土立足。且道十二时中在甚么处安身立命。若也知得。朝到西天暮归东土
  ref: T51n2077_p0614c07（续传灯录）
