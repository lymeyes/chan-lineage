id: L::平江府觉海法因庵主
name: 平江府觉海法因
school: 黄龙派
teacher: 慧日雅
status: draft
bio: 郡之嵎山朱氏子。年二十四披缁服进具。游方至东林谒慧日。日举灵云悟道机语问之。师拟对。日曰。不是不是。师忽有所契。占偈曰。岩上桃花开。花从何处来。灵云才一见。回首舞三台。日曰。子所见虽已入微。然更著鞭当明大法。师承教居庐阜三十年不与世接。丛林尊之。建炎中盗起江左。顺流东归。邑人结庵命居。缁白继踵问道。尝谓众曰。汝等饱持定力。无忧晨炊而事干求也。晚年放浪自若。称五松散人
