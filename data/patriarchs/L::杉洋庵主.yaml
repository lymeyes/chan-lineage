id: L::杉洋庵主
name: 杉洋
school: 临济宗
teacher: 临济玄
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0399a18。
sayings:
- text: 问。阿谁。曰。杉洋庵主。师曰。是我。僧便喝。师作嘘声。僧曰。犹要棒吃在。师便打
  ref: X80n1565_p0399a18（五灯会元）
- text: 僧问。庵主得甚么道理。便住此山。师曰。也欲通个来由。又恐遭人点检。僧曰。又争免得。师便喝。僧曰。恰是。师便打。僧大笑而出。师曰。今日大败。定上座定上座初参临济
  ref: X80n1565_p0399a18（五灯会元）
- text: 问。如何是佛法大意。济下禅床擒住。师拟议。济与一掌。师伫思。傍僧曰。定上座何不礼拜。师方作礼。忽然大悟。后南游。路逢岩头．雪峰．钦山三人。岩头
  ref: X80n1565_p0399a18（五灯会元）
- text: 问。上座甚处来。师曰。临济来。岩曰。和尚万福。师曰。和尚已顺世也。岩曰。某甲三人特去礼拜。薄福不遇。不知和尚在日有何言句。请上座举一两则。师遂举临济
  ref: X80n1565_p0399a18（五灯会元）
- text: 上堂曰。赤肉团上。有一无位真人。常在汝等诸人面门出入。未证据者看看。时有
  ref: X80n1565_p0399a18（五灯会元）
- text: 僧问。如何是无位真人。济下禅床搊住曰。道。道。僧拟议。济拓开曰。无位真人是甚么干屎橛。岩头不觉吐舌。雪峰曰。临济大似白拈贼。钦山曰。何不道赤肉团上非无位真人。师便擒住曰。无位真人与非无位真人。相去多少。速道。速道。钦山被擒。直得面黄面青。语之不得。岩头．雪峰曰。这新戒不识好恶。触忤上座。且望慈悲。师曰。若不是这两个老汉。𡎺杀这尿床鬼子。师在镇府斋。回到桥上坐次。逢三人座主。一人
  ref: X80n1565_p0399a18（五灯会元）
- text: 问。如何是禅河深处。须穷到底。师擒住。拟抛向桥下。二座主近前谏曰。莫怪触忤上座。且望慈悲。师曰。若不是这两个座主。直教他穷到底。奯上座奯上座离临济参德山。山才见。下禅床作抽坐具势。师曰。这个且置。或遇心境一如底人来。向伊道个甚么。免被诸方检责。山曰。犹较昔日三步在。别作个主人公来。师便喝。山默然。师曰。塞却这老汉咽喉也。拂袖便出沩山闻举云。奯上座虽得便宜。争奈掩耳偷铃。又参百丈。茶罢。丈曰。有事相借问得么。师曰。幸自非言。何须瓯茶。丈曰。与么则许借
  ref: X80n1565_p0399a18（五灯会元）
- text: 问。丈曰。收得安南。又忧塞北。师擘开胸曰。与么不与么。丈曰。要且难构。要且难构。师曰。知即得。知即得仰山云。若有人知得此二人落处。不妨奇特。若辨不得。大似日中迷路。南岳下六世南岳下六世
  ref: X80n1565_p0399a18（五灯会元）
