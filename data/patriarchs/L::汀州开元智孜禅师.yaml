id: L::汀州开元智孜禅师
name: 汀州开元智孜
school: 云门宗
teacher: 天衣怀
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0620b17。
sayings:
- text: 上堂。衲僧家向针眼里藏身稍宽。大海中走马甚窄。将军不上便桥。勇士徒劳挂甲。昼行三千。夜行八百即不
  ref: X80n1565_p0620b17（五灯会元）
- text: 问。不动步一句作么生道。若也道得。观音．势至．文殊．普贤祇在目前。若道不得。直须撩起布裙。紧峭草鞋。参
  ref: X80n1565_p0620b17（五灯会元）
- text: 上堂。寒空落落。大地漫漫。云生洞口。水出高原。若也把定。则十方世界恍然。若也放行。则东西南北坦然。茫茫宇宙人无数。一个个鼻孔辽天。且问诸人把定即是。放行即是。还有人断得么。若无人断得。三门外有两个大汉。一个张眉握剑。一个努目挥拳。参
  ref: X80n1565_p0620b17（五灯会元）
