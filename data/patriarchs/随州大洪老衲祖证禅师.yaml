id: 随州大洪老衲祖证禅师
name: 随州大洪老衲祖证
school: 杨岐派
teacher: 大沩果禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0823b12。
sayings:
- text: 上堂。万象之中独露身。如何说个独露底道理。竖起拂子曰。到江吴地尽。隔岸越山多
  ref: X80n1565_p0823b12（五灯会元）
- text: 僧问。云门问僧。光明寂照遍河沙。岂不是张拙秀才语
  ref: X80n1565_p0823b12（五灯会元）
- text: 僧云是。门云。话堕也。未审那里是这僧话堕处。师曰。鲇鱼上竹竿
  ref: X80n1565_p0823b12（五灯会元）
- text: 问。离却言句。请师直指。师竖拂子。僧曰。还有向上事也无。师曰。有。曰。如何是向上事。师曰。速礼三拜
  ref: X80n1565_p0823b12（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0823b12），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
