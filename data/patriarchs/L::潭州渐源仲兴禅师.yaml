id: L::潭州渐源仲兴禅师
name: 潭州渐源仲兴
school: 青原系
teacher: 道吾智
status: draft
bio: 在道吾为侍者。因过茶与吾。吾提起盏曰。是邪是正。师叉手近前。目视吾。吾曰。邪则总邪。正则总正。师曰。某甲不恁么道。吾曰。汝则么生。师夺盏子提起曰。是邪是正。吾曰。汝不虗为吾侍者。师便礼拜。一日。侍吾往檀越家吊慰。师抚棺曰。生邪死邪。吾曰。生也不道。死也不道。师曰。为甚么不道。吾曰。不道。不道。归至中路。师曰。和尚今日须与某甲道。若不道。打和尚去也。吾曰。打即任打。道即不道。师便打。吾归院曰。汝宜离此去。恐知事得知。不便。师乃礼辞。隐于村院。经三年后。忽闻童子念观音经。至应以比丘身得度者即现比丘身。忽然大省。遂焚香遥礼曰。信知先师遗言。终不虗发。自是我不会。却怨先师。先师既没。唯石霜是嫡嗣。必为证明。乃造石霜。霜见便
sayings:
- text: 问。离道吾后到甚处来。师曰。祇在村院寄足。霜曰。前来打先师因缘会也未。师起身进前曰。却请和尚道一转语。霜曰。不见道。生也不道。死也不道。师乃述在村院得底因缘。遂礼拜石霜。设斋忏悔。他日。持锹复到石霜。于法堂上从东过西。从西过东。霜曰。作么。师曰。觅先师灵骨。霜曰。洪波浩渺。白浪滔天。觅甚先师灵骨。师曰。正好著力。霜曰。这里针札不入。著甚么力。源持锹肩上便出大原孚上座代云。先师灵骨犹在。师后住渐源。一日在纸帐内坐。有僧来拨开帐曰。不审。师以目视之。良久曰。会么。曰。不会。师曰。七佛已前事。为甚么不会。僧举似石霜。霜曰。如人解射。箭不虗发。一日。宝葢和尚来访。师便卷起帘子。在方丈内坐。盖一见乃下却帘。便归客位。师令侍者传语。长老远来不易。犹隔津在。盖擒住侍者。与一掌。者曰。不用打某甲。有堂头和尚在。盖曰。为有堂头老汉。所以打你。者回举似师。师曰。犹隔津在
