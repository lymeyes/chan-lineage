id: 苏州西禅和尚
name: 苏州西禅
school: 南岳系
teacher: 南泉愿
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0140a06。
sayings:
- text: 僧问。三乘十二分教则不
  ref: X80n1565_p0140a06（五灯会元）
- text: 问。如何是祖师西来的的意
  ref: X80n1565_p0140a06（五灯会元）
- text: 师举拂子示之。其僧不礼拜。竟参雪峰。峰
  ref: X80n1565_p0140a06（五灯会元）
- text: 问。甚么处来。曰。浙中来。峰曰。今夏甚么处。曰。西禅。峰曰。和尚安否。曰。来时万福。峰曰。何不且在彼从容。曰。佛法不明。峰曰。有甚么事。僧举前话。峰曰。汝作么生不肯伊。曰。是境。峰曰。汝见苏州城里人家男女否。曰。见。峰曰。汝见路上林木池沼否。曰。见。峰曰。凡睹人家男女。大地林沼。总是境。汝还肯否。曰。肯。峰曰。祇如举起拂子。汝作么生不肯。僧乃礼拜曰。学人取次发言。乞师慈悲。峰曰。尽乾坤是个眼。汝向甚么处蹲坐。僧无语。宣州刺史陆亘大夫宣州刺史陆亘大夫问南泉。古人瓶中养一鹅。鹅渐长大。出瓶不得。如今不得毁瓶。不得损鹅。和尚作么生出得。泉召大夫。陆应诺。泉曰。出也。陆从此开解。即礼谢。暨南泉圆寂。院主问曰。大夫何不哭先师。陆曰。院主道得即哭。院主无对长庆代云。合哭不合哭。池州甘贽行者池州甘贽行者一日入南泉设斋。黄檗为首座。行者请施财。座曰。财法二施。等无差别。甘曰。恁么道。争消得某甲𫎪。便将出去。须臾复入。曰。请施财。座曰。财法二施。等无差别。甘乃行𫎪。又一日。入寺设粥。仍请南泉念诵。泉乃白椎曰。请大众为狸奴白牯念摩诃般若波罗蜜。甘拂袖便出。泉粥后问典座。行者在甚处。座曰。当时便去也。泉便打破锅子。甘常接待往来。有
  ref: X80n1565_p0140a06（五灯会元）
- text: 僧问曰。行者接待不易。甘曰。譬如𫗪驴𫗪马。僧休去。有住庵僧缘化什物。甘曰。有一
  ref: X80n1565_p0140a06（五灯会元）
- text: 问。若道得即施。乃书心字
  ref: X80n1565_p0140a06（五灯会元）
- text: 问。是甚么字。曰。心字。又问妻。甚么字。妻曰。心字。甘曰。某甲山妻亦合住庵。其僧无语。甘亦无施。又问一僧。甚么处来。曰。沩山来。甘曰。曾有
  ref: X80n1565_p0140a06（五灯会元）
- text: 僧问沩山。如何是西来意。沩山举起拂子。上座作么生会沩山意。曰。借事明心。附物显理。甘曰。且归沩山去好保福闻之。乃仰手覆手。盐官安国师法嗣盐官安国师法嗣
  ref: X80n1565_p0140a06（五灯会元）
