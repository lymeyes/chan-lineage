id: 南岳石头怀志庵主
name: 南岳石头怀志
school: 青原系
teacher: 宝峰文
status: draft
bio: 婺之金华人，族吴氏。年十四，师智慧院宝偁。二十二，试所习落发。肄讲十二年，宿学敬慕。尝欲会通诸宗，正一代时教。有禅者问曰：杜顺乃贤首宗祖师也，谈法身则曰：怀州牛吃禾，益州马腹胀。此偈合归天台何义耶？志无对，即出游方。晚至洞山，谒真净
sayings:
- text: 问：古人一喝不作一喝用，意旨如何？净叱之，志趋出。净笑呼曰：浙子斋后游山好。志忽领悟，久之辞去。净曰：子所造虽逸格，惜缘不胜耳。因识其意。自尔诸方力命出世，师却之。庵居二十年，不与世接。士夫踵门，略不顾。有偈曰：万机休罢付痴憨，踪迹时容野鹿参。不脱麻衣拳作枕，几生梦在绿萝庵。或
  ref: X79n1559_p0129b14（嘉泰普灯录）
- text: 问：住山多年，有何旨趣？曰：山中住，独掩柴门无别趣。三块柴头品字煨，不用援毫文彩露。崇宁改元冬，曳杖造龙安，人莫之留。明年六月晦，问侍僧日早暮，云：已夕矣。遂笑曰：梦境相逢，我睡已觉。汝但莫负丛林，即是报佛恩德。言讫，示寂于最乐堂。茶毗收骨，塔于乳峰之下。寿六十四，夏四十三
  ref: X79n1559_p0129b14（嘉泰普灯录）
