id: 杭州千光王寺瓌省禅师
name: 杭州千光王寺瓌省
school: 法眼宗
teacher: 永明潜禅师
status: draft
bio: 温州郑氏子。幼岁出家。精究律部。听天台文句。栖心于圆顿止观。后阅楞严。文理宏濬。未能洞晓。一夕诵经既久。就案假寐。梦中见日轮自空而降。开口吞之。自是倏然发悟。差别义门。涣然无滞。后参永明。永明唯印前解。无别指喻。以忠懿王所遗衲衣授之表信。住后
sayings:
- text: 上堂。诸上座。佛法无事。昔之日月。今之日月。昔日风雨。今日风雨。昔日上座。今日上座。举亦了。说亦了。一切成现好。珍重。开宝五年七月。宝树浴池。忽现其前。师曰。凡所有相。皆是虗妄。越三日示疾。集众言别。安坐而逝。阇维收舍利建塔
