id: 守廓侍者
name: 守廓侍者
school: 临济宗
teacher: 兴化存奖禅师
bio: 兴化存奖禅师侍者。临济迁化前「正法眼藏」公案中，守廓侍者为在场合掌见证者之一；后于兴化存奖会下入室得法。
sayings:
- text: 临济顺世公案中，三圣喝、临济谓「正法眼藏向这汉边灭却」，守廓侍者时在众中。
  ref: 五灯会元·卷十一·临济义玄禅师
- text: 守廓侍兴化，化问：「汝名甚么？」廓曰：「守廓。」化曰：「忽遇廓然无圣时如何？」廓便喝。
  ref: 五灯会元·卷十二·守廓侍者
status: draft
