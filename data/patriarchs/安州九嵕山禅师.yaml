id: 安州九嵕山禅师
name: 安州九嵕山
school: 青原系
teacher: 投子大同禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0207b13。
sayings:
- text: 僧问。远闻九嵕。及乎到来。祇见一嵕。师曰。阇黎祇见一嵕。不见九嵕。曰。如何是九嵕。师曰。水急浪花骊
  ref: X80n1565_p0207b13（五灯会元）
