id: 潼川府护圣愚丘居静禅师
name: 潼川府护圣愚丘居静
school: 杨岐派
teacher: 大随元静禅师
status: draft
bio: 成都杨氏子。年十四。礼白马安慧为师。闻南堂道望。遂往依焉。堂举香严枯木里龙吟话。往返酬诘。师于言下大悟。一日。堂问曰。莫守寒岩异草青。坐却白云宗不妙。汝作么生。师曰。直须挥剑。若不挥剑。渔父栖巢。堂矍然曰。这小厮儿。师珍重便行。出住东岩
sayings:
- text: 上堂。月生一。东岩乍住增愁寂。红尘世路有多端。米󳫹仓储无颗粒。崖为伴。泉为匹。飒飒清风来入室。山王土地暗中忙。云版钟鱼偷泪滴。世人莫道守空岩。亦有东篱打西壁。尝谓众曰。参学至要。不出先南堂道。最初句及末后句。透得过者。一生事毕。傥或未然。更与你分作十门。各各印证自心。还得稳当也未。一．须信有教外别传。二．须知有教外别传。三．须会无情说法与有情说法无二。四．须见性如观掌中之物。了了分明。一一田地稳密。五．须具择法眼。六．须行鸟道玄路。七．须文武兼济。八．须摧邪显正。九．须大机大用。十．须向异类中行。凡欲绍隆法种。须尽此纲要。方坐得这曲录床子。受得天下人礼拜。敢与佛祖为师。若不到恁么田地。祇一向虗头。他时异日。阎老子未放你在。间有学者各门颂出。呈师。师以颂示曰。十门纲要掌中施。机会来时自有为。作者不须排位次。大都首末是根基
