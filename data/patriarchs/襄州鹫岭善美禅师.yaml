bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0314b07。
sayings:
- text: 僧问。如何是鹫岭境。师曰。岘山对碧玉。江水往南流。曰。如何是境中人。师曰。有甚么事
  ref: X80n1565_p0314b07（五灯会元）
- text: 问。百川异流。还归大海。未审大海有几滴。师曰。汝还到海也未。曰。到海后如何。师曰。明日来。向汝道
  ref: X80n1565_p0314b07（五灯会元）
