id: L::平江府西山明因昙玩禅师
name: 平江府西山明因昙玩
school: 杨岐派
teacher: 昭觉勤
status: draft
bio: 温州黄氏子。遍参丛席。宣和庚子。回抵钟阜。适朝廷改僧为德士。师与同志数人。入头陀岩食松自处。久之。圆悟被旨居是山。亲至岩所。令去须发。及悟诏补京师天宁。与师俱往。命掌香水海。未几。因举枹击鼓。顿明大法。凡有所
sayings:
- text: 问。皆对曰。莫理会。故流辈咸以莫理会称之。住后
  ref: X80n1565_p0767a12（五灯会元）
- text: 上堂。汝有一对眼。我也有一对眼。汝若瞒还自瞒。汝若成佛作祖。老僧无汝底分。汝若做驴做马。老僧救汝不得。众檀越入山。请
  ref: X80n1565_p0767a12（五灯会元）
- text: 上堂。说偈曰。我无长处名虗出。谢汝殷勤特地来。明因无法堪分付。谩把山门为汝开
  ref: X80n1565_p0767a12（五灯会元）
