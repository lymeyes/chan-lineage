id: 安州大安山兴古禅师
name: 安州大安山兴古
school: 青原系
teacher: 乌牙宾禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0218a15。
sayings:
- text: 僧问。亡僧迁化。向甚么处去也。师曰。昨夜三更拜南郊
  ref: X80n1565_p0218a15（五灯会元）
- text: 问。维摩默然。意旨如何。师曰。黯黑石牛儿。超然不出户
  ref: X80n1565_p0218a15（五灯会元）
- text: 问。如何是那边事。师曰。黑漆牧童不展手。银笼鹤畔野云飞
  ref: X80n1565_p0218a15（五灯会元）
