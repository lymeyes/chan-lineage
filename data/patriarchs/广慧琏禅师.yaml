id: 广慧琏禅师
name: 广慧元琏
school: 临济宗
teacher: 首山省念
bio: 首山省念禅师法嗣，住广慧院。与士大夫杨亿（杨大年）机缘往还，为宋初临济宗在京城弘化之健者。
sayings:
- text: 广慧问杨亿：「承祇事看经，是否？」亿曰：「是。」慧曰：「将甚么看？」亿曰：「将眼睛看。」慧曰：「驴年去！」亿于是有省。
  ref: 五灯会元·卷十二·广慧元琏禅师
- text: 上堂：「若于衲僧门下，一言相见，如击石火，似闪电光；若向街衢市井，唤作禅道，误人性命。」
  ref: 五灯会元·卷十二·广慧元琏禅师
