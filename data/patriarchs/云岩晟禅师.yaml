id: 云岩晟禅师
name: 云岩昙晟
honorific: 潭州云岩昙晟禅师（药山惟俨法嗣，洞山良价之师）
school: 青原系
dynasty: 唐（782—841）
region: 潭州云岩山（今湖南浏阳）
teacher: 药山惟俨
source_ref: 五灯会元·卷五·潭州云岩昙晟 / 景德传灯录·卷十五
cbeta: T51n2076 卷十五
bio: 药山惟俨之法嗣，与道吾宗智、船子德诚同门，洞山良价之师，为曹洞宗之源。以「宝镜」之喻、及「当今时节，怎么生道得」之勘验启悟洞山。临终有「闲道人」之语，示生死自在。
sayings:
- text: 洞山问「无情说法，甚么人得闻」，师云「无情得闻」。山云「某甲为甚不闻」，师云「汝若闻，即齐于诸圣」；山云「某甲还闻也无」，师云「我若闻，即齐于诸圣」。（无情说法之辩）
  ref: 五灯会元·卷五·云岩昙晟 / 洞山良价机缘
- text: 师临迁化，示众：「汝等在此，大须努力；珍重，珍重。」遂坐逝；弟子呼「和尚遗著有在」，师复开目云「直须悄然」而寂。
  ref: 五灯会元·卷五·云岩昙晟
status: draft
verify: 待 CBETA 校对云岩昙晟机缘与洞山「无情说法」公案。
