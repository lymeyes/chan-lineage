id: 英州保福殊禅师
name: 英州保福殊
school: 杨岐派
teacher: 白云端
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0735a15。
sayings:
- text: 僧问。诸佛未出世时如何。师曰。山河大地。曰。出世后如何。师曰。大地山河。曰。恁么则一般也。师曰。敲砖打瓦
  ref: X80n1565_p0735a15（五灯会元）
- text: 问。如何是和尚家风。师曰。椀大椀小。曰。客来将何祇待。师曰。一杓两杓。曰。未饱者。作么生。师曰。少吃少吃
  ref: X80n1565_p0735a15（五灯会元）
- text: 问。如何是大道。师曰。闹市里。曰。如何是道中人。师曰。一任人看
  ref: X80n1565_p0735a15（五灯会元）
- text: 问。如何是禅。师曰。秋风临古渡。落日不堪闻。曰。不问这个禅。师曰。你问那个禅。曰。祖师禅。师曰。南华塔外松阴里。饮露吟风又更多
  ref: X80n1565_p0735a15（五灯会元）
- text: 问。如何是真正路。师曰。出门看堠子。乃曰。释迦何处灭俱尸。弥勒几曾在兜率。西觅普贤好惭愧。北讨文殊生受屈。坐压毗卢额汗流。行筑观音鼻血出。回头摸著个匾担。却道好个木牙笏。喝一喝。下座
  ref: X80n1565_p0735a15（五灯会元）
