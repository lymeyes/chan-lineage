bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0711a07。
sayings:
- text: 上堂。古者道。识得凳子。周匝有余。又道。识得凳子。天地悬殊。山僧总不恁么。识得凳子是甚么闲家具。一日普说罢。师曰。诸子未要散去。更听一颂。乃曰。四十九年。一场热哄。八十七春。老汉独弄。谁少谁多。一般作梦。归去来兮。梅梢雪重。言讫下座。倚杖而逝
  ref: X80n1565_p0711a07（五灯会元）
