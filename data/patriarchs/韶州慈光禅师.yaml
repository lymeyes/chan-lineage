sayings:
- text: 僧问。即心即佛。诱诲之言。不涉前踪。如何指教。师曰。东西且置。南北事作么生。曰。恁么则学人罔测去也。师曰。龙头蛇尾
  ref: X80n1565_p0573b13（五灯会元）
