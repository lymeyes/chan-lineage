id: 明州育王常坦禅师
name: 明州育王常坦
school: 云门宗
teacher: 福昌善
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0589a01。
sayings:
- text: 僧问。如何是有中有。师曰。金河峰上。曰。如何是无中无。师曰。般若堂前
  ref: X80n1565_p0589a01（五灯会元）
- text: 上堂。千花竞发。百鸟啼春。是向上句。诸佛出世。知识兴慈。是向下句。作么生是不涉二途句。若识得。顶门上出气。若识不得。土牛耕石田。击禅床。下座
  ref: X80n1565_p0589a01（五灯会元）
