id: L::升州长庆道𪩘禅师
name: 升州长庆道𪩘
school: —
teacher: 光孝觉
status: draft
bio: 庐州人也。初侍光孝便领悟微言。即于湖南大光山剃度。既化缘弥盛。出住长庆
sayings:
- text: 上堂。弥勒朝入伽蓝。暮成正觉。说偈曰。三界上下法。我说皆是心。离于诸心法。更无有可得。看他恁么道。也太杀惺惺。若比吾徒。犹是钝汉。所以一念见道。三世情尽。如印印泥。更无前后。诸子生死事大。快须荐取。莫为等闲。业识茫茫。葢为迷己逐物。世尊临入涅槃。文殊请再转法轮。世尊咄曰。吾四十九年住世。不曾说一字。汝请吾再转法轮。是吾曾转法轮邪。然今时众中。建立个宾主问答。事不获已。葢为初心耳
  ref: X80n1565_p0160a10（五灯会元）
- text: 僧问。如何是长庆境。师曰。阇黎履践看
  ref: X80n1565_p0160a10（五灯会元）
- text: 问。如何是佛法大意。师曰。今日三月三。曰。学人不会。师曰。止。止。不须说。我法妙难思。便下座。咸平二年示寂。五灯会元灯会元祖大鉴禅师法嗣
  ref: X80n1565_p0160a10（五灯会元）
