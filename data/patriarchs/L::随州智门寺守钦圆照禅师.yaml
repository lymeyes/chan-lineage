id: L::随州智门寺守钦圆照禅师
name: 随州智门寺守钦圆照
school: —
teacher: 护国澄
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0514b11。
sayings:
- text: 僧问。两镜相照。为甚么中间无像。师曰。自己亦须隐。曰。镜破台亡时如何。师竖起拳
  ref: X80n1565_p0514b11（五灯会元）
- text: 问。如何是和尚家风。师曰。额上不贴榜
  ref: X80n1565_p0514b11（五灯会元）
- text: 问。如何是祖师西来意。师曰。把火烧天徒自疲
  ref: X80n1565_p0514b11（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0514b11），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
