id: 太平州隐静圆极彦岑禅师
name: 太平州隐静圆极彦岑
school: 杨岐派
teacher: 云居如
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0820b17。
sayings:
- text: 上堂。韩信打关。未免伤锋犯手。张良烧栈。大似曳尾灵龟。既然席卷三秦。要且未能囊弓褁革。烟尘自静。我国晏然。四海九州。尽归皇化。自然牛闲马放。风以时。雨以时。五谷熟。万民安。大家齐唱村田乐。月落参横夜向阑
  ref: X80n1565_p0820b17（五灯会元）
- text: 上堂。今朝八月初五。好事分明为举。岭头漠漠秋云。树底鸣鸠唤雨。昨夜东海鲤鱼。吞却南山猛虎。虽然有照有用。毕竟无宾无主。唯有文殊普贤。住。住。我识得你
  ref: X80n1565_p0820b17（五灯会元）
- text: 上堂。举正堂辩和尚室中问学者。蚯蚓为甚么化为百合。师曰。客舍并州已十霜。归心日夜忆咸阳。无端更度桑干水。却望并州是故乡
  ref: X80n1565_p0820b17（五灯会元）
