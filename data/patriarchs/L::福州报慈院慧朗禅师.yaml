id: L::福州报慈院慧朗禅师
name: 福州报慈院慧朗
school: —
teacher: 长庆棱
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0287b05。
sayings:
- text: 上堂。从上诸圣。为一大事因缘故出现于世。递相告报。是汝诸人还会么。若不会。大不容易
  ref: X80n1565_p0287b05（五灯会元）
- text: 僧问。如何是一大事。师曰。莫错相告报么。曰。恁么则学人不疑也。师曰。争奈一翳在目
  ref: X80n1565_p0287b05（五灯会元）
- text: 问。三世诸佛尽是传语人。未审传甚么人语。师曰。听。曰。未审是甚么语。师曰。你不是钟期
  ref: X80n1565_p0287b05（五灯会元）
- text: 问。如何是学人眼。师曰。不可更撒沙
  ref: X80n1565_p0287b05（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0287b05），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
