id: L::福州广平院守威宗一禅师
name: 福州广平院守威宗一
school: 法眼宗
teacher: 天台韶
status: draft
bio: 本州人也。参天台国师得旨。乃付衣法。时有
sayings:
- text: 僧问。大庾岭头提不起。如何今日付于师。师提起曰。有人敢道天台得么
  ref: X80n1565_p0369b08（五灯会元）
- text: 上堂。达磨大师云。吾法三千年后。不移丝发。山僧今日不移达磨丝发。先达之者。共相证明。若未达者。不移丝发
  ref: X80n1565_p0369b08（五灯会元）
- text: 僧问。洪钟韵绝。大众临筵。祖意西来。请师提唱。师曰。洪钟韵绝。大众临筵
  ref: X80n1565_p0369b08（五灯会元）
- text: 问。古人云。任汝千圣见。我有天真佛。如何是天真佛。师曰。千圣是弟
  ref: X80n1565_p0369b08（五灯会元）
- text: 问。如何是广平家风。师曰。谁不受用
  ref: X80n1565_p0369b08（五灯会元）
- text: 上堂。不用开经作梵。不用展钞牒科。还有理论处也无。设有理论处。亦是方便之谈。宗乘事合作么生
  ref: X80n1565_p0369b08（五灯会元）
- text: 问。如何是西来意。师曰。未曾有人答得。曰。请师方便。师曰。何不更
  ref: X80n1565_p0369b08（五灯会元）
