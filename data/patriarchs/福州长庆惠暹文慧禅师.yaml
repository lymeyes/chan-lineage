id: 福州长庆惠暹文慧禅师
name: 福州长庆惠暹文慧
school: 临济宗
teacher: 净因臻
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0458a15。
sayings:
- text: 僧问。离上生之宝刹。登延圣之道场。如何是不动尊。师曰。孤舟载明月。曰。忽遇𫇛棹俱停。又作么生。师曰。渔人偏爱宿芦花
  ref: X80n1565_p0458a15（五灯会元）
- text: 问。长期进道西天。以蜡人为验。未审此间以何为验。师曰。铁弹子。曰。意旨如何。师曰。大底大。小底小
  ref: X80n1565_p0458a15（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0458a15），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
