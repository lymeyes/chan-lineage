id: 袁州蒙山道明禅师
name: 袁州蒙山道明
school: —
teacher: 五祖大满旁出
status: draft
bio: 鄱阳人。陈宣帝之裔也。国亡落于民间。以其王孙。尝受署。因有将军之号。少于永昌寺出家。慕道颇切。往依五祖法会。极意研寻。初无解悟。及闻五祖密付衣法与卢行者。即率同志数十人。蹑迹追逐。至大庾岭。师最先见。余辈未及。卢见师奔至。即掷衣钵于磐石曰。此衣表信。可力争邪。任君将去。师遂举之。如山不动。踟蹰悚栗。乃曰。我来求法。非为衣也。愿行者开示于我。卢曰。不思善。不思恶。正恁么时。阿那个是明上座本来面目。师当下大悟。遍体汗流。泣礼数拜。问曰。上来密语密意外。还更别有意旨否。卢曰。我今与汝说者。即非密也。汝若返照自己面目。密却在汝边。师曰。某甲虽在黄梅随众。实未省自己面目。今蒙指授入处。如人饮水。冷暖自知。今行者即是某甲师也。卢曰。汝若如是。则吾与汝同师黄梅。善自护持。师又
sayings:
- text: 问。某甲向后宜往何所。卢曰。逢袁可止。遇蒙即居。师礼谢。遽回至岭下。谓众人曰。向陟崔嵬。远望杳无踪迹。当别道寻之。皆以为然。师既回。遂独往庐山布水台。经三载后。始往袁州𫎇山。大唱玄化。初名慧明。以避六祖上字。故名道明。弟子等尽遣过岭南。参礼六祖
