id: 古寺和尚
name: 古寺
school: 南岳系
teacher: 马祖道一禅师
status: draft
bio: 丹霞来参。经宿。明旦粥熟。行者祇盛一钵与师。又盛一椀自吃。殊不顾丹霞。霞亦自盛粥吃。者曰。五更侵早起。更有夜行人。霞
sayings:
- text: 问。师何不教训行者。得恁么无礼。师曰。净地上不要点污人家男女。霞曰。几不问过这老汉
  ref: X80n1565_p0115a01（五灯会元）
