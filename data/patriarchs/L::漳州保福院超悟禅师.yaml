id: L::漳州保福院超悟禅师
name: 漳州保福院超悟
school: —
teacher: 雪峰存
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0269a09。
sayings:
- text: 僧问。鱼未透龙门时如何。师曰。养性深潭。曰。透出时如何。师曰。才升霄汉。众类难追。曰。升后如何。师曰。垂云普覆。润及大千。曰。还有不受润者也无。师曰。有。曰。如何是不受润者。师曰。直杌撑大阳。太原孚上座太原孚上座初在扬州光孝寺讲涅槃经。有禅者阻雪。因往听讲。至三因佛性。三德法身。广谈法身妙理。禅者失笑。师讲罢。请禅者吃茶。白曰。某甲素志狭劣。依文解义。适蒙见笑。且望见教。禅者曰。实笑座主不识法身。师曰。如此解说。何处不是。曰。请座主更说一遍。师曰。法身之理。犹若太虗。竖穷三际。横亘十方。弥纶八极。包括二仪。随缘赴感。靡不周遍。曰。不道座主说不是。祇是说得法身量边事。实未识法身在。师曰。既然如是。禅德当为我说。曰。座主还信否。师曰。焉敢不信。曰。若如是。座主辍讲旬日。于室内端然静虑。收心摄念。善恶诸缘。一时放却。师一依所教。从初夜至五更。闻鼓角声。忽然契悟。便去扣门。禅者曰。阿谁。师曰。某甲。禅者咄曰。教汝传持大教。代佛说法。夜来为甚么醉酒卧街。师曰。禅德自来讲经。将生身父母鼻孔扭捏。从今已去。更不敢如是。禅者曰。且去。来日相见。师遂罢讲。遍历诸方。名闻宇内。尝游浙中登径山法会。一日于大佛殿前。有
  ref: X80n1565_p0269a09（五灯会元）
- text: 僧问。上座曾到五台否。师曰。曾到。曰。还见文殊么。师曰。见。曰。甚么处见。师曰。径山佛殿前见。其僧后适闽川。举似雪峰。峰曰。何不教伊入岭来。师闻。乃趣装而迈。初至雪峰廨院憩锡。因分柑子与僧。长庆
  ref: X80n1565_p0269a09（五灯会元）
- text: 问。甚么处将来。师曰。岭外将来。曰。远涉不易。担负得来。师曰。柑子。柑子。次日上山。雪峰闻。乃集众。师到法堂上。顾视雪峰。便下看知事。明日却上礼拜曰。某甲昨日触忤和尚。峰曰。知是般事便休。峰一日见师。乃指日示之。师摇手而出。峰曰。汝不肯我那。师曰。和尚摇头。某甲摆尾。甚么处是不肯。峰曰。到处也须讳却。一日。众僧晚参。峰在中庭卧。师曰。五州管内。祇有这老和尚较些子。峰便起去。峰尝问师。见说临济有三句。是否。师曰。是。曰。作么生是第一句
  ref: X80n1565_p0269a09（五灯会元）
- text: 师举目视之。峰曰。此犹是第二句。如何是第一句。师叉手而退。自此雪峰深器之。室中印解。师资道契。更不他游。而掌浴焉。一日。玄沙上。问讯雪峰。峰曰。此间有个老鼠子。今在浴室里。沙曰。待与和尚勘过。言讫到浴室。遇师打水。沙曰。相看上座。师曰。已相见了。沙曰。甚么劫中曾相见。师曰。瞌睡作么。沙却入方丈。白雪峰曰。已勘破了。峰曰。作么生勘伊。沙举前话。峰曰。汝著贼也。鼓山问师。父母未生时。鼻孔在甚么处。师曰。老兄先道。山曰。如今生也。汝道在甚么处。师不肯。山却
  ref: X80n1565_p0269a09（五灯会元）
- text: 问。作么生。师曰。将手中扇子来。山与扇子。再征前话。师摇扇不对。山罔测。乃驱师一拳。鼓山赴大王请。雪峰门送。回至法堂。乃曰。一只圣箭直射九重城里去也。师曰。是伊未在。峰曰。渠是彻底人。师曰。若不信。待某甲去勘过。遂趁至中路。便
  ref: X80n1565_p0269a09（五灯会元）
- text: 问。师兄向甚么处去。山曰。九重城里去。师曰。忽遇三军围绕时如何。山曰。他家自有通霄路。师曰。恁么则离宫失殿去也。山曰。何处不称尊。师拂袖便回。峰
  ref: X80n1565_p0269a09（五灯会元）
- text: 问。如何。师曰。好只圣箭。中路折却了也。遂举前话。峰乃曰。奴渠语在。师曰。这老冻脓犹有乡情在。师在库前立。有
  ref: X80n1565_p0269a09（五灯会元）
- text: 僧问。如何是触目菩提。师踢狗子。作声走。僧无对。师曰。小狗子不消一踢。保福签瓜次。师至。福曰。道得与汝瓜吃。师曰。把将来。福度与一片。师接得便去。师不出世。诸方目为太原孚上座。后归维扬。陈尚书留在宅供养。一日谓尚书曰。来日讲一遍大涅槃经。报答尚书。书致斋茶毕。师遂升座。良久。挥尺一下曰。如是我闻。乃召尚书。书应诺。师曰。一时佛在。便乃脱去
  ref: X80n1565_p0269a09（五灯会元）
