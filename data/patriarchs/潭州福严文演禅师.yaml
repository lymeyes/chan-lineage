bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0767a07。
sayings:
- text: 僧问。如何是定林正主。师曰。坐断天下人舌头。曰。未审如何亲近。师曰。󳬇著则瞎
  ref: X80n1565_p0767a07（五灯会元）
- text: 上堂。当阳坐断。凡圣迹绝。随手放开。天回地转。直得日月交互。虎啸龙吟。头头物物。耳闻目视。安立谛上是甚么。还委悉么。阿斯咤。咄
  ref: X80n1565_p0767a07（五灯会元）
