id: 归宗智常禅师
name: 归宗智常
school: 南岳系
teacher: 马祖一
bio: 马祖道一禅师法嗣，住庐山归宗寺。以「归宗斩蛇」「归宗磨镜」等峻烈公案著称。
sayings:
- text: 师（归宗）铲草次，有僧问：「学人久处暗室，今日忽然顶门迸裂，请师印证。」师以锄斫之曰：「唤什么作暗室！」
  ref: 五灯会元·卷三·归宗智常禅师
- text: 师尝与南泉、麻谷同游参礼，磨镜示徒，机用超绝。
  ref: 五灯会元·卷三·归宗智常禅师
