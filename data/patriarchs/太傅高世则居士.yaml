bio: 字仲贻。号无功。初参芙蓉。求指心要。蓉令去其所重。扣己而参。一日忽造微密。呈偈曰。悬崖撒手任纵横。大地虗空自坦平。照壑辉岩不借月。庵头别有一帘明
