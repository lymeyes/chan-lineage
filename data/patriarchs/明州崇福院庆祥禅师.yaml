id: 明州崇福院庆祥禅师
name: 明州崇福院庆祥
school: 法眼宗
teacher: 永明潜
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0379b10。
sayings:
- text: 上堂。诸禅德。见性周遍。闻性亦然。洞彻十方。无内无外。所以古人道。随缘无作。动寂常真。如此施为。全真智用
  ref: X80n1565_p0379b10（五灯会元）
- text: 僧问。如何是本来人。师曰。堂堂六尺甚分明。曰。祇如本来人。还依如此相貌也无。师曰。汝唤甚么作本来人。曰。乞师方便。师曰。教谁方便
  ref: X80n1565_p0379b10（五灯会元）
