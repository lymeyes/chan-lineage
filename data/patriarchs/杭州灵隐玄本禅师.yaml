id: 杭州灵隐玄本禅师
name: 杭州灵隐玄本
school: 法眼宗
teacher: 支提隆禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0382b07。
sayings:
- text: 僧问。蚌含未剖时如何。师曰。光从何来
  ref: X80n1565_p0382b07（五灯会元）
- text: 问。临济入门便喝。德山入门便棒。此意如何。师曰。天晴不肯去。师见僧看经。乃
  ref: X80n1565_p0382b07（五灯会元）
- text: 问。看甚么经。僧无语。乃示颂曰。看经不识经。徒劳损眼睛。欲得不损眼。分明识取经
  ref: X80n1565_p0382b07（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0382b07），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
