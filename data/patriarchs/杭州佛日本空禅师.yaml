id: 杭州佛日本空禅师
name: 杭州佛日本空
school: 曹洞宗
teacher: 云居道膺禅师
status: draft
bio: 初游天台山。尝曰。如有人夺得我机者。即吾师矣。寻谒云居。作礼问曰。二龙争珠。谁是得者。居曰。卸却业身来。与子相见。师曰。业身已卸。居曰。珠在甚么处。师无对同安代云。回头即没交涉。遂投诚入室。时始年十三。后四年。参夹山。才入门。见维那。那曰。此间不著后生。师曰。某甲不求挂搭。暂来礼谒和尚。维那白夹山。山许相见。师未升堦。山便
sayings:
- text: 问。甚处来。师曰。云居来。曰。即今在甚么处。师曰。在夹山顶𩕳上。山曰。老僧行年在坎。五鬼临身。师拟上堦。山曰。三道宝堦。从何而上。师曰。三道宝堦。曲为今时。向上一路。请师直指。山便揖。师乃上堦礼拜。山
  ref: X80n1565_p0499b13（五灯会元）
- text: 问。阇黎与甚么人同行。师曰。木上座。山曰。何不来相看老僧。师曰。和尚看他有分。山曰。在甚处。师曰。在堂中。山便同师下到堂中。师遂取拄杖掷在山面前。山曰。莫从天台得否。师曰。非五岳之所生。山曰。莫从须弥得否。师曰。月宫亦不逢。山曰。恁么则从人得也。师曰。自己尚是冤家。从人得堪作甚么。山曰。冷灰里有一粒豆𪹼。乃唤维那。明窗下安排著。师曰。未审明窗还解语也无。山曰。待明窗解语。即向汝道。夹山来日
  ref: X80n1565_p0499b13（五灯会元）
- text: 上堂。问。昨日新到在甚么处。师出应喏。山曰。子未到云居已前。在甚么处。师曰。天台国清。山曰。吾闻天台有潺潺之瀑。渌渌之波。谢子远来。此意如何。师曰。久居岩谷。不挂松萝。山曰。此犹是春意。秋意作么生。师良久。山曰。看君祇是撑船汉。终归不是弄潮人。来日普请。维那令师送茶。师曰。某甲为佛法来。不为送茶来。那曰。奉和尚处分。师曰。和尚尊命即得。乃将茶去作务处。摇茶瓯作声。山回顾。师曰。酽茶三五碗。意在镢头边。山曰。瓶有倾茶势。篮中几个瓯。师曰。瓶有倾茶势。篮中无一瓯。便行茶。时众皆举目。师曰。大众鹤望。请师一言。山曰。路逢死蛇莫打杀。无底篮子盛将归。师曰。手执夜明符。几个知天晓。山曰。大众有人也。归去来。归去来。遂住普请。归院众皆仰叹。师终于佛日。卵塔存焉
  ref: X80n1565_p0499b13（五灯会元）
