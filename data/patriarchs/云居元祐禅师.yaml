id: 云居元祐禅师
name: 云居元祐
alias: 云居祐
school: —
teacher: —
status: draft
bio: 姓王氏信州上饶人。年十三师事博山承天沙门齐晟。二十四得度具戒。时南禅师在黄蘗。即往依之十余年。南殁去游湘中。庐于衡岳马祖故基。衲子追随声重荆楚间。谢师直守潭州欲禅道林尽礼致师为第一世。师欣然肯来。道林峰房蚁穴间见峰峦层出。像设之多冠于湘西。师夷廓之为虚堂为禅室。以会四海之学者。役夫不敢坏像设。师自锄弃诸江曰。昔本不成今安得坏。吾法尚无凡情。况存圣解乎。六年而殿阁崇成。弃之去游庐山。南康太守陆公畤请住玉磵寺。徐王闻其名奏赐紫方袍。师作偈辞之曰。为僧六十鬓先华。无补空门愧出家。愿乞封回礼部牒。免辜卢老衲袈裟。人问其故。师曰。人主之恩而王公之施。非敢辞以近名也。但以法本等耳。昔惠满不受宿请云。天下无僧乃受汝供。满何人哉。王安上者荆公之弟问法于师。以云居延之。师欣然应之曰。当携此骨归葬峰顶耳。登舆而去。师初开堂。问答罢乃曰。新启法筵人天会集。稀逢难遇正在此时。还更有乘时适变底衲僧么。出来与汝证据。良久曰。不出头者是好手。虽然如是道林今日已向平地上吃交了也。赖遇金粟大士有不二法门放一线道。道林方解开布袋头。足可以施展家风。向无佛处称尊。便乃指点三界目视四维。偃仰尧天高歌舜日。举音王调唱菩萨蛮。奏没弦琴含太古意。当是时文殊休惆怅。普贤谩沈吟。任是千圣出头来异口同音。也不消一札。久立珍重
sayings:
- text: 上堂。月色和云白。松声带露寒。好个真消息。凭君仔细看。黄龙先师和身放倒。还有人扶得起么。祖祢不了殃及儿孙。击禅床下座。又
  ref: T51n2077_p0574b13（续传灯录）
- text: 示众曰。一切声是佛声。以拂子击禅床曰。梵音深远令人乐闻。又曰。一切色是佛色。乃拈起拂子曰。今佛放光明助发实相义。已到之者顶载奉行。未到之者应如是知如是信。击禅床下座。师于壬申年七月七日夜子时方丈敷坐。谓大众曰。三处住持不传一法。火风聚散物理常情。吾灭后不得随世俗厚葬缞绖哭泣。当禀我佛西天竺法火化归塔。遂说偈曰。今年六十六。三处因缘足。夜半火烧山。跳入火中浴。言毕示寂。阇维得五色舍利。塔建于云居山。师清癯发白不剪。风度英特。说法好讥呵诸方。雅自称王祐上坐云
  ref: T51n2077_p0574b13（续传灯录）
