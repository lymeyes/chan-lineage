id: L::明州天童清简禅师
name: 明州天童清简
school: 法眼宗
teacher: 归宗柔
status: draft
bio: 钱塘张氏子。师为事孤洁。时谓之简浙客
sayings:
- text: 僧问。如何是祖师西来意。师曰。不欲向汝道。曰。请和尚道。师曰。达磨不可再来也。师晚居雪窦而终。塔于寺之东南隅
  ref: X80n1565_p0378b02（五灯会元）
