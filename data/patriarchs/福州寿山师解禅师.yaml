id: 福州寿山师解禅师
name: 福州寿山师解
school: 南岳系
teacher: 长庆大安禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0154b09。
sayings:
- text: 问。阇黎生缘何处。师曰。和尚若实
  ref: X80n1565_p0154b09（五灯会元）
- text: 问。某甲即是闽中人也。曰。汝父名甚么。师曰。今日蒙和尚致此一
  ref: X80n1565_p0154b09（五灯会元）
- text: 问。直得忘前失后。住后
  ref: X80n1565_p0154b09（五灯会元）
- text: 上堂。诸上座幸有真实言语相劝。诸兄弟合各自体悉。凡圣情尽。体露真常。但一时卸却从前虗妄。攀缘尘垢。心如虗空相似。他时后日。合识得些子好恶。闽帅
  ref: X80n1565_p0154b09（五灯会元）
- text: 问。寿山年多少。师曰。与虗空齐年。曰。虗空年多少。师曰。与寿山齐年
  ref: X80n1565_p0154b09（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0154b09），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
