bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0464b15。
sayings:
- text: 上堂。酒市鱼行。头头宝所。鸦鸣鹊噪。一一妙音。卓拄杖曰。且道这个是何佛事。狼籍不少
  ref: X80n1565_p0464b15（五灯会元）
- text: 上堂。香山有个话头。弥满四大神洲。若以佛法批判。还如认马作牛。诸人既不作佛法批判。毕竟是甚么道理。击拂子．无鑐鏁子。不厌动摇。半夜枕头。要须摸著。下座
  ref: X80n1565_p0464b15（五灯会元）
