id: L::渌清禅师
name: 渌清
school: 青原系
teacher: 道吾智
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0184b12。
sayings:
- text: 僧问。不落道吾机。请师道。师曰。庭前红苋树。生叶不生华。僧良久。师曰。会么。曰。不会。师曰。正是道吾机。因甚么不会。僧礼拜。师打曰。须是老僧打你始得
  ref: X80n1565_p0184b12（五灯会元）
- text: 问。如何是无相。师曰。山青水绿。僧参。师以目视之。僧曰。是个机关。于某甲分上用不著。师弹指三下。僧绕禅床一匝。依位立。师曰。参堂去。僧始出。师便喝。僧却以目视之。师曰。灼然用不著。僧礼拜
  ref: X80n1565_p0184b12（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0184b12），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
