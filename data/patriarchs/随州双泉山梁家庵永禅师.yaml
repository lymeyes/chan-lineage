bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0269a04。
sayings:
- text: 僧问。达磨九年面壁。意旨如何。师曰。睡不著。师问护国长老。随阳一境。是男是女。各伸一
  ref: X80n1565_p0269a04（五灯会元）
- text: 问。问问各别。长老将何祇对。国以手空中画一圆相。师曰。谢长老慈悲。国曰。不敢。师低头不顾
  ref: X80n1565_p0269a04（五灯会元）
- text: 问。如何得顿息诸缘去。师曰。雪上更加霜
  ref: X80n1565_p0269a04（五灯会元）
