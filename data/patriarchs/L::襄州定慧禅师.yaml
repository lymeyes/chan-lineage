bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0295b06。
sayings:
- text: 僧问。如何是佛向上事。师曰。无人不惊。曰。学人未委在。师曰。不妨难向
  ref: X80n1565_p0295b06（五灯会元）
- text: 问。不借时机用。如何话祖宗。师曰。阇黎还具惭愧么。僧便喝。师休去
  ref: X80n1565_p0295b06（五灯会元）
