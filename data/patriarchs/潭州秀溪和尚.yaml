bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0117b11。
sayings:
- text: 问。声色纯真。如何是道。师曰。乱道作么。山却从东过西立。师曰。若不恁么。即祸事也。山又从西过东立。师乃下禅床。方行两步。被谷山捉住。曰。声色纯真。事作么生。师便打一掌。山曰。三十年后。要个人下茶也无在。师曰。要谷山这汉作甚么。山呵呵大笑
  ref: X80n1565_p0117b11（五灯会元）
