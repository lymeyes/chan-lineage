id: 大洪报恩禅师
name: 大洪报恩
alias: 大洪恩
school: 法眼宗
teacher: 投子青禅师
status: draft
bio: 卫之黎阳刘氏子。世皆硕儒。师未冠举方略擢上第。后厌尘境请于朝乞谢簪绂为僧。上从其请。遂游心祖道至投子。未久即悟心要。子曰。汝再来人也。宜自护持。辞谒诸名宿皆蒙印可。丞相韩公缜请开法于西京少林。未几大洪革律为禅诏师居之
sayings:
- text: 上堂。五五二十五。案山雷主山雨。明眼衲僧莫教错举
  ref: T51n2077_p0524a26（续传灯录）
- text: 僧问。九鼎澄波即不
  ref: T51n2077_p0524a26（续传灯录）
- text: 问。为祥为瑞事如何。师曰。古今不坠。曰这个且拈放一边。向上还有事也无。师曰。太无厌生。曰作家宗师。师曰。也不消得
  ref: T51n2077_p0524a26（续传灯录）
- text: 上堂。如斯话会谁是知音。直饶向一句下千眼顿开。端的有几个是迷逢达磨。诸人要识达磨祖师么。乃举手作捏势曰达磨鼻孔在少林手里。若放开去也。从教此土西天说黄道黑欺胡谩汉。若不放过不消一捏。有人要与祖师作主。便请出来与少林相见。还有么。良久曰。果然
  ref: T51n2077_p0524a26（续传灯录）
- text: 上堂拈起拄杖曰。昔日德山临济信手拈来。便能坐断十方壁立千仞。直得冰河焰起枯木花芳。诸人若也善能横担竖夯遍问诸方。苟或不然少林倒行此令去也。击禅床一下
  ref: T51n2077_p0524a26（续传灯录）
- text: 僧问。一箭一群即不
  ref: T51n2077_p0524a26（续传灯录）
- text: 问。一箭一个事如何。师曰。中也。曰还端的也无。师曰。同声相应同气相求。曰恁么则石巩犹在。师曰。非但一个两个。曰好事不如无。师曰。穿却了也。问三玄三要即不
  ref: T51n2077_p0524a26（续传灯录）
- text: 问。五位君臣事若何。师曰。非公境界。曰恁么则石人拊掌木女呵呵。师曰。杓卜听虚声。熟睡饶谵语。曰若不上来伸此
  ref: T51n2077_p0524a26（续传灯录）
- text: 问。焉能得见少林机。师曰。放过则不可。随后便打
  ref: T51n2077_p0524a26（续传灯录）
- text: 上堂横按拄杖曰。便与么休去已落二三。更若忉忉终成异见。既到这里。又不可弓折箭尽去也。且衲僧家远则能照近则能明。乃拈起拄杖曰。穿却德山鼻孔。换却临济眼睛。掀翻大海拨转虚空。且道三千里外谁是知音。于斯明得大似杲日照天。苟或未明不免云腾致雨。卓一下。问祖师西来九年面壁。最后一句请
  ref: T51n2077_p0524a26（续传灯录）
- text: 师举唱。师曰。面黑眼睛白。师尝设百问以问学者。其略曰。假使百千劫所作业不忘。为甚么一称南无佛罪灭河沙劫。又作此○相曰。森罗万象总在其中。具眼禅人试请甄别
  ref: T51n2077_p0524a26（续传灯录）
- text: 上堂拈拄杖曰。看看大地雪漫漫。春来特地寒。灵峰与少室。料掉不相干。休论佛意祖意。谩谓言端语端。铁牛无踪迹。明月芦花君自看。卓拄杖下座。师素与无尽居士张公商英友善。无尽尝以书问三教大要曰。清凉疏第三卷。西域邪见不出四见。此方儒道亦不出此四见。如庄老计自然为因能生万物。即是邪曰。易曰。太极生两仪。太极为因亦是邪因。若谓一阴一阳之谓道。能生万物亦是邪因。若计一为虚无则是无因。今疑老子自然与西天外道自然不同。何以言之。老子曰。常无欲以观其妙。常有欲以观其徼。无欲则常有。徼则已入其道矣。谓之邪因。岂有说乎。易曰。一阴一阳之谓道。阴阳不测之谓神。神也者妙万物而为言。寂然不动感而遂通天下之故。今乃破阴阳变易之道为邪因。拨去不测之神。岂有说乎。望纸后批示。以断疑网故也。师答曰。西域外道宗多途。要其会归不出有无四见而已。谓有见无见亦有亦无见非有非无见也。盖不即一心为道则道非我有。故名外道。不即诸法是心则法随见异。故名邪见。如谓之有有则有无。如谓之无无则无有。有无则有见竞生。无有则无见斯起。若亦有亦无见非有非无见亦犹是也。夫不能离诸见则无以明自心。无以明自心则不知正道矣。故经云。言词所说法。小智妄分别。不能了自心。云何知正道。又曰。有见即为垢。此则未为见。远离于诸见。如是乃见佛。以此论之。邪正异途正由见悟殊致故也。故清凉以庄老计道法自然能生万物。易谓。太极生两仪。一阴一阳之谓道。以自然太极为因。一阴一阳为道。能生万物则是邪因。计一为虚无则是无因。尝试论之。夫三界唯心万缘一致。心生故法生。心灭故法灭。推而广之弥纶万有而非有。统而会之究竟寂灭而非无。非无亦非非无。非有亦非非有。四执既亡百非斯遣。则自然因缘皆为戏论。虚无真实俱是假名矣。至若谓太极阴阳能生万物。常无常有斯为众妙之门。阴阳不测是谓无方之神。虽圣人设教示悟多方。然既异一心宁非四见。何以明之。盖虚无为道道则是无。若自然若太极若一阴一阳为道。道则是有常。无常有则是亦无亦有。阴阳不测则是非有非无。先儒或谓妙万物谓之神则非物物。物则亦是无。故西天诸大论师皆以心外有法为外道。万法唯心为正宗。盖以心为宗则诸见自亡。言虽或异未足以为异也。心外有法则诸见竞生。言虽或同未足以为同也。虽然儒道圣人固非不知之。乃存而不论耳。良以未即明指一心为万法之宗。虽或言之犹不论也。如西天外道皆大权菩萨示化之所施。为横生诸见曲尽异端以明佛法。是为正道。此其所以为圣人之道顺逆皆宗。非思议之所能知矣。故古人有言。缘昔真宗未至。孔子且以系心。今知理有所归。不应犹执权教。然知权之为权未必知权也。知权之为实斯知权矣。是亦周孔老庄设教立言之本意。一大事因缘之所成始所成终也。然则三教一心同途异辙。究竟道宗本无言说。非维摩大士孰能知此意也
  ref: T51n2077_p0524a26（续传灯录）
