id: 洪州泐潭惟建禅师
name: 洪州泐潭惟建
school: 南岳系
teacher: 马祖一
status: draft
bio: 一日在法堂后坐禅。马祖见。乃吹师耳。两吹师起。见是祖。却复入定。祖归方丈。令侍者持一椀茶与师。师不顾。便自归堂
