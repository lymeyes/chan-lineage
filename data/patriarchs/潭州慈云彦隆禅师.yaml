bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0686a11。
sayings:
- text: 示众曰。尽大地都来是一颗明珠。时有
  ref: X80n1565_p0686a11（五灯会元）
- text: 僧问。既是一颗明珠。学人为甚不识。沙曰。全体是珠。更教谁识。曰。虽然全体是。争奈学人不识。沙曰。问取你眼。师曰。诸禅德。这个公案。唤作嚼饭𫗪小儿。把手更与杖。还会么。若未会。须是扣己而参。直要真实。不得信口掠虗。徒自虗生浪死
  ref: X80n1565_p0686a11（五灯会元）
