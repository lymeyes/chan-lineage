sayings:
- text: 示众。举。巴陵和尚道。不是风动。不是幡动。不是风幡。又向甚么处著。有人为祖师出气。出来与巴陵相见。雪窦和尚道。风动幡动。既是风幡。又向甚么处著。有人为巴陵出气。出来与雪窦相见。师曰。非风非幡无处著。是幡是风无著处。辽天俊鹘悉迷踪。踞地金毛还失措。阿呵呵。悟不悟。令人转忆谢三郎。一丝独钓寒江雨
  ref: X80n1565_p0700a02（五灯会元）
