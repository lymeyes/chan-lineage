id: 洞山道全禅师
name: 洞山道全
school: 曹洞宗
teacher: 洞山价
status: draft
bio: 问先洞山。如何是出离之要。山曰。阇黎足下烟生。师当下契悟。更不他游。云居进语曰。终不敢孤负和尚足下烟生。山曰。步步玄者。即是功到。暨洞山圆寂。众请踵迹住持
sayings:
- text: 僧问。佛入王宫。岂不是大圣再来。师曰。护明不下生。曰。争奈六年苦行何。师曰。幻人呈幻事。曰。非幻者如何。师曰。王宫觅不得
  ref: X80n1565_p0490a08（五灯会元）
- text: 问。清净行者不入涅槃。破戒比丘不入地狱时如何。师曰。度尽无遗影。还他越涅槃
  ref: X80n1565_p0490a08（五灯会元）
- text: 问。极目千里。是甚么风范。师曰。是阇黎风范。曰。未审和尚风范如何。师曰。不布婆娑眼
  ref: X80n1565_p0490a08（五灯会元）
