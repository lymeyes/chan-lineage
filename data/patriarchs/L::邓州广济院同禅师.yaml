bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0583b10。
sayings:
- text: 僧问。万缘息尽时如何。师曰。三脚虾蟆飞上天
  ref: X80n1565_p0583b10（五灯会元）
- text: 问。如何是透法身句。师曰。华岳三峰小。曰。此意如何。师曰。黄河辊底流
  ref: X80n1565_p0583b10（五灯会元）
