id: 洪州大宁道宽禅师
name: 洪州大宁道宽
school: —
teacher: 石霜圆
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0442b08。
sayings:
- text: 僧问。饮光正见。为甚么见拈花却微笑。师曰。忍俊不禁
  ref: X80n1565_p0442b08（五灯会元）
- text: 问。丹霞烧木佛。院主为甚么眉须堕落。师曰。贼不打贫儿家
  ref: X80n1565_p0442b08（五灯会元）
- text: 问。既是一真法界。为甚么却有千差万别。师曰。根深叶茂。僧打圆相曰。还出得这个也无。师曰。弄巧成拙
  ref: X80n1565_p0442b08（五灯会元）
- text: 问。如何是前三三。后三三。师曰。数九不到九
  ref: X80n1565_p0442b08（五灯会元）
- text: 问。如何是佛法大意。师曰。点茶须是百沸汤。曰。意旨如何。师曰。吃尽莫留滓。有僧造师之室
  ref: X80n1565_p0442b08（五灯会元）
- text: 问。如何是露地白牛。师以火箸插火炉中。曰。会么。曰。不会。师曰。头不欠。尾不剩。师在同安日。时有
  ref: X80n1565_p0442b08（五灯会元）
- text: 僧问。既是同安。为甚么却有病僧化去。师曰。布施不如还却债
  ref: X80n1565_p0442b08（五灯会元）
- text: 上堂。少林妙诀。古佛家风。应用随机。卷舒自在。如拳作掌。开合有时。似水成沤。起灭无定。动静俱显。语默全彰。万用自然。不劳心力。到这里唤作顺水放船。且道逆风举棹。谁是好手。良久曰。弄潮须是弄潮人。喝一喝曰。珍重
  ref: X80n1565_p0442b08（五灯会元）
- text: 上堂。无念为宗。无住为本。真空为体。妙有为用。所以道。尽大地是真空。遍法界是妙有。且道是甚么人用得。四时运用。日月长明。法本不迁。道无方所。随缘自在。逐物升沈。此土他方。入凡入圣。虽然如是。且道入乡随俗一句作么生道。良久曰。西天梵语。此土唐言
  ref: X80n1565_p0442b08（五灯会元）
