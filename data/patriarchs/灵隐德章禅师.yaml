id: 灵隐德章禅师
name: 灵隐德章
school: —
teacher: 石霜圆
status: draft
bio: 初住大相国寺西经藏院。庆历八年九月一日。仁宗皇帝诏师于延春阁下斋。宣普照大师
sayings:
- text: 问。如何是当机一句。师曰。一言迥出青霄外。万仞峰前崄处行。曰。作么生是崄处行。师便喝。曰。皇帝面前。何得如此。师曰。也不得放过。明年又宣入内斋。复宣普照
  ref: X80n1565_p0445b10（五灯会元）
- text: 问。如何是夺人不夺境。师曰。雷惊细草萌芽发。高山进步莫迟迟。曰。如何是夺境不夺人。师曰。戴角披毛异。来往任纵横。曰。如何是人境两俱夺。师曰。出门天外迥。流光影不真。曰。如何是人境俱不夺。师曰。寒林无宿客。大海听龙吟。后再宣入化成殿斋。宣守贤
  ref: X80n1565_p0445b10（五灯会元）
- text: 问。斋筵大启。如何报答圣君。师曰。空中求鸟迹。曰。意旨如何。师曰。水内觅鱼踪。师进心珠歌曰。心如意。心如意。任运随缘不相离。但知莫向外边求。外边求。终不是。枉用工夫隐真理。识心珠。光耀日。秘藏深密无形质。拈来掌内众人惊。二乘精进争能测。碧眼胡须指出。临机妙用何曾失。寻常切忌与人看。大地山河动岌岌。师皇祐二年乞归山林养老。御批杭州灵隐寺住持。赐号明觉
  ref: X80n1565_p0445b10（五灯会元）
