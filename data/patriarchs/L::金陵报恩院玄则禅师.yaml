id: L::金陵报恩院玄则禅师
name: 金陵报恩院玄则
school: 法眼宗
teacher: 清凉益
status: draft
bio: 滑州卫南人也。初问青峰。如何是学人自己。峰曰。丙丁童子来求火。后谒法眼。眼
sayings:
- text: 问。甚处来。师曰。青峰。眼曰。青峰有何言句
  ref: X80n1565_p0361b01（五灯会元）
- text: 师举前话。眼曰。上座作么生会。师曰。丙丁属火而更求火。如将自己求自己。眼曰。与么会又争得。师曰。某甲祇与么。未审和尚如何。眼曰。你问我。我与你道
  ref: X80n1565_p0361b01（五灯会元）
- text: 师问。如何是学人自己。眼曰。丙丁童子来求火。师于言下顿悟。开堂日。李王与法眼俱在会
  ref: X80n1565_p0361b01（五灯会元）
- text: 僧问。龙吟雾起。虎啸风生。学人知是出世边事。到此为甚么不会。师曰。会取好。僧举头看师。又看法眼。乃抽身入众。法眼与李王当时失色。眼归方丈。令侍者唤问话僧至。眼曰。上座适来问底话。许你具眼。人天众前。何不礼拜葢覆却。眼摵一坐具。其僧三日后吐光而终
  ref: X80n1565_p0361b01（五灯会元）
- text: 僧问。了了见佛性。如何是佛性。师曰。不欲便道
  ref: X80n1565_p0361b01（五灯会元）
- text: 问。如何是金刚大士。师曰。见也未
  ref: X80n1565_p0361b01（五灯会元）
- text: 问。如何是诸圣密密处。师曰。却须会取自己。曰。如何是和尚密密处。师曰。待汝会始得
  ref: X80n1565_p0361b01（五灯会元）
- text: 上堂。诸上座。尽有常圆之月。各怀无价之珍。所以月在云中。虽明而不照。智隐惑内。虽真而不通。无事久立
  ref: X80n1565_p0361b01（五灯会元）
- text: 问。如何是不动尊。师曰。飞飞飏飏
  ref: X80n1565_p0361b01（五灯会元）
- text: 问。如何是了然一句。师曰。对汝又何难。曰。恁么道莫便是也无。师曰。不对又何难。曰。深领和尚恁么道。师曰。汝道我道甚么
  ref: X80n1565_p0361b01（五灯会元）
- text: 问。亡僧迁化向甚么处去也。师曰。待汝生即道。曰。宾主历然。师曰。汝立地见亡僧
  ref: X80n1565_p0361b01（五灯会元）
- text: 问。如何是学人本来心。师曰。汝还曾道著也未。曰。祇如道著。如何体会。师曰。待汝问始得
  ref: X80n1565_p0361b01（五灯会元）
- text: 问。教中道。树能生果。作玻瓈色。未审此果何人得吃。师曰。树从何来。曰。学人有分。师曰。去果八万四千
  ref: X80n1565_p0361b01（五灯会元）
- text: 问。如何是不迁义。师曰。江河竞注。日月旋流
  ref: X80n1565_p0361b01（五灯会元）
- text: 问。宗乘中玄要处。请师一言。师曰。汝行脚来多少时也。曰。不曾逢伴侣。师曰。少瞌睡
  ref: X80n1565_p0361b01（五灯会元）
