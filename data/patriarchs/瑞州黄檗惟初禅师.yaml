sayings:
- text: 上堂。我见宗大哥。平生槁默危坐。所谓朽木形骸。未尝口角𫍢𫍢。将佛祖言教以当门庭。祇要当人歇得十成。自然不向这壳漏子上著倒。有
  ref: X80n1565_p0648a18（五灯会元）
- text: 僧问。既不向这壳漏子上著倒。未审如何保任。师曰。无你用心处。曰。和尚岂无方便。师曰。𨫼饼既无汁。压沙那有油
  ref: X80n1565_p0648a18（五灯会元）
