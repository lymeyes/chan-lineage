id: L::杭州瑞龙院幼璋禅师
name: 杭州瑞龙院幼璋
school: 曹洞宗
teacher: 白水仁
status: draft
bio: 唐相国夏侯孜之犹子也。大中初。伯父司空出镇广陵。师方七岁。游慧照寺。闻诵法华。志求出家。伯父初不允。因师绝饮食。不得已而许之。师慧远禅师。后游诸禅会。薯山白水。咸受心诀。咸通十三年至江陵。腾腾和尚嘱之曰。汝往天台寻静而栖。遇安即止。已而又值憨憨和尚抚而记曰。汝却后四十年。有巾子山下菩萨。王于江南。当此时吾道昌矣。寻抵天台山。于静安乡创福唐院。乃契腾腾之言。又住隐龙院。中和四年。浙东饥疫。师于温台明三郡收瘗遗骸。时谓悲增大士。雪峰尝往见之。遗棕榈拂子而去。天祐三年。钱尚父遣使童建赍衣服香药。入山致请。至府庭。署志德大师。馆于功臣堂。日亲问法。师请每年于天台山建金光明道场。诸郡黑白大会。逾月而散光明大会始于师也。将辞归山。王加恋慕。于府城建瑞龙院文穆王改为宝山院。延请开法。时禅门兴盛。斯则憨憨悬记应矣
sayings:
- text: 上堂。老僧顷年游历江外．岭南．荆湖。但有知识丛林。无不参问来。盖为今日与诸人聚会。各要知个去处。然诸方终无异说。祇教当人歇却狂心。休从他觅。但随方任真。亦无真可任。随时受用。亦无时可用。设垂慈苦口。且不可呼昼作夜。更饶善巧。终不能指东为西。脱或能尔。自是神通作怪。非干我事。若是学语之流。不自省己知非。直欲向空里采花。波中取月。还著得心力么。汝今各且退思。忽然肯去。始知瑞龙老汉事不获已。迂回太甚。还肯么。时有
  ref: X80n1565_p0508b16（五灯会元）
- text: 僧问。如何是瑞龙境。师曰。道汝不见得么。曰。如何是境中人。师曰。后生可畏
  ref: X80n1565_p0508b16（五灯会元）
- text: 问。廓然无云。如何是中秋月。师曰。最好是无云。曰。恁么则一轮高挂。万国同观去也。师曰。捏目之子难与言。天成二年丁亥四月。乞坟塔于尚父。父命陆仁璋于西关选胜地。建塔创院。改天台隐龙为隐迹。塔毕。师入府庭辞尚父。嘱以护法。克期顺寂。尚父悲悼。遣僧正集在城宿德。迎引入塔
  ref: X80n1565_p0508b16（五灯会元）
