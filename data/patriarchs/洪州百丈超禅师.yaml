bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0505b03。
sayings:
- text: 僧问。祖意教意。是同是别。师曰。金鸡玉兔。听绕须弥
  ref: X80n1565_p0505b03（五灯会元）
- text: 问。日落西山去。林中事若何。师曰。洞深云出晚。㵎曲水流迟
  ref: X80n1565_p0505b03（五灯会元）
- text: 问。某甲今日辞去。或有人问和尚说甚么法。向他道甚么。师曰。但道大雄山顶上。虎生师子儿
  ref: X80n1565_p0505b03（五灯会元）
