bio: 生平部分原文未载，仅存机缘语（见下）；据《续传灯录》T51n2077_p0489c17。
sayings:
- text: 僧问。一花开五叶结果自然成时如何。师曰。脱却笼头卸却角驮。曰拶出虚空去。处处尽闻香。师曰。云愁闻鬼哭。雪压髑髅吟。问和尚未见谷隐时一句作么生道。师曰。步步登山远。曰见后如何。师曰。驱驱信马蹄
  ref: T51n2077_p0489c17（续传灯录）
