bio: 九首赵州衫赵州衫赵州老，对面人难晓。一归何处，青州布袄，金银瑠璃，砗磲玛瑙。灵云桃华灵云桃华春风二月半，桃华红烂熳。灵云到处逢，衲僧著眼看。看，看！短棹孤舟，谁居彼岸？仰山推枕子仰山推枕子田中插锹，床上推枕。千手千眼，不审不审。百丈再参马祖百丈再参马祖风云会合又相期，觌面难明第一机，霹雳一声天地迥，西河师子却生儿。柏树柏树庭前柏树子，不是祖师心。莫执一时见，便忘千古音。云门放洞山三顿棒二云门放洞山三顿棒二汗马功劳要立身，将军一等扫边尘。全身只待英雄士，不遇英雄愁杀人。查渡湖南涉路歧，云门不惜两茎眉，万古碧潭空界月，再三捞摝始应知。有句无句有句无句仰之弥高，钻之弥固。昭昭明明，如藤倚树。大笑呵呵跨白牛，碧云缭绕无寻处。斩猫斩猫当日临崖看浒眼，至今观水忆南泉。赵州头戴艸鞋去，渔翁腰带好牵船
