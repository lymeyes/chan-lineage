bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0510b16。
sayings:
- text: 僧问。学人解问誵讹句。请
  ref: X80n1565_p0510b16（五灯会元）
- text: 师举起讶人机。师曰。巢父不牵牛。许由不洗耳
  ref: X80n1565_p0510b16（五灯会元）
- text: 问。具足底人来。师还接否。师便打
  ref: X80n1565_p0510b16（五灯会元）
