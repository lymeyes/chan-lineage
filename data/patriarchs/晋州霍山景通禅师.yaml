id: 晋州霍山景通禅师
name: 晋州霍山景通
school: 沩仰宗
teacher: 仰山寂
status: draft
bio: 初参仰山。山闭目坐。师乃翘起右足曰。如是。如是。西天二十八祖亦如是。中华六祖亦如是。景通亦如是。仰山起来。打四藤条。师因此自称。集云峰下四藤条天下大禅师归宗下。亦名大禅佛有智通。住后。有行者
sayings:
- text: 问。如何是佛法大意。师乃礼拜。者曰。和尚为甚么礼俗人。师曰。汝不见道尊重弟子。师问僧。甚么处来。僧提起坐具。师曰。龙头蛇尾
  ref: X80n1565_p0330b16（五灯会元）
- text: 问。如何是佛。师便打。僧亦打。师曰。汝打我有道理。我打汝无道理。僧无语。师又打趁出。师化缘将毕。先备薪于郊野。遍辞檀信。食讫至薪所。谓弟子曰。日午当来报。至日午。师自执炬登积薪上。以笠置顶后。作圆光相。手执拄杖。作降魔杵势。立终于红焰中
  ref: X80n1565_p0330b16（五灯会元）
