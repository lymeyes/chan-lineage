id: 妙胜臻禅师
name: 妙胜臻
school: 云门宗
teacher: 云门文偃禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0567b13。
sayings:
- text: 僧问。金粟如来为甚么却降释迦会里。师曰。香山南。雪山北。曰。南赡部洲事又作么生。师曰。黄河水急浪花麤
  ref: X80n1565_p0567b13（五灯会元）
- text: 问。如何是向上一路。师曰。一条济水贯新罗
  ref: X80n1565_p0567b13（五灯会元）
