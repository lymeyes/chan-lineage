id: L::安州大安山省禅师
name: 安州大安山省
school: —
teacher: 疏山仁
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0505a13。
sayings:
- text: 僧问。失路迷人。请师直指。师曰。三门前去
  ref: X80n1565_p0505a13（五灯会元）
- text: 问。举步临危。请师指月。师曰。不指月。曰。为甚么不指月。师曰。临坑不推人
  ref: X80n1565_p0505a13（五灯会元）
- text: 问。离四句。绝百非。请和尚道。师曰。我王库内无如是刀
  ref: X80n1565_p0505a13（五灯会元）
- text: 问。重重关锁。信息不通时如何。师曰。争得到这里。曰。到后如何。师曰。彼中事作么生
  ref: X80n1565_p0505a13（五灯会元）
- text: 问。如何是真中真。师曰。十字路头泥佛子
  ref: X80n1565_p0505a13（五灯会元）
- text: 问。无为无事人。犹是金锁难。金锁牵不住。是甚么人。师曰。向阇黎道即得。不可荒却大安山去也
  ref: X80n1565_p0505a13（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0505a13），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
