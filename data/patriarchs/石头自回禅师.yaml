id: 石头自回禅师
name: 石头自回
alias: 石头回
school: 杨岐派
teacher: 大随元静禅师
status: draft
bio: 本郡人也。世为石工。虽不识字志慕空宗。每求人口授法华能诵之。弃家投大随供扫洒。寺中令取崖石。师手不释锤凿。而诵经不辍口。随见而语曰。今日硿磕明日硿磕。死生到来作甚折合。师愕然释其器设礼。愿闻究竟法。因随至方丈。令且罢诵经看赵州勘婆因缘。师念念不去心。久之因凿石石稍坚。尽力一锤瞥见火光忽然省彻。走至方丈礼拜呈颂曰。用尽工夫。浑无巴鼻。火光迸散。元在这里。随忻然曰。子彻也。复献赵州勘婆颂曰。三军不动旗闪烁。老婆正是魔王脚。赵州无柄铁扫帚。扫荡烟尘空索索。随可之。遂授以僧服。人以其为石工故有回石头之称也
sayings:
- text: 上堂。参禅学道。大似井底叫渴相似。殊不知塞耳塞眼回避不及。且如十二时中行住坐卧动转施为。是甚么人使依。眼见耳闻何处不是路头。若识得路头。便是大解脱路。方知老汉与尔证明。山河大地与尔证明。所以道。十方薄伽梵一路涅槃门。诸仁者。大凡有一物当途要见一物之根源。一物无处要见一物之根源。见得根源源无所源。所源既非何处不圆。诸禅德尔看老汉有甚么胜尔处。诸人有甚么不如老汉处。还会么。太湖三万六千顷。月在波心说向谁
