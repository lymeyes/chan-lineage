id: L::瑞州黄檗志因禅师
name: 瑞州黄檗志因
school: 云门宗
teacher: 智海逸
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0625b10。
sayings:
- text: 僧问。如何是得力句。师曰。脚。曰。学人不会。师曰。一步进一步
  ref: X80n1565_p0625b10（五灯会元）
- text: 上堂。四十九年说。恩润禽鱼。十万途程来。警悟人天。这二老汉。各人好与三十棒。何故。一个说长说短。一个胡言汉语。虽然如是。且放过一著
  ref: X80n1565_p0625b10（五灯会元）
