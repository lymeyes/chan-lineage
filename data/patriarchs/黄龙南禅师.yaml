id: 黄龙南禅师
name: 黄龙慧南
honorific: 黄龙慧南禅师 · 普觉禅师（谥）
school: 黄龙派
dynasty: 北宋
region: 隆兴黄龙山（崇恩院）
teacher: 石霜楚圆（慈明楚圆，临济下）
source_ref: 五灯会元·卷十二·隆兴府黄龙慧南 / 建中靖国续灯录
cbeta: X77n1524（建中靖国续灯录）相关章次
bio: 信州章氏子，初学云门，后谒石霜楚圆（慈明），言下大悟，嗣临济。住隆兴黄龙山，立「黄龙三关」勘验学者，门风严峻，开黄龙派——临济宗下二派之一（与杨岐并列）。弟子晦堂祖心、宝峰克文、东林常总等，法脉繁盛。
sayings:
- text: 黄龙三关：「我手何似佛手？我脚何似驴脚？人人有个生缘，那个无位真人？」（常以此三问验人）
  ref: 五灯会元·卷十二·黄龙慧南
status: draft
