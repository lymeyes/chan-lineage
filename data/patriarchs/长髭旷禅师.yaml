id: 长髭旷禅师
name: 长髭旷
school: 青原系
teacher: 石头希迁禅师
status: draft
bio: 曹谿礼祖塔回。参石头。头
sayings:
- text: 问。甚么处来。曰。岭南来。头曰。大庾岭头一铺功德成就也未。师曰。成就久矣。祇欠点眼在。头曰。莫要点眼么。师曰。便请。头乃垂下一足。师礼拜。头曰。汝见个甚么道理便礼拜。师曰。据某甲所见。如红炉上一点雪玄觉云。且道长髭具眼祇对。不具眼祇对。若具眼。为甚么请他点眼。若不具眼。又道成就久矣。具作么生商量。法灯代云。和尚可谓眼昏。僧参。绕禅床一匝。卓然而立。师曰。若是石头法席。一点也用不著。僧又绕禅床一匝。师曰。却是恁么时。不易道个来处。僧便出去。师乃唤。僧不顾。师曰。这汉犹少教诏在。僧却回曰。有一人不从人得。不受教诏。不落阶级。师还许么。师曰。逢之不逢。逢必有事。僧乃退身三步。师却绕禅床一匝。僧曰。不唯宗眼分明。亦乃师承有据。师乃打三棒。问僧。甚处来。曰。九华山控石庵。师曰。庵主是甚么人。曰。马祖下尊宿。师曰。名甚么。曰。不委他法号。师曰。他不委。你不委。曰。尊宿眼在甚处。师曰。若是庵主亲来。今日也须吃棒。曰。赖遇和尚。放过某甲。师曰。百年后讨个师僧也难得。庞居士到。师升座。众集定。士出曰。各请自检好。却于禅床右立。时有
  ref: X80n1565_p0169b05（五灯会元）
- text: 僧问。不触主人翁。请师答话。师曰。识庞公么。曰。不识。士便搊住曰。苦哉。苦哉。僧无对。士便拓开。师少间却
  ref: X80n1565_p0169b05（五灯会元）
- text: 问。适来这僧还吃棒否。士曰。待伊甘始得。师曰。居士祇见锥头利。不见凿头方。士曰。恁么说话。某甲即得。外人闻之。要且不好。师曰。不好个甚么。士曰。阿师祇见锥头尖。不见凿头利。李行婆来。师乃
  ref: X80n1565_p0169b05（五灯会元）
- text: 问。忆得在绛州时事么。婆曰。非师不委。师曰。多虗少实在。婆曰。有甚讳处。师曰。念你是女人。放你拄杖。婆曰。某甲终不见尊宿过。师曰。老僧过在甚么处。婆曰。和尚无过。婆岂有过。师曰。无过的人作么生。婆乃竖拳曰。与么。总成颠倒。师曰。实无讳处。师见僧。乃擒住曰。师子儿。野干属。僧以手作拨眉势。师曰。虽然如此。犹欠哮吼在。僧擒住师曰。偏爱行此一机。师与一掴。僧拍手三下。师曰。若见同风。汝甘与么否。曰。终不由别人。师作拨眉势。僧曰。犹欠哮吼在。师曰。想料不由别人。师见
  ref: X80n1565_p0169b05（五灯会元）
- text: 僧问讯次。师曰。步步是汝证明处。汝还知么。曰。某甲不知。师曰。汝若知。我堪作甚么。僧礼拜。师曰。我不堪。汝却好
  ref: X80n1565_p0169b05（五灯会元）
