id: 明州岳林真禅师
name: 明州岳林真
school: 云门宗
teacher: 育王振禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《续传灯录》T51n2077_p0609a26。
sayings:
- text: 上堂。古人道。初秋夏末合有责情三十棒。岳林则不然。灵山会上世尊拈花迦叶微笑。正当恁么时好与三十棒何故如此。太平时节强起干戈。教人吹大法螺击大法鼓。举步则金莲󱤫蹀。端居则宝座巍峨。梵王引之于前。香华缭绕。帝释随之于后。龙象骈罗。至令后代儿孙递相仿效。三三两两。皆言出格风标。劫劫波波。未肯归家稳座。鼓唇摇舌。宛如钟磬笙竿。奋臂点胸。何啻稻麻竹苇。更逞游山玩水拨草瞻风。人前说得石点头。天上飞来花扑地。也好与三十棒。且道坐夏。赏势如何酬奖。良久曰。万宝功成何厚薄。千钧价重自低昂
  ref: T51n2077_p0609a26（续传灯录）
