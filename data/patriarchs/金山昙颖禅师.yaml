id: 金山昙颖禅师
name: 金山昙颖
alias: 金山颕
school: —
teacher: —
status: draft
bio: 钱塘人也，族丘氏。于隆兴寺得度，神宇凛然。尝通内外坟典，出游师席。首谒大阳明安
sayings:
- text: 问：洞上所立偏正君臣，当明何事？曰：父母未生时事。云：如何体会？曰：夜半正明，天晓不露。师忙然，乃往石门理前语，云：未审师意如何？曰：不道不是，但口门窄，满口说未尽耳。云：如何是父母未生时事？曰：粪墼子。云：如何是夜半正明，天晓不露？曰：牡丹华下睡猫儿。师愈疑。一日，以石头执事元是迷，契理亦非悟问之。门曰：你道此语是药语？是病语？云：是药语。门叱曰：汝尚以病为药，岂知祖师透脱意？师闻洒然，云：如何受用？曰：语不离窠臼，焉能出盖缠？师叹曰：才涉唇吻，便落意思。皆是死门，终非活路。即再拜礼辞。初住舒之炉峰，次迁因圣、隐静暨雪窦、金山
  ref: X79n1559_p0056b03（嘉泰普灯录）
- text: 上堂，举：身是菩提树，心如明镜台。时时勤拂拭，莫使惹尘埃。又道：菩提本无树，明镜亦非台。本来无一物，何假拂尘埃？师曰：此二尊宿同床打睡，各自做梦吃茶去
  ref: X79n1559_p0056b03（嘉泰普灯录）
- text: 上堂：诸方钩又曲，饵又香，奔凑犹如蜂抱王。因圣这里钩又直，饵又无，犹如水底捺葫芦。举拄杖作钓鱼势，曰：深水取鱼长信命，不曾将酒祭江神。掷拄杖，下座
  ref: X79n1559_p0056b03（嘉泰普灯录）
- text: 上堂，举：长沙岑和尚与仰山玩月次，仰云：人人尽有这个，只是用不得。沙云：恰是倩汝用去。仰云：师叔作么生用？沙踏倒仰山，山云：一似个大虫。师曰：仰山唤作大虫，因圣道似个狂狗
  ref: X79n1559_p0056b03（嘉泰普灯录）
- text: 上堂：山僧门庭别，已改诸方辙。为文殊拔出眼里楔，教普贤休嚼口中铁。劝人放开髂虵手，与汝斫却系驴橛。驻意拟思量，喝曰：捏！捏！参！
  ref: X79n1559_p0056b03（嘉泰普灯录）
- text: 上堂：始从鹿野苑，终至䟦提河。于是二中间，未尝说一字。师曰：世尊只知灵龟曳尾，后人不觉见兔守株
  ref: X79n1559_p0056b03（嘉泰普灯录）
- text: 上堂：万里长途去不回，此人空道已心灰。若从因圣门前过，须解逢春却再来
  ref: X79n1559_p0056b03（嘉泰普灯录）
- text: 僧问：如何是向去底人？曰：从归青嶂里，不出白云来。云：如何是却来底人？曰：自从游紫陌，谁肯隐青山？
  ref: X79n1559_p0056b03（嘉泰普灯录）
- text: 问：如何是夺人不夺境？曰：家里已无回日信，路边空有望乡牌。云：如何是夺境不夺人？曰：沧海尽教枯到底，青山直得碾为尘。云：如何是人境两俱夺？曰：天地尚空秦日月，山河不见汉君臣。云：如何是人境俱不夺？曰：莺啭千林华满地，客游三月草侵天
  ref: X79n1559_p0056b03（嘉泰普灯录）
- text: 问：如何是和尚家风？曰：伸手不见掌。云：忽遇仙陀客来，又作么生？曰：对面千里
  ref: X79n1559_p0056b03（嘉泰普灯录）
- text: 问：师唱谁家曲？宗风嗣阿谁？曰：临济。云：恁么则谷隐的子也。曰：德山
  ref: X79n1559_p0056b03（嘉泰普灯录）
- text: 问：亡僧迁化向甚么处去？曰：驴胎马腹。云：以何为验？曰：种如是因，获如是果
  ref: X79n1559_p0056b03（嘉泰普灯录）
- text: 问：临济入门便喝，德山入门便棒，未审和尚如何为人？曰：灵云见桃华。云：莫是和尚为人处也无？曰：赵州对柏树
  ref: X79n1559_p0056b03（嘉泰普灯录）
- text: 问：如何是长法身？曰：拄杖长六尺。云：如何是短法身？曰：筭子短三寸。云：恁么则法身有二去也。曰：更有方圆在
  ref: X79n1559_p0056b03（嘉泰普灯录）
- text: 问：马大师一喝百丈，三日耳聋，意旨如何？曰：我平生不曾著人喝，一生耳聋。云：如何领会？曰：近来又眼暗。太子少保李公端愿尝馆之内园，日夕问道，故公卿求发药者，随机开示，悉令契入，其辩才无碍。王文康公、夏英公诸鸿儒咸事以师礼，录其语曰登门集。嘉祐四年除夜，遣侍者持书别扬州刀景纯学士：明旦当行，厚自爱。刀发缄骇然，急遣吏驰书报之。船将抵岸，师欣然登座，叙出世本末，及谢其辅赞者，嘱令进修，遂举监寺贤公补处，下座。读力学士书毕，大众拥至丈室，加趺而逝，五年元日也。世寿七十有五，僧腊五十有三
  ref: X79n1559_p0056b03（嘉泰普灯录）
