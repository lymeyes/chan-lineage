id: 湖南报慈淳禅师
name: 湖南报慈淳
school: —
teacher: 祥符立禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0717b15。
sayings:
- text: 上堂曰。青眸一瞬。金色知归。授手而来。如王宝剑。而今开张门户。各说异端。可谓古路坦而荆棘生。法眼正而还自翳。孤负先圣。埋没己灵。且道不埋没不孤负正法眼藏如何吐露。还有吐露得底么。出来吐露看。如无。担取诗书归旧隐。野华啼鸟一般春联灯作乌回范语
  ref: X80n1565_p0717b15（五灯会元）
