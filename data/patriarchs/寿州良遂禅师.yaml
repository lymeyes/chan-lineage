id: 寿州良遂禅师
name: 寿州良遂
school: 南岳系
teacher: 麻谷彻禅师
status: draft
bio: 参麻谷。谷见来。便将鉏头去鉏草。师到鉏草处。谷殊不顾。便归方丈。闭却门。师次日复去。谷又闭门。师乃敲门。谷
sayings:
- text: 问。阿谁。师曰。良遂。才称名。忽然契悟曰。和尚莫谩良遂。良遂若不来礼拜和尚。洎被经论赚过一生。谷便开门相见。及归讲肆。谓众曰。诸人知处。良遂总知。良遂知处。诸人不知
