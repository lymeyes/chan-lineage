id: L::常德府德山子涓禅师
name: 常德府德山子涓
school: 杨岐派
teacher: 大沩行
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《续传灯录》T51n2077_p0705b03。
sayings:
- text: 上堂。见见之时见非是见。见犹离见见不能及。遂喝曰。鲸吞海水尽。露出珊瑚枝。众中忽有个衲僧出来道。长老休寐语。却许伊具一只眼
  ref: T51n2077_p0705b03（续传灯录）
- text: 上堂横按拄杖曰。一二三四五六七。七六五四三二一。循还逆顺数将来。数到未来无尽日。因七见一因一忘七。踏破太虚空。铁牛也汗出。绝气息无踪迹。掷拄杖曰。更须放下这个。始得参学事毕
  ref: T51n2077_p0705b03（续传灯录）
- text: 上堂拈拄杖曰。有时夺人不夺境。拄杖子七纵八横。有时夺境不夺人。山僧七颠八倒。有时人境两俱夺。拄杖子与山僧削迹吞声。有时人境俱不夺。卓拄杖曰。伴我行千里。携君过万山。忽然撞著临济大师时如何。喝曰。未明心地印。难透祖师关
  ref: T51n2077_p0705b03（续传灯录）
