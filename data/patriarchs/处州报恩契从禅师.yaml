id: 处州报恩契从禅师
name: 处州报恩契从
school: 青原系
teacher: 明招谦禅师
status: draft
bio: 开堂升座。乃曰。烈士锋前。还有俊鹰俊鹞么。放一个出来看。良久曰。所以道。烈士锋前少人陪。云雷击鼓剑轮开。谁是大雄师子种。满身锋刃但出来。时有僧出。师曰。好著精彩。僧拟伸
sayings:
- text: 问。师曰。甚么处去也。僧乃
  ref: X80n1565_p0304b11（五灯会元）
- text: 问。师子未出窟时如何。师曰。锋铓难击。曰。出窟后如何。师曰。藏身无路。曰。欲出不出时如何。师曰。命似悬丝。曰。向去事如何。师曰。拶
  ref: X80n1565_p0304b11（五灯会元）
- text: 问。如何是和尚家风。师曰。还奈何么
  ref: X80n1565_p0304b11（五灯会元）
- text: 问。十二时中如何即是。师曰。金刚顶上看。曰。恁么则人天有赖。师曰。汝又诳謼人天作么
  ref: X80n1565_p0304b11（五灯会元）
