id: 赵州谂禅师
name: 赵州从谂
honorific: 赵州从谂禅师 · 真际禅师（谥）
school: 南岳系
dynasty: 唐
region: 赵州观音院（柏林寺）
teacher: 南泉普愿（马祖道一下）
source_ref: 五灯会元·卷四·赵州从谂 / 景德传灯录·卷十
cbeta: T51n2076 卷十；T47n1980（赵州真际禅师行状）
bio: 曹州郝氏子，幼出家，八十犹行脚。参南泉普愿，因「平常心是道」「煮茶」机缘悟入。后住赵州观音院，年高行尊，人称「赵州古佛」。机锋平淡而机警，「吃茶去」「庭前柏树子」「狗子无佛性」等公案流布极广。
sayings:
- text: 僧问「如何是祖师西来意」，师曰「庭前柏树子」。
  ref: 五灯会元·卷四·赵州从谂
- text: 师每见僧来，或曰「吃茶去」，或曰「洗钵盂去」。（「吃茶去」遂成宗门名句）
  ref: 五灯会元·卷四·赵州从谂
- text: 狗子无佛性：僧问「狗子还有佛性也无」，师曰「无」。
  ref: 五灯会元·卷四·赵州从谂 / 无门关第一则
- text: 吃茶去（全机）：师问新到「曾到此间么？」曰「曾到」。师曰「吃茶去」。又问一僧「曾到此间么？」曰「不曾到」。师亦曰「吃茶去」。院主问「为甚曾到也吃茶去，不曾到也吃茶去？」师召「院主」，主应诺，师曰「吃茶去」。
  ref: 五灯会元·卷四·赵州从谂
- text: 师示众：「金佛不度炉，木佛不度火，泥佛不度水；真佛内里坐。菩提涅槃、真如佛性，尽是贴体衣服，亦名烦恼。」
  ref: 五灯会元·卷四·赵州从谂
status: draft
verify: 待 CBETA 校对「吃茶去」「狗子无佛性」等公案。
