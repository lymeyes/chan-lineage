id: 广州龙境伦禅师
name: 广州龙境伦
school: 云门宗
teacher: 云门偃
status: draft
bio: 开堂升座。提起拂子曰。还会么。若会。头上更增头。若不会。断头取活
sayings:
- text: 僧问。如何是龙境家风。师曰。豺狼虎豹
  ref: X80n1565_p0569b07（五灯会元）
- text: 问。如何是佛。师曰。勤耕田。曰。学人不会。师曰。早收禾。问僧。甚么处来。曰。黄云来。师曰。作么生是黄云郎当媚痴抹跶为人一句。僧无对
  ref: X80n1565_p0569b07（五灯会元）
- text: 示众曰。作么生是长连床上取性一句。道将来
  ref: X80n1565_p0569b07（五灯会元）
