bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0575b14。
sayings:
- text: 僧问。如何是函盖乾坤句。师曰。天上有星皆拱北。曰。如何是截断众流句。师曰。大地坦然平。曰。如何是随波逐浪句。师曰。春生夏长
  ref: X80n1565_p0575b14（五灯会元）
- text: 问。古殿重兴时如何。师曰。一回春到一回新
  ref: X80n1565_p0575b14（五灯会元）
