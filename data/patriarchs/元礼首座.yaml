id: 元礼首座
name: 元礼首座
school: 杨岐派
teacher: 五祖演
status: draft
bio: 闽人也。受业焦山。初参演和尚于白云。凡入室。必谓曰。衲僧家。明取缁素好。师疑之不已。一日演升堂。举首山新妇骑驴阿家牵语。乃曰。诸人要会么。莫问新妇阿家。免烦路上波咤。遇饭即饭。遇茶即茶。同门出入。宿世冤家。师于言下豁如。且曰。今日缁素明矣。二年。演迁席祖山。命分座。不就。演归寂。即他往。崇宁间。再到五祖
sayings:
- text: 僧问。五祖迁化向甚么处去。师曰。有眼无耳朵。六月火边坐。曰。意旨如何。师曰。家贫犹自可。路贫愁杀人。或
  ref: X80n1565_p0750b01（五灯会元）
- text: 问。金刚经云。一切善法。如何是法。师曰。上是天。下是地。中间坐底坐。立底立。唤甚么作善法。僧无对。师便打。后终于四明之瑞岩。普融知藏普融知藏福州人也。至五祖。入室次。祖举倩女离魂话问之。有契。呈偈曰。二女合为一媳妇。机轮截断难回互。从来往返绝踪由。行人莫问来时路。凡有乡僧来谒。则发闽音诵俚语曰。书头教娘勤作息。书尾教娘莫瞌睡。且道中间说个甚么。僧拟对。师即推出。法閦上座法閦上座久依五祖。未有所入。一日造室。祖
  ref: X80n1565_p0750b01（五灯会元）
- text: 问。不与万法为侣者是甚么人。曰。法閦即不然。祖以手指曰。住。住。法閦即不然。作么生。师于是启悟。后至东林宣密度禅师席下。见其得平实之旨。一日拈华绕度禅床一匝。背手插香炉中。曰。和尚且道。意作么生。度屡下语。皆不契。逾两月。遂问师。令试说之。师曰。某祇将华插香炉中。和尚自疑有甚么事来
  ref: X80n1565_p0750b01（五灯会元）
