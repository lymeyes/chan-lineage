id: 韶州云门法球禅师
name: 韶州云门法球
school: 云门宗
teacher: 云门偃
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0574a03。
sayings:
- text: 僧问。如何是西来大道。师曰。当时妄想。至今不绝
  ref: X80n1565_p0574a03（五灯会元）
- text: 问。如何是云门剑。师曰。长空不匣锋铓色。曰。用者又如何。师曰。四海唯清日月明
  ref: X80n1565_p0574a03（五灯会元）
- text: 问。如何是道。师曰。头上脚下。曰。如何是道中人。师曰。一任东西
  ref: X80n1565_p0574a03（五灯会元）
- text: 问。如何是随色摩尼珠。师曰。色即不无。作么生是珠。曰。学人不会。特伸请益。师曰。云有出山势。水无投㵎声
  ref: X80n1565_p0574a03（五灯会元）
- text: 问。牛头未见四祖时如何。师曰。香风吹萎花。曰。见后如何。师曰。更雨新好者
  ref: X80n1565_p0574a03（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0574a03），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
