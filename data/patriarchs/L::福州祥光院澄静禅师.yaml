id: L::福州祥光院澄静禅师
name: 福州祥光院澄静
school: —
teacher: 长庆棱
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0289a13。
sayings:
- text: 僧问。如何是道。师曰。长安路上。曰。向上事如何。师曰。谷声万籁起。松老五云披
  ref: X80n1565_p0289a13（五灯会元）
- text: 问。如何是和尚家风。师曰。门下平章事。宫闱较几重。杭州报慈院从󳮸禅师福州陈氏子
  ref: X80n1565_p0289a13（五灯会元）
- text: 僧问。承古有言。今人看古教。未免心中闹。欲免心中闹。应须看古教。如何是古教。师曰。如是我闻。曰。如何是心中闹。师曰。那畔雀儿声
  ref: X80n1565_p0289a13（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0289a13），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
