bio: 生平部分原文未载，仅存机缘语（见下）；据《续传灯录》T51n2077_p0478c29。
sayings:
- text: 僧问。吾有大患为吾有身。父母未生未审此身在甚么处。师曰。旷大劫来无处所。若论生灭尽成非。曰恁么则周遍十方心不在一切处。师曰。泥里撼椿
  ref: T51n2077_p0478c29（续传灯录）
- text: 上堂。世间所贵者和氏之璧隋侯之珠。金山唤作驴屎马粪。出世间所贵者真如解脱菩提涅槃。金山唤作𡱰沸碗鸣。且道恁么说话落在甚么处。故不是取舍心重信邪倒见。诸人要知么。猛虎不顾几上肉。洪炉岂铸囊中锥
  ref: T51n2077_p0478c29（续传灯录）
