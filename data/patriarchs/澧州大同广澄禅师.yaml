bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0109a02。
sayings:
- text: 僧问。如何得六根灭去。师曰。轮剑掷空。无伤于物
  ref: X80n1565_p0109a02（五灯会元）
- text: 问。如何是本来人。师曰。共坐不相识。曰。恁么则学人礼谢去也。师曰。暗写愁肠寄与谁
  ref: X80n1565_p0109a02（五灯会元）
