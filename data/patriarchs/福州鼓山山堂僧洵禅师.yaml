school: 黄龙派
teacher: 上封本才禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《嘉泰普灯录》X79n1559_p0207b06。
sayings:
- text: 上堂曰：尽力道不得底句，和盲勃塑瞎。一时推出来，馊饭泥茶炉。总不恁么，天高东南，地倾西北。这三转语，天下衲僧跳不出。莫有跳得出底么？喝一喝，卓拄杖，下座
  ref: X79n1559_p0207b06（嘉泰普灯录）
- text: 上堂：黄檗手中六十棒，不会佛法的的大意，却较些子。大愚肋下筑三拳，便道黄檗佛法无多子，钝置杀人。须知有一人，大棒蓦头打，他不回头；老拳劈面槌，他亦不顾。且道是谁？
  ref: X79n1559_p0207b06（嘉泰普灯录）
