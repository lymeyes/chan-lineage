id: 衡州开福崇哲禅师
name: 衡州开福崇哲
school: —
teacher: 智海道平禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0464a06。
sayings:
- text: 上堂。妙体堂堂触处彰。快须回首便承当。今朝对众全分付。莫道侬家有覆藏。掷拂子。召侍者曰。因甚打下老僧拂子
  ref: X80n1565_p0464a06（五灯会元）
- text: 问。一水吞空远。三峰峭壁危。猊台重拂拭。共喜主人归。未审到家如何施设。师曰。空手捻双拳。曰。意旨如何。师曰。突出难辩
  ref: X80n1565_p0464a06（五灯会元）
- text: 上堂。山僧有三印。更无增减剩。觌面便相呈。能转凡成圣。诸人还知么。若也未知。不免重重注破。一印印空。日月星辰列下风。一印印泥。头头物物显真机。一印印水。捩转鱼龙头作尾。三印分明体一同。看来非赤又非红。互换高低如不荐。青山依旧白云中
  ref: X80n1565_p0464a06（五灯会元）
