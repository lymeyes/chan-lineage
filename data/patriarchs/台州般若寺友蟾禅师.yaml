id: 台州般若寺友蟾禅师
name: 台州般若寺友蟾
school: 法眼宗
teacher: 天台韶
status: draft
bio: 钱塘人也。初住云居普贤。忠懿王署慈悟禅师。选止上寺。众盈五百
sayings:
- text: 僧问。鼓声才罢。大众云臻。向上宗乘。请
  ref: X80n1565_p0372a07（五灯会元）
- text: 师举唱。师曰。亏汝甚么。曰。恁么则人人尽沾恩去也。师曰。莫乱道
  ref: X80n1565_p0372a07（五灯会元）
