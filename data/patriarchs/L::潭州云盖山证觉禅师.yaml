id: L::潭州云盖山证觉禅师
name: 潭州云盖山证觉
school: —
teacher: 云盖景
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0218a10。
sayings:
- text: 僧问。如何是和尚家风。师曰。四海不曾通
  ref: X80n1565_p0218a10（五灯会元）
- text: 问。如何是一尘含法界。师曰。通身体不圆。曰。如何是九世刹那分。师曰。繁兴不布彩
  ref: X80n1565_p0218a10（五灯会元）
- text: 问。如何是宗门中的的意。师曰。万里胡僧。不入波澜
  ref: X80n1565_p0218a10（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0218a10），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
