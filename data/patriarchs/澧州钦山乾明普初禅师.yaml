id: 澧州钦山乾明普初禅师
name: 澧州钦山乾明普初
school: 黄龙派
teacher: 夹山纯
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0700b16。
sayings:
- text: 上堂。良久曰。举扬宗旨。上祝皇基。伏愿祥云与景星俱现。醴泉与甘露双呈。君乃尧舜之君。俗乃成康之俗。使林下野夫。不觉成太平曲。且作么生是太平曲。无为而为。神而化之。洒德雨以霶霈。鼓仁风而雍熙。民如野鹿。上如标枝。十八子。知不知。哩哩啰。逻啰哩。拍一拍。下座
  ref: X80n1565_p0700b16（五灯会元）
