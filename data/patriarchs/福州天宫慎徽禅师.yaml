bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0613b12。
sayings:
- text: 上堂。八万四千波罗密门。门门长开。三千大千微尘诸佛。佛佛说法。不说有。不说无。不说非有非无。不说亦有亦无。何也。离四句。绝百非。相逢举目少人知。昨夜霜风漏消息。梅花依旧缀寒枝
  ref: X80n1565_p0613b12（五灯会元）
