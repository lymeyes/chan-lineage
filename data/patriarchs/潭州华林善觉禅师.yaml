id: 潭州华林善觉禅师
name: 潭州华林善觉
school: 南岳系
teacher: 马祖道一禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0114a02。
sayings:
- text: 问。远闻和尚念观音。是否。师曰。然。山曰。骑却头时如何。师曰。出头即从汝骑。不出头骑甚么。山无对。僧参。方展坐具。师曰。缓缓。曰。和尚见甚么。师曰。可惜许。磕破钟楼。其僧从此悟入。观察使裴休访之。问曰。还有侍者否。师曰。有一两个。祇是不可见客。裴曰。在甚么处。师乃唤大空．小空。时二虎自庵后而出。裴睹之惊悸。师语二虎曰。有客。且去。二虎哮吼而去。裴问曰。师作何行业。感得如斯。师乃良久曰。会么。曰。不会。师曰。山僧常念观音
  ref: X80n1565_p0114a02（五灯会元）
