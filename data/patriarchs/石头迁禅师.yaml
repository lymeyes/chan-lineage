id: 石头迁禅师
name: 石头希迁
honorific: 石头希迁禅师 · 无际大师（谥）
school: 青原系
dynasty: 唐
region: 南岳石头山（南台寺）
teacher: 青原行思
source_ref: 五灯会元·卷五·石头希迁 / 景德传灯录·卷十四
cbeta: T51n2076 卷十四
bio: 端州陈氏子，初谒六祖，六祖迁化后依青原行思，得印可。后住南岳石头山，著《参同契》《草庵歌》，以「回互」之理显理事圆融，机锋暗藏，人称「石头路滑」。与马祖道一并称「并世二大士」，青原一系之下游（药山、天皇、丹霞等）多出其门。
sayings:
- text: 《参同契》：「竺土大仙心，东西密相付；人根有利钝，道无南北祖。」
  ref: 石头希迁·参同契
- text: 僧问「如何是解脱」，师曰「谁缚汝」；问「如何是净土」，曰「谁垢汝」。
  ref: 五灯会元·卷五·石头希迁
status: draft
verify: 待 CBETA 校对《参同契》原文。
