bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0218b01。
sayings:
- text: 僧问。未作人身已前作甚么来。师曰。海上石牛歌三拍。一条红线掌间分
  ref: X80n1565_p0218b01（五灯会元）
- text: 问。迦叶上行衣。何人合得披。师曰。天然无相子。不挂出尘衣
  ref: X80n1565_p0218b01（五灯会元）
