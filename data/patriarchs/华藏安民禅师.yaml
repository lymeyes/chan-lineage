id: 华藏安民禅师
name: 华藏安民
alias: 华藏民
school: 杨岐派
teacher: 圆悟克勤禅师
status: draft
bio: 嘉定府朱氏子。初讲楞严于成都。为义学所归。时圆悟居昭觉。师与胜禅师为友。因造焉。闻悟小参。举国师三唤侍者因缘。赵州拈云。如人暗中书字。字虽不成文彩已彰。那里是文彩已彰处。师心疑之告香入室。悟
sayings:
- text: 问。座主讲何经。师曰。楞严。悟曰。楞严有七处征心八还辩见。毕竟心在甚么处。师多呈艺解。悟皆不肯。师复请益。悟令一切处作文彩已彰会。偶僧请益十玄谈。方举问君心印作何颜。悟厉声曰。文彩已彰。师闻而有省。遂求印证。悟云。以本色钳锤。师则罔措。一日白悟曰。和尚休举话。待某说看。悟诺。师曰。寻常拈槌竖拂。岂不是经中。道一切世界诸所有相皆即菩提妙明真心。悟笑曰。尔元来在这里作活计。师又曰。下喝敲床时。岂不是返闻闻自性性成无上道。悟曰。尔岂不见经中道妙性圆明离诸名相。师于言下释然。悟出蜀居夹山。师罢讲侍行。悟为众夜参举古帆未挂因缘。师闻未领遂求决。悟曰。尔问我
  ref: T51n2077_p0656c06（续传灯录）
- text: 师举前话。悟曰。庭前柏树子。师即洞明。谓悟曰。古人道如一滴投于巨壑。殊不知大海投于一滴。悟笑曰。奈这汉何。未几令分座。悟说偈曰。休夸四分罢楞严。按下云头彻底参。莫学亮公亲马祖。还如德峤访龙潭。七年往返游昭觉。三载翱翔上碧岩。今日烦充第一座。白华丛里现优昙。后谒佛鉴于蒋山。鉴问佛果有不曾乱为人说底句。曾与尔说么。师曰。合取狗口。鉴震声曰。不是这个道理。师曰。无人夺尔盐茶袋叫作甚么。鉴曰。佛果若不为尔说。我为尔说。师曰。和尚疑时退院别参去。鉴呵呵大笑。师未几开法保宁迁华藏。旋里领中峰
  ref: T51n2077_p0656c06（续传灯录）
- text: 上堂。众卖华兮独卖松。青青颜色不如红。算来终不与时合。归去来兮翠蔼中。可笑古人恁么道。大似逃峰赴壑避溺投火。争如随分到尺八五分镢头边讨一个半个。虽然如是。保宁半个也不要。何故富嫌千口少贫恨一身多。冬至
  ref: T51n2077_p0656c06（续传灯录）
- text: 上堂举。玉泉皓和尚云。雪雪片片不别下。到腊月再从。来年正月二月三月四月五月六月七月八月九月十月。依前不歇冻杀饿杀。免教胡说乱说。师曰。不是骂人亦非赞叹。高出临济德山。不似云居罗汉。且道玉泉意作么生。良久曰。但得雪消去自然春到来。师后示寂于本山。阇维设利颇賸。细民穴地尺许皆得之。尤光明莹洁。心舌亦不坏
  ref: T51n2077_p0656c06（续传灯录）
