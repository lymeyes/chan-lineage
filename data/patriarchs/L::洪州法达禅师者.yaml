id: L::洪州法达禅师者
name: 洪州法达
school: —
teacher: 六祖大鉴旁出
status: draft
bio: 者洪州丰城人也。七岁出家。诵法华经。进具之后。礼拜六祖。头不至地。祖诃曰。礼不投地。何如不礼。汝心中必有一物。蕴习何事邪。师曰。念法华经已及三千部。祖曰。汝若念至万部。得其经意。不以为胜。则与吾偕行。汝今负此事业。都不知过。听吾偈曰。礼本折慢幢。头奚不至地。有我罪即生。亡功福无比。祖又曰。汝名甚么。对曰。名法达。祖曰。汝名法达。何曾达法。复说偈曰。汝今名法达。勤诵未休歇。空诵但循声。明心号菩萨。汝今有缘故。吾今为汝说。但信佛无言。莲华从口发。师闻偈。悔过曰。而今而后。当谦恭一切。惟愿和尚大慈。略说经中义理。祖曰。汝念此经。以何为宗。师曰。学人愚钝。从来但依文诵念。岂知宗趣。祖曰。汝试为吾念一遍。吾当为汝解说。师即高声念经。至方便品。祖曰。止。此经元来以因缘出世为宗。纵说多种譬喻。亦无越于此。何者。因缘唯一大事。一大事即佛知见也。汝慎勿错解经意。见他道开示悟入。自是佛之知见。我辈无分。若作此解。乃是谤经毁佛也。彼既是佛。已具知见。何用更开。汝今当信。佛知见者。只汝自心。更无别体。葢为一切众生自蔽光明。贪爱尘境。外缘内扰。甘受驱驰。便劳他从三昧起。种种苦口。劝令寝息。莫向外求。与佛无二。故云。开佛知见。汝但劳劳执念。谓为功课者。何异牦牛爱尾也。师曰。若然者。但得解义。不劳诵经邪。祖曰。经有何过。岂障汝念。只为迷悟在人。损益由汝。听吾偈曰。心迷法华转。心悟转法华。诵久不明己。与义作雠家。无念念即正。有念念成邪。有无俱不计。长御白牛车。师闻偈再启曰。经云诸大声闻。乃至菩萨。皆尽思度量。尚不能测于佛智。今令凡夫但悟自心。便名佛之知见。自非上根。未免疑谤。又经说三车。大牛之车与白牛车如何区别。愿和尚再垂宣说。祖曰。经意分明。汝自迷背。诸三乘人不能测佛智者。患在度量也。饶伊尽思共推。转加悬远。佛本为凡夫说。不为佛说。此理若不肯信者。从他退席。殊不知坐却白牛车。更于门外觅三车。况经文明向汝……（原文更长，见 cbeta 锚点）
