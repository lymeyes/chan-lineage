id: 越州姜山方禅师
name: 越州姜山方
school: —
teacher: 琅邪觉禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0446b05。
sayings:
- text: 僧问。如何是不动尊。师曰。单著布衫穿市过。曰。学人未晓。师曰。骑驴踏破洞庭波。曰。透过三级浪。专听一声雷。师曰。伸手不见掌。曰。还许学人进向也无。师曰。踏地告虗空。曰。雷门之下。布鼓难鸣。师曰。八花球子上。不用绣红旗。曰。三十年后。此话大行。师便打
  ref: X80n1565_p0446b05（五灯会元）
- text: 问。莲花未出水时如何。师曰。穿针嫌眼小。曰。出水后如何。师曰。尽日展愁眉
  ref: X80n1565_p0446b05（五灯会元）
- text: 问。如何是一尘入正受。师曰。蛇衔老鼠尾。曰。如何是诸尘三昧起。师曰。鳖𫜪钓鱼竿。曰。恁么则东西不辩。南北不分去也。师曰。堂前一碗夜明灯。帘外数茎青瘦竹
  ref: X80n1565_p0446b05（五灯会元）
- text: 问。诸佛未出世时如何。师曰。不识酒望子。曰。出世后如何。师曰。钓鱼船上赠三椎
  ref: X80n1565_p0446b05（五灯会元）
- text: 问。如何是佛。师曰。留髭表丈夫
  ref: X80n1565_p0446b05（五灯会元）
- text: 问。奔流度刃。疾𦦨过风。未审姜山门下还许借借也无。师曰。天寒日短夜更长。曰。锦帐绣鸳鸯。行人难得见。师曰。髑髅里面气冲天。僧召和尚。师曰。鸡头凤尾。曰。诸方泥里洗。姜山画将来。师曰。姜山今日为客。且望阇黎善传。虽然如是。不得放过。便打
  ref: X80n1565_p0446b05（五灯会元）
- text: 上堂。穿云不渡水。渡水不穿云。乾坤把定不把定。虗空放行不放行。横三竖四。乍离乍合。将长补短。即不问汝诸人。饭是米做一句。要且难道。良久曰。私事不得官酬
  ref: X80n1565_p0446b05（五灯会元）
- text: 上堂。不是道得道不得。诸方尽把为奇特。寒山烧火满头灰。笑骂丰干这老贼
  ref: X80n1565_p0446b05（五灯会元）
