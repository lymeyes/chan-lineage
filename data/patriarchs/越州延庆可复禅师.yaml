bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0639a17。
sayings:
- text: 上堂。胡来胡现。汉来汉现。忽然胡汉俱来时。如何祗准。良久曰。落霞与孤鹜齐飞。秋水共长天一色。参
  ref: X80n1565_p0639a17（五灯会元）
- text: 上堂。蓦拈拄杖横按膝上。曰。苦痛深。苦痛深。碧潭千万丈。那个是知音。卓一下。下座
  ref: X80n1565_p0639a17（五灯会元）
