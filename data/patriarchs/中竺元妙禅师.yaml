bio: 生平部分原文未载，仅存机缘语（见下）；据《续传灯录》T51n2077_p0673b16。
sayings:
- text: 僧问。如何是截断众流句。师曰。佛祖开口无分。曰如何是函盖乾坤句。师曰。匝地普天。曰如何是随波逐浪句。师曰。有时入荒草有时上孤峰
  ref: T51n2077_p0673b16（续传灯录）
- text: 上堂。黄昏鸡报晓。半夜日头明。惊起雪师子。瞠开红眼睛
  ref: T51n2077_p0673b16（续传灯录）
- text: 上堂。去年梅今岁柳颜色馨香。喝一喝。良久曰。若不得这一喝几乎道著依旧。且道。道著后如何。眼睛突出
  ref: T51n2077_p0673b16（续传灯录）
