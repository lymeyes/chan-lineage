id: L::朗州德山德海禅师
name: 朗州德山德海
school: —
teacher: 保福展
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0291b18。
sayings:
- text: 僧问。灵山一会。何人得闻。师曰。阇黎得闻。曰。未审灵山说个甚么。师曰。即阇黎会
  ref: X80n1565_p0291b18（五灯会元）
- text: 问。如何是该天括地句。师曰。千界摇动
  ref: X80n1565_p0291b18（五灯会元）
- text: 问。从上宗乘以何为验。师曰。从上且置。即今作么生。曰。大众总见。师曰。话堕也
  ref: X80n1565_p0291b18（五灯会元）
- text: 问。如何是祖师西来意。师曰。擘
  ref: X80n1565_p0291b18（五灯会元）
