id: 惠州罗浮山显如禅师
name: 惠州罗浮山显如
school: 曹洞宗
teacher: 大阳玄禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0526b17。
sayings:
- text: 问。汝是甚处人。曰。益州。阳曰。此去几里。曰。五千里。阳曰。你与么来。还曾踏著么。曰。不曾踏著。阳曰。汝解腾空那。曰。不解腾空。阳曰。争得到这里。曰。步步不迷方。通身无辨处。阳曰。汝得超方三昧邪。曰。圣心不可得。三昧岂彰名。阳曰。如是。如是。汝应信此即本体全彰。理事不二。善自护持。住后
  ref: X80n1565_p0526b17（五灯会元）
- text: 僧问。如何是罗浮境。师曰。突兀侵天际。巍峩镇海涯。曰。如何是境中人。师曰。顶上白云散。足下黑烟生
  ref: X80n1565_p0526b17（五灯会元）
