bio: 十三首达磨见武帝达磨见武帝烧得通红打一锤，周遭无限火星飞。十成好个金刚钻，摊向门前卖与谁。清净行者不入涅槃清净行者不入涅槃生平疏逸无拘检，酒肄茶坊信意游。汉地不收秦不管，又骑驴子下扬州。不与万法无侣不与万法无侣风吹日炙露尸骸，泣问山人觅地埋。忍俊不禁多口老，阴阳无处可安排。日面佛月面佛日面佛月面佛蒲团上端坐，针眼里穿线。西风一阵来，落叶两三斤。仰山打破沩山镜仰山打破沩山镜沩山古镜仰山提，日上东方月照西，扑落不知谁拾得？秋风索索艸萋萋。临济问黄檗佛法大意临济问黄檗佛法大意雷电喧轰海岳昏，一家愁闭雨中门。狂风忽起乌云散，白日满天星斗分。临济嘱三圣临济嘱三圣出门握手再叮咛，往往事从叮嘱生。夜迥路长休把火，大家吹杀暗中行。须弥山须弥山万仞峰头立大乖，须臾眨眼落悬崖。通身不损毫毛者，天上人间安敢埋。渐源吊慰渐源吊慰终日挨门复倚楼，几回明镜照梳头。一从事却潘郎后，也解人前不识羞。大随龟大随龟露足藏头可笑奇，千年谁谓是灵龟。雨倾不解乘流去，浮木相逢又几时。灵云悟道玄沙未彻灵云悟道，玄沙未彻。万年松下忽相逢，󳫠树鸣条浩浩风。堪笑晚来无处觅，崔嵬和雨在云中。大禅佛半夜于僧堂前叫云我悟也大禅佛半夜于僧堂前叫云：我悟也。夜半高声似少神，个中明白有疏亲。如今随例传其响，也道师姑是女人。芭蕉拄杖芭蕉拄杖你有面前枯取去，如无背后夺将来。可怜黑漆光生底，击著千门万户开
