id: 杭州大慈山寰中禅师
name: 杭州大慈山寰中
school: 南岳系
teacher: 百丈海
status: draft
bio: 蒲坂卢氏子。顶骨圆耸。其声如钟。少丁母忧。庐于墓所。服阕思报罔极。乃于并州童子寺出家。嵩岳登戒。习诸律学。后参百丈。受心印。辞往南岳常乐寺。结茅于山顶。一日。南泉至
sayings:
- text: 问。如何是庵中主。师曰。苍天。苍天。泉曰。苍天且置。如何是庵中主。师曰。会即便会。莫忉忉。泉拂袖而出。后住大慈
  ref: X80n1565_p0124a14（五灯会元）
- text: 上堂。山僧不解答话。只能识病。时有僧出。师便归方丈。法眼云。众中唤作病在目前。不识。玄觉云。且道大慈识病不识病。此僧出来是病不是病。若言是病。每日行住不可总是病。若言不是病。出来又作么生。赵州
  ref: X80n1565_p0124a14（五灯会元）
- text: 问。般若以何为体。师曰。般若以何为体。州大笑而出。明日。州扫地次。师曰。般若以何为体。州置帚。拊掌大笑。师便归方丈。僧辞
  ref: X80n1565_p0124a14（五灯会元）
- text: 师问。甚么处去。曰。江西去。师曰。我劳汝一段事得否。曰。和尚有甚么事。师曰。将取老僧去得么。曰。更有过于和尚者。亦不能将去。师便休。僧后举似洞山。山曰。阇黎争合恁么道。曰。和尚作么生。山曰。得法眼别云。和尚若去。某甲提笠子。山又问其僧。大慈别有甚么言句。曰。有时
  ref: X80n1565_p0124a14（五灯会元）
- text: 示众曰。说得一丈。不如行取一尺。说得一尺。不如行取一寸。山曰。我不恁么道。曰。和尚作么生。山曰。说取行不得底。行取说不得底云居云。行时无说路。说时无行路。不说不行时。合行甚么路。洛浦云。行说俱到。即本分事无。行说俱不到。即本分事在。后属武宗废教。师短褐隐居。大中岁重剃染。大扬宗旨。咸通三年不疾而逝。僖宗谥性空大师
  ref: X80n1565_p0124a14（五灯会元）
