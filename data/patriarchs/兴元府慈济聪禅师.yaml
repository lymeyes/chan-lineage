id: 兴元府慈济聪禅师
name: 兴元府慈济聪
school: 云门宗
teacher: 法云秀
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0631b07。
sayings:
- text: 僧问。如何是道。师曰。此去长安三十七程。曰。如何是道中人。师曰。撞头磕额
  ref: X80n1565_p0631b07（五灯会元）
- text: 问。不是风动。不是幡动。未审是甚么动。师曰。低声。低声
  ref: X80n1565_p0631b07（五灯会元）
- text: 问。如何是随色摩尼珠。师曰。青青翠竹。郁郁黄花。曰。如何是正色。师曰。退后。退后
  ref: X80n1565_p0631b07（五灯会元）
- text: 问。释迦已灭。弥勒未生。未审谁为导首。师曰。铁牛也须汗出。曰。莫便是为人处也无。师曰。细看前话
  ref: X80n1565_p0631b07（五灯会元）
- text: 问。如何是超佛越祖之谈。师曰。陕府铁牛
  ref: X80n1565_p0631b07（五灯会元）
- text: 上堂。三乘教典。不是真诠。直指本心。未为极则。若是通心上士。脱洒高流。出来相见。乃顾视大众曰。休
  ref: X80n1565_p0631b07（五灯会元）
- text: 上堂。终日孜孜相为。恰似牵牛上壁。大众。何故如此贪生逐日区区去。唤不回头争奈何
  ref: X80n1565_p0631b07（五灯会元）
- text: 上堂。一即一。二即二。把定要津。何处出气。拈拄杖曰。彼自无疮。勿伤之也。卓一下。下座
  ref: X80n1565_p0631b07（五灯会元）
