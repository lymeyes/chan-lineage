sayings:
- text: 上堂。心镜明鉴无碍。遂拈起拄杖曰。唤这个作拄杖。即是碍。不唤作拄杖。亦是碍。离此之外。毕竟如何。要会么。碍不碍。谁为对。大地山河。廓然粉碎
  ref: X80n1565_p0633a08（五灯会元）
