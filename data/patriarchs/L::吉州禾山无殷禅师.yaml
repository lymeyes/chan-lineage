id: L::吉州禾山无殷禅师
name: 吉州禾山无殷
school: 青原系
teacher: 九峰虔
status: draft
bio: 福州吴氏子。七岁从雪峰出家。依年受具。谒九峰。峰
sayings:
- text: 问。汝远远而来。晖晖音衮随众。见何境界而可修行。由何径路而能出离。师曰。重昏廓辟。盲者自盲。峰乃许入室。后住禾山。学徒济济。诸方降叹。江南李氏召而问曰。和尚何处来。师曰。禾山来。曰。山在甚么处。师曰。人来朝凤阙。山岳不曾移。国主重之。命居杨州祥光院。复乞入山。以翠岩而栖止焉。时上蓝亦虗其室。命师来往阐化。号澄源禅师
  ref: X80n1565_p0211b13（五灯会元）
- text: 僧问。学人乍入丛林。乞师指示。师曰。于汝不惜
  ref: X80n1565_p0211b13（五灯会元）
- text: 问。仰山插锹意旨如何。师曰。汝问我。曰。玄沙踏倒锹又作么生。师曰。我问汝。曰。未辩其宗。如何体悉。师曰。头大尾尖
  ref: X80n1565_p0211b13（五灯会元）
- text: 问。咫尺之间。为甚么不睹师颜。师曰。且与阇黎道一半。曰。为甚么不全道。师曰。尽法无民。曰。不怕无民。请师尽法。师曰。推倒禾山也
  ref: X80n1565_p0211b13（五灯会元）
- text: 问。习学谓之闻。绝学谓之邻。过此二者。谓之真过。如何是真过。师曰。禾山解打鼓。曰。如何是真谛。师曰。禾山解打鼓
  ref: X80n1565_p0211b13（五灯会元）
- text: 问。即心即佛则不
  ref: X80n1565_p0211b13（五灯会元）
- text: 问。如何是非心非佛。师曰。禾山解打鼓。曰。如何是向上事。师曰。禾山解打鼓
  ref: X80n1565_p0211b13（五灯会元）
- text: 问。万法齐兴时如何。师曰。禾山解打鼓
  ref: X80n1565_p0211b13（五灯会元）
- text: 问。如何是古佛心。师曰。世界崩陷。曰。为甚如此。师曰。宁无我身
  ref: X80n1565_p0211b13（五灯会元）
- text: 问。尊者拨眉击目。视育王时如何。师曰。即今也恁么。曰。学人如何领会。师曰。莫非摩利支山
  ref: X80n1565_p0211b13（五灯会元）
- text: 问。摩尼宝殿有四角。一角常露。如何是露底角
  ref: X80n1565_p0211b13（五灯会元）
- text: 师举手曰。汝打我。复曰。汝还会么。曰。不会。师曰。汝争解打得我
  ref: X80n1565_p0211b13（五灯会元）
- text: 问。如何是西来意。师曰。扑破著
  ref: X80n1565_p0211b13（五灯会元）
- text: 问。已在红炉。请师烹炼。师曰。槌下成器。曰。恁么则烹炼去也。师曰。池州和尚
  ref: X80n1565_p0211b13（五灯会元）
- text: 问。四壁打禾。中间刬草。和尚赴阿那头。师曰。甚么处不赴。曰。恁么则同于众去也。师曰。小师弟子。建隆元年二月示微疾。三月二日辞众。乃曰。后来学者未识禾山。即今识取。珍重。言讫而寂。谥法性禅师
  ref: X80n1565_p0211b13（五灯会元）
