bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0716a03。
sayings:
- text: 上堂。残雪既消尽。春风日渐多。若将时节会。佛法又如何。且道时节因缘与佛法道理。是同是别。良久曰。无影树栽人不见。开华结果自馨香
  ref: X80n1565_p0716a03（五灯会元）
