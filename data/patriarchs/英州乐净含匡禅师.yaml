id: 英州乐净含匡禅师
name: 英州乐净含匡
school: —
teacher: 白云祥
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《景德传灯录》T51n2076_p0404a20。
sayings:
- text: 僧问。如何是西来意。师曰。侧耳无功。问如何是乐净家风。师曰。天地养人。问如何是乐净境。师曰。有功贪种竹。无暇不栽松。曰忽遇客来将何供养。师曰。满园秋果熟要者近前尝。问不坐菩提座直过那边如何。师曰。放过。问师唱谁家曲。宗风嗣阿谁。师曰。斩新世界特地乾坤。问龙门有意透者如何。师曰。滩下接取。曰学人不会。师曰。唤行头来。问但得本莫愁末。如何是本。师曰。不要问人。曰如何是末。师乃竖指。问如何是乐净境。师曰。满月团圆菩萨面。庭前棕树夜叉头。有僧辞
  ref: T51n2076_p0404a20（景德传灯录）
- text: 师问。什么处去。曰大容去。师曰。大容若问乐净近日有何言教。汝作么生只对。僧无语。师代曰。但道乐净近日不肯大容。因普请打篱次有
  ref: T51n2076_p0404a20（景德传灯录）
- text: 僧问。古人种种开方便门。和尚为什么却拦截。师曰。牢下橛著
  ref: T51n2076_p0404a20（景德传灯录）
