id: 庐州澄心院旻德禅师
name: 庐州澄心院旻德
school: 临济宗
teacher: 魏府大觉
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0403b10。
sayings:
- text: 示众曰。若是作家战将。便请单刀直入。更莫如何若何。师出礼拜起便喝。化亦喝。师又喝。化亦喝。师礼拜归众。化曰。适来若是别人。三十棒一棒也较不得。何故。为他旻德会一喝不作一喝用。住后
  ref: X80n1565_p0403b10（五灯会元）
- text: 僧问。如何是澄心。师曰。我不作这活计。曰。未审作么生。师便喝。僧曰。大好不作这活计。师便打
  ref: X80n1565_p0403b10（五灯会元）
- text: 问。如何是道。师曰。老僧久住澄心院。曰。如何是道中人。师曰。破衲长披经岁年
  ref: X80n1565_p0403b10（五灯会元）
- text: 问。露地不通风时如何。师曰。漆
  ref: X80n1565_p0403b10（五灯会元）
- text: 问。既是澄心。为甚么出来入去。师曰。鼻孔上著灸。僧礼拜。师便打
  ref: X80n1565_p0403b10（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0403b10），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
