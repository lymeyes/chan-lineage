id: 婺州木陈从朗禅师
name: 婺州木陈从朗
school: 南岳系
teacher: 赵州从谂禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0156b08。
sayings:
- text: 僧问。放鹤出笼和雪去时如何。师曰。我道不一色。因金刚倒
  ref: X80n1565_p0156b08（五灯会元）
- text: 僧问。既是金刚不坏身。为甚么却倒地。师敲禅床曰。行住坐卧。师将归寂。有偈曰。三十年来住木陈。时中无一假功成。有人问我西来意。展似眉毛作么生
  ref: X80n1565_p0156b08（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0156b08），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
