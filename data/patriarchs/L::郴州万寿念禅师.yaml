id: L::郴州万寿念禅师
name: 郴州万寿念
school: —
teacher: 华光恭
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0692a03。
sayings:
- text: 僧问。龙华胜会。肇启兹晨。未审弥勒世尊现居何处。师曰。猪肉案头。曰。既是弥勒世尊。为甚么却在猪肉案头。师曰。不是弄潮人。休入洪波里。曰。毕竟事又且如何。师曰。番人不系腰。岁旦
  ref: X80n1565_p0692a03（五灯会元）
- text: 上堂。往复无际。动静一源。含有德以还空。越无私而迥出。昔日日。今日日。照无两明。昔日风。今日风。鼓无两动。昔日雨。今日雨。泽无两润。于其中间觅去来相而不可得。何故。自他心起。起处无踪。自我心忘。忘无灭迹。大众。若向这里会去。与天地而同根。共万物为一体。若也未明。山僧为你重重颂出。元正一。古佛家风从此出。不劳向上用工夫。历劫何曾异今日。元正二。寂寥冷淡无滋味。赵州相唤吃茶来。剔起眉毛须瞥地。元正三。上来稽首各和南。若问香山山里事。灵源一派碧如蓝。遂喝一喝。下座
  ref: X80n1565_p0692a03（五灯会元）
