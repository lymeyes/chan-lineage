id: 苏州尧峰颢暹禅师
name: 苏州尧峰颢暹
school: 法眼宗
teacher: 功臣轲禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《续传灯录》T51n2077_p0533c08。
sayings:
- text: 僧问。学人乍入丛林乞师一接。师曰去。问承教有言。是法平等无有高下。如何是平等法。师曰。尧峰高宝华低。曰恁么则却成高下去也。师曰。情知尔恁么会闻雷声
  ref: T51n2077_p0533c08（续传灯录）
- text: 示众曰。还闻雷声么。还知起处么。若知起处便知身命落处。若也不知。所以古人道。不知天地者刚道有乾坤。不如吃茶去。问如何是道。师曰。夕死可矣。问如何是金刚力士。师曰。这里用不著。问亡僧迁化向甚么处去也。师曰。苍天苍天。乃曰。只如末后
  ref: T51n2077_p0533c08（续传灯录）
- text: 僧问亡僧迁化向甚么处去也。山僧向他道苍天苍天。且道意落在甚么处。莫是悲伤迁逝痛忆道人么。若乃恁么评论。实谓罔知去处。要知去处么。更不用久立歇去
  ref: T51n2077_p0533c08（续传灯录）
- text: 上堂。冬去春来楼阁门开。若也入得不用徘徊。诸上座。还向这里入得也未。若也入得。所以古人道。是处是弥勒无门无善财。若也入之未得。自是诸上座狂走。更不忉忉。久立珍重
  ref: T51n2077_p0533c08（续传灯录）
