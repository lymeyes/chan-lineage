bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0630b08。
sayings:
- text: 上堂。会么。已被热谩了也。今早起来。无言可说。下床著鞋。后架洗面。堂内展钵吃粥。粥后打睡。睡起吃茶。见客相唤。斋时吃饭。日日相似。有甚么过。然虽如是。更有一般令我笑。金刚倒地一堆泥。拍禅床。下座
  ref: X80n1565_p0630b08（五灯会元）
