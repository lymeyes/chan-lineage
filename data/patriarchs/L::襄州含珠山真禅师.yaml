id: L::襄州含珠山真禅师
name: 襄州含珠山真
school: 曹洞宗
teacher: 含珠哲
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0517b11。
sayings:
- text: 僧问。师唱谁家曲。宗风嗣阿谁。师曰。含珠密意。同道者知。曰。恁么则不假羽翼。便登霄汉去也。师曰。钝
  ref: X80n1565_p0517b11（五灯会元）
- text: 问。古镜未磨时如何。师曰。昧不得。曰。磨后如何。师曰。黑如漆
  ref: X80n1565_p0517b11（五灯会元）
