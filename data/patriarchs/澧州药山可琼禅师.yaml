id: 澧州药山可琼禅师
name: 澧州药山可琼
school: 云门宗
teacher: 德山密
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0579a18。
sayings:
- text: 上堂。僧出曰。请师答话。师曰。好。曰。还当得也无。师曰。更
  ref: X80n1565_p0579a18（五灯会元）
- text: 问。问。巨岳不曾乏寸土。师今苦口为何人。师曰。延寿也要道过。曰。不伸此
  ref: X80n1565_p0579a18（五灯会元）
- text: 问。焉辩我师。师便喝。僧礼拜。师便打
  ref: X80n1565_p0579a18（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0579a18），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
