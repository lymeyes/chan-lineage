bio: 师于熙宁五年八月十一日集众云：我佛世尊示化将终，有正法眼藏，涅槃妙心，付摩诃迦叶。自兹祖祖相传，分枝列派，至于今日。吾今世缘将谢，听吾偈曰：诸法本无生，皆随信心起。千圣密相传，展转无终始。言毕，趺坐而逝，寿八十七。茶毗収舍利舌根不坏。建中靖国续灯录建中靖国续灯录　　　〔宋铭〕东京法云禅寺住持传法佛国禅师臣惟白集对机门
