id: 吉州禾山和尚
name: 吉州禾山
school: 曹洞宗
teacher: 洞山价
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0491a15。
sayings:
- text: 僧问。学人欲伸一
  ref: X80n1565_p0491a15（五灯会元）
- text: 问。师还答否。师曰。禾山答汝了也
  ref: X80n1565_p0491a15（五灯会元）
- text: 问。如何是西来意。师曰。禾山大顶
  ref: X80n1565_p0491a15（五灯会元）
- text: 问。如何是和尚家风。师曰。满目青山起白云。曰。或遇客来。如何祇待。师曰。满盘无味醍醐果
  ref: X80n1565_p0491a15（五灯会元）
- text: 问。无言童子居何国土。师曰。当轩木马嘶风切
  ref: X80n1565_p0491a15（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0491a15），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
