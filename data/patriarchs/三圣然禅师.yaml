id: 三圣然禅师
name: 三圣慧然
school: 临济宗
teacher: 临济义玄
bio: 临济义玄禅师首座。临济迁化前，大众举三圣继席，三圣以一喝勘验大众，足见临济门风之峻烈。《镇州临济慧照禅师语录》中主要机缘问答多由三圣发起记录，为临济宗重要传人。
sayings:
- text: 三圣问：「师唱谁家曲，宗风嗣阿谁？」师（临济）云：「我在黄檗处，三度发问，三度被打。」
  ref: 五灯会元·卷十一·临济义玄禅师
- text: 临济将顺世，谓众曰：「吾灭后不得灭却吾正法眼藏。」三圣出曰：「争敢灭却和尚正法眼藏！」师曰：「已后有人问你，向他道甚么？」三圣便喝。师曰：「谁知吾正法眼藏，向这汉边灭却。」
  ref: 五灯会元·卷十一·临济义玄禅师
status: draft
verify: 据《五灯会元》整理，待 CBETA 逐字校核原文与卷次；师承以谱系父节点为准。
