sayings:
- text: 上堂，云：唱弥高，和弥寡，九载少林，有口如哑，眨上眉毛，蹉过了也。山僧今日从空放下，为什么如此？尽法无民
  ref: X78n1556_p0181a09（建中靖国续灯录）
- text: 上堂，云：龙泉今日与诸人说些葛藤。良久，云：枝蔓上更生枝蔓
  ref: X78n1556_p0181a09（建中靖国续灯录）
