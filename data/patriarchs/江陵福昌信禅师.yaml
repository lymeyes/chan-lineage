bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0615a05。
sayings:
- text: 僧问。一花开五叶。如何是第一叶。师提起坐具。僧曰。云生片片。雨点霏霏。师曰。不痛不知伤。僧曰。这个犹是风生雨意。如何是第一叶。师将坐具𢷾一𢷾。僧拍掌。师曰。一任𨁝跳
  ref: X80n1565_p0615a05（五灯会元）
- text: 问。如何是佛。师曰。东家儿郎。西家织女。僧曰。学人不会。师曰。掷笔抛梭
  ref: X80n1565_p0615a05（五灯会元）
- text: 上堂召大众。众举头。师曰。南山风色紧。便下座。说
  ref: X80n1565_p0615a05（五灯会元）
