bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0624b17。
sayings:
- text: 上堂。今朝是如来降生之节。天下缁流。莫不以香汤灌沐。共报洪恩。为甚么教中却道。如来者无所从来。既是无所从来。不知降生底是谁。试请道看。若道得。其恩自报。若道不得。明年四月八。还是蓦头浇
  ref: X80n1565_p0624b17（五灯会元）
