id: 何山守珣禅师
name: 何山守珣
alias: 何山珣
school: 杨岐派
teacher: 太平慧懃禅师
status: draft
bio: 郡之施氏子。参广鉴瑛禅师不契。遂造太平随众咨请邈无所入。乃封其衾曰。此生若不彻去誓不展此。于是昼坐宵立如丧考妣。逾七七日忽佛鉴
sayings:
- text: 上堂曰。森罗及万象一法之所印。师闻顿悟往见鉴。鉴曰。可惜一颗明珠被这风颠汉拾得。乃诘之曰。灵云道。自从一见桃花后。直至如今更不疑。如何是他不疑处。师曰。莫道灵云不疑。只今觅个疑处了不可得。鉴曰。玄沙道。谛当甚谛当。敢保老兄未彻在。那里是他未彻处。师曰。深知和尚老婆心切。鉴然之。师拜起呈偈曰。终日看天不举头。桃花烂熳始擡眸。饶君更有遮天网。透得牢关即便休。鉴嘱令护持。是夕厉声谓众曰。这回珣上座稳睡去也。圆悟闻得疑其未然。乃曰。我须勘过始得。遂令人召至。因与游山偶到一水潭。悟推师入水。遽问曰。牛头未见四祖时如何。师曰。潭深鱼聚。悟曰。见后如何。师曰。树高招风。悟曰。见与未见时如何。师曰。伸脚在缩脚里。悟大称之。鉴移蒋山命分座说法。出住庐陵之禾山。退藏故里。道俗迎居天圣。后徙何山及天宁
  ref: T51n2077_p0666c02（续传灯录）
- text: 上堂。𨍏轹钻住山斧。佛祖出头未轻与。纵使醍醐满世间。尔无宝器如何取。阿呵呵。神山打罗道吾作舞。甜瓜彻蒂甜。苦瓠连根苦
  ref: T51n2077_p0666c02（续传灯录）
- text: 上堂举婆子烧庵话。师曰。大凡扶宗立教须是其人。尔看他婆子。虽是个女人。宛有丈夫作略。二十年簁油费酱固是可知。一日向百尺竿头做个失落。直得用尽平生腕头气力。自非个俗汉知机洎乎巧尽拙出。然虽如是诸人要会么。雪后始知松柏操。事难方见丈夫心
  ref: T51n2077_p0666c02（续传灯录）
- text: 上堂。如来禅祖师道。切忌将心外边讨。从门所得即非珍。特地埋藏衣里宝。禅家流须及早拨动祖师关棙。抖擞多年布袄。是非毁誉付之空。竖阔横长浑恰好。君不见寒山老。终日嬉嬉长年把扫。人问其中事若何。入荒田不拣信手拈来草。参
  ref: T51n2077_p0666c02（续传灯录）
- text: 僧问。如何是宾中宾。师曰。客路如天远侯门似海深。曰如何是宾中主。师曰。长因送客处忆得别家时。曰如何是主中宾。师曰。相逢不必问前程。曰如何是主中主。师曰。一朝权祖令。谁是出头人。曰宾主已蒙师指示。向上宗乘事若何。师曰。向上问将来。曰如何是向上事。师曰。大海若知足百川应倒流。僧礼拜。师曰。珣上座三十年学得底。师尝谓众曰。兄弟如有省悟处。不拘时节请来露个消息。雪夜有僧扣方丈门。师起秉烛震威喝曰。雪深夜半求决疑情。因甚么威仪不具。僧顾视衣裓。师逐出院。每曰。先师只年五十九。吾年五十六矣。来日无多。绍兴甲寅解制退天宁之席。谓双槐居士郑绩曰。十月八日是佛鉴忌。则吾时至矣。乞还障南。十月四日郑公遣弟僧道如讯之。师曰。汝来正其时也。先一日不著便。后一日蹉过了。吾虽与佛鉴同条生终不与同条死。明早可为我寻一只小船子来。如曰。要长者要高者。师曰。高五尺许。越三日鸡鸣端坐如平时。侍者请遗偈。师曰。不曾作得言讫而逝。阇维舌根不坏。郡人陈师颜以宝函藏其家。门弟子奉灵骨塔于普应院之侧
  ref: T51n2077_p0666c02（续传灯录）
