id: L::定上座
name: 定上座
school: 临济宗
teacher: 临济义玄
bio: 临济义玄禅师法嗣，生平不详，以一则「问佛法大意被临济擒住」公案著称，于临济门下得大悟。
sayings:
- text: 定上座问：「如何是佛法大意？」临济下禅床擒住，定拟议，临济与一掌。定伫立。傍僧云：「定上座何不礼拜？」定方礼拜，忽然大悟。
  ref: 五灯会元·卷十一·临济义玄禅师
- text: 定上座桥上见三人浩歌，定擒住一人曰：「汝为甚么歌唱？」其人无对，定便掌。
  ref: 五灯会元·卷十一·定上座
status: draft
verify: 据《五灯会元》整理，待 CBETA 逐字校核原文与卷次；师承以谱系父节点为准。
