sayings:
- text: 僧问。视瞬不及处如何。师曰。我眨眼也没工夫
  ref: X80n1565_p0332b12（五灯会元）
- text: 问。如何是祖师意。师曰。西天来。唐土去
  ref: X80n1565_p0332b12（五灯会元）
