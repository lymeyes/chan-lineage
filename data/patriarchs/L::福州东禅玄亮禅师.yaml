bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0309b11。
sayings:
- text: 僧问。本无迷悟。为甚么却有佛有众生。师曰。话堕也
  ref: X80n1565_p0309b11（五灯会元）
- text: 问。祖祖相传传法印。师今继嗣嗣何人。师曰。特谢证明。曰。恁么则白龙当时亲授记。今日应圣度迷津。师曰。汝莫错认定盘星
  ref: X80n1565_p0309b11（五灯会元）
