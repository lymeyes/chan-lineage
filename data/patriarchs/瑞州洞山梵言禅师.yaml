id: 瑞州洞山梵言禅师
name: 瑞州洞山梵言
school: 曹洞宗
teacher: 宝峰文禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0681a14。
sayings:
- text: 上堂。有二僧齐出。一僧礼拜。一僧便
  ref: X80n1565_p0681a14（五灯会元）
- text: 问。得用便用时如何。师曰。伊兰作旃檀之树。曰。有意气时添意气。不风流处也风流。师曰。甘露乃蒺蔾之园
  ref: X80n1565_p0681a14（五灯会元）
- text: 上堂。吾心似秋月。碧潭清皎洁。无物堪比伦。教我如何说。寒山子劳而无功。更有个拾得。道不识这个意。修行徒苦辛。恁么说话。自救不了。寻常拈粪箕。把扫帚。掣风掣颠。犹较些子。直饶是文殊普贤再出。若到洞山门下。一时分付与直岁。烧火底烧火。扫地底扫地。前廊后架。切忌搀匙乱箸。丰干老人更不饶舌。参退。吃茶
  ref: X80n1565_p0681a14（五灯会元）
- text: 上堂。一生二。二生三。遏捺不住。廓周沙界。德云直上妙峰。善财却入楼阁。新妇骑驴阿家牵。山青水绿。桃华红。李华白。一尘一佛土。一叶一释迦。乃合掌曰。不审诸佛子。今晨改旦。季春极暄。起居轻利。安乐行否。少间专到上寮问讯。不劳久立
  ref: X80n1565_p0681a14（五灯会元）
- text: 上堂。腊月二十日。一年将欲尽。万里未归人。大众。总是他乡之客。还有返本还源者么。击拂子曰。门前残雪日轮消。室内红尘遣谁扫
  ref: X80n1565_p0681a14（五灯会元）
