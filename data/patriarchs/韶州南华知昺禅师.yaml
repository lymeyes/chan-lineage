id: 韶州南华知昺禅师
name: 韶州南华知昺
school: 杨岐派
teacher: 太平懃
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0772a11。
sayings:
- text: 上堂。此事最希奇。不碍当头说。东邻田舍翁。随例得一橛。非唯贯声色。亦乃应时节。若问是何宗。八字不著人。击禅床。下座
  ref: X80n1565_p0772a11（五灯会元）
- text: 上堂。日日说。时时举。似地擎山争几许。陇西鹦鹉得人怜。大都祇为能言语。休思惟。带伴侣。智者聊闻猛提取。更有一般也大奇。猫儿偏解捉老鼠
  ref: X80n1565_p0772a11（五灯会元）
- text: 上堂。以拄杖向空中搅曰。搅长河为酥酪。𫚥蟹犹自眼搭眵。卓一下曰。变大地作黄金。穷汉依前赤骨力。为复自家无分。为复不肯承当。可中有个汉荷负得行。多少人失钱遭罪。再卓一下曰。还会么。宝山到也须开眼。勿使忙忙空手回
  ref: X80n1565_p0772a11（五灯会元）
- text: 上堂。春光烂熳华争发。子规啼落西山月。侨梵钵提长吐舌。底事分明向谁说。嗄
  ref: X80n1565_p0772a11（五灯会元）
- text: 上堂。迷不自迷。对悟立迷。悟不自悟。因迷说悟。所以悟为迷之体。迷为悟之用。迷悟两无从。个中无别共。无别共。拨不动。祖师不将来。鼻孔千斤重
  ref: X80n1565_p0772a11（五灯会元）
