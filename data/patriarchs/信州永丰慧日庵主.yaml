id: 信州永丰慧日庵主
name: 信州永丰慧日
school: —
teacher: 云居祐
status: draft
bio: 本郡丘氏子。丱岁出家。于明心寺得度。自机契云居熟游湘汉。暨归永丰或处岩谷或居𮠔市。令乡民称丘师伯。凡有所问以莫晓答之。忽语邑人曰。吾明日行脚去。汝等可来相送。于是赆路者毕集。师笑不已。众问其故。即书偈曰。丘师伯莫晓。寂寂明皎皎。日午打三更。谁人打得了。投笔而逝
