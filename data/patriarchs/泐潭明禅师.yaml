id: 泐潭明禅师
name: 泐潭明
school: 杨岐派
teacher: 太平慧懃禅师
status: draft
bio: 一日下到客位。众请师归方丈。师曰。道得即去。时牟和尚对曰。大众请。师乃上法堂
sayings:
- text: 僧问。非思量处识情难测时如何。师曰。我不欲违古人。曰。不违古人意作么生。师曰。也合消得汝三拜
  ref: X80n1565_p0209b11（五灯会元）
- text: 僧问。碓捣磨磨。不得忘却。此意如何。师曰。虎口里活雀儿
  ref: X80n1565_p0209b11（五灯会元）
- text: 问。定慧不生时如何。师曰。铁牛草上卧。昏昏不举头
  ref: X80n1565_p0209b11（五灯会元）
- text: 问。如何是道者。师曰。毛毶毶地。曰。如何是道者家风。师曰。佛殿前逢尊者
  ref: X80n1565_p0209b11（五灯会元）
- text: 问。如何是和尚终日事。师曰。钵盂里无折箸。曰。如何是沙门日用事。师曰。轰轰不借万人机
  ref: X80n1565_p0209b11（五灯会元）
