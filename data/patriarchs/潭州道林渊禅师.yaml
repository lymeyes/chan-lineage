id: 潭州道林渊禅师
name: 潭州道林渊
school: 杨岐派
teacher: 大沩果禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0823b03。
sayings:
- text: 僧问。钟未鸣。鼓未响。拓钵向甚么处去。德山便低头归方丈。意旨如何。师曰。奔电迸火。曰。岩头道。这老汉未会末后句在。又作么生。师曰。相随来也。曰。岩头密启其意。未审那里是他密启处。师曰。万年松在祝融峰。曰。虽然如是。祇得三年。三年后果迁化。还端的也无。师曰。嚤呢哒啝吽㗶咤。临示寂
  ref: X80n1565_p0823b03（五灯会元）
- text: 上堂拈拄杖示众曰。离却色声言语。道将一句来。众无对。师曰。动静声色外。时人不肯对。世间出世间。毕竟使谁会。言讫。倚杖而逝
  ref: X80n1565_p0823b03（五灯会元）
