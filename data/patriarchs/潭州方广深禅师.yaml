bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0783a13。
sayings:
- text: 僧问。一法若有。毗卢堕在凡夫。万法若无。普贤失其境界。未审意旨如何。师曰。富嫌千口少。贫恨一身多
