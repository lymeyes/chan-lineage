id: L::司空山本净禅师者
name: 司空山本净
school: —
teacher: 六祖大鉴旁出
status: draft
bio: 绛州人也。姓张氏。幼岁披缁于曹谿之室。受记隶司空山无相寺。唐天宝三年玄宗遣中使杨光庭入山。采常春藤。因造丈室。礼问曰。弟子慕道斯久。愿和尚慈悲。略垂开示。师曰。天下禅宗硕学。咸会京师。天使归朝。足可咨决。贫道隈山傍水。无所用心。光庭泣拜。师曰。休礼贫道。天使为求佛邪。问道邪。曰。弟子智识昏昧。未审佛之与道。其义云何。师曰。若欲求佛。即心是佛。若欲会道。无心是道。曰。云何即心是佛。师曰。佛因心悟。心以佛彰。若悟无心。佛亦不有。曰。云何无心是道。师曰。道本无心。无心名道。若了无心。无心即道。光庭作礼。信受。既回阙庭。具以山中所遇奏闻。即𠡠光庭诏师到京。𠡠住白莲亭。越明年正月十五日。召两街名僧硕学赴内道场。与师阐扬佛理。时有远禅师者。抗声谓师曰。今对圣上。较量宗旨。应须直问直答。不假繁辞。只如禅师所见。以何为道。师曰。无心是道。远曰。道因心有。何得言无心是道。师曰。道本无名。因心名道。心名若有。道不虗然。穷心既无。道凭何立。二俱虗妄。总是假名。远曰。禅师见有身心。是道已否。师曰。山僧身心本来是道。远曰。适言无心是道。今又言身心本来是道。岂不相违。师曰。无心是道。心泯道无。心道一如。故言无心是道。身心本来是道。道亦本是身心。身心本既是空。道亦穷源无有。远曰。观禅师形质甚小。却会此理。师曰。大德只见山僧相。不见山僧无相。见相者是大德所见。经云。凡所有相。皆是虗妄。若见诸相非相。即见其道。若以相为实。穷劫不能见道。远曰。今请禅师于相上说于无相。师曰。净名经云。四大无主。身亦无我。无我所见。与道相应。大德若以四大有主是我。若有我见。穷劫不可会道也。远闻语失色。逡巡避席。师有偈曰。四大无主复如水。遇曲逢直无彼此。净秽两处不生心。壅决何曾有二意。触境但似水无心。在世纵横有何事。复云。一大如是。四大亦然。若明四大无主。即悟无心。若了无心。自然契道。志明禅师
sayings:
- text: 问。若言无心是道。瓦砾无心亦应是道。又曰。身心本来是道。四生十类皆有身心。亦应是道。师曰。大德若作见闻觉知解会。与道悬殊。即是求见闻觉知之者。非是求道之人。经云。无眼．耳．鼻．舌．身．意。六根尚无。见闻觉知凭何而立。穷本不有。何处存心。焉得不同草木瓦砾。明杜口而退。师有偈曰。见闻觉知无障碍。声香味触常三昧。如鸟空中只么飞。无取无舍无憎爱。若会应处本无心。始得名为观自在。真禅
  ref: X80n1565_p0063a12（五灯会元）
- text: 师问。道既无心。佛有心否。佛之与道。是一是二。师曰。不一不二。曰。佛度众生。为有心故。道不度人。为无心故。一度一不度。何得无二。师曰。若言佛度众生．道无度者。此是大德妄生二见。如山僧即不然。佛是虗名。道亦妄立。二俱不实。总是假名。一假之中。如何分二。曰。佛之与道。总是假名。当立名时。是谁为立。若有立者。何得言无。师曰。佛之与道。因心而立。推穷立心。心亦是无。心既是无。即悟二俱不实。知如梦幻。即悟本空。彊立佛道二名。此是二乘人见解。师乃说无修无作偈曰。见道方修道。不见复何修。道性如虗空。虗空何所修。遍观修道者。拨火觅浮沤。但看弄傀儡。线断一时休。法空禅
  ref: X80n1565_p0063a12（五灯会元）
- text: 师问。佛之与道。俱是假名。十二分教。亦应不实。何以从前尊宿皆言修道。师曰。大德错会经意。道本无修。大德彊修。道本无作。大德彊作。道本无事。彊生多事。道本无知。于中强知。如此见解。与道相违。从前尊宿不应如是。自是大德不会。请思之。师有偈曰。道体本无修。不修自合道。若起修道心。此人不会道。弃却一真性。却入闹浩浩。忽逢修道人。第一莫向道。安禅
  ref: X80n1565_p0063a12（五灯会元）
- text: 师问。道既假名。佛云妄立。十二分教亦是接物度生。一切是妄。以何为真。师曰。为有妄故。将真对妄。推穷妄性本空。真亦何曾有故。故知真妄总是假名。二事对治。都无实体。穷其根本。一切皆空。曰。既言一切是妄。妄亦同真。真妄无殊。复是何物。师曰。若言何物。何物亦妄。经云。无相似。无比况。言语道断。如鸟飞空。安惭伏不知所措。师有偈曰。推真真无相。穷妄妄无形。返观推穷心。知心亦假名。会道亦如此。到头亦只宁。达性禅
  ref: X80n1565_p0063a12（五灯会元）
- text: 师问。禅师至妙至微。真妄双泯。佛道两亡。修行性空。名相不实。世界如幻。一切假名。作此解时。不可断绝众生善恶二根。师曰。善恶二根。皆因心有。穷心若有。根亦非虗。推心既无。根因何立。经云。善不善法。从心化生。善恶业缘。本无有实。师有偈曰。善既从心生。恶岂离心有。善恶是外缘。于心实不有。舍恶归何处。取善令谁守。伤嗟二见人。攀缘两头走。若悟本无心。始悔从前咎。又有近臣问曰。此身从何而来。百年之后复归何处。师曰。如人梦时。从何而来。睡觉时。从何而去。曰。梦时不可言无。既觉不可言有。虽有有无。来往无所。师曰。贫道此身。亦如其梦。师有偈曰。视生如在梦。梦里实是闹。忽觉万事休。还同睡时悟。智者会悟梦。迷人信梦闹。会梦如两般。一悟无别悟。富贵与贫贱。更无分别路。上元二年归寂。谥大晓禅师
  ref: X80n1565_p0063a12（五灯会元）
