bio: 生平部分原文未载，仅存机缘语（见下）；据《续传灯录》T51n2077_p0530a16。
sayings:
- text: 僧问。临云阁耸太白峰高。到这里如何进步。师曰。但寻荒草际。莫问白云深。曰未审如何话会。师曰。寒山逢拾得两个一时痴。曰向上宗乘又且如何举唱。师曰。前言不及后语
  ref: T51n2077_p0530a16（续传灯录）
- text: 上堂。也大奇也大差。十个指头八个罅。由来多少分明。不用赞龟打瓦。便下座
  ref: T51n2077_p0530a16（续传灯录）
