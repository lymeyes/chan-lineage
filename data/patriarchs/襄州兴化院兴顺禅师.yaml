id: 襄州兴化院兴顺禅师
name: 襄州兴化院兴顺
school: 云门宗
teacher: 巴陵鉴
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0580a10。
sayings:
- text: 僧问。如何是和尚深深处。师曰。举即易。答即难。曰。为甚么如此。师曰。过去
  ref: X80n1565_p0580a10（五灯会元）
- text: 问。如何是百千妙门。同归方寸。师曰。水底看夜市
  ref: X80n1565_p0580a10（五灯会元）
- text: 问。如何是向上事。师曰。楚山头指天
  ref: X80n1565_p0580a10（五灯会元）
