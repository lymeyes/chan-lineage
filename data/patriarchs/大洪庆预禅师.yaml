bio: 生平部分原文未载，仅存机缘语（见下）；据《续传灯录》T51n2077_p0580c09。
sayings:
- text: 上堂。进一步践他国王水草。退一步踏他祖父田园。不进不退正在死水中。还有出身之路也无。萧骚晚籁松钗短。游漾春风柳线长
  ref: T51n2077_p0580c09（续传灯录）
- text: 上堂。举船子嘱夹山曰。直须藏身处无踪迹。无踪迹处莫藏身。吾在药山三十年只明此事。今时人为甚么却造次。丹山无彩凤。宝殿不留冠。有时憨有时痴。非我途中争得知
  ref: T51n2077_p0580c09（续传灯录）
