id: 宣州兴教院坦禅师
name: 宣州兴教院坦
school: —
teacher: 琅邪觉禅师
status: draft
bio: 永嘉牛氏子。业打银。因淬砺瓶器有省。即出家。参琅邪。机语顿契。后依天衣怀禅师。时住兴教。擢为第一座。衣受他请。欲闻州乞师继之。时刁景纯学士守宛陵。衣恐刁涉外议。乃于观音前祝曰。若坦首座道眼明白。堪任住持。愿示梦于刁学士。刁夜梦牛在兴教法座上。衣凌晨辞州。刁举所梦。衣大笑。刁问其故。衣曰。坦首座姓牛。又属牛。刁就座出帖请之。师受请升座。有雪窦化主省宗出
sayings:
- text: 问。诸佛未出世。人人鼻孔辽天。出世后为甚么杳无消息。师曰。鸡足峰前风悄然。宗曰。未在更道。师曰。大雪满长安。宗曰。谁人知此意。令我忆南泉。拂袖归众。更不礼拜。师曰。新兴教今日失利。便归方丈。令人请宗至。师曰。适来错祇对一转语。人天众前何不礼拜葢覆却。宗曰。大丈夫膝下有黄金。争肯礼拜无眼长老。师曰。我别有语在。宗乃理前语。至未在更道处。师曰。我有三十棒寄你打雪窦。宗乃礼拜
