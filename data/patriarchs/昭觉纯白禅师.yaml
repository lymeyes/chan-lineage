id: 昭觉纯白禅师
name: 昭觉纯白
alias: 昭觉白
school: 黄龙派
teacher: 黄檗胜禅师
status: draft
bio: 梓州飞乌人姓支氏。父谦闻法于松山道者。以死生为戏。白衣梵行缁俗无出其右者。尝云。吾根钝不得入圆顿。愿有子续佛慧命足矣。师少闻父诲。谛听沈思有如夙习。一日跃过溪忽有省不觉失笑。送往依峨眉山华严寺落发受具。父子相与遍历成都讲肆。通性相宗经论。去之南游首谒澧州太平俊禅师。俊大奇之。谓真吾法子也。付以十三条说法大衣。师逊却之。后诣黄蘗山礼真觉胜禅师亲近岁余。未始一顾师奉事益勤。胜一日忽擡眸视之。师咄曰。这老汉把不定作么。胜大笑乃为印证心地。元丰末宗室南康郡王。自黄蘗邀胜诣辇下。师侍行。未几会太学生上书讼博士者。语连胜有旨放归蜀。门人星散。独师负巾钵以从。会成都府帅奏改昭觉为十方。问真觉谁可住持。真觉以师应请。师既领院遵南方规范一变律居
sayings:
- text: 上堂示众有曰。不超性海是理事缚。不透声轮是语言缚。于是蜀之净侣靡然向风。经肆讲席为之一空。朝散郎冯敢。奉议郎段玘。天台山隐者宋放。唐安文士相里昱。皆抠衣执弟子礼。元祐末峨眉白水僧正阙。丞相蔡京时帅成都。命师住。师不乐遂并昭觉辞之。蔡察其诚复请归旧刹。益建立纲宗孤硬峭整。大为同辈所嫉谤讟盈路。师不恤也久而自定。师示疾以颂付小师宗显曰。风高月冷。水远天长。出门无影。四面八方。怡然而寂。俗寿五十九。坐三十四夏。小师得法出世者曰宗显宗化。嗣法者曰剑州元封常照邛州铁像子嵩。师于昭觉为第一代。塔至今存焉
