id: 潭州谷山丰禅师
name: 潭州谷山丰
school: 云门宗
teacher: 云门偃
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0571b07。
sayings:
- text: 僧问。师唱谁家曲。宗风嗣阿谁。师曰。雪岭梅花绽。云洞老僧惊
  ref: X80n1565_p0571b07（五灯会元）
- text: 上堂。骏马机前异。游人肘后悬。既参云外客。试为老僧看。时有僧才出。师便打。曰。何不早出头来。便下座
  ref: X80n1565_p0571b07（五灯会元）
