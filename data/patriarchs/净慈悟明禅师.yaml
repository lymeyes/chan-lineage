sayings:
- text: 上堂举。夹山会下一僧到高亭才礼拜。亭便打
  ref: T51n2077_p0709a17（续传灯录）
- text: 僧云。特来礼拜师何打。又拜。亭又打趁出。僧回举似夹山。山云。会么。云不会。山云。赖汝不会。汝若会即夹山口哑去。应庵拈云。高亭一期忍俊不禁。争奈拄杖放行太速。这僧当时若是个汉。莫道高亭夹山便是。达磨大师出来也斩为三段。何故家肥生孝子。国伯有谋臣。拈云。高亭夹山门庭施设各得其宜。但中间一人较些子。应庵与么道。也是巩县茶瓶。师尝纂修联灯会要传于丛林
  ref: T51n2077_p0709a17（续传灯录）
