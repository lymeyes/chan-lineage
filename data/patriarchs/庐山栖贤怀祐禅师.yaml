id: 庐山栖贤怀祐禅师
name: 庐山栖贤怀祐
school: 青原系
teacher: 石霜诸禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0197a05。
sayings:
- text: 僧问。如何是五老峰前事。师曰。万古千秋。曰。恁么则成绝嗣去也。师曰。踌躇欲与谁
  ref: X80n1565_p0197a05（五灯会元）
- text: 问。自远趋风。请师激发。师曰。他不凭时。曰。请师凭时。师曰。我亦不换
  ref: X80n1565_p0197a05（五灯会元）
- text: 问。如何是法法无差。师曰。雪上更加霜
  ref: X80n1565_p0197a05（五灯会元）
- text: 上堂。若会此个事。无有下口处
  ref: X80n1565_p0197a05（五灯会元）
- text: 问。如何是祖师西来意。师曰。井底寒蟾。天中明月
  ref: X80n1565_p0197a05（五灯会元）
