sayings:
- text: 僧问。紫金莲捧千轮足。白玉毫辉万德身。如何是佛。师曰。拖枪带甲。曰。贯花千偈虽殊品。标月还归理一如。如何是法。师曰。元丰条。绍兴令。曰。林下雅为方外客。人间堪作火中莲。如何是僧。师曰。披席把椀
  ref: X80n1565_p0648a07（五灯会元）
