bio: 杭州报慈院从瑰禅师，福州陈氏子。师承法眼宗长庆慧棱，为法眼一脉在杭州的重要传人。
sayings:
- text: 僧问：「承古有言，今人看古教，未免心中闹。欲免心中闹，应须看古教。如何是古教？」师曰：「如是我闻。」曰：「如何是心中闹？」师曰：「那畔雀儿声。」
  ref: 五灯会元·卷八·报慈从瑰禅师
