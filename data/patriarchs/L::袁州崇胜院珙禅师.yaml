id: L::袁州崇胜院珙禅师
name: 袁州崇胜院珙
school: 杨岐派
teacher: 白云端
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0735b09。
sayings:
- text: 上堂。举石巩张弓架箭接机公案。颂曰。三十年来握箭弓。三平才到擘开𮌎。半个圣人终不得。大颠弦外几时逢。提刑郭祥正提刑郭祥正字功甫。号净空居士。志乐泉石。不羡纷华。因谒白云。云
  ref: X80n1565_p0735b09（五灯会元）
- text: 上堂曰。夜来枕上作得个山颂。谢功甫大儒。庐山二十年之旧。今日远访白云之勤。当须举与大众。请已后分明举似诸方。此颂岂唯谢功甫大儒。直要与天下有鼻孔衲僧脱却著肉汗衫。莫言不道。乃曰。上大人。丘乙己。化三千。七十士。尔小生。八九子。佳作仁。可知礼也。公切疑。后闻小儿诵之。忽有省。以书报云。云以偈答曰。藏身不用缩头。敛迹何须收脚。金乌半夜辽天。玉兔赶他不著。元祐中往衢之南禅。谒泉万卷。请升座。公趋前拈香曰。海边枯木。入手成香。𦶟向炉中。横穿香积如来鼻孔。作此大事。须是对众白过始得。云居老人有个无缝布衫。分付南禅。禅师著得不长不短。进前则诸佛让位。退步则海水澄波。今日嚬呻。六种震动。遂召曰。大众。还委悉么。有意气时添意气。不风流处也风流。泉曰。𮞏相钝置。公曰。因谁致得。崇宁初。到五祖。命祖升座。公趋前拈香曰。此一瓣香。𦶟向炉中。供养我堂头法兄禅师。伏愿于方广座上。擘开面门。放出先师形相。与他诸人描邈。何以如此。白云岩畔旧相逢。往日今朝事不同。夜静水寒鱼不食。一炉香散白莲峰。祖遂云。曩谟萨怛哆钵啰野。恁么恁么。几度白云谿上望黄梅。华向雪中开。不恁么不恁么。嫩柳垂金线。且要应时来。不见庞居士问马大师云。不与万法为侣者。是甚么人。大师云。待汝一口吸尽西江水。即向汝道。大众。一口吸尽西江水。万丈深潭穷到底。掠彴不是赵州桥。明月清风安可比。后又到保宁。亦请升座。公拈香曰。法鼓既鸣。宝香初𦶟。杨岐顶𩕳门。请师重著楔。保宁卓拄杖一下。曰。著楔已竟。大众证明。又卓一下。便下座。又到云居。请佛。印升座。公拈香曰。觉地相逢一何早。鹘臭布衫今脱了。要识云居一句玄。珍重后园驴吃草。召大众曰。此一瓣香。熏天炙地去也。印曰。今日不著便。被这汉当面涂糊。便打。乃曰。谢公千里来相访。共话东山竹径深。借与一龙骑出洞。若逢天旱便为霖。掷拄杖下座。公拜起。印曰。收得龙么。公曰。已在这里。印曰。作么生骑。公摆手作舞便行。印拊掌曰。祇有这汉。犹较些子
  ref: X80n1565_p0735b09（五灯会元）
