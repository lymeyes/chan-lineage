id: 大洪守遂禅师
name: 大洪守遂
alias: 大洪遂
school: 法眼宗
teacher: 大洪报恩禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0538a15。
sayings:
- text: 上堂召大众。一拳拳倒黄鹤楼。一踏踏翻鹦鹉洲。惯向高楼骤玉马。曾于急水打金球。然虽恁么。争奈有五色丝绦系手脚。三鑐金锁锁咽喉。直饶锤碎金锁。割断丝绦。须知更有一重碍汝在。且道如何是那一重。还会么。善吉维摩谈不到。目连鹙子看如盲
  ref: X80n1565_p0538a15（五灯会元）
- text: 上堂。举。李刺史问药山。何姓。山曰。正是时。李罔测。乃问院主。某甲适来问长老何姓。答道正是时。的当是姓甚么。主曰。祇是姓韩。山闻曰。若六月对他。便道姓热也。又。岩头问讲僧。见说大德会教。是否。曰。不敢。岩头举拳曰。是甚么教。曰。是权教。头曰。苦哉。我若展脚问你。不可道是脚教也。师曰。奇怪二老宿有杀人刀。有活人剑。一转语似石上栽花。一转语似空中挂剑。当时若无后语。达磨一宗扫土而尽。诸人要见二老宿么。宁可截舌。不犯国讳。青原下十三世青原下十三世
  ref: X80n1565_p0538a15（五灯会元）
