id: 宝峰惟照禅师
name: 宝峰惟照
alias: 宝峰照
school: 曹洞宗
teacher: 芙蓉道楷禅师
status: draft
bio: 简州李氏子。幼超迈而恶俗。一日授书。至性相近也习相远也。遽曰。凡圣本一体。以习故差别。我知之矣。即趋成都师鹿苑清泰。年十九剃染登具。泰令听起信于大慈。师辄归卧。泰诘之。师曰。既称正信大乘。岂言说所能了。乃虚心游方谒芙蓉于大洪。尝夜坐阁道。适风雪震薄闻警盗者传呼过之。随有所得辞去。大观中芙蓉婴难。师自三吴欲趍沂水。仆夫迷道师举杖击之。忽大悟叹曰。是地非鳌山也邪。北至沂芙蓉望而喜曰。绍隆吾宗必子数辈矣。因留躬畔湖上累年。智证成就出领招提。迁甘露三祖。宣和壬寅诏补圆通。弃去复居泐潭
sayings:
- text: 上堂。古佛道。我初成正觉亲见大地众生悉皆成正觉。后来又道。深固幽远无人能到。㘞没见识汉好龙头蛇尾。便下座
  ref: T51n2077_p0544b13（续传灯录）
- text: 上堂。过去诸佛已入涅槃了也。汝等诸人不应追念。未来诸佛未出于世。汝等诸人不要妄想。正当今日尔是何人参
  ref: T51n2077_p0544b13（续传灯录）
- text: 上堂。伯夷隘柳下惠不恭。君子不由也。二边不立中道不安时作么生。拈拄杖曰鸳鸯绣出从君看。不把金针度与人
  ref: T51n2077_p0544b13（续传灯录）
- text: 上堂。太阳门下妙唱弥高。明月堂前知音盖寡。不免舟横江渚棹举清波。唱庆尧年和清平乐。如斯告报普请承当。拟议之间白云万里
  ref: T51n2077_p0544b13（续传灯录）
- text: 上堂。本自不生今亦无灭。是死不得底样子。当处出生随处灭尽。是含生受底规模。大丈夫汉直须处生死流卧荆棘林俯仰屈伸随机施设。能如是也无量方便庄严三昧大解脱门荡然顿开。其或未然无量烦恼一切尘劳岳立面前塞却古路
  ref: T51n2077_p0544b13（续传灯录）
- text: 上堂。古人道。堕肢体黜聪明离形去智同于大道。正当恁么时且道。是甚么人删诗书定礼乐。还委悉么。礼云礼云玉帛云乎哉。乐云乐云钟鼓云乎哉。问承师有言。云黯黯处独秀峰挺出。月朦朦里泐潭水光生。岂不是宝峰境。师曰。若是宝峰境凭君仔细看。曰如何是境中人。师曰。看取令行时。曰只如承言须会宗勿自立规矩。如何是和尚宗。师曰。须知云外千峰上。别有灵松带露寒。雪下
  ref: T51n2077_p0544b13（续传灯录）
- text: 僧问。祖师西来即不
  ref: T51n2077_p0544b13（续传灯录）
- text: 问。时节因缘事若何。师曰。一片两片三四片落在眼中犹不荐。建炎二年正月七日示寂。阇维得设利如珠琲。舌齿不坏。塔于寺之西峰
  ref: T51n2077_p0544b13（续传灯录）
