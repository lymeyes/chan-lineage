id: 临济玄禅师
name: 临济义玄
honorific: 临济义玄禅师 · 慧照禅师（谥）
school: 临济宗
dynasty: 唐
region: 镇州临济院
teacher: 黄檗希运
source_ref: 五灯会元·卷十一·临济义玄 / 镇州临济慧照禅师语录（临济录）
cbeta: T47n1985（临济慧照禅师语录）
bio: 曹州南华邢氏子，参黄檗希运，三问「佛法大意」三度被打，后谒大愚，言下大悟，还黄檗，机锋迅捷。后住镇州临济院，创立临济宗，门风峻烈，立「四料简」「四宾主」「四照用」「三句」「三玄三要」，并以「喝」接人（四喝），为五家七宗中兴化最盛、影响最巨者，后衍杨岐、黄龙二派。
sayings:
- text: 「遇佛杀佛，遇祖杀祖，遇罗汉杀罗汉，遇父母杀父母，遇眷属杀眷属，始得解脱。」
  ref: 临济录
- text: 四料简：「我有时夺人不夺境，有时夺境不夺人，有时人境俱夺，有时人境俱不夺。」
  ref: 临济录·四料简
- text: 「佛法无用功处，只是平常无事，屙屎送尿，著衣吃饭，困来即卧。」
  ref: 五灯会元·卷十一·临济义玄
- text: 「赤肉团上有一无位真人，常从汝等诸人面门出入；未证据者，看！看！」（无位真人）
  ref: 临济录 / 五灯会元·卷十一·临济义玄
- text: 四喝：「有时一喝如金刚王宝剑，有时一喝如踞地金毛师子，有时一喝如探竿影草，有时一喝不作一喝用。」
  ref: 临济录·四喝
