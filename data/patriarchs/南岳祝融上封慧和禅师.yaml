id: 南岳祝融上封慧和禅师
name: 南岳祝融上封慧和
school: 黄龙派
teacher: 宝峰文
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0682a10。
sayings:
- text: 上堂。未升此座已前。尽大地人成佛已毕。更有何法可说。更有何生可利。况菩提烦恼。本自寂然。生死涅槃。犹如昨梦。门庭施设。诳謼小儿。方便门开。罗纹结角。于衲僧面前。皆成幻惑。且道衲僧有甚么长处。拈起拄杖曰。孤根自有擎天势。不比寻常曲录枝。卓拄杖。下座
  ref: X80n1565_p0682a10（五灯会元）
