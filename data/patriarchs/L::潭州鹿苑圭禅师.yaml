id: L::潭州鹿苑圭禅师
name: 潭州鹿苑圭
school: 云门宗
teacher: 德山远
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0595a05。
sayings:
- text: 僧问。如何是道。师曰。吴头楚尾。曰。如何是道中人。师曰。骑马踏镫。不如步行
  ref: X80n1565_p0595a05（五灯会元）
- text: 问。如何是第一义谛。师曰。胡人读汉书
  ref: X80n1565_p0595a05（五灯会元）
- text: 上堂。凡有因缘。须晓其宗。若晓其宗。无是无不是。用则波腾海沸。全真体以运行。体则镜净水沉。举随缘而会寂。且道兜率天宫。几人行几人坐。若向这里辩得缁素。许你诸人东西南北。如云似鹤。于此不明。踏破草鞋。未有了日在。参。青原下十世上青原下十世上
  ref: X80n1565_p0595a05（五灯会元）
