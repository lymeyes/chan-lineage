id: 百丈怀海禅师
name: 百丈怀海
honorific: 百丈怀海禅师 · 大智禅师（谥）
school: 南岳系
dynasty: 唐
region: 洪州百丈山（大雄山）
teacher: 马祖道一禅师
source_ref: 五灯会元·卷三·洪州百丈怀海 / 景德传灯录·卷六
cbeta: T51n2076 卷六
bio: 福州长乐王氏子，马祖弟子。住洪州百丈山，折衷大小乘戒律，别立禅门规式，世称《百丈清规》，创「丛林」集体修学制度，定「一日不作、一日不食」之农禅家风，垂为后世禅寺轨范。黄檗希运、沩山灵祐出其门下。
sayings:
- text: 「一日不作，一日不食。」（师躬耕不厌，弟子藏其农具，师遂不食以明志。）
  ref: 五灯会元·卷三·百丈怀海 / 景德传灯录·卷六
- text: 野狐禅公案：僧曰「大修行人还落因果也无？」师答「不昧因果」，僧遂脱野狐身。示「不落因果」落空，「不昧因果」了了。
  ref: 五灯会元·卷三·百丈怀海
