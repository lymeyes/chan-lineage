id: L::韶州白云闻禅师
name: 韶州白云闻
school: 云门宗
teacher: 云门偃
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0569b15。
sayings:
- text: 问。白云一路。全因今日。师曰。不是。不是。曰。和尚又如何。师曰。白云一路。草深一丈。便下座
  ref: X80n1565_p0569b15（五灯会元）
- text: 问。拟伸一问。师还答否。师曰。皂荚树头悬。风吹曲不成
  ref: X80n1565_p0569b15（五灯会元）
- text: 问。受施主供养。将何报答。师曰。作牛作马
  ref: X80n1565_p0569b15（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0569b15），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
