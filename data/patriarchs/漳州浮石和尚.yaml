bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0157b18。
sayings:
- text: 上堂。山僧开个卜铺。能断人贫富。定人生死
  ref: X80n1565_p0157b18（五灯会元）
- text: 僧问。离却生死贫富。不落五行。请师直道。师曰。金木水火土
  ref: X80n1565_p0157b18（五灯会元）
