id: L::襄州鹫岭善本禅师
name: 襄州鹫岭善本
school: 青原系
teacher: 思明
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0217b09。
sayings:
- text: 僧问。和尚是离垢人。为甚么却浴。师曰。定水湛然满。浴此无垢人
  ref: X80n1565_p0217b09（五灯会元）
- text: 问。祖意教意。是同是别。师曰。鹫岭峰上。青草参天。鹿野苑中。狐兔交横。青原下七世青原下七世
  ref: X80n1565_p0217b09（五灯会元）
