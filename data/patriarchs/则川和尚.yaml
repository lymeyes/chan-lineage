id: 则川和尚
name: 则川
school: 南岳系
teacher: 马祖一
status: draft
bio: 蜀人也。庞居士相看次。师曰。还记得见石头时道理否。士曰。犹得阿师重举在。师曰。情知久参事慢。士曰。阿师老耄。不啻庞公。师曰。二彼同时。又争几许。士曰。庞公鲜徤。且胜阿师。师曰。不是胜我。祇欠汝个幞头。士拈下幞头曰。恰与师相似。师大笑而已。师摘茶次。士曰。法界不容身。师还见我否。师曰。不是老师洎答公话。士曰。有问有答。葢是寻常。师乃摘茶不听。士曰。莫怪适来容易借
sayings:
- text: 问。师亦不顾。士喝曰。这无礼仪老汉。待我一一举向明眼人。师乃抛却茶篮。便归方丈
