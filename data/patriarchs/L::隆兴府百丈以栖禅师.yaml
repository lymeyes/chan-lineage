sayings:
- text: 上堂。摩腾入汉。达磨来梁。途辙既成。后代儿孙开眼迷路。若是个惺惺底。终不向空里采华。波中捉月。谩劳心力。毕竟何为。山僧今日已是平地起骨堆。诸人行时。各自著精彩看
