id: 越州云门灵侃禅师
name: 越州云门灵侃
school: 云门宗
teacher: 天衣义怀禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0622b08。
sayings:
- text: 僧问。十二时中。如何用心。师曰。佛殿里烧香。曰。学人不会。师曰。三门头合掌
  ref: X80n1565_p0622b08（五灯会元）
- text: 上堂。尘劳未破。触境千差。心鉴圆明。丝毫不立。灵光皎皎。独露现前。今古两忘。圣凡路绝。到这里始能卷舒自在。应用无亏。出没往还。人间天上。大众。虽然如是。忽被人把住。问你道拄杖子向甚么处著。又如何祇对。还有人道得么。出来道看。众无对。乃拍禅床。下座
  ref: X80n1565_p0622b08（五灯会元）
