bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0290a16。
sayings:
- text: 僧问。师登宝座。曲为今时。四众攀瞻。请师接引。师曰。甚么处屈汝。曰。恁么则垂慈方便路．直下不孤人也。师曰。也须收取好
  ref: X80n1565_p0290a16（五灯会元）
- text: 问。如何是漳江境。师曰。地藏皱眉。曰。如何是境中人。师曰。普贤敛袂
  ref: X80n1565_p0290a16（五灯会元）
- text: 问。如何是漳江水。师曰。苦
  ref: X80n1565_p0290a16（五灯会元）
- text: 问。如何是漳江第一句。师曰。到别处不得错举
  ref: X80n1565_p0290a16（五灯会元）
