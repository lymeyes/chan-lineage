id: L::漳州报恩院道熙禅师
name: 漳州报恩院道熙
school: —
teacher: 保福展
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《景德传灯录》T51n2076_p0383a18。
sayings:
- text: 问。漳南和尚近日还为人也无。师曰。若道为人即屈著和尚。若道不为人。又屈著太尉来
  ref: T51n2076_p0383a18（景德传灯录）
- text: 问。太尉曰。道取一句待铁牛能啮草木马解含烟。师曰。某甲借口吃饭。太尉良久又
  ref: T51n2076_p0383a18（景德传灯录）
- text: 问。驴来马来。师曰。驴马不同途。太尉曰。争得到遮里。师曰。特谢太尉领话
  ref: T51n2076_p0383a18（景德传灯录）
- text: 僧问。名言妙句即不
  ref: T51n2076_p0383a18（景德传灯录）
- text: 问。请师真实。师曰。不阻来意
  ref: T51n2076_p0383a18（景德传灯录）
