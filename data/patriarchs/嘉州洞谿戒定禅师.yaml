id: 嘉州洞谿戒定禅师
name: 嘉州洞谿戒定
school: 青原系
teacher: 洛浦安
status: draft
bio: 初问洛浦。月树无枝长覆荫。请师直指妙玄微。浦曰。森罗秀处。事不相依。渌水千波。孤峰自异。师于是领旨。住后
sayings:
- text: 僧问。蛇师为甚么被蛇吞。师曰。几度扣门招不出。将身直入里头看。有官人
  ref: X80n1565_p0215b11（五灯会元）
- text: 问。既是清净伽蓝。为甚打鱼鼓。师曰。直须打出青霄外。免见龙门点额人
  ref: X80n1565_p0215b11（五灯会元）
