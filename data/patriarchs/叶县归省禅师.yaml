id: 叶县归省禅师
name: 叶县归省
school: 临济宗
teacher: 首山省念禅师
bio: 首山省念禅师法嗣，住叶县（今河南叶县）。以严冷门风著称，浮山法远曾于其会下苦志参学。
sayings:
- text: 首山问：「近离甚处？」师曰：「襄城县。」山曰：「襄城县还有佛法也无？」师曰：「觅个无佛法底人难得。」山曰：「与你本分事作么生？」师曰：「如何是学人本分事？」山曰：「待结草庵向汝道。」
  ref: 五灯会元·卷十二·叶县归省禅师
- text: 师（叶县）上堂：「祖师心印，状似铁牛之机；去即印住，住即印破。」
  ref: 五灯会元·卷十二·叶县归省禅师
