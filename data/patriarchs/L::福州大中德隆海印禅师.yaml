id: L::福州大中德隆海印禅师
name: 福州大中德隆海印
school: 云门宗
teacher: 智海逸
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0625b15。
sayings:
- text: 上堂。法无异法。道无别道。时时逢见释迦。处处撞著达磨。放步即交肩。开口即𫜪破。不𫜪破。大小大
  ref: X80n1565_p0625b15（五灯会元）
- text: 上堂。夫欲智拔。先须定动。卓拄杖曰。唵苏𠰷．㗭唎娑婆诃。归堂吃茶
  ref: X80n1565_p0625b15（五灯会元）
- text: 上堂。触境无滞底。为甚么擡头不起。田地稳密底。为甚么下脚不得。譬如天王赐与华屋。虽获大宅。要因门入。乃曰。门𫆏。樊哙踏开真主出。巨灵擡手锦鳞喷。参
  ref: X80n1565_p0625b15（五灯会元）
- text: 上堂。平旦寅晓何人。处处弥陀佛。家家观世音。月里麒麟看北斗。向阳椑子一边青
  ref: X80n1565_p0625b15（五灯会元）
