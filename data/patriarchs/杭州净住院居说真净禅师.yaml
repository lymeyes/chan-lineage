bio: 参达观。遂问曰。某甲经论粗明。禅直不信。愿师决疑。观曰。既不信禅。岂可明经。禅是经纲。经是禅网。提纲正网。了禅见经。师曰。为某甲说禅看。观曰。向下文长。师曰。若恁么。经与禅乃一体。观曰。佛及祖非二法。如手搦拳。如拳搦手。师因而有省。乃成偈曰。二十余年用意猜。几番曾把此心灰。而今潦倒逢知己。李白元来是秀才
