- text: 僧问。佛以一大事因缘故出现于世。未审和尚出世如何。师曰。恰好。曰作么生。师曰。不好。景德传灯录景德传灯录吉州青原山行思禅师第九世下至第十一世第九世下金陵清凉文益禅师法嗣下三十三人苏州荐福绍明禅师泽州古贤谨禅师宣州兴福可勋禅师洪州上蓝守讷禅师抚州覆船和尚杭州奉先法瓌禅师庐山化城慧朗禅师杭州永明道鸿禅师高丽灵鉴禅师荆门上泉和尚庐山大林僧遁禅师池州仁王缘胜禅师庐山归宗义柔禅师已上一十三人见录泉州上方慧英禅师荆州护国迈禅师饶州芝岭照禅师庐山归宗师慧禅师庐山归宗省一禅师襄州延庆通性大师庐山归宗梦钦禅师洪州舍利玄阐禅师洪州永安明禅师洪州禅谿可庄禅师潭州石霜爽禅师江西灵山和尚庐山佛手岩因禅师金陵保安止和尚升州华严幽禅师袁州木平道达禅师洪州大宁道迈禅师楚州龙兴德宾禅师鄂州黄龙仁禅师洪州西山道耸禅师已上二十人无机缘语句不录襄州清谿洪进禅师法嗣二人相州天平山从漪禅师庐山圆通缘德禅师已上二人见录金陵清凉休复禅师法嗣二人金陵奉先慧同禅师一人见录庐山宝庆庵道习禅师一人无语句不录抚州龙济山绍修禅师法嗣一人河东广原和尚一人见录衡岳南台守安禅师法嗣二人襄州鹫岭善美禅师一人见录安州慧日院明禅师一人无机缘语句不录漳州报劬院玄应禅师法嗣一人报劬第二世仁义禅师一人无机缘语句不录漳州隆寿无逸禅师法嗣一人漳州隆寿法骞禅师一人见录庐山归宗道诠禅师法嗣一人筠州九峰义诠禅师一人见录眉州黄龙继达禅师法嗣一人第二世黄龙和尚一人见录朗州梁山缘观禅师法嗣一人郢州大阳山警玄禅师一人见录第十世天台山德韶国师法嗣四十九人杭州永明寺延寿禅师温州大宁可弘禅师苏州长寿朋彦大师杭州五云山志逢大师杭州报恩法端禅师杭州报恩绍安禅师福州广平守威禅师杭州报恩永安禅师广州光圣师护禅师杭州奉先清昱禅师天台普闻智勤禅师温州雁荡愿齐禅师杭州普门希辩禅师杭州光庆遇安禅师天台般若友蟾禅师婺州智者全肯禅师福州玉泉义隆禅师杭州龙册晓荣禅师杭州功臣庆萧禅师越州称心敬琎禅师福州严峰师术禅师潞州华严慧达禅师越州清泰道圆禅师杭州九曲庆祥禅师杭州开化行明大师越州开善义圆禅师温州瑞鹿遇安禅师杭州龙华慧居禅师婺州齐云遇臻禅师温州瑞鹿寺本先禅师已上三十人见录杭州报恩德谦禅师杭州灵隐处先禅师天台善建省义禅师越州观音安禅师婺州仁寿泽禅师越州云门重曜禅师越州大禹荣禅师越州地藏琼禅师杭州灵隐绍光禅师杭州龙华绍銮禅师越州碧泉行新禅师越州象田默禅师润州登云从坚禅师越州观音朗禅师越州诸暨五峰和尚越州何山道孜禅师越州大禹自广禅师筠州黄蘗师逸禅师苏州瑞光清表禅师已上一十九人无机缘语句不录杭州报恩寺慧明禅师法嗣一人福州保明道诚大师一人见录金陵报慈道场文遂导师法嗣五人常州齐云慧禅师洪州双岭祥禅师洪州观音真禅师洪州龙沙茂禅师洪州大宁奖禅师已上五人无机缘语句不录杭州永明道潜禅师法嗣三人杭州千光王瓌省禅师衡州镇境志澄大师明州崇福庆祥禅师已上三人见录杭州灵隐清耸禅师法嗣九人杭州功臣院道慈禅师秀州罗汉愿昭禅师处州报恩师智禅师衢州瀫宁可先禅师杭州光孝道端禅师杭州保清遇宁禅师福州支提辩隆禅师杭州瑞龙希圆禅师已上八人见录杭州国泰德文禅师一人无机缘语句不录金陵报慈行言导师法嗣二人洪州云居义能禅师一人见录饶州北禅清皎禅师一人无机缘语句不录金陵清凉泰钦禅师法嗣二人洪州云居道齐禅师一人见录庐山栖贤慧聪禅师一人无机缘语句不录金陵报恩法安禅师法嗣二人庐山栖贤道坚禅师庐山归宗第十四世慧诚禅师二人见录庐州长安院延规禅师法嗣二人庐州长安辩实禅师潭州云盖用清禅师已上二人见录第十一世杭州永明寺延寿禅师法嗣二人杭州富阳子蒙禅师杭州朝明院津禅师已上二人无机缘语句不录苏州长寿院朋彦大师法嗣一人长寿第二世法齐禅师杭州普门寺希辩禅师法嗣二人高丽国慧洪禅师越州上林胡智禅师已上二人无机缘语句不录行思禅师第九世下金陵清凉文益禅师法嗣
