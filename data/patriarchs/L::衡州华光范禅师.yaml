bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0497a12。
sayings:
- text: 僧问。如何是无缝塔。师指僧堂曰。此间僧堂无门户。问僧。曾到紫陵么。曰。曾到。师曰。曾到鹿门么。曰。曾到。师曰。嗣紫陵即是。嗣鹿门即是。曰。即今嗣和尚得么。师曰。人情不打即不可。便打
  ref: X80n1565_p0497a12（五灯会元）
- text: 问。非隐显处是和尚。那个是某甲。师曰。尽乾坤无一不是。曰。此犹是和尚。那个是某甲。师曰。木人石女笑分明
  ref: X80n1565_p0497a12（五灯会元）
