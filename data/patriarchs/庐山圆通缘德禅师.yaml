id: 庐山圆通缘德禅师
name: 庐山圆通缘德
school: —
teacher: 清谿进
status: draft
bio: 临安黄氏子。事本邑东山勤老宿剃染。遍游诸方。江南国王于卢山建院。请师开法
sayings:
- text: 上堂。诸上座。明取道眼。好是行脚本分事。道眼若未明。有甚么用处。祇是移盘吃饭汉。道眼若明。有何障碍。若未明得。强说多端也无用处。无事切须寻究
  ref: X80n1565_p0313b12（五灯会元）
- text: 僧问。如何是四不迁。师曰。地水火风
  ref: X80n1565_p0313b12（五灯会元）
- text: 问。如何是古佛心。师曰。水鸟树林。曰。学人不会。师曰。会取学人
  ref: X80n1565_p0313b12（五灯会元）
- text: 问。久负没弦琴。请师弹一曲。师曰。负来多少时也。曰。未审作何音调。师曰。话堕也。珍重
  ref: X80n1565_p0313b12（五灯会元）
- text: 问。如何是佛法大意。师曰。过去灯明佛。本光瑞如是。本朝遣帅问罪江南。后主纳土矣。而胡则者据守九江不降。大将军曹翰部曲渡江入寺。禅者惊走。师淡坐如平日。翰至。不起不揖。翰怒诃曰。长老不闻杀人不眨眼将军乎。师熟视曰。汝安知有不惧生死和尚邪。翰大奇。增敬而已。曰。禅者何为而散。师曰。击鼓自集。翰遣裨校击之。禅无至者。翰曰。不至。何也。师曰。公有杀心故尔。师自起击之。禅者乃集。翰再拜。问决胜之䇿。师曰。非禅者所知也。太平兴国二年十月七日。升堂曰。脱离世缘。乃在今日。嘱令门人垒青石为塔。乃曰。他日塔作红色。吾再至也。言讫而逝。谥道济禅师
  ref: X80n1565_p0313b12（五灯会元）
