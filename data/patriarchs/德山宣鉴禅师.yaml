id: 德山宣鉴禅师
name: 德山宣鉴
honorific: 德山宣鉴禅师 · 见性大师（谥）
school: 青原系
dynasty: 唐
region: 鼎州德山（乾明寺）
teacher: 龙潭崇信禅师
source_ref: 五灯会元·卷七·鼎州德山宣鉴 / 景德传灯录·卷十五
cbeta: T51n2076 卷十五
bio: 简州周氏子，初讲《金刚经》，人称「周金刚」，负疏钞出蜀欲破南方禅。至澧州，遇卖饼婆子以「过去心不可得、现在心不可得、未来心不可得，未审上座点那个心」勘之，遂焚疏钞，诣龙潭崇信，言下大悟。后住德山，倡「道得也三十棒，道不得也三十棒」，与临济之「喝」并称「临济喝、德山棒」，棒喝交驰，门风峻烈。
sayings:
- text: 示众：「道得也三十棒，道不得也三十棒。」（德山棒）
  ref: 五灯会元·卷七·德山宣鉴
