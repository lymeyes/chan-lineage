sayings:
- text: 上堂。若论此事。直下难明。三贤罔测。十圣不知。到这里须高提祖令。横按镆鎁。佛尚不存。纤尘何立。直教须弥粉碎。大海焦枯。放一线道与诸人商量。且道商量个甚么。良久曰。盐贵米贱
