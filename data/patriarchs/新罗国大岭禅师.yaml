id: 新罗国大岭禅师
name: 新罗国大岭
school: 青原系
teacher: 谷山藏禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0213b07。
sayings:
- text: 僧问。古人道。祇到潼关便即休。会了便休。未会便休。师曰。祇为迷途中活计。曰。离却迷途。还得其中活计也无。师曰。体即得。当即不得。曰。既是体得。为甚么当不得。师曰。体是甚么人分上事。曰。其中事如何。师曰。不作尊贵
  ref: X80n1565_p0213b07（五灯会元）
- text: 问。如何是一切处清净。师曰。截琼枝寸寸是宝。析旃檀片片皆香
  ref: X80n1565_p0213b07（五灯会元）
- text: 问。如何是用中无碍。师曰。一片白云缭乱飞
  ref: X80n1565_p0213b07（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0213b07），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
