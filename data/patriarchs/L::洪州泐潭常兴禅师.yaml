id: L::洪州泐潭常兴禅师
name: 洪州泐潭常兴
school: 南岳系
teacher: 马祖一
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0108a06。
sayings:
- text: 僧问。如何是曹谿门下客。师曰。南来燕。曰。学人不会。师曰。养羽候秋风
  ref: X80n1565_p0108a06（五灯会元）
- text: 问。如何是宗乘极则事。师曰。秋雨草离披。南泉至。见师面壁。乃拊师背
  ref: X80n1565_p0108a06（五灯会元）
- text: 师问。汝是阿谁。曰。普愿。师曰。如何。曰。也寻常。师曰。汝何多事
  ref: X80n1565_p0108a06（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0108a06），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
