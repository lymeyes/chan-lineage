bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0546a03。
sayings:
- text: 上堂。般若无知。应缘而照。山僧今日撒屎撒尿。这边放。那边屙。东山西岭笑呵呵。幸然一片清凉地。刚被熊峰染污他。染污他。莫啾唧。泥牛木马尽呵叱。过犯弥天且莫论。再得清明又何日。还会么。来年更有新条在。恼乱春风卒未休
  ref: X80n1565_p0546a03（五灯会元）
