id: L::镇州万寿和尚
name: 镇州万寿
school: 临济宗
teacher: 临济玄
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0397a12。
sayings:
- text: 僧问。如何是迦叶上行衣。师曰。鹤飞千点雪。云锁万重山
  ref: X80n1565_p0397a12（五灯会元）
- text: 问。如何是丈六金身。师曰。袖头打领。腋下剜襟。曰。学人不会。师曰。不会请人裁。师访宝寿。寿坐不起。师展坐具。寿下禅床。师却坐。寿骤入方丈。闭却门。知事见师坐不起。曰。请和尚库下吃茶。师乃归院。翌日。宝寿来复谒。师踞禅床。寿展坐具。师亦下禅床。寿却坐。师归方丈闭却门。寿入侍者寮。取灰围却方丈门。便归去。师遂开门见曰。我不恁么。他却恁么
  ref: X80n1565_p0397a12（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0397a12），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
