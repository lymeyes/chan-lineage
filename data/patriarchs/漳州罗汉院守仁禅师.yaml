id: 漳州罗汉院守仁禅师
name: 漳州罗汉院守仁
school: 法眼宗
teacher: 法眼文益禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0360b06。
sayings:
- text: 上堂。祇据如今。谁欠谁剩。然虽如此。犹是第二义门。上座若明达得去也。且是一是二。更须子细看
  ref: X80n1565_p0360b06（五灯会元）
- text: 僧问。如何是祖师西来的的意。师曰。即今是甚么意
  ref: X80n1565_p0360b06（五灯会元）
- text: 问。如何是涅槃。师曰。生死。曰。如何是生死。师曰。适来道甚么。僧众晚参。师曰。物物本来无处所。一轮明月印心池。便归方丈。次住报恩
  ref: X80n1565_p0360b06（五灯会元）
- text: 上堂。报恩这里不曾与人拣话。今日与诸上座拣一两则话。还愿乐么。诸上座。鹤胫长。凫胫短。甘草甜。黄蘗苦。恁么拣辨。还惬雅意么。诸上座。莫是血脉不通。泥水有隔么。且莫错会。珍重
  ref: X80n1565_p0360b06（五灯会元）
- text: 僧问。如何是西来意。师曰。唤甚么作西来意。曰。恁么则无西来也。师曰。由汝口头道
  ref: X80n1565_p0360b06（五灯会元）
- text: 问。如何是报恩家风。师曰。无汝著眼处
  ref: X80n1565_p0360b06（五灯会元）
- text: 问。学人未委禀承。请师方便。师曰。莫相孤负么。曰。恁么则有师资之分也。师曰。丛林见多
  ref: X80n1565_p0360b06（五灯会元）
- text: 问。如何是佛法大意。师曰。向汝道甚么
  ref: X80n1565_p0360b06（五灯会元）
- text: 问。如何是无生之相。师曰。舍身受身。曰。恁么则生死无过也。师曰。料汝恁么会。又曰。人人皆备理。一一尽圆常。僧便
  ref: X80n1565_p0360b06（五灯会元）
- text: 问。如何是圆常之理。师曰。无事不参差。曰。恁么则纵横法界也。师曰。巧道有何难
  ref: X80n1565_p0360b06（五灯会元）
- text: 问。如何是不到三寸。师曰。你问我答。问僧。甚么处来。曰。福州来。师曰。跋涉如许多山岭。阿那个是上座自己。曰。某甲亲离福州。师曰。祇恁么。别更有商量。曰。更作甚么商量。师曰。汝话堕也
  ref: X80n1565_p0360b06（五灯会元）
- text: 问。不昧缘尘。请师一接。师曰。唤甚么作缘尘。曰。若不伸
  ref: X80n1565_p0360b06（五灯会元）
- text: 问。焉息疑情。师曰。若不是今日。便作官方。抚州黄山良󱞢禅师吉州人也
  ref: X80n1565_p0360b06（五灯会元）
- text: 僧问。如何是黄山家风。师曰。筑著汝鼻孔
  ref: X80n1565_p0360b06（五灯会元）
- text: 问。如何是不迁义。师曰。春夏秋冬
  ref: X80n1565_p0360b06（五灯会元）
- text: 问。如何是一路涅槃门。师曰。汝问宗乘中一句。岂不是。曰。恁么则不哆哆。师曰。莫哆哆好
  ref: X80n1565_p0360b06（五灯会元）
- text: 问。众星攒月时如何。师曰。唤甚么作月。曰。莫祇这个便是也无。师曰。这个是甚么
  ref: X80n1565_p0360b06（五灯会元）
- text: 问。明镜当台。森罗为甚么不现。师曰。那里当台。曰。争奈即今何。师曰。又道不现
  ref: X80n1565_p0360b06（五灯会元）
