id: L::怀安军云顶德敷禅师
name: 怀安军云顶德敷
school: —
teacher: 护国远
status: draft
bio: 初参护国。问曰。直截根源佛所印。摘叶寻枝我不能时如何。国曰。罢攀云树三秋果。休弄碧潭孤月轮。师乃顿释所疑。住后。成都帅请就衙升座。有乐营将出。礼拜起。回顾下马台。曰。一口吸尽西江水即不
sayings:
- text: 问。请师吞却堦前下马台。师展两手唱曰。细抹将来。营将猛省
