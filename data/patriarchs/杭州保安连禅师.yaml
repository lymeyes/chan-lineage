id: 杭州保安连禅师
name: 杭州保安连
school: —
teacher: 长庆棱
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0285b18。
sayings:
- text: 僧问。如何是保安家风。师曰。问有甚么难
  ref: X80n1565_p0285b18（五灯会元）
- text: 问。如何是吹毛剑。师曰。豫章铁柱坚。曰。学人不会。师曰。漳江亲到来
  ref: X80n1565_p0285b18（五灯会元）
- text: 问。如何是沙门行。师曰。师僧头上戴冠子
  ref: X80n1565_p0285b18（五灯会元）
- text: 问。如何是西来意。师曰。死虎足人看
  ref: X80n1565_p0285b18（五灯会元）
- text: 问。一问一答。彼此兴来。如何是保安不惊人之句。师曰。汝到别处作么生举
  ref: X80n1565_p0285b18（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0285b18），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
