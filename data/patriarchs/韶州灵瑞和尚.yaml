id: 韶州灵瑞和尚
name: 韶州灵瑞
school: 沩仰宗
teacher: 慧林究
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0338a18。
sayings:
- text: 问。如何是佛。师喝曰。汝是村里人
  ref: X80n1565_p0338a18（五灯会元）
- text: 僧问。如何是西来意。师曰。十万八千里
  ref: X80n1565_p0338a18（五灯会元）
- text: 问。如何是本来心。师曰。坐却毗庐顶。出没太虗中
  ref: X80n1565_p0338a18（五灯会元）
- text: 问。如何是教外别传底事。师曰。两个灵龟泥里鬬。直至如今困未休。曰。不会。师曰。木鸡衔卵走。燕雀乘虎飞。潭中鱼不现。石女却生儿。南岳下八世南岳下八世
  ref: X80n1565_p0338a18（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0338a18），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
