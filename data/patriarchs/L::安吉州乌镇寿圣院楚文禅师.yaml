id: L::安吉州乌镇寿圣院楚文禅师
name: 安吉州乌镇寿圣院楚文
school: 杨岐派
teacher: 保宁勇
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0737a03。
sayings:
- text: 上堂。拈拄杖曰。华藏木楖栗。等闲乱拈出。不是不惜手。山家无固必。点山山动摇。搅水水波溢。忽然把定时。事事执法律。要横不得横。要屈不得屈。蓦召大众曰。莫谓棒头有眼明如日。上面光生尽是漆。随声敲一下
  ref: X80n1565_p0737a03（五灯会元）
- text: 上堂。一叉一札。著骨连皮。一搦一擡。粘手缀脚。电光石火。头垂尾垂。劈箭追风。半生半死。撞著磕著。讨甚眉毛。明头暗头。是何眼目。总不恁么。正在半途。设使全机。未至涯岸。直饶净裸裸。赤洒洒。没可把。尚有廉纤。山僧恁么道。且道口好作甚么。良久曰。嘻。留取吃饭
  ref: X80n1565_p0737a03（五灯会元）
