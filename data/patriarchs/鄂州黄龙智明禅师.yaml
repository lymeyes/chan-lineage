bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0671b03。
sayings:
- text: 上堂。众才集。师乃曰。不可更开眼说梦去也。便下座
  ref: X80n1565_p0671b03（五灯会元）
- text: 上堂。南北一诀。斩钉截铁。切忌思量。翻成途辙。师同胡巡检到公安二圣。胡
  ref: X80n1565_p0671b03（五灯会元）
- text: 问。达磨对梁武帝云。廓然无圣。公安为甚么却有二圣。师曰。一点水墨。两处成龙
  ref: X80n1565_p0671b03（五灯会元）
