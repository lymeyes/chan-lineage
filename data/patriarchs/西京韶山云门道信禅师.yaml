id: 西京韶山云门道信禅师
name: 西京韶山云门道信
school: 云门宗
teacher: 法云本
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0639b13。
sayings:
- text: 僧问。如何是祖师西来意。师曰。千年古墓蛇。今日头生角。曰。莫便是和尚家风也无。师曰。卜度则丧身失命
  ref: X80n1565_p0639b13（五灯会元）
- text: 问。如何是学人自己。师曰。无人识者。曰。如何得脱洒去。师曰。你问我答。临安府上天竺从谏慈辩讲师临安府上天竺从谏慈辩讲师处之松阳人也。具大知见。声播讲席。于止观深有所契。每与禅衲游。尝以道力扣大通。通一日作书寄之。师发缄。睹黑白二圆相。乃悟。答偈曰。黑相白相。担枷过状。了不了兮。无风起浪。若问究竟事如何。洞庭山在太湖上
  ref: X80n1565_p0639b13（五灯会元）
