id: 襄州广德义禅师
name: 襄州广德义
school: 曹洞宗
teacher: 广德延禅师
status: draft
bio: 谒先广德。作礼问曰。如何是和尚密密处。德曰。隐身不必须岩谷。阛阓堆堆睹者稀。师曰。恁么则酌水献华去也。德曰。忽然云雾霭。阇黎作么生。师曰。采汲不虗施。广德忻然曰。大众看取第二代广德。师次踵住持。聚徒开法
sayings:
- text: 僧问。如何是佛。师曰。披蓑倒骑牛。草深不露角
  ref: X80n1565_p0515a17（五灯会元）
- text: 问。如何是祖师西来意。师曰。鱼跃无源水。莺啼枯木花
  ref: X80n1565_p0515a17（五灯会元）
- text: 问。如何是常在底人。师曰。腊月死蛇当大路。触著伤人不奈何
  ref: X80n1565_p0515a17（五灯会元）
- text: 问。如何是学人相契处。师曰。方木逗圆孔
  ref: X80n1565_p0515a17（五灯会元）
- text: 问。如何是大寂灭海。师曰。闹市走马。不触一人。曰。如何是大通智胜佛。师曰。孤轮罢照妙峰顶。汝报巴猿莫断肠
  ref: X80n1565_p0515a17（五灯会元）
- text: 问。如何是作无间业底人。师曰。猛火然铛煮佛喋。师因事示偈曰。才到洪山便跺根。四方八面不言论。他家自有眠云志。芦管横吹宇宙喧
  ref: X80n1565_p0515a17（五灯会元）
- text: 问。如何是古佛心。师曰。多年历日虽无用。犯著应须总灭门。曰。或遇新历日。又作么生。师曰。运动修营无滞碍。何劳入市问孙膑
  ref: X80n1565_p0515a17（五灯会元）
- text: 问。时人有病医王医。医王有病甚人医。师展手曰。与我诊候看。曰。不会。师曰。须弥徒作药。四海谩为汤
  ref: X80n1565_p0515a17（五灯会元）
- text: 问。向上一路。千圣不传。和尚还传也无。师曰。铁丸蓦口塞。难得解吞人
  ref: X80n1565_p0515a17（五灯会元）
- text: 问。如何是佛法大意。师曰。雪寒向火。日暖隈阳
  ref: X80n1565_p0515a17（五灯会元）
- text: 问。如何是宾中宾。师曰。荡子无家计。飘蓬不自知。曰。如何是宾中主。师曰。茅户挂珠帘。曰。如何是主中宾。师曰。龙楼铺草坐。曰。如何是主中主。师曰。东宫虽至嫡。不面圣尧颜
  ref: X80n1565_p0515a17（五灯会元）
- text: 问。有一室女。未曾嫁娉。生得一子。姓个甚么。师曰。偶然衫子破。阃外没人缝
  ref: X80n1565_p0515a17（五灯会元）
- text: 问。如何是不落堦级底人。师曰。胎中童子眉如雪
  ref: X80n1565_p0515a17（五灯会元）
- text: 问。如何是不睡底眼。师曰。昨夜三更擘不开
  ref: X80n1565_p0515a17（五灯会元）
- text: 问。谛信底人信个甚么。师曰。莫道冰无火。斯须红焰生
  ref: X80n1565_p0515a17（五灯会元）
- text: 问。如何是密室。师曰。茅茨当大道。历劫没人敲
  ref: X80n1565_p0515a17（五灯会元）
- text: 问。如何是异日已前人。师曰。万年枯木鸟衔来
  ref: X80n1565_p0515a17（五灯会元）
- text: 问。悬崖峭峻。还具得失也无。师曰。忻逢良便。好与一推
  ref: X80n1565_p0515a17（五灯会元）
- text: 问。牛头未见四祖时如何。师曰。鲊瓮乍开蝇𠯗𠯗。曰。见后如何。师曰。底穿荡尽冷湫湫
  ref: X80n1565_p0515a17（五灯会元）
