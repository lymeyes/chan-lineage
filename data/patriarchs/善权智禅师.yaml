bio: 五首五王子五王子诞生诞生贵胤生时轮拟空，玎珰玉珮处东宫，月堂转侧朝君父，直扣尧堦却借功。朝生朝生学问诗书德行全，金门投䇿紫微班。台星不自离蓑钓，那得寅昏奉圣颜。末生末生贫来今日极清虗，悲喜寥寥一物无。便欲升为九包凤，依稀云树月巢孤。化生化生帝命传来下九天，禁城中外化新宣。回途复妙持金印，正令曾无一字传。内生内生凤势龙骧大丈夫，天然尊贵六宫殊。苔封宝殿无人侍，造次凡眸识得无
