bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0463b15。
sayings:
- text: 上堂。若是谛当汉。通身无隔碍。举措绝毫𨤲。把手出红尘。拨开向上窍。当头札定。不犯锋棱。转握将来。应用恰好。丝毫不漏。函葢相应。任是诸佛诸祖。󳬇著寒毛卓竖。会么。吃茶去
  ref: X80n1565_p0463b15（五灯会元）
- text: 僧问。如何是不涉烟波底句。师曰。皎皎寒松月。飘飘谷口风。曰。万差俱扫荡。一句截流机。师曰。点。僧曰。到。师曰。借人面具舞三台
  ref: X80n1565_p0463b15（五灯会元）
- text: 问。如何是佛。师曰。白额大虫。曰。祇如洞山道。麻三斤。又作么生。师曰。毒虵钻露柱。曰。学人不晓。师曰。踏著始惊人
  ref: X80n1565_p0463b15（五灯会元）
