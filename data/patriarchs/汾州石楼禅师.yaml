id: 汾州石楼禅师
name: 汾州石楼
school: 青原系
teacher: 石头希迁禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0171a02。
sayings:
- text: 上堂。僧问。未识本来性。乞师方便指。师曰。石楼无耳朵。曰。某甲自知非。师曰。老僧还有过。曰。和尚过在甚么处。师曰。过在汝非处。僧礼拜。师便打。问僧。近离甚处。曰。汉国。师曰。汉国主人还重佛法么。曰。苦哉。赖遇问著某甲。若问别人。即祸生。师曰。作么生。曰。人尚不见。有何佛法可重。师曰。汝受戒得多少夏。曰。三十夏。师曰。大好不见有人。便打
  ref: X80n1565_p0171a02（五灯会元）
