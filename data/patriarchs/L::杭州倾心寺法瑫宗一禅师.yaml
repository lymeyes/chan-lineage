id: L::杭州倾心寺法瑫宗一禅师
name: 杭州倾心寺法瑫宗一
school: —
teacher: 长庆棱
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《景德传灯录》T51n2076_p0375c06。
sayings:
- text: 上堂云。大众不待一句语便归堂去。还有绍继宗风分也无。还有人酬得此问么。若有人酬得去。也遮里与诸人为怪笑。若酬不得去。也诸人与遮里为怪笑。珍重。问如何揲文甲切实免见虚头。师曰。汝问若当众人尽鉴。问恁么来皆不丈夫。只如不恁么来还有绍继宗风分也无。师曰。出两头致一问来。僧曰什么人辨得师曰。波斯养儿。问佛法去处乞师全示。师曰。汝但全致一问来。僧曰。为什么却拈此问去。师曰。汝适来问什么。僧曰若不遇于师几成走作。师曰。贼去后关门。问别传一句如何分付。师曰。可惜许
  ref: T51n2076_p0375c06（景德传灯录）
- text: 问。僧曰。恁么即别酬亦不当去也。师曰。也是闲辞。问如何是不朝天子不羡王侯底人。师曰。每日三条线长年一衲衣。僧曰。未审此人还绍宗风也无。师曰。鹊来头上语云向眼前飞。问承古人有言。不断烦恼此意如何。师曰。又是发人业。僧曰。如何得不发业。师曰。尔话堕也。问请去赏罚如何是吹毛剑。师曰。如法礼三拜。师后住龙册寺归寂
  ref: T51n2076_p0375c06（景德传灯录）
