bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0332a18。
sayings:
- text: 僧问。如何是君王剑。师曰。落󳮪不采功。曰。用者如何。师曰。不落人手
  ref: X80n1565_p0332a18（五灯会元）
- text: 问。法王与君王相见时如何。师曰。两掌无私。曰。见后如何。师曰。中间绝像
  ref: X80n1565_p0332a18（五灯会元）
