id: 福州广平玄旨禅师
name: 福州广平玄旨
school: —
teacher: 白龙希
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0309a10。
sayings:
- text: 上堂。还有人证明么。若有人证明。亦免孤负上祖。埋没后来。若是寻言数句。大藏分明。若是祖宗门中。怪及甚么处。恁么道亦是傍瞥之辞
  ref: X80n1565_p0309a10（五灯会元）
- text: 僧问。如何是广平境。师曰。地负名山秀。谿连海水清。曰。如何是境中人。师曰。汝问我答
  ref: X80n1565_p0309a10（五灯会元）
- text: 问。如何是法身体。师曰。廓落虗空绝玷瑕。曰。如何是体中物。师曰。一轮明月散秋江。曰。未审体与物分不分。师曰。适来道甚么。曰。恁么则不分也。师曰。穿耳胡僧笑点头
  ref: X80n1565_p0309a10（五灯会元）
