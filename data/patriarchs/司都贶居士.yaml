id: 司都贶居士
name: 司都贶
school: 黄龙派
teacher: 圆通旻禅师
status: draft
bio: 问圆通曰。是法非思量分别之所能解。当如何凑泊。通曰。全身入火聚。公曰。毕竟如何晓会。通曰。蓦直去。公沈吟。通曰。可更吃茶么。公曰。不必。通曰。何不恁么会。公契旨。曰。元来太近。通曰。十万八千。公占偈曰。不可思议。是大火聚。便恁么去。不离当处。通曰。咦。犹有这个在。公曰。乞师再垂指示。通曰。便恁么去。铛是铁铸。公顿首谢之
