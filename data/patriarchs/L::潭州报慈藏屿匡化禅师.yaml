id: L::潭州报慈藏屿匡化禅师
name: 潭州报慈藏屿匡化
school: 曹洞宗
teacher: 龙牙遁
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0509b16。
sayings:
- text: 僧问。心眼相见时如何。师曰。向汝道甚么
  ref: X80n1565_p0509b16（五灯会元）
- text: 问。如何是实见处。师曰。丝毫不隔。曰。恁么则见也。师曰。南泉甚好去处
  ref: X80n1565_p0509b16（五灯会元）
- text: 问。如何是西来意。师曰。昨夜三更送过江
  ref: X80n1565_p0509b16（五灯会元）
- text: 问。临机便用时如何。师曰。海东有果树头心
  ref: X80n1565_p0509b16（五灯会元）
- text: 问。如何是真如佛性。师曰。阿谁无
  ref: X80n1565_p0509b16（五灯会元）
- text: 问。如何是向上一路。师曰。郴连道永
  ref: X80n1565_p0509b16（五灯会元）
- text: 问。和尚年多少。师曰。秋来黄叶落。春到便开花。问僧。甚处来。曰。卧龙来。师曰。在彼多少时。曰。经冬过夏。师曰。龙门无宿客。为甚么在彼许多时。曰。师子窟中无异兽。师曰。汝试作师子吼看。曰。某甲若作师子吼。即无和尚。师曰。念汝新到。放汝三十棒
  ref: X80n1565_p0509b16（五灯会元）
- text: 问。如何是湖南境。师曰。艛船战棹。曰。还许学人游玩也无。师曰。一任阇黎打僜
  ref: X80n1565_p0509b16（五灯会元）
- text: 问。和尚百年后。有人问如何祇对。师曰。分明记取
  ref: X80n1565_p0509b16（五灯会元）
- text: 问。情生智隔。想变体殊。祇如情未生时如何。师曰。隔。曰。情未生时。隔个甚么。师曰。这个梢郎子未遇人在
  ref: X80n1565_p0509b16（五灯会元）
- text: 问。如何是龙牙山。师曰。益阳那边。曰。如何即是。师曰。不拟。曰。如何是不拟去。师曰。恁么则不是
  ref: X80n1565_p0509b16（五灯会元）
- text: 问。古人面壁。意旨如何。师良久却召僧。僧应诺。师曰。你去。别时来
  ref: X80n1565_p0509b16（五灯会元）
- text: 上堂。一句遍大地。一句才问便道。一句问亦不道
  ref: X80n1565_p0509b16（五灯会元）
- text: 僧问。如何是遍大地句。师曰。无空阙。曰。如何是才问便道句。师曰。低声。低声。曰。如何是问亦不道句。师曰。便合知时
  ref: X80n1565_p0509b16（五灯会元）
