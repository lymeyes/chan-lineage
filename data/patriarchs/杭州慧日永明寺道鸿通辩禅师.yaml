bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0366a14。
sayings:
- text: 僧问。远离天台境。来登慧日峰。久闻师子吼。今日请师通。师曰。闻么。曰。恁么则昔日崇寿。今日永明也。师曰。幸自灵利。何须乱道。乃曰。大道廓然。古今常尔。真心周遍。如量之智皎然。万象森罗。咸真实相。该天括地。亘古亘今。大众还会么。还辩白得么
  ref: X80n1565_p0366a14（五灯会元）
- text: 僧问。国王嘉命。公贵临筵。未审今日当为何事。师曰。验取。曰。此意如何。师曰。甚么处去来。曰。恁么则成造次也。师曰。休乱道
  ref: X80n1565_p0366a14（五灯会元）
