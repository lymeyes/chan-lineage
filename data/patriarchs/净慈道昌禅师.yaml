id: 净慈道昌禅师
name: 净慈道昌
alias: 净慈昌
school: 云门宗
teacher: 雪峰慧禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《续传灯录》T51n2077_p0629c19。
sayings:
- text: 僧问。大用现前不存轨则时如何。师曰。张家兄弟太无良。曰恁么则一切处皆是去也。师曰。莫唐突人好。问心生则法生。心灭则法灭。只如心法双忘时。生灭在甚么处。师曰。左手得来右手用。问如何是从上宗门中事。师曰。一亩地。曰便恁么会时如何。师曰。埋没不少。问如何是诸佛本源。师曰。屋头问路。曰向上还有事也无。师曰。月下抛砖
  ref: T51n2077_p0629c19（续传灯录）
- text: 上堂。未透祖师关。千难与万难。既透祖师关。千难与万难。未透时难即且置。既透了因甚么却难放下。笊篱虽得价。动他杓柄也无端
  ref: T51n2077_p0629c19（续传灯录）
- text: 上堂。与我相似共尔无缘。打翻药铫倾出炉烟。还丹一粒分明在。流落人间是几年。咄
  ref: T51n2077_p0629c19（续传灯录）
- text: 上堂。雁过长空影沈寒水。雁无遗踪之意。水无留影之心。若能如是正好买草鞋行脚。所以道。动则影现觉则冰生。不动不觉正在死水里。荐福老人出头不得。即且置。育王今日又作么生。向道莫行山下路。果闻𤠔叫断肠声。岁旦
  ref: T51n2077_p0629c19（续传灯录）
- text: 上堂。举拂子曰。岁朝把笔万事皆吉。忽有个汉出来道。和尚这个是三家村里保正书。门底为甚么将来。华王座上当作宗乘。只向他道。牛进千头马入百疋
  ref: T51n2077_p0629c19（续传灯录）
