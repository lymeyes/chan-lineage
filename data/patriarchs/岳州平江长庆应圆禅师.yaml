sayings:
- text: 上堂。寒气将残春日到。无索泥牛皆𨁝跳。筑著昆仑鼻孔头。触倒须弥成粪扫。牧童儿鞭弃了。懒吹无孔笛。拍手呵呵笑。归去来兮归去来。烟霞深处和衣倒。良久曰。切忌睡著
  ref: T51n2077_p0588a20（续传灯录）
