bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0666a05。
sayings:
- text: 僧问。请师不于语默里答话。师以拄杖卓一下。僧曰。和尚莫草草匆匆。师曰。西天斩头截臂。僧礼拜。师曰。堕也。堕也
  ref: X80n1565_p0666a05（五灯会元）
- text: 上堂。心如朗月连天静。遂打一圆相曰。寒山子𫆏。性似寒潭彻底清。是何境界。良久曰。无价夜光人不识。识得又堪作甚么。凡夫虗度几千春。乃呵呵大笑曰。争如独坐明窗下。华落华开自有时。下座
  ref: X80n1565_p0666a05（五灯会元）
