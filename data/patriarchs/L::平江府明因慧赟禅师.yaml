id: L::平江府明因慧赟禅师
name: 平江府明因慧赟
school: 云门宗
teacher: 天衣怀
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0623a18。
sayings:
- text: 上堂。横按拄杖曰。若恁么去。直得天无二日。国无二王。释迦老子。饮气吞声。一大藏教。如虫蚀木。设使钻仰不及。正是无孔铁锤。假饶信手拈来。也是残羹馊饭。一时吐却。方有少分相应。更乃堕在空亡。依旧是鬼家活计。要会么。雨后始知山色翠。事难方见丈夫心。卓拄杖。下座
  ref: X80n1565_p0623a18（五灯会元）
