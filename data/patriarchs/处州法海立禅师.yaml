id: 处州法海立禅师
name: 处州法海立
school: —
teacher: 未详
status: draft
bio: 因朝廷有旨。革本寺为神霄宫。师升座谓众曰。都缘未彻。所以说是说非。葢为不真。便乃分彼分此。我身尚且不有。身外乌足道哉。正眼观来。一场笑俱。今则圣君垂旨。更僧寺作神霄。佛头上添个冠儿。算来有何不可。山僧今日不免横担拄杖。高挂钵囊。向无缝塔中安身立命。于无根树下啸月吟风。一任乘云仙客。驾鹤高人。来此咒水书符。叩牙作法。他年成道。白日上升。堪报不报之恩。以助无为之化。只恐不是玉。是玉也大奇。然虽如是。且道山僧转身一句作么生道。还委悉么。掷下拂子。竟尔趋寂。郡守具奏其事。奉旨改其寺曰真身
