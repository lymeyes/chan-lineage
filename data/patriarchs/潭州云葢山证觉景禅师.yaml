bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0213b15。
sayings:
- text: 僧问。国土晏清。功归何处。师曰。银台门下不展贺。曰。转功无位时如何。师曰。王家事宛然。曰。如何是阃外底事。师曰。画鼓声终后。将军不点头
  ref: X80n1565_p0213b15（五灯会元）
