id: 吉州禾山师阴禅师
name: 吉州禾山师阴
school: 青原系
teacher: 中云葢禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0214a01。
sayings:
- text: 僧问。王子未来登。谁人当治化。师曰。阃外不行边塞令。将军自致太平年。曰。恁么则治化之功犹不当。师曰。亦有当。曰。如何是当。师曰。十方国土尽属于王
  ref: X80n1565_p0214a01（五灯会元）
- text: 问。久久寻源。为甚么不见。师曰。为步数太多。曰。恁么则不觅去也。师曰。还同避溺而投火
  ref: X80n1565_p0214a01（五灯会元）
- text: 问。如何是佛。师曰。承当者不是好手
  ref: X80n1565_p0214a01（五灯会元）
