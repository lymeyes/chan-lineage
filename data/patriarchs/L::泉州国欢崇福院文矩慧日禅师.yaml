id: L::泉州国欢崇福院文矩慧日禅师
name: 泉州国欢崇福院文矩慧日
school: 南岳系
teacher: 长庆安
status: draft
bio: 福州黄氏子。生而有异。及长为县狱卒。每每弃役。往神光观和尚及西院安禅师所。吏不能禁。后谒万岁塔谭空禅师落发。不披袈裟。不受具戒。唯以杂彩为挂子。复至神光。光曰。我非汝师。汝礼西院去。师携一小青竹杖。入西院法堂。院遥见笑曰。入涅槃堂去。师应诺。轮竹杖而入。时有五百许僧染时疾。师以杖次第点之。各随点而起。闽王礼重。创院以居之。厥后颇多灵迹。唐乾宁中示灭
