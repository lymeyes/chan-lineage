name: 西天二十八祖（综述）
honorific: 印度付法血脉
school: 西天祖师
dynasty: 佛灭后数百年
source_ref: 景德传灯录·卷一~卷二 / 五灯会元·卷一~卷二
cbeta: T51n2076 卷一~二
bio: '自迦叶、阿难以降，西天（印度）付法相传二十八代，灯录具载其付法偈与机缘，为东土禅宗之远源。其传次如下（括注略迹）：

  三祖商那和修（持鉴而度、手生瑞瑞）、四祖优波毱多（无相好佛、度人无数）、五祖提多迦、六祖弥遮迦、七祖婆须蜜、八祖佛陀难提、九祖伏驮蜜多、十祖胁尊者（胁不至席）、十一祖富那夜奢、十二祖马鸣（造《大乘起信论》传统所归）、十三祖迦毗摩罗、十四祖龙树（造《中论》，立八不）、十五祖迦那提婆（破邪显正）、十六祖罗睺罗、十七祖僧伽难提、十八祖伽耶舍多、十九祖鸠摩罗多、二十祖阇夜多、二十一祖婆修盘头（世亲，唯识宗祖）、二十二祖摩拏罗、二十三祖鹤勒那、二十四祖师子尊者（为罽宾王所害）、二十五祖婆舍斯多、二十六祖不如蜜多、二十七祖般若多罗、二十八祖菩提达摩（东来，为东土初祖）。

  此节点在谱系图中为「西天二十八祖」汇总；各祖之独立节点未逐一展开，后续可按 CBETA 补为独立卡片。'
sayings:
- text: 十四祖龙树付法偈：「为明隐显法，方说解脱理；于法心不证，无瞋亦无喜。」
  ref: 景德传灯录·卷二·龙树尊者
- text: 龙树《中论》：「不生亦不灭，不常亦不断，不一亦不异，不来亦不出。」（八不偈）
  ref: 中论·观因缘品
