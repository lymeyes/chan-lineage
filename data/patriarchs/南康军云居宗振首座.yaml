id: 南康军云居宗振首座
name: 南康军云居宗振首座
school: 杨岐派
teacher: 昭觉勤
status: draft
bio: 丹丘人也。依圜悟于云居。一日。仰瞻钟阁。倏然契证。有诘之者。座酬以三偈。其后曰。我有一机。直下示伊。青天霹雳。电卷星驰。德山临济。棒喝徒施。不传之妙。于汝何亏。悟见大悦。竟以节操自高。道望愈重。尝书壁曰。住在千峰最上层。年将耳顺任腾腾。免教名字挂人齿。甘作今朝百拙僧。枢密徐俯枢密徐俯字师川。号东湖居士。每侍先龙图谒法昌及灵源。语论终日。公闻之。藐如也。及法昌归寂在笑谈间。公异之。始笃信此道。后丁父忧。念无以报罔极。命灵源归孝址说法。源登座。问答已。乃曰。诸仁者。祇如龙图平日读万卷书。如水传器。涓滴不遗。且道寻常著在甚么处。而今舍识之后。这著万卷书底。又却向甚么处著。公闻。洒然有得。遂曰。吾无憾矣。源下座。问曰。学士适来见个甚么。便恁么道。公曰。若有所见。则钝置和尚去也。源曰。恁么则老僧不如。公曰。和尚是何心行。源大笑。靖康初。为尚书外郎。与朝士同志者挂钵于天宁寺之择木堂。力参圆悟。悟亦喜其见地超迈。一日至书记寮。指悟项相曰。这老汉脚跟犹未点地在。悟󳬱面曰。瓮里何曾走却鳖。公曰。且喜老汉脚跟点地。悟曰。莫谤他好。公休去。郡王赵令衿郡王赵令衿字表之。号超然居士。任南康。政成事简。多与禅衲游。公堂间为摩诘丈室。适圆悟居瓯阜。公欣然就其𬬻锤。悟不少假。公固请。悟曰。此事要得相应。直须是死一回始得。公默契。尝自疏之。其略曰。家贫遭劫。谁知尽底不存。空屋无人。几度贼来亦打。悟见。嘱令加护。绍兴庚申冬。公与汪内翰藻．李参政邴．曾侍郎开诣径山。谒大慧。慧闻至。乃令击鼓入室。公欣然袖香趋之。慧曰。赵州洗钵盂话。居士作么生会。公曰。讨甚么碗。拂袖便出。慧起搊住曰。古人向这里悟去。你因甚么却不悟。公拟对。慧𢮁之曰。讨甚么碗。公曰。还这老汉始得。侍郎李弥逊侍郎李弥逊号普现居士。少时读书。五行俱下。年十八。中乡举。登第京师。旋历华要。至二十八岁。为中书舍人。常入圆悟室。一日早朝回。至天津桥马跃。忽有……（原文更长，见 cbeta 锚点）
sayings:
- text: 示众语下。了然明白。悟曰。更须飏却所见。始得自由。祖答偈曰。露柱抽横骨。虗空弄爪牙。直饶玄会得。犹是眼中沙。令人本明令人本明号明室。自机契圆悟。遍参名宿。皆蒙印可。绍兴庚申二月望。亲书三偈寄呈草堂清。微露谢世之意。至旬末。别亲里而终。草堂䟦其偈。后为刊行。大慧亦尝垂语发扬。偈曰。不识烦恼是菩提。若随烦恼是愚痴。起灭之时须要会。鹞过新罗人不知。不识烦恼是菩提。净华生淤泥。人来问我若何为。吃粥吃饭了洗钵盂。莫管他。莫管他。终日痴憨弄海沙。要识本来真面目。便是祖师一木叉。道不得底叉下死。道得底也叉下死。毕竟如何。不许夜行。投明须到。成都府范县君成都府范县君者嫠居岁久。常坐而不卧。闻圆悟住昭觉。往礼拜。请示入道因缘。悟令看不是心。不是佛。不是物。是个甚么。久无所契。范泣告悟曰。和尚有何方便。令某易会。悟曰。却有个方便。遂令祇看是个甚么。后有省曰。元来恁么地近那
