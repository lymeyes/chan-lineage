id: L::房州开山怀昼禅师
name: 房州开山怀昼
school: 青原系
teacher: 青峰楚
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0218b11。
sayings:
- text: 僧问。作何行业。即得不违于千圣。师曰。妙行无伦匹。情玄体自殊
  ref: X80n1565_p0218b11（五灯会元）
- text: 问。有耳不临清水洗。无心谁为白云幽时如何。师曰。无木挂千金。曰。挂后如何。师曰。杳杳人难辩
  ref: X80n1565_p0218b11（五灯会元）
- text: 问。如何是尘中师。师曰。荆棘林中随处到。旃檀林里任纵横
  ref: X80n1565_p0218b11（五灯会元）
- text: 问。如何是祖师西来意。师曰。月隐澄潭。金辉正午
  ref: X80n1565_p0218b11（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0218b11），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
