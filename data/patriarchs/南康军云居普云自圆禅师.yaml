id: 南康军云居普云自圆禅师
name: 南康军云居普云自圆
school: 杨岐派
teacher: 龙翔珪
status: draft
bio: 绵州雍氏子。年十九。试经得度。留教苑五祀。出关南下。历扣诸大尊宿。始诣龙门。一日。于廊庑间睹绘胡人。有省。夜白高庵。庵举法眼偈曰。头戴貂鼠帽。腰悬羊角锥。语不令人会。须得人译之。复䇲火示之曰。我为汝译了也。于是大法明了。呈偈曰。外国言音不可穷。起云亭下一时通。口门广大无边际。吞尽杨岐栗棘蓬。庵遣师依佛眼。眼谓曰。吾道东矣
sayings:
- text: 上堂。举。僧问云门。如何是透法身句。门曰。北斗里藏身。师曰。南北东西万万千。乾坤上下两无边。相逢相见呵呵笑。屈指擡头月半天
