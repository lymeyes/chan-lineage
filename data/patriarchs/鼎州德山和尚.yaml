bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0502a16。
sayings:
- text: 僧问。路逢达道人。不将语默对。未审将甚么对。师曰。祇恁么。僧良久。师曰。汝更
  ref: X80n1565_p0502a16（五灯会元）
- text: 问。僧再问。师乃喝出
  ref: X80n1565_p0502a16（五灯会元）
