id: 死心悟新禅师
name: 死心悟新
honorific: 黄龙死心悟新禅师（晦堂祖心法嗣，黄龙派第三代）
school: 黄龙派
dynasty: 北宋（1043—1114）
region: 隆兴黄龙寺 / 洪州（今江西）
teacher: 晦堂祖心（黄龙心禅师）
source_ref: 五灯会元·卷十二·隆兴府黄龙悟新 / 建中靖国续灯录
cbeta: X77n1524 相关章次
bio: 晦堂祖心之法嗣，黄龙派第三代，名悟新，号死心。初习讲经论义，后参祖心，祖心以「赵州洗钵盂」话勘之，悟新言下大悟。门风严峻，善以「死心」之语折伏驰求，与灵源惟清齐名。黄龙一系至死心、灵源而极盛，然其后渐衰，并入杨岐。
sayings:
- text: 师示众：「我这里无禅可参，只是教你休歇；你若不休歇，尽大地是热铁轮，何处回避？」
  ref: 五灯会元·卷十二·黄龙悟新
- text: 常举「赵州洗钵盂」话勘验：僧问「如何是祖师西来意」，师曰「你且去，洗钵盂着」。（赵州家风之承）
  ref: 五灯会元·卷十二·黄龙悟新
