id: 石梯和尚
name: 石梯
school: —
teacher: 茱萸
status: draft
bio: 因侍者请浴。师曰。既不洗尘。亦不洗体。汝作么生。者曰。和尚先去。某甲将皂角来。师呵呵大笑。有新到于师前立。少顷便出去。师曰。有甚么辨白处。僧再回。师曰。辨得也。曰。辨后作么生。师曰。埋却得也。曰。苍天。苍天。师曰。适来却恁么。如今还不当。僧乃出去。一日见侍者拓钵赴堂。乃唤侍者。者应诺。师曰。甚处去。者曰
sayings:
- text: 上堂斋去。师曰。我岂不知汝
  ref: X80n1565_p0157b01（五灯会元）
- text: 上堂斋去。者曰。除此外别道个甚么。师曰。我祇问汝本分事。者曰。和尚若问本分事。某甲实是
  ref: X80n1565_p0157b01（五灯会元）
- text: 上堂斋去。师曰。汝不谬为吾侍者
  ref: X80n1565_p0157b01（五灯会元）
