id: 洪州大宁院隐微觉寂禅师
name: 洪州大宁院隐微觉寂
school: 青原系
teacher: 罗山闲
status: draft
bio: 豫章新淦杨氏子。诞夕有光明贯室。年七岁。依本邑石头院道坚禅师出家受具。历参宗匠。至罗山。山导以师子在窟出窟之要。因而省悟。后回江表。会龙泉宰李孟俊请居十善道场。阐扬宗旨
sayings:
- text: 上堂。还有腾空底么。出来。众无出者。师说偈曰。腾空正是时。应须眨上眉。从兹出伦去。莫待白头儿
  ref: X80n1565_p0274b12（五灯会元）
- text: 僧问。如何是十善桥。师曰。险。曰。过者如何。师曰。丧
  ref: X80n1565_p0274b12（五灯会元）
- text: 问。资福和尚迁化向甚么处去。师曰。草鞋破
  ref: X80n1565_p0274b12（五灯会元）
- text: 问。如何是黄梅一句。师曰。即今作么生。曰。如何通信。师曰。九江路绝
  ref: X80n1565_p0274b12（五灯会元）
- text: 问。初心后学。如何是学。师曰。头戴天。曰。毕竟如何。师曰。脚踏地
  ref: X80n1565_p0274b12（五灯会元）
- text: 问。如何是法王剑。师曰。露。曰。还杀人也无。师曰。作么
  ref: X80n1565_p0274b12（五灯会元）
- text: 问。如何是龙泉剑。师曰。不出匣。曰。便请出匣。师曰。星辰失位
  ref: X80n1565_p0274b12（五灯会元）
- text: 问。国界安宁。为甚么珠不现。师曰。落在甚么处
  ref: X80n1565_p0274b12（五灯会元）
