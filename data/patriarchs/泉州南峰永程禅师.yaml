bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0687a03。
sayings:
- text: 示众。始自鸡峰续𦦨。少室流芳。大布慈云。宏开慧日。教分三藏。直指一心。或全提而棒喝齐施。或纵夺而宾主互设。或金刚按剑。或师子翻身。或照用雷奔。或机锋电掣。无非剪除邪妄。开廓玄微。直下明宗。到真实地。诸仁者。到此方许一线道。与你商量。苟或未然。尽是依师作解。无有是处
  ref: X80n1565_p0687a03（五灯会元）
