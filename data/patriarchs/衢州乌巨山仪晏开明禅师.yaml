id: 衢州乌巨山仪晏开明禅师
name: 衢州乌巨山仪晏开明
school: —
teacher: 镜清怤禅师
status: draft
bio: 吴兴许氏子。于唐乾符三年将诞之夕。异香满室。红光如画。光启中随父镇信安。强为娶。师不愿。遂游历诸方。机契镜清。归省父母。乃于郭南创别舍以遂师志。舍旁陈司徒庙有凛禅师像。师往瞻礼。失师所之。后郡守展祀祠下。见师入定于庙后丛竹间。蚁蠹其衣。败叶没䏶。或者云。是许镇将之子也。自此三昧。或出或入。子湖讷禅师。未知师所造浅深。问曰。子所住定。葢小乘定耳。时方啜茶。师呈起橐曰。是大是小。讷骇然。寻谒栝苍唐山德严禅师。严
sayings:
- text: 问。汝何姓。曰。姓许。严曰。谁许汝。曰。不别。严默识之。遂与剃染。尝令摘桃。浃旬不归。往寻。见师攀桃倚石。泊然在定。严鸣指出之。开运中游江郎岩。睹石龛。谓弟子慧兴曰。予入定此中。汝当垒石塞门。勿以吾为念。兴如所戒。明年。兴意师长。往启龛视师。素发被肩。胸臆尚暖。徐自定起。了无异容。复回乌巨。侍郎慎公镇信安。馥师之道。命义学僧守荣诘其定相。师不与之辩。荣意轻之。时信安人竞图师像而尊事。皆获舍利。荣因愧服。礼像谢𠎝。亦获舍利。叹曰。此后不敢以浅解测度矣。钱忠懿王感师见梦。遣使图像至。适王患目疾。展像作礼。如梦所见。随雨舍利。目疾顿瘳。因锡号开明。及述偈赞。宝器供具千计。端拱初。太宗皇帝闻师定力。诏本州加礼。津发赴阙。师力辞。僧再至谕旨。特令肩舆。入对便殿。命坐赐茗。咨问禅定。奏对简尽。深契上旨。丐归。复诏入对。得请还山。送车塞途。淳化元年示寂。寿一百十五。腊五十七。阇维白光属天。舍利五色。󳬛人以骨塑像。至今州郡雨旸。祷之如向斯答
