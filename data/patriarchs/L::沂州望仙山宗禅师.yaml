id: L::沂州望仙山宗禅师
name: 沂州望仙山宗
school: 云门宗
teacher: 天衣怀
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0623a04。
sayings:
- text: 僧问。四时八节即不
  ref: X80n1565_p0623a04（五灯会元）
- text: 问。平常一句事如何。师曰。禾山打鼓。曰。莫是学人著力处也无。师曰。归宗拽石。僧无语。师曰。真个衲僧
  ref: X80n1565_p0623a04（五灯会元）
- text: 上堂。南台乌药。北海天麻。新罗附子。辰锦朱砂。良久曰。大众会么。久立
  ref: X80n1565_p0623a04（五灯会元）
- text: 上堂。你等诸人。还肯放下么。若不放下。且担取去。便下座
  ref: X80n1565_p0623a04（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0623a04），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
