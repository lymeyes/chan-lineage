id: 抚州石巩慧藏禅师
name: 石巩慧藏
school: 南岳系
teacher: 马祖一
bio: 马祖道一禅师法嗣。出家前为猎人，马祖以「一箭射一群」之机点化，遂皈依，世称「石巩禅师」。
sayings:
- text: 师（石巩）见僧，以弓挟箭，谓曰：「看箭！」僧放身便倒。师曰：「三十年一张弓，只射得半个圣人。」
  ref: 五灯会元·卷三·石巩慧藏禅师
