sayings:
- text: 僧问。四威仪中如何辨主。师曰。正遇宝峰不脱鞋
  ref: X80n1565_p0209b03（五灯会元）
- text: 问。如何是佛法大意。师曰。虗空驾铁船。岳顶浪滔天
  ref: X80n1565_p0209b03（五灯会元）
