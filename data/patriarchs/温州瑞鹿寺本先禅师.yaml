id: 温州瑞鹿寺本先禅师
name: 温州瑞鹿寺本先
school: 法眼宗
teacher: 天台韶
status: draft
bio: 本州郑氏子。参天台国师。导以非风幡动。仁者心动之语。师即悟解。尔后示徒曰。吾初学天台法门。语下便荐。然千日之内。四仪之中。似物碍膺。如雠同所。千日之后。一日之中。物不碍膺。雠不同所。当下安乐。顿觉前咎。乃述颂三首。一．非风幡动仁者心动。曰。非风幡动唯心动。自古相传直至今。今后水云人欲晓。祖师真是好知音。二．见色便见心。曰。若是见色便见心。人来问著方难答。更求道理说多般。孤负平生三事衲。三．明自己。曰。旷大劫来祇如是。如是同天亦同地。同地同天作么形。作么形兮无不是。师自尔足不历城邑。手不度财货。不设卧具。不衣茧丝。日唯一食。终日宴坐。申旦诲诱。逾三十载。其志弥厉
sayings:
- text: 上堂。你诸人还见竹林兰若．山水院舍人众么。若道见。则心外有法。若道不见。争奈竹林兰若．山水院舍人众。现在𪭢然地。还会恁么告示么。若会。不妨灵利。无事莫立
  ref: X80n1565_p0374b01（五灯会元）
- text: 上堂。大凡参学未必学。问话是参学未必学。拣话是参学未必学。代语是参学未必学。别语是参学未必学。捻破经论中奇特言语是参学。未必捻破祖师奇特言语是参学。若于如是等参学。任你七通八达。于佛法中傥无见处。唤作干慧之徒。岂不闻古德道。聪明不敌生死。干慧岂免苦轮。诸人若也参学。应须真实参学始得。行时行时参取。立时立时参取。坐时坐时参取。眠时眠时参取。语时语时参取。默时默时参取。一切作务时。一切作务时参取。既向如是等时参。且道参个甚人。参个甚么语。到这里。须自有个明白处始得。若不如是。唤作造次之流。则无究了之旨
  ref: X80n1565_p0374b01（五灯会元）
- text: 上堂。幽林鸟叫。碧㵎鱼跳。云片展张。瀑声呜咽。你等还知得如是多景象。示你等个入处么。若也知得。不妨参取好
  ref: X80n1565_p0374b01（五灯会元）
- text: 上堂。天台教中说文殊．观音．普贤三门。文殊门者一切色。观音门者一切声。普贤门者不动步而到。我道文殊门者不是一切色。观音门者不是一切声。普贤门者是个甚么。莫道别却天台教说话。无事且退
  ref: X80n1565_p0374b01（五灯会元）
- text: 上堂。举僧问长沙。南泉迁化向甚么处去。沙曰。东家作驴。西家作马。僧曰。学人不会。沙曰。要骑便骑。要下即下。师曰。若是求出三界修行底人。闻这个言语。不妨狐疑。不妨惊怕。南泉迁化向甚处去。东家作驴。西家作马。或有会云。千变万化。不出真常。或有会云。须会异类中行。始会得这个言语。或有会云。东家是南泉。西家是南泉。或有会云。东家郎君子。西家郎君子。或有会云。东家是甚么。西家是甚么。或有会云。便作驴叫。又作马嘶。或有会云。唤甚么作东家驴。唤甚么作西家马。或有会云。既问迁化。答在问处。或有会云。作露柱处去也。或有会云。东家作驴。西家作马。亏南泉甚处。如是诸家会也。总于佛法有安乐处。南泉迁化向甚处去。东家作驴。西家作马。学人不会。要骑便骑。要下即下。这个话不消得多道理而会。若见法界性去。也没多事。珍重
  ref: X80n1565_p0374b01（五灯会元）
- text: 上堂。鉴中形影。唯凭鉴光显现。你等诸人所作一切事。且道唯凭个甚么显现。还知得么。若也知得。于参学中千足万足。无事。莫立
  ref: X80n1565_p0374b01（五灯会元）
- text: 上堂。你等诸人。夜间眠熟不知一切。既不知一切。且问你等那时有本来性。无本来性。若道那时有本来性。又不知一切。与死无异。若道那时无本来性。睡眠忽省。觉知如故。还会么。不知一切与死无异。睡眠忽省觉知如故。如是等时。是个甚么。若也不会。各体究取。无事．莫立
  ref: X80n1565_p0374b01（五灯会元）
- text: 上堂。诸法所生。唯心所现。如是言语。好个入底门户。且问你等诸人。眼见一切色。耳闻一切声。鼻嗅一切香。舌了一切味。身触一切耎滑。意分别一切诸法。祇如眼耳鼻舌身意所对之物。为复唯是你等心。为复非是你等心。若道唯是你等心。何不与你等身都作一块了休。为甚么所对之物。却在你等眼耳鼻舌身意外。你等若道眼耳鼻舌身意所对之物非是你等心。又争奈诸法所生。唯心所现。言语留在世间。何人不举著。你等见这个说话还会么。若也不会。大家用心商量教会去。幸在其中。莫令厌学。无事且退。大中祥符元年二月。谓上足如昼曰。可造石龛。中秋望日。吾将顺化。昼禀命即成。及期。远近士庶奔趋瞻仰。是日参问如常。至午坐方丈。手结宝印。谓昼曰。古人云。骑虎头。打虎尾。中央事。作么生。昼曰。也祇是如昼。师曰。你问我。昼乃
  ref: X80n1565_p0374b01（五灯会元）
- text: 问。骑虎头。打虎尾。中央事。和尚作么生。师曰。我也弄不出。言讫奄然。开一目微视而逝
  ref: X80n1565_p0374b01（五灯会元）
