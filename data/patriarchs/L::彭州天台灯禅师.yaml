id: L::彭州天台灯禅师
name: 彭州天台灯
school: 青原系
teacher: 云葢元
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0213a13。
sayings:
- text: 僧问。古佛向甚么处去也。师曰。中央甲第高。岁岁出灵苗
  ref: X80n1565_p0213a13（五灯会元）
- text: 问。古镜未磨时如何。师曰。不施功。曰。磨后如何。师曰。不照烛
  ref: X80n1565_p0213a13（五灯会元）
- text: 问。如何是佛。师曰。红莲座上。不睹天冠
  ref: X80n1565_p0213a13（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0213a13），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
