id: L::洪州东禅和尚
name: 洪州东禅
school: 曹洞宗
teacher: 紫陵一
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0518a13。
sayings:
- text: 僧问。如何是密室。师曰。江水深七尺。曰。如何是密室中人。师曰。此去江南三十步
  ref: X80n1565_p0518a13（五灯会元）
- text: 僧问。如何是新吴剑。师作󳫠剑势
  ref: X80n1565_p0518a13（五灯会元）
