id: 唐州大乘山慧果禅师
name: 唐州大乘山慧果
school: 临济宗
teacher: 叶县省
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0434b03。
sayings:
- text: 僧问。如何是从上来传底意。师曰。金盘拓出众人看
  ref: X80n1565_p0434b03（五灯会元）
- text: 问。拨尘见佛时如何。师曰。拨尘即乖。见佛即错。曰。总不如是时如何。师曰。错
  ref: X80n1565_p0434b03（五灯会元）
- text: 问。如何是道。师曰。宽处宽。窄处窄。曰。如何是道中人。师曰。苦处苦。乐处乐。曰。道与道中人相去多少。师曰。十万八千
  ref: X80n1565_p0434b03（五灯会元）
- text: 问。如何是祖师西来意。师曰。天晴日出。曰。学人不会。师曰。雨下泥生
  ref: X80n1565_p0434b03（五灯会元）
