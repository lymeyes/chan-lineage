id: 沩山灵祐禅师
name: 沩山灵祐
honorific: 沩山灵祐禅师 · 大圆禅师（谥）
school: 沩仰宗
dynasty: 唐
region: 潭州沩山（同庆寺）
teacher: 百丈怀海
source_ref: 五灯会元·卷九·潭州沩山灵祐 / 景德传灯录·卷九
cbeta: T51n2076 卷九
bio: 福州赵氏子，百丈怀海弟子。初居沩山，猿猱为伍，椽橡为食，后建同庆寺，徒众云集，与弟子仰山慧寂共创沩仰宗，为五家之首。法风温和细密，善以境接人。
sayings:
- text: 示众：「夫道人之心，质直无伪，无背无面，无诈妄心。一切时中，视听寻常，即是道。」
  ref: 五灯会元·卷九·沩山灵祐
- text: 「我百年后，向山下作一头水牯牛去，左胁书五字：沩山僧某甲。」（泥牛入海之喻）
  ref: 五灯会元·卷九·沩山灵祐
