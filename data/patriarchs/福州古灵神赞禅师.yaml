id: 福州古灵神赞禅师
name: 福州古灵神赞
school: 南岳系
teacher: 百丈怀海禅师
status: draft
bio: 本州大中寺受业。后行脚遇百丈开悟。却回受业。本师问曰。汝离吾在外。得何事业。曰。并无事业。遂遣执役。一日。因澡身命师去垢。师乃拊背曰。好所佛堂而佛不圣。本师回首视之。师曰。佛虽不圣。且能放光。本师又一日在窗下看经。蜂子投窗纸求出。师睹之曰。世界如许广阔不肯出。钻他故纸驴年去。遂有偈曰。空门不肯出。投窗也大痴。百年钻故纸。何日出头时。本师置经。问曰。汝行脚遇何人。吾前后见汝发言异常。师曰。某甲蒙百丈和尚指个歇处。今欲报慈德耳。本师于是告众致斋。请师说法。师乃登座。举唱百丈门风曰。灵光独耀。迥脱根尘。体露真常。不拘文字。心性无染。本自圆成。但离妄缘。即如如佛。本师于言下感悟曰。何期垂老得闻极则事。师后住古灵。聚徒数载。临迁化。剃浴声钟告众曰。汝等诸人。还识无声三昧否。众曰。不识。师曰。汝等静听。莫别思惟。众皆侧聆。师俨然顺寂。塔存本山
