id: L::侍郎李浩居士
name: 侍郎李浩
school: 杨岐派
teacher: 天童华
status: draft
bio: 字德远。号正信。幼阅首楞严经。如游旧国。志而不忘。持橐后。造明果。投诚入室。应庵揕其𮌎曰。侍郎死后。向甚么处去。公骇然汗下。庵喝出。公退参。不旬日竟跻堂奥。以偈寄同参严康朝曰。门有孙膑铺。家存甘贽妻。夜眠还早起。谁悟复谁迷。庵见称善。有鬻胭脂者。亦久参应庵。颇自负。公赠之偈曰。不涂红粉自风流。往往禅徒到此休。透过古今圈䙌后。却来这里吃拳头
