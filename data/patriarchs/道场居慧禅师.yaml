id: 道场居慧禅师
name: 道场居慧
alias: 道场慧
school: 云门宗
teacher: 法云善本禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《续传灯录》T51n2077_p0674a01。
sayings:
- text: 上堂。钟馗醉里唱凉州。小妹门前只点头。巡海夜叉相见后。大家拍手上高楼。大众若会得去。锁却天下人舌头。若会不得。将谓老僧别有奇特
  ref: T51n2077_p0674a01（续传灯录）
- text: 上堂。百尺竿头弄影戏。不唯瞒尔又瞒天。自笑平生岐路上。投老归来没一钱
  ref: T51n2077_p0674a01（续传灯录）
- text: 示众曰。一人在高高峰顶无出身之路。一人在十字街头亦无向背。且道那个在前那个在后。师曰。更有一人。不在高高峰顶。亦不在十字街头。临济老汉因甚不知。便下座
  ref: T51n2077_p0674a01（续传灯录）
