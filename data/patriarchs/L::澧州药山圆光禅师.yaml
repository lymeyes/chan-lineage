id: L::澧州药山圆光禅师
name: 澧州药山圆光
school: 云门宗
teacher: 云门偃
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0573a08。
sayings:
- text: 僧问。药峤灯联。师当第几。师曰。相逢尽道休官去。林下何曾见一人
  ref: X80n1565_p0573a08（五灯会元）
- text: 问。水陆不涉者。师还接否。师曰。苏噜苏噜。师问新到。南来北来。曰。北来。师曰。不落言诠。速道。速道。曰。某甲是福建道人。善会乡谈。师曰。参众去。僧曰。灼然。师曰。更𨁝跳便打
  ref: X80n1565_p0573a08（五灯会元）
- text: 问。如何是祖师西来意。师曰。道甚么
  ref: X80n1565_p0573a08（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0573a08），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
