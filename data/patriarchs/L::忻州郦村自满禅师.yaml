id: L::忻州郦村自满禅师
name: 忻州郦村自满
school: 南岳系
teacher: 马祖一
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0107a18。
sayings:
- text: 上堂。古今不异。法尔如然。更复何也。虽然如此。这个事大有人罔措在
  ref: X80n1565_p0107a18（五灯会元）
- text: 僧问。不落古今。请师直道。师曰。情知汝罔措。僧欲进语。师曰。将谓老僧落伊古今。曰。如何即是。师曰。鱼腾碧汉。阶级难飞。曰。如何免得此过。师曰。若是龙形。谁论高下。僧礼拜。师曰。苦哉。屈哉。谁人似我
  ref: X80n1565_p0107a18（五灯会元）
- text: 上堂。除却日明夜暗。更说甚么即得。珍重
  ref: X80n1565_p0107a18（五灯会元）
- text: 问。如何是无诤之句。师曰。喧天动地
  ref: X80n1565_p0107a18（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0107a18），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
