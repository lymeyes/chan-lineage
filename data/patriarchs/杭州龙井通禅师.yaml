id: 杭州龙井通禅师
name: 杭州龙井通
school: —
teacher: 雪峰义存禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0266b01。
sayings:
- text: 僧问。如何是龙井龙。师曰。意气天然别。神工画不成。曰。为甚么画不成。师曰。出群不带角。不与类中同。曰。还解行雨也无。师曰。普润无边际。处处皆结粒。曰。还有宗门中事也无。师曰。有。曰。如何是宗门中事。师曰。从来无形段。应物不曾亏
  ref: X80n1565_p0266b01（五灯会元）
