id: L::广州光圣院师护禅师
name: 广州光圣院师护
school: 法眼宗
teacher: 天台韶
status: draft
bio: 闽人也。自天台得法。化行岭表。国主刘氏创大伽蓝。请师居焉。署大义禅师
sayings:
- text: 僧问。昔日梵王请佛。今日国主临筵。祖意西来。如何举唱。师曰。不要西来。山僧已举唱了也。曰。岂无方便。师曰。适来岂不是方便
  ref: X80n1565_p0370b04（五灯会元）
- text: 问。学人乍入丛林。西来妙诀。乞师指示。师曰。汝未入丛林。我已示汝了也。曰。如何领会。师曰。不要领会
  ref: X80n1565_p0370b04（五灯会元）
