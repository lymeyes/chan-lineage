id: L::广州和安寺通禅师
name: 广州和安寺通
school: 南岳系
teacher: 百丈海
status: draft
bio: 婺州双林寺受业。自幼寡言。时人谓之不语通。因礼佛次。有禅者
sayings:
- text: 问。座主礼底是甚么。师曰。是佛。禅者乃指像曰。这个是何物。师无对。至夜。具威仪礼
  ref: X80n1565_p0126a12（五灯会元）
- text: 问。今日所问。某甲未知意旨如何。禅者曰。座主几夏邪。师曰。十夏。禅者曰。还曾出家也未。师转茫然。禅者曰。若也不会。百夏奚为。乃命同参马祖。及至江西。祖已圆寂。遂谒百丈。顿释疑情。有人问师。是禅师否。师曰。贫道不曾学禅。师良久。召其人。其人应诺。师指棕榈树子。其人无对。师一日召仰山将床子来。山将到。师曰。却送本处著。山从之。师召。慧寂。山应诺。师曰。床子那边是甚么物。山曰。枕子。师曰。枕子这边是甚么物。山曰。无物。师复召。慧寂。山应诺。师曰。是甚么。山无对。师曰。去
  ref: X80n1565_p0126a12（五灯会元）
