sayings:
- text: 僧问。生也不道。死也不道。为甚么不道。师曰。一言已出。曰。从东过西。又作么生。师曰。驷马难追。曰。学人总不与么。师曰。易开终始口。难保岁寒心
  ref: X80n1565_p0728b15（五灯会元）
