id: 婺州云幽重恽禅师
name: 婺州云幽重恽
school: —
teacher: 未详
status: draft
bio: 今曰法云初谒雪峰。次依石霜。乃开悟。旋里隐居。蔽形唯一衲。住后
sayings:
- text: 上堂。云幽一只箭。虗空无背面。射去遍十方。要且无人见。时有
  ref: X80n1565_p0221a14（五灯会元）
- text: 僧问。如何是和尚一只箭。师曰。尽大地人无髑髅
  ref: X80n1565_p0221a14（五灯会元）
