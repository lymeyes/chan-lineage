id: 福州天王志清禅师
name: 福州天王志清
school: 杨岐派
teacher: 西禅鼎需禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0827b12。
sayings:
- text: 上堂。竖起拂子云。只这个天不能盖。地不能载。遍界遍空。成团成块。到这里三世诸佛向甚么处摸索。六代祖师向甚么处提持。天下衲僧向甚么处名邈。除非自得自证。便乃敲唱双行。虽然如是。未是衲僧行履处。作么生是衲僧行履处。是非海里横身入。豺虎丛中纵步行。南剑州剑门安分庵主南剑州剑门安分庵主少与木庵同隶业安国。后依懒庵。未有深证。辞谒径山大慧。行次江干。仰瞻宫阙。闻街司喝侍郎来。释然大悟。作偈曰。几年个事挂胸怀。问尽诸方眼不开。肝胆此时俱裂破。一声江上侍郎来。遂径回西禅。懒庵迎之。付以伽棃。自尔不规所寓。后庵居剑门。化被岭表。学者从之。所作偈颂。走手而成。凡千余首。盛行于世
  ref: X80n1565_p0827b12（五灯会元）
- text: 示众。这一片田地。汝等诸人。且道天地未分已前在甚么处。直下彻去。已是钝置分上座不少了也。更若拟议思量。何啻白云万里。蓦拈拄杖。打散大众
  ref: X80n1565_p0827b12（五灯会元）
- text: 示众。上至诸佛。下及众生。性命总在山僧手里。检点将来。有没量罪过。还有检点得出者么。卓拄杖一下曰。冤有头。债有主。遂左右顾视曰。自出洞来无敌手。得饶人处且饶人
  ref: X80n1565_p0827b12（五灯会元）
- text: 示众。十五日已前。天上有星皆拱北。十五日已后。人间无水不朝东。已前已后总拈却。到处乡谈各不同。乃屈指曰。一二三四五。六七八九十。十一十二十三十四。诸兄弟今日是几。良久曰。本店买卖。分文不賖
  ref: X80n1565_p0827b12（五灯会元）
