bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0546b18。
sayings:
- text: 上堂。步入道场。影涵宗鉴。粲粲星罗霁夜。英英花吐春时。木人密运化机。丝毫不爽。石女全提空印。文彩未彰。且道不一不异。无去无来。合作么生体悉。的的纵横皆妙用。阿侬元不异中来
  ref: X80n1565_p0546b18（五灯会元）
