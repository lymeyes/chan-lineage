id: L::隆兴府景福日余禅师
name: 隆兴府景福日余
school: 杨岐派
teacher: 保宁勇
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0737b01。
sayings:
- text: 僧问。如何是道。师曰。天共白云晓。水和明月流。曰。如何是道中人。师曰。先行不到。末后太过。又僧出众画一圆相。师以手画一画。僧作舞归众。师曰。家有白泽之图。必无如是妖怪。乃拈拄杖曰。无量诸佛向此转大法轮。今古祖师向此演大法义。若信得及。法法本自圆成。念念悉皆具足。若信不及。山僧今日。因行不妨掉臂。更为重说偈言。卓一下。下座
  ref: X80n1565_p0737b01（五灯会元）
