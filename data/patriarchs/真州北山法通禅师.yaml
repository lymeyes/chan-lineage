id: 真州北山法通禅师
name: 真州北山法通
school: 法眼宗
teacher: 长芦清了禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0547a04。
sayings:
- text: 上堂。吞尽三世底。为甚么开口不得。照破四天下底。为甚么开眼不得。作么生得十成通畅去。金针双鏁备。叶露隐全该
  ref: X80n1565_p0547a04（五灯会元）
- text: 僧问。断言语。绝思惟处。乞师指示。师曰。滴水不入石
  ref: X80n1565_p0547a04（五灯会元）
