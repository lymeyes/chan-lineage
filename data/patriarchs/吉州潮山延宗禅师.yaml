id: 吉州潮山延宗禅师
name: 吉州潮山延宗
school: —
teacher: 雪峰义存禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0268b13。
sayings:
- text: 问。和尚住此山。得几年也。师曰。钝鸟栖芦。困鱼止泺。曰。恁么则真道人也。师曰。且坐吃茶
  ref: X80n1565_p0268b13（五灯会元）
- text: 问。如何是潮山。师曰。不宿尸。曰。如何是山中人。师曰。石上种红莲
  ref: X80n1565_p0268b13（五灯会元）
- text: 问。如何是和尚家风。师曰。切忌犯朝仪
  ref: X80n1565_p0268b13（五灯会元）
