id: 潭州兴化绍清禅师
name: 潭州兴化绍清
school: 临济宗
teacher: 兴化岳禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0458b07。
sayings:
- text: 上堂。祖师门下。佛法不存。善法堂前。仁义休说。然虽如是。事无一向。窃闻哀哀父母。生我劬劳。欲报深恩。昊天罔极。发肤身体。弗敢毁伤。此鲁仲尼之孝也。轮转三界中。恩爱不能舍。弃恩入无为。真实报恩者。故我大觉世尊。雪山苦行。摩竭成道。往忉利天为母说法。此释迦之孝也。得大解脱。运大神通。手擎金锡。掌拓龙盂。诣地狱门。卓然寻省。见其慈母。悲泣无量。此目连之孝也。作么生是兴化之孝。良久曰。兴化今日不上天堂。不入地狱。于善法堂中．灯王座上。为母说法。以报劬劳。且道我母即今在甚么处。乃曰。我母生前足善缘。无劳问佛定生天。人间上寿古今少。九十春秋减一年。下座。敢烦大众烧一炷香。以助山僧报孝。既是山僧之母。为甚么却烦诸人烧香。不见道。东家人死。西家人助哀。以手捶胸曰。苍天。苍天
  ref: X80n1565_p0458b07（五灯会元）
