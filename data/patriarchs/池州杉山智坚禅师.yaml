id: 池州杉山智坚禅师
name: 池州杉山智坚
school: 南岳系
teacher: 马祖一
status: draft
bio: 初与归宗．南泉行脚时。路逢一虎。各从虎边过了。泉问归宗。适来见虎似个甚么。宗曰。似个猫儿。宗却问师。师曰。似个狗子。又问南泉。泉曰。我见是个大虫。师吃饭次。南泉収生饭。乃曰。生𫆏。师曰。无生。泉曰。无生犹是末。泉行数步。师召曰。长老。泉回头曰。作么。师曰。莫道是末。普请择蕨次。南泉拈起一茎曰。这个大好供养。师曰。非但这个。百味珍羞。他亦不顾。泉曰。虽然如是。个个须尝过始得玄觉云。是相见语不是相见语
sayings:
- text: 僧问。如何是本来身。师曰。举世无相似
