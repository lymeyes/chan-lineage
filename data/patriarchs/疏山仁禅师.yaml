id: 疏山仁禅师
name: 疏山匡仁
school: 曹洞宗
teacher: 禅宗法脉
bio: 洞山良价禅师法嗣，住抚州疏山。于洞山会下入室得法，以机辩见称。
sayings:
- text: 僧问：「如何是疏山？」师曰：「我曾向人道了也。」曰：「如何是疏山家风？」师曰：「粗杓簸箕，杓柄长短。」
  ref: 五灯会元·卷十三·疏山匡仁禅师
