id: 洪州泐潭法会禅师
name: 洪州泐潭法会
school: 南岳系
teacher: 马祖一
status: draft
bio: 问马祖。如何是祖师西来意。祖曰。低声。近前来。向汝道。师便近前。祖打一掴曰。六耳不同谋。且去。来日来。师至来日。独入法堂曰。请和尚道。祖曰。且去。待老汉
sayings:
- text: 上堂出来问。与汝证明。师忽有省。遂曰。谢大众证明。乃绕法堂一匝。便去
  ref: X80n1565_p0105b18（五灯会元）
