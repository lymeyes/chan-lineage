id: 净因法成禅师
name: 净因法成
alias: 净因成
school: 法眼宗
teacher: 芙蓉道楷禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0534b14。
sayings:
- text: 上堂。灯笼忽尔笑咍咍。如何露柱亦怀胎。天明生得白头女。至今游荡不归来。这冤家。好归来。黄花与翠竹。早晚为谁栽
  ref: X80n1565_p0534b14（五灯会元）
- text: 上堂。知有佛祖向上事。方有说话分。诸禅德且道。那个是佛祖向上事。有个人家儿子。六根不具。七识不全。是大阐提无佛种性。逢佛杀佛。逢祖杀祖。天堂收不得。地狱摄无门。大众还识此人么。良久曰。对面不仙陀。睡多饶寐语
  ref: X80n1565_p0534b14（五灯会元）
- text: 上堂。归元性无二。方便有多门。但了归元性。何愁方便门。诸人要会归元性么。露柱将来作木杓。旁人不肯任从伊。要会方便门么。木杓将来作露拄。撑天拄地也相宜。且道不落方便门一句作么生道。三十年后莫教错举
  ref: X80n1565_p0534b14（五灯会元）
