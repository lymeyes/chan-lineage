id: 龙门清远禅师
name: 龙门清远
alias: 龙门远
school: 杨岐派
teacher: 五祖法演禅师
status: draft
bio: 蜀之临卭人，族李氏。为人严正寡言，年十四圆具，常依毗尼。师因读法华，至是法非思量分别之所能解，持问讲者，莫能对。遂南游江淮，首参真觉胜禅师，无契。弃依太平，事祖数载。因丐于庐州，偶雨，足跌仆地。烦懑间，闻二人交相恶骂，谏者曰：儞犹自烦恼在。师于言下有省。及归侍祖，祖见师，凡有所问，即曰：我不如儞，儞自会得好。或曰：我不会，我不如儞。师愈疑，每咨决于元礼首座。礼一日见师，欲诉意，遽引师耳绕围炉，旋行旋告之曰：儞自会得好。师曰：凭公开发，乃尔相戏耶？礼曰：儞他后悟去，方知今日曲折耳。后典宾海会，雨夜读传灯录，至破灶堕因缘，忽拨火大悟，作偈曰：刀刀林鸟啼，披衣终夜坐。拨火悟平生，穷神归破堕。事皎人自迷，曲淡谁能和？念之永不忘，门开少人过。圆悟闻之，问曰：青林般土话，古今无人出得，儞如何会？云：也有甚难。曰：只如他道铁轮天子寰中旨，意作么生？云：我道帝释宫中放赦书。悟喜曰：远兄便有活人句。祖亦然之。自是隐居四面大中庵。属天下一新崇宁万寿寺，舒守王公涣之命师开法。次补龙门，道望尤振，学者争集。逾十二年，　𠡠居和之褒禅，枢密邓公洵武奏　赐师号及紫方袍
sayings:
- text: 上堂曰：台山路上，过客全稀。破灶堂前，感恩无地。雪埋庭柏，冰鏁偃谿。虽在南方火炉头，不入他家韲瓮里。看看腊月三十日，便是孟春犹寒。儞等诸人，各须努力向前，切忌自生退屈
  ref: X79n1559_p0183a06（嘉泰普灯录）
- text: 上堂，卓拄杖曰：圆明了知，不由心念。抵死要道，堕坑落壍。毕竟如何？乃倚拄杖，下座
  ref: X79n1559_p0183a06（嘉泰普灯录）
- text: 上堂：泡幻同无碍，如何不了悟？眼里瞳人吹叫子。达法在其中，非今亦非古，六只骰子满盆红。大众，时人为甚么坐地看杨州？钵盂著柄新翻样，牛上骑牛笑杀人
  ref: X79n1559_p0183a06（嘉泰普灯录）
- text: 上堂：赵州不见南泉，山僧不识五祖。甜瓜彻蒂甜，苦瓠连根苦
  ref: X79n1559_p0183a06（嘉泰普灯录）
- text: 上堂：一叶落，天下春，无路寻思笑杀人。下是天，上是地，此言不入时流意。南作北，东作西，动而止，喜而悲。虵头蝎尾一试之，猛虎口里活雀儿。是何言？归堂去！
  ref: X79n1559_p0183a06（嘉泰普灯录）
- text: 上堂：面前过，便知是张三李四。背后过，为甚么却不见？壁这边，便见条台倚子。壁那下，为甚么分疏不得？咫尺之间尚尔，况十方世界耶？参学人若不明此，当知参学事卒未在
  ref: X79n1559_p0183a06（嘉泰普灯录）
- text: 上堂：苏武牧羊，辱而不屈。李陵望汉，乐矣忘归。是在外国？在本国？佛诸弟子中，有者双足越坑、有者聆筝起舞、有者身埋粪壤、有者呵骂河神，是习气？是妙用？至于擎叉打地、竖拂敲床，睦州一向闭门、鲁祖终年面壁，是为人？是不为人？信知一切凡夫埋没宝藏，殊不丈夫。诸人何不摆拖张帆、抛江过岸？休更钉桩摇橹，何日到家？既作曹溪人，又是家里汉。还见家里事么？
  ref: X79n1559_p0183a06（嘉泰普灯录）
- text: 僧问：劫火洞然，大千俱坏。未审这个坏不坏？曰：黑漆桶里黄金色
  ref: X79n1559_p0183a06（嘉泰普灯录）
- text: 问：道远乎哉？触事而真。如何是道？曰：顶上八尺五。云：此理如何？曰：方圆七八寸
  ref: X79n1559_p0183a06（嘉泰普灯录）
- text: 问：劫火威音前，别是一壶天。御楼前射猎，不是刈茅田。提起坐具，云：这个唤作甚么？曰：正是刈茅田。僧便喝。师曰：犹作主在。　问僧：孤灯独照时如何？僧无对。代曰：露柱证明，闻开静板声。师乃曰：据款结案。宣和初，以病辞归蒋山之东堂。二年，书云：前一日，饭食讫，趺坐，谓其徒曰：诸方老宿临终必留偈辞世，世可辞耶？且将安往？乃合掌，怡然趋寂。门人函骨归龙门，塔于灵光台侧。寿五十四，腊四十
  ref: X79n1559_p0183a06（嘉泰普灯录）
