id: 福州报慈院光云慧觉禅师
name: 福州报慈院光云慧觉
school: —
teacher: 长庆棱
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0286a06。
sayings:
- text: 上堂。瘥病之药。不假驴驼。若据如今。各自归堂去。珍重。问僧。近离甚处。曰。卧龙。师曰。在彼多少时。曰。经冬过夏。师曰。龙门无宿客。为甚在彼许多时。曰。师子窟中无异兽。师曰。汝试作师子吼看。曰。若作师子吼。即无和尚。师曰。念汝新到。放汝三十棒
  ref: X80n1565_p0286a06（五灯会元）
- text: 问。承闻超觉有锁口诀。如何示人。师曰。赖我拄杖不在手。曰。恁么则深领尊慈也。师曰。待我肯汝即得。闽王
  ref: X80n1565_p0286a06（五灯会元）
- text: 问。报慈与神泉相去近远。师曰。若说近远。不如亲到。师却
  ref: X80n1565_p0286a06（五灯会元）
- text: 问。大王日应千差。是甚么心。王曰。甚么处得心来。师曰。岂有无心者。王曰。那边事作么生。师曰。请向那边
  ref: X80n1565_p0286a06（五灯会元）
- text: 问。王曰。大师谩别人即得
  ref: X80n1565_p0286a06（五灯会元）
- text: 问。大众臻凑。请
  ref: X80n1565_p0286a06（五灯会元）
- text: 师举扬。师曰。更有几人未闻。曰。恁么则不假上来也。师曰。不上来且从。汝向甚么处会。曰。若有处所。即孤负和尚去也。师曰。祇恐不辨精麤
  ref: X80n1565_p0286a06（五灯会元）
- text: 问。夫说法者当如法说。此意如何。师曰。有甚么疑讹
  ref: X80n1565_p0286a06（五灯会元）
- text: 问。古人面壁意旨如何。师便打
  ref: X80n1565_p0286a06（五灯会元）
- text: 问。不假言诠。请师径直。师曰。何必更待商量
  ref: X80n1565_p0286a06（五灯会元）
