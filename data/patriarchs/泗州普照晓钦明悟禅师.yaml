bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0460a16。
sayings:
- text: 僧问。师唱谁家曲。宗风嗣阿谁。师曰。东边更近东。曰。沩山的子．智海亲孙也。师曰。却笑傍人把钓竿
  ref: X80n1565_p0460a16（五灯会元）
- text: 上堂。引手撮空。展转莫及。翻身掷影。徒自劳形。当面拈来。却成蹉过。毕竟如何。拍禅床曰。洎合错商量
  ref: X80n1565_p0460a16（五灯会元）
