id: L::新罗国云住和尚
name: 新罗国云住
school: 曹洞宗
teacher: 云居膺
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0502b09。
sayings:
- text: 僧问。诸佛道不得。甚么人道得。师曰。老僧道得。曰。诸佛道不得。和尚作么生道。师曰。诸佛是我弟子。曰。请和尚道。师曰。不是对君王。好与二十棒
  ref: X80n1565_p0502b09（五灯会元）
- text: 问。达磨未来时如何。师曰。夜半石牛吼。曰。来后如何。师曰。特地使人愁
  ref: X80n1565_p0502b09（五灯会元）
- text: 问。既是普眼。为甚不见普贤。师曰。祇为贪程太速。󱣝珏和尚
  ref: X80n1565_p0502b09（五灯会元）
- text: 僧问。学人不负师机。还免披毛带角也无。师曰。阇黎何得对面不相识。曰。恁么。则吞尽百川水。方明一点心。师曰。虽脱毛衣。犹披鳞甲。曰。好来和尚具大慈悲。师曰。尽力道。也出老僧格不得
  ref: X80n1565_p0502b09（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0502b09），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
