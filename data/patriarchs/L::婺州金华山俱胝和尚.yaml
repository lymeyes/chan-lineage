id: L::婺州金华山俱胝和尚
name: 婺州金华山俱胝
school: 南岳系
teacher: 杭州天龙
status: draft
bio: 初住庵时。有尼名实际来。戴笠子执锡绕师三匝。曰。道得即下笠子。如是三
sayings:
- text: 问。师皆无对。尼便去。师曰。日势稍晚。何不且住。尼曰。道得即住。师又无对。尼去后。师叹曰。我虽处丈夫之形。而无丈夫之气。不如弃庵。往诸方参寻知识去。其夜山神告曰。不须离此。将有肉身菩萨来为和尚说法也。逾旬。果天龙和尚到庵。师乃迎礼。具陈前事。龙竖一指示之。师当下大悟。自此凡有学者参
  ref: X80n1565_p0159a12（五灯会元）
- text: 问。师唯举一指。无别提唱。有一供过童子。每见人问事。亦竖指祇对。人谓师曰。和尚。童子亦会佛法。凡有问皆如和尚竖指。师一日潜袖刀子。问童曰。闻你会佛法。是否。童曰。是。师曰。如何是佛。童竖起指头。师以刀断其指。童叫唤走出。师召童子。童回首。师曰。如何是佛。童举手不见指头。豁然大悟。师将顺世。谓众曰。吾得天龙一指头禅。一生用不尽。言讫。示灭长庆代众云。美食不中饱人吃。玄沙云。我当时若见拗折指头。玄觉云。且道玄沙恁么道。意作么生。云居锡云。祇如玄沙恁么道。肯伊不肯伊。若肯。何言拗折指头。若不肯。俱胝过在甚么处。先曹山云。俱胝承当处卤莽。祇认得一机一境。一等是拍手拊掌。是他西园奇怪。玄觉又云。且道俱胝还悟也无。若悟。为甚么道承当处卤莾。若不悟。又道用一指头禅不尽。且道曹山意在甚么处。南岳下五世南岳下五世睦州陈尊宿法嗣睦州陈尊宿法嗣睦州刺史陈操尚书睦州刺史陈操尚书斋次。拈起糊饼。问僧。江西．湖南还有这个么。曰。尚书适来吃个甚么。公曰。敲钟谢响。又斋僧次。躬自行饼。一僧展手拟接。公却缩手。僧无语。公曰。果然。果然。问僧。有个事与上座商量。得么。曰。合取狗口。公自掴口曰。某甲罪过。曰。知过必改。公曰。恁么则乞上座口吃饭。得么。又斋僧自行食次。乃曰。上座施食。僧曰。三德六味。公曰。错。僧无对。又与僚属登楼次。见数僧行来。有一官人曰。来者总是行脚僧。公曰。不是。曰。焉知不是。公曰。待来勘过。须臾僧至楼前。公蓦唤上座。僧皆举首。公谓诸官曰。不信道。又与禅者颂曰。禅者有玄机。机玄是复非。欲了机前旨。咸于句下违
  ref: X80n1565_p0159a12（五灯会元）
