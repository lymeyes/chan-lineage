bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0275b15。
sayings:
- text: 问。百年后忽有人
  ref: X80n1565_p0275b15（五灯会元）
- text: 问。和尚以何指示。山乃放身便倒。师从此契悟。即礼谢。住后
  ref: X80n1565_p0275b15（五灯会元）
- text: 僧问。如何是佛法大意。师曰。寒暑相催
  ref: X80n1565_p0275b15（五灯会元）
