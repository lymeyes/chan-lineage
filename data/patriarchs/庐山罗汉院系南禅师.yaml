sayings:
- text: 上堂。禅不禅。道不道。三寸舌头胡乱扫。昨夜日轮飘桂华。今朝月窟生芝草。阿呵呵。万两黄金无处讨。一向绝思量。诸法不相到。师临示寂。升座告众曰。罗汉今日。倒骑铁马。逆上须弥。踏破虗空。不留眹迹。乃归方丈。跏趺而逝
  ref: X80n1565_p0686a06（五灯会元）
