id: L::福州莲华永福院从弇超证禅师
name: 福州莲华永福院从弇超证
school: —
teacher: 雪峰存
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0265b06。
sayings:
- text: 僧问。儒门以五常为极则。未审宗门以何为极则。师良久。僧曰。恁么则学人造次也。师曰。好与拄杖
  ref: X80n1565_p0265b06（五灯会元）
- text: 问。教中道。唯有一乘法。如何是一乘法。师曰。汝道我在这里作甚么。曰。恁么则不知教意也。师曰。虽然如此。却不孤负汝
  ref: X80n1565_p0265b06（五灯会元）
- text: 问。不向问处领。犹是学人问处。和尚如何。师曰。吃茶去
  ref: X80n1565_p0265b06（五灯会元）
- text: 上堂。长庆道。尽法无民。永福即不然。若不尽法。又争得民。时有僧曰。请师尽法。师曰。我不要汝纳税
  ref: X80n1565_p0265b06（五灯会元）
- text: 问。聊径处乞师垂慈。师曰。不快礼三拜
  ref: X80n1565_p0265b06（五灯会元）
- text: 问。大众云集。请师说法。师曰。闻么。曰。若更伫思。应难得及。师曰。实即得
  ref: X80n1565_p0265b06（五灯会元）
- text: 问。摩尼殿有四角。一角常露。如何是常露底角。师曰。不可更点。师一日
  ref: X80n1565_p0265b06（五灯会元）
- text: 上堂。于座边立。谓众曰。二尊不并化。便归方丈
  ref: X80n1565_p0265b06（五灯会元）
