bio: 生平部分原文未载，仅存机缘语（见下）；据《景德传灯录》T51n2076_p0403a03。
sayings:
- text: 僧问。诸官已结人天会。报恩今日事如何。师曰。阇梨到诸方分明举。问如何是佛法大意。师曰。闪烁乌飞急。奔腾兔走频
  ref: T51n2076_p0403a03（景德传灯录）
