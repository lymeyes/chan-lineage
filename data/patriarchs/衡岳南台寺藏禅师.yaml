id: 衡岳南台寺藏禅师
name: 衡岳南台寺藏
school: —
teacher: 云盖景
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0218a04。
sayings:
- text: 僧问。远远投师。请师一接。师曰。不隔户
  ref: X80n1565_p0218a04（五灯会元）
- text: 问。如何是南台境。师曰。松韵拂时石不点。孤峰山下垒难齐。曰。如何是境中人。师曰。岩前栽野菓。接待往来宾。曰。恁么则谢师供养。师曰。怎生滋味
  ref: X80n1565_p0218a04（五灯会元）
- text: 问。如何是法堂。师曰。无壁落
  ref: X80n1565_p0218a04（五灯会元）
- text: 问。不顾诸缘时如何。师良久
  ref: X80n1565_p0218a04（五灯会元）
