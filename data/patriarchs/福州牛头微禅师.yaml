id: 福州牛头微禅师
name: 福州牛头微
school: 青原系
teacher: 投子同
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0207a15。
sayings:
- text: 上堂。三世诸佛。用一点伎俩不得。天下老师口似匾担。诸人作么生。大不容易。除非知有。余莫能知
  ref: X80n1565_p0207a15（五灯会元）
- text: 僧问。如何是和尚家风。师曰。山畬脱粟饭。野菜澹黄虀。曰。忽遇上客来。又作么生。师曰。吃即从君吃。不吃任东西
  ref: X80n1565_p0207a15（五灯会元）
- text: 问。不问骊龙颔下珠。如何识得家中宝。师曰。忙中争得作闲人
  ref: X80n1565_p0207a15（五灯会元）
