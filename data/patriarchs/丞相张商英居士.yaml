id: 丞相张商英居士
name: 丞相张商英
school: 黄龙派
teacher: 兜率从悦禅师
status: draft
bio: 字天觉。号无尽。年十九。应举入京。道由向氏家。向预梦神人报曰。明日接相公。凌晨公至。向异之。劳问勤腆。乃曰。秀才未娶。当以女奉洒扫。公谦辞再三。向曰。此行若不了当。吾亦不爽前约。后果及第。乃娶之。初任主簿。因入僧寺。见藏经梵夹。金字齐整。乃怫然曰。吾孔圣之书。不如胡人之教人所仰重。夜坐书院中。研墨吮笔。凭纸长吟。中夜不眠。向氏呼曰。官人。夜深何不睡去。公以前意白之。正此著无佛论。向应声曰。既是无佛。何论之有。当须著有佛论始得。公疑其言。遂已之。后访一同列。见佛龛前经卷。乃问曰。此何书也。同列曰。维摩诘所说经。公信手开卷。阅到此病非地大。亦不离地大处。叹曰。胡人之语。亦能尔耶
sayings:
- text: 问。此经几卷。曰。三卷。乃借归阅次。向氏
  ref: X80n1565_p0705a08（五灯会元）
- text: 问。看何书。公曰。维摩诘所说经。向曰。可熟读此经。然后著无佛论。公悚然异其言。由是深信佛乘。留心祖道。元祐六年。为江西漕。首谒东林照觉总禅师。觉诘其所见处。与己符合。乃印可。觉曰。吾有得法弟子住玉谿。乃慈古镜也。亦可与语。公复因按部过分宁。诸禅迓之。公到。先致敬玉谿慈。次及诸山。最后问兜率悦禅师。悦为人短小。公曾见龚德庄说其聪明可人。乃曰。闻公善文章。悦大笑曰。运使失却一只眼了也。从悦。临济九世孙。对运使论文章。政如运使对从悦论禅也。公不然其语。乃强屈指曰。是九世也
  ref: X80n1565_p0705a08（五灯会元）
- text: 问。玉谿去此多少。曰。三十里。曰。兜率𫆏。曰。五里。公是夜乃至兜率。悦先一夜梦日轮升天。被悦以手抟取。乃说与首座曰。日轮运转之义。闻张运使非久过此。吾当深锥痛札。若肯回头。则吾门幸事。座曰。今之士大夫。受人取奉惯。恐其恶发。别生事也。悦曰。正使烦恼。祇退得我院。也别无事。公与悦语次。称赏东林。悦未肯其说。公乃题寺后拟瀑轩诗。其略曰。不向庐山寻落处。象王鼻孔谩辽天。意讥其不肯东林也。公与悦语至更深。论及宗门事。悦曰。东林既印可运使。运使于佛祖言教有少疑否。公曰。有。悦曰。疑何等语。公曰。疑香严独脚颂．德山拓钵话。悦曰。既于此有疑。其余安得无耶。祇如岩头言末后句。是有耶是无耶。公曰。有。悦大笑。便归方丈。闭却门。公一夜睡不稳。至五更下床。触翻溺器。乃大彻。猛省前话。遂有颂曰。鼓寂钟沉拓钵回。岩头一拶语如雷。果然祇得三年活。莫是遭他授记来。遂扣方丈门。曰。某已捉得贼了。悦曰。赃在甚处。公无语。悦曰。都运且去。来日相见。翌日。公遂举前颂。悦乃谓曰。参禅祇为命根不断。依语生解。如是之说。公已深悟。然至极微细处。使人不觉不知。堕在区宇。乃作颂证之曰。等闲行处。步步皆如。虽居声色。宁滞有无。一心靡异。万法非殊。休分体用。莫择精麤。临机不碍。应物无拘。是非情尽。凡圣皆除。谁得谁失。何亲何疏。拈头作尾。指实为虗。翻身魔界。转脚邪涂。了无逆顺。不犯工夫。公邀悦至建昌。途中一一伺察。有十颂叙其事。悦亦有十颂酬之。时元祐八年八月也。公一日谓大慧曰。余阅雪窦拈古。至百丈再参马祖因缘。曰大冶精金。应无变色。投卷叹曰。审如是。岂得有临济今日耶。遂作一颂曰。马师一喝大雄峰。深入髑髅三日聋。黄檗闻之惊吐舌。江西从此立宗风。后平禅师致书云。去夏读临济宗派。乃知居士得大机大用。且求颂本。余作颂寄之曰。吐舌耳聋师已晓。捶𮌎祇得哭苍天。盘山会里翻筋斗。到此方知普化颠。诸方往往以余聪明博记。少知余者。师自江西法窟来。必辨优劣。试为老夫言之。大慧曰。居士见处。与真净死心合。公曰。何谓也。大慧举真净颂曰。客情步步随人转。有大威光不能现。突然一喝双耳聋。那咤眼开黄檗面。死心拈曰。云岩要问雪窦。既是大冶精金。应无变色。为甚么却三日耳聋。诸人要知么。从前汗马无人识。祇要重论盖代功。公拊几曰。不因公语。争见真净死心用处。若非二大老。难显雪窦马师尔。公于宣和四年十一月黎明。口占遗表。命子弟书之。俄取枕掷门窗上。声如雷震。众视之。已薨矣。公有颂古行于世。兹不复录
  ref: X80n1565_p0705a08（五灯会元）
