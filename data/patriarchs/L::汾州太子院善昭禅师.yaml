id: L::汾州太子院善昭禅师
name: 汾州太子院善昭
school: 临济宗
teacher: 首山念
status: draft
bio: 太原俞氏子。剃发受具。杖䇿游方。所至少留。随机叩发。历参知识七十一员。后到首山
sayings:
- text: 问。百丈卷席。意旨如何。山曰。龙袖拂开全体现。曰。师意如何。山曰。象王行处绝狐踪。师于言下大悟。拜起而曰。万古碧潭空界月。再三捞摝始应知。有问者曰。见何道理。便尔自肯。师曰。正是我放身命处。后游衡湘及襄沔间。每为郡守以名刹力致。前后八请。坚卧不答。洎首山殁。西河道俗遣僧契聪迎请住持。师闭关高枕。聪排闼而入。让之曰。佛法大事。靖退小节。风穴惧应谶。忧宗旨坠灭。幸而有先师。先师已弃世。汝有力荷担如来大法者。今何时而欲安眠哉。师矍起。握聪手曰。非公不闻此语。趣办严。吾行矣。住后
  ref: X80n1565_p0413a13（五灯会元）
- text: 上堂。谓众曰。汾阳门下有西河师子。当门踞坐。但有来者。即便𫜪杀。有何方便。入得汾阳门。见得汾阳人。若见汾阳人者。堪与祖佛为师。不见汾阳人。尽是立地死汉。如今还有人入得么。快须入取。免得孤负平生。不是龙门客。切忌遭点额。那个是龙门客。一齐点下。举起拄杖曰。速退。速退。珍重
  ref: X80n1565_p0413a13（五灯会元）
- text: 上堂。先圣云。一句语须具三玄门。一玄门须具三要。阿那个是三玄三要底句。快会取好。各自思量。还得稳当也未。古德已前行脚。闻一个因缘。未明中间。直下饮食无味。睡卧不安。火急决择。莫将为小事。所以大觉老人。为一大事因缘出现于世。想计他从上来行脚。不为游山玩水。看州府奢华。片衣口食。皆为圣心未通。所以驱驰行脚。决择深奥。传唱敷扬。博问先知。亲近高德。葢为续佛心灯。绍隆祖代。兴崇圣种。接引后机。自利利他。不忘先迹。如今还有商量者么。有即出来。大家商量
  ref: X80n1565_p0413a13（五灯会元）
- text: 僧问。如何是接初机底句。师曰。汝是行脚僧。曰。如何是辩衲僧底句。师曰。西方日出卯。曰。如何是正令行底句。师曰。千里持来呈旧面。曰。如何是立乾坤底句。师曰。北俱卢洲长粳米。食者无贪亦无瞋。乃曰。将此四转语验天下衲僧。才见你出来。验得了也
  ref: X80n1565_p0413a13（五灯会元）
- text: 问。如何是学人著力处。师曰。嘉州打大像。曰。如何是学人转身处。师曰。陕府灌铁牛。曰。如何是学人亲切处。师曰。西河弄师子。乃曰。若人会得此三句。已辩三玄。更有三要语在。切须荐取。不是等闲。与大众颂出。三玄三要事难分。得意忘言道易亲。一句明明该万象。重阳九日菊花新。师为并汾苦寒。乃罢夜参。有异比丘振锡而至。谓师曰。会中有大士六人。奈何不说法。言讫而去。师密记以偈曰。胡僧金锡光。为法到汾阳。六人成大器。劝请为敷扬
  ref: X80n1565_p0413a13（五灯会元）
- text: 上堂。凡一句语须具三玄门。每一玄门须具三要。有照有用。或先照后用。或先用后照。或照用同时。或照用不同时。先照后用。且要共你商量。先用后照。你也须是个人始得。照用同时。你作么生当抵。照用不同时。你又作么生凑泊
  ref: X80n1565_p0413a13（五灯会元）
- text: 僧问。如何是大道之源。师曰。掘地觅天。曰。何得如此。师曰。不识幽玄
  ref: X80n1565_p0413a13（五灯会元）
- text: 问。如何是宾中宾。师曰。合掌庵前问世尊。曰。如何是宾中主。师曰。对面无俦侣。曰。如何是主中宾。师曰。阵云横海上。󳫠剑搅龙门。曰。如何是主中主。师曰。三头六臂擎天地。忿怒那咤扑帝钟
  ref: X80n1565_p0413a13（五灯会元）
- text: 上堂。汾阳有三诀。衲僧难辩别。更拟问如何。拄杖蓦头楔。时有
  ref: X80n1565_p0413a13（五灯会元）
- text: 僧问。如何是三诀。师便打。僧礼拜。师曰。为汝一时颂出。第一诀。接引无时节。巧语不能诠。云绽青天月。第二诀。舒光辩贤哲。问答利生心。拔却眼中楔。第三诀。西国胡人说。济水过新罗。北地用镔铁。复曰。还有人会么。会底出来通个消息。要知远近。莫祇恁么记言记语。以当平生。有甚么利益。不用久立。珍重
  ref: X80n1565_p0413a13（五灯会元）
- text: 僧问。如何是祖师西来意。师曰。青绢扇子足风凉
  ref: X80n1565_p0413a13（五灯会元）
- text: 问。布鼓当轩挂。谁是知音者。师曰。停鉏倾麦饭。卧草不擡头
  ref: X80n1565_p0413a13（五灯会元）
- text: 问。如何是道场。师曰。下脚不得
  ref: X80n1565_p0413a13（五灯会元）
- text: 问。如何是祖师西来意。师曰。彻骨彻髓。曰。此意如何。师曰。遍天遍地
  ref: X80n1565_p0413a13（五灯会元）
- text: 问。真正修道人。不见世间过。未审不见个甚么过。师曰。雪埋夜月深三尺。陆地行舟万里程。曰。和尚是何心行。师曰。却是你心行
  ref: X80n1565_p0413a13（五灯会元）
- text: 问。大悲千手眼。如何是正眼。师曰。瞎。曰。恁么则一条拄杖两人舁。师曰。三家村里唱巴歌。曰。恁么则和尚同在里头。师曰。谢汝殷勤
  ref: X80n1565_p0413a13（五灯会元）
- text: 问。如何是和尚家风。师曰。三玄开正道。一句破邪宗。曰。如何是和尚活计。师曰。寻常不掌握。供养五湖僧。曰。未审吃个甚么。师曰。天酥陀饭非珍馔。一味良羹饱即休
  ref: X80n1565_p0413a13（五灯会元）
- text: 问。牛头未见四祖时如何。师曰。新神更著师婆赛。曰。见后如何。师曰。古庙重遭措大题
  ref: X80n1565_p0413a13（五灯会元）
- text: 上堂。谓众曰。夫说法者。须具十智同真。若不具十智同真。邪正不辩。缁素不分。不能与人天为眼目。决断是非。如鸟飞空而折翼。如箭射的而断弦。弦断故射的不中。翼折故空不可飞。弦壮翼牢。空的俱彻。作么生是十智同真。与诸上座点出。一同一质。二同大事。三总同参。四同真志。五同遍普。六同具足。七同得失。八同生杀。九同音吼。十同得入。又曰。与甚么人同得入。与阿谁同音吼。作么生是同生杀。甚么物同得失。阿那个同具足。是甚么同遍普。何人同真志。孰能总同参。那个同大事。何物同一质。有点得出底么。点得出者不悋慈悲。点不出来。未有参学眼在。切须辩取。要识是非。面目见在。不可久立。珍重。龙德府尹李侯与师有旧。虗承天寺致之。使三反不赴。使者受罚。复至曰。必欲得师俱往。不然有死而已。师笑曰。老病业已不出山。借往当先后之。何必俱邪。使曰。师诺。则先后唯所择。师令馔设。且俶装曰。吾先行矣。停箸而化。阇维收舍利起塔
  ref: X80n1565_p0413a13（五灯会元）
