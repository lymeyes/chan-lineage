id: 洪州百丈明照安禅师
name: 洪州百丈明照安
school: —
teacher: 疏山仁
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0504a15。
sayings:
- text: 僧问。一藏圆光。如何是体。师曰。劳汝远来。曰。莫便是一藏圆光么。师曰。更吃一椀茶
  ref: X80n1565_p0504a15（五灯会元）
- text: 问。如何是和尚家风。师曰。手巾寸半布
  ref: X80n1565_p0504a15（五灯会元）
- text: 问。万法归一。一归何处。师曰。未有一个人不
  ref: X80n1565_p0504a15（五灯会元）
- text: 问。问。如何是极则处。师曰。空王殿里登九五。野老门前不立人
  ref: X80n1565_p0504a15（五灯会元）
- text: 问。随缘认得时如何。师曰。未认得时作么生
  ref: X80n1565_p0504a15（五灯会元）
- text: 问。如何是毗卢师。师曰。人天收不得。曰。如何是一代时教。师曰。义例分明
  ref: X80n1565_p0504a15（五灯会元）
