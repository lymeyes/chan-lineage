id: L::韶州龙光𬤇禅师
name: 韶州龙光𬤇
school: 曹洞宗
teacher: 青林虔
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0507b09。
sayings:
- text: 僧问。人王与法王。相见时如何。师曰。越国君王曾按剑。龙光一句不曾亏
  ref: X80n1565_p0507b09（五灯会元）
- text: 上堂。良久曰。不烦珍重
  ref: X80n1565_p0507b09（五灯会元）
- text: 问。如何是西来意。师曰。胡风一扇。汉地成规
  ref: X80n1565_p0507b09（五灯会元）
- text: 问。拨尘见佛时如何。师拊掌顾视
  ref: X80n1565_p0507b09（五灯会元）
- text: 问。如何是龙光一句。师曰。不空罥索。曰。学人不会。师曰。唵
  ref: X80n1565_p0507b09（五灯会元）
- text: 问。如何是极则为人处。师曰。殷勤嘱付后来人
  ref: X80n1565_p0507b09（五灯会元）
- text: 问。宾头卢一身。为甚么赴四天下供。师曰。千江同一月。万户尽逢春。遂有偈曰。龙光山顶宝月轮。照耀乾坤烁暗云。尊者不移元一质。千家影现万家春
  ref: X80n1565_p0507b09（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0507b09），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
