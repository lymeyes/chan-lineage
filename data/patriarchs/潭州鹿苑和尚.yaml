id: 潭州鹿苑和尚
name: 潭州鹿苑
school: 云门宗
teacher: 资福宝
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0336b02。
sayings:
- text: 僧问。余国作佛。还有异名也无。师作此○相示之
  ref: X80n1565_p0336b02（五灯会元）
- text: 问。如何是鹿苑一路。师曰。吉獠舌头问将来
  ref: X80n1565_p0336b02（五灯会元）
- text: 问。如何是闭门造车。师曰。南岳石桥。曰。如何是出门合辙。师曰。拄杖头鞋
  ref: X80n1565_p0336b02（五灯会元）
- text: 上堂。展手曰。天下老和尚．诸上座命根。总在这里。有僧出曰。还收得也无。师曰。天台石桥侧。曰。某甲不恁么。师曰。伏惟尚飨
  ref: X80n1565_p0336b02（五灯会元）
- text: 问。如何是世尊不说说。师曰。须弥山倒。曰。如何是迦叶不闻闻。师曰。大海枯竭
  ref: X80n1565_p0336b02（五灯会元）
