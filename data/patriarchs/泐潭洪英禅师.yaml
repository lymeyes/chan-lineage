id: 泐潭洪英禅师
name: 泐潭洪英
alias: 泐潭英
school: 黄龙派
teacher: 黄龙慧南禅师
status: draft
bio: 姓陈氏邵武军人。幼警敏读书五行俱下。父母爱之使为书生习进士。师不食自誓恳求出家。及成大僧即行访道。东游至曹山依止耆年雅公。久之辞去登云居。眷岩壑胜绝为终焉之计。阅华严十明论。至为真智慧无体性。不能自知无性故为无性之性。不能自知无性故名曰无明。华严第六地曰。不了第一义故号曰无明。将知真智慧本无性故不能自了。若遇了缘而了则无明灭矣。是谓成佛要门。愿以此法绍隆佛种。然今诸方谁可语此。既而曰。有积翠老子在。即日往黄蘗谒南禅师。夜语达旦。南惟加敬而未许入室。师往往呈语。南惟默然。一日因取经函忽失手而坠。戛然有声遂顿悟。径造方丈陈其所解。南曰。汝乃吾家英雄具正眼者善自护持。时会下龙象杂遝。而师议论英发常倾四坐。声名藉甚。乃游西山遇南昌潘居士同宿双岭。居士言。龙潭见天皇时节冥合孔子。师惊
sayings:
- text: 问。何以验之。居士举孔子曰。二三子以我为隐乎。吾无隐乎尔。吾无行而不与二三子者是丘也。天皇云。汝擎茶来吾与汝接。汝行食来吾与汝受。汝问讯我起手。何尝不为汝。师以为何如。师笑曰。楚人以山鸡为凤。世传以为笑。不意居士此语正相类。何也汝擎茶来吾为汝接。汝行食来吾为汝受。汝问讯我起手。若言是说。说个什么。若言不说。龙潭何以便悟此。所谓无法可说是名说法。以世尊之辨亦不能加此两句耳。学者但求解会。譬如五色图画虚空。鸟窠无佛法可传授。不可默坐。只拈布毛吹之。侍者便悟去。学者乃云。拈起布毛全体发露。似此见解未出教乘。其可称祖师门下客耶。九峰被人问深山里还有佛法也无。不得已云有。及被穷诘无可有。乃云。石头大者大小者小。学者乃卜度云。刹说众生说三世炽然说。审如此教乘自足。何必更问祖师意旨耶。要得脱体明去。譬如病眼人求医治之。医者乃能去翳膜。不曾以光明与之。居士推床而起云吾忧积翠法道未有继者。今知尽在子躬矣。双岭顺禅
  ref: T51n2077_p0567b05（续传灯录）
- text: 师问。庵中老师好问学者。并却咽喉唇吻道取一句。首座曾道得么。师为之一笑已。而有偈曰。阿家尝醋三尺喙。新妇洗面摸著鼻。道吾答话得腰裩。玄沙开书是白纸。于是顺叹服以为名下无虚士。有同参在石门分座接纳。师作偈寄之曰。万煆炉中铁蒺藜。直须高价勿饶伊。横来竖去呵呵笑。一任旁人鼓是非。熙宁元年首众于庐山圆通寺。学者归之如南公。明年春南圆寂。十月师徇四众之请。遂开法于石门
  ref: T51n2077_p0567b05（续传灯录）
- text: 僧问。逢场作戏时如何。师曰。红炉爆出铁乌龟
  ref: T51n2077_p0567b05（续传灯录）
- text: 僧云。当轩布鼓师亲击。百尺竿头事若何。师曰。山僧不信这活计。僧拟议。师曰。不唧𠺕汉。僧礼拜起。便垂下袈裟角云。脱衣卸甲时如何。曰喜得狼烟息弓弰壁上悬。僧却揽上袈裟角云。重整衣甲时如何。师曰。不到乌江畔知君未肯休僧便喝。师曰。惊我。僧拍一拍。师曰也是死中得活。僧礼拜。师曰。将谓收燕破赵之才。元来只是贩私盐贼
  ref: T51n2077_p0567b05（续传灯录）
- text: 僧问。如何是佛。师曰。眉分八字眼似流星
  ref: T51n2077_p0567b05（续传灯录）
- text: 僧云。如何是祖师西来意。师曰。一棒一条痕
  ref: T51n2077_p0567b05（续传灯录）
- text: 僧云。大众证明学人礼谢。师呵呵大笑。僧礼拜起以左手画一圆相。师以拂子穿向右边。僧以右手画一圆相。师以拂子穿向左边。僧以两手画圆相托呈。师以拂子画一画曰。三十年来未曾逢沩仰子孙。今日却遇著个踏土墼汉。还更有问话者么。良久无
  ref: T51n2077_p0567b05（续传灯录）
- text: 问。师乃曰。问也无穷答也无尽。问答去来于道转远。何故况为此事。直饶棒头荐得不是丈夫。喝下承当未为达士。那堪更向言中取则句里驰求。语路尖新机锋捷疾。如斯见解尽是埋没宗旨玷污先贤。于吾祖道何曾梦见。只如我佛如来临般涅槃。乃云。吾有正法眼藏涅槃妙心。付嘱摩诃大迦叶。迦叶遂付阿难。洎商那和修毱多大士诸祖相继。至于达磨西来。直指人心见性成佛。不立文字语言。岂不是先圣方便之道。自是当人不信却自迷头认影。奔逐狂途致使伶俜流浪生死。禅德。若能一念回光返照。向自己脚跟下褥剥究竟将来。可谓洞门谿开楼阁重重。十方普现海会齐彰。便乃凡圣贤愚山河大地以海印三昧一印印定。更无纤毫透漏。山僧如是举唱。若是众中有本色衲僧。闻之实为掩耳而归笑破他口。大众且道。本色衲僧门下一句作么生道。良久曰。天际雪埋千尺石。洞门冻折数株松。又一日升堂
  ref: T51n2077_p0567b05（续传灯录）
- text: 僧问。黄龙一曲师亲唱。佛手驴脚略借观。师曰。老僧打退鼓。僧礼拜。师曰。龙头蛇尾又
  ref: T51n2077_p0567b05（续传灯录）
- text: 问。临济栽松即不
  ref: T51n2077_p0567b05（续传灯录）
- text: 问。百丈开田事若何。师曰。深著鉏头
  ref: T51n2077_p0567b05（续传灯录）
- text: 僧云。古人犹在。师曰。更添锄头。僧礼拜。师击禅床一下。乃顾视大众曰。青山重叠叠绿水响潺潺。遂拈拄杖曰。未到悬崖处擡头仔细看。卓拄杖而起。又曰。宝峰高峻人罕到。岩前雪压枯松倒。岭前岭后野猿啼。一条古路清风扫。禅德。虽然如是。且道山僧拄杖子长多少。遂拈起曰。长者随长使短者随短用。卓一下。又
  ref: T51n2077_p0567b05（续传灯录）
- text: 上堂良久顾视大众曰。石门巇崄铁关牢。举目重重万仞高。无角铁牛冲得破。毘卢海内作波涛。且道不涉波涛一句作么生道。良久曰。一句不遑无著
  ref: T51n2077_p0567b05（续传灯录）
- text: 问。迄今犹作野盘僧。下座。师住未期年。六月知事纷争。止之不可。即谓众曰。领众不肃正坐无德。吾有愧黄龙。呼维那鸣钟众集叙行脚始末曰。吾灭后火化以骨石藏普通塔。明生死不离清众也。言卒而逝。阅世五十有九。坐四十三夏。门弟子奉师遗诫。茶毘以灵骨入塔。别收舍利供养
  ref: T51n2077_p0567b05（续传灯录）
