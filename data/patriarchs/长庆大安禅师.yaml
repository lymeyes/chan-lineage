id: 长庆大安禅师
name: 长庆大安
alias: 长庆安 / 懒安 / 懶安
school: 南岳系
teacher: 百丈怀海禅师
bio: 福州长庆院大安禅师，号懶安（世称懒安），郡之陈氏子。受业于黄檗山，习律乘。自念「我虽勤苦，而未闻玄极之理」，遂孤锡游方。路出上元，逢一老父谓曰「师往南昌，当有所得」，即造百丈怀海，问「学人欲求识佛，何者即是」，百丈答「大似骑牛觅牛」，言下领旨，更不驰求。后同参沩山灵祐，创居沩山，躬耕助道；灵祐归寂，众请接踵住持，居沩山三十余年。晚年住福州长庆院。
sayings:
- text: 上堂：「汝诸人总来就安，求觅甚么？若欲作佛，汝自是佛。担佛傍家走，如渴鹿趁阳焰相似，何时得相应去？汝欲作佛，但无许多颠倒攀缘、妄想恶觉、垢净众生之心，便是初心正觉佛，更向何处别讨所以？」
  ref: 五灯会元·卷四（X80n1565_p0123a18-b04）
- text: 上堂：「安在沩山三十来年，吃沩山饭，屙沩山屎，不学沩山禅，只看一头水牯牛。若落路入草，便把鼻孔拽转来；才犯人苗稼，即鞭挞。调伏既久，可怜生受人言语，如今变作个露地白牛，常在面前，终日露迥迥地，趁亦不去。」
  ref: 五灯会元·卷四（X80n1565_p0123b04-08）
- text: 上堂：「汝诸人各自有无价大宝，从眼门放光，照见山河大地；耳门放光，领采一切善恶音响。如是六门，昼夜常放光明，亦名放光三昧。汝自不识取，影在四大身中，内外扶持，不教倾侧。」
  ref: 五灯会元·卷四（X80n1565_p0123b08-11）
- text: 僧问：「大用现前、不存轨则时如何？」师曰：「汝用得但用。」僧乃脱膊，绕师三匝。师曰：「向上事何不道取？」僧拟开口，师便打，曰：「这野狐精出去。」
  ref: 五灯会元·卷四（X80n1565_p0124a01-03）
- text: 雪峰入山采得一枝木，其形似蛇，于背上题曰「本自天然，不假雕琢」，寄与师。师曰：「本色住山人，且无刀斧痕。」
  ref: 五灯会元·卷四（X80n1565_p0124a05-07）
