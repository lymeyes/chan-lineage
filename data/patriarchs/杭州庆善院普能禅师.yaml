bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0461a01。
sayings:
- text: 上堂。事不获已。与诸人葛藤。一切众生。祇为心尘未脱。情量不除。见色闻声。随波逐浪。流转三界。汩没四生。致使正见不明。触途成滞。若也是非齐泯。善恶都忘。坐断报化佛头。截却圣凡途路。到这里方有少许相应。直饶如是。衲僧分上未为奇特。何故如此。才有是非。纷然失心。咄
  ref: X80n1565_p0461a01（五灯会元）
- text: 上堂。拈拄杖曰。未入山僧手中。万法宛然。既入山僧手中。复有何事。良久曰。有意气时添意气。不风流处也风流。卓拄杖一下
  ref: X80n1565_p0461a01（五灯会元）
