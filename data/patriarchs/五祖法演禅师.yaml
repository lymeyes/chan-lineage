bio: 白云守端之法嗣，杨岐派第二代，世称「五祖法演」。历住白云山海会、蕲州五祖山，门庭高峻而机用圆活。门下俊彦辈出，圆悟克勤、佛鉴慧懃、佛眼清远并称「三佛」，尤以圆悟克勤著《碧岩录》光大杨岐一脉，使临济宗成为后世禅宗主流。法演于「白鹭禅」「四宾主」等机用多有发挥。
sayings:
- text: 师示众：「山僧昨日入城市，见一棚傀儡，便招手唤他，他也唤山僧；山僧走向东，他便向东；山僧走向西，他便向西——大似个老婆禅。忽若一朝掣断线头，大家瓦解，且道：还当得事事无碍也无？」
  ref: 五灯会元·卷十九·五祖法演
- text: 与白云守端「一斤麻、一斤铁」之勘验；师每以「只这是」接人，谓「佛之一字，吾不喜闻」之滥觞远承临济。
  ref: 五灯会元·卷十九·五祖法演
