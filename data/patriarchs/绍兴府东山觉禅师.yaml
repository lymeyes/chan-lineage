id: 绍兴府东山觉禅师
name: 绍兴府东山觉
school: 杨岐派
teacher: 圆悟克勤禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0768b09。
sayings:
- text: 上堂。三通鼓罢。诸人各各上来。拟待理会祖师西来意。还知剑去久矣么。设使直下悟去。也是斩头觅活。东山事不获已。且向第二头鞠拶看。以手拍禅床。下座
  ref: X80n1565_p0768b09（五灯会元）
- text: 上堂。花烂熳。景暄研。休说壶中别有天。百草头边如荐得。东高三丈。西阔八寸
  ref: X80n1565_p0768b09（五灯会元）
- text: 上堂。举。昔广额屠儿。一日至佛所。飏下屠刀。曰。我是千佛一数。世尊曰。如是如是。今时丛林。将谓广额过去是一佛。权现屠儿。如此见广额。且喜没交涉。又曰。广额正是个杀人不眨眼底汉。飏下屠刀。立地成佛。且喜没交涉。又道。广额飏下屠刀。曰我道千佛一数。涉一佛多少分明。且喜没交涉。要识广额么。夹路桃华风雨后。马蹄何处避残红
  ref: X80n1565_p0768b09（五灯会元）
