id: 枢密吴居厚居士
name: 枢密吴居厚
school: 黄龙派
teacher: 圆通旻禅师
status: draft
bio: 拥节归钟陵。谒圆通旻禅师。曰。某顷赴省试。过此。过赵州关。因问前住讷老。透关底事如何。讷曰。且去做官。今不觉五十余年。旻曰。曾明得透关底事么。公曰。八次经过。常存此念。然未甚脱洒在。旻度扇与之。曰。请使扇。公即挥扇。旻曰。有甚不脱洒处。公忽有省曰。便请末后句。旻乃挥扇两下。公曰。亲切。亲切。旻曰。吉獠舌头三千里
