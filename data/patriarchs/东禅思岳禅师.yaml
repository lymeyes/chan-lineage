id: 东禅思岳禅师
name: 东禅思岳
alias: 东禅岳
school: 杨岐派
teacher: 大慧宗杲禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《嘉泰普灯录》X79n1559_p0261b16。
sayings:
- text: 上堂曰：大地茫茫，恁么广阔；穷山漠漕，随分幽深。为衲僧法战之场，报佛祖冤雠之处。尽力道得，一棒一条痕；尽力道不得，一掌一手血。如以眼见，则复耳闻；如以心知，则复智证。是故谓之智证三昧，亦是文殊、普贤大人境界。若也于此共相委悉，大千沙界一毫收，百亿毛头辊绣球。直是通身还有眼，不风流处也风流
  ref: X79n1559_p0261b16（嘉泰普灯录）
- text: 上堂：蛾羊蚁子说一切法，墙壁瓦砾现无逿身。见处既精明，闻中必透脱。所以雪峰和尚凡见僧来，辊出三个木球，如弄杂剧相似，贤沙便作斫牌势。卑末谩道将来，普贤今日谤古人，千佛出世不通忏悔。这里有人谤普贤，定入󳫠舌地狱。且道谤与不谤者是谁？心不负人，面无惭色
  ref: X79n1559_p0261b16（嘉泰普灯录）
- text: 上堂：达磨来时，此土皆知梵语；及乎去后，西天悉会唐言。若论直指人心，见性成佛，大似𦏪羊挂角，猎犬寻踪，一意乖疏，万言无用。可谓来时他笑我，不知去后我笑他。唐言梵语亲分付，自古齐僧怕夜茶
  ref: X79n1559_p0261b16（嘉泰普灯录）
- text: 上堂：腊月初，岁云徂，黄河冻已合，深处有嘉鱼。活鱍鱍，跳不脱，又不能相煦以湿，相濡以沫。惭愧菩萨摩诃萨，春风几时来，解此黄河冻。令鱼化作龙，直透桃华浪。会即便会，痴人面前且莫说梦
  ref: X79n1559_p0261b16（嘉泰普灯录）
- text: 上堂：即心即佛，非心非佛。不是心，不是佛，不是物。通身无影象，遍界不曾藏。唤作一物即不中，敢保老兄未彻在。恁么说话，开人眼，瞎人眼。若也不会，天寒日短，三人共两椀。且道为诸人说对古人话，还会么？礼繁即乱
  ref: X79n1559_p0261b16（嘉泰普灯录）
- text: 上堂：二祖偿宿债，万法绝对待。一心无󳬩碍，浮山有九带。十方虗空圆陀陀，无量法门百杂碎。若言其有，非内非外。若言其无，无在不在。智与理冥，境与神会。如牛拽磨，似水打碓。三千里外，逢人东倒西儡。十字街头，遇贱则贵。还会也无？苏嘘苏𠰷
  ref: X79n1559_p0261b16（嘉泰普灯录）
- text: 上堂，僧问：如何是初日分，以恒河沙等身布施？曰：从苗辨地，因语识人。云：如何是中日分，复以恒河沙等身布施？曰：筑著磕著。云：如何是后日分，亦以恒河沙等身布施？曰：向下文长，付在来日。复曰：一转语，如天普盖，似地普擎。一转语，舌头不出口。一转语，且喜没交涉。要会么？惭愧世尊，面赤不如语直。大小岳上座，口似磉盘。今日为这问话僧讲经，不觉和注脚一时说破。便下座
  ref: X79n1559_p0261b16（嘉泰普灯录）
