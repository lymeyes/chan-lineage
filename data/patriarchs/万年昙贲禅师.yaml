id: 万年昙贲禅师
name: 万年昙贲
alias: 万年贲
school: 黄龙派
teacher: 育王介谌禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《续传灯录》T51n2077_p0699a18。
sayings:
- text: 上堂。维摩病说尽道理。龙翔病咳嗽不已。咳嗽不已说尽道理。说尽道理咳嗽不已。汝等诸人还识得其中意旨也未。本是长江凑风冷。却教露柱患头风
  ref: T51n2077_p0699a18（续传灯录）
- text: 上堂。一见便见。八角磨盘空里转。一得永得。辰锦朱砂如墨黑。秋风吹渭水。已落云门三句里。落叶满长安。几个而今被眼瞒。竖拂子曰。瞒得瞒不得。总在万年手里。还见么。华顶月笼招手石。断桥水落舍身岩
  ref: T51n2077_p0699a18（续传灯录）
- text: 僧问。百丈卷席意旨如何。师曰。贼过后张弓。四明太守以雪窦命师主之。师辞以偈曰。闹篮方喜得抽头。退鼓而今打未休。莫把乳峰千丈雪。重来换我一双眸
  ref: T51n2077_p0699a18（续传灯录）
