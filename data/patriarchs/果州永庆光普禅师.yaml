id: 果州永庆光普禅师
name: 果州永庆光普
school: 临济宗
teacher: 谷隐聪禅师
status: draft
bio: 初问谷隐。古人道。来日大悲院里有斋。意旨如何。曰。日出隈阳坐。天寒不举头。师入室次。隐曰。适来因缘汝作么生会。师曰。会则途中受用。不会则世谛流布。曰。未在更道。师拂袖便出。住后
sayings:
- text: 僧问。如何是佛法大意。师曰。蜀地用镔铁
  ref: X80n1565_p0437b05（五灯会元）
