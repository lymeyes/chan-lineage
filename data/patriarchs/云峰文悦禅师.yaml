id: 云峰文悦禅师
name: 云峰文悦
alias: 云峰悦
school: —
teacher: 大愚守芝禅师
status: draft
bio: 南昌徐氏子。初造大愚。闻
sayings:
- text: 示众曰。大家相聚吃茎齑。若唤作一茎虀。入地狱如箭射。便下座。师大骇夜造方丈。愚问来何所求。师曰。求心法。愚曰。法轮未转食轮先转。后生趁色力健。何不为众乞食。我忍饥不暇。何暇为汝说禅乎。师不敢违。未几愚移翠岩。师纳疏罢。复过翠岩求指示。岩曰。佛法未到烂却。雪寒宜为众乞炭。师亦奉命能事罢。复造方丈。岩曰。堂司阙人今以烦汝。师受之不乐。恨岩不去心地坐后架。桶篐忽散自架堕落。师忽然开悟。顿见岩用处。走搭伽黎上寝堂。岩迎笑曰。维那且喜大事了毕。师再拜不及吐一辞而去服勤八年。后出世翠岩。时首座领众出迎问曰。德山宗乘即不
  ref: T51n2077_p0518a12（续传灯录）
- text: 问。如何是临济大用。师曰。尔甚处去来。座拟议。师便掌。座拟对。师喝曰。领众归去。自是一众畏服
  ref: T51n2077_p0518a12（续传灯录）
- text: 僧问。如何是道。师曰。路不拾遗。曰如何是道中人。师曰。草贼大败。僧礼拜。师嘘一声。问万法归一一归何所。师曰。黄河九曲。曰如何是第一句。师曰。垂手过膝。曰如何是第二句。师曰。万里崖州。曰如何是第三句。师曰。粪箕扫帚。问如何是深山岩崖佛法。师曰。猢狲倒上树。问如何是衲衣下事。师曰。皮里骨。问不涉廉纤请师速道。师曰。须弥山。问如何是清净法身。师曰。柴场荻草
  ref: T51n2077_p0518a12（续传灯录）
- text: 上堂。语不离窠道。焉能出盖缠。片云横谷口。迷却几人源。所以道。言无展事语不投机。承言者丧。滞句者迷。汝等诸人到这里凭何话会。良久曰。欲得不招无间业。莫谤如来正法轮
  ref: T51n2077_p0518a12（续传灯录）
- text: 上堂。过去诸佛已灭。未来诸佛未生。正当今日佛法委在翠岩。放行则随机利物。把住则瓦解冰消。且道把住好放行好。良久曰咄。这野狐精。击禅床下座
  ref: T51n2077_p0518a12（续传灯录）
- text: 上堂。汝等诸人与么上来。大似刺脑入胶盆。与么下去也是平地吃交。直饶不来不去。朝打三千暮打八百
  ref: T51n2077_p0518a12（续传灯录）
- text: 上堂。道远乎哉触事而真。圣远乎哉体之则神。所以娑婆世界以音声为佛事。香积世界以香饭为佛事。翠岩这里只于出入息内。供养承事过现未来尘沙诸佛无一空过者。过现未来尘沙诸佛。是翠岩侍者无一不到。如一不到三十拄杖。诸上座还会么。将此深心奉尘刹。是则名为报佛恩
  ref: T51n2077_p0518a12（续传灯录）
- text: 上堂。有情之本。依智海以为源。含识之流。总法身而为体。只为情生智隔想变体殊。达本情忘知心体合。诸禅德会么。古佛与露柱相交。佛殿与灯笼斗额。若也不会单重交折
  ref: T51n2077_p0518a12（续传灯录）
- text: 上堂。竿木随身逢场作戏。然虽如是一手不独拍。众中莫有作家禅客本分。衲僧出来共相唱和。有么。时有僧出礼拜。师曰。依希似曲才堪听。又被风吹别调中。便下座
  ref: T51n2077_p0518a12（续传灯录）
- text: 上堂。天明平旦万事成办。北俱卢洲长粳米饭。下座
  ref: T51n2077_p0518a12（续传灯录）
- text: 上堂。有佛处不得住。无佛处急走过。尔等诸人横担拄杖向甚么处行脚。良久曰。东胜身洲持钵。西瞿耶尼吃饭
  ref: T51n2077_p0518a12（续传灯录）
- text: 上堂。假使心通无量时。历劫何曾异今日。且道今日事作么生。良久曰乌龟钻破壁
  ref: T51n2077_p0518a12（续传灯录）
- text: 上堂。见闻觉知无障碍。声香味触常三昧。衲僧道会也。山是山水是水。饥来吃饭困来打睡。忽然须弥山𨁝跳入尔鼻孔里。摩竭鱼穿尔眼睛中。作么生商量。良久曰。参堂去
  ref: T51n2077_p0518a12（续传灯录）
- text: 上堂。一刀两段未称宗师。就下平高固非作者。翠岩到这里口似匾担。尔等诸人作么生商量。良久曰。欲得不招无间业。莫谤如来正法轮
  ref: T51n2077_p0518a12（续传灯录）
- text: 上堂。若见诸相非相。即山河大地并无过咎。诸上座终日著衣吃饭。未曾咬著一粒米。未曾挂著一缕丝。便能变大地作黄金。搅长河为酥酪。然虽如是。著衣吃饭即不无。衲僧门下污臭气也未梦见在
  ref: T51n2077_p0518a12（续传灯录）
- text: 上堂。普贤行文殊智。补陀岩上清风起。瞎驴趁队过新罗。吉䝤舌头三千里
  ref: T51n2077_p0518a12（续传灯录）
- text: 上堂。拈起拄杖曰。掌钵盂向香积世界。为甚么出身无路。挑日月于拄杖头上。为甚么有眼如盲。直得风行草偃响顺声和。无纤芥可留。犹是交争底法。作么生是不交争底法。卓拄杖下座
  ref: T51n2077_p0518a12（续传灯录）
- text: 上堂。临济先锋放过一著。德山后令且在一边。独露无私一句作么生道。良久曰。堪嗟楚下钟离昧音抹以拂子击禅床下座
  ref: T51n2077_p0518a12（续传灯录）
- text: 上堂。教中道。种种取舍皆是轮回。未出轮回而辨圆觉。彼圆觉性即同流转。若免轮回无有是处。尔等诸人到这里。且作么生辨圆觉。良久曰。荷叶团团团似镜。菱角尖尖尖似锥。以拂击禅床
  ref: T51n2077_p0518a12（续传灯录）
- text: 上堂。古人道。山河石壁不碍眼光。师曰。作么生是眼。拈拄杖打禅床一下曰。须弥山百杂碎即不
  ref: T51n2077_p0518a12（续传灯录）
- text: 问。尔且道。娑竭罗龙王年多少。俗士
  ref: T51n2077_p0518a12（续传灯录）
- text: 问。如何是佛。师曰。著衣吃饭量家道。曰恁么则退身三步叉手当胸去也。师曰。醉后添杯不如无。小参。举百丈岁夜
  ref: T51n2077_p0518a12（续传灯录）
- text: 示众曰。尔这一队后生。经律论固是不知。入众参禅禅又不会。腊月三十日且作么生折合去。师曰。灼然诸禅德。去圣时遥人心澹泊。看却今时丛林。更是不得所在之处。或聚徒三百五百浩浩地只以饭食丰浓寮舍稳便为旺化。中间孜孜为道者无一人。设有十个五个走上走下半青半黄。会即总道我会。各各自谓握灵蛇之珠。孰肯知非。及乎挨拶鞭逼将来。直是万中无一。苦哉苦哉。所谓般若丛林岁岁凋。无明荒草年年长。就中今时后生才入众来。便自端然拱手。受他别人供养。到处菜不择一茎。柴不搬一束。十指不沾水。百事不干怀。虽则一期快意。争奈三涂累身。岂不见教中道。宁以热銕缠身。不受信心人衣。宁以洋铜灌口。不受信心人食。上座若也是去。直饶变大地作黄金。搅长河为酥酪。供养上座未为分外。若也未是。至于滴水寸丝。便须披毛戴角牵犁拽耙偿他始得。不见祖师道。入道不通理。复身还信施。此是决定底事终不虚也。诸上座。光阴可惜时不待人。莫待一朝眼光落地。缁田无一篑之功。銕围陷百刑之痛。莫言不道。珍重
  ref: T51n2077_p0518a12（续传灯录）
