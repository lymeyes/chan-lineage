sayings:
- text: 僧问。如何是和尚家风。师曰。竹箸瓦碗。曰。忽遇上客来时。如何祇待。师曰。黄虀仓米饭
  ref: X80n1565_p0293b02（五灯会元）
- text: 问。如何是祖师西来意。师曰。问取露柱看。鼓山晏国师法嗣鼓山晏国师法嗣
  ref: X80n1565_p0293b02（五灯会元）
