teacher: 罗汉琛禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0308a12。
sayings:
- text: 僧问。见色便见心。灯笼是色。那个是心。师曰。汝不会古人意。曰。如何是古人意。师曰。灯笼是心
  ref: X80n1565_p0308a12（五灯会元）
- text: 问。若能转物。即同如来。未审转甚么物。师曰。道甚么。僧拟进语。师曰。这漆桶
  ref: X80n1565_p0308a12（五灯会元）
