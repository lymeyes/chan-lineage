id: 荆南白马昙照禅师
name: 荆南白马昙照
school: 南岳系
teacher: 南泉普愿禅师
status: draft
bio: 常曰。快活。快活。及临终时叫。苦。苦。又曰。阎罗王来取我也。院主问曰。和尚当时被节度使抛向水中。神色不动。如今何得恁么地。师举枕子曰。汝道当时是。如今是。院主无对法眼代云。此时但掩耳出去
