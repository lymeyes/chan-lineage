id: 庐山圆通居讷祖印禅师
name: 庐山圆通居讷祖印
school: 云门宗
teacher: 延庆荣
status: draft
bio: 梓州人。姓蹇氏。生而英特。读书过目成诵。十一出家。十七试法华得度。受具后肄业讲肆。耆年多下之。会禅者南游回。力勉其行。于是遍参荆楚间。迄无所得。至襄州洞山。留止十年。因读华严论有省。后游庐山。道价日起。由归宗而迁圆通。仁庙闻其名。皇祐初。诏住十方净因禅院。师称目疾。不能奉诏。有旨令举自代。遂举大觉琏应诏。及引对。问佛法大意称旨。天下贤师知人也
sayings:
- text: 僧问。祖刹重兴时如何。师曰。人在破头山。曰。一朝权在手。师便打
  ref: X80n1565_p0606a12（五灯会元）
