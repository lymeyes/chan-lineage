bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0197b15。
sayings:
- text: 僧问。祖意教意是同是别。师曰。少林虽有月。葱岭不穿云
  ref: X80n1565_p0197b15（五灯会元）
- text: 问。如何是类。师曰。奈何桥畔嘶声切。剑树林中去复来
  ref: X80n1565_p0197b15（五灯会元）
