id: L::益州保唐寺无住禅师
name: 益州保唐寺无住
school: —
teacher: 益州无相
status: draft
bio: 初得法于无相大师。乃居南阳白崖山。专务宴寂。经累岁。学者渐至。勤请不已。自此垂诲。虽广演言教。而唯以无念为宗。唐相国杜鸿渐出抚坤维。闻师名。思一瞻礼。遣使到山延请。时节度使崔宁亦命诸寺僧徒远出。迎引至空慧寺。时杜公与戎帅召三学硕德俱会寺中。致礼讫。公问曰。弟子闻今和尚说无忆．无念．莫妄三句法门。是否。师曰。然。公曰。此三句是一是三。师曰。无忆名戒。无念名定。莫妄名慧。一心不生。具戒定慧。非一非三也。公曰。后句妄字莫是从心之忘乎。曰。从女者是也。公曰。有据否。师曰。法句经云。若起精进心。是妄非精进。若能心不妄。精进无有涯。公闻疑情荡然。公又
sayings:
- text: 问。师还以三句示人否。师曰。初心学人。还令息念。澄停识浪。水清影现。悟无念体。寂灭现前。无念亦不立也。于时庭树鸦鸣。公
  ref: X80n1565_p0054b06（五灯会元）
- text: 问。师闻否。师曰。闻。鸦去已。又
  ref: X80n1565_p0054b06（五灯会元）
- text: 问。师闻否。师曰。闻。公曰。鸦去无声。云何言闻。师乃普告大众曰。佛世难值。正法难闻。各各谛听。闻无有闻。非关闻性。本来不生。何曾有灭。有声之时。是声尘自生。无声之时。是声尘自灭。而此闻性。不随声生。不随声灭。悟此闻性。则免声尘之所转。当知闻无生灭。闻无去来。公与僚属大众稽首。又
  ref: X80n1565_p0054b06（五灯会元）
- text: 问。何名第一义。第一义者。从何次第得入。师曰。第一义无有次第。亦无出入。世谛一切有。第一义即无。诸法无性性。说名第一义。佛言有法名俗谛。无性第一义。公曰。如师开示。实不可思议。公又曰。弟子性识微浅。昔因公暇。撰得起信论章疏两卷。可得称佛法否。师曰。夫造章疏。皆用识心。思量分别。有为有作。起心动念。然可造成。据论文云。当知一切法。从本以来。离言说相。离名字相。离心缘相。毕竟平等。无有变异。唯有一心。故名真如。今相公著言说相。著名字相。著心缘相。既著种种相。云何是佛法。公起作礼曰。弟子亦曾问诸供奉大德。皆赞弟子不可思议。当知彼等但徇人情。师今从理解说。合心地法。实是真理不可思议。公又
  ref: X80n1565_p0054b06（五灯会元）
- text: 问。云何不生。云何不灭。如何得解脱。师曰。见境心不起。名不生。不生即不灭。既无生灭。即不被前尘所缚。当处解脱。不生名无念。无念即无灭。无念即无缚。无念即无脱。举要而言。识心即离念。见性即解脱。离识心见性外。更有法门证无上菩提者。无有是处。公曰。何名识心见性。师曰。一切学道人。随念流浪。葢为不识真心。真心者。念生亦不顺生。念灭亦不依寂。不来不去。不定不乱。不取不舍。不沈不浮。无为无相活鱍鱍。平常自在。此心体毕竟不可得。无可知觉。触目皆如。无非见性也。公与大众作礼称赞。踊跃而去。师后居保唐寺而终
  ref: X80n1565_p0054b06（五灯会元）
