id: 首山省念禅师
name: 首山省念
honorific: 汝州首山省念禅师（风穴延沼法嗣）
school: 临济宗
dynasty: 北宋
region: 汝州首山（今河南临汝）
teacher: 风穴延沼禅师
source_ref: 五灯会元·卷十一·汝州首山省念 / 景德传灯录·卷十二
cbeta: T51n2076 卷十二
bio: 风穴延沼之法嗣，临济宗第五代。风穴以临济宗法脉付之，嘱「莫教断绝」。住汝州首山，门人甚众，汾阳善昭为其法嗣之首。其「竹篦」机用与「祖师心印」之勘验，开宋临济之先声。
sayings:
- text: 僧问「如何是祖师西来意」，师云「今日不打汝」；又问「僧还见否」，师云「瞎」。
  ref: 五灯会元·卷十一·首山省念
- text: 师拈竹篦示众：「唤作竹篦则触，不唤作竹篦则背；唤作什么即得？」（竹篦话头之滥觞，后汾阳、慈明皆承之）
  ref: 五灯会元·卷十一·首山省念
