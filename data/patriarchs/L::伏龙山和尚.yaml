id: L::伏龙山和尚
name: 伏龙山
school: 青原系
teacher: 大光诲
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0209a11。
sayings:
- text: 僧问。行尽千山路。玄机事若何。师曰。鸟道不曾栖
  ref: X80n1565_p0209a11（五灯会元）
- text: 问。既是师。为甚却无位次。师曰。古今排不出。三际岂能安。曰。恁么则某甲随手去也。师曰。春风吹柳絮。往复几时休
  ref: X80n1565_p0209a11（五灯会元）
- text: 问。如何是真际。师曰。旷劫无异。不存阶级
  ref: X80n1565_p0209a11（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0209a11），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
