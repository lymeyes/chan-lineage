id: 建州崇梵余禅师
name: 建州崇梵余
school: 曹洞宗
teacher: 云居舜
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0612b12。
sayings:
- text: 僧问。临济喝少遇知音。德山棒难逢作者。和尚今日作么生。师曰。山僧被你一
  ref: X80n1565_p0612b12（五灯会元）
- text: 问。直得退身三步。脊背汗流。曰。作家宗师。今日遭遇。师曰。一语伤人。千刀搅腹。僧以手画一画曰。争奈这个何。师曰。草贼大败
  ref: X80n1565_p0612b12（五灯会元）
- text: 问。恁么来底人。师还接否。师曰。孤峰无宿客。曰。不恁么来底人。师还接否。师曰。滩峻不留船。曰。恁么不恁么则且置。穿过髑髅一句作么生。师曰。堪笑亦堪悲
  ref: X80n1565_p0612b12（五灯会元）
- text: 上堂。直须向黑豆未生芽时构取。良久。召大众曰。剑去远矣
  ref: X80n1565_p0612b12（五灯会元）
