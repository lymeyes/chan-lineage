bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0501b08。
sayings:
- text: 僧问。上无片瓦。下无卓锥时如何。师曰。莫飘露么
  ref: X80n1565_p0501b08（五灯会元）
- text: 问。不具得失时如何。师曰。道甚么
  ref: X80n1565_p0501b08（五灯会元）
