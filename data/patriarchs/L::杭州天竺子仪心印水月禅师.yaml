id: L::杭州天竺子仪心印水月禅师
name: 杭州天竺子仪心印水月
school: —
teacher: 鼓山晏
status: draft
bio: 温州乐清陈氏子。初游方谒鼓山。问曰。子仪三千里外远投法席。今日非时上来。乞师非时答话。山曰。不可钝置仁者。师曰。省力处如何。山曰。汝何费力。师于此有省。后回浙中。钱忠懿王命开法于罗汉光福二道场
sayings:
- text: 上堂。久立大众更待甚么。不辞展拓。却恐悮于禅德。转迷归路。时寒。珍重
  ref: X80n1565_p0293b06（五灯会元）
- text: 僧问。如何是从上来事。师曰。住。曰。如何荐。师曰。可惜龙头。翻成蛇尾。有僧礼拜起。将问话。师曰。如何且置。僧乃
  ref: X80n1565_p0293b06（五灯会元）
- text: 问。祇如兴圣之子。还有相亲分也无。师曰。祇待局终。不知柯烂
  ref: X80n1565_p0293b06（五灯会元）
- text: 问。如何是维摩默。师曰。谤。曰。文殊因何赞。师曰。同案领过。曰。维摩又如何。师曰。头上三尺巾。手里一枝拂
  ref: X80n1565_p0293b06（五灯会元）
- text: 问。如何是诸佛出身处。师曰。大洋海里一星火。曰。学人不会。师曰。烧尽鱼龙
  ref: X80n1565_p0293b06（五灯会元）
- text: 问。丹霞烧木佛。意旨如何。师曰。寒即围炉向猛火。曰。还有过也无。师曰。热即竹林溪畔坐
  ref: X80n1565_p0293b06（五灯会元）
- text: 问。如何是法界义宗。师曰。九月九日浙江潮
  ref: X80n1565_p0293b06（五灯会元）
- text: 问。如何是光福门下超毗卢越释迦底人。师曰。诸余奉纳。曰。恁么则平生庆幸去也。师曰。庆幸事作么生。僧罔措。师便喝。将下堂
  ref: X80n1565_p0293b06（五灯会元）
- text: 僧问。下堂一句。乞师分付。师曰。携履已归西国去。此山空有老猿啼
  ref: X80n1565_p0293b06（五灯会元）
- text: 问。鼓山有掣鼓夺旗之说。师且如何。师曰。败将不忍诛。曰。或遇良将又如何。师曰。念子孤魂。赐汝三奠
  ref: X80n1565_p0293b06（五灯会元）
- text: 问。世尊入灭。当归何所。师曰。鹤林空变色。真归无所归。曰。未审必定何之。师曰。朱实殒劲风。繁英落素秋。曰。我师将来复归何所。师曰。子今欲识吾归处。东西南北柳成丝
  ref: X80n1565_p0293b06（五灯会元）
- text: 问。如何修行。即得与道相应。师曰。高卷吟中箔。浓煎睡后茶
  ref: X80n1565_p0293b06（五灯会元）
