id: 庐山归宗澹权禅师
name: 庐山归宗澹权
school: 曹洞宗
teacher: 云居膺
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0500b15。
sayings:
- text: 僧问。金鸡未鸣时如何。师曰。失却威音王。曰。鸣后如何。师曰。三界平沉
  ref: X80n1565_p0500b15（五灯会元）
- text: 问。尽身供养时如何。师曰。将甚么来。曰。所有不惜。师曰。供养甚么人。僧无语
  ref: X80n1565_p0500b15（五灯会元）
- text: 问。学人为佛法来。如何是佛法。师曰。正空闲。曰。便请商量。师曰。周匝有余
  ref: X80n1565_p0500b15（五灯会元）
- text: 问。人众云集。合谭何事。师曰。三三两两
  ref: X80n1565_p0500b15（五灯会元）
- text: 问。路逢达道人。不将语默对。未审将甚么对。师曰。争能肯得人。僧良久。师曰。会么。曰。不会。师曰。长安路上厕坑子
  ref: X80n1565_p0500b15（五灯会元）
- text: 问。如何是佛法大意。师曰。三枷五棒
  ref: X80n1565_p0500b15（五灯会元）
- text: 问。通彻底人如何语道。师曰。汝祇今作么生。曰。任性随流。师曰。不随流争得息
  ref: X80n1565_p0500b15（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0500b15），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
