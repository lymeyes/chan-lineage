id: 白杨法顺禅师
name: 白杨法顺
alias: 白杨顺
school: 杨岐派
teacher: 龙门清远禅师
status: draft
bio: 绵州文氏子。依止佛眼闻普说。举傅大士心王铭云。水中盐味色里胶青决定是有不见其形。师于言下有省。后观宝藏迅转顿明大法。趋丈室作礼呈偈曰。顶有异峰云冉冉。源无别派水冷冷。游山未到山穷处。终被青山碍睛眼。眼笑而可之。住后
sayings:
- text: 上堂。好事堆堆叠叠来。不须造作与安排。落林黄叶水推去。横谷白云风卷回。寒雁一声情念断。霜钟才动我山摧。白杨更有过人处。尽夜寒炉拨死灰。忽有个衲僧出来道。长老少卖弄得恁么穷乞相。山僧只向他道。却被尔道著
  ref: T51n2077_p0669b19（续传灯录）
- text: 上堂。我手何似佛手。天上南星北斗。我脚何似驴脚。往事都来忘却。人人尽有生缘。个个足方顶圆。大愚滩头立处。孤月影射深湾。会不得见还难。一曲渔歌过远滩
  ref: T51n2077_p0669b19（续传灯录）
- text: 示众。染缘易就道业难成。不了目前万缘差别。只见境风浩浩。凋残功德之林。心火炎炎烧尽菩提之树。道念若同情念成佛多时。为众一似为己。彼此事办。不见他非我是。自然上敬下恭。佛法时时现前。烦恼尘尘解脱
  ref: T51n2077_p0669b19（续传灯录）
- text: 上堂。鸡鸣晓月狗吠枯椿。只可默会难入思量。看不见处动地放光。说不到处天地玄黄。抚城尺六状纸。元来出在清江。大众。分明话出人难见。昨夜三更月到窗
  ref: T51n2077_p0669b19（续传灯录）
- text: 上堂。风吹茅茨。屋脊漏雨打。阇黎眼睛湿。恁么分明却不知。却来这里低头立。时绍灯上座闻之有省。后住婺之广教。因病
  ref: T51n2077_p0669b19（续传灯录）
- text: 示众。久病未尝推木枕。人来多是问如何。山僧据问随缘对。窗外黄鹂口更多。只如七尺之躯甚处受病。众中具眼者试为山僧指出病源。众下语皆不契。师自拊掌一下作呕吐声。又云好个木枕子。师律身清苦。出入唯杖笠独行。后示寂阇维收设利目睛齿舌数珠同灵骨塔于寺西
  ref: T51n2077_p0669b19（续传灯录）
