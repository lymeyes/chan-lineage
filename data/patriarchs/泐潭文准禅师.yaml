id: 泐潭文准禅师
name: 泐潭文准
alias: 泐潭准
school: 黄龙派
teacher: 宝峰文禅师
status: draft
bio: 兴元府唐固梁氏子。生始幼见佛像辄笑。童子不喜闻酒胾。金仙寺沙门虚普乞食至其家。师膺门酬酢如老成。时年八岁即辞父母愿从普归。授以法华经伊吾即上口。元丰僧检童子较所习。以籍名先后度。师艺精坐年少不得奏名。陕西经略范公过普卢。普腊高应对领略。师侍其傍伸辩详明进止可喜。范公欲携与俱西。师辞曰。登山求玉入海求珠。人各有志。本行学道世好非素心。茫公阴奇其语。度以为僧剔发。既往依梁山乘禅师。呵曰驱乌未受戒敢学佛乘乎。师捧手曰。坛场是戒耶。三羯磨梵行阿阇梨是戒耶。乘大惊。师笑曰。虽然敢不受教。遂受具足戒于唐安律师。遍游成都讲肆唱诸部纲目。即弃去曰。吾不求甚解。法师昙演佳其英特抚之曰。汝法船也。南方有大开士若沩山真如九峰真净者。可往求之。师拜受戒。与同学志恭诣大沩久之不契。乃造九峰见真净问曰。甚处来。曰兴元府。问近离甚处。曰大仰。问夏在甚处。曰沩山。真净展手曰。我手何似佛手。师罔然。真净呵曰。适来句句无丝毫差错灵明天真。才说个佛手便成隔碍。病在什么处。师曰。不会。净曰。一切见成更教谁会。师服膺就弟子之列余。十年所至必随。绍圣三年真净移居石门衲子益盛。凡入室扣问必瞑目危坐无所示。见来者必起从园丁壅菜率以为常。师每谓恭曰。老汉无意于法道乎莫能测也。一日举杖决渠水溅衣因大悟走叙其事。真净骂曰。此中乃敢用藞苴耶。自是迹愈晦而名愈著。待制李景真守豫章。仰其风请开法于云岩。未几殿中监茫公。师南昌移居泐潭。师辞辩注射迅机电扫。衲子畏而慕之。槌拂之下常数千指。自号湛堂。每曰。我只畜一条拄杖佛来也打祖来也打。不将元字脚涴汝枯肠。如此临济一宗不致冷落。一日新到相看展坐具。师曰。未得人事上座近离甚处。曰庐山归宗。师曰。宗归何处。僧曰嗄。师曰。虾蟆窟里作活计
sayings:
- text: 僧云。和尚何不领话。师曰。是尔岂不是从归宗来
  ref: T51n2077_p0617b17（续传灯录）
- text: 僧云是。师曰。驴前马后汉。问第二上座。近离甚处
  ref: T51n2077_p0617b17（续传灯录）
- text: 僧云。袁州。师云。夏在甚处。曰仰山。师曰。还见小释迦么
  ref: T51n2077_p0617b17（续传灯录）
- text: 僧云见。师曰。鼻孔长多少。僧拟议。师云。话堕阿师。问僧。尔来作么。曰特来问讯和尚。师云。云在岭头闲不彻。水流㵎下太忙生
  ref: T51n2077_p0617b17（续传灯录）
- text: 僧云。和尚莫瞒人好。师曰。马大师为什么从阇梨脚跟下走过。僧无语。师云。却是阇梨谩老僧
  ref: T51n2077_p0617b17（续传灯录）
- text: 僧云。有口道不得时如何。师云。洞庭湖里倒撑船。雪居先驰到
  ref: T51n2077_p0617b17（续传灯录）
- text: 师问。未离欧阜文彩已彰。既到宝峰如何吐露。驰云。目前有路
  ref: T51n2077_p0617b17（续传灯录）
- text: 师举起书云。既是云居底。为甚在宝峰手中。驰云。兵随印转将逐符行。师云。下坡不走拍一拍。驰拟议。师曰。想先驰。只有先锋且无殿后。一日法堂上逢首座。便
  ref: T51n2077_p0617b17（续传灯录）
- text: 问。向什么处去。座云。拟与和尚商量一事。师云。便请。座曰。东家杓柄长西家杓柄短。师云。为甚拈起巩县茶瓶。却是饶州󱑣碗。座云。临崖看浒眼特地一场愁。师叫屈。座吐舌而退。师在分宁遇死心和尚。问尔此回到山里么。师云。须去礼拜师兄。心云。尔来时善看方便。师曰。何故。心云。我黄龙路滑。师云。曾跶倒几人来。心云。尔未到黄龙早脚涩也。师云。和尚何得闭门相待。死心又
  ref: T51n2077_p0617b17（续传灯录）
- text: 问。准老尔安许多僧。只是聚头打哄了噇饭。尔毕竟将何为人。师云。因风吹火。心云。乱统作么。师云。从来有些子。师却
  ref: T51n2077_p0617b17（续传灯录）
- text: 问。和尚山中安多少众。心云。四百人尽是精峭衲子。师云。师子窟中无异兽。心云。尔来时也须照顾。师云。也待临时。心云。临时作么生。师云唤来洗脚。心云。尔川僧家开许大口。师云。准上座从来如此。心云。三十年弄马骑。问僧。乡里甚处。云青州。师曰。近离甚处。云云居。师曰。安乐树下道将一句来。僧无语。师却问傍
  ref: T51n2077_p0617b17（续传灯录）
- text: 僧云。尔道得么
  ref: T51n2077_p0617b17（续传灯录）
- text: 僧云。某甲道不得。却请和尚道。师云。向北驴似马大
  ref: T51n2077_p0617b17（续传灯录）
- text: 僧云。与么那。师云。尔鼻孔为甚么在宝峰手里。僧便喝。师云。水里火发。见僧看经。问看什么经。曰金刚经。师云。经中道。是法平等无有高下是否
  ref: T51n2077_p0617b17（续传灯录）
- text: 僧云是。师云。为什么云居山高宝峰山低
  ref: T51n2077_p0617b17（续传灯录）
- text: 僧云。是法平等无有高下。师曰。尔却做得个坐主使下
  ref: T51n2077_p0617b17（续传灯录）
- text: 僧云。和尚又作么生。师云。且放尔鼻孔出气。一日廊下见
  ref: T51n2077_p0617b17（续传灯录）
- text: 僧问。尔还会也未
  ref: T51n2077_p0617b17（续传灯录）
- text: 僧云。不会。师曰。左青龙右白虎
  ref: T51n2077_p0617b17（续传灯录）
- text: 僧云。久向宝峰元来只是个卖卜𨑾官。师乃点指云。上座今日不好
  ref: T51n2077_p0617b17（续传灯录）
- text: 僧云。老汉败阙也。师云。路逢剑客须呈剑。师问僧。安乐么
  ref: T51n2077_p0617b17（续传灯录）
- text: 僧云。无事。师云。尔大有事在。曰未审某甲有甚事。师云。近日上蓝金刚与天宁土地相打。僧无语。师云。元来无事。问僧。如何是上座得力处。僧便喝。师云。好好相借问何得恶发。僧又喝。师云。元来是作家。僧以坐具便打。师低头嘘一声
  ref: T51n2077_p0617b17（续传灯录）
- text: 僧云。放过一著。师云。者里不可放过随后便打。师普说次众欲散。忽问僧。明来明打暗来暗打。尔作么生会。僧便喝。师云。点即不到。僧又喝。师云。到即不点
  ref: T51n2077_p0617b17（续传灯录）
- text: 僧云。忽遇不明不暗来时又作么生。师云。今日天寒且归堂向火随后。喝一喝便起。一日
  ref: T51n2077_p0617b17（续传灯录）
- text: 上堂云。宝峰一夜睡不著计较。今日
  ref: T51n2077_p0617b17（续传灯录）
- text: 上堂揣腹搜胸。总思量不就。而今临时逼节事出急家门。遂拈起拂子云。准上座近日作得一柄拂子。且权将供养大众。乃掷下云。竹根棕叶麻绳系。样度天然别一家。政和五年夏六月寝疾。首坐
  ref: T51n2077_p0617b17（续传灯录）
- text: 问。和尚近日尊位如何。师云。跛驴上壁。坐云。和尚也好吃一服药。师云。朽木搭桥。座云。也知和尚不解忌口。师云。尔作么生。坐拟进语。师云。尔也好吃一服药。以七月二十二日更衣说偈而化。阅世五十五。坐三十五夏。灵骨舍利塔于石门之南源。丞相张无尽制其碑。谏议洪驹父叙语录。名士李商老撰次逸事。同门弟德洪觉范纪师行实。其高道硕德可想见矣。琇公称。云居真牧和尚谓人曰。出关走江淮阅三十年。参一十八人善知识。于中无出佛果佛眼死心灵源湛堂五大士而已。诚哉斯言。盖真正宗师考其全才如此之难。若佛果佛眼死心灵源之嗣固已光明于世。独湛堂开法日浅。未有继其高躅者。然览其遗编想其胸次。信余子未易企及也。觉范称。准于真净之门。所谓家名辨才气宇逸群者。抑知言哉
  ref: T51n2077_p0617b17（续传灯录）
