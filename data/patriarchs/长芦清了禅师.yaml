id: 长芦清了禅师
name: 长芦清了
alias: 长芦了
school: 曹洞宗
teacher: 丹霞淳禅师
status: draft
bio: 左绵雍氏子。襁褓。入寺见佛。喜动眉睫。咸异之。年十八试法华得度。往成都大慈习经论领大意。出蜀至󱒓汉扣丹霞之室。问如何是空劫已前自己。师拟对。霞曰尔闹在且去。一日登钵盂峰豁然契悟。径归侍立。霞掌曰。将谓尔知有。师欣然拜之。翌日霞
sayings:
- text: 上堂曰。日照孤峰翠。月临溪水寒。祖师玄妙诀。莫向寸心安。便下座。师直前曰。今日升座更瞒某不得也。霞曰。尔试举我今日升座看。师良久。霞曰。将谓尔瞥地。师便出。后游五台之京师浮汴。直抵长芦谒祖照一语契投。命为侍者逾年分座。未几称疾退闲。命师继席学者如归。建炎末游四明。主补陀台之天封闽之雪峰。诏住育王。徙温州龙翔杭州径山慈宁。皇太后命开山皋宁崇先
  ref: T51n2077_p0579c27（续传灯录）
- text: 上堂。我于先师一掌下伎俩俱尽。觅个开口处不可得。如今还有恁么快活不彻底汉么。若无衔铁负鞍各自著便
  ref: T51n2077_p0579c27（续传灯录）
- text: 上堂。久默斯要不务速说。释迦老子待要款曲卖弄。争奈未出母胎已被人覻破。且道覻破个甚么。瞒雪峰不得
  ref: T51n2077_p0579c27（续传灯录）
- text: 上堂。上孤峰顶过独木桥。蓦直恁么行。犹是时人脚高脚低处。若见得彻不出户身遍十方。未入门常在屋里。其或未然。趁凉搬取一转柴
  ref: T51n2077_p0579c27（续传灯录）
- text: 上堂。道得第一句不被拄杖子瞒。识得拄杖子。犹是途路中事。作么生是到地头一句
  ref: T51n2077_p0579c27（续传灯录）
- text: 上堂。处处觅不得。只有一处不觅自得。且道是那一处。良久曰。贼身已露
  ref: T51n2077_p0579c27（续传灯录）
- text: 上堂。口边白醭去。始得入门通身红烂去。方知有门里事。更须知有不出门底。乃曰。唤甚么作门
  ref: T51n2077_p0579c27（续传灯录）
- text: 僧问。三世诸佛向火焰里转大法轮。还端的也无。师大笑曰。我却疑著。曰和尚为甚么却疑著。师曰。野花香满路。幽鸟不知春。问不落风彩还许转身也无。师曰。石人行处不同功。曰向上事作么生。师曰。妙在一沤前。岂容千圣眼。僧礼拜。师曰。只恐不恁么。师一日入厨看煮面次。忽桶底脱。众皆失声曰。可惜许。师曰。桶底脱自合欢喜。因甚么却烦恼。僧曰。和尚即得。师曰。灼然可惜许一桶面。问僧。尔死后烧作灰撒却了。向甚么处去。僧便喝。师曰。好一喝只是不得翻款。僧又喝。师曰。公案未圆更喝始得。僧无语。师打曰。这死汉
  ref: T51n2077_p0579c27（续传灯录）
- text: 上堂。苔封古径不堕虚凝。雾锁寒林肯彰风要。钩针稳密。孰云渔父栖巢。只么承当。自是平常快活。还有具透关眼底么。良久曰。直饶闻早便归去。争似从来不出门
  ref: T51n2077_p0579c27（续传灯录）
- text: 上堂。乍雨乍晴乍寒乍热。山僧底个山僧自知。诸人底个诸人自说。且道雪峰口除吃饭外要作甚么。问僧。瑠璃殿上玉女撺梭。明甚么边事。曰回互不当机。师曰。还有断续也无。曰古今不曾间。师曰。正当不曾间时如何。僧珍重便出
  ref: T51n2077_p0579c27（续传灯录）
- text: 上堂撼拄杖曰。看看三千大千世界一时摇动。云门大师即得雪峰则不然。卓拄杖曰。三千大千世界向甚么处去。还会么。不得重梅雨。秧苗争见青
  ref: T51n2077_p0579c27（续传灯录）
- text: 上堂。幻化空身即法身。遂作舞云。见么见么恁么见得过桥村酒美。又作舞云。见么见么。恁么不见隔岸野花香
  ref: T51n2077_p0579c27（续传灯录）
- text: 上堂。还有不被玄妙污染底么。良久曰。这一点倾四海水。已是洗脱不下
  ref: T51n2077_p0579c27（续传灯录）
- text: 僧问。如何是空劫已前自己。师曰。白马入芦花
  ref: T51n2077_p0579c27（续传灯录）
- text: 上堂。穷微丧本。体妙失宗。一句截流。渊玄及尽。是以金针密处不露光铓。玉线通时潜舒异彩。虽然如是犹是交互双明。且道巧拙不到作么生相委。良久曰。云萝秀处青阴合。岩树高低翠锁深
  ref: T51n2077_p0579c27（续传灯录）
- text: 上堂转功就位是向去底人。玉韫荆山贵。转位就功是却来底人。红炉片雪春。功位俱转通身不滞。撒手亡依。石女夜登机。密室无人扫。正恁么时绝气息一句作么生相委。良久曰。归根风堕叶。照尽月潭空。师终于皋宁崇先。塔于寺西华桐坞。谥悟空禅师
  ref: T51n2077_p0579c27（续传灯录）
