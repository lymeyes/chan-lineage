sayings:
- text: 上堂召大众曰。春将至。岁已暮。思量古往今来。祇是个般调度。凝眸昔日家风。下足旧时岐路。劝君休莫莽卤。眨上眉毛须荐取。东村王老笑呵呵。此道今人弃如土。青原下十四世青原下十四世
