id: 潭州南岳承天院自贤禅师
name: 潭州南岳承天院自贤
school: 杨岐派
teacher: 云盖本
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0751a07。
sayings:
- text: 僧问。大众已集。仰听雷音。猊座既登。请师剖露。师曰。刹竿头上翻筋斗。曰。恁么则岳麓山前祥雾起。祝融峰下瑞云生。师曰。紫罗帐里璨真珠
  ref: X80n1565_p0751a07（五灯会元）
- text: 上堂。拈拄杖曰。不是心。不是佛。不是物。击禅床一下曰。与君打破精灵窟。簸土扬尘无处寻。千山万山空突兀。复击一下曰。归堂去参
  ref: X80n1565_p0751a07（五灯会元）
- text: 上堂。一身高隐惟南岳。自笑孤云未是闲。松下水边端坐者。也应随例说居山。咄
  ref: X80n1565_p0751a07（五灯会元）
- text: 上堂。五更残月落。天晓白云飞。分明目前事。不是目前机。既是目前事。为甚么不是目前机。良久曰。欲言言不及。林下却商量
  ref: X80n1565_p0751a07（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0751a07），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
