id: 杭州净土院惟正禅师
name: 杭州净土院惟正
school: —
teacher: 净土素
status: draft
bio: 秀州华亭黄氏子。幼从钱塘资圣院本如隶业。且将较艺于有司。如使祷观音像。以求阴相。师谢曰。岂忍独私于己哉。郡人朱绍安闻而嘉叹。欲启帑度之。师慨然曰。古之度人。以清机密旨。今反是。去古远矣。吾堕三宝数。当有其时。已而遇祥符覃恩。得谐素志。独拥毳袍且弊。同列慢之。师曰。佛乎佛乎。仪相云乎哉。僧乎僧乎。盛服云乎哉。厥后有愿输奉岁时用度。俾继如之院务。亦复谢曰。闻拓钵乞食。未闻安坐以享。闻历谒诸祖。未闻废学自任。况我齿茂气完。正在筋力为礼。非从事屋庐之秋也。于是提䇿东引。学三观于天台。复旋径山。咨单传之旨于老宿惟素。素董临安功臣山净土院。师辅相之。久而继席焉。然为人高简。律身精严。名卿巨公。多所推尊。叶内翰清臣牧金陵。迎师语道。一日。叶曰。明日府有燕饮。师固奉律。能为我少留一日。款清话否。师诺之。翌日。遣使邀师。留一偈而返。曰。昨日曾将今日期。出门倚杖又思惟。为僧祇合居岩谷。国士筵中甚不宜。坐客皆仰其标致。师识虑洗然。不牵世累。雅爱跨黄犊出入。军持巾钵。悉挂角上。市人争观之。师自若也。杭守蒋侍郎尝与师为方外友。每往谒。至郡庭下犊谭笑。终日而去。蒋有诗曰。禅客寻常入旧都。黄牛角上挂缾盂。有时带雪穿云去。便好和云画作图。师尝作山中偈曰。桥上山万层。桥下水千里。唯有白鹭鸶。见我常来此。平生制作三十卷。号锦溪集。又工书。笔法胜绝。秦少游珍藏之。冬不拥炉。以荻花作球。纳足其中。客至共之。夏秋好玩月。盘膝大盆中浮池上。自旋其盆。吟笑达旦。率以为常。九峰韶禅师尝客于院。一夕将卧。师邀之曰。月色如此。劳生扰扰。对之者能几人。峰唯唯而矣。久之。呼童子使熟炙。峰方饥。意作药石。顷乃橘皮汤一杯。峰匿笑曰。无乃太清乎。有问曰。师以禅师名。乃不谈禅。何也。师曰。徒费言语。吾懒宁假曲折。但日夜烦万象为敷演耳。言语有间。而此法无尽。所谓造物无尽藏也。皇祐元年孟夏八日。语众曰。夫动以对静。未始有极。吾一动历年六十有……（原文更长，见 cbeta 锚点）
