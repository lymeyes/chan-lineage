bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0572b04。
sayings:
- text: 僧问。如何是洞阳家风。师曰。入门便见。曰。如何是入门便见。师曰。客是主人相师
  ref: X80n1565_p0572b04（五灯会元）
- text: 问。如何是至极之谈。师曰。爱别离苦
  ref: X80n1565_p0572b04（五灯会元）
