id: L::潭州妙济院师浩传心禅师
name: 潭州妙济院师浩传心
school: —
teacher: 报恩岳
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0298b13。
sayings:
- text: 僧问。拟即第二头。不拟即第三首。如何是第一头。师曰。牧
  ref: X80n1565_p0298b13（五灯会元）
- text: 问。古人断臂。当为何事。师曰。我宁可断臂
  ref: X80n1565_p0298b13（五灯会元）
- text: 问。如何是学人眼。师曰。须知我好心
  ref: X80n1565_p0298b13（五灯会元）
- text: 问。如何是香山剑。师曰。异。曰。还露也无。师曰。不忍见
  ref: X80n1565_p0298b13（五灯会元）
- text: 问。如何是松门第一句。师曰。切不得错举
  ref: X80n1565_p0298b13（五灯会元）
- text: 问。如何是妙济家风。师曰。左右人太多
  ref: X80n1565_p0298b13（五灯会元）
- text: 问。如何是佛法大意。师曰。两口一无舌
  ref: X80n1565_p0298b13（五灯会元）
- text: 问。如何是香山一露。师曰。滔滔地。曰。到者如何。师曰。息汝平生
  ref: X80n1565_p0298b13（五灯会元）
- text: 问。如何是世尊密语。师曰。阿难亦不知。曰。为甚么不知。师曰。莫非仙陀
  ref: X80n1565_p0298b13（五灯会元）
- text: 问。如何是香山宝。师曰。碧眼胡人不敢定。曰。露者如何。师曰。龙王捧不起。僧举圣僧塑像被虎𫜪。问师。既是圣僧。为甚么被大虫𫜪。师曰。疑杀天下人
  ref: X80n1565_p0298b13（五灯会元）
- text: 问。如何是无惭愧底人。师曰。阇黎合吃棒。安国󱒧禅师法嗣安国󱒧禅师法嗣
  ref: X80n1565_p0298b13（五灯会元）
