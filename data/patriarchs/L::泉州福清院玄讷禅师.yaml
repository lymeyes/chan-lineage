id: L::泉州福清院玄讷禅师
name: 泉州福清院玄讷
school: —
teacher: 雪峰存
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0267a11。
sayings:
- text: 问。如何是宗乘中事。师叱之
  ref: X80n1565_p0267a11（五灯会元）
- text: 僧问。如何是触目菩提。师曰。阇黎失却半年粮。曰。为甚么如此。师曰。祇为图他一斗米
  ref: X80n1565_p0267a11（五灯会元）
- text: 问。如何是清净法身。师曰。虾蟆曲蟮
  ref: X80n1565_p0267a11（五灯会元）
- text: 问。教云。唯一坚密身。一切尘中现。如何是坚密身。师曰。驴马猫儿。曰。乞师指示。师曰。驴马也不会
  ref: X80n1565_p0267a11（五灯会元）
- text: 问。如何是物物上辨明。师展一足示之
  ref: X80n1565_p0267a11（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0267a11），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
