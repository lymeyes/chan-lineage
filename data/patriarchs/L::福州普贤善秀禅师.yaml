bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0537b08。
sayings:
- text: 僧问。如何是正中偏。师曰。龙吟初夜后。虎啸五更前。曰。如何是偏中正。师曰。轻烟笼皓月。薄雾锁寒岩。曰。如何是正中来。师曰。松瘁何曾老。花开满未萌。曰。如何是兼中至。师曰。猿啼音莫辨。鹤唳响难明。曰。如何是兼中到。师曰。拨开云外路。脱去月明前
  ref: X80n1565_p0537b08（五灯会元）
