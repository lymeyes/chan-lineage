id: 江陵府护国慧本禅师
name: 江陵府护国慧本
school: —
teacher: 护国月
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0461b09。
sayings:
- text: 僧问。有物先天地。无形本寂寥。未审是甚么物。师曰。一铤墨。曰。恁么则耀古照今去也。师曰。作么生是耀古照今底。僧便喝。师便打
  ref: X80n1565_p0461b09（五灯会元）
- text: 上堂。好个时节。谁肯承当。苟或无人。不如惜取。良久曰。弹雀夜明珠。南岳下十四世南岳下十四世
  ref: X80n1565_p0461b09（五灯会元）
