id: 西禅鼎需禅师
name: 西禅鼎需
alias: 西禅需
school: 杨岐派
teacher: 大慧宗杲禅师
status: draft
bio: 本郡林氏子。幼举进士有声。年二十五因读遗教经。忽曰。几为儒冠误。欲去家。母难之。以亲迎在期师乃绝之曰。夭桃红杏一时分付春风。翠竹黄花此去永为道伴。竟依保寿乐禅师为比丘。一锡湖湘遍参名宿法无异味。归里结庵于羌峰绝顶。不下山者三年。佛心才禅师挽出首众于大乘。尝闻学者即心即佛因缘。时妙喜庵于洋屿。师之友弥光与师书云。庵主手段与诸方别。可来少款如何。师不答。光以计邀师饭。师往赴之。会妙喜为诸徒入室。师随喜焉。妙喜举
sayings:
- text: 僧问马祖。如何是佛。祖云。即心是佛作么生。师下语。妙喜诟之曰。尔见解如此敢妄为人师耶。鸣鼓普说讦其平生珍重得力处排为邪解。师泪交颐不敢仰视。默计曰。我之所得既为所排。西来不传之旨岂止此耶。遂归心弟子之列。一日喜问曰。内不放出外不放入。正恁么时如何。师拟开口。喜拈竹篦劈脊连打三下。师于此大悟厉声曰。和尚已多了也。喜又打一下。师礼拜。喜笑云。今日方知吾不汝欺也。遂印以偈云。顶门竖亚摩酰眼。肘后斜县夺命符。瞎却眼卸却符。赵州东壁挂葫芦。于是声名喧动丛林。住后
  ref: T51n2077_p0687a14（续传灯录）
- text: 上堂曰。句中意意中句。须弥耸于巨川。句刬意意刬句。烈士发乎狂矢。任待牙如剑树口似血盆。徒逞词锋虚张意气。所以净名杜口早涉繁词。摩竭掩关已扬家丑。自余瓦棺老汉岩头大师。向羌峰顶上。拏风鼓浪玩弄神变。脚跟下好与三十。且道过在什么处。良久云。机关不是韩光作。莫把胸襟当等闲。至节
  ref: T51n2077_p0687a14（续传灯录）
- text: 上堂云。二十五日已前群阴消伏泥龙闭户。二十五日已后一阳来复铁树开花。正当二十五日尘中醉客骑驴骑马。前街后街递相庆贺。物外闲人衲帔蒙头围炉打坐。风萧萧雨萧萧冷湫湫。谁管尔张先生李道士胡达磨
  ref: T51n2077_p0687a14（续传灯录）
- text: 上堂。懒翁懒中懒。最懒懒说禅。亦不重自己。亦不重先贤。又谁管尔地。又谁管尔天。物外翛然无个事。日上三竿犹更眠
  ref: T51n2077_p0687a14（续传灯录）
- text: 上堂。举僧问赵州。如何是古人言。州云。谛听谛听。师曰。谛听即不无。切忌唤钟作瓮。室中问僧。万法归一。一归何处。曰新罗国里。师曰。我在青州作一领布衫重七斤𫆏。曰今日亲见赵州。师曰。前头见后头见。僧乃作斫额势。师曰。上座甚处人。曰江西。师曰。因甚么却来这里纳败缺。僧拟议。师便打
  ref: T51n2077_p0687a14（续传灯录）
