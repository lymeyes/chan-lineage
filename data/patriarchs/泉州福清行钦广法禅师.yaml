id: 泉州福清行钦广法禅师
name: 泉州福清行钦广法
school: —
teacher: 仙宗符禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0308b14。
sayings:
- text: 上堂。还有人鉴得么。若有人鉴得。是甚么湖里破草鞋。若也鉴不出。落地作金声。无事久立
  ref: X80n1565_p0308b14（五灯会元）
- text: 僧问。如何是佛法大意。师曰。诸上座大家道取
  ref: X80n1565_p0308b14（五灯会元）
- text: 问。如何是谈真逆俗。师曰。客作汉问甚么。曰。如何是顺俗违真。师曰。吃茶去
  ref: X80n1565_p0308b14（五灯会元）
- text: 问。如何是然灯前。师曰。然灯后。曰。如何是然灯后。师曰。然灯前。曰。如何是正然灯。师曰。吃茶去
  ref: X80n1565_p0308b14（五灯会元）
- text: 问。如何是第二月。师曰。汝问我答。国泰󱒧禅师法嗣国泰󱒧禅师法嗣
  ref: X80n1565_p0308b14（五灯会元）
