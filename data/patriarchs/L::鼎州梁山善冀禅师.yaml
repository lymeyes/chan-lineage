bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0528a05。
sayings:
- text: 僧问。拨尘见佛时如何。师曰。莫眼华
  ref: X80n1565_p0528a05（五灯会元）
- text: 问。和尚几时成佛。师曰。且莫压良为贱。曰。为甚么不肯承当。师曰。好事不如无。师颂鲁祖面壁曰。鲁祖三昧最省力。才见僧来便面壁。若是知心达道人。不在扬眉便相悉
  ref: X80n1565_p0528a05（五灯会元）
