id: 幽谿和尚
name: 幽谿
school: 青原系
teacher: 云岩晟
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0185b10。
sayings:
- text: 僧问。大用现前。不存轨则时如何。师起。绕禅床一匝而坐。僧拟进语。师与一蹋。僧归位而立。师曰。汝恁么我不恁么。汝不恁么我却恁么。僧再拟进语。师又与一蹋。曰。三十年后。吾道大行
  ref: X80n1565_p0185b10（五灯会元）
- text: 问。如何是祖师禅。师曰。泥牛步步出人前
  ref: X80n1565_p0185b10（五灯会元）
- text: 问。处处该不得时如何。师曰。夜半石人无影像。纵横不辨往来源
  ref: X80n1565_p0185b10（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0185b10），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
