bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0115b14。
sayings:
- text: 僧问。如何是衲衣下事。师曰。丑陋任君嫌。不挂云霞色。师将示灭。遗偈曰。祖祖不思议。不许常住世。大众审思惟。毕竟祇这是。言讫而寂
  ref: X80n1565_p0115b14（五灯会元）
