id: 潭州南台道遵法云禅师
name: 潭州南台道遵法云
school: 云门宗
teacher: 云门偃
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0568b03。
sayings:
- text: 上堂。从上宗乘。合作么生提纲。合作么生言论。佛法两字当得么。真如解脱当得么。虽然如是。细不通风。大通车马。若约理化门中。一言才启。震动乾坤。山河大地。海晏河清。三世诸佛。说法现前。于此明得。古佛殿前。同登彼岸。无事。珍重
  ref: X80n1565_p0568b03（五灯会元）
- text: 问。如何是祖师西来意。师曰。下坡不走
  ref: X80n1565_p0568b03（五灯会元）
- text: 问。牛头未见四祖时如何。师曰。著衣吃饭。曰。见后如何。师曰。钵盂挂壁上
  ref: X80n1565_p0568b03（五灯会元）
- text: 问。如何是真如含一切。师曰。分明。曰。为甚么有利钝。师曰。四天打鼓。楼上击钟
  ref: X80n1565_p0568b03（五灯会元）
- text: 问。如何是南台境。师曰。金刚手指天
  ref: X80n1565_p0568b03（五灯会元）
- text: 问。如何是色空。师曰。道士著真红
  ref: X80n1565_p0568b03（五灯会元）
- text: 问。十二时中。时时不离时如何。师曰。谛
  ref: X80n1565_p0568b03（五灯会元）
