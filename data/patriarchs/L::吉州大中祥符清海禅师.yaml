bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0775b08。
sayings:
- text: 问。三世诸佛。一口吞尽。何处更有众生可教化。此理如何。师拟进语。鉴喝之。师忽领旨。述偈曰。实际从来不受尘。个中无旧亦无新。青山况是吾家物。不用寻家别问津。鉴曰。放下著。师礼拜而出
  ref: X80n1565_p0775b08（五灯会元）
