id: 南雄州地藏和尚
name: 南雄州地藏
school: —
teacher: 白云祥
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0578a13。
sayings:
- text: 上堂。僧问。今日供养地藏。地藏还来否。师曰。打开佛殿门。装香换水。师与大容和尚在白云开火路。容曰。三道宝堦。何似个火路。师曰。甚么处不是
  ref: X80n1565_p0578a13（五灯会元）
