id: L::灌州罗汉和尚
name: 灌州罗汉
school: 云门宗
teacher: 香林远
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0582b17。
sayings:
- text: 僧问。如何是佛。师曰。牛头阿旁。曰。如何是法。师曰。剑树刀山
  ref: X80n1565_p0582b17（五灯会元）
- text: 问。如何是佛法大意。师曰。井中红焰。日里浮沤。曰。如何领会。师曰。遥指扶桑日那边
  ref: X80n1565_p0582b17（五灯会元）
- text: 问。如何是本来心。师曰。蹉过了也
  ref: X80n1565_p0582b17（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0582b17），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
