id: 蜀川西禅和尚
name: 蜀川西禅
school: 曹洞宗
teacher: 曹山本寂禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0498a04。
sayings:
- text: 僧问。佛是摩耶降生。未审和尚是谁家子。师曰。水上卓红旗
  ref: X80n1565_p0498a04（五灯会元）
- text: 问。三十六路。阿那一路最妙。师曰。不出第一手。曰。忽遇出时如何。师曰。脊著地也不难
  ref: X80n1565_p0498a04（五灯会元）
