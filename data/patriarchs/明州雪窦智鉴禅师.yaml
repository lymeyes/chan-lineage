id: 明州雪窦智鉴禅师
name: 明州雪窦智鉴
school: 法眼宗
teacher: 天童玨
status: draft
bio: 滁州吴氏子。儿时母与洗手疡因曰。是甚么。对曰。我手似佛手。长失恃怙依真歇于长芦。大休首众即器之。后遁象山百怪不能惑深夜开悟。求证于延寿然复见大休。住后
sayings:
- text: 上堂。世尊有密语迦叶不覆藏。一夜落花雨满城流水香
