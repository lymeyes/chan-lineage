id: 庐山归宗志芝庵主
name: 庐山归宗志芝
school: 黄龙派
teacher: 黄龙南
status: draft
bio: 临江人也。壮为苾刍依黄龙。于归宗遂领深旨。有偈曰。未到应须到。到了令人笑。眉毛本无用。无渠底波俏。未几龙引退芝陆沈于众。一日普请罢。书偈曰。茶芽蔍蓛初离焙。笋角狼忙又吐泥。山舍一年春事办。得闲谁管板头低。由是衲子亲之。师不怿结茅绝顶。作偈曰。千峰顶上一间屋。老僧半间云半间。昨夜云随风雨去。到头不似老僧闲
