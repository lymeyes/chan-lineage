id: 云门偃禅师
name: 云门文偃
honorific: 云门文偃禅师 · 匡真禅师（谥）
school: 云门宗
dynasty: 唐末五代
region: 韶州云门山光泰院
teacher: 雪峰义存（亦参德山、洞山等）
source_ref: 五灯会元·卷十五·韶州云门文偃 / 景德传灯录·卷十九
cbeta: T51n2076 卷十九
bio: 嘉兴张氏子，初参道明，后谒雪峰义存，言下契悟。晚居韶州云门山光泰院，机锋孤危险绝，立「云门三句」：函盖乾坤、截断众流、随波逐浪；又以「一字关」「干屎橛」「日日是好日」等接人，开云门宗，门风高古。
sayings:
- text: 云门三句：「函盖乾坤，截断众流，随波逐浪。」
  ref: 五灯会元·卷十五·云门文偃
- text: 僧问「如何是佛」，师曰「干屎橛」。
  ref: 五灯会元·卷十五·云门文偃
- text: 示众：「日日是好日。」
  ref: 五灯会元·卷十五·云门文偃
