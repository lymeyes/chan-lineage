bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0625a14。
sayings:
- text: 上堂。若于这里会得。便能入一佛国。坐一道场。水鸟树林。共谈斯要。楼台殿阁。同演真乘。续千圣不尽之灯。照八面无私之焰。所以道。在天同天。在人同人。还有知音者么。良久曰。水底金乌天上日。眼中瞳子面前人
  ref: X80n1565_p0625a14（五灯会元）
