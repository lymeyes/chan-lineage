id: L::郢州月掌山寿圣智渊禅师
name: 郢州月掌山寿圣智渊
school: 杨岐派
teacher: 保宁勇
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0736b13。
sayings:
- text: 僧问。祖意西来即不
  ref: X80n1565_p0736b13（五灯会元）
- text: 问。如何是一色。师曰。目前无阇黎。此间无老僧。曰。既不如是。如何晓会。师曰。领取钩头意。莫认定盘星。乃曰。凡有问答。一似击石迸火。流出无尽法财。三草二木。普沾其润。放行也。云生谷口。雾󰋪长空。把定也。碧眼胡僧。亦须罔措。寿圣如斯举唱。犹是化门。要且未有衲僧巴鼻。敢问诸人。作么生是衲僧巴鼻。良久曰。布针开两眼。君向那头看
  ref: X80n1565_p0736b13（五灯会元）
