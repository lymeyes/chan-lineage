id: L::相州天平山从漪禅师
name: 相州天平山从漪
school: —
teacher: 清谿进
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《景德传灯录》T51n2076_p0420c14。
sayings:
- text: 僧问。如何得出三界。师曰。将三界来与汝出
  ref: T51n2076_p0420c14（景德传灯录）
- text: 僧问。如何是和尚家风。师曰。显露地。问如何是佛。师曰。不指天地。曰为什么不指天地。师曰。唯我独尊。问如何是天平。师曰。八凹九凸。问洞深杳杳清谿水饮者如何不升坠。师曰。更梦见什么。问大众云集合谭何事。师曰。香烟起处森罗见
  ref: T51n2076_p0420c14（景德传灯录）
