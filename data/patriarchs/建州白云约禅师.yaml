id: 建州白云约禅师
name: 建州白云约
school: 青原系
teacher: 翠微学禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0192a15。
sayings:
- text: 僧问。不坐遍空堂。不居无学位。此人合向甚么处安置。师曰。青天无电影。韶国师参
  ref: X80n1565_p0192a15（五灯会元）
- text: 师问。甚么处来。韶曰。江北来。师曰。船来陆来。曰。船来。师曰。还逢见鱼鳖么。曰。往往遇之。师曰。遇时作么生。韶曰。咄。缩头去。师大笑
  ref: X80n1565_p0192a15（五灯会元）
