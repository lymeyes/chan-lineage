id: L::临安府径山别峰宝印禅师
name: 临安府径山别峰宝印
school: 杨岐派
teacher: 华藏民
status: draft
bio: 嘉州李氏子。自幼通六经。而厌俗务。乃从德山清素得度具戒。后听华严．起信。既尽其说。弃依密印于中峰。一日。印举
sayings:
- text: 僧问岩头。起灭不停时如何。岩叱曰。是谁起灭。师启悟。即首肯。会圆悟归昭觉。印遣师往省。因随众入室。悟
  ref: X80n1565_p0815b11（五灯会元）
- text: 问。从上诸圣。以何接人。师竖拳。悟曰。此是老僧用底。作么生是从上诸圣用底。师以拳挥之。悟亦举拳相交。大笑而止。后至径山谒大慧。慧
  ref: X80n1565_p0815b11（五灯会元）
- text: 问。甚处来。师曰。西川。慧曰。未出剑门关。与汝三十棒了也。师曰。不合起动和尚。慧忻然。扫室延之。慧南迁。师乃西还。连主数刹。后再出峡。住保宁．金山．雪窦．径山。开堂升座。曰。世尊初成正觉于鹿野苑中。转四谛法轮。㤭陈如比丘最初悟道。后来真净禅师初住洞山。拈云。今日新丰洞里。祇转个拄杖子。遂拈拄杖著左边。云。还有最初悟道者么。若无。丈夫自有冲天志。莫向如来行处行。遂喝一喝。下座。若是印上座则不然。今日向凤凰山里。初无工夫转四谛法轮。亦无气力转拄杖子。祇教诸人行须缓步。语要低声。何故。欲得不招无间业。莫谤如来正法轮
  ref: X80n1565_p0815b11（五灯会元）
- text: 上堂。三世诸佛。以一句演百千万亿句。收百千万亿句祇在一句。祖师门下。半句也无。祇恁么。合吃多少痛棒。诸仁者。且诸佛是。祖师是。若道佛是祖不是。祖是佛不是。取舍未忘。若道佛祖一时是。佛祖一时不是。颟顸不少。且截断葛藤一句作么生道。大虫褁纸帽。好笑又惊人。复举
  ref: X80n1565_p0815b11（五灯会元）
- text: 僧问岩头。浩浩尘中。如何辨主。头云。铜沙锣里满盛油。师曰。大小岩头打失鼻孔。忽有人问保宁。浩浩尘中如何辨主。祇对他道。天寒不及卸帽
  ref: X80n1565_p0815b11（五灯会元）
- text: 上堂。六月初一。烧空赤日。十字街头。雪深一尺。扫除不暇。回避不及。冻得东村廖胡子。半夜著靴水上立
  ref: X80n1565_p0815b11（五灯会元）
- text: 上堂。将心除妄妄难除。即妄明心道转迂。桶底趯穿无忌讳。等闲一步一芙蕖。师至径山。弥浃。孝宗皇帝召对选德殿称旨。入对曰。赐肩舆于东华门内。十年二月。上注圆觉经。遣使驰赐。命作序。师年迈。益厌住持。十五年冬。奏乞庵居。得请。绍熙元年十一月往见交承智䇿禅师。与之言别。䇿问行日。师曰。水到渠成。归。索纸书十二月初七夜鸡鸣时九字。如期而化。奉蜕质返寺之法堂。留七日。颜色明润。发长顶温。越七日。葬于庵之西冈。谥慈辩禅师。塔曰智光
  ref: X80n1565_p0815b11（五灯会元）
