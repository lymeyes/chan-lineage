bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0575b18。
sayings:
- text: 僧问。如何是一体真如。师曰。五郎手里铁弹子
  ref: X80n1565_p0575b18（五灯会元）
- text: 问。十度发言九度休时如何。师曰。口边生荆棘。曰。如何免得此过。师曰。半路好抽身
  ref: X80n1565_p0575b18（五灯会元）
