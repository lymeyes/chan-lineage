id: 湖南上林戒灵禅师
name: 湖南上林戒灵
school: —
teacher: 永泰湍禅师
status: draft
bio: 初参沩山。山曰。大德作甚么来。师曰。介胄全具。山曰。尽卸了来。与大德相见。师曰。卸了也。山咄曰。贼尚未打。卸作甚么。师无对。仰山代曰。请和尚屏却左右。沩山以手揖曰。喏。喏。师后参永泰。方谕其旨
