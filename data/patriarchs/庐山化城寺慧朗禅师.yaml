id: 庐山化城寺慧朗禅师
name: 庐山化城寺慧朗
school: 法眼宗
teacher: 清凉益
status: draft
bio: 江南相国宋齐丘请开堂。师升座曰。今日令公请山僧为众。莫非承佛付嘱。不忘佛恩。众中有问话者出来。为令公结缘
sayings:
- text: 僧问。令公亲降。大众云臻。从上宗乘。请
  ref: X80n1565_p0366a07（五灯会元）
- text: 师举唱。师曰。莫是孤负令公么
  ref: X80n1565_p0366a07（五灯会元）
- text: 问。师常苦口。为甚么学人己事不明。师曰。阇黎甚么处不明。曰。不明处。请师决断。师曰。适来向汝道甚么。曰。恁么则全因今日去也。师曰。退后。礼三拜
  ref: X80n1565_p0366a07（五灯会元）
