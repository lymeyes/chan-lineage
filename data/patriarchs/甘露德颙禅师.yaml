bio: 生平部分原文未载，仅存机缘语（见下）；据《续传灯录》T51n2077_p0538a29。
sayings:
- text: 僧问。知师已得圜通旨。未审如何指示人。师曰。昼见日
  ref: T51n2077_p0538a29（续传灯录）
- text: 僧云。学人不会。师曰。夜见星。问如何是佛法大意。师曰。歌须摇头哭须皱眉。问如何是最初一句。师曰。梁王不识。云未审意旨如何。师曰。独自凄凄
  ref: T51n2077_p0538a29（续传灯录）
- text: 示众曰。旃檀林中更非他木。并是根生土长出现世间。花菓枝条悉皆茂盛。优钵罗华时一现耳。直得圣凡聚首远近同观则不无。且道承谁覆荫。良久曰。南山起云北山下雨
  ref: T51n2077_p0538a29（续传灯录）
- text: 上堂。早朝击鼓劳动诸人。古佛丛林事不获已。直饶德山一棒似倚天长剑。临济一句如旱地爆雷。尽是倚势欺人无风起浪。山僧今日过犯弥天。留与诸方点检
  ref: T51n2077_p0538a29（续传灯录）
