id: 建州白云智作真寂禅师
name: 建州白云智作真寂
school: —
teacher: 鼓山晏
status: draft
bio: 永真朱氏子。容若梵僧。礼鼓山披剃。一日。鼓山
sayings:
- text: 上堂。召大众。众皆回眸。山披襟示之。众罔措。唯师朗悟厥旨。入室印证。又参次。山召曰。近前来。师近前。山曰。南泉唤院主意作么生。师敛手端容。退身而立。山莞然奇之。住后
  ref: X80n1565_p0294a14（五灯会元）
- text: 上堂。还有人向宗乘中致得一问来么。待山僧向宗乘中答。时有僧出礼拜。师便归方丈
  ref: X80n1565_p0294a14（五灯会元）
- text: 问。如何是枯木里龙吟。师曰。火里莲生。曰。如何是髑髅里眼睛。师曰。泥牛入海
  ref: X80n1565_p0294a14（五灯会元）
- text: 问。如何是主中主。师曰。汝还具眼么。曰。恁么则学人归堂去也。师曰。猢狲入布袋
  ref: X80n1565_p0294a14（五灯会元）
- text: 问。如何是延平津。师曰。万古水溶溶。曰。如何是延平剑。师曰。速须退步。曰。未审津与剑是同是异。师曰。可惜许。次迁奉先
  ref: X80n1565_p0294a14（五灯会元）
- text: 僧问。如何是奉先境。师曰。一任观看。曰。如何是境中人。师曰。莫无礼
  ref: X80n1565_p0294a14（五灯会元）
- text: 问。如何是奉先家风。师曰。即今在甚么处。曰。恁么则大众有赖也。师曰。干汝甚么事
  ref: X80n1565_p0294a14（五灯会元）
- text: 问。如何是为人一句。师曰。不是奉先道不得
  ref: X80n1565_p0294a14（五灯会元）
