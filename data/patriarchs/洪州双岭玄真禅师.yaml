id: 洪州双岭玄真禅师
name: 洪州双岭玄真
school: 南岳系
teacher: 盐官安
status: draft
bio: 初问道吾。无神通菩萨为甚么足迹难寻。吾曰。同道者方知。师曰。和尚还知否。吾曰。不知。师曰。何故不知。吾曰。去。你不识我语。师后于盐官处悟旨焉
