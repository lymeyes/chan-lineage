id: 庐山栖贤慧圆禅师
name: 庐山栖贤慧圆
school: 法眼宗
teacher: 清凉益
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0364a15。
sayings:
- text: 上堂。出得僧堂门。见五老峰。一生参学事毕。何用更到这里来。虽然如此。也劳上座一转了也。珍重
  ref: X80n1565_p0364a15（五灯会元）
- text: 僧问。不是风动。不是幡动。未审古人意旨如何。师曰。大众一时会取
  ref: X80n1565_p0364a15（五灯会元）
- text: 问。师乃指其僧曰。住。住。其僧进步
  ref: X80n1565_p0364a15（五灯会元）
- text: 问。从上宗乘。请
  ref: X80n1565_p0364a15（五灯会元）
- text: 师举唱。师曰。前言不构。后语难追。曰。未审今日事如何。师曰。不会人言语
  ref: X80n1565_p0364a15（五灯会元）
- text: 问。如何是佛法大意。师曰。好
  ref: X80n1565_p0364a15（五灯会元）
- text: 问。如何是栖贤境。师曰。入得三门便合知
  ref: X80n1565_p0364a15（五灯会元）
- text: 问。如何是祖师西来意。师曰。此土不欠少
  ref: X80n1565_p0364a15（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0364a15），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
