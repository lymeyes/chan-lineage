id: L::京兆府米和尚
name: 京兆府米
school: 沩仰宗
teacher: 沩山祐
status: draft
bio: 亦谓七师参学后。归受业寺。有老宿
sayings:
- text: 问。月中断井索。时人唤作蛇。未审七师见佛唤作甚么。师曰。若有佛见。即同众生法眼别云。此是甚么时节
  ref: X80n1565_p0329a18（五灯会元）
- text: 问。法灯别云。唤底不是。老宿曰。千年桃核。师令僧去问仰山曰。今时还假悟也无。仰曰。悟即不无。争奈落在第二头。师深肯之。又令
  ref: X80n1565_p0329a18（五灯会元）
- text: 僧问洞山曰。那个究竟作么生。洞曰。却须问他始得。师亦肯之
  ref: X80n1565_p0329a18（五灯会元）
- text: 僧问。自古上贤。还达真正理也无。师曰。达。曰。祇如真正理作么生达。师曰。当时霍光卖假银城与单于。契书是甚么人做。曰。某甲直得杜口无言。师曰。平地教人作保
  ref: X80n1565_p0329a18（五灯会元）
- text: 问。如何是衲衣下事。师曰。丑陋任君嫌。不挂云霞色
  ref: X80n1565_p0329a18（五灯会元）
