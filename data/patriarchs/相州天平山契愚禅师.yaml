id: 相州天平山契愚禅师
name: 相州天平山契愚
school: 曹洞宗
teacher: 道吾诠禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0528a11。
sayings:
- text: 僧问。师唱谁家曲。宗风嗣阿谁。师曰。杖鼓两头打
  ref: X80n1565_p0528a11（五灯会元）
- text: 问。如何是祖师西来意。师曰。镇州萝卜。石含茶居士
  ref: X80n1565_p0528a11（五灯会元）
- text: 问。法无动摇时如何。师曰。你从潞府来。士曰。一步也不曾蓦。师曰。因甚得到这里。士曰。和尚睡语作么。师曰。放你三十棒。官人
  ref: X80n1565_p0528a11（五灯会元）
- text: 问。无邻可隔。为甚么不相见。师曰。怨阿谁。师廊下行次。见僧。以拄杖示之。僧便近前接。师便打。青原下十一世青原下十一世
  ref: X80n1565_p0528a11（五灯会元）
