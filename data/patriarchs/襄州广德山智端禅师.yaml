id: 襄州广德山智端禅师
name: 襄州广德山智端
school: 曹洞宗
teacher: 石门彻禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0521b03。
sayings:
- text: 僧问。牛头未见四祖时如何。师曰。著衣吃饭。曰。见后如何。师曰。著衣吃饭
  ref: X80n1565_p0521b03（五灯会元）
- text: 问。如何是广德山。师曰。当阳花易发。背阴雪难消。曰。如何是山中人。师曰。朝霞不出门。暮霞行千里。筠首座筠首座者太原人也。自至石门逾三十年。丛林慕之。有僧请吃茶次
  ref: X80n1565_p0521b03（五灯会元）
- text: 问。如何是首座为人一著子。师曰。适来犹记得。曰。即今又如何。师曰。好生点茶来。一日荷鉏入园
  ref: X80n1565_p0521b03（五灯会元）
- text: 僧问。三身中那一身去作务。师拄鉏而立。僧曰。莫便当也无。师𢹂鉏便行。青原下九世青原下九世
  ref: X80n1565_p0521b03（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0521b03），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
