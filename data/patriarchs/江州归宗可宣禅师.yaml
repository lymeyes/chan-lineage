id: 江州归宗可宣禅师
name: 江州归宗可宣
school: —
teacher: 琅邪觉禅师
status: draft
bio: 汉州人也。壮为僧。即出峡依琅邪。一语忽投。群疑顿息。琅邪可之。未几。令分座。净空居士郭功甫过门问道。与厚。及师领归宗。时功甫任南昌尉。俄郡守恚师不为礼。捃甚。遂作书寄功甫曰。某世缘尚有六年。奈州主抑逼。当弃余喘。托生公家。愿无见阻。功甫阅书惊喜。且颔之。中夜。其妻梦间见师入其寝。失声曰。此不是和尚来处。功甫撼而问之。妻详以告。呼灯取书示之。相笑不已。遂孕。及生。乃名宣老。期年记问如昔。至三岁。白云端禅师抵其家。始见之。曰。吾侄来也。云曰。与和尚相别几年。宣倒指曰。四年矣盖与相别一年方死。云曰。甚处相别。曰。白莲庄上。云曰。以何为验。曰。爹爹妈妈明日请和尚斋。忽闻推车声。云
sayings:
- text: 问。门外是甚么声。宣以手作推车势。云曰。过后如何。曰。平地两条沟。果六周无疾而逝。秀州长水子璇讲师秀州长水子璇讲师郡之嘉兴人也。自落发诵楞严不辍。从洪敏法师讲至动静二相。了然不生。有省。谓敏曰。敲空击木木一作竹。尚落筌蹄。举目扬眉。已成拟议。去此二途。方契斯旨。敏拊而证之。然欲探禅源。罔知攸往。闻琅邪道重当世。即趋其席。值
  ref: X80n1565_p0448a18（五灯会元）
- text: 上堂次。出问。清净本然。云何忽生山河大地。琅邪凭陵答曰。清净本然。云何忽生山河大地。师领悟。礼谢曰。愿侍巾瓶。琅邪谓曰。汝宗不振久矣。宜厉志扶持。报佛恩德。勿以殊宗为介也。乃如教。再拜以辞。后住长水。承禀日顾众曰。道非言象得。禅非拟议知。会意通宗。曾无别致。由是二宗仰之。尝疏楞严等经。盛行于世
  ref: X80n1565_p0448a18（五灯会元）
