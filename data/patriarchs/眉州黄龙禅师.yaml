bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0313b02。
sayings:
- text: 僧问。如何是密室。师曰。斫不开。曰。如何是密室中人。师曰。非男女相
  ref: X80n1565_p0313b02（五灯会元）
- text: 问。国内按剑者是谁。师曰。昌福。曰。忽遇尊贵时如何。师曰。不遗
  ref: X80n1565_p0313b02（五灯会元）
