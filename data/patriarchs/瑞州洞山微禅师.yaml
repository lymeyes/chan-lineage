sayings:
- text: 上堂。日暖风和柳眼青。冰消鱼跃浪花生。当锋妙得空王印。半夜昆仑戴雪行
  ref: X80n1565_p0538a07（五灯会元）
- text: 僧问。如何是默默相应底事。师曰。痖子吃苦瓜
  ref: X80n1565_p0538a07（五灯会元）
