bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0775b16。
sayings:
- text: 上堂。一举不再说。已落二三。相见不扬眉。翻成造作。设使动弦别曲。告往知来。见鞭影便行。望刹竿回去。脚跟下好与三十棒。那堪更向这里。撮摩石火。收捉电光。工夫枉用浑闲事。笑倒西来碧眼胡。卓拄杖。下座。五灯会元灯会元南岳下十五世下南岳下十五世下
  ref: X80n1565_p0775b16（五灯会元）
