status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0571b16。
sayings:
- text: 僧问。是法住法位。世间相常住。云门和尚向甚么处去也。师曰。见么。曰。错。师曰。错。错
  ref: X80n1565_p0571b16（五灯会元）
- text: 问。如何是西来意。师曰。不错。师因事示颂曰。天地之前径。时人莫彊移。个中生解会。眉上更安眉
  ref: X80n1565_p0571b16（五灯会元）
