id: 凤翔府天葢山幽禅师
name: 凤翔府天葢山幽
school: 青原系
teacher: 夹山会
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0206b15。
sayings:
- text: 僧问。如何是天葢水。师曰。四海滂沲。不犯涓滴
  ref: X80n1565_p0206b15（五灯会元）
- text: 问。学人拟看经时如何。师曰。既是大商。何求小利
  ref: X80n1565_p0206b15（五灯会元）
- text: 问。对境不动时如何。师曰。边方虽有令。不是太平年
  ref: X80n1565_p0206b15（五灯会元）
