status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0198a18。
sayings:
- text: 僧问。宝葢高高挂。其中事若何。请师言下旨。一句不消多。师曰。宝葢挂空中。有路不曾通。傥求言下旨。便是有西东
  ref: X80n1565_p0198a18（五灯会元）
