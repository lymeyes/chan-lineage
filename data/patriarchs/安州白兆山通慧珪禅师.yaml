id: 安州白兆山通慧珪禅师
name: 安州白兆山通慧珪
school: 云门宗
teacher: 法云法秀禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0632a02。
sayings:
- text: 上堂。幸逢嘉会。须采异闻。既遇宝山。莫令空手。不可他时后日。门扇后．壁角头。自说大话也。穷天地。亘古今。即是当人一个自性。于是中间。更无他物。诸人每日行时行著。卧时卧著。坐时坐著。祇对语言时满口道著。以至扬眉瞬目。嗔喜爱憎。寂默游戏。未始间断。因甚么不肯承当。自家歇去。良由无量劫来。爱欲情重。生死路长。背觉合尘。自生疑惑。譬如空中飞鸟。不知空是家乡。水里游鱼。忘却水为性命。何得自抑。却问傍人。大似捧饭称饥。临河叫渴。诸人要得休去么。各请立地定著精神。一念回光。豁然自照。何异空中红日。独运无私。盘里明珠。不拨自转。然虽如是。祇为初机。向上机关。未曾踏著。且道作么生是向上机关。良久曰。仰面看天不见天
  ref: X80n1565_p0632a02（五灯会元）
