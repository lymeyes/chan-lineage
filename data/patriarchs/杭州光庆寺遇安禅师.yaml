id: 杭州光庆寺遇安禅师
name: 杭州光庆寺遇安
school: 法眼宗
teacher: 天台韶
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0371b03。
sayings:
- text: 上堂。僧问。无价宝珠。请师分付。师曰。善能吐露。曰。恁么则人人具足去也。师曰。珠在甚么处。僧礼拜。师曰。也是虗言
  ref: X80n1565_p0371b03（五灯会元）
- text: 问。提纲举领。尽立主宾。如何是主。师曰。深委此
  ref: X80n1565_p0371b03（五灯会元）
- text: 问。曰。如何是宾。师曰。适来向汝道甚么。曰。宾主道合时如何。师曰。其令不行
  ref: X80n1565_p0371b03（五灯会元）
- text: 问。心月孤圆。光吞万象。如何是吞万象底光。师曰。大众总见汝恁么
  ref: X80n1565_p0371b03（五灯会元）
- text: 问。曰。光吞万象从师道。心月孤圆意若何。师曰。抖擞精神著。曰。鹭倚雪巢犹可辩。光吞万象事难明。师曰。谨退
  ref: X80n1565_p0371b03（五灯会元）
- text: 问。青山绿水。处处分明。和尚家风。乞垂一句。师曰。尽被汝道了也。曰。未必如斯。请师答话。师曰。不用闲言。又一僧方礼拜。师曰。问答俱备。僧拟
  ref: X80n1565_p0371b03（五灯会元）
- text: 上堂。欲识曹溪旨。云飞前面山。分明真实个。不用别追攀
  ref: X80n1565_p0371b03（五灯会元）
- text: 僧问。古德有言。井底红尘生。山头波浪起。未审此意如何。师曰。若到诸方。但恁么
  ref: X80n1565_p0371b03（五灯会元）
- text: 问。曰。和尚意旨如何。师曰。适来向汝道甚么。乃曰。古今相承。皆云尘生井底。浪起山头。结子空华。生儿石女。且作么生会。莫是和声送事。就物呈心。句里藏锋。声前全露么。莫是有名无体。异唱玄谭么。上座自会即得。古人意旨即不然。既恁么会不得。合作么生会。上座欲得会么。但看泥牛行处。阳𦦨翻波。木马嘶时。空华坠影。圣凡如此。道理分明。何须久立。珍重
  ref: X80n1565_p0371b03（五灯会元）
