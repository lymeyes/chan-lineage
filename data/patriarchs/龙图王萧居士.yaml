id: 龙图王萧居士
name: 龙图王萧
school: 杨岐派
teacher: 大随元静禅师
status: draft
bio: 字观复。留昭觉日。闻开静板声。有省。问南堂曰。某有个见处。才被人
sayings:
- text: 问。却开口不得。未审过在甚处。堂曰。过在有个见处。堂却
  ref: X80n1565_p0788b03（五灯会元）
- text: 问。朝斾几时到任。公曰。去年八月四日。堂曰。自按察几时离衙。公曰。前月二十。堂曰。为甚么道开口不得。公乃契悟
  ref: X80n1565_p0788b03（五灯会元）
