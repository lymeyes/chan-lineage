bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0517b07。
sayings:
- text: 僧问。言语道断时如何。师曰。两重公案。曰。如何领会。师曰。分明举似
  ref: X80n1565_p0517b07（五灯会元）
- text: 问。如何是凤山境。师曰。好生看取。曰。如何是境中人。师曰。识么
  ref: X80n1565_p0517b07（五灯会元）
