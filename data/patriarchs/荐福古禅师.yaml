id: 荐福古禅师
name: 荐福承古
school: 云门宗
teacher: 云门偃
bio: 云门文偃禅师法嗣，住荐福院。机缘见于《五灯会元》云门宗法嗣章。
sayings:
- text: 上堂：「若论此事，如人上树，口衔树枝，手不攀枝，脚不踏树。树下忽有人问：如何是祖师西来意？若不开金口，又违所问；若开口，又丧身失命。且作么生？」
  ref: 五灯会元·卷十五·荐福承古禅师
