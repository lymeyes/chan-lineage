id: L::杭州南山兴教院惟一禅师
name: 杭州南山兴教院惟一
school: 法眼宗
teacher: 栖贤湜
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0383b10。
sayings:
- text: 僧问。佛未出世时如何。师曰。白云数重。曰。出世后如何。师曰。青山一朵
  ref: X80n1565_p0383b10（五灯会元）
- text: 问。如何是道。师曰。刺头入荒草。曰。如何是道中人。师曰。干屎橛。曰。大耳三藏第三度为甚么不见国师。师曰。脚跟下看。曰。如何得见。师曰。草鞋跟断
  ref: X80n1565_p0383b10（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0383b10），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
