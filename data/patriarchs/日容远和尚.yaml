id: 日容远和尚
name: 日容远
school: 南岳系
teacher: 子湖踪
status: draft
bio: 因奯上座参。师拊掌三下。曰。猛虎当轩。谁是敌者。奯曰。俊鹞冲天。阿谁捉得。师曰。彼此难当。奯曰。且休。未要断这公案。师将拄杖舞归方丈。奯无语。师曰。死却这汉也
