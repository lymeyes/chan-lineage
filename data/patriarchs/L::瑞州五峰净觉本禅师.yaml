id: L::瑞州五峰净觉本禅师
name: 瑞州五峰净觉本
school: 黄龙派
teacher: 宝峰文
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0682a16。
sayings:
- text: 僧问。同声相应时如何。师曰。鹁鸠树上啼。曰。同气相求时如何。师曰。猛虎岩前啸
  ref: X80n1565_p0682a16（五灯会元）
- text: 问。一进一退时如何。师曰。脚在肚下。曰。如何是不动尊。师曰。行住坐卧
  ref: X80n1565_p0682a16（五灯会元）
- text: 上堂。僧问。宝座既升。愿闻举唱。师曰。雪里梅华火里开。曰。莫便是为人处也无。师曰。井底红尘已涨天
  ref: X80n1565_p0682a16（五灯会元）
- text: 上堂。恁么也不得。不恁么也不得。恁么不恁么总不得。诸人作么生会。直下会得。不妨奇特。更或针锥。西天此土
  ref: X80n1565_p0682a16（五灯会元）
- text: 上堂。五峰家风。南北西东。要用便用。以橛钉空。咄
  ref: X80n1565_p0682a16（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0682a16），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
