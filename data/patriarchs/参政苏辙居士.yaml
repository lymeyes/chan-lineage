bio: 字子由。元丰三年以睢阳从事。左迁瑞州榷筦之任。是时。洪州上蓝顺禅师与其父文安先生有契。因往访焉。相得欢甚。公咨以心法。顺示搐鼻因缘。已而有省。作偈呈曰。中年闻道觉前非。邂逅相逢老顺师。搐鼻径参真面目。掉头不受别钳锤。枯藤破衲公何事。白酒青盐我是谁。惭愧东轩残月上。一杯甘露滑如饴。南岳下十四世南岳下十四世
