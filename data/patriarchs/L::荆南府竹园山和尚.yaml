id: L::荆南府竹园山和尚
name: 荆南府竹园山
school: 临济宗
teacher: 魏府大觉
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0404a02。
sayings:
- text: 僧问。久向和尚会禅。是否。师曰。是。僧曰。苍天。苍天。师近前。以手掩僧口。曰。低声。低声。僧打一掌。便拓开。师曰。山僧招得。僧拂袖出去。师笑曰。早知如是。悔不如是
  ref: X80n1565_p0404a02（五灯会元）
- text: 问。既是竹园。还生笋也无。师曰。千株万株。曰。恁么则学人有分也。师曰。汝作么生。僧拟议。师便打
  ref: X80n1565_p0404a02（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0404a02），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
