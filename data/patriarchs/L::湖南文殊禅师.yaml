id: L::湖南文殊禅师
name: 湖南文殊
school: 青原系
teacher: 石霜诸
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0198b07。
sayings:
- text: 僧问。僧繇为甚么邈志公真不得。师曰。非但僧繇。志公也邈不得。曰。志公为甚么邈不得。师曰。彩绘不将来。曰。和尚还邈得也无。师曰。我亦邈不得。曰。和尚为甚么邈不得。师曰。渠不以苟我颜色。教我作么生邈
  ref: X80n1565_p0198b07（五灯会元）
- text: 问。如何是密室。师曰。紧不就。曰。如何是密室中人。师曰。不坐上色牛
  ref: X80n1565_p0198b07（五灯会元）
