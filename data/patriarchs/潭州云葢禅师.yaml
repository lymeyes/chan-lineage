id: 潭州云葢禅师
name: 潭州云葢
school: 青原系
teacher: 石霜诸禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0199b07。
sayings:
- text: 僧问。佛未出世时如何。师曰。月中藏玉兔。曰。出后如何。师曰。日里背金乌
  ref: X80n1565_p0199b07（五灯会元）
- text: 问。不可以情测时如何。师曰。无舌童儿机智尽。风穴参
  ref: X80n1565_p0199b07（五灯会元）
- text: 师问。石角穿云路。携笻意若何。穴曰。红霞笼玉象。拥嶂照川源。师曰。相随来也。穴曰。和尚也须低声。师曰。且坐吃茶
  ref: X80n1565_p0199b07（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0199b07），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
