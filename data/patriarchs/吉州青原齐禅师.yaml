id: 吉州青原齐禅师
name: 吉州青原齐
school: 曹洞宗
teacher: 石门元易禅师
status: draft
bio: 福州陈氏子。二十八辞父兄。从云盖智禅师出家。执事首座。座一日秉拂罢。师问曰。某闻首座所说。莫晓其义。伏望慈悲指示。座谆谆诱之。使究无著说这个法。逾两日有省。以偈呈曰。说法无如这个亲。十方刹海一微尘。若能于此明真理。大地何曾见一人。座骇然。因语智。得度。遍扣诸方。后至石门。深蒙器可。出住青原仅一纪。示寂日。说偈遗众曰。昨夜三更过急滩。滩头云雾黑漫漫。一条拄杖为知己。击碎千关与万关
