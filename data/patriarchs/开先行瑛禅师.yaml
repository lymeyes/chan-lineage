id: 开先行瑛禅师
name: 开先行瑛
alias: 开先瑛
school: 黄龙派
teacher: 东林常总禅师
status: draft
bio: 桂州永福县人姓毛氏。本州菩提寺受业。初谒庆闲禅师稍悟玄旨。次参照觉顿息所疑。出世开先
sayings:
- text: 僧问。如何是祖师西来意。师曰。君山点破洞庭心
  ref: T51n2077_p0598a21（续传灯录）
- text: 僧云。意旨如何。师曰。白浪四边绕红尘何处来。问少林面壁意旨如何。师曰。入定
  ref: T51n2077_p0598a21（续传灯录）
- text: 僧云。孤负古人。师曰。罕遇知音。问法轮工已毕推转意如何。师曰。活鱍鱍地
  ref: T51n2077_p0598a21（续传灯录）
- text: 僧云。法不孤起仗境方生。师曰。有意气时添意气。不风流处也风流。僧画一圆相。师曰。争奈诸圣眼何。问有人问我解何宗。拈起拂子劈口打意旨如何。师曰。猢狲入布袋铁筋击乌龟
  ref: T51n2077_p0598a21（续传灯录）
- text: 僧云。不睹云中雁争知沙塞寒。师曰。千眼大悲观不得。无言童子暗嗟嘘
  ref: T51n2077_p0598a21（续传灯录）
- text: 僧云。为什么如此。师曰。只为如此。乃曰。谈玄说妙譬如画饼充饥。入圣超凡大似飞蛾赴火。一向无事败种蕉芽。更外驰求水中捉月。乃以拂子拂一拂曰。适来许多见解拂却了也。作么生是诸人透脱一句。良久曰。铁牛不吃栏边草。直是须弥顶上眠。击禅床下坐。又曰。和风习习春日迟迟。山花灼灼㵎草离离。紫燕双飞大野。黄莺对语高枝。衲僧到此如凝滞。无限春光付与谁。喝一喝。又曰。弯石巩弓架兴化箭。运那罗延力定烁迦罗眼。不射大雄虎。不射药山鹿。不射云岩师子。不射象骨猕猴。且道射个什么。良久曰。放过一著。又曰。水不洗水金不博金。独露一心拨开万象。一大藏教几张拭不净故纸。从上古佛一队多知解阿师。自兹截断众流。更不百城游历。还有与么衲僧么。良久曰。点即不到。又曰。有一人说得一丈一寸也行不得。有一人行得一丈一寸也说不得。有一人行得说得。有一人行不得。说不得。此四人中华藏欲觅一人为师。明眼衲僧试请拣看。又曰。登山须到顶。入海须到底。学道须到佛祖道不得处。若不如是尽是依草附木底精灵。吃野狐涕唾底鬼子。华藏恁么道。譬如良药然则苦口且要治疾阿㖿㖿。又
  ref: T51n2077_p0598a21（续传灯录）
- text: 上堂喝一喝曰。三月青春强半。溪山雨散云飞。庭花自开自落。梁燕双去双归。复云。木中有火不钻不出。砂中有金不淘不得。心中有道不学不悟。游方行脚唤作道人。还曾悟道么。良久曰。白日莫空过青春不再来。师材器广大果于立事。任人役物如转石于千仞之溪无不如意。有照觉之遗风。在开先几二十年。初苦痰癖屡求去而不可。卧病坊者三年。一旦起将梵刹而鼎新之。迄九年而成。穷极壮丽见者骇叹。素善黄太史鲁直。鲁直戏谓师为如来藏中之说客。菩提场中之游侠云
  ref: T51n2077_p0598a21（续传灯录）
