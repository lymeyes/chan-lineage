id: 风穴延沼禅师
name: 风穴延沼
honorific: 汝州风穴延沼禅师（南院慧颙法嗣）
school: 临济宗
dynasty: 五代
region: 汝州风穴寺（今河南临汝）
teacher: 南院慧颙禅师
source_ref: 五灯会元·卷十一·汝州风穴延沼 / 景德传灯录·卷十二
cbeta: T51n2076 卷十二
bio: 南院慧颙之法嗣，临济宗第四代，世称「风穴」。初参南院，南院以「南禅北禅」之问勘验，延沼下语皆不契，后于言下大悟。住汝州风穴寺，道望甚隆，然久不付法，终以临济宗法脉付首山省念，临济一宗赖以不绝（时人谓「临济一宗，至风穴而中兴」）。
sayings:
- text: 南院问「某闻南方有一宿觉，犹未有人印证，汝作么生？」师良久，院云「唔，闲言语。」（后师于此有省）
  ref: 五灯会元·卷十一·风穴延沼
- text: 师上堂：「若立一尘，家国兴盛；野老颦蹙。不立一尘，家国丧亡；佛祖灭尽。于此明得，阇梨无分；于此不明，出家无益。」
  ref: 五灯会元·卷十一·风穴延沼
