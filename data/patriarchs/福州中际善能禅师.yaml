id: 福州中际善能禅师
name: 福州中际善能
school: 杨岐派
teacher: 龙翔士珪禅师
status: draft
bio: 严陵人。往来龙门云居有年。未有所证。一日。普请择菜次。高庵忽以猫儿掷师怀中。师拟议。庵拦胸踏倒。于是大事洞明
sayings:
- text: 上堂。万古长空。一朝风月。不可以一朝风月昧却万古长空。不可以万古长空不明一朝风月。且如何是一朝风月。人皆畏炎热。我爱夏日长。熏风自南来。殿阁生微凉。会与不会。切忌承当
