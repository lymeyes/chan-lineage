id: L::洪州泐潭宝峰和尚
name: 洪州泐潭宝峰
school: 青原系
teacher: 龙潭信
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0232a02。
sayings:
- text: 问。其中事即易道。不落其中事始终难道。曰。某甲在途中时。便知有此一
  ref: X80n1565_p0232a02（五灯会元）
- text: 问。师曰。更与二十年行脚。也不较多。曰。莫不契和尚意么。师曰。苦瓜那堪待客。问僧。古人有一路接后进初心。汝还知否。曰。请师指出古人一路。师曰。恁么则阇黎知了也。曰。头上更安头。师曰。宝峰不合问仁者。曰。问又何妨。师曰。这里不曾有人乱说道理。出去。岩头僧来参。师竖起拂子曰。落在此机底人。未具眼在。僧拟近前。师曰。恰落在此机。僧回举似岩头。头曰。我当时若见。夺却拂子。看他作么生。师闻乃曰。我竖起拂子从伊夺。总不将物时又作么生。岩头闻得。又曰。无星秤子。有甚辨处。青原下五世青原下五世
  ref: X80n1565_p0232a02（五灯会元）
