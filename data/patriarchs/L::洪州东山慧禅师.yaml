id: L::洪州东山慧禅师
name: 洪州东山慧
school: 南岳系
teacher: 百丈海
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0126b16。
sayings:
- text: 僧问。此岩还有主也无。师曰。有。曰。是甚么人。师曰。三家村里觅甚么。曰。如何是岩中主。师曰。汝还气急么。小师行脚回
  ref: X80n1565_p0126b16（五灯会元）
- text: 师问。汝离吾在外多少时邪。曰。十年。师曰。不用指东指西。直道将来。曰。对和尚不敢谩语。师喝曰。这打野榸汉。师同大于．南用到茶堂。有僧近前不审。用曰。我既不纳汝。汝亦不见我。不审阿谁。僧无语。师曰。不得平白地恁么问伊。用曰。大于亦无语那。于把定其僧曰。是你恁么累我亦然。便打一掴。用大笑曰。朗月与青天。大于侍者到
  ref: X80n1565_p0126b16（五灯会元）
- text: 师问。金刚正定。一切皆然。秋去冬来。且作么生。者曰。不妨和尚借
  ref: X80n1565_p0126b16（五灯会元）
- text: 问。师曰。即今即得。去后作么生。者曰。谁敢问著某甲。师曰。大于还得么。者曰。犹要别人点检在。师曰。辅弼宗师。不废光彩。侍者礼拜
  ref: X80n1565_p0126b16（五灯会元）
