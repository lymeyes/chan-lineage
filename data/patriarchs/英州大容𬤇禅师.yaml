id: 英州大容𬤇禅师
name: 英州大容𬤇
school: 云门宗
teacher: 云门偃
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0570a12。
sayings:
- text: 僧问。如何是大容水。师曰。还我一滴来
  ref: X80n1565_p0570a12（五灯会元）
- text: 问。当来弥勒下生时如何。师曰。慈氏宫中三春草
  ref: X80n1565_p0570a12（五灯会元）
- text: 问。如何是真空。师曰。拈却拒阳著。曰。如何是妙用。师乃握拳。僧曰。真空妙用。相去几何。师以手拨之
  ref: X80n1565_p0570a12（五灯会元）
- text: 问。长蛇偃月即不
  ref: X80n1565_p0570a12（五灯会元）
- text: 问。匹马单枪时如何。师曰。麻江桥下。会么。曰。不会。师曰。圣寿寺前
  ref: X80n1565_p0570a12（五灯会元）
- text: 问。既是大容。为甚么趁出僧。师曰。大海不容尘。小溪多搕𢶍
  ref: X80n1565_p0570a12（五灯会元）
- text: 问。如何是古佛一路。师指地。僧曰。不问这个。师曰。去。师与一老宿相期他往。偶因事不去。宿曰。佛无二言。师曰。法无一向
  ref: X80n1565_p0570a12（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0570a12），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
