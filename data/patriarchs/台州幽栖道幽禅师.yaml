id: 台州幽栖道幽禅师
name: 台州幽栖道幽
school: 曹洞宗
teacher: 洞山良价禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0490b09。
sayings:
- text: 问。如何是少父。师曰。无标的。曰。无标的以为少父邪。师曰。有甚么过。曰。祇如少父作么生。师曰。道者是甚么心行
  ref: X80n1565_p0490b09（五灯会元）
- text: 问。如何是佛。师曰。汝不信是众生。曰。学人大信。师曰。若作胜解。即受群邪
  ref: X80n1565_p0490b09（五灯会元）
- text: 问。如何是道。师曰。但有路可上。更高人也行。曰。如何是道中人。师曰。解驱云里信。师一日斋时。入堂白槌曰。白大众。众举头。师曰。且吃饭。师将示灭
  ref: X80n1565_p0490b09（五灯会元）
- text: 僧问。和尚百年后向甚么处去。师曰。迢然。迢然。言讫坐亡
  ref: X80n1565_p0490b09（五灯会元）
