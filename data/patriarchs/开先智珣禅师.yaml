id: 开先智珣禅师
name: 开先智珣
alias: 开先珣
school: —
teacher: —
status: draft
bio: 饶州人。试经得度志慕宗风。参圆通禅师发悟心要。众推上首。遂住合淝之延昌。次迁开先。佛国禅师回奏紫方袍。都尉张公奏以心印师号
sayings:
- text: 僧问。和尚出世将何为人。师曰。山形拄杖子
  ref: T51n2077_p0537c29（续传灯录）
- text: 僧云。刁刀相似鱼鲁参差。师曰。朝三千暮八百。问赵州三等接人。未审和尚几等接人。师曰。随家丰俭
  ref: T51n2077_p0537c29（续传灯录）
- text: 僧云。向上之机虽已晓。中下之根事若何。师曰。领取钩头意。莫认定盘星。问须菩提唱无说而显道。和尚以何而显道。师曰。山僧只似铁。乃曰。极目青天无片云。万象森罗全体露。若也拟议更商量。终是翻成个露布。久立归堂吃茶去。又曰。平旦寅。扶桑日出照何人。个中未了奔南北。孰知大地一微尘。虽然如是。会得甚奇特。不会亦最亲。又曰。击鼓上来大家觑见。法法现前不劳锻炼。诸禅德为什么如此。彼彼大丈夫为君通一线。又曰动静不禅去来常定。万派同源海云自异。可谓心境一如有何不可。然虽如是且道。衲僧分上还得也无。良久曰。天台楖𣗖木。南岳万岁藤。又曰。握须弥于掌内。鉴十方于目前。且道是什么人分上事。所以云门大师云。三藏圣教在汝舌头上。微尘诸佛在汝脚跟下。不如悟去好。忽若筑著磕著东西不辨南北不分底又作么生。良久曰。存得五湖明月在。不愁无处下金钩。又曰。一法不通。万缘方透。山河无隔碍。灵光触处明。且道眼为什么不见眉毛。只为住处太近未免衲僧取笑。既不恁么又作么生。钵盂无底寻常事。面无鼻孔笑杀人
  ref: T51n2077_p0537c29（续传灯录）
