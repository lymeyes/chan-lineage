sayings:
- text: 上堂。大众云集。师从座起作舞。谓众曰。会么。对曰。不会。师曰。山僧不舍道法而现凡夫事。作么生不会
  ref: X80n1565_p0300a07（五灯会元）
- text: 问。本自圆成。为甚么却分明晦。师曰。汝自捡责看
  ref: X80n1565_p0300a07（五灯会元）
