id: 临安府广福院惟尚禅师
name: 临安府广福院惟尚
school: 云门宗
teacher: 保宁英
status: draft
bio: 初参觉印。问曰。南泉斩猫儿。意旨如何。印曰。须是南泉始得。印以前语诘之。师不能对。至僧堂。忽大悟曰。古人道。从今日去。更不疑天下老和尚舌头。信有之矣。述偈呈印。曰。须是南泉第一机。不知不觉蓦头锥。觌面若无青白眼。还如𮭗𮭗守空池。举未绝。印竖拳曰。正当恁么时作么生。师掀倒禅床。印遂喝。师曰。贼过后张弓。便出。住广福日。室中问僧。提起来作么生会。又曰。且道是个甚么。要人提起
