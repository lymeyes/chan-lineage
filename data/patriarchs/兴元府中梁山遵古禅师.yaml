sayings:
- text: 僧问。空劫无人能问法。即今有问法何安。师曰。大悲菩萨瓮里坐
  ref: X80n1565_p0207b08（五灯会元）
- text: 问。如何是祖师西来意。师曰。道士担漏卮
  ref: X80n1565_p0207b08（五灯会元）
