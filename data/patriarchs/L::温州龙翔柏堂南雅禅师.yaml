id: L::温州龙翔柏堂南雅禅师
name: 温州龙翔柏堂南雅
school: 杨岐派
teacher: 西禅需
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《续传灯录》T51n2077_p0702c12。
sayings:
- text: 上堂曰。瑞峰顶上栖凤亭边。一杯淡粥相依。百衲蒙头打坐。二祖礼三拜依位而立。已是周遮。达磨老臊胡分尽髓皮。一场狼籍。其余之辈何足道哉。柏堂恁么道。还免诸力捡责也无。拍绳床云。洎合停囚长智
  ref: T51n2077_p0702c12（续传灯录）
- text: 上堂曰。大机贵直截。大用贵顿发。纵有啮镞机。一锤须打杀。何故我王库内无如是刀
  ref: T51n2077_p0702c12（续传灯录）
- text: 上堂。紫蕨伸拳笋破梢。杨花飞尽绿阴交。分明西祖单传句。黄栗留鸣燕语巢。这里见得谛信得及。若约诸方决定明窗下安排。龙翔门下直是一槌槌杀。何故不是与人难共住。大都缁素要分明
  ref: T51n2077_p0702c12（续传灯录）
