id: 洪州法昌倚遇禅师
name: 洪州法昌倚遇
school: 曹洞宗
teacher: 北禅智贤禅师
status: draft
bio: 漳州林氏子。幼弃家。依郡之崇福得度。有大志。自受具游方。名著丛席。浮山远和尚尝指谓人曰。此后学行脚样子也。参北禅。禅
sayings:
- text: 问。近离甚处。师曰。福严。禅曰。思大鼻孔长多少。师曰。与和尚当时见底一般。禅曰。汝道我见时长多少。师曰。和尚大似不曾到福严。禅曰。学语之流。又
  ref: X80n1565_p0607a04（五灯会元）
- text: 问。来时马大师安乐否。师曰。安乐。禅曰。向汝道甚么。师曰。教和尚莫乱统。禅曰。念汝新到。不能打得你。师曰。某甲亦放和尚过。茶罢。禅
  ref: X80n1565_p0607a04（五灯会元）
- text: 问。乡里甚处。师曰。漳州。禅曰。三平在彼作甚处。师曰。说禅说道。禅曰。年多少。师曰。与露柱齐年。禅曰。有露柱且从。无露柱年多少。师曰。无露柱。一年也不少。禅曰。夜半放乌鸡。师留北禅最久。于是师资敲唱。妙出一时。晚至西山。眷双岭深𨗉。栖息三年。始应法昌之请。师在双岭受请。与英胜二首座相别。曰。三年聚首。无事不知。检点将来。不无渗漏。以拄杖画一画。曰。这个即且止。宗门事作么生。英曰。须弥安鼻孔。师曰。恁么则临崖看浒眼。特地一场愁。英曰。深沙努眼睛。师曰。争奈圣凡无异路。方便有多门。英曰。铁蛇钻不入。师曰。这般汉有甚共语处。英曰。自缘根力浅。莫怨太阳春。却画一画。曰。宗门事且止。这个事作么生。师便掌。英曰。这漳州子。莫无去就。师曰。你这般见解。不打更待何时。又打。英曰。也是老僧招得
  ref: X80n1565_p0607a04（五灯会元）
- text: 上堂。祖师西来。特唱此事。祇要时人知有。如贫子衣珠。不从人得。三世诸佛。祇是弄珠底人。十地菩萨。祇是求珠底人。汝等正是竛竮乞丐。怀宝迷󳬛。灵利汉才闻举著。眨上眉毛。便知落处。若更踏步向前。不如䇿杖归山去。长啸一声烟雾深
  ref: X80n1565_p0607a04（五灯会元）
- text: 示众。我要一个不会禅底作国师
  ref: X80n1565_p0607a04（五灯会元）
- text: 上堂。汝若退身千尺。我便当处生芽。汝若觌面相呈。我便藏身露影。汝若春池拾砾。我便撒下明珠。直得水洒不著。风吹不入。如个无孔铁锤相似。且道法昌还有为人处也无。良久曰。利刀割肉疮犹合。恶语伤人恨不销
  ref: X80n1565_p0607a04（五灯会元）
- text: 上堂。春山青。春水绿。一觉南柯梦初足。携笻纵步出松门。是处桃英香馥郁。因思昔日灵云老。三十年来无处讨。如今竞爱摘杨花。红香满地无人扫
  ref: X80n1565_p0607a04（五灯会元）
- text: 上堂。拈起拄杖曰。我若拈起。你便唤作先照后用。我若放下。你便唤作先用后照。我若掷下。你便唤作照用同时。忽然不拈不放。你向甚么处卜度。直饶会得倜傥分明。若遇临济德山。便须脑门会地。且道伊有甚么长处。良久曰。曾经大海休夸水。除却须弥不是山
  ref: X80n1565_p0607a04（五灯会元）
- text: 上堂。夜半乌鸡谁捉去。石女无端遭指注。空王令下急搜求。唯心便作军中主。云门长驱。沩山队伍。列五位枪旗。布三玄戈弩。药山持刀。青原荷斧。石巩弯弓。禾山打鼓。阵排雪岭长蛇。兵屯黄檗飞虎。木马带毛烹。泥牛和角煮。赏三军。犒师旅。打葛藤。分露布。截海飏尘。横山簸土。击玄关。除徼路。多少平人受辛苦。无边刹海竞纷纷。三界圣凡无觅处。无觅处。还知否。昨夜云收天宇宽。依然带月啼高树
  ref: X80n1565_p0607a04（五灯会元）
- text: 上堂。闲来祇么坐。拍手谁赓和。回头忽见簸箕星。水墨观音解推磨。拍手一下曰。还会么。八十翁翁虽皓首。看看不见老人容
  ref: X80n1565_p0607a04（五灯会元）
- text: 上堂。法昌今日开炉。行脚僧无一个。唯有十八高人。缄口围炉打坐。不是规矩严难。免见诸人话堕。直饶口似秤锤。未免灯笼勘破。不知道绝功勋。妄自修因证果。喝曰。但能一念回光。定脱一乘羁锁。黄龙南禅师至
  ref: X80n1565_p0607a04（五灯会元）
- text: 上堂。拏云攫浪数如麻。点著铜睛眼便花。除却黄龙头角外。自余浑是赤斑蛇。法昌小刹。路远山遥。景物萧疏。游人罕到。敢谓黄龙禅师曲赐光临。不唯泉石生辉。亦乃人天欣悦。然云行雨施。自古自今。其奈炉鞴之所。钝铁尤多。良医之门。病者愈甚。瘥病须求灵药。销顽必藉金锤。法昌这里。有几个垛根阿师。病者病在膏肓。顽者顽入骨髓。若非黄龙老汉到来。总是虗生浪死。拈拄杖曰。要会么。打面还他州土麦。唱歌须是帝乡人
  ref: X80n1565_p0607a04（五灯会元）
- text: 僧问。古镜未磨时如何。师曰。却须磨取。曰。未审如何下手。师曰。镜在甚么处。僧遂作一圆相。师便打曰。这漆桶。碌砖也不识。师与感首座岁夜吃汤次。座曰。昔日北禅分岁。曾烹露地白牛。和尚今夜分岁。有何施设。师曰。腊雪连山白。春风透户寒。座曰。大众吃个甚么。师曰。莫嫌冷淡无滋味。一饱能消万劫饥。座曰。未审是甚么人置办。师曰。无惭愧汉。来处也不知。英胜二首座到山相访。英曰。和尚寻常爱点检诸方。今日因甚么却来古庙里作活计。师曰。打草祇要蛇惊。英曰。莫涂糊人好。师曰。你又刺头入胶盆作甚么。英曰。古人道。我见两个泥牛鬬入海。所以住此山。未审和尚见个甚么。师曰。你他时异日。有把茆葢头。人或问你。作么生祇对。英曰。山头不如岭尾。师曰。你且道。还当得住山事也无。英曰。使镢不及拖犂。师曰。还曾梦见古人么。英曰。和尚作么生。师展两手。英曰。𫚥跳不出斗。师曰。休将三寸烛。拟比太阳辉。英曰。争奈公案见在。师曰。乱统禅和。如麻似粟。龙图徐公禧布衣时。与师往来。为法喜之游。师将化前一日。作偈遗之曰。今年七十七。出行须择日。昨夜问龟哥。报道明朝吉。徐览偈耸然。邀灵源清禅师同往。师方坐寝室。以院务诫知事曰。吾住此山二十三年。护惜常住。每自莅之。今行矣。汝辈著精彩。言毕。举拄杖曰。且道这个分付阿谁。徐与灵源皆屏息。遂掷杖投床。枕臂而化
  ref: X80n1565_p0607a04（五灯会元）
