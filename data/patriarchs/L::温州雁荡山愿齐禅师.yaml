id: L::温州雁荡山愿齐禅师
name: 温州雁荡山愿齐
school: 法眼宗
teacher: 天台韶
status: draft
bio: 钱塘人也。姓江氏。少依水心寺绍岩禅师出家受具。初习智者教精研止观圆融行门。后参天台国师发明玄奥。乃住雁荡山。开宝五年吴越王长子。于西关建光庆寺请师开法住持。仍于城下诸禅众中访求名行三百人同入新寺。师
sayings:
- text: 上堂有僧问。夜月舒光为什么碧潭无影。师曰。作家弄影汉。其僧从东过西立。师曰。不唯弄影兼乃怖头。师居之未几固辞入山。太平兴国中示灭
  ref: T51n2076_p0424a08（景德传灯录）
