id: L::潭州文殊禅师
name: 潭州文殊
school: 青原系
teacher: 韶山普
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0217b01。
sayings:
- text: 僧问。如何是祝融峰前事。师曰。岩前瑞草生
  ref: X80n1565_p0217b01（五灯会元）
- text: 问。仁王登位。万姓沾恩。和尚出世。有何祥瑞。师曰。万里长沙驾铁船
  ref: X80n1565_p0217b01（五灯会元）
- text: 问。如何是本尔庄严。师曰。菊花原上景。行人去路长
  ref: X80n1565_p0217b01（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0217b01），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
