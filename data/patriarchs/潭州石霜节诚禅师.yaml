id: 潭州石霜节诚禅师
name: 潭州石霜节诚
school: 云门宗
teacher: 南台勤禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0587a10。
sayings:
- text: 僧问。古者道。卷帘当白昼。移榻对青山。如何是卷帘当白昼。师曰。过净瓶来。曰。如何是移榻对青山。师曰。却安旧处著
  ref: X80n1565_p0587a10（五灯会元）
- text: 上堂。心外无法。法外无心。随缘荡荡。更莫沉吟。你等诸人。才上堦道。便好回去。更要待第二杓恶水泼。作甚么
  ref: X80n1565_p0587a10（五灯会元）
