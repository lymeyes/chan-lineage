bio: 生平部分原文未载，仅存机缘语（见下）；据《续传灯录》T51n2077_p0604c08。
sayings:
- text: 僧问。庵内人为甚么不见庵外事。师曰。东家点灯西家暗坐。曰如何是庵内事。师曰。眼在甚么处。曰三门头合掌。师曰。有甚交涉。乃曰。五更残月落。天晓白云飞。分明目前事。不是目前机。既是目前事为甚么不是目前机。良久曰。此去西天路。迢迢十万余
  ref: T51n2077_p0604c08（续传灯录）
- text: 上堂良久。拊掌一下曰。阿呵呵阿呵呵。还会么。法法本来法。遂拈拄杖曰。这个是山僧拄杖。那个是本来法。还定当得么。卓一下
  ref: T51n2077_p0604c08（续传灯录）
