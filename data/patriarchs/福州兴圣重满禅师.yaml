id: 福州兴圣重满禅师
name: 福州兴圣重满
school: 青原系
teacher: 罗山闲
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0276b16。
sayings:
- text: 上堂。觌面分付。不待文宣。对眼投机。唤作参玄。上士若能如此。所以宗风不坠
  ref: X80n1565_p0276b16（五灯会元）
- text: 僧问。如何是宗风不坠底句。师曰。老僧不忍
  ref: X80n1565_p0276b16（五灯会元）
- text: 问。昔日灵山会里。今朝兴圣筵中。和尚亲传。如何举唱。师曰。欠汝一
  ref: X80n1565_p0276b16（五灯会元）
