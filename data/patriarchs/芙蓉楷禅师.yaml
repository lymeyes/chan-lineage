id: 芙蓉楷禅师
name: 芙蓉道楷
school: 曹洞宗
teacher: 投子青
bio: 宋代曹洞宗中兴祖师（节点原标「法眼宗」，按史实为曹洞宗）。宋徽宗赐紫衣及「定照禅师」号，楷以疾辞，不奉诏，被贬淄州，其风骨为禅林所重。门下出丹霞子淳，再传天童如净（日本曹洞宗开祖道元之师）。
sayings:
- text: 师坚拒赐紫，上表：「臣虽编削方袍，未尝随例请给。欲望圣慈，听臣所乞。」坐是为僧罪，编管淄州。
  ref: 五灯会元·卷十四·芙蓉道楷禅师（事迹散见宋僧史略/五灯会元）
