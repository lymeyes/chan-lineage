id: 谷隐知俨禅师
name: 谷隐知俨
alias: 谷隐俨
school: 曹洞宗
teacher: 谷隐静禅师
status: draft
bio: 登州人也。受业于本州鹊山。得法于前谷隐知静禅师。继踵住持玄侣臻萃
sayings:
- text: 僧问。师唱谁家曲宗风嗣阿谁。师曰。白云南伞盖北。问如何是迦叶亲闻底事。师曰。速须作却。问如何是诸佛照不著处。师曰。问遮山鬼窟作么。曰照著后如何。师曰。咄精怪。问千山万水如何登涉。师曰。举步便千里万里。曰不举步时如何。师曰。亦千里万里
  ref: T51n2076_p0406a10（景德传灯录）
