id: 开元琦禅师
name: 开元琦
school: 黄龙派
teacher: 黄龙慧南禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《建中靖国续灯录》X78n1556_p0191a15。
sayings:
- text: 问：芥子纳须弥即不问，微尘里转大法轮时如何？师云：一步进一步。僧曰：恁么则朝到西天，暮归唐土。师云：作客不如归家。僧曰：怀州牛吃禾，益州马腹胀，又作么生？师云：人心似等闲
  ref: X78n1556_p0191a15（建中靖国续灯录）
- text: 问：有佛处不得住，无佛处急走过。离此二途，请师直道。师云：但得雪消去，自然春到来。僧曰：恁么则截断两头，归家稳坐。师云：不动一句又作么生？僧曰：大罗山顶依青嶂，挂月峰前看白云。师云：心不负人，面无惭色
  ref: X78n1556_p0191a15（建中靖国续灯录）
- text: 问：久向道风，请师相见。师云：云月是同，溪山各异
  ref: X78n1556_p0191a15（建中靖国续灯录）
- text: 上堂，云：文彩未生，一物也无；文彩既生，万事纵横。明来暗谢，暗去明来，楼阁门开，谁睹善财？喝一喝，拍一拍，下座
  ref: X78n1556_p0191a15（建中靖国续灯录）
- text: 上堂云：虗空无内外，事理有短长。顺则成菩提，逆则成烦恼。灯笼常瞌睡，露柱亦懊恼。大道在目前，更去何处讨？击禅床一下
  ref: X78n1556_p0191a15（建中靖国续灯录）
- text: 上堂。云：四面亦无门，十方无壁落，头髼䯳，耳卓朔，个个男儿大丈夫，何得无绳而自缚？且道透脱一句作么生道？良久，云：蹈破草鞋赤脚走
  ref: X78n1556_p0191a15（建中靖国续灯录）
- text: 上堂，以拂子击禅床一下，云：作什么？良久，云：因风吹火，用力不多
  ref: X78n1556_p0191a15（建中靖国续灯录）
