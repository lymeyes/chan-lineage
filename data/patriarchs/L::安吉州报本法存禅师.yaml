id: L::安吉州报本法存禅师
name: 安吉州报本法存
school: 云门宗
teacher: 天衣怀
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0621b13。
sayings:
- text: 僧问。无味之谈。塞断人口。作么生是塞断人口底句。师便打。僧曰。恁么则一句流通。天人耸耳。师曰。祇恐不是玉。是玉也大奇。曰。专为流通。师曰。一任乱道。在天衣受请
  ref: X80n1565_p0621b13（五灯会元）
- text: 上堂曰。吴江圣寿见召住持。进退不遑。且随缘分。此皆堂头和尚。提耳训育。终始奖谕。若据今日。正令当行。便好一棒打杀。那堪更容立在座前。虽然如是。养子方见父慈
  ref: X80n1565_p0621b13（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0621b13），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
