id: 枣山光仁禅师
name: 枣山光仁
school: 青原系
teacher: 孝义性空禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0192b07。
sayings:
- text: 上堂众集。师于座前谓众曰。不负平生行脚眼目。致个问来。还有么。众无对。师曰。若无。即升座去也。便登座。僧出礼拜。师曰。负我且从大众。何也。便归方丈。翌日。有僧请辨前语意旨如何。师曰。斋时有饭与汝吃。夜后有床与汝眠。一向煎迫我作甚么。僧礼拜。师曰。苦。苦。僧曰。请师直指。师乃垂足曰。舒缩一任老僧。五灯会元灯会元青原下五世青原下五世
