bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0113b18。
sayings:
- text: 上堂。知而无知。不是无知。而说无知。便下座南泉云。恁么依师道。始道得一半。黄檗云。不是南泉驳他。要圆前话
  ref: X80n1565_p0113b18（五灯会元）
