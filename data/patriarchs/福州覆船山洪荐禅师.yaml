id: 福州覆船山洪荐禅师
name: 福州覆船山洪荐
school: 青原系
teacher: 石霜诸
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0197a11。
sayings:
- text: 僧问。如何是本来面目。师便闭目吐舌。又开目吐舌。曰。本来有许多面目。师曰。适来见甚么。僧无语
  ref: X80n1565_p0197a11（五灯会元）
- text: 问。如何是师子。师曰。善哮吼。僧拊掌曰。好手。好手。师曰。青天白日。却被鬼迷。僧作掀禅床势。师便打。曰。驴事未去。马事到来。师曰。灼然作家。僧拂袖便出。师曰。将瓯盛水。拟比大洋
  ref: X80n1565_p0197a11（五灯会元）
- text: 问。如何是玄妙。师曰。未闻已前。道吾
  ref: X80n1565_p0197a11（五灯会元）
- text: 问。久向和尚会禅。是否。师曰。苍天。苍天。吾近前掩师口。曰。低声。低声。师与一掌。吾曰。苍天。苍天。师把住曰。得恁么无礼。吾却与一掌。师曰。老僧罪过。吾拂袖便行。师呵呵大笑曰。早知如是。不见如是。僧参。师便作起势。僧便出。师曰。阇黎且来人事。僧回作抽坐具势。师却归方丈。僧曰。苍天。苍天。师曰。龙头蛇尾。僧近前叉手立。师曰。败将投王。不存性命
  ref: X80n1565_p0197a11（五灯会元）
- text: 问。抱璞投师。师还接否。师以手拍香台。僧礼拜。师曰。礼拜则不无。其中事作么生。僧却拍香台。师曰。舌头不出口。师将示寂。三日前令侍者唤第一座来。师卧。出气一声。座唤侍者曰。和尚渴。要汤水吃。师乃面壁而卧。临终令集众。乃展两手出舌示之。时第三座曰。诸人。和尚舌根硬也。师曰。苦哉。苦哉。诚如第三座所言。舌根硬去也。言讫而寂。谥绍隆大师
  ref: X80n1565_p0197a11（五灯会元）
