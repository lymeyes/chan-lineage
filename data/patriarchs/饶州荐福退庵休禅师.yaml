id: 饶州荐福退庵休禅师
name: 饶州荐福退庵休
school: 杨岐派
teacher: 乌巨道行禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0819b15。
sayings:
- text: 上堂。风动邪。幡动邪。风鸣邪。铃鸣邪。非风铃鸣。非风幡动。此土与西天。一队黑漆桶。诳惑世间人。看看灭胡种。山僧不奈何。趁后也打哄。瓠子曲弯弯。冬瓜直儱侗
  ref: X80n1565_p0819b15（五灯会元）
- text: 上堂。结夏时左眼半斤。解夏时右眼八两。谩云九十日安居。嬴得一肚皮妄想。直饶七穴八穿。未免山僧拄杖。虽然如是。千钧之弩。不为鼷鼠而发机
  ref: X80n1565_p0819b15（五灯会元）
- text: 上堂。先师寻常用脑后一锤。卸却学者胸中许多屈曲。当年克宾维那。曾中兴化此毒。往往天下丛林。唤作超宗异目。非唯孤负兴化。亦乃克宾受辱。若是临济儿孙。终不依草附木。资福喜见同参。今日倾肠倒腹。遂卓拄杖。喝一喝曰。还知先师落处么。伎死禅和。如麻似粟
  ref: X80n1565_p0819b15（五灯会元）
- text: 上堂。言发非声。是个甚么。色前不物。莫乱针锥。透过禹门。风波更险。咄
  ref: X80n1565_p0819b15（五灯会元）
