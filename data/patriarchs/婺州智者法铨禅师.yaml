bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0643b03。
sayings:
- text: 上堂。要扣玄关。须是有节操。极慷慨。斩得钉。截得铁。硬剥剥地汉始得。若是隈刀避箭。碌碌之徒看即有分。以拂子击禅床。下座
