bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0268a07。
sayings:
- text: 僧问。如何是佛。师曰。不诳汝。曰。莫便是否。师曰。汝诳他。闽王请斋
  ref: X80n1565_p0268a07（五灯会元）
- text: 问。师还将得笔来也无。师曰。不是稽山绣管。惭非月里兔毫。大王既垂顾
  ref: X80n1565_p0268a07（五灯会元）
- text: 问。山僧敢不通呈。又
  ref: X80n1565_p0268a07（五灯会元）
- text: 问。如何是法王。师曰。不是梦笔家风
  ref: X80n1565_p0268a07（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0268a07），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
