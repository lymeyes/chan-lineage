bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0514b01。
sayings:
- text: 僧问。教中道。诸佛放光明。助发实相义。光明即不
  ref: X80n1565_p0514b01（五灯会元）
- text: 问。如何是实相义。师曰。会么。曰。莫便是否。师曰。是甚么
  ref: X80n1565_p0514b01（五灯会元）
- text: 问。师唱谁家曲。宗风嗣阿谁。师曰。云岭龙昌月。神风洞上泉
  ref: X80n1565_p0514b01（五灯会元）
