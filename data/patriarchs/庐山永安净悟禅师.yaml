id: 庐山永安净悟禅师
name: 庐山永安净悟
school: 青原系
teacher: 蟠龙文禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0216a11。
sayings:
- text: 僧问。如何是出家底事。师曰。万丈悬崖撒手去。曰。如何是不出家底事。师曰。迥殊雪岭安巢节。有异许由挂一瓢
  ref: X80n1565_p0216a11（五灯会元）
- text: 问。六门不通。如何达信。师曰。阇黎外边与谁相识
  ref: X80n1565_p0216a11（五灯会元）
- text: 问。脱笼头．卸角驮来时如何。师曰。换骨洗肠投紫塞。雁门切忌更衔芦
  ref: X80n1565_p0216a11（五灯会元）
- text: 问。从上诸圣将何示人。师曰。有异祖龙行化节。迥超栖凤越扬尘
  ref: X80n1565_p0216a11（五灯会元）
- text: 问。如何是解作客底人。师曰。宝御珍装犹尚弃。谁能历劫傍他门
  ref: X80n1565_p0216a11（五灯会元）
- text: 问。如何是西来意。师曰。海底泥牛吼。云中木马嘶
  ref: X80n1565_p0216a11（五灯会元）
- text: 问。众手淘金。谁是得者。师曰。黄帝不曾游赤水。神珠罔象也虗然
  ref: X80n1565_p0216a11（五灯会元）
- text: 问。雪覆芦华时如何。师曰。虽则沍凝呈瑞色。太阳晖后却迷人
  ref: X80n1565_p0216a11（五灯会元）
