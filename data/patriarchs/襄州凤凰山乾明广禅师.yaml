bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0633a12。
sayings:
- text: 上堂。日头东畔出。月向西边没。来去急如梭。催人成白骨。山僧有一法。堪为保命术。生死不相干。打破精魂窟。咄。咄。是何物。不是众生。不是佛。参
  ref: X80n1565_p0633a12（五灯会元）
