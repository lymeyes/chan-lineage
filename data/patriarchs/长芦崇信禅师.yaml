bio: 庐州人姓高氏。十三依本州承天僧用成为师。二十受具。南游造杭州净慈圆照禅师法席投机印证。初住秀州资圣
sayings:
- text: 僧问。如何是道。师曰。家家门首通长安。云如何是道中人。师曰。上座自何来。云莫只这个便是也无师曰。碧眼胡僧笑点头。云毕竟如何。师曰。礼拜了退
  ref: T51n2077_p0558b28（续传灯录）
- text: 上堂曰。凄凉大野物景萧条。露滴枯枝烟笼远墅。长天极目列万象以昭然。霜月流辉映千江而普现。如斯举唱带水拕泥。若也尽令提纲。直须祖佛侧立。放过一著别有清规。喝一喝
  ref: T51n2077_p0558b28（续传灯录）
