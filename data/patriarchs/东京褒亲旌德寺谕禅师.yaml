sayings:
- text: 上堂。新罗打鼓。大宋
  ref: X80n1565_p0675a08（五灯会元）
- text: 上堂。庭前柏子问话。灯笼露柱著忙。香台拄杖起作舞。卧病维摩犹在床。这老汉我也识得。你病休讶郎当。咄
  ref: X80n1565_p0675a08（五灯会元）
