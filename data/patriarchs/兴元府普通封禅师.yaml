sayings:
- text: 僧问。今日一会。何似灵山。师曰。震动乾坤
  ref: X80n1565_p0572b14（五灯会元）
- text: 问。如何是普通境。师曰。庭前有竹三冬秀。户内无灯午夜明
  ref: X80n1565_p0572b14（五灯会元）
