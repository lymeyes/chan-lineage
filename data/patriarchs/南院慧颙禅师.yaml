cbeta: T51n2076 卷十二
bio: 兴化存奖之法嗣，临济宗第三代。住汝州宝应南院，门风简古。传法于风穴延沼，为临济宗入宋后大兴之关键一环（南院→风穴→首山→汾阳→石霜圆→杨岐/黄龙）。
sayings:
- text: 僧问「如何是宝应主」，师云「长在地中，不出头」；僧云「忽遇出头时如何」，师云「刈却」。（以农禅之喻示「不属渐次」）
  ref: 五灯会元·卷十一·南院慧颙
- text: 师常示：「诸方只具啐啄同时眼，不具啐啄同时用。」（啐啄之机，师徒相契如卵生之破壳）
  ref: 五灯会元·卷十一·南院慧颙
