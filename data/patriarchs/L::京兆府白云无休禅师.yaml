bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0216a07。
sayings:
- text: 僧问。路逢猛虎。如何降伏。师曰。归依佛法
  ref: X80n1565_p0216a07（五灯会元）
- text: 僧问。如何是白云境。师曰。月夜楼边海客愁
  ref: X80n1565_p0216a07（五灯会元）
