sayings:
- text: 上堂。天地一指。绝诤竞之心。万物一马。无是非之论。由是魔罗潜迹。佛祖兴隆。寒山拊掌欣欣。拾得呵呵大笑。大众。二古圣笑个甚么。良久。呵呵大笑曰。昙华一朵再逢春
