id: 泉州凉峰洞渊禅师
name: 泉州凉峰洞渊
school: —
teacher: 琅邪觉
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《续传灯录》T51n2077_p0510c10。
sayings:
- text: 僧问。如何是涅槃。师曰。刀斫斧劈。曰如何是解脱。师曰。衫长袴短。问诸圣不到处师还知也无。师曰。老来无力下禅床。问离四句绝百非时如何。师曰。柴门草自深。问狗子还有佛性也无。师曰。松直棘曲。问如何是佛。师曰。金沙照影。曰如何是道。师曰。玉女抛梭。曰佛与道相去几何。师曰。龟毛长一丈兔角长八尺。真如方禅师真州真如院方禅师参琅邪。唯看柏树子话。每入室陈其所见。不容措词。常被喝出。忽一日大悟直入方丈曰。我会也。琅邪曰。汝作么生会。师曰。夜来床荐暖一觉到天明。琅邪可之。兴教坦禅师宣州兴教院坦禅师。永嘉牛氏子。业打银。因淬砺瓶器有省。即出家参琅邪机语顿契。后依天衣怀禅师。时住兴教。擢为第一座。衣受他请欲闻州乞师继之。时刁景纯学士守宛陵。衣恐刁涉外议。乃于观音前祝曰。若坦首座。道眼明白堪任住持。愿示梦于刁学士。刁夜梦牛在兴教法座上。衣凌晨辞州。刁举所梦。衣大笑。刁问其故。衣曰。坦首座姓牛又属牛。刁就座出帖请之。师受请升座。有雪窦化主省宗出
  ref: T51n2077_p0510c10（续传灯录）
- text: 问。诸佛未出世人人鼻孔辽天。出世后为甚么杳无消息。师曰。鸡足峰前风悄然。宗曰。未在更道。师曰。大雪满长安。宗曰。谁人知此意令我忆南泉。拂袖归众更不礼拜。师曰。新兴教今日失利。便归方丈。令人请宗至。师曰。适来错只对一转语。人天众前何不礼拜盖覆却。宗曰。大丈夫膝下有黄金。争肯礼拜无眼长老。师曰。我别有语在。宗乃理前语。至未在更道处。师曰。我有三十棒寄尔打雪窦。宗乃礼拜
  ref: T51n2077_p0510c10（续传灯录）
