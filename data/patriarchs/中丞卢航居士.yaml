bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0717a09。
sayings:
- text: 问。诸家因缘。不劳拈出。直截一句。请师指示。通厉声指曰。看火。公急拨衣。忽大悟。谢曰。灼然。佛法无多子。通喝曰。放下著。公应喏喏
  ref: X80n1565_p0717a09（五灯会元）
