id: 唐州大乘山和尚
name: 唐州大乘山
school: 曹洞宗
teacher: 含珠哲禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0517b04。
sayings:
- text: 僧问。枯树逢春时如何。师曰。世间希有
  ref: X80n1565_p0517b04（五灯会元）
- text: 问。如何是四方八面事。师曰。升子里𨁝跳。斗子内转身
  ref: X80n1565_p0517b04（五灯会元）
