id: 衢州超化静禅师
name: 衢州超化静
school: 黄龙派
teacher: 宝峰文禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0685a09。
sayings:
- text: 上堂。声前认得。已涉廉纤。句下承当。犹为钝汉。电光石火。尚在迟疑。点著不来。横尸万里。良久云。有甚用处。咄。南岳石头怀志庵主南岳石头怀志庵主婺州吴氏子。年十四。师智慧院宝偁。二十二试所习。落发。肆讲十二年。宿学敬慕。尝欲会通诸宗。正一代时教。有禅者问曰。杜顺乃贤首宗祖师也。谈法身则曰。怀州牛吃禾。益州马腹胀。此偈合归天台何义耶。师无对。即出游方。晚至洞山。谒真净
  ref: X80n1565_p0685a09（五灯会元）
- text: 问。古人一喝不作一喝用。意旨如何。净叱之。师趋出。净笑呼曰。浙子斋后游山好。师忽领悟。久之辞去。净曰。子所造虽逸格。惜缘不胜耳。因识其意。自尔诸方。力命出世。师却之。庵居二十年。不与世接。士夫踵门。略不顾。有偈曰。万机休罢付痴憨。踪迹时容野鹿参。不脱麻衣拳作枕。几生梦在绿萝庵。或
  ref: X80n1565_p0685a09（五灯会元）
- text: 问。住山多年。有何旨趣。师曰。山中住。独掩柴门无别趣。三个柴头品字煨。不用援毫文彩露。崇宁改元冬。曳杖造龙安。人莫之留。明年六月晦。问侍僧曰。早暮。曰。已夕矣。遂笑曰。梦境相逢。我睡已觉。汝但莫负丛林。即是报佛恩德。言讫。示寂于最乐堂。茶毗收骨。塔于乳峰之下
  ref: X80n1565_p0685a09（五灯会元）
