bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0674a13。
sayings:
- text: 僧问。佛力法力即不
  ref: X80n1565_p0674a13（五灯会元）
- text: 问。如何是慧力。师曰。踏倒人我山。扶起菩提树。曰。菩提本无树。向甚么处下手。师曰。无下手处。正好著力。曰。今日得闻于未闻。师曰。莫把真金唤作𨱎
  ref: X80n1565_p0674a13（五灯会元）
- text: 上堂。佛法根源。非正信妙智不能悟入。祖师关键。非大悲重愿何以开通。具信智则权实双行。如金在矿。全悲愿则善恶可辨。似月离云。大众。祇如父母未生时。许多譬喻向甚么处吐露。良久曰。十语九中。不如一默
  ref: X80n1565_p0674a13（五灯会元）
