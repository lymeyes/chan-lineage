id: PRE::西天初祖摩诃迦叶
name: 摩诃迦叶
honorific: 西天初祖 · 饮光尊者 · 金色头陀
school: 西天祖师
dynasty: 佛在世（约公元前 5 世纪）
region: 摩竭陀国
teacher: 释迦牟尼佛
source_ref: 五灯会元·卷一·西天一祖摩诃迦叶尊者 / 景德传灯录·卷一
cbeta: T51n2076 卷一
bio: '佛之弟子，少欲头陀第一，人称「金色头陀」「饮光尊者」。

  世尊于灵山会上拈花示众，人天百万悉皆默然，唯迦叶破颜微笑；世尊曰：「吾有正法眼藏、涅槃妙心、实相无相、微妙法门，不立文字、教外别传，付嘱摩诃迦叶。」此即禅宗「以心传心」之始。

  佛灭后，迦叶于王舍城结集三藏（窟内结集），为僧团统摄者，传法于阿难。'
sayings:
- text: 世尊付法偈：「法本法无法，无法法亦法；今付无法时，法法何曾法。」
  ref: 五灯会元·卷一·摩诃迦叶
status: draft
verify: 待 CBETA 校对；拈花付法出自《大梵天王问佛决疑经》及灯录传承，属宗门根本公案。
