id: 福州兴福院康源禅师
name: 福州兴福院康源
school: 黄龙派
teacher: 东林常总禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0675b01。
sayings:
- text: 上堂。山僧有一诀。寻常不漏泄。今日不囊藏。分明为君说。良久曰。寒时寒。热时热。慧圆上座慧圆上座开封酸枣干氏子。世业农。少依邑之建福寺德光为师。性椎鲁。然勤渠祖道。坚坐不卧。居数岁得度。出游庐山。至东林。每以己事请
  ref: X80n1565_p0675b01（五灯会元）
- text: 问。朋辈见其貌陋。举止乖疏。皆戏侮之。一日。行殿庭中。忽足颠而仆。了然开悟。作偈俾行者书于壁曰。这一交。这一交。万两黄金也合消。头上笠。腰下包。清风明月杖头挑。即日离东林。众传至照觉。觉大喜。曰。衲子参究若此。善不可加。令人迹其所往。竟无知者大慧武库谓证悟颙语。非也
  ref: X80n1565_p0675b01（五灯会元）
