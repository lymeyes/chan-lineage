id: 太原海湖禅师
name: 太原海湖
school: 青原系
teacher: 夹山善会禅师
status: draft
bio: 因有人请灌顶三藏供养。敷坐讫。师乃就彼位坐。时有云涉座主问曰。和尚甚么年行道。师曰。座主近前来。涉近前。师曰。祇如㤭陈如是甚么年行道。涉茫然。师喝曰。这尿床鬼
sayings:
- text: 问。和尚院内人何太少。定水院人何太多。师曰。草深多野鹿。岩高獬豸稀
  ref: X80n1565_p0206b05（五灯会元）
- text: 问。如何是无问而自答。师曰。松韵琴声响
  ref: X80n1565_p0206b05（五灯会元）
