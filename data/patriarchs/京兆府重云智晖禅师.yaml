id: 京兆府重云智晖禅师
name: 京兆府重云智晖
school: 曹洞宗
teacher: 白水仁
status: draft
bio: 咸秦高氏子。总角之岁。好游佛宇。誓志出家。父母不能止。礼圭峰温禅师。剃度后谒白水。独领微言。潜通秘键。寻回洛卜于中滩。创温室院。常施水给药为事。有比丘患白癞。众恶之。唯师与之摩洗如常。俄有神光异香。既而讶之。遂失所在。遗疮痂。馨香酷烈。遂聚而塑观音像以藏之。师后忽欲归终南圭峰旧居。一日闲步岩岫间。如常寝处。焂睹摩衲数珠。铜瓶棕笠。触之即坏。谓侍者曰。此吾前身道具耳。就兹建寺。以酬宿因。当薙草间。有祥云蔽日。屯于峰顶。久而不散。因目为重云山。猛兽皆自引去。及塞龙潭以通径。龙亦他徙。后唐明宗赐额曰长兴。学侣臻萃
sayings:
- text: 上堂。僧问。如何是归根得旨。师曰。早是忘却。不忆尘生。曰。如何是随照失宗。师曰。家遭劫贼
  ref: X80n1565_p0508a08（五灯会元）
- text: 问。不忆尘生。如何是进身一路。师曰。足下已生草。前程万丈坑
  ref: X80n1565_p0508a08（五灯会元）
- text: 问。要路坦然。如何践履。师曰。我若指汝。则东西南北去也
  ref: X80n1565_p0508a08（五灯会元）
- text: 问。如何是重云秤。师曰。任将天下勘
  ref: X80n1565_p0508a08（五灯会元）
- text: 问。如何是截铁之言。师曰。宁死不犯
  ref: X80n1565_p0508a08（五灯会元）
- text: 问。如何是迦叶亲闻底事。师曰。重云记不得
  ref: X80n1565_p0508a08（五灯会元）
- text: 问。如何是重云境。师曰。四时花蔟蔟。三冬异草青。师阐法四十余年。节度使王彦超微时常从师游。欲为沙门。师熟视曰。汝世缘深。当为我家垣墙。王公后果镇永兴。申弟子礼。师将顺世。先与王公言别。嘱护法门。王公泣曰。师忍弃弟子乎。师笑曰。借千年亦一别耳。及归。书偈
  ref: X80n1565_p0508a08（五灯会元）
- text: 示众曰。我有一间舍。父母为修盖。住来八十年。近来觉损坏。早拟移别处。事涉有憎爱。待他摧毁时。彼此无妨碍。乃跏趺而逝。塔于本山
  ref: X80n1565_p0508a08（五灯会元）
