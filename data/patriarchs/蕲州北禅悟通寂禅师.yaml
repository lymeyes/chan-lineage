id: 蕲州北禅悟通寂禅师
name: 蕲州北禅悟通寂
school: 云门宗
teacher: 云门文偃禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0572a09。
sayings:
- text: 上堂。拈拄杖曰。过去．未来．现在三世诸佛微尘菩萨。一时在拄杖头上转大法轮。尽向诸人鼻孔里过。还见么。若见。与我拈将来。若不见。大似立地死汉。良久曰。风恬浪静。不如归堂。问僧。甚处来。曰。黄州。师曰。夏在甚处。曰。资福。师曰。福将何资。曰。两重公案。师曰。争奈在北禅手里。曰。在手里即收取。师便打。僧不甘。师随后趁出
  ref: X80n1565_p0572a09（五灯会元）
- text: 问。如何是佛。师曰。对面千里
  ref: X80n1565_p0572a09（五灯会元）
