id: 临安府崇觉空禅师
name: 临安府崇觉空
school: 黄龙派
teacher: 死心悟新禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0692b15。
sayings:
- text: 上堂。十方无壁落。四面亦无门。净裸裸。赤洒洒。没可把。遂举拂子曰。灌溪老汉向十字街头。逞风流。卖惺惺。道我解穿真珠。解玉版。㳡乱丝。卷筒绢。淫坊酒肆。瓦合舆台。虎穴魔宫。那咤忿怒。遇文王兴礼乐。逢桀纣逞干戈。今日被崇觉󳬇见。一场懡㦬。师颂野狐话曰。含血噀人。先污其口。百丈野狐。失头狂走。蓦地唤回。打个筋斗
  ref: X80n1565_p0692b15（五灯会元）
