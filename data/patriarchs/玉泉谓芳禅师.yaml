sayings:
- text: 僧问。从上诸圣以何法示人。师拈起拄杖。僧曰。学人不会。师曰。两手分付。僧拟议。师便打宿州定林惠琛禅师
  ref: T51n2077_p0520b08（续传灯录）
- text: 僧问。如何是道。师曰。只在目前。僧曰。为甚么不见。师曰。瞎
  ref: T51n2077_p0520b08（续传灯录）
