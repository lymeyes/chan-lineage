bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0329a11。
sayings:
- text: 僧问。人人尽有佛性。如何是和尚佛性。师曰。汝唤甚么作佛性。曰。恁么则和尚无佛性也。师乃叫。快活。快活
  ref: X80n1565_p0329a11（五灯会元）
