id: 新州延长山和尚
name: 新州延长山
school: 云门宗
teacher: 云门文偃禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0576a17。
sayings:
- text: 僧问。如何是和尚家风。师曰。丑拙不可当。曰。客来如何祇待。师曰。瓦碗竹箸
  ref: X80n1565_p0576a17（五灯会元）
- text: 问。从上古圣向甚么处去。师曰。不在山间。即居树下。曰。未审成得个甚么。师曰。汝还知落处么。僧无语。师便打
  ref: X80n1565_p0576a17（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0576a17），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
