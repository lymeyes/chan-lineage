id: 泉州东禅和尚
name: 泉州东禅
school: —
teacher: 雪峰义存禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0267b02。
sayings:
- text: 僧问。人王迎请。法王出世。如何提唱宗乘。即得不谬于祖风。师曰。还奈得么。曰。若不下水。焉知有鱼。师曰。莫闲言语
  ref: X80n1565_p0267b02（五灯会元）
- text: 问。如何是佛法最亲切处。师曰。过也
  ref: X80n1565_p0267b02（五灯会元）
- text: 问。学人末后来。请师最先句。师曰。甚处去来
  ref: X80n1565_p0267b02（五灯会元）
- text: 问。如何是学人己分事。师曰。苦
  ref: X80n1565_p0267b02（五灯会元）
- text: 问。如何是佛法大意。师曰。幸自可怜生。刚要异乡邑
  ref: X80n1565_p0267b02（五灯会元）
