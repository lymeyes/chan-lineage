bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0551b13。
sayings:
- text: 上堂。举。僧问同安。如何是和尚家风。同安曰。金鸡抱子归霄汉。玉兔怀胎入紫微。曰。忽遇客来。将何祇待。同安曰。金果早朝猿摘去。玉华晚后凤衔来。师曰。广福即不然。有问如何是和尚家风。祇向他道。翠竹丛边歌欸乃。碧岩深处卧烟萝。忽遇客来。将何祇待。没底篮儿盛皓月。无心碗子贮清风。五灯会元灯会元云门宗云门宗青原下六世青原下六世
  ref: X80n1565_p0551b13（五灯会元）
