id: 京兆府蚬子和尚
name: 京兆府蚬子
school: 曹洞宗
teacher: 洞山良价禅师
status: draft
bio: 不知何许人也。事迹颇异。居无定所。自印心于洞山。混俗闽川。不畜道具。不循律仪。冬夏唯披一衲。逐日沿江岸采掇𫚥蚬。以充其腹。暮即宿东山白马庙纸钱中。居民目为蚬子和尚。华严静禅师闻之。欲决真假。先潜入纸钱中。深夜师归。严把住曰。如何是祖师西来意。师遽答曰。神前酒台盘。严放手曰。不虗与我同根生。严后赴庄宗诏入长安。师亦先至。每日歌唱自拍。或乃佯狂泥雪。去来俱无踪迹。厥后不知所终
