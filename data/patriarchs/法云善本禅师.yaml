id: 法云善本禅师
name: 法云善本
alias: 法云本
school: 云门宗
teacher: 慧林本禅师
status: draft
bio: 姓董氏其先家于太康仲舒村。师之父祖皆官颕遂为颕州人母初无子祷于佛像前。誓曰得子必以事佛。及生师骨相秀异方晬而孤。既长博学操履清修。然无仕官意。遂辟谷学道。家贫隐于笔工。气刚不屈终日沉默。嘉祐八年至京师籍名显圣地藏院。试所习为大僧。其师圆成律师惠楫者语人云。本他日当是海内名。因使听习毘尼随喜法华。夜梦童子如世所画善财者合掌道而南。既觉曰。诸圣加被我矣。其欲我南询诸友乎。时圆照禅师道振吴中。师造姑苏谒之于瑞光默契宗旨。服勤五年尽得其要。其整顿提撕之纲研练差别之智。纵横卷舒度越前规。一时流辈无出其右。圆照倚之以大其家。元丰七年春绝九江游淮山遍礼祖塔。眷浮山岩丛之胜有终焉之志。遂居大寂岩。久之出世于婺州双林。浙东道俗追崇至。谓傅大士复生。移住钱塘浮慈继圆照之后。食堂日千余口仰给于檀施。以师法名与圆照同下字。时号圆照为大本。以师为小本焉。神宗闻其名　诏住京师法云寺。赐号大通禅师。又继圜通秀之后。师玉立孤峻俨临清众。如万山环天柱让其高寒。然精麄与众共。未尝以言狗物以色假人。王公贵人施舍日填门。厦屋万础涂金缕碧。如地涌宝坊。凡八年请于朝。愿归老于西湖之上。诏可。遂东还庵于龙山崇德。师凡三住大刹。道化尘俗缁素蚁慕。尝
sayings:
- text: 示众曰。上士听法以神。中士听法以心。下士听法以耳。且道更有一人来将什么听。乃拈拄杖卓禅床一下曰。高也著低也著。落落圆音遍寥廓。十方内外更无他。不用无绳而自缚。又曰。案山说法主山听。主山说法案山听。案山主山一时说。且道将什么听。诸人若也善听。三世诸佛所说妙法皆悉现前。还有么。铁锤无孔犹间事。笑杀毘耶老古锥。又曰。衲僧见处逆顺难该。翛然独往应物还来。或高栖于世表。或抗迹于尘埃。把定则冰生水面。放行则锦上花开。卢老不知何处去。白云影里笑咍咍。喝一喝下座。又曰。花心未放柳眼初开。雁回呜咽之声。水泻潺湲之响。森罗举唱法尔。常规更言缚脱同源。大似龙头蛇尾。又
  ref: T51n2077_p0555a28（续传灯录）
- text: 上堂良久曰。会么。祖佛妙旨只在目前。慧日峰。前云生足下。湖澄浪阔迥接遥天。晚唱渔舟。夜泛蒹葭之月欢游画舫。时闻丝竹之音。更说闻声悟道见色明心。大似抛却甜桃树寻山摘醋梨。下座。师住庵杜门却扫与世相忘者又十年。独与衲子思慧。居士大夫想其高风愿见而不可得。大观三年十二月甲子屈三指。谓左右。曰。止有三日。已而果殁。有异禽翔鸣于庭而去。塔全身于上方。师平居作止直视不瞬。临众三十年未尝笑。及间居时抵掌笑语。或问其故。师曰。不庄敬无以莅众。吾昔为丛林故强行之。非性实然也。所至见画佛菩萨行立之像不敢坐。伊蒲塞馔以鱼胾名者皆不食。其真诚敬事防心离过类如此。及其升堂演唱。则左右顾如象王旋回。学者多因此悟入。其将终之夕。越僧数人梦师归兜率天云。投子修颙禅师舒州投子证悟修颙禅师。姓梁氏晋州赵城人。幼不拜神祠不受书训。常曰。当为人天师安慕此耶。遂游诸方。造苏州瑞光圆照禅师法席参扣宗旨。因举。无著问天亲。弥勒说什么法。云说这个法。忽如有省晨夕参叩。一日因登溷捺倒打破水瓶有省。作颂曰。这一交这一交。万两黄金也合消。头上笠腰下包。清风明月杖头挑。于是名声蔼然。遂出世说法。初住寿州资寿。历迁数大刹。住西京少林迁招提。又迁舒州投子。道誉愈播。丛林同号。曰颙华严。升堂。有僧才出。师曰错。云什么处是错。师曰。不信道。问是法平等无有高下。为甚么赵州三等接人。师曰。入水见长人。云争奈学人未会。师曰。唤不回头争奈何。问如何是祖祖相传底心。师曰。三星绕月宫。云便恁么去时如何。师曰。伯乐暂垂鞭驽骀夸八骏。问如何是第一义。师曰。百杂碎。乃曰。楞伽峰顶谁能措足。少室岩前水泄不通。正当恁么时黄头老子张得口。碧眼胡僧开得眼。虽然如是事无一向。先圣幸有第二义门。足可共诸人东说西话。所以道。春生夏长秋落冬枯。四时迁改轮转长途。愚者心生彼此。达者一味无殊。良久曰。陕府铁牛吞大像。嘉州佛向藕丝藏。又曰。春风鸣古木。晓雾锁寒波。头头皆显露。显露亦殽讹。看看直下是怎。奈何明眼汉没臼窠。吐不得嚼不破。喝一喝下座。又曰。巍巍少室永镇群峰。有时云中捧出。有时雾罩无踪。有时突在目前。有口道不得。被人唤作壁观胡僧。诸仁者。作么生免得此过。休休不如且持课。良久曰。一元和二弥陀三释迦。自余是什么椀脱丘参。又曰。露滴庭莎风鸣古桧。皓月泻千峰寒色。清淮流万顷波涛。于此荐得与诸人截断众流。若也未然不免随波逐浪。譬如河中水。湍流竞奔逝。各各不相知。诸法亦如是。遂拈拄杖曰。拄杖子是诸法是相知不相知。若相知早被知缚。若不相知凭何指注。卓一下曰。知之一字众妙之门。复曰。错下座。富郑公素慕宗风。初于少林见之值升座。以目左右顾视大众。公因有省。及晚年致政居洛。重师道渴思扣
  ref: T51n2077_p0555a28（续传灯录）
- text: 问。遂请住招提。伺师入境躬出迓之。临登车司马温公适至
  ref: T51n2077_p0555a28（续传灯录）
- text: 问。相公何往。郑公云。接新招提颙禅师。温公云。某亦同去。于是联镳出郭候于邮亭。久之忽见数十夫荷担问之。荷担者应云。招提和尚行李。温公遂索马先归。郑公云。要见华严何故先返。温公云。已见他了遂先还。公独候之。既至益加敬重。因迎居后苑晨夕参叩。富公每有谈论。师辄以为非。而公说理未已。师一日谓富公曰。待得山僧竖点头即是也。自是公有所言。师辄摇首未曾有所答。忽一日中夜公忽省彻遽往叩门。师已闭关而寝。闻其声即呼曰。相公且喜大事了毕。夜深更不启关晨朝相见。至晓往见之。师遥见公来。未交一谈已点头矣。富公喜甚。时圜照方奉诏住慧林。公以诗寄谢曰。因见颙师悟入深。夤缘传得老师心。东南谩说江山远。目对灵光与妙音
