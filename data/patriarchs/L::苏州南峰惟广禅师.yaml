bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0444b13。
sayings:
- text: 上堂。一问一答。如钟含响。似谷应声。葢为事不获已。且于建化门中。放一线道。若据衲僧门下。天地悬殊。且道衲僧有甚么长处。良久曰。尽日觅不得。有时还自来。咄
  ref: X80n1565_p0444b13（五灯会元）
