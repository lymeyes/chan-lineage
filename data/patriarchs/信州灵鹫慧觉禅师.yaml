bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0666b12。
sayings:
- text: 上堂。大众。百千三昧．无量妙义。尽在诸人脚跟下。各请自家回互取。会么。回互不回互。认取归家路。智慧为桥梁。柔和作依怙。居安则虑危。在乐须知苦。君不见。庞居士。黄金抛却如粪土。父子团𪢮头。共说无生语。无生语。仍记取。九夏雪华飞。三冬汗如雨。黄檗积翠永庵主黄檗积翠永庵主
  ref: X80n1565_p0666b12（五灯会元）
- text: 示众。山僧住庵来。无禅可说。无法可传。亦无羞珍异宝。祇收得续火柴头一个。留与后人。令他烟焰不绝。火光长明。遂掷下拂子。时有僧就地拈起。吹一吹。师便喝曰。谁知续火柴头。从这汉边烟消火灭去。乃拂袖归庵。僧吐舌而去。庐山归宗志芝庵主庐山归宗志芝庵主临江人也。壮为苾𫇴。依黄龙于归宗。遂领深旨。有偈曰。未到应须到。到了令人笑。眉毛本无用。无渠底波俏。未几。龙引退。芝陆沈于众。一日普请罢。书偈曰。茶芽蔍蔌初离焙。笋角狼忙又吐泥。山舍一年春事办。得闲谁管板头低。由是衲子亲之。师不怿。结茆绝顶。作偈曰。千峰顶上一间屋。老僧半间云半间。昨夜云随风雨去。到头不似老僧闲。南岳下十三世上南岳下十三世上
  ref: X80n1565_p0666b12（五灯会元）
