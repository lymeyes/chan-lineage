id: 石门绍远禅师
name: 石门绍远
alias: 石门远
school: 曹洞宗
teacher: 石门彻禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0520a15。
sayings:
- text: 问。如何是田头水牯牛。师曰。角转轰天地。朝阳处处春。他日门又
  ref: X80n1565_p0520a15（五灯会元）
- text: 问。水牯牛安乐否。师曰。水草不曾亏。曰。田中事作么生。师曰。深耕浅种。曰。如法著。师曰。某甲不曾取次。住后
  ref: X80n1565_p0520a15（五灯会元）
- text: 僧问。师唱谁家曲。宗风嗣阿谁。师曰。十方无异路。揭觉凤林前
  ref: X80n1565_p0520a15（五灯会元）
- text: 问。先师已归雁塔去。当阳一句请师宣。师曰。修罗掌内擎日月。夜叉足下蹋泥龙
  ref: X80n1565_p0520a15（五灯会元）
- text: 问。金龙不吐凡间雾。请
  ref: X80n1565_p0520a15（五灯会元）
- text: 师举唱凤凰机。师曰。白眉不展手。长安路坦平
  ref: X80n1565_p0520a15（五灯会元）
- text: 问。如何是西来意。师曰。布袋盛乌龟
  ref: X80n1565_p0520a15（五灯会元）
- text: 问。如何是石门境。师曰。孤峰对凤岭。曰。如何是境中人。师曰。岩中残雪。处处分辉
  ref: X80n1565_p0520a15（五灯会元）
- text: 问。如何是和尚密作用。师曰。滴沥非旨趣。千山不露身
  ref: X80n1565_p0520a15（五灯会元）
- text: 问。四方八面来时如何。师曰。赤脚波斯鼻嗅天
  ref: X80n1565_p0520a15（五灯会元）
- text: 问。亡僧迁化向甚么处去。师曰。灰飞烟灭。白骨连天。师与病僧灸次
  ref: X80n1565_p0520a15（五灯会元）
- text: 僧问。正当与么时如何。师曰。通玄一脉。大似流星
  ref: X80n1565_p0520a15（五灯会元）
- text: 问。如何是古佛心。师曰。白牛露地卧青谿
  ref: X80n1565_p0520a15（五灯会元）
- text: 问。生死之河。如何过得。师曰。风吹荷叶浮萍草
  ref: X80n1565_p0520a15（五灯会元）
- text: 问。如何是教外别传一句。师曰。羊头车子入长安
  ref: X80n1565_p0520a15（五灯会元）
- text: 问。生死浪前如何话道。师曰。毛袋横身绝饮󲣅。青谿常卧太阳春
  ref: X80n1565_p0520a15（五灯会元）
- text: 问。如何是道。师曰。山深水冷。曰。如何是道中人。师曰。金槌击金鼓
  ref: X80n1565_p0520a15（五灯会元）
- text: 问。天阴日不出。光辉何处去。师曰。铁蛇横大路。通身黑似烟
  ref: X80n1565_p0520a15（五灯会元）
- text: 问。如何是宗乘中一句。师曰。石火夜烧山。大地齐合掌
  ref: X80n1565_p0520a15（五灯会元）
- text: 问。如何是祖师西来意。师曰。石牛拦古路。木马骤高楼
  ref: X80n1565_p0520a15（五灯会元）
