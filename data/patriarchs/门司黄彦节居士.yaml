id: 门司黄彦节居士
name: 门司黄彦节
school: 杨岐派
teacher: 大慧宗杲禅师
status: draft
bio: 字节夫。号妙德。于大慧一喝下。疑情顿脱。慧以衣付之。尝举首山竹篦话。至叶县。近前夺得拗折。掷向堦下曰。是甚么。山曰。瞎。公曰。妙德到这里。百色无能。但记得曾作蜡梅绝句曰。拟嚼枝头蜡。惊香却肖兰。前村深雪里。莫作岭梅看。秦国夫人计氏法真秦国夫人计氏法真自寡处屏去纷华。常蔬食。习有为法。因大慧遣谦禅者致问其子魏公。公留。谦以祖道诱之。真一日问谦曰。径山和尚寻常如何为人。谦曰。和尚祇教人看狗子无佛性及竹篦子话。祇是不得下语。不得思量。不得向举起处会。不得向开口处承当。狗子还有佛性也无。无。祇恁么教人看。真遂谛信。于是夜坐。力究前话。忽尔洞然无滞。谦辞归。真亲书入道槩略。作数偈呈慧。其后曰。逐日看经文。如逢旧识人。莫言频有碍。一举一回新
