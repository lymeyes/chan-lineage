id: 洪州百丈惟政禅师
name: 洪州百丈惟政
school: —
teacher: 石霜圆
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0444a12。
sayings:
- text: 上堂。岩头和尚用三文钱索得个妻。祇解捞𫚥摝蚬。要且不解生男育女。直至如今。门风断绝。大众要识奯公妻么。百丈今日不惜唇吻。与你诸人注破。蓬𩯭荆钗世所稀。布裙犹是嫁时衣
  ref: X80n1565_p0444a12（五灯会元）
- text: 僧问。牛头未见四祖时。为甚么百鸟衔花献。师曰。有钱千里通。曰。见后为甚么不衔花。师曰。无钱隔壁聋
  ref: X80n1565_p0444a12（五灯会元）
- text: 问。达磨未来时如何。师曰。六六三十六。曰。来后如何。师曰。九九八十一
  ref: X80n1565_p0444a12（五灯会元）
- text: 问。如何是祖师西来意。师曰。木耳树头生
  ref: X80n1565_p0444a12（五灯会元）
- text: 问。一切法是佛法。意旨如何。师曰。一重山下一重人
  ref: X80n1565_p0444a12（五灯会元）
- text: 问。上行下敩。未是作家。背楚投吴。方为达士。岂不是和尚语。师曰。是。曰。父财子用也。师曰。汝试用看。僧拟议。师便打
  ref: X80n1565_p0444a12（五灯会元）
- text: 上堂。天台普请。人人知有。南岳游山。又作么生。会则灯笼笑你。不会有眼如盲
  ref: X80n1565_p0444a12（五灯会元）
