id: 香林远禅师
name: 香林澄远
honorific: 青城香林澄远禅师（云门文偃法嗣）
school: 云门宗
dynasty: 五代北宋
region: 益州青城香林院（今四川都江堰）
teacher: 云门文偃
source_ref: 五灯会元·卷十五·青城香林澄远 / 景德传灯录·卷二十二
cbeta: T51n2076 卷二十二
bio: 云门文偃之法嗣，云门宗第二代。久参云门，得「函盖乾坤、截断众流、随波逐浪」之髓。住青城香林院，枯坐二十年，道业纯熟。门下智门光祚，光祚传雪窦重显，云门宗风赖以弘传。
sayings:
- text: 僧问「如何是祖师西来意」，师云「坐久成劳」。（示「如是体究，不涉言诠」）
  ref: 五灯会元·卷十五·香林澄远
- text: 师谓人曰「老僧四十年方打成一片」。（形容功夫纯熟、动静一如）
  ref: 五灯会元·卷十五·香林澄远
status: draft
