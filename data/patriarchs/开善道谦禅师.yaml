id: 开善道谦禅师
name: 开善道谦
alias: 开善谦
school: 杨岐派
teacher: 大慧宗杲禅师
status: draft
bio: 本郡人。初之京师依圆悟无所省发。后随妙喜庵居泉南。及喜领径山。师亦侍行。未几令师往长沙通紫岩居士张公书。师自谓。我参禅二十年无入头处。更作此行决定荒废。意欲无行。友人宗元者叱曰。不可在路便参禅不得也去。吾与汝俱往。师不得已而行。在路泣语元曰。我一生参禅业无得力处。今又途路奔波。如何得相应去。元告之曰。尔但将诸方参得底悟得底圆悟妙喜为尔说得底。都不要理会。途中可替底事。我尽替尔。只有五件事替尔不得。尔须自家支当。师曰。五件者何事愿闻其要。元曰。著衣吃饭屙屎放尿驼个死尸路上行。师于言下领旨不觉手舞足蹈。元曰。尔此回方可通书宜前进。吾先归矣。元即回径山。师半载方返。妙喜一见而喜曰。建州子尔这回别也。住后
sayings:
- text: 上堂。竺土大仙心。东西密相付。如何是密相付底心。良久曰。八月秋何处热
  ref: T51n2077_p0688b24（续传灯录）
- text: 上堂。壁立千仞三世诸佛措足无门。是则是。太杀不近人情。放一线道十方刹海放光动地。是则是。争奈和泥合水。须知通一线道处壁立千仞。壁立千仞处通一线道。横拈倒用正接傍提。电激雷奔崖颓石裂。是则是。犹落化门。到这里壁立千仞也没交涉。通一线道也没交涉。不近人情和泥合水。总没交涉。只这没交涉也则没交涉。是则是。又无佛法道理。若也出得这四路头。管取乾坤独步。且独步一句作么生道。莫怪从前多意气。他家曾踏上头关
  ref: T51n2077_p0688b24（续传灯录）
- text: 上堂。去年也有个六月十五。今年也有个六月十五。去年六月十五少却今年六月十五。今年六月十五多却去年六月十五。多处不用减少处不用添。既不用添又不用减。则多处多用小处少用。乃喝一喝曰。是多是少。良久曰。个中消息子。能有几人知
  ref: T51n2077_p0688b24（续传灯录）
- text: 上堂。洞山麻三斤将去。无星秤子上定过。每一斤恰有一十六两。二百钱重更不少一牦。正与赵州殿里底一般。只不合被大愚锯解秤锤。却教人理会不得。如今若要理会得。但问取云门干屎橛
  ref: T51n2077_p0688b24（续传灯录）
- text: 上堂。有句无句如藤倚树。撞倒灯笼打破露柱。佛殿奔忙僧堂回顾。子细看来是甚家具咄。只堪打老鼠
  ref: T51n2077_p0688b24（续传灯录）
- text: 上堂。诸人从僧堂里恁么上来。少间从法堂头恁么下去。并不曾差了一步因甚么却不会。良久曰。只为分明极。翻令所得迟
  ref: T51n2077_p0688b24（续传灯录）
