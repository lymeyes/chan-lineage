bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0311a02。
sayings:
- text: 僧问。如何是伽蓝。师曰。没幡帧。曰。如何是伽蓝中人。师曰。瞻礼有分
  ref: X80n1565_p0311a02（五灯会元）
- text: 问。下堂一句。请师不吝。师曰。闲吟唯忆庞居士。天上人间不可陪
  ref: X80n1565_p0311a02（五灯会元）
