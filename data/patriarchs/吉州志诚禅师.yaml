id: 吉州志诚禅师
name: 吉州志诚
school: —
teacher: 六祖大鉴旁出
status: draft
bio: 本州太和人也。初参秀禅师。后因两宗盛化。秀之徒众往往讥南宗曰。能大师不识一字。有何所长。秀曰。他得无师之智。深悟上乘。吾不如也。且吾师五祖亲付衣法。岂徒然哉。吾所恨不能远去亲近。虗受国恩。汝等诸人无滞于此。可往曹谿质疑。他日回。当为吾说。师闻此语。礼辞至韶阳。随众参请。不言来处。时六祖告众曰。今有盗法之人。潜在此会。师出礼拜。具陈其事。祖曰。汝师若为
sayings:
- text: 示众。师曰。尝指诲大众。令住心观静。长坐不卧。祖曰。住心观静。是病非禅。长坐拘身。于理何益。听吾偈曰。生来坐不卧。死去卧不坐。一具臭骨头。何为立功过。师曰。未审和尚以何法诲人。祖曰。吾若言有法与人。即为诳汝。但且随方解缚。假名三昧。听吾偈曰。心地无非自性戒。心地无痴自性慧心地无乱自性定。不增不减自金刚。身去身来本三昧。师闻偈悔谢。即誓依归。乃呈偈曰。五蕴幻身。幻何究竟。回趣真如。法还不净
