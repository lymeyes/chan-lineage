id: 蕲州四祖山法演禅师
name: 蕲州四祖山法演
school: 黄龙派
teacher: 黄龙南
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0665b05。
sayings:
- text: 僧问。如何是心相。师曰。山河大地。曰。如何是心体。师曰。汝唤甚么作山河大地
  ref: X80n1565_p0665b05（五灯会元）
- text: 上堂。叶辞柯。秋已暮。参玄人。须警悟。莫谓来年更有春。等闲蹉了岩前路。且道作么生是岩前路。良久曰。崄
  ref: X80n1565_p0665b05（五灯会元）
- text: 上堂。主山吞却案山。寻常言论。拄杖子普该尘刹。未足为奇。光境两亡。复是何物。良久曰。劫火洞然毫末尽。青山依旧白云中
  ref: X80n1565_p0665b05（五灯会元）
- text: 上堂。佛祖之道。壁立千仞。拟议驰求。还同点额。识不能识。智不能知。古圣到这里。垂一言半句。要你诸人有个入处。所以道。低头不见地。仰面不见天。欲识白牛处。但看髑髅前。如今头上是屋。脚下是地。面前是佛殿。且道白牛在甚么处。乃召大众。众举头。师叱之
  ref: X80n1565_p0665b05（五灯会元）
