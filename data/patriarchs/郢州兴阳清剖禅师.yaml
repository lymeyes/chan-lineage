id: 郢州兴阳清剖禅师
name: 郢州兴阳清剖
school: 法眼宗
teacher: 大阳玄
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0526a08。
sayings:
- text: 问。甜瓜何时得熟。师曰。即今熟烂了也。曰。拣甜底摘来。师曰。与甚么人吃。曰。不入园者。师曰。未审不入园者还吃也无。曰。汝还识伊么。师曰。虽然不识。不得不与。阳笑而去。住后
  ref: X80n1565_p0526a08（五灯会元）
- text: 上堂。西来大道。理绝百非。句里投机。全乖妙旨。不已而已。有屈祖宗。岂况忉忉。有何所益。虽然如是。事无一向。且于唱教门中。通一线道。大家商量
  ref: X80n1565_p0526a08（五灯会元）
- text: 僧问。娑竭出海乾坤震。觌面相呈事若何。师曰。金翅鸟王当宇宙。个中谁是出头人。曰。忽遇出头时又作么生。师曰。似鹘提鸠君不信。髑髅前验始知真。曰。恁么则叉手当𮌎。退身三步也。师曰。须弥座下乌龟子。莫待重遭点额回
  ref: X80n1565_p0526a08（五灯会元）
- text: 问。从上诸圣向甚么处去。师曰。月照千江静。孤灯海底明。郑金部
  ref: X80n1565_p0526a08（五灯会元）
- text: 问。和尚甚么时开堂。师曰。不历僧祇数。日月未生前。师卧疾次。大阳
  ref: X80n1565_p0526a08（五灯会元）
- text: 问。是身如泡幻。泡幻中成办。若无个泡幻。大事无由办。若要大事办。识取个泡幻。作么生。师曰。犹是这边事。阳曰。那边事作么生。师曰。匝地红轮秀。海底不栽花。阳笑曰。乃尔惺惺邪。师喝曰。将谓我忘却。竟尔趋寂
  ref: X80n1565_p0526a08（五灯会元）
