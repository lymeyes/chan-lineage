id: 随州智门迥罕禅师
name: 随州智门迥罕
school: 临济宗
teacher: 首山省念禅师
status: draft
bio: 为北塔僧使点茶次。师起揖曰。僧使近上坐。使曰。鹞子头上。争敢安巢。师曰。棒上不成龙。随后打一坐具。使茶罢。起曰。适来却成触忤和尚。师曰。江南杜禅客。觅甚么第二碗。襄州鹿门慧昭山主襄州鹿门慧昭山主杨亿侍郎问曰。入山不畏虎。当路却防人时如何。僧曰。君子坦荡荡
sayings:
- text: 僧问。如何是鹿门山。师曰。石头大底大。小底小。曰。如何是山中人。师曰。横眠竖卧
  ref: X80n1565_p0422a01（五灯会元）
