id: 饶州荐福道英禅师
name: 饶州荐福道英
school: 黄龙派
teacher: 开元琦
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0687b14。
sayings:
- text: 僧问。佛未出世时如何。师曰。瑠璃缾贮华。曰。出世后如何。师曰。玛瑙钵盛果。曰。未审和尚今日是同是别。师曰。趯倒缾。拽倒钵
  ref: X80n1565_p0687b14（五灯会元）
- text: 上堂。据道而论。语也不得。默也不得。直饶语默两忘。亦没交涉。何故。句中无路。意在句中。无意无不意。非计较之所及。若是劈头点一点顶门。豁然眼开者。于此却有疾速分。若低头向意根下寻思。卒摸索不著。是知万法无根。欲穷者错。一源绝迹。欲返者迷。看他古佛光明．先德风彩。一一从无欲无依中发现。或时孤峻峭󳫠。竟不可构。或时含融混会。了无所睹。终不桩定一处。亦不击系两头。无是无不是。无非无不非。得亦无所得。失亦无所失。不曾隔越纤毫。不曾移易丝发。明明古路。不属玄微。觌面擎来。瞥然便过。不居正位。岂落邪途。不蹈大方。那趋小径。腾腾兀兀。何住何为。回首不逢。触目无对。一念普观。廓然空寂。此之宗要。千圣不传。直下了知。当处超越。是知赤洒洒处。恁么即易。明历历处。恁么还难。不用沾黏点染。直须剥脱屏除。若是本分。手脚放去。无收不来底。一一放光现瑞。一一削迹绝踪。机上了不停。语中无可露。彻底搅不浑。通身扑不碎。且道毕竟是个甚么。得恁么灵通。得恁么奇特。得恁么坚确。诸仁者。休要识渠面孔。不用安渠名字。亦莫觅渠所在。何故。渠无所在。渠无名字。渠无面孔。才起一念追求如微尘许。便隔十生五生。更拟管带思惟。益见纷纷丛杂。不如长时放教。自由自在。要发便发。要住便住。即天然非天然。即如如非如如。即湛寂非湛寂。即败坏非败坏。无生恋。无死畏。无佛求。无魔怖。不与菩提会。不与烦恼俱。不受一法。不嫌一法。无在无不在。非离非不离。若能如是。见得释迦自释迦。达磨自达磨。干我甚么椀。恁么说话。衲僧门下。推勘将来。布裙芒靸。不免撩他些些泥水。岂况汝等诸人。更道这个是平实语句。这个是差别门庭。这个是关棙巴鼻。这个是道眼根尘。𮞏相教习。如七家村里传口令相似。有甚交涉。无事珍重。泉州尊胜有朋讲师泉州尊胜有朋讲师本郡蒋氏子。丱岁试经。中选下发。多历教肆。尝疏楞严．维摩等经。学者宗之。每疑祖师直指之道。故多与禅衲游。一日。谒开元。迹未及阃。心忽领悟。元出遂
  ref: X80n1565_p0687b14（五灯会元）
- text: 问。座主来作甚么。师曰。不敢贵耳贱目。元曰。老老大大。何必如是。师曰。自是者不长。元曰。朝看华严。夜读般若则不
  ref: X80n1565_p0687b14（五灯会元）
- text: 问。如何是当今一句。师曰。日轮正当午。元曰。闲言语更道来。师曰。平生仗忠信。今日任风波。然虽如是。祇如和尚恁么道有甚交涉。须要新戒草鞋穿。元曰。这里且放你过。忽遇达磨
  ref: X80n1565_p0687b14（五灯会元）
- text: 问。你作么生道。师便喝。元曰。这座主。今日见老僧气冲牛斗。师曰。再犯不容。元拊掌大笑
  ref: X80n1565_p0687b14（五灯会元）
