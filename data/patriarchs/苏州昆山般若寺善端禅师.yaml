bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0455a08。
sayings:
- text: 僧问。有生有灭。尽是常仪。无生无灭时如何。师曰。昆仑著靴空中立。曰。莫便是为人处也无。师曰。石女簪花火里眠。曰。大众证明。师曰。更看泥牛鬬入海
  ref: X80n1565_p0455a08（五灯会元）
