bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0768a06。
sayings:
- text: 上堂。趯翻生死海。踏倒涅槃岸。世上无活人。黄泉无死汉。遂拈拄杖曰。讷堂今日拄杖子有分付处。也还有承当得者么。试出来担荷看。有么有么。良久。掷拄杖。下座
  ref: X80n1565_p0768a06（五灯会元）
- text: 上堂。知有底。也吃粥吃饭。不知有底。也吃粥吃饭。如何直下验得他有之与无。是之与非。邪之与正。若验不出。参学事大远在。喝一喝。下座
  ref: X80n1565_p0768a06（五灯会元）
- text: 上堂。山僧是杨歧四世孙。这老汉有个三脚驴子弄蹄行公案。虽人人举得。祇是不知落处。山僧不惜眉毛。为诸人下个注脚。乃曰。八角磨盘空里走
  ref: X80n1565_p0768a06（五灯会元）
