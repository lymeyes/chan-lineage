bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0769a03。
sayings:
- text: 上堂。无生国里。未是安居。万仞崖头。岂容驻足。且望空撒手。直下翻身一句作么生道。人逢好事精神爽。入火真金色转鲜
  ref: X80n1565_p0769a03（五灯会元）
