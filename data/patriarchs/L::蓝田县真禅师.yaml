id: L::蓝田县真禅师
name: 蓝田县真
school: 云门宗
teacher: 般若柔
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0585a10。
sayings:
- text: 僧问。如何是大定门。师曰。拈柴择菜
  ref: X80n1565_p0585a10（五灯会元）
- text: 上堂。成山假就于始篑。修途托至于初步。上座适来从地炉边来。还与初步同别。若言同。即不会不迁。若言别。亦不会不迁。上座作么生会。还会么。这里不是那里。那里不是这里。且道是一处两处。是迁不迁。是来去不是来去。若于此显明得。便乃古今一如初终。自尔念念无常。心心永灭。所以道观方知彼去。去者不至方。上座适来恁么来。却请恁么去。参
  ref: X80n1565_p0585a10（五灯会元）
