id: 越州五峰子琪禅师
name: 越州五峰子琪
school: 云门宗
teacher: 法云本
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《续传灯录》T51n2077_p0593b15。
sayings:
- text: 僧问。学人上来乞师垂示。师曰。花开千朵秀。曰学人不会。师曰。雨后万山青。曰谢指示。师曰。尔作么生会。僧便喝。师曰。未在。僧又喝。师曰。一喝两喝后作么生。曰也知和尚有此机要。师曰。适来道甚么。僧无语。师便喝
  ref: T51n2077_p0593b15（续传灯录）
