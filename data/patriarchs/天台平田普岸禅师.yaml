id: 天台平田普岸禅师
name: 天台平田普岸
school: 南岳系
teacher: 百丈怀海禅师
status: draft
bio: 洪州人也。于百丈门下得旨。后闻天台胜槩。圣贤间出。思欲高蹈方外。远追遐躅。乃结茅薙草。宴寂林下。日居月诸。为四众所知。创平田禅院居之
sayings:
- text: 上堂。神光不昧。万古徽猷。入此门来。莫存知解。便下座。僧参。师打一拄杖。其僧近前把住拄杖。师曰。老僧适来造次。僧却打师一拄杖。师曰。作家。作家。僧礼拜。师把住曰。是阇黎造次。僧大笑。师曰。这个师僧今日大败也。临济访师。到路口先逢一嫂在田使牛。济问嫂。平田路向甚么处去。嫂打牛一棒曰。这畜生到处走。到此路也不识。济又曰。我问你平田路向甚么处去。嫂曰。这畜生五岁尚使不得。济心语曰。欲观前人。先观所使。便有抽钉拔楔之意。及见师
  ref: X80n1565_p0124b18（五灯会元）
- text: 师问。你还曾见我嫂也未。济曰。已收下了也。师遂
  ref: X80n1565_p0124b18（五灯会元）
- text: 问。近离甚处。济曰。江西黄檗。师曰。情知你见作家来。济曰。特来礼拜和尚。师曰。已相见了也。济曰。宾主之礼。合施三拜。师曰。既是宾主之礼。礼拜著。有偈
  ref: X80n1565_p0124b18（五灯会元）
- text: 示众曰。大道虗旷。常一真心。善恶莫思。神清物表。随缘饮啄。更复何为。终于本院。遗塔存焉
  ref: X80n1565_p0124b18（五灯会元）
