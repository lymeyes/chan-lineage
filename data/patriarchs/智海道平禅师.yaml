bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0459a11。
sayings:
- text: 上堂。山僧不会佛法。为人总没来由。或时半开半合。或时全放全收。还如万人丛里。冷地掉个石头。忽然打著一个。方知触处周流
  ref: X80n1565_p0459a11（五灯会元）
- text: 上堂。赵州有四门。门门通大道。玉泉有四路。路路透长安。门门通大道。毕竟谁亲到。路路透长安。分明进步看。拍膝一下曰。岁晚未归客。西风门外寒
  ref: X80n1565_p0459a11（五灯会元）
- text: 示众曰。似地擎山。不知山之孤峻。如石含玉。不知玉之无瑕。古人恁么说话。大似抱赃叫屈。智海门下。人人慷慨。生擒虎兕。活捉狞龙。眼里著得须弥山。耳里著得大海水。遂拈拄杖曰。不是向人夸伎俩。丈夫标致合如斯。卓拄杖。下座
  ref: X80n1565_p0459a11（五灯会元）
