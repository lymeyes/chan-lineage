id: 护国景元禅师
name: 护国景元
alias: 护国元
school: 杨岐派
teacher: 圆悟克勤禅师
status: draft
bio: 姓张氏。温州乐清人。始出家遍游丛林。至蒋山谒圆悟禅师。久在会中。一日因二僧阅死心录。有云。既迷时须待个悟。既悟了须识悟中迷。迷悟双忘却从迷悟处建立。一切法。师心非之。拂袖而起。行数步。忽然冥契。走告圆悟。圆悟印可。后辞圆悟。圆悟
sayings:
- text: 问。向去有人问尔作么生。师抚傍僧背曰。和尚问尔何不只对。圆悟大笑。尝语人云。我有些子禅。被元兄一布袋盛将去也。丛林因号元布袋。师道契耿龙图因请出世于处州南明
  ref: T51n2077_p0655b21（续传灯录）
- text: 示众曰。释迦不会道。达磨不会禅列祖无机关。衲僧没巴鼻。是则是作么生承当。若向这里承当得去。佛法世法打成一片。十二时中不移易一丝毫。其或未然莫守寒岩异草青。坐著白云宗不妙。又
  ref: T51n2077_p0655b21（续传灯录）
- text: 示众举拂子曰。大众还见么。击碎银山铁壁。掀翻虎穴魔宫。截断佛祖机关。拂尽诸方路布。直得德山却步临济吞声。天下衲僧不敢喘气。纵饶睦州亲自入门。顶𩕳也还一札。且道连云节角在什么处。还知么。若到诸方切忌错选。又曰。野犴鸣师子吼。开得眼张得口。动南星蹉北斗。大众还知落处么。金刚堦下蹲神龟火里走
  ref: T51n2077_p0655b21（续传灯录）
- text: 僧问。如何是临济宗。师曰。杀人不眨眼。云如何是云门宗。师曰。顶门三眼曜乾坤。云如何是沩仰宗。师曰。推不向前约不向后。云如何是法眼宗。师曰。箭锋相敌不相饶。云如何是曹洞宗。师曰。手执夜明符几个知天晓。师居南明几二年。厌于将迎。一日举感铁面颂云。院是大宋国里院。州是大宋国里州。州中有院不容住。何妨一钵五湖游
  ref: T51n2077_p0655b21（续传灯录）
- text: 师举了曰。是则是去住自由。忒杀露风骨。因作颂曰。休休休夕阳西去水东流。惟有仰山云势远。抟风千万过南州。后住台州护国示寂于木山
  ref: T51n2077_p0655b21（续传灯录）
