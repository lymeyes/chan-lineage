id: L::东京慧林常悟禅师
name: 东京慧林常悟
school: 云门宗
teacher: 法云本
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0639a03。
sayings:
- text: 僧问。若不传法度众生。举世无由报恩者。未审传个甚么法。师曰。开宗明义章第一
  ref: X80n1565_p0639a03（五灯会元）
- text: 问。达磨未来时如何。师曰。省得草鞋钱。曰。来后如何。师曰。重叠关山路
  ref: X80n1565_p0639a03（五灯会元）
