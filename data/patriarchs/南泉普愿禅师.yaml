id: 南泉普愿禅师
name: 南泉普愿
honorific: 池州南泉普愿禅师（马祖道一法嗣）
school: 南岳系
dynasty: 唐（748—834）
region: 池州南泉山（今安徽贵池）
teacher: 马祖道一禅师
source_ref: 五灯会元·卷四·池州南泉普愿 / 景德传灯录·卷八
cbeta: T51n2076 卷八
bio: 马祖道一之法嗣，与百丈怀海、西堂智藏并称「马祖门下三大士」。初习相部律、南山律，后参马祖，闻「平常心是道」而悟。隐南泉山三十年，锄荒种松，道声远播。赵州从谂、长沙景岑等出其门。南泉以机锋峻捷、不假借人著称，「南泉斩猫」「南泉不是婆婆心」等公案流布极广。
sayings:
- text: 南泉斩猫：因东西两堂争猫，师提起猫云「道得即不斩」，众无对，遂斩之；赵州自外归，师举前话，赵州脱草鞋顶头而出，师曰「子若在，即救得猫儿」。
  ref: 五灯会元·卷四·南泉普愿 / 赵州从谂
- text: 示赵州「平常心是道」：师云「道不属知、不属不知；知是妄觉，不知是无记。若真达不疑之道，犹如太虚，廓然荡豁，岂可强是非邪？」
  ref: 五灯会元·卷四·南泉普愿
