id: 漳州保福本权禅师
name: 漳州保福本权
school: 黄龙派
teacher: 黄龙祖心禅师
status: draft
bio: 临漳人也。性质直而勇于道。乃于晦堂举拳处彻证根源。机辩捷出。黄山谷初有所入。问晦堂。此中谁可与语。堂曰。漳州权。师方督役开田。山谷同晦堂往。致问曰。直岁还知露柱生儿么。师曰。是男是女。黄拟议。师挥之。堂谓曰。不得无礼。师曰。这木头。不打更待何时。黄大笑
sayings:
- text: 上堂。举寒山偈曰。吾心似秋月。碧潭清皎洁。无物堪比伦。教我如何说。老僧即不然。吾心似灯笼。点火内外红。有物堪比伦。来朝日出东。传者以为笑。死心和尚见之。叹曰。权兄提唱若此。诚不负先师所付嘱也
