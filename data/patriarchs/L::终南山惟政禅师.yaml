id: L::终南山惟政禅师
name: 终南山惟政
school: —
teacher: 嵩山寂
status: draft
bio: 平原人也。姓周氏。受业于本州延和寺诠澄法师。得法于嵩山普寂禅师。即入太一山中。学者盈室。唐文宗好嗜蛤蜊。㳂海官吏先时𮞏进。人亦劳止。一日御馔中有擘不张者。帝以其异。即焚香祷之。乃开。见菩萨形仪。梵相具足。帝遂贮以金粟檀香合。覆以美锦。赐兴善寺。令众僧瞻礼。因问群臣。斯何祥也。或奏太一山惟政禅师深明佛法。博闻强记。乞诏问之。帝即颁诏。师至。帝问其事。师曰。臣闻物无虗应。此乃启陛下之信心耳。故契经云。应以此身得度者。即现此身。而为说法。帝曰。菩萨身已现。且未闻说法。师曰。陛下睹此为常邪。非常邪。信邪。非信邪。帝曰。希奇之事。朕深信焉。师曰。陛下已闻说法竟。皇情悦豫。得未曾有。诏天下寺院各立观音像。以答殊休。留师于内道场。累辞归山。诏令住圣寿寺。至武宗即位。师忽入终南山隐居。人问其故。师曰。吾避仇矣。终后阇维。收舍利四十九粒。而建塔焉
