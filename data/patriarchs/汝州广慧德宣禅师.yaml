sayings:
- text: 僧问。祖祖相传传祖印。师今得法嗣何人。师曰。仲氏吹埙。伯氏吹篪。曰。恁么则广慧的子。首山亲孙也。师曰。椽塠里坐地。不打阇黎
  ref: X80n1565_p0439a06（五灯会元）
