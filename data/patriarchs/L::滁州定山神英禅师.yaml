id: L::滁州定山神英禅师
name: 滁州定山神英
school: 沩仰宗
teacher: 沩山祐
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0329a01。
sayings:
- text: 问。不落数量。请师道。师提起数珠曰。是落不落。树曰。圆珠三窍。时人知有。请师圆前话。师便打。树拂袖便出。师曰。三十年后槌胸大哭去在。树住后
  ref: X80n1565_p0329a01（五灯会元）
- text: 示众曰。老僧三十年前至定山。被他热谩一上。不同小小。师见首座洗衣。遂
  ref: X80n1565_p0329a01（五灯会元）
- text: 问。作甚么。座提起衣示之。师曰。洗底是甚衣。座曰。关中使铁钱。师唤维那。移下座挂搭著
  ref: X80n1565_p0329a01（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0329a01），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
