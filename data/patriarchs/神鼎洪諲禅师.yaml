id: 神鼎洪諲禅师
name: 神鼎洪諲
school: 临济宗
teacher: 首山省念禅师
bio: 首山省念禅师法嗣，住神鼎山。名载《五灯会元》首山省念法嗣章（「諲」或作「𬤇」）。
sayings:
- text: 首山问：「何处来？」师曰：「神鼎来。」山曰：「神鼎有何言句？」师曰：「不干你事。」山曰：「莫是神鼎么？」师曰：「黜。」
  ref: 五灯会元·卷十二·神鼎諲禅师
