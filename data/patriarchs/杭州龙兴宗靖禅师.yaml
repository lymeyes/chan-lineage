id: 杭州龙兴宗靖禅师
name: 杭州龙兴宗靖
school: —
teacher: 雪峰义存禅师
status: draft
bio: 台州人也。初参雪峰。誓充饭头。劳逾十载。尝于众堂中袒一膊钉帘。峰睹而记曰。汝向后住持有千僧。其中无一人衲子也。师悔过回浙。住六通院。钱王命居龙兴寺。有众千余。唯三学讲诵之徒。果如雪峰所志
sayings:
- text: 僧问。如何是六通奇特之唱。师曰。天下举将去
  ref: X80n1565_p0266b06（五灯会元）
- text: 问。如何是六通家风。师曰。一条布衲。一斤有余
  ref: X80n1565_p0266b06（五灯会元）
- text: 问。如何是学人进前一路。师曰。谁敢谩汝。曰。岂无方便。师曰。早是屈抑也
  ref: X80n1565_p0266b06（五灯会元）
- text: 问。如何是和尚家风。师曰。早朝粥。斋时饭。曰。更请和尚道。师曰。老僧困。曰。毕竟作么生。师大笑而已
  ref: X80n1565_p0266b06（五灯会元）
