id: L::杭州千顷山楚南禅师
name: 杭州千顷山楚南
school: 南岳系
teacher: 黄檗运
status: draft
bio: 福州张氏子。初参芙蓉。蓉见曰。吾非汝师。汝师江外黄檗是也。师礼辞。遂参黄檗。檗
sayings:
- text: 问。子未现三界影像时如何。师曰。即今岂是有邪。檗曰。有无且置。即今如何。师曰。非今古。檗曰。吾之法眼。已在汝躬。住后
  ref: X80n1565_p0150a12（五灯会元）
- text: 上堂。诸子设使解得三世佛教。如缾注水。及得百千三昧。不如一念修无漏道。免被人天因果系绊。时有
  ref: X80n1565_p0150a12（五灯会元）
- text: 僧问。无漏道如何修。师曰。未有阇黎时体取。曰。未有某甲时教谁体。师曰。体者亦无
  ref: X80n1565_p0150a12（五灯会元）
- text: 问。如何是易。师曰。著衣吃饭。不用读经看教。不用行道礼拜。烧身炼顶。岂不易邪。曰。如何是难。师曰。微有念生。便具五阴三界。轮回生死皆从汝一念生。所以佛教诸菩萨云。佛所护念。师虽应机无倦。而常寂然处定。或逾月。或浃旬。文德六年五月迁化。塔于院之西隅。大顺二年宣州孙儒宼钱塘。发塔。睹师全身俨然。爪发俱长。拜谢而去
  ref: X80n1565_p0150a12（五灯会元）
