sayings:
- text: 僧问。如何是诸佛出身处。师曰。出处非干佛。春来草自青
  ref: X80n1565_p0218b05（五灯会元）
- text: 问。碌碌地时如何。师曰。试进一步看
  ref: X80n1565_p0218b05（五灯会元）
