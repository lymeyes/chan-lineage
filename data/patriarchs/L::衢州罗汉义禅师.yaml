id: L::衢州罗汉义禅师
name: 衢州罗汉义
school: 青原系
teacher: 明招谦
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0305b02。
sayings:
- text: 上堂众集。僧才出。师曰。不是好底。僧礼拜起
  ref: X80n1565_p0305b02（五灯会元）
- text: 问。龙泉宝剑请师挥。师曰。甚么处去也。曰。恁么则龙谿南面尽锋铓。师曰。收取
  ref: X80n1565_p0305b02（五灯会元）
- text: 问。不落古今请师道。师曰。还怪得么。曰。犹落古今。师曰。莫错
  ref: X80n1565_p0305b02（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0305b02），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
