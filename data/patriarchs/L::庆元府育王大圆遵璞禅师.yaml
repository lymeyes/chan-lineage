id: L::庆元府育王大圆遵璞禅师
name: 庆元府育王大圆遵璞
school: 杨岐派
teacher: 径山杲
status: draft
bio: 福州人。幼同玉泉懿问道圆悟。数载后还里。佐懿于莆中祥云。绍兴甲寅。大慧居洋屿。师往讯之。入室次。慧问三圣兴化出不出．为人不为人话。你道这两个老汉。还有出身处也无。师于慧膝上打一拳。慧曰。祇你这一拳。为三圣出气。为兴化出气。速道。速道。师拟议。慧便打。复谓曰。你第一不得忘了这一棒。后因慧室中问僧曰。德山见僧入门便棒。临济见僧入门便喝。雪峰见僧入门便道是甚么。睦州见僧便道现成公案。放你三十棒。你道这四个老汉。还有为人处也无。僧曰。有。慧曰。札。僧拟议。慧便喝。师闻遽领微旨。大慧欣然许之
