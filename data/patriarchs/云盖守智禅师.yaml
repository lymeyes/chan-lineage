id: 云盖守智禅师
name: 云盖守智
alias: 云盖智
school: 黄龙派
teacher: 黄龙慧南禅师
status: draft
bio: 剑州陈氏子。游方至豫章大宁。时法昌遇禅师韬藏西山。师闻其饱参即之。昌问曰。汝何所来。师曰。大宁。又
sayings:
- text: 问。三门夜来倒汝知么。师愕然曰。不知。昌曰。吴中石佛大有人不曾得见师惘然即展拜。昌使谒翠岩真禅师。虽久之无省。且不舍寸阴。及谒黄龙于积翠始尽所疑。后首众石霜遂开法。道吾徙云盖
  ref: T51n2077_p0569b19（续传灯录）
- text: 僧问。有一无弦琴。不是世间木。今朝负上来。请师弹一曲。师拊膝一下
  ref: T51n2077_p0569b19（续传灯录）
- text: 僧云。金风飒飒和清韵。请师方便再垂音。师曰。陕府出铁牛
  ref: T51n2077_p0569b19（续传灯录）
- text: 上堂。紧鞘离水靴。踏破湖湘月。手把铁蒺藜。打碎龙虎穴。翻身倒上树。始见无生灭。劫笑老瞿昙。弹指超弥勒
  ref: T51n2077_p0569b19（续传灯录）
- text: 上堂。昨日高山看钓鱼。步行骑马失却驴。有人拾得骆驼去。重赏千金一也无。若向这里荐得不著还草鞋钱
  ref: T51n2077_p0569b19（续传灯录）
- text: 上堂举。赵州问僧。向甚么处去。曰摘茶去。州曰闲。师曰。道著不著何处摸索。背后龙鳞面前驴脚。翻身筋斗孤云野鹤。阿呵呵
  ref: T51n2077_p0569b19（续传灯录）
- text: 示众。不离当处常湛然。觅即知君不可见。虽然先德恁么道。且作个模子搭却。若也出不得只抱得古人底。若也出得方有少分相应。云盖则不然。骑骏马绕须弥。过山寻蚁迹。能有几人知。师居院之东堂。政和辛卯死心谢事黄龙。由湖南入山奉觐日已夕矣。侍僧通谒。师曳履且行且语曰。将烛来看其面目。何似生而致名喧宇宙。死心亦绝叫把近前来。我要照是真师叔是假师叔。师即当胸驱一拳。死心曰。却是真个遂作礼。宾主相得欢甚。及死心复领黄龙。至政和甲午示寂。时师住开福得讣
  ref: T51n2077_p0569b19（续传灯录）
- text: 上堂。法门不幸法幢摧。五蕴山中化作灰。昨夜泥牛通一线。黄龙从此入轮回。玄沙合文禅师福州玄沙合文明慧禅师
  ref: T51n2077_p0569b19（续传灯录）
- text: 僧问。如何是道。师曰。私通车马。僧进一步。师曰。官不容针。黄蘗惟胜禅师瑞州黄蘗惟胜真觉禅师潼川罗氏子。居讲聚时偶以扇勒窗櫺有声。忽忆教中道。十方俱击鼓十处一时闻。因大悟白本讲。讲令参
  ref: T51n2077_p0569b19（续传灯录）
- text: 问。师径往黄龙。后因瑞州太守委龙遴选黄蘗主人。龙集众垂语曰。钟楼上念赞。床脚下种菜。若人道得乃往住持。师出答曰。猛虎当路坐。龙大悦遂令师往。由是诸方宗仰之
  ref: T51n2077_p0569b19（续传灯录）
- text: 上堂。临济喝德山棒。留与禅人作模范。归宗磨雪峰球。此个门庭接上流。若是黄蘗即不然。也无喝。也无棒。亦不推磨。亦不辊球。前面是案山背后是主山。塞却尔眼睛拶破尔面门。于此见得得不退转地。尽未来际不向他求。若见不得醍醐上味翻成毒药
  ref: T51n2077_p0569b19（续传灯录）
- text: 上堂。寂兮寥兮蟾蜍皎皎下空谷。宽兮廓兮曦光𦮰𦮰流四海。曹谿路上剿绝人行。多子塔前骈阗如市。直饶这里荐得倜傥分明。未是衲僧活计。大丈夫汉须是向黑暗狱中敲枷打锁。饿鬼队里放火夺浆。推倒慈氏楼。折却空王殿。灵苗瑞草和根扷。满地从教荆棘生
  ref: T51n2077_p0569b19（续传灯录）
