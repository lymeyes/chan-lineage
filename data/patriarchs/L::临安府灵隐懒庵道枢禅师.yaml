id: L::临安府灵隐懒庵道枢禅师
name: 临安府灵隐懒庵道枢
school: 云门宗
teacher: 道场慧
status: draft
bio: 吴兴四安徐氏子。初住何山。次移华藏。隆兴初。诏居灵隐。孝宗皇帝召至内殿。问禅道之要。师答以此事在陛下堂堂日用应机处。本无知见起灭之棼．圣凡迷悟之别。第护正念。则与道相应。情却物。则业不能系。尽去沉掉之病。自忘问答之意。矧今补处。见在佛般若光明中。何事不成见耶。上为之首肯数四。师
sayings:
- text: 示众曰。仙人张果老。骑驴穿市过。但闻蹄拨剌。谁知是纸做。后退居明教永安兰若。逍遥自适。有偈题于壁曰。雪里梅华春信息。池中月色夜精神。年来可是无佳趣。莫把家风举似人。淳熙丙申八月。示微疾。书偈而逝。塔于永安
