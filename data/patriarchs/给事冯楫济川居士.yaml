id: 给事冯楫济川居士
name: 给事冯楫济川
school: 杨岐派
teacher: 龙门清远禅师
status: draft
bio: 自壮扣诸名宿。最后居龙门。从佛眼远禅师。再岁。一日同远经行法堂。偶童子趋庭。吟曰。万象之中独露身。远拊公背曰。好。𫆏。公于是契入。绍兴丁巳。除给事。会大慧禅师就明庆开堂。慧下座。公挽之曰。和尚每言于士大夫前曰。此生决不作这虫豸。今日因甚却纳败缺。慧曰。尽大地是个杲上座。你向甚处见他。公拟对。慧便掌。公曰。是我招得。越月。特丐祠坐夏径山。榜其室曰不动轩。一日。慧升座。举。药山问石头曰。三乘十二分教。某甲粗知。承闻南方直指人心。见性成佛。实未明了。伏望慈悲示诲。头曰。恁么也不得。不恁么也不得。恁么不恁么总不得。你作么生。山罔措。头曰。子缘不在此。可往江西见马大师去。山至马祖处。亦如前
sayings:
- text: 问。祖曰。有时教伊扬眉瞬目。有时不教伊扬眉瞬目。有时教伊扬眉瞬目者是。有时教伊扬眉瞬目者不是。山大悟。慧拈罢。公随至方丈曰。适来和尚所举底因缘。某理会得了。慧曰。你如何会。公曰。恁么也不得苏𠰷娑婆诃。不恁么也不得㗭唎娑婆诃。恁么不恁么。总不得苏𠰷㗭唎娑婆诃。慧印之以偈曰。梵语唐言打成一块。咄哉俗人。得此三昧。公后知卭州。所至宴晦无倦。尝自咏曰。公事之余喜坐禅。少曾将胁到床眠。虽然现出宰官相。长老之名四海传。至二十三年秋。乞休致。预报亲知。期以十月三日报终。至日。令后厅置高座。见客如平时。至辰巳间。降堦望阙肃拜。请漕使摄卭事。著僧衣履。踞高座。嘱诸官吏及道俗。各宜向道。扶持教门。建立法幢。遂拈拄杖按膝。蜕然而化。漕使请曰。安抚去住如此自由。何不留一颂以表罕闻。公张目。索笔书曰。初三十一。中九下七。老人言尽。龟哥眼赤。竟尔长往。建炎后名山巨刹。教藏多不存。公累以己俸印施。凡一百二十八藏。用祝君寿。以康兆民。门人蒲大聘尝志其事。有语录．颂古行于世
