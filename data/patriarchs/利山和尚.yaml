id: 利山和尚
name: 利山
school: 南岳系
teacher: 马祖一
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0116b12。
sayings:
- text: 僧问。众色归空。空归何所。师曰。舌头不出口。曰。为甚么不出口。师曰。内外一如故
  ref: X80n1565_p0116b12（五灯会元）
- text: 问。不历僧祇获法身。请师直指。师曰。子承父业。曰。如何领会。师曰。贬剥不施。曰。恁么则大众有赖去也。师曰。大众且置。作么生是法身。僧无对。师曰。汝
  ref: X80n1565_p0116b12（五灯会元）
- text: 僧问。如何是法身。师曰。空华阳𦦨
  ref: X80n1565_p0116b12（五灯会元）
- text: 问。如何是西来意。师曰。不见如何。曰。为甚么如此。师曰。祇为如此
  ref: X80n1565_p0116b12（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0116b12），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
