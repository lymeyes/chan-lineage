id: 泉州睡龙山和尚
name: 泉州睡龙山
school: —
teacher: 玄沙备
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0282a13。
sayings:
- text: 僧问。如何是触目菩提。师以杖趁之。僧乃走。师曰。住。住。向后遇作家举看
  ref: X80n1565_p0282a13（五灯会元）
- text: 上堂。举拄杖曰。三十年住山。得他气力。时有
  ref: X80n1565_p0282a13（五灯会元）
- text: 僧问。和尚得他甚么气力。师曰。过谿过岭。东拄西拄招庆云。我不恁么道
  ref: X80n1565_p0282a13（五灯会元）
- text: 僧问。和尚作么生道。庆以杖下地拄行
  ref: X80n1565_p0282a13（五灯会元）
