bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0267b16。
sayings:
- text: 僧问。承闻和尚见虎。是否。师作虎声。僧作打势。师曰。这死汉
  ref: X80n1565_p0267b16（五灯会元）
- text: 问。如何是天真佛。师乃拊掌曰。不会。不会
  ref: X80n1565_p0267b16（五灯会元）
