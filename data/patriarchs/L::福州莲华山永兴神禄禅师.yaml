id: L::福州莲华山永兴神禄禅师
name: 福州莲华山永兴神禄
school: —
teacher: 玄沙备
status: draft
bio: 闽王请开堂日。未升座。先于座前立曰。大王大众听。已有真正举扬也。此一会总是得闻。岂有不闻者。若有不闻。彼此相谩去也。方乃登座
sayings:
- text: 僧问。大王请师出世。未委今日一会何似灵山。师曰。彻古传今
  ref: X80n1565_p0283a07（五灯会元）
- text: 问。如何是和尚家风。师曰。毛头显沙界。日月现其中。天台国清寺师静上座天台国清寺师静上座始遇玄沙
  ref: X80n1565_p0283a07（五灯会元）
- text: 示众曰。汝诸人但能一生如丧考妣。吾保汝究得彻去。师蹑前语。问曰。祇如教中道。不得以所知心测度如来无上知见。又作么生。沙曰。汝道究得彻底所知心。还测度得及否。师从此信入。后居天台三十余载不下山。博综三学。操行孤立。禅寂之余。常阅龙藏。遐迩钦重。时谓大静上座。尝有人
  ref: X80n1565_p0283a07（五灯会元）
- text: 问。弟子每当夜坐。心念纷飞。未明摄伏之方。愿垂示诲。师曰。如或夜闲安坐。心念纷飞。却将纷飞之心。以究纷飞之处。究之无处。则纷飞之念何存。反究究心。则能究之心安在。又能照之智本空。所缘之境亦寂。寂而非寂者。葢无能寂之人也。照而非照者。葢无所照之境也。境智俱寂。心虑安然。外不寻枝。内不住定。二途俱泯。一性怡然。此乃还源之要道也。师因睹教中幻义。乃述一偈。问诸学流曰。若道法皆如幻有。造诸过恶应无咎。云何所作业不忘。而藉佛慈兴接诱。时有小静上座答曰。幻人兴幻幻轮围。幻业能招幻所治。不了幻生诸幻苦。觉知如幻幻无为。二静上座并终于本山
  ref: X80n1565_p0283a07（五灯会元）
