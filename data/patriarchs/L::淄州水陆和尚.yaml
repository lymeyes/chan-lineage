id: L::淄州水陆和尚
name: 淄州水陆
school: 临济宗
teacher: 三圣然
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0403b01。
sayings:
- text: 僧问。如何是学人用心处。师曰。用心即错。曰。不起一念时如何。师曰。没用处汉
  ref: X80n1565_p0403b01（五灯会元）
- text: 问。此事如何保任。师曰。切忌
  ref: X80n1565_p0403b01（五灯会元）
- text: 问。如何是最初一句。师便喝。僧礼拜。师以拂子点曰。且放
  ref: X80n1565_p0403b01（五灯会元）
- text: 问。狭路相逢时如何。师便拦胸拓一拓
  ref: X80n1565_p0403b01（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0403b01），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
