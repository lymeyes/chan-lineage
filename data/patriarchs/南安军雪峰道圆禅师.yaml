id: 南安军雪峰道圆禅师
name: 南安军雪峰道圆
school: 黄龙派
teacher: 黄龙南
status: draft
bio: 南雄人也。依积翠日。宴坐下板。时二僧论野狐话。一云。不昧因果。也未脱得野狐身。一云。不落因果。又何曾堕野狐来。师闻之悚然。因诣积翠庵。渡㵎猛省。述偈曰。不落不昧。僧俗本无忌讳。丈夫气宇如王。争受囊藏被盖。一条楖栗任纵横。野狐跳入金毛队。翠见为助喜。住后
sayings:
- text: 上堂。举风幡话。颂曰。不是风兮不是幡。白云依旧覆青山。年来老大浑无力。偷得忙中些子闲
