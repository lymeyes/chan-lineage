id: L::舒州投子通禅师
name: 舒州投子通
school: —
teacher: 未详
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0221b06。
sayings:
- text: 僧问。达磨未来时如何。师曰。两岸唱渔歌。曰。来后如何。师曰。大海涌风波
  ref: X80n1565_p0221b06（五灯会元）
- text: 问。如何是孤峰顶上节操长松。师曰。能为万象主。不逐四时凋
  ref: X80n1565_p0221b06（五灯会元）
- text: 问。如何是和尚这里佛法。师曰。东壁打西壁
  ref: X80n1565_p0221b06（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0221b06），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
