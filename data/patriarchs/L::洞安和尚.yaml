id: L::洞安和尚
name: 洞安
school: 南岳系
teacher: 马祖一
status: draft
bio: 有僧辞。师曰。甚么处去。曰。本无所去。师曰。善为阇黎。曰。不敢。师曰。到诸方。分明举似。僧侍立次。师
sayings:
- text: 问。今日是几。曰。不知。师曰。我却记得。曰。今日是几。师曰。今日昏晦
  ref: X80n1565_p0118a10（五灯会元）
