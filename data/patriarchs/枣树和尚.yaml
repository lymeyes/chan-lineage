id: 枣树和尚
name: 枣树
school: 黄龙派
teacher: 黄龙机
status: draft
bio: 第二世住。问僧。发足甚处。曰。闽中。师曰。俊哉。曰。谢师指示。师曰。屈哉。僧作礼。师曰。我与么道。落在甚么处。僧无语。师曰。彼自无疮。勿伤之也。僧参。师乃
sayings:
- text: 问。未到这里时。在甚处安身立命。僧叉手近前。师亦叉手近前。相并而立。僧曰。某甲未到此时。和尚与谁并立。师指背后曰。莫是伊么。僧无对。师曰。不独自谩。兼谩老僧。僧作礼。师曰。正是自谩。僧鉏地次。见师来乃不审。师曰。见阿谁了便不审。曰。见师不问讯。礼式不全。问曰。却是孤负老僧。其僧归举似首座曰。和尚近日可畏。座曰。作么生。僧举前语。座曰。和尚近日可谓为人切。师闻乃打首座七棒。座曰。某甲恁么道。未有过在。乱打作么。师曰。枉吃我多少盐酱。又打七棒。僧辞。师乃
  ref: X80n1565_p0303a09（五灯会元）
- text: 问。若到诸方。有人问你老僧此间法道。作么生祇对。曰。待问即道。师曰。何处有无口底佛。曰。祇这也还难。师竖拂子曰。还见么。曰。何处有无眼底佛。师曰。祇这也还难。僧绕禅床一匝而出。师曰。善能祇对。僧便喝。师曰。老僧不识子。曰。用识作么。师敲禅床三下
  ref: X80n1565_p0303a09（五灯会元）
