id: 嵆山章禅师
name: 嵆山章
school: 曹洞宗
teacher: 云居道膺禅师
status: draft
bio: 在投子作柴头。投子同吃茶次。谓师曰。森罗万象。总在里许。师泼却茶曰。森罗万象。在甚么处。子曰。可惜一椀茶。师后谒雪峰。峰
sayings:
- text: 问。莫是章柴头么。师乃作轮椎势。峰肯之
  ref: X80n1565_p0499b04（五灯会元）
