sayings:
- text: 僧问。诸佛有难。向火焰里藏身。未审衲僧有难。向甚么处藏身。师曰。水精瓮里著波斯
  ref: X80n1565_p0207b03（五灯会元）
- text: 问。如何是初生月。师曰。太半人不见
  ref: X80n1565_p0207b03（五灯会元）
