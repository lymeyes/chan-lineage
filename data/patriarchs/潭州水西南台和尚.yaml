id: 潭州水西南台和尚
name: 潭州水西南台
school: 曹洞宗
teacher: 云居道膺禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0501a15。
sayings:
- text: 僧问。如何是此间一滴水。师曰。入口即抉出
  ref: X80n1565_p0501a15（五灯会元）
- text: 问。如何是西来意。师曰。靴头线绽
  ref: X80n1565_p0501a15（五灯会元）
- text: 问。祖祖相传。未审传个甚么。师曰。不因阇黎
  ref: X80n1565_p0501a15（五灯会元）
- text: 问。老僧亦不知
  ref: X80n1565_p0501a15（五灯会元）
