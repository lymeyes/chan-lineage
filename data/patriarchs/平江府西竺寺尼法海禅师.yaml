school: 云门宗
teacher: 本觉一
status: draft
bio: 宝文吕嘉之姑也。首参法云秀和尚。后领旨于法真言下。诸名儒屡挽应世。坚不从。殂日说偈曰。霜天云雾结。山月冷涵辉。夜接故乡信。晓行人不知。届明坐脱
