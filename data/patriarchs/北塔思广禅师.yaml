id: 北塔思广禅师
name: 北塔思广
alias: 北塔广
school: 云门宗
teacher: 五祖戒禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《续传灯录》T51n2077_p0478a06。
sayings:
- text: 僧问。如何是衲僧变通事。师曰。东涌西没
  ref: T51n2077_p0478a06（续传灯录）
- text: 僧云。变通后如何。师曰。地肥茄子嫩
  ref: T51n2077_p0478a06（续传灯录）
- text: 僧云。如何是佛。师曰。左手书右手字
  ref: T51n2077_p0478a06（续传灯录）
- text: 僧云。学人不会。师曰。拗头折脚。云盖智颙禅师潭州云盖山志颙禅师
  ref: T51n2077_p0478a06（续传灯录）
- text: 僧问。豹岩雾卷鸟道云开。海众咸臻潮音愿振。师曰。月映千江白
  ref: T51n2077_p0478a06（续传灯录）
- text: 僧云恁么则五云岭秀三井风清。师曰。云开万里新。问如何是云盖境。师曰。山角金屏掩。松罗玉帐垂
  ref: T51n2077_p0478a06（续传灯录）
- text: 僧云。如何是境中人。师曰。紫袍公子少雪顶野僧多。问如何是祖师西来意。师曰。古寺碑难读
  ref: T51n2077_p0478a06（续传灯录）
- text: 僧云。未审意旨如何。师曰。读者尽攒眉。问如何是和尚家风。师曰。遮天盖地
  ref: T51n2077_p0478a06（续传灯录）
- text: 僧云。忽遇客来如何只待。师曰。赵州道底。师顾视大众喝一喝曰。诸禅德莫是宾主历然么。莫是先照后用么。莫是照用同时么。若恁么会临济宗风平沈苦海。既不恁么会作么生商量。良久喝一喝。拍绳床一下。又
  ref: T51n2077_p0478a06（续传灯录）
- text: 上堂曰。昨日三今日四。把断要津放开捏聚。无限禅徒特地罔措。喝一喝
  ref: T51n2077_p0478a06（续传灯录）
