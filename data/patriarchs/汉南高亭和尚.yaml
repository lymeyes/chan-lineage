id: 汉南高亭和尚
name: 汉南高亭
school: 南岳系
teacher: 归宗常
status: draft
bio: 有僧自夹山来礼拜。师便打。僧曰。特来礼拜。何得打某甲。僧再礼拜。师又打趁。僧回。举似夹山。山曰。汝会也无。曰。不会。山曰。赖汝不会。若会。即夹山口痖
