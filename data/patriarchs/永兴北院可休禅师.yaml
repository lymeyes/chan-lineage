bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0310b04。
sayings:
- text: 僧问。如何是西来意。师曰。遍满天下。曰。莫便是也无。师曰。是即牢收取
  ref: X80n1565_p0310b04（五灯会元）
- text: 问。大作业底人来。师还接否。师曰。不接。曰。为甚么不接。师曰。幸是好人家男女
  ref: X80n1565_p0310b04（五灯会元）
