id: L::郢州桐泉山禅师
name: 郢州桐泉山
school: 青原系
teacher: 黄山轮
status: draft
bio: 初参黄山。问天门一合十方无路。有人道得摆手出漳江。师对曰。蛰户不开龙无龙句。黄山曰。是尔恁么道。师曰。是即直言是。不是直言不是。黄山曰。摆手出漳江。黄山复
sayings:
- text: 问。卞和到处荆山秀。玉印从他天子传时如何。师曰。灵鹤不于林下憩。野老不重太平年。黄山深肯之。师住后
  ref: T51n2076_p0370a23（景德传灯录）
- text: 僧问。如何是相传底事。师曰。龙吐长生水鱼吞无尽沤。问请师挑揥他狄切。师曰。攂鼓转船头棹挑波里月
  ref: T51n2076_p0370a23（景德传灯录）
