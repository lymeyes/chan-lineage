bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0295a06。
sayings:
- text: 僧问。灯传鼓峤。道化温陵。不跨石门。请师通信。师曰。若不是今日。拦胸撞出。曰。恁么则今日亲闻师子吼。他时终作凤凰儿。师曰。又向这里涂污人
  ref: X80n1565_p0295a06（五灯会元）
- text: 问。白浪滔天境。何人住太虗。师曰。静夜思尧鼓。回头闻舜琴
  ref: X80n1565_p0295a06（五灯会元）
