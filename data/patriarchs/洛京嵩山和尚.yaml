id: 洛京嵩山和尚
name: 洛京嵩山
school: 南岳系
teacher: 南泉愿
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0139b16。
sayings:
- text: 僧问。古路坦然时如何。师曰。不前。曰。为甚么不前。师曰。无遮障处
  ref: X80n1565_p0139b16（五灯会元）
- text: 问。如何是嵩山境。师曰。日从东出。月向西颓。曰。学人不会。师曰。东西也不会
  ref: X80n1565_p0139b16（五灯会元）
- text: 问。六识俱生时如何。师曰。异。曰。为甚么如此。师曰。同
  ref: X80n1565_p0139b16（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0139b16），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
