id: 庐山归宗慧通禅师
name: 庐山归宗慧通
school: 曹洞宗
teacher: 大沩宥禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0613a07。
sayings:
- text: 僧问。如何是函葢乾坤句。师曰。日出东方夜落西。曰。如何是截断众流句。师曰。铁山横在路。曰。如何是随波逐浪句。师曰。船子下扬州
  ref: X80n1565_p0613a07（五灯会元）
- text: 问。如何是尘尘三昧。师曰。灰飞火乱
  ref: X80n1565_p0613a07（五灯会元）
- text: 问。如何是佛法大意。师曰。黄河水出昆仑觜
  ref: X80n1565_p0613a07（五灯会元）
- text: 问。十二时中如何履践。师曰。铁牛步春草
  ref: X80n1565_p0613a07（五灯会元）
- text: 问。只履西归。当为何事。师曰。为缘生处乐。不是厌他乡。曰。如何是当面事。师曰。眼下鼻头垂
  ref: X80n1565_p0613a07（五灯会元）
- text: 上堂。心随相起。见自尘生。了见本心。知心无相。即十方刹海。念念圆明。无量法门。心心周匝。夫如是者。何假觉城东际。参见文殊。楼阁门开。方亲弥勒。所以道。一切法门无尽海。同会一法道场中。拈起拄杖曰。这个是一法。那个是道场。这个是道场。那个是一法。良久曰。看。看。拄杖子穿过诸人髑髅。须弥山拶破诸人鼻孔。击香台一下。曰。且向这里会取
  ref: X80n1565_p0613a07（五灯会元）
- text: 上堂。从无入有易。从有入无难。有无俱尽处。且莫自颟顸。举来看。寒山拾得礼丰干
  ref: X80n1565_p0613a07（五灯会元）
