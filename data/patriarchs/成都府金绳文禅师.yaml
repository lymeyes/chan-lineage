bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0718b07。
sayings:
- text: 僧问如何是大道之源。师曰黄河九曲。曰。如何是不犯之令。师曰铁蛇钻不入。僧拟议。师便打。南岳下十六世南岳下十六世
