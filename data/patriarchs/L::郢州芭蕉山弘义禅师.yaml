id: L::郢州芭蕉山弘义禅师
name: 郢州芭蕉山弘义
school: 云门宗
teacher: 云门偃
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0575b08。
sayings:
- text: 僧问。如何是最初一句。师曰。举起分明。曰。如何受持。师曰。苏噜悉哩
  ref: X80n1565_p0575b08（五灯会元）
- text: 问。学人非时上来。乞师一接。师曰。汝是甚处人。曰。河北人。师曰。不易过黄河
  ref: X80n1565_p0575b08（五灯会元）
