id: 唐州紫玉山道通禅师
name: 唐州紫玉山道通
school: 南岳系
teacher: 马祖一
status: draft
bio: 卢江何氏子。随父守官泉南。因而出家。诣建阳。谒马祖。祖寻迁龚公山。师亦随之。祖将归寂。谓师曰。夫玉石润山秀丽。益汝道业。遇可居之。师不晓其言。是秋游洛。回至唐州。西见一山。四面悬绝。峰峦秀异。因询乡人。曰。紫玉山。师乃陟山顶。见石方正。莹然紫色。叹曰。此其紫玉也。先师之言悬记耳。遂剪茅构舍而居焉。后学徒四集
sayings:
- text: 僧问。如何出得三界去。师曰。汝在里许。得多少时也。曰。如何出离。师曰。青山不碍白云飞。于𬱖相公
  ref: X80n1565_p0111b05（五灯会元）
- text: 问。如何是黑风吹其船舫。漂堕罗刹鬼国。师曰。于𬱖客作汉。问恁么事作么。于公失色。师乃指曰。这个便是漂堕罗刹鬼国。公又
  ref: X80n1565_p0111b05（五灯会元）
- text: 问。如何是佛。师唤相公。公应诺。师曰。更莫别求药山闻曰。噫。可惜于家汉生埋向紫玉山中。公闻。乃谒见药山。山问曰。闻相公在紫玉山中大作佛事。是否。公曰。不敢。乃曰。承闻有语相救。今日特来。山曰。有疑但
  ref: X80n1565_p0111b05（五灯会元）
- text: 问。公曰。如何是佛。山召于𬱖。公应诺。山曰。是甚么。公于此有省。元和八年。弟子金藏参百丈回。师曰。汝其来矣。此山有主也。于是嘱付讫。策杖径去襄州。道俗迎之。至七月十五日。无疾而终
  ref: X80n1565_p0111b05（五灯会元）
