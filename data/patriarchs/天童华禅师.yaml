bio: 虎丘绍隆之法嗣，虎丘派第二代。谱系图中标作「天童华禅师」，为密庵咸杰之师；按临济法脉，虎丘绍隆之下传应庵昙华、再传密庵咸杰，故此「天童华」当与应庵昙华为同一人（曾住天童），待
  CBETA 核实确认。其下密庵咸杰一系，衍破庵祖先、松源崇岳，破庵出无准师范、雪窦元聪，遂为南宋临济正宗。
sayings:
- text: 师承虎丘绍隆「竹篾子」「有句无句」之勘验，以「树倒藤枯」之机接引密庵咸杰。
  ref: 嘉泰普灯录·应庵昙华 / 密庵咸杰机缘
status: draft
verify: 待 CBETA 核对：确认「天童华」与「应庵昙华」是否为同一人（据住锡地与师承）。
