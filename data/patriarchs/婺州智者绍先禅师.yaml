id: 婺州智者绍先禅师
name: 婺州智者绍先
school: 云门宗
teacher: 法云白
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0643b15。
sayings:
- text: 上堂。根尘同源。缚脱无二。不动丝毫。十方游戏。子湖犬子虽狞。争似南山氅鼻。遂高声曰。大众看脚下
  ref: X80n1565_p0643b15（五灯会元）
- text: 上堂。团不聚。拨不散。日晒不干。水浸不烂。等闲挂在太虗中。一任傍人冷眼看
  ref: X80n1565_p0643b15（五灯会元）
