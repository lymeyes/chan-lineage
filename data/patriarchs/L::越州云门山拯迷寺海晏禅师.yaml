id: L::越州云门山拯迷寺海晏禅师
name: 越州云门山拯迷寺海晏
school: 云门宗
teacher: 石霜诸
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0198b03。
sayings:
- text: 僧问。如何是衲衣下事。师曰。如𫜪硬石头
  ref: X80n1565_p0198b03（五灯会元）
- text: 问。如何是古寺一炉香。师曰。历代无人齅。曰。齅者如何。师曰。六根俱不到
  ref: X80n1565_p0198b03（五灯会元）
- text: 问。久向拯迷。到来为甚么不见拯迷。师曰。阇黎不识拯迷
  ref: X80n1565_p0198b03（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0198b03），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
