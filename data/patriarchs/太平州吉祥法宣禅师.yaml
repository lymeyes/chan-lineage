bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0542b03。
sayings:
- text: 僧问。如何是祖师西来意。师曰。久旱无甘雨。田中稻穗枯。曰。意旨如何。师曰。今年米价贵。容易莫嫌麤
  ref: X80n1565_p0542b03（五灯会元）
