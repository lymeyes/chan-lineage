id: 镇州大悲和尚
name: 镇州大悲
school: 临济宗
teacher: 三圣慧然禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0403a12。
sayings:
- text: 僧问。除上去下。请师别道。师曰。开口即错。曰。真是学人师也。师曰。今日向弟子手里死
  ref: X80n1565_p0403a12（五灯会元）
- text: 问。如何是和尚密作用。师拈棒。僧转身受棒。师抛下棒曰。不打这死汉
  ref: X80n1565_p0403a12（五灯会元）
- text: 问。如何是谛实之言。师曰。舌拄上腭。曰。为甚么如此。师便打
  ref: X80n1565_p0403a12（五灯会元）
- text: 问。如何是大悲境。师曰。千眼都来一只收。曰。如何是境中人。师曰。手忙脚乱
  ref: X80n1565_p0403a12（五灯会元）
- text: 问。不著圣凡。请师答话。师曰。好。僧拟议。师便喝
  ref: X80n1565_p0403a12（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0403a12），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
