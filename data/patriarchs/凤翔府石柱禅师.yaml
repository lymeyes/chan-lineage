id: 凤翔府石柱禅师
name: 凤翔府石柱
school: 青原系
teacher: 石霜诸禅师
status: draft
bio: 游方时到洞山。时虔和尚垂语曰。有四种人。一人说过佛祖。一步行不得。一人行过佛祖。一句说不得。一人说得行得。一人说不得行不得阿那个是其人师出众曰。一人说过佛祖行不得者。祇是无舌不许行。一人行过佛祖一句说不得者。祇是无足不许说。一人说得行得者。祇是函葢相称。一人说不得行不得者。如断命求活。此是石女儿。披枷带锁。山曰。阇黎分上作么生。师曰。该通分上卓卓宁彰。山曰。祇如海上明公秀又作么生。师曰。幻人相逢。拊掌呵呵
