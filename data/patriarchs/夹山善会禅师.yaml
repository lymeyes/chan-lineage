id: 夹山善会禅师
name: 夹山善会
honorific: 澧州夹山善会禅师（船子德诚法嗣）
school: 青原系
dynasty: 唐（805—881）
region: 澧州夹山（今湖南石门）
teacher: 船子德诚
source_ref: 五灯会元·卷五·澧州夹山善会 / 景德传灯录·卷十五
cbeta: T51n2076 卷十五
bio: 船子德诚之法嗣。初为讲经僧，谒船子，于「垂丝千尺」之钓大悟，受「覆舟」之印。后住澧州夹山，道风高古。其「猿抱子归青嶂里，鸟衔花落碧岩前」之吟，与「目前无法，意在目前」之勘验，为后学所重；夹山亦以「茶禅」机用闻名。
sayings:
- text: 悟后吟：「猿抱子归青嶂里，鸟衔花落碧岩前。」（船子印可后所作，示「日用境中见性」）
  ref: 五灯会元·卷五·夹山善会
- text: 僧问「如何是夹山境」，师云「猿抱子归青嶂里，鸟衔花落碧岩前」；僧云「如何是境中人」，师云「靠倒就中人不顾，看来当体是何人」。
  ref: 五灯会元·卷五·夹山善会
