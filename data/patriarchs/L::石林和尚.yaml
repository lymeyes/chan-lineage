id: L::石林和尚
name: 石林
school: 南岳系
teacher: 马祖一
status: draft
bio: 见庞居士来。乃竖起拂子曰。不落丹霞机。试道一句子。士夺却拂子。却自竖起拳。师曰。正是丹霞机。士曰。与我不落看。师曰。丹霞患痖。庞公患聋。士曰。恰是。师无语。士曰。向道偶尔。又一日问士。某甲有个借
sayings:
- text: 问。居士莫惜言语。士曰。便请举来。师曰。元来惜言语。士曰。这个问讯。不觉落他便宜。师乃掩耳。士曰。作家。作家。亮座主亮座主蜀人也。颇讲经论。因参马祖。祖
  ref: X80n1565_p0115a14（五灯会元）
- text: 问。见说座主大讲得经论。是否。师曰。不敢。祖曰。将甚么讲。师曰。将心讲。祖曰。心如工伎儿。意如和伎者。争解讲得。师抗声曰。心既讲不得。虗空莫讲得么。祖曰。却是虗空讲得。师不肯。便出。将下堦。祖召曰。座主。师回首。祖曰。是甚么。师豁然大悟。便礼拜。祖曰。这钝根阿师。礼拜作么。师曰。某甲所讲经论。将谓无人及得。今日被大师一
  ref: X80n1565_p0115a14（五灯会元）
- text: 问。平生功业。一时冰释。礼谢而退。乃隐于洪州西山。更无消息
  ref: X80n1565_p0115a14（五灯会元）
