id: L::潭州龙牙智才禅师
name: 潭州龙牙智才
school: 杨岐派
teacher: 太平懃
status: draft
bio: 舒州施氏子。早服勤于佛鉴法席。而局务不辞难。名已闻于丛林。及游方迫暮。至黄龙。适死心在三门。问其所从来。既称名。则知为舒州太平才庄主矣。翌日入室。死心问曰。会得最初句。便会末后句。会得末后句。便会最初句。最初末后。拈放一边。百丈野狐话作么生会。师曰。入户已知来见解。何须更举轹中泥。心曰。新长老死在上座手里也。师曰。语言虽有异。至理且无差。心曰。如何是无差底事。师曰。不扣黄龙角。焉知颔下珠。心便打。初住岳麓。开堂日
sayings:
- text: 僧问。德山棒。临济喝。今日请师为拈掇。师曰。苏噜苏噜。曰。苏噜苏噜。还有西来意也无。师曰。苏噜苏噜。由是丛林呼为才苏噜。后迁龙牙。因钦宗皇帝登位。众官请
  ref: X80n1565_p0772b08（五灯会元）
- text: 上堂。祝圣已。就座。拈拄杖卓一下曰。朝奉疏中道。本来奥境。诸佛妙场。适来拄杖子已为诸人说了也。于斯悟去。理无不显。事无不周。如或未然。不免别通个消息。舜日重明四海清。满天和气乐升平。延祥拄杖生欢喜。掷地山呼万岁声。掷拄杖。下座
  ref: X80n1565_p0772b08（五灯会元）
- text: 上堂。弹指一下曰。弹指圆成八万门。刹那灭却三祇劫。若也见得行得。健即经行困即歇。若也不会。两个鸬󰭇扛个鳖
  ref: X80n1565_p0772b08（五灯会元）
- text: 上堂。举死心和尚小参曰。若论此事。如人家有三子。第一子聪明智慧。孝养父母。接待往来。主掌家业。第二子凶顽狡猾。贪淫嗜酒。倒街卧巷。破坏家业。第三子盲聋喑痖。菽麦不分。是事不能。祇会吃饭。三人中黄龙要选一人用。更有四句。死中有活。活中有死。死中常死。活中常活。将此四句。验天下衲僧。师曰。唤甚么作四句。三人姓甚名谁。若也识得。与黄龙把手并行。更无纤毫间隔。如或未然。不免借水献华去也。三人共体用非用。四句同音空不空。欲识三人并四句。金乌初出一团红。师居龙牙十三载。以清苦莅众。衲子敬畏。大帅席公震迁住云溪。经四稔。绍兴戊午八月望。俄集众付寺事。仍书偈曰。戊午中秋之日。出家住持事毕。临行自己尚无。有甚虗空可觅。其垂训如常。二十三日。再集众。示问曰。涅槃生死。尽是空华。佛及众生。并为增语。汝等诸人。合作么生。众皆下语不契。师喝曰。苦。苦。复曰。白云涌地。明月当天。言讫冁然而逝。火浴获设利五色。并灵骨塔于寺之西北隅
  ref: X80n1565_p0772b08（五灯会元）
