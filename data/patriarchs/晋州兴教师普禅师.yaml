bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0302b08。
sayings:
- text: 僧问。盈龙宫溢海藏真诠即不
  ref: X80n1565_p0302b08（五灯会元）
- text: 问。如何是教外别传底法。师曰。眼里耳里鼻里。曰。祇此便是否。师曰。是甚么。僧便喝。师亦喝
  ref: X80n1565_p0302b08（五灯会元）
- text: 问。僧近离甚处。曰。下寨。师曰。还逢著贼么。曰。今日捉下。师曰。放汝三十棒
  ref: X80n1565_p0302b08（五灯会元）
