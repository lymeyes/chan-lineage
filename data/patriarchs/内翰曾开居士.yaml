id: 内翰曾开居士
name: 内翰曾开
school: 杨岐派
teacher: 灵隐远
status: draft
bio: 字天游。久参圆悟。暨往来大慧之门有日矣。绍兴辛未。佛海补三衢光孝。公与超然居士赵公访之。问曰。如何是善知识。海曰。灯笼露柱。猫儿狗子。公曰。为甚么赞即欢喜。毁即烦恼。海曰。侍郎曾见善知识否。公曰。某三十年参
sayings:
- text: 问。何言不见。海曰。向欢喜处见。烦恼处见。公拟议。海震声便喝。公拟对。海曰。开口底不是。公罔然。海召曰。侍郎向甚么处去也。公猛省。遂点头。说偈曰。咄哉瞎驴。丛林妖孽。震地一声。天机漏泄。有人更问意如何。拈起拂子劈口截。海曰。也祇得一橛
