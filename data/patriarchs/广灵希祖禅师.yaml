id: 广灵希祖禅师
name: 广灵希祖
alias: 广灵祖
school: —
teacher: —
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《续传灯录》T51n2077_p0557a09。
sayings:
- text: 上堂曰。灵光鉴彻物我全收。照体独存前后俱绝。由是无为变化应量千差。托质殊分混同一性。故我元首明哉股肱良哉。法以时遇道在中兴。建大法幢作大佛事。足可称扬。所以正观绝迹名相互分。寂听非闻圆音普应。霜钟露鼓主伴交参。宝殿琼楼听说斯显。六街三市遍处庄严。柳陌花衢寅昏佛事。圣凡交会士庶锵锵。帝网圆融虚明互照。何必南方独迈遍扣诸门历涉艰辛。是非未决。而今重重华藏无尽法门。触目见成何须拟议。然虽如是钝置祖风。良久曰。九年少室谁知已。一句流通万古传。又
  ref: T51n2077_p0557a09（续传灯录）
- text: 示众曰。严陵台畔七里滩头。直须钓鳌钓鲸。岂止摝𫚥摝蚬。随流放旷任性浮沈。停舟月上波心。举棹沤生水面。敢问大众。不触波澜一句作么生会。良久曰。时人只看丝纶上。不见芦花对蓼江。资寿除岩禅师寿州资寿圆澄岩禅师
  ref: T51n2077_p0557a09（续传灯录）
- text: 僧问。大藏教中还有奇特事也无。师曰。只恐汝不信。云如何即是。师曰。黑底是墨黄底是纸。曰谢师答话。师曰。领取钩头意。莫认定盘星。乃曰。云生谷口月满长川。樵父斫深园。渔翁钓沙岛。到这里便是吴道子张僧繇。亦无尔下手处。良久曰。归堂问取圣僧去。下座。又曰。乾坤肃静海晏河清。风不鸣条雨不破块。春生夏长秋收冬藏。这个是世间法。作么生是佛法。良久曰。欲得不招无间业。莫谤如来正法轮。珍重。又
  ref: T51n2077_p0557a09（续传灯录）
- text: 上堂。良久曰。宗乘妙诀即今为说。山高水深寒风凛冽。祖师西来道个休歇。敢问诸人。作么生是休歇处。还会么。寒则围炉座。闲时任性眠
  ref: T51n2077_p0557a09（续传灯录）
