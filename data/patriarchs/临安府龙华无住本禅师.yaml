id: 临安府龙华无住本禅师
name: 临安府龙华无住本
school: 黄龙派
teacher: 育王介谌禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0719b18。
sayings:
- text: 上堂。举。云门大师拈起胡饼曰。我祇供养两浙人。不供养向北人。众无语。门自代曰。天寒日短。两人共一椀。师曰。韶阳老汉。言中有响。痛处著锥。检点将来。翻成毒药。诸人要会么。半在河南半河北。一片虗凝似墨黑。冷地思量愁杀人。叵耐云门这老贼。贼。贼。下座。更不巡堂
  ref: X80n1565_p0719b18（五灯会元）
