id: 保宁圆玑禅师
name: 保宁圆玑
alias: 保宁玑
school: 黄龙派
teacher: 黄龙慧南禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《续传灯录》T51n2077_p0574a16。
sayings:
- text: 僧问。生死到来如何回避。师曰。堂中瞌睡寮里抽解。曰便恁么时如何。师曰。须知有转身一路。曰如何是转身一路。师曰。倾出尔脑髓拽脱尔鼻孔。曰便从今日无疑去也。师曰作么生会。曰但知行好事不用问前程。师曰。须是恁么
  ref: T51n2077_p0574a16（续传灯录）
- text: 上堂。道源不远性海非遥。但向己求莫从他觅。古人恁么说话。大似认奴作郎指鹿为马。若是翠岩即不然也。不向己求亦不从他觅。何故双眉本来自横。鼻孔本来自直。直饶说得天花乱坠顽石点头。算来多虚不如少实。且道如何是少实底事。良久曰。冬瓜直儱侗。瓠子曲弯弯
  ref: T51n2077_p0574a16（续传灯录）
- text: 上堂。春雨微微百事皆宜。禾苗发秀蔬菜得时。阿难如合掌迦叶亦攒眉。直饶灵山会上拈花微笑。算来犹涉离微。争似三家村里老翁深耕浅种各知其时。有事当面便说。谁管瞬目扬眉。更有一般奇特事。末后一著更须知。击拂子下座
  ref: T51n2077_p0574a16（续传灯录）
- text: 上堂。广寻文义镜里求形。息念观空水中捉月。单传心印特地多端。德山临济枉用工夫。石巩子湖翻成特地。若是保宁总不恁么。但自随缘饮啄。一切寻常深遁白云。甘为无学之者。敢问诸人。保宁毕竟寻何报答四恩三有。良久曰。愁人莫向愁人说。说向愁人愁杀人。师示寂阇维有终不坏者。二糁以五色舍利塔于雨花台之左
  ref: T51n2077_p0574a16（续传灯录）
