bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0551b08。
sayings:
- text: 上堂。雪满寒窗。烧尽丹霞木佛。冰交野渡。冻杀陕府铁牛。直得寒灰发焰。片雪不留。任运纵横。现成受用。诸禅德要会么。衲帔蒙头坐。冷煖了无知
  ref: X80n1565_p0551b08（五灯会元）
