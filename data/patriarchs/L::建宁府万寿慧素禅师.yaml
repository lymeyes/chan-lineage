id: L::建宁府万寿慧素禅师
name: 建宁府万寿慧素
school: —
teacher: 泐潭祥
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0464b04。
sayings:
- text: 上堂。僧问。劫火洞然。大千俱坏。未审这个还坏也无。大随曰坏。修山主曰不坏。未审孰是孰非。师曰。一坏一不坏。笑杀观自在。师子蓦𫜪人。狂狗尽逐块。复曰。会么。曰。不会。师曰。漆桶不快。便下座。一日。有僧来作礼
  ref: X80n1565_p0464b04（五灯会元）
- text: 师问。甚处来。曰。和尚合知某来处。师曰。湖南担屎汉。江西刈禾客。曰。和尚真人天眼目。某在大沩充园头。东林作藏主。师打三棒。喝出。绍兴二十三年六月朔。沐浴趺坐。书偈曰。昨夜风雷忽尔。露柱生出两指。天明笑倒灯笼。拄杖依前扶起。拂子𨁝跳过流沙。夺转胡僧一只履。于是俨然而逝
  ref: X80n1565_p0464b04（五灯会元）
