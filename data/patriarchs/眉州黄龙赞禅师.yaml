id: 眉州黄龙赞禅师
name: 眉州黄龙赞
school: 黄龙派
teacher: 云门文偃禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0576b11。
sayings:
- text: 僧问。如何是和尚关棙子。师曰。少人踏得著。曰。忽踏得著时如何。师曰。汝试进前看。僧便喝。师便打。问僧。近离甚处。曰。香林。师曰。在彼多少时。曰。六年。师曰。世尊在雪山六年。证无上菩提。汝在香林六年。成得个甚么。僧无语。师曰。移厨吃饭汉
  ref: X80n1565_p0576b11（五灯会元）
