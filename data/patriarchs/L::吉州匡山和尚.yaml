bio: 师有示徒颂曰。匡山路匡山路岩崖崄峻人难措游人拟议隔千山一句分明超佛祖又有白牛颂曰。我有古坛真白牛父子藏来经几秋出门直透孤峰顶回来暂跨虎谿头
