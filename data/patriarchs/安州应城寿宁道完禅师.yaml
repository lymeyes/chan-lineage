id: 安州应城寿宁道完禅师
name: 安州应城寿宁道完
school: 黄龙派
teacher: 褒亲有瑞禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0704a12。
sayings:
- text: 僧问。云从龙。风从虎。未审和尚从个甚么。师曰。一字空中画。曰。得恁么奇特。师曰。千手大悲提不起
  ref: X80n1565_p0704a12（五灯会元）
- text: 问。十方国土中。唯有一乘法。如何是一乘法。师曰。斗量不尽。曰。恁么则动容扬古路。不堕悄然机。师曰。作么生是悄然机。僧举头看
  ref: X80n1565_p0704a12（五灯会元）
- text: 师举起拂子。僧喝一喝。师曰。大好悄然
  ref: X80n1565_p0704a12（五灯会元）
- text: 上堂。古人见此月。今人见此月。此月镇常存。古今人还别。若人心似月。碧潭光皎洁。决定是心源。此说更无说。咄
  ref: X80n1565_p0704a12（五灯会元）
- text: 上堂。诸禅德。三冬告尽。腊月将临。三十夜作么生祇准。良久。曰。衣穿瘦骨露。屋破看星眠
  ref: X80n1565_p0704a12（五灯会元）
