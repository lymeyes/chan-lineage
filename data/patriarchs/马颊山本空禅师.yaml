id: 马颊山本空禅师
name: 马颊山本空
school: 青原系
teacher: 大颠通禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0180a11。
sayings:
- text: 上堂。祇这施为动转。还合得本来祖翁么。若合得。十二时中无虗弃底道理。若合不得。吃茶说话往往唤作茶话在。僧便
  ref: X80n1565_p0180a11（五灯会元）
- text: 问。如何免得不成茶话去。师曰。你识得口也未。曰。如何是口。师曰。两片皮也不识。曰。如何是本来祖翁。师曰。大众前不要牵爷恃娘。曰。大众欣然去也。师曰。你试点大众性看。僧作礼。师曰。伊往往道一性一切性在。僧欲进语。师曰。孤负平生行脚眼
  ref: X80n1565_p0180a11（五灯会元）
- text: 问。去却即今言句。请师直指本来性。师曰。你迷源来得多少时。曰。即今蒙和尚指示。师曰。若指示你。我即迷源。曰。如何即是。师示颂曰。心是性体。性是心用。心性一如。谁别谁共。妄外迷源。祇者难洞。古今凡圣。如幻如梦
  ref: X80n1565_p0180a11（五灯会元）
