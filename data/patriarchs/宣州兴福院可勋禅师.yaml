id: 宣州兴福院可勋禅师
name: 宣州兴福院可勋
school: 法眼宗
teacher: 法眼文益禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0365b08。
sayings:
- text: 僧问。如何是兴福正主。师曰。阇黎不识。曰。莫祇这便是么。师曰。纵未歇狂。头亦何失
  ref: X80n1565_p0365b08（五灯会元）
- text: 问。如何是道。师曰。勤而行之
  ref: X80n1565_p0365b08（五灯会元）
- text: 问。何云法空。师曰。不空。有偈
  ref: X80n1565_p0365b08（五灯会元）
- text: 示众曰。秋江烟岛晴。鸥鹭行行立。不念观世音。争知普门入
  ref: X80n1565_p0365b08（五灯会元）
