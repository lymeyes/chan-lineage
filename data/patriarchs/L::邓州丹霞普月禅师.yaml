id: L::邓州丹霞普月禅师
name: 邓州丹霞普月
school: 法眼宗
teacher: 净因成
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0542b12。
sayings:
- text: 上堂。威音已前。谁当辨的。然灯已后。孰是知音。直饶那畔承当。未免打作两橛。纵向这边行履。也应未得十全。良由杜口毗耶。已是天机漏泄。任使掩室摩竭。终须缝罅离披。休云体露真常。直是纯清绝点。说甚皮肤脱落。自然独运孤明。虽然似此新鲜。未称衲僧意气。直得五眼齐开。三光洞启。从此竿头丝线。自然不犯波澜。须明转位回机。方解入󳙭垂手。所以道。任使板齿生毛。莫教眼睛顾著。认著则空花缭乱。言之则语路参差。既然如是。敢问诸人。不犯锋铓一句作么生道。良久曰。半夜乌龟眼豁开。万象晓来都一色
  ref: X80n1565_p0542b12（五灯会元）
