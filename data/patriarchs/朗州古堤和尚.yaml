id: 朗州古堤和尚
name: 朗州古堤
school: —
teacher: 章敬𣍯禅师
status: draft
bio: 寻常见僧来。但曰。去。汝无佛性。僧无对。或有对者。莫契其旨。仰山到参。师曰。去。汝无佛性。山叉手近前三步应喏。师笑曰。子甚么处得此三昧来。山曰。我从耽源处得名。沩山处得地。师曰。莫是沩山的子么。山曰。世谛即不无。佛法即不敢。山却
sayings:
- text: 问。和尚从甚处得此三昧。师曰。我从章敬处得此三昧。山叹曰。不可思议。来者难为凑泊
