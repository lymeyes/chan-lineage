id: 平江府宝华普鉴佛慈禅师
name: 平江府宝华普鉴佛慈
school: 黄龙派
teacher: 宝峰文禅师
status: draft
bio: 本郡周氏子。幼不茹荤。依景德寺清智下发。十七游方。初谒觉印英禅师。不契。遂扣真净之室。净举石霜䖍侍者话问之。释然契悟。作偈曰。枯木无华几度秋。断云犹挂树梢头。自从斗折泥牛角。直至如今水逆流。净肯之。命侍巾钵。晚徇众开法宝华。次移高峰
sayings:
- text: 上堂。参禅别无奇特。祇要当人命根断。疑情脱。千眼顿开。如大洋海底辊一轮赫日。上升天门照破四天之下。万别千差。一时明了。便能握金刚王宝剑。七纵八横。受用自在。岂不快哉。其或见谛不真。影像仿佛。寻言逐句。受人指呼。驴年得快活去。不如屏净尘缘。竖起脊梁骨。著些精彩。究教七穿八穴。百了千当。向水边林下长养圣胎。亦不枉受人天供养。然虽如是。卧云门下。有个铁门限。更须猛著气力。跳过始得。拟议之间。堕坑落壍。以拂子击禅床。下座
  ref: X80n1565_p0683a09（五灯会元）
- text: 上堂。月圆。伏惟三世诸佛。狸奴白牯。各各起居万福。时中淡薄。无可相延。切希宽抱。老水牯牛近日亦自多病多恼。不甘水草。遇著暖日和风。当下和身便倒。教渠拽杷牵犂。直是摇头摆脑。可怜万顷良田。一时变为荒草
  ref: X80n1565_p0683a09（五灯会元）
