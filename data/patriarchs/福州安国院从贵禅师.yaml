id: 福州安国院从贵禅师
name: 福州安国院从贵
school: —
teacher: 安国瑫禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0299b05。
sayings:
- text: 僧问。禅宫大敞。法侣云臻。向上一路。请师决择。师曰。素非时流
  ref: X80n1565_p0299b05（五灯会元）
- text: 上堂。禅之与道。拈向一边著。佛之与祖。是甚么破草鞋。恁么告报。莫屈著诸人么。若道屈著。即且须行脚。若道不屈著。也须合取口始得。珍重
  ref: X80n1565_p0299b05（五灯会元）
- text: 上堂。直是不遇梁朝。安国也谩人不过。珍重
  ref: X80n1565_p0299b05（五灯会元）
- text: 僧问。请师举唱宗乘。师曰。今日打禾。明日搬柴
  ref: X80n1565_p0299b05（五灯会元）
- text: 问。牛头未见四祖时如何。师曰。香炉对绳床。曰。见后如何。师曰。门扇对露柱
  ref: X80n1565_p0299b05（五灯会元）
- text: 问。如何是和尚家风。师曰。若问家风。即答家风。曰。学人不问家风时作么生。师曰。胡来汉去
  ref: X80n1565_p0299b05（五灯会元）
- text: 问。省要处乞师一言。师曰。还得省要也未。复曰。纯陀献供。珍重
  ref: X80n1565_p0299b05（五灯会元）
