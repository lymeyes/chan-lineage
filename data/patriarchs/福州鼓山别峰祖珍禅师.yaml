id: 福州鼓山别峰祖珍禅师
name: 福州鼓山别峰祖珍
school: 黄龙派
teacher: 上封本才禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《续传灯录》T51n2077_p0674b25。
sayings:
- text: 僧问。赵州绕禅床一匝转藏已竟此理如何。师曰。画龙看头画蛇看尾。曰婆子道。此来请转全藏为甚么只转得半藏。此意又且如何。师曰。人无远虑必有近忧。曰未审甚么处是转半藏处。师曰。不是知音者徒劳话。岁寒
  ref: T51n2077_p0674b25（续传灯录）
- text: 上堂。寻牛须访迹。学道贵无心。迹在牛还在无心道易寻。竖起拂子曰。这个是迹。牛在甚么处。直饶见得头角分明。鼻孔也在法石手里
  ref: T51n2077_p0674b25（续传灯录）
- text: 上堂。向上一路千圣不传。卓拄杖曰。恁么会得十万八千。毕竟如何。桃红李白蔷薇紫。问著春风总不知
  ref: T51n2077_p0674b25（续传灯录）
- text: 示众云。大道只在目前。要且目前难睹。欲识大道真体。不离声色言语。卓拄杖云。这个是声。竖起拄杖云。这个是色。唤甚么作大道真体。直饶向这里见得。也是郑州出曹门
  ref: T51n2077_p0674b25（续传灯录）
- text: 示众。若论此事如人吃饭饱则便休。若也不饱必有思食之心。若也过饱又有伤心之患。到这里作么生得恰好去。良久云。且归岩下宿同看月明时
  ref: T51n2077_p0674b25（续传灯录）
