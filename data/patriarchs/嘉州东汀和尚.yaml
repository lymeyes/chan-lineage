bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0513a07。
sayings:
- text: 僧问。如何是向去底人。师曰。石女纺麻缕。曰。如何是却来底人。师曰。扇车关棙断
  ref: X80n1565_p0513a07（五灯会元）
- text: 问。遍界是佛身。教某甲甚么处立。师曰。孤峰顶上木人叫。红焰辉中石马嘶
  ref: X80n1565_p0513a07（五灯会元）
