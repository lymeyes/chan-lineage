bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0308b02。
sayings:
- text: 上堂。诸上座。多少无事。十二时中在何世界安身立命。且子细点检看。何不觅个歇处。因甚么却与别人点检。若恁么去。早落第二头也。时有
  ref: X80n1565_p0308b02（五灯会元）
- text: 僧问。承师有言。恁么去早落第二头。学人总不恁么上来。如何辩白。师曰。汝却作家。曰。恁么则今日得遇于师也。师曰。且莫诈明头
  ref: X80n1565_p0308b02（五灯会元）
