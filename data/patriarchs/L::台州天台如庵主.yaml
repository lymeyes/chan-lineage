id: L::台州天台如庵主
name: 台州天台如
school: 云门宗
teacher: 本觉一
status: draft
bio: 久依法真。因看云门东山水上行语。发明己见。师隐故山。猿鹿为伍。郡守闻其风。遣使逼令住持。师作偈曰。三十年来住此山。郡符何事到林间。休将锁锁尘寰事。换我一生闲又闲。遂焚其庐竟不知所止
