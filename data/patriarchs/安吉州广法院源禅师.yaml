id: 安吉州广法院源禅师
name: 安吉州广法院源
school: —
teacher: 石霜圆
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0445a07。
sayings:
- text: 僧问。如何是祖师西来意。师曰。砖头瓦片
  ref: X80n1565_p0445a07（五灯会元）
- text: 问。闹中取静时如何。师曰。冤不可结
  ref: X80n1565_p0445a07（五灯会元）
- text: 问。如何是正法眼。师曰。眉毛下。曰。便与么会时如何。师曰。瞳儿笑点头
  ref: X80n1565_p0445a07（五灯会元）
- text: 问。如何是向上事。师曰。日月星辰。曰。如何是向下事。师曰。地狱镬汤
  ref: X80n1565_p0445a07（五灯会元）
- text: 问。万里无云时如何。师曰。猢狲忍饿。曰。乞师拯济。师曰。甚么火色
  ref: X80n1565_p0445a07（五灯会元）
- text: 问。古人拈槌举拂。意旨如何。师曰。白日无闲人。曰。如何承当。师曰。如风过耳
  ref: X80n1565_p0445a07（五灯会元）
- text: 问。握剑当胸时如何。师曰。老鸦成队。曰。正是和尚见处。师曰。蛇穿鼻孔。僧拂袖便出。师曰。大众相逢
  ref: X80n1565_p0445a07（五灯会元）
- text: 问。从上诸圣向甚么处行履。师曰。十字街头。曰。与么则败缺也。师曰。知你不到这田地。曰。到后如何。师曰。家常茶饭
  ref: X80n1565_p0445a07（五灯会元）
- text: 问。祖意教意。是同是别。师曰。干姜附子。曰。与么则不同也。师曰。冰片雪团
  ref: X80n1565_p0445a07（五灯会元）
- text: 上堂。春雨微微。檐头水滴。闻声不悟。归堂面壁
  ref: X80n1565_p0445a07（五灯会元）
- text: 上堂。若论大道。直教杼山无开口处。你诸人试开口看。僧便
  ref: X80n1565_p0445a07（五灯会元）
- text: 问。如何是大道。师曰。担不起。曰。为甚么担不起。师曰。大道
  ref: X80n1565_p0445a07（五灯会元）
- text: 上堂。若论此事。切莫道著。道著即头角生。有僧出曰。头角生也。师曰。祸事。曰。某甲罪过。师曰。龙头蛇尾。伏惟珍重。师元丰八年十月十二晚。忽书偈曰。雪𩯭霜髭九九年。半肩毳衲尽诸缘。廓然笑指浮云散。玉兔流光照大千。掷笔而寂
  ref: X80n1565_p0445a07（五灯会元）
