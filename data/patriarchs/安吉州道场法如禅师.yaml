id: 安吉州道场法如禅师
name: 安吉州道场法如
school: 黄龙派
teacher: 云盖智
status: draft
bio: 衢州徐氏子。参云盖。悟汾阳十智同真话。寻常多说十智同真。故丛林号为如十同也。水庵圆极皆依之。圆极尝赞之曰。生铁面皮难凑泊。等闲举步动乾坤。戏拈十智同真话。不负黄龙嫡骨孙
sayings:
- text: 上堂。知见立知。即无明本。知见无见。斯即涅槃。无漏真净。云何是中。更容他物。释迦老子和身放倒。后代儿孙如何接续。要会么。通玄不是人间世。满目青山何处寻
  ref: X80n1565_p0689b02（五灯会元）
