bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0217a01。
sayings:
- text: 僧问。供养百千诸佛。不如供养一无心道人。未审诸佛有何过。无心道人有何德。师曰。雪深宜近火。身煖觉春迟
  ref: X80n1565_p0217a01（五灯会元）
- text: 问。贫子献珠时如何。师曰。甚么处得来
  ref: X80n1565_p0217a01（五灯会元）
- text: 问。如何是道。师曰。回车有分
  ref: X80n1565_p0217a01（五灯会元）
