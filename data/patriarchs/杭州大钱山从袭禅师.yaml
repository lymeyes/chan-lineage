id: 杭州大钱山从袭禅师
name: 杭州大钱山从袭
school: —
teacher: 雪峰义存禅师
status: draft
bio: 雪峰之上足也。自本师印解。洞晓宗要。常曰。击关南鼓。唱雪峰歌。后入浙中谒钱王。王钦服道化。命居此山而阐法焉
sayings:
- text: 僧问。不因王请。不因众聚。请师直道西来的的意。师曰。那边师僧过这边著。曰。学人不会。乞师再指。师曰。争得恁么不识好恶
  ref: X80n1565_p0267b08（五灯会元）
- text: 问。闭门造车。出门合辙。如何是闭门造车。师曰。造车即不
  ref: X80n1565_p0267b08（五灯会元）
- text: 问。作么生是辙。曰。学人不会。乞师指示。师曰。巧匠施工。不露斤斧
  ref: X80n1565_p0267b08（五灯会元）
