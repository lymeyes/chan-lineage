id: 金陵天宝和尚
name: 金陵天宝
school: 云门宗
teacher: 披云寂禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0584b18。
sayings:
- text: 僧问。白云抱幽石时如何。师曰。非公境界
  ref: X80n1565_p0584b18（五灯会元）
- text: 问。如何是和尚家风。师曰。列半作三。曰。学人未晓。师曰。鼻孔针筒
  ref: X80n1565_p0584b18（五灯会元）
