id: L::平江府资寿尼无著妙总禅师
name: 平江府资寿尼无著妙总
school: 杨岐派
teacher: 径山杲
status: draft
bio: 丞相苏公颂之孙女也。年三十许。厌世浮休。脱去缘饰。咨参诸老。已入正信。作夏径山。大慧升堂。举药山初参石头。后见马祖因缘。师闻豁然省悟。慧下座。不动居士冯公檝随至方丈。曰。某理会得和尚适来所举公案。慧曰。居士如何。曰。恁么也不得苏𠰷娑婆诃。不恁么也不得㗭哩娑婆诃。恁么不恁么。总不得苏𠰷㗭哩娑婆诃。慧举似师。师曰。曾见郭象注庄子。识者曰。却是庄子注郭象。慧见其语异。复举岩头婆子话问之。师答偈曰。一叶扁舟泛渺茫。呈桡舞棹别宫商。云山海月都抛却。赢得庄周蝶梦长。慧休去。冯公疑其所悟不根。后过无锡。招至舟中。问曰。婆生七子。六个不遇知音。祇这一个。也不消得。便弃水中。大慧老师言。道人理会得。且如何会。师曰。已上供通。并是诣实。冯公大惊。慧挂牌次。师入室。慧
sayings:
- text: 问。古人不出方丈。为甚么却去庄上吃油糍。师曰。和尚放妙总过。妙总方敢通个消息。慧曰。我放你过。你试道看。师曰。妙总亦放和尚过。慧曰。争奈油糍何。师喝一喝而出。于是声闻四方。隆兴改元。舍人张公孝祥来守是郡。以资寿挽开法。入院
  ref: X80n1565_p0801b11（五灯会元）
- text: 上堂。宗乘一唱。三藏绝诠。祖令当行。十方坐断。二乘闻之怖走。十地到此犹疑。若是俊流。未言而谕。设使用移星换斗底手段。施搀旗夺鼓底机关。犹是空拳。岂有实义。向上一路。千圣不传。学者劳形。如猿捉影。灵山付嘱。俯徇时机。演唱三乘。各随根器。始于鹿野苑转四谛法轮。度百千万众。山僧今日。与此界他方。乃佛乃祖。山河大地。草木丛林。现前四众。各转大法轮。交光相罗。如宝丝网。若一草一木。不转法轮。则不得名为转大法轮。所以道。于一毫端现宝王刹。坐微尘里转大法轮。乘时于其中间。作无量无边广大佛事。周遍法界。一为无量。无量为一。小中现大。大中现小。不动步游弥勒楼阁。不返闻入观音普门。情与无情。性相平等。不是神通妙用。亦非法尔如然。于此倜傥分明。皇恩佛恩。一时报足。且道如何是报恩一句。天高群象正。海阔百川朝
  ref: X80n1565_p0801b11（五灯会元）
- text: 示众云。十五日已前则不
  ref: X80n1565_p0801b11（五灯会元）
- text: 问。十五日已后。道将一句来。自代云。日日是好日。师曰。日日是好日。佛法世法尽周毕。不须特地觅幽玄。祇管钵盂两度湿
  ref: X80n1565_p0801b11（五灯会元）
- text: 上堂。黄面老人。横说竖说。权说实说。法说喻说。建法幢。立宗旨。与后人作榜样。为甚么却道始从鹿野苑。终至跋提河。于是二中间。未尝说一字。点检将来。大似抱赃叫屈。山僧今日人事忙冗。且放过一著。便下座。尼
  ref: X80n1565_p0801b11（五灯会元）
- text: 问。如何是夺人不夺境。师曰。野华开满路。遍地是清香。曰。如何是夺境不夺人。师曰。茫茫宇宙人无数。几个男儿是丈夫。曰。如何是人境俱不夺。师曰。处处绿杨堪系马。家家门首透长安。曰。如何是人境两俱夺。师曰。雪覆芦华。舟横断岸。曰。人境已蒙师指示。向上宗乘事若何。师便打
  ref: X80n1565_p0801b11（五灯会元）
