bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0332b07。
sayings:
- text: 僧问。如何是西来意。师曰。好事不出门。恶事行千里。有官人谓师曰。见说江西不立宗。师曰。遇缘即立。曰。遇缘立个甚么。师曰。江西不立宗
  ref: X80n1565_p0332b07（五灯会元）
