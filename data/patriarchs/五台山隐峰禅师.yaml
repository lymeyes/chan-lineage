id: 五台山隐峰禅师
name: 五台山隐峰
school: 南岳系
teacher: 马祖道一禅师
status: draft
bio: 邵武军邓氏子时称邓隐峰。幼若不慧。父母听其出家。初游马祖之门。而未能睹奥。复来往石头。虽两番不捷语见马祖章。而后于马祖言下相契。师问石头。如何得合道去。头曰。我亦不合道。师曰。毕竟如何。头曰。汝被这个得多少时邪。石头刬草次。师在左侧。叉手而立。头飞刬子。向师前刬一株草。师曰。和尚祇刬得这个。不刬得那个。头提起刬子。师接得。便作刬草势。头曰。汝祇刬得那个。不解刬得这个。师无对洞山云。还有堆阜么。师一日推车次。马祖展脚在路上坐。师曰。请师收足。祖曰。已展不缩。师曰。已进不退。乃推车碾损祖脚。祖归法堂。执斧子曰。适来碾损老僧脚底出来。师便出于祖前。引颈。祖乃置斧。师到南泉。睹众僧参次。泉指净瓶曰。铜瓶是境。瓶中有水。不得动著境。与老僧将水来。师拈起净瓶。向泉面前泻。泉便休。师后到沩山。便入堂于上板头解放衣钵。沩闻师叔到。先具威仪。下堂内相看。师见来。便作卧势。沩便归方丈。师乃发去。少间。沩山问侍者。师叔在否。曰。已去。沩曰。去时有甚么语。曰。无语。沩曰。莫道无语。其声如雷。师冬居衡岳。夏止清凉。唐元和中荐登五台。路出淮西。属吴元济阻兵。违拒王命。官军与贼军交锋。未决胜负。师曰。吾当去解其患。乃掷锡空中。飞身而过。两军将士仰观。事符预梦。鬬心顿息。师既显神异。虑成惑众。遂入五台。于金刚窟前将示灭。先问众曰。诸方迁化。坐去卧去。吾尝见之。还有立化也无。曰。有。师曰。还有倒立者否。曰。未尝见有。师乃倒立而化。亭亭然其衣顺体。时众议舁就茶毗。屹然不动。远近瞻睹。惊叹无已。师有妹为尼。时亦在彼。乃拊而咄曰。老兄。畴昔不循法律。死更荧惑于人。于是以手推之。偾然而踣。遂就阇维。收舍利建塔
