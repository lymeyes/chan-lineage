id: 婺州智者元庵真慈禅师
name: 婺州智者元庵真慈
school: 杨岐派
teacher: 东林颜
status: draft
bio: 潼川人。姓李氏。初依成都正法出家。具戒后游讲肆。听讲圆觉。至四大各离。今者妄身当在何处。毕竟无体。实同幻化。因而有省。作颂曰。一颗明珠。在我这里。拨著动著。放光动地。以呈诸讲师。无能晓之者。归以呈其师。遂举狗子无佛性话诘之。师曰。虽百千万亿公案。不出此颂也。其师以为不逊。乃叱出。师因南游。至庐山圆通挂塔。时卍庵为西堂。为众入室。举
sayings:
- text: 僧问云门。拨尘见佛时如何。门云。佛亦是尘。师随声便喝。以手指𮌎曰。佛亦是尘。师复颂曰。拨尘见佛。佛亦是尘。问了答了。直下翻身。劝君更尽一杯酒。西出阳关无故人。又颂尘尘三昧曰。钵里饭。桶里水。别宝昆仑坐潭底。一尘尘上走须弥。明眼波斯笑弹指。笑弹指。珊瑚枝上清风起。卍庵深肯之
