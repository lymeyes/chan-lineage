id: 汾阳昭禅师
name: 汾阳善昭
honorific: 汾阳无德禅师善昭（首山省念法嗣）
school: 临济宗
dynasty: 北宋（947—1024）
region: 汾州太子院（今山西汾阳）
teacher: 首山省念
source_ref: 五灯会元·卷十二·汾阳善昭 / 汾阳无德禅师语录
cbeta: X68n1318（汾阳无德禅师语录）
bio: 首山省念之法嗣，临济宗第六代。少业儒，长而慕道，遍参尊宿，年八十犹行脚不懈。得首山印可后，住汾州太子院，学者辐辏。善昭为禅宗「颂古」体裁之开创者，著《颂古》百余首、及《参学仪》《广智歌》等，以韵语发挥古则公案，下开「文字禅」之盛（后圆悟克勤据雪窦《颂古百则》作《碧岩录》评唱）。法嗣石霜楚圆、琅琊慧觉等，为杨岐、黄龙二派之源。
sayings:
- text: 颂古（举百丈野狐）：「拔楔抽钉，去缚解粘；金毛师子，摆尾摇头。」（以偈发挥古则，开颂古之风）
  ref: 汾阳无德禅师语录·颂古 / 五灯会元·卷十二·汾阳善昭
- text: 师患足疾，有僧问「还有不病者么」，师云「有」。僧云「如何是不病者」，师云「阿㝹阿㝹」。
  ref: 五灯会元·卷十二·汾阳善昭
