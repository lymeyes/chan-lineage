bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0588a18。
sayings:
- text: 僧问。如何是祖师西来意。师曰。眼里不著沙。曰。如何领会。师曰。耳里不著水。曰。恁么则礼拜也。师曰。东家点灯。西家暗坐
  ref: X80n1565_p0588a18（五灯会元）
