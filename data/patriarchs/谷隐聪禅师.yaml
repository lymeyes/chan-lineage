id: 谷隐聪禅师
name: 谷隐聪
school: 临济宗
teacher: 首山省念
bio: 首山省念禅师法嗣，住谷隐寺。继广慧元琏之后与京城士大夫交游，临济宗风赖以流布。
sayings:
- text: 上堂：「释迦不会，弥勒不识；德山棒头，临济喝下。若是英灵汉，闻举便知落处。」
  ref: 五灯会元·卷十二·谷隐聪禅师
- text: 僧问：「如何是佛？」师曰：「待你讳得却向汝道。」
  ref: 五灯会元·卷十二·谷隐聪禅师
status: draft
verify: 据《五灯会元》整理，待 CBETA 逐字校核原文与卷次；师承以谱系父节点为准。
