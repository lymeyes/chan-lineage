id: L::婺州普济子淳圆济禅师
name: 婺州普济子淳圆济
school: 云门宗
teacher: 金山宁
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0640a05。
sayings:
- text: 僧问。摩尼珠人不识。如来藏里亲收得。如何是珠。师曰。不拨自转。曰。如何是藏。师曰。一拨便转。曰。转后如何。师曰。把不住
  ref: X80n1565_p0640a05（五灯会元）
- text: 上堂。雨过山青。云开月白。带雪寒松。摇风庭柏。山僧恁么说话。还有祖师意也无。其或未然。良久曰。看。看
  ref: X80n1565_p0640a05（五灯会元）
