id: 灵源惟清禅师
name: 灵源惟清
honorific: 黄龙灵源惟清禅师（晦堂祖心法嗣，黄龙派第三代）
school: 黄龙派
dynasty: 北宋
region: 舒州太平寺 / 黄龙（今安徽 / 江西）
teacher: 晦堂祖心（黄龙心禅师）
source_ref: 五灯会元·卷十二·黄龙惟清 / 灵源和尚笔语
cbeta: X77n1524 相关章次
bio: 晦堂祖心之法嗣，黄龙派第三代，与死心悟新并称。住舒州太平、黄龙等刹，门风温厚恳切。著有《灵源笔语》，诲徒以「真实工夫、莫弄虚头」为要，为黄龙派后期之柱石。
sayings:
- text: 师示：「学者须先识得本分事，方得自由自在；若本分事不识，只向外驰求，转求转远。」（灵源笔语·诲徒）
  ref: 灵源和尚笔语 / 五灯会元·卷十二·黄龙惟清
- text: 又云：「圣贤之学，非造次可成；须焚膏继晷，积功累德，自然有入处。」
  ref: 灵源笔语
