id: L::广州黄云元禅师
name: 广州黄云元
school: 云门宗
teacher: 云门偃
status: draft
bio: 初开堂日。以手拊绳床曰。诸人还识广大须弥之座也无。若不识。老僧升座去也。师便坐
sayings:
- text: 僧问。如何是大汉国境。师曰。歌谣满路
  ref: X80n1565_p0569b02（五灯会元）
- text: 上堂。古人道。触目未曾无。临机何不道。山僧即不然。触目未曾无。临机道甚么。珍重
  ref: X80n1565_p0569b02（五灯会元）
