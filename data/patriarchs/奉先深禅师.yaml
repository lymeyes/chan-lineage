id: 奉先深禅师
name: 奉先深
school: 云门宗
teacher: 云门文偃禅师
status: draft
bio: 江南主请开堂。才升座。维那白槌曰。法筵龙象众。当观第一义。师便曰。果然不识。钝置杀人。时有僧出
sayings:
- text: 问。如何是第一义。师曰。赖遇适来道了也。曰。如何领会。师曰。速礼三拜。复曰。大众且道。钝置落在阿谁分上。师同明和尚在众时。闻
  ref: X80n1565_p0566b03（五灯会元）
- text: 僧问法眼。如何是色。眼竖起拂子。或曰。鸡冠花。或曰。贴肉汗衫。三人特往请益。问曰。承闻和尚有三种色语。是否。眼曰。是。师曰。鹞子过新罗。便归众。时李王在座下。不肯。乃白法眼曰。寡人来日致茶筵。请二人重新问话。明日茶罢。备彩一箱。剑一口。谓二师曰。上座若问话得是。奉赏杂彩一箱。若问不是。祇赐一剑。法眼升座。师复出
  ref: X80n1565_p0566b03（五灯会元）
- text: 问。今日奉敕问话。师还许也无。眼曰。许。曰。鹞子过新罗。捧彩便行。大众一时散去。时法灯作维那。乃鸣钟集众。僧堂前勘师。众集。灯
  ref: X80n1565_p0566b03（五灯会元）
- text: 问。承闻二上座久在云门。有甚奇特因缘。举一两则来商量看。师曰。古人道白鹭下田千点雪。黄莺上树一枝花。维那作么生商量。灯拟议。师打一座具便归众。师同明和尚到淮河。见人牵网。有鱼从网透出。师曰。明兄俊哉。一似个衲僧相似。明曰。虽然如此。争如当初不撞入网罗好。师曰。明兄你欠悟在。明至中夜。方省
  ref: X80n1565_p0566b03（五灯会元）
