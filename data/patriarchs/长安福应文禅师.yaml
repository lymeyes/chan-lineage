bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0534a04。
sayings:
- text: 上堂。明明百草头。明明祖师意。直下便承当。错认弓为矢。惺惺底筑著磕著。懵懂底和泥合水。龟毛拂逼塞虗空。兔角杖撑天拄地。日射珊瑚林。知心能几几。击禅床下座
  ref: X80n1565_p0534a04（五灯会元）
