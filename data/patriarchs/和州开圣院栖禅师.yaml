id: 和州开圣院栖禅师
name: 和州开圣院栖
school: 云门宗
teacher: 天衣怀
status: draft
bio: 开堂垂语曰。选佛场开人天普会。莫有久历觉场。罢参禅客。出来相见。时有僧出。师曰。作家。作家。僧曰。莫著忙。师曰。元来不是作家。僧提起坐具。曰。看。看。摩竭陀国。亲行此令。师曰。祇今作么生。僧礼拜。师曰。龙头蛇尾
sayings:
- text: 问。东西不辩。南北不分。学人上来。乞师一接。师曰。不接。曰。为甚么不接。师曰。为你东西不辩。南北不分。曰。将谓胡须赤。更有赤须胡。师曰。苏𠰷苏𠰷
  ref: X80n1565_p0622a03（五灯会元）
- text: 问。如何是道。师曰。放汝三十棒。曰。为甚么如此。师曰。杀人可恕。无礼难容
  ref: X80n1565_p0622a03（五灯会元）
- text: 上堂。拈拄杖曰。大众。急著眼看须弥山。画一画百杂碎。南赡部洲打一棒。东倾西侧。不免且收在开圣手中。教伊出气不得。卓一下
  ref: X80n1565_p0622a03（五灯会元）
