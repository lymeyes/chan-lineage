id: 南岳横龙和尚
name: 南岳横龙
school: 青原系
teacher: 瑞岩彦禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0271b06。
sayings:
- text: 僧问。如何是金轮第一句。师曰。钝汉
  ref: X80n1565_p0271b06（五灯会元）
- text: 问。如何是金轮一只箭。师曰。过也
  ref: X80n1565_p0271b06（五灯会元）
- text: 问。如何是祖师灯。师曰。八风吹不灭。曰。恁么则暗冥不生也。师曰。白日没闲人
  ref: X80n1565_p0271b06（五灯会元）
