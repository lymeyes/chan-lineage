id: 雪窦嗣宗禅师
name: 雪窦嗣宗
alias: 雪窦宗
school: 法眼宗
teacher: 天童正觉禅师
status: draft
bio: 徽州陈氏子。幼业经圆具。依妙湛慧禅师诘问次释然契悟。慧以麈尾拂付之。后谒宏智蒙印可其道愈尊。出住普照善权翠岩雪窦
sayings:
- text: 上堂。人人有个鼻孔。唯有善权无鼻孔。为甚么无。二十年前被人掣落了也。人人有两个眼睛。唯有善权无眼睛。为甚么无。被人木槵子换了也。人人有个髑髅。唯有善权无髑髅。为甚么无。借人作屎杓了也。遂召大众曰。鼻孔又无。眼睛又无。髑髅又无。诸人还识善权么。若也不识。是诸人埋没善权。其或未然。更听一颂。㵎底泥牛金贴面。山头石女著真红。系驴橛上生芝草。不是云蔼香炉峰
  ref: T51n2077_p0631a26（续传灯录）
- text: 上堂。翠岩不是不说。只为无个时节。今朝快便难逢。一句为君剖决。露柱本是木头。秤锤只是生铁。诸人若到诸方。莫道山僧饶舌
  ref: T51n2077_p0631a26（续传灯录）
- text: 僧问。莲花未出水时如何。师曰。没却尔鼻孔。曰出水后如何。师曰。穿著尔眼睛。曰如何是正法眼。师曰。乌豆。问如何是君。师曰。磨砻三尺剑待斩不平人。曰如何是臣。师曰。白云闲不彻流水太忙生。曰如何是君臣道合。师曰。云行雨施月皎星辉。问如何是正中偏。师曰。菱花未照前。曰如何是偏中正。师曰。团𪢮无少剩。曰如何是正中来。师曰。遍界绝纤埃。曰如何是兼中至。师曰。啮镞功前戏。曰如何是兼中到。师曰。十道不通耗。问如何是转功就位。师曰。撒手无依全体现。扁舟渔父宿芦花。曰如何是转位就功。师曰。半夜岭头风月静。一声高树老𤠔啼。曰如何是功位齐彰。师曰。出门不踏来时路。满目飞尘绝点埃。曰如何是功位俱隐。师曰。泥牛饮尽澄潭月。石马加鞭不转头。师终于本山。塔全身寺之西南隅
  ref: T51n2077_p0631a26（续传灯录）
