id: L::明州大梅法英祖镜禅师
name: 明州大梅法英祖镜
school: 云门宗
teacher: 九峰韶
status: draft
bio: 本郡张氏子。弃儒试经得度。肄讲延庆。凡义学有困于宿德。辄以诘师。师纵辞辨之。为众所敬。忽曰。名相迂曲。岂吾所宗哉。乃参九峰。峰见器之。与语若久在丛席。因痛札之。师领旨。自尔得誉。住后
sayings:
- text: 上堂。三十六旬之始。七十二候之初。末后句则且置。祇如当头一句。又作么生道。拈拄杖曰。岁朝把笔。万事皆吉。急急如律令。大众。山僧恁么举唱。且道还有祖师意也无。良久曰。记得东村黑李四。年年亲写在门前。卓拄杖。下座。宣和初。敕天下僧尼为德士。虽主法聚议。无一言以回上意。师肆笔解老子。诣进。上覧。谓近臣曰。法英道德经解。言简理诣。于古未有。宜赐入道藏流行。仍就赐冠珮坛诰。不知师意者。往往以其为󰦇谀。明年秋。诏复天下僧尼。师独无改志。至绍兴初。晨起戴桦皮冠。披鹤氅。执象简。穿朱履。使击鼓集众。升座召大众曰。兰芳春谷菊秋篱。物必荣枯各有时。教毁僧尼专奉道。后平道󰦇复僧尼。且道僧尼形相作么生。复取冠
  ref: X80n1565_p0614a10（五灯会元）
- text: 示众曰。吾顶从来似月圆。虽冠其发不成仙。今朝抛下无遮障。放出神光透碧天。掷之于地。随易僧服。提鹤氅曰。如来昔日󳮋皮衣。数载惭将鹤氅披。还我丈夫调御服。须知此物不相宜。掷之。举象简曰。为嫌禅板太无端。岂料遭他象简瞒。今日因何忽放下。普天致仕老仙官。掷之。提朱履曰。达磨携将一只归。儿孙从此赤脚走。借他朱履代麻鞋。休道时难事掣肘。化鹏未遇不如鹍。画虎不成反类狗。掷之。横拄杖曰。今朝拄杖化为龙。分破华山千万重。复倚肩曰。珍重佛心真圣主。好将尧德振吾宗。掷下拄杖。敛目而逝
  ref: X80n1565_p0614a10（五灯会元）
