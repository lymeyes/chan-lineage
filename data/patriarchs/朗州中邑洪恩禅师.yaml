id: 朗州中邑洪恩禅师
name: 朗州中邑洪恩
school: 南岳系
teacher: 马祖道一禅师
status: draft
bio: 每见僧来。拍口作和和声。仰山谢戒。师亦拍口作和和声。仰从西过东。师又拍口作和和声。仰从东过西。师又拍口作和和声。仰当中而立。然后谢戒。师曰。甚么处得此三昧。仰曰。于曹谿印子上脱来。师曰。汝道曹谿用此三昧接甚么人。仰曰。接一宿觉。仰曰。和尚甚处得此三昧。师曰。我于马大师处得此三昧。仰
sayings:
- text: 问。如何得见佛性义。师曰。我与汝说个譬喻。如一室有六窗。内有一猕猴。外有猕猴从东边唤猩猩。猩猩即应。如是六窗俱唤俱应。仰山礼谢。起曰。适蒙和尚譬喻。无不了知。更有一事。祇如内猕猴睡著。外猕猴欲与相见。又且如何。师下绳床。执仰山手作舞曰。猩猩与汝相见了。譬如蟭螟虫。在蚊子眼睫上作窠。向十字街头叫云。土旷人稀。相逢者少云居锡云。中邑当时若不得仰山这一句语。何处有中邑也。崇寿稠云。还有人定得此道理么。若定不得。只是个弄精魂脚手。佛性义在甚么处。玄觉云。若不是仰山。争得见中邑。且道甚么处是仰山得见中邑处
