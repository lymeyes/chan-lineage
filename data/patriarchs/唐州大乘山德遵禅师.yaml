id: 唐州大乘山德遵禅师
name: 唐州大乘山德遵
school: 临济宗
teacher: 谷隐聪
status: draft
bio: 问谷隐曰。古人索火。意旨如何。曰。任他灭。师曰。灭后如何。曰。初三十一。师曰。恁么则好时节也。曰。汝见甚么道理。师曰。今日一场困。隐便打。师乃有颂曰。索火之机实快哉。藏锋妙用少人猜。要会我师亲的旨。红炉火尽不添柴
sayings:
- text: 僧问。世界圆融一句。请师道。师曰。团团七尺余
  ref: X80n1565_p0436b12（五灯会元）
- text: 问。如何是祖师西来意。师曰。鼻大眼深
  ref: X80n1565_p0436b12（五灯会元）
- text: 问。下去又不疑。不知是不是。是即也大奇。便下座
  ref: X80n1565_p0436b12（五灯会元）
