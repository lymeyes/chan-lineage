id: 蕲州广济禅师
name: 蕲州广济
school: 曹洞宗
teacher: 云居道膺禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0501a07。
sayings:
- text: 僧问。疋马单枪时如何。师曰。头落也
  ref: X80n1565_p0501a07（五灯会元）
- text: 问。如何是方外之谭。师曰。汝道甚么
  ref: X80n1565_p0501a07（五灯会元）
- text: 问。如何是广济水。师曰。饮者绝饥渴。曰。恁么则学人不虗到也。师曰。情知你受人安排
  ref: X80n1565_p0501a07（五灯会元）
- text: 问。远远来投。乞师指示。师曰。有口祇解吃饭
  ref: X80n1565_p0501a07（五灯会元）
- text: 问。温伯雪与仲尼相见时如何。师曰。此间无恁么人
  ref: X80n1565_p0501a07（五灯会元）
- text: 问。不识不见。请师道出。师曰。不昧。曰。不昧时作么生。师曰。汝唤作甚么
  ref: X80n1565_p0501a07（五灯会元）
- text: 问。如何是奇特事。师曰。焰里牡丹花
  ref: X80n1565_p0501a07（五灯会元）
- text: 问。如何是无心道人。师曰。丹霞放火烧
  ref: X80n1565_p0501a07（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0501a07），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
