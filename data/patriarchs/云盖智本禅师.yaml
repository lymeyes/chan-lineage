id: 云盖智本禅师
name: 云盖智本
alias: 云盖本
school: 杨岐派
teacher: 白云守端禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《续传灯录》T51n2077_p0604b05。
sayings:
- text: 僧问。诸佛出世天雨四花。和尚出世有何祥瑞。师曰。千闻不如一见。曰见后如何。师曰瞎。问如何是清净法身。师曰。家无小使不成君子。问将心觅心如何觅得。师曰。波斯学汉语。问如何是学人出身处。师曰。雪峰元是岭南人。问素面相呈时如何。师曰。一场丑拙。问人人尽有一面古镜。如何是学人古镜。师曰。打破来向尔道。曰打破了也。师曰。胡地冬抽笋。问古人道。说取行不得底。行取说不得底。未审行不得底作么生说。师曰。口在脚下。曰说不得底作么生行。师曰。踏著舌头。问知师久蕴囊中宝。今日当场略借看。师曰。适来恰被人借去
  ref: T51n2077_p0604b05（续传灯录）
- text: 上堂。去者鼻孔辽天。来者脚踏实地。且道祖师意向甚么处著。良久曰。长恨春归无觅处。不知流入此中来
  ref: T51n2077_p0604b05（续传灯录）
- text: 上堂。高台巴鼻开口便是。若也便是有甚巴鼻。月冷风高。水清山翠
  ref: T51n2077_p0604b05（续传灯录）
- text: 上堂。以楔出楔有甚休歇。欲得休歇以楔出楔。喝一喝
  ref: T51n2077_p0604b05（续传灯录）
- text: 上堂。高声唤侍者。侍者应诺。师曰。大众集也未。侍者曰。大众已集。师曰。那一个为甚么不来赴参。侍者无语。师曰。到即不点
  ref: T51n2077_p0604b05（续传灯录）
- text: 上堂。满口道不出。句句甚分明。满目觑不见。山山叠乱青。鼓声犹不会。何况是钟鸣。喝一喝
  ref: T51n2077_p0604b05（续传灯录）
- text: 上堂。祖翁卓卓荦荦。儿孙龌龌龊龊。有处藏头没处露角。借问衲僧如何摸索
  ref: T51n2077_p0604b05（续传灯录）
- text: 上堂。横按拄杖曰。牙如刀剑面如铁眼。放电光光不歇。手把蒺蔾一万斤。等闲敲落天边月。卓一下
  ref: T51n2077_p0604b05（续传灯录）
- text: 僧问。如何是𫜪人师子。师曰。五老峰前。曰这个岂会𫜪人。师曰。今日拾得性命
  ref: T51n2077_p0604b05（续传灯录）
- text: 上堂。头戴须弥山。脚踏四大海。呼吸起风雷。动用生五彩。若能识得渠。一任岁月改。且道谁人识得渠。喝一喝云。田库奴
  ref: T51n2077_p0604b05（续传灯录）
