bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0810b18。
sayings:
- text: 上堂。举永嘉到曹谿因缘。乃曰。要识永嘉么。掀翻海岳求知己。要识祖师么。拨动乾坤建太平。二老不知何处去。卓拄杖曰。宗风千古播嘉声
  ref: X80n1565_p0810b18（五灯会元）
