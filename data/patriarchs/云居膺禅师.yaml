id: 云居膺禅师
name: 云居道膺
school: 曹洞宗
teacher: 洞山价
bio: 洞山良价禅师法嗣，曹洞宗重要传人，住云居山（今江西永修）。机用绵密，为曹洞宗在江西弘化之柱石，门下出佛印了元等多人。
sayings:
- text: 僧问：「如何是祖师意？」师（云居）曰：「阇黎，这里是什么意？」
  ref: 五灯会元·卷十三·云居道膺禅师
- text: 师示众曰：「若立一尘，家国兴盛；不立一尘，家国丧亡。」
  ref: 五灯会元·卷十三·云居道膺禅师
status: draft
