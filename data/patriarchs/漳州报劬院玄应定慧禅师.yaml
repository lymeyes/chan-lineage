id: 漳州报劬院玄应定慧禅师
name: 漳州报劬院玄应定慧
school: —
teacher: 白龙希禅师
status: draft
bio: 泉州晋江吴氏子。漳州刺史陈文颢创院。请师开法。僧如
sayings:
- text: 问。何是第一义。师曰。如何是第一义。曰。学人请益。师何以倒问学人。师曰。汝适来请益甚么。曰。第一义。师曰。汝谓之倒问邪
  ref: X80n1565_p0309b15（五灯会元）
- text: 问。如何是古佛道场。师曰。今夏堂中。千五百僧。开宝八年将顺世。先七日书辞陈公。仍示偈曰。今年六十六。世寿有延促。无生火炽然。有为薪不续。出谷与归源。一时俱备足。及期诫门人曰。吾灭后不得以丧服哭泣。言讫而寂
  ref: X80n1565_p0309b15（五灯会元）
