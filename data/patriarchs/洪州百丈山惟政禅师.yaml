id: 洪州百丈山惟政禅师
name: 洪州百丈山惟政
school: 南岳系
teacher: 马祖道一禅师
status: draft
bio: 有老宿见日影透窗。问师。为复窗就日。日就窗。师曰。长老房中有客。归去好。师问南泉。诸方善知识。还有不说似人底法也无。曰。有。师曰。作么生。曰。不是心。不是佛。不是物。师曰。恁么则说似人了也。曰。某甲即恁么。和尚作么生。师曰。我又不是善知识。争知有说不说底法。曰。某甲不会。请和尚说。师曰。我太煞。与汝说了也
sayings:
- text: 僧问。如何是佛佛道齐。师曰。定也。师因入京。路逢官人吃饭。忽见驴鸣。官人召曰。头陀
  ref: X80n1565_p0105b08（五灯会元）
- text: 师举头。官人却指驴。师却指官人法眼别云。但作驴鸣
  ref: X80n1565_p0105b08（五灯会元）
