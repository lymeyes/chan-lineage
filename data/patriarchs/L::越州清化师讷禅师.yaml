id: L::越州清化师讷禅师
name: 越州清化师讷
school: —
teacher: 镜清怤
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0297a13。
sayings:
- text: 僧问。十二时中如何得不疑惑去。师曰。好。曰。恁么则得遇于师去也。师曰。珍重。僧来礼拜。师曰。子亦善
  ref: X80n1565_p0297a13（五灯会元）
- text: 问。吾亦善答。曰。恁么则大众久立。师曰。抑逼大众作甚么
  ref: X80n1565_p0297a13（五灯会元）
- text: 问。去却赏罚。如何是吹毛剑。师曰。钱塘江里好渡船
  ref: X80n1565_p0297a13（五灯会元）
- text: 问。如何是西来意。师曰。可煞新鲜
  ref: X80n1565_p0297a13（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0297a13），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
