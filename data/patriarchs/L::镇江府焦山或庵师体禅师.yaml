id: L::镇江府焦山或庵师体禅师
name: 镇江府焦山或庵师体
school: 杨岐派
teacher: 护国元
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0812a11。
sayings:
- text: 示众四喝公案。乃召众曰。这个公案。天下老宿拈掇甚多。第恐皆未尽善。焦山不免四棱著地。与诸人分明注解一遍。如何是踞地师子。咄。如何是金刚王宝剑。咄。如何是探竿影草。咄。如何是一喝不作一喝用。咄。若也未会。拄杖子与焦山吐露看。卓一下曰。笑里有刀。又卓一下曰。毒虵无眼。又卓一下曰。忍俊不禁。又卓一下曰。出门是路。更有一机。举话长老也理会不得
  ref: X80n1565_p0812a11（五灯会元）
- text: 上堂。年年浴佛在今朝。目击迦维路不遥。果是当时曾示现。宜乎恶水蓦头浇
  ref: X80n1565_p0812a11（五灯会元）
- text: 上堂。热月须摇扇。寒来旋著衣。若言空过日。大似不知时
  ref: X80n1565_p0812a11（五灯会元）
- text: 上堂。道生一。无角铁牛眠少室。一生二。祖父开田说大义。二生三。梁间紫燕语呢喃。三生万物。男儿活计离窠窟。多处添。少处减。大虫怕吃生人胆。有若无。实若虗。争掩骊龙明月珠。是则是。祇如焦山坐断诸方舌头一句。作么生道。肚无偏僻病。不怕冷油韲。拍禅床。下座
  ref: X80n1565_p0812a11（五灯会元）
- text: 僧问。如何是即心即佛。师曰。鼎州出狞争神。曰。如何是非心非佛。师曰。闽蜀同风。曰。如何是不是心．不是佛．不是物。师曰。穷坑难满
  ref: X80n1565_p0812a11（五灯会元）
- text: 问。起灭不停时如何。师曰。谢供养
  ref: X80n1565_p0812a11（五灯会元）
- text: 问。我有没弦琴。久居在旷野。不是不会弹。未遇知音者。知音既遇。未审如何品弄。师曰。钟作钟鸣。鼓作鼓响。曰。云门放洞山三顿棒。意旨如何。师曰。和身倒。和身攂。曰。饭袋子。江西湖南便恁么去。又作么生。师曰。泪出痛肠。曰。真金须是红炉煅。白玉还他妙手磨。师曰。添一点。也难为。室中常举苕帚柄。问学者曰。依俙苕帚柄。髣髴赤斑虵。众皆下语不契。有僧请益。师示以颂曰。依俙苕帚柄。髣髴赤斑虵。棒下无生忍。临机不识爷。淳熙己亥八月朔示微疾。染翰别郡守曾公。逮夜半。书偈辞众曰。铁树开华。雄鸡生卵。七十二年。摇篮绳断。掷笔示寂
  ref: X80n1565_p0812a11（五灯会元）
