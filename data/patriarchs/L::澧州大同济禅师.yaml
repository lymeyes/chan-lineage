id: L::澧州大同济禅师
name: 澧州大同济
school: 青原系
teacher: 石头迁
status: draft
bio: 米胡领众来。才欲相见。师便拽转禅床。面壁而坐。米于背后立。少时却回客位。师曰。是即是。若不验破。已后遭人贬剥。令侍者请米来。却拽转禅床便坐。师乃绕禅床一匝。便归方丈。米却拽倒禅床。领众便出。师访庞居士。士曰。忆在母胎时。有一则语。举似阿师。切不得作道理主持。师曰。犹是隔生也。士曰。向道不得作道理。师曰。惊人之句。争得不怕。士曰。如师见解。可谓惊人。师曰。不作道理。却成作道理。士曰。不但隔一生．两生。师曰。粥饭底僧。一任检责。士鸣指三下。师一日见庞居士来。便掩却门曰。多知老翁。莫与相见。士曰。独坐独语。过在阿谁。师便开门。才出被士把住曰。师多知。我多知。师曰。多知且置。闭门开门。卷之与舒。相较几许。士曰。祇此一
sayings:
- text: 问。气急杀人。师默然。士曰。弄巧成拙
  ref: X80n1565_p0171a15（五灯会元）
- text: 僧问。此个法门。如何继绍。师曰。冬寒夏热。人自委知。曰。恁么则蒙分付去也。师曰。顽嚚少智。勔臔多痴
  ref: X80n1565_p0171a15（五灯会元）
- text: 问。十二时中如何合道。师曰。汝还识十二时么。曰。如何是十二时。师曰。子丑寅卯。僧礼拜。师示颂曰。十二时中那事别。子丑寅卯吾今说。若会唯心万法空。释迦．弥勒从兹决。青原下三世青原下三世
  ref: X80n1565_p0171a15（五灯会元）
