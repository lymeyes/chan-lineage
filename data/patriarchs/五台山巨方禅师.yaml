id: 五台山巨方禅师
name: 五台山巨方
school: —
teacher: 北宗秀
status: draft
bio: 安陆人也。姓曹氏。幼禀业于明福院朗禅师。初讲经论。后参禅会。及造北宗。秀问曰。白云散处如何。师曰。不昧。秀又
sayings:
- text: 问。到此间后如何。师曰。正见一枝生五叶。秀默许之。入室侍对。应机无爽。寻至上党寒岭居焉。数岁之间。众盈千数。后于五台山阐化二十余年。示寂。塔于本山
