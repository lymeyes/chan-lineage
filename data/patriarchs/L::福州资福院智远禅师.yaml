id: L::福州资福院智远禅师
name: 福州资福院智远
school: —
teacher: 镜清怤
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0297b10。
sayings:
- text: 问。如何是诸佛出身处。清曰。大家要知。师曰。如斯则众眼难瞒去也。清曰。理能缚豹。师因此发悟玄旨。住后
  ref: X80n1565_p0297b10（五灯会元）
- text: 僧问。师唱谁家曲。宗风嗣阿谁。师曰。雪岭峰前月。镜湖波里明
  ref: X80n1565_p0297b10（五灯会元）
- text: 问。诸佛出世。天雨四华。地摇六动。和尚今日有何祥瑞。师曰。一物不生全体露。目前光彩阿谁知
  ref: X80n1565_p0297b10（五灯会元）
- text: 问。如何是直示一句。师曰。是甚么。师乃曰。还会么。会去即今便了。不会尘沙算劫。祗据诸贤分上。古佛心源。明露现前。匝天遍地。森罗万象。自己家风。佛与众生本无差别。涅槃生死。幻化所为。性地真常。不劳修证。珍重
  ref: X80n1565_p0297b10（五灯会元）
