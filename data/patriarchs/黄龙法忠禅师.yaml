id: 黄龙法忠禅师
name: 黄龙法忠
alias: 黄龙忠
school: 杨岐派
teacher: 龙门清远禅师
status: draft
bio: 四明姚氏子。十九试经得度。习台教悟一心三观之旨。未能泯迹。遍参名宿至龙门。观水磨旋转发明心要。乃述偈曰。转大法轮。目前包裹。更问如何。水推石磨。呈佛眼。眼曰。其中事作么生。师曰。㵎下水长流。眼曰。我有末后一句待分付汝。师即掩耳而去。后至庐山于同安枯树中绝食清坐。宣和间湘潭大旱祷而不应。师跃入龙渊呼曰。业畜当雨一尺雨随至。居南岳每跨虎出游。儒释望尘而拜。住后
sayings:
- text: 上堂。张公吃酒李公醉。子细思量不思议。李公醉醒问张公。恰使张公无好气。无好气不如归家且打睡
  ref: T51n2077_p0668c08（续传灯录）
- text: 上堂。今朝正月半。有事为君断。切忌两眼睛。被他灯火换
  ref: T51n2077_p0668c08（续传灯录）
- text: 上堂。我有一句子。不借诸圣口。不动自己舌。非声气呼吸。非情识分别。假使净名杜口于毘耶。释迦掩室于摩竭。大似掩耳偷铃。未免天机漏泄。直饶德山入门便棒。临济入门便喝。若向牧庵门下。检点将来只得一橛。千种言万般说。只要教君自家歇。一任大地虚空七凹八凸
  ref: T51n2077_p0668c08（续传灯录）
- text: 僧问。如何是佛。师曰。莫向外边觅。曰如何是心。师曰。莫向外边寻。曰如何是道。师曰。莫向外边讨。曰如何是禅。师曰。莫向外边传。曰毕竟如何。师曰。静处萨婆诃。问大众临筵请
  ref: T51n2077_p0668c08（续传灯录）
- text: 师举唱。师竖起拂子。僧曰。乞师再垂方便。师击禅床一下。后示寂塔于香原洞
  ref: T51n2077_p0668c08（续传灯录）
