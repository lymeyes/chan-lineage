bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0144a10。
sayings:
- text: 问。禅宗何有南北之名。对曰。禅门本无南北。昔如来以正法眼付大迦叶。展转相传。至二十八祖菩提达磨。来游此方为初祖。暨第五祖弘忍大师在蕲州东山开法。时有二弟子。一名慧能。受衣法。居岭南为六祖。一名神秀。在北扬化。其后神秀门人普寂者。立秀为第六祖。而自称七祖。其所得法虽一。而开导发悟有顿渐之异。故曰南顿北渐。非禅宗本有南北之号也。帝曰。云何名戒。对曰。防非止恶谓之戒。帝曰。云何为定。对曰。六根涉境。心不随缘名定。帝曰。云何为慧。对曰。心境俱空。照鉴无惑名慧。帝曰。何为方便。对曰。方便者。隐实覆相权巧之门也。被接中下。曲施诱迪谓之方便。设为上根言。舍方便但说无上道者。斯亦方便之谭。乃至祖师玄言。忘功绝谓。亦无出方便之迹。帝曰。何为佛心。对曰。佛者西天之语。唐言觉。谓人有智慧觉照为佛心。心者佛之别名。有百千异号。体唯其一。无形状。非青黄赤白．男女等相。在天非天。在人非人。而现天现人。能男能女。非始非终。无生无灭。故号灵觉之性。如陛下日应万机。即是陛下佛心。假使千佛共传。而不念别有所得也。帝曰。如今有人念佛如何。对曰。如来出世为天人师。善知识随根器而说法。为上根者开最上乘顿悟至理。中下者未能顿晓。是以佛为韦提希权开十六观门。令念佛生于极乐。故经云。是心是佛。是心作佛。心外无佛。佛外无心。帝曰。有人持经念佛。持咒求佛。如何。对曰。如来种种开赞。皆为最上一乘。如百川众流。莫不朝宗于海。如是差别诸数。皆归萨婆若海。帝曰。祖师既契会心印。金刚经云无所得法。如何。对曰。佛之一化。实无一法与人。但
  ref: X80n1565_p0144a10（五灯会元）
- text: 示众人。各各自性。同一法藏。当时然灯如来但印释迦本法而无所得。方契然灯本意。故经云。无我无人。无众生。无寿者。是法平等。修一切善法。不住于相。帝曰。禅师既会祖意。还礼佛转经否。对曰。沙门释子。礼佛转经。盖是住持常法。有四报焉。然依佛戒修身。参寻知识。渐修梵行。履践如来所行之迹。帝曰。何为顿见。何为渐修。对曰。顿明自性。与佛同俦。然有无始染习。故假渐修对治。令顺性起用。如人吃饭。不一口便饱。师是日辩对七刻。赐紫方袍。号圆智禅师。仍𠡠修天下祖塔。各令守护
  ref: X80n1565_p0144a10（五灯会元）
