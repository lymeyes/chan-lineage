name: 白云守端
honorific: 舒州白云守端禅师（杨岐方会法嗣，杨岐派第二代）
school: 杨岐派
dynasty: 北宋（1025—1072）
region: 舒州白云山（今安徽潜山）
teacher: 杨岐方会（杨歧会禅师）
