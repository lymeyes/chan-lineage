cbeta: X77n1524（建中靖国续灯录）相关章次
bio: 杨岐方会之法嗣，杨岐派第二代。幼习儒，后应举不第，乃出家参方。初谒杨岐，杨岐以「我昨日偶然见你，便令人大笑不止，你道因甚笑」勘验，守端疑闷通宵；杨岐复云「你这汉，参禅既不识，又不识羞」，又曰「你譬似一只虾蟆」——守端言下大悟（世称「虾蟆公案」）。后住舒州白云山，门风温厚而机用绵密，以「无缝塔」「麻三斤」等话头接人。五祖法演出其门下，杨岐一脉赖以光大，下启临济宗入宋后之全盛。
sayings:
- text: 虾蟆公案：杨岐问「你学佛法来，我昨日偶然见你，便令人大笑，你道因甚笑」，守端通夕不寐；杨岐曰「你这汉，参禅既不识，又不识羞，更来者里讨分晓」，又云「你譬似一只虾蟆」——守端忽然大悟。
  ref: 五灯会元·卷十九·白云守端
- text: 师上堂：「古人道『譬如按牛头吃草』；若是白云即不然，只教伊牛自吃草，不用按。」（示任运自在、不假强制）
  ref: 五灯会元·卷十九·白云守端
