id: 提刑吴伟明居士
name: 提刑吴伟明
school: 杨岐派
teacher: 大慧宗杲禅师
status: draft
bio: 字元昭。久参真歇了禅师。得自受用三昧。为极致。后访大慧于洋屿庵。随众入室。慧举狗子无佛性话问之。公拟答。慧以竹篦便打。公无对。遂留咨参。一日慧谓曰。不须呈伎俩。直须啐地折．嚗地断。方敌得生死。若祇呈伎俩。有甚了期。即辞去。道次延平。倏然契悟。连书数颂寄慧。皆室中所问者。有曰。不是心。不是佛。不是物。通身一具金锁骨。赵州亲见老南泉。解道镇州出萝卜。慧即说偈证之曰。通身一具金锁骨。堪与人天为轨则。要识临济小厮儿。便是当年白拈贼
