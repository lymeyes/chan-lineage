id: 潭州云盖用清禅师
name: 潭州云盖用清
school: 法眼宗
teacher: 长安规
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0381a06。
sayings:
- text: 僧问。有一人在万丈井底。如何出得。师曰。且喜得相见。曰。恁么则穿云透月去也。师曰。三十三天事。作么生。僧无对。师曰。谩语作么
  ref: X80n1565_p0381a06（五灯会元）
- text: 问。如何是云葢境。师曰。门外三泉井。曰。如何是境中人。师曰。童行仔子。有颂
  ref: X80n1565_p0381a06（五灯会元）
- text: 示众曰。云葢锁口诀。拟议皆脑裂。拍手趁虗空。云露西山月
  ref: X80n1565_p0381a06（五灯会元）
- text: 僧问。如何是锁口诀。师曰。遍天遍地。曰。恁么则石人点头。露柱拍手去也。师曰。一缾净水一炉香。曰。此犹是井底虾蟆。师曰。劳烦大众。师常节饮食。随众二时。但展钵而已。或逾年月。亦不调练服饵。无妨作务。有请必开。即便饱食而亡拘执。至道二年四月二日。示疾而逝
  ref: X80n1565_p0381a06（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0381a06），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
