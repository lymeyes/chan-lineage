id: 蕲州龙华道初禅师
name: 蕲州龙华道初
school: 杨岐派
teacher: 五祖法演禅师
status: draft
bio: 梓之马氏子。为祖侍者有年。住龙华日
sayings:
- text: 上堂曰。鸡见便鬬。犬见便𫜪。殿上鸱吻。终日相对。为甚么却不瞋。便下座。师机辩峻捷。门人罔知造诣。一日谓众曰。昨日离城市。白云空往还。松风清耳目。端的胜人间。召众曰。此是先师末后句。有顷。脱然而逝
  ref: X80n1565_p0749b18（五灯会元）
