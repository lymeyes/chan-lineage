id: 镇州谈空和尚
name: 镇州谈空
school: 临济宗
teacher: 纸衣道者
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0404b10。
sayings:
- text: 僧问。如何是佛。师曰。麻缠纸裹
  ref: X80n1565_p0404b10（五灯会元）
- text: 问。百了千当时如何。师和声便打
  ref: X80n1565_p0404b10（五灯会元）
- text: 问。格外之谭。请
  ref: X80n1565_p0404b10（五灯会元）
- text: 师举唱。师曰。隘路不通风。曰。莫只这便是也无。师乃嘘嘘。际上座际上座行脚到洛京南禅。时有朱行军设斋。入僧堂顾视曰。直下是。遂行香。口不住道。至师面前。师便
  ref: X80n1565_p0404b10（五灯会元）
- text: 问。直下是个甚么。行军便喝。师曰。行军幸是会佛法底人。又恶发作甚么。行军曰。唤作恶发即不得。师便喝。行军曰。钩在不疑之地。师又喝。行军便休。斋退。令客司。请适来下喝僧来。师至。便共行军言论。并不顾诸人。僧录曰。行军适来争容得这僧无礼。行军曰。若是你诸人喝。下官有剑。僧录曰。某等固是不会。须是他晖长老始得。行军曰。若是南禅长老。也未梦见在
  ref: X80n1565_p0404b10（五灯会元）
- text: 僧问。如何是佛法的的大意。师曰。龙腾沧海。鱼跃深潭。曰。毕竟如何。师曰。夜闻祭鬼鼓。朝听上滩歌
  ref: X80n1565_p0404b10（五灯会元）
- text: 问。如何是上座家风。师曰。三脚虾蟆背大象。南岳下七世南岳下七世
  ref: X80n1565_p0404b10（五灯会元）
