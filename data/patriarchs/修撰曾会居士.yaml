id: 修撰曾会居士
name: 修撰曾会
school: 云门宗
teacher: 雪窦重显禅师
status: draft
bio: 幼与明觉同舍。及冠异途。天禧间。公守池州。一日会于景德寺。公遂引中庸大学。参以楞严符宗门语句。质明觉。觉曰。这个尚不与教乘合。况中庸大学邪。学士要径捷理会此事。乃弹指一下曰。但恁么荐取。公于言下领旨。天圣初。公守四明。以书币迎师补雪窦。既至。公曰。某近与清长老商量赵州勘婆子话。未审端的有勘破处也无。觉曰。清长老道个甚么。公曰。又与么去也。觉曰。清长老且放过一著。学士还知天下衲僧出这婆子圈䙌不得么。公曰。这里别有个道处。赵州若不勘破。婆子一生受屈。觉曰。勘破了也。公大笑
