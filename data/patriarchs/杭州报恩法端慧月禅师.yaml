id: 杭州报恩法端慧月禅师
name: 杭州报恩法端慧月
school: 法眼宗
teacher: 天台德韶国师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0369a15。
sayings:
- text: 上堂。数夜与诸上座东语西话。犹未尽其源。今日与诸上座大开方便。一时说却。还愿乐也无。久立。珍重
  ref: X80n1565_p0369a15（五灯会元）
- text: 僧问。学人恁么上来。请师接。师曰。不接。曰。为甚么不接。师曰。为汝太灵利
  ref: X80n1565_p0369a15（五灯会元）
