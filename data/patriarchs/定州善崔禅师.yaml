id: 定州善崔禅师
name: 定州善崔
school: 临济宗
teacher: 临济玄
status: draft
bio: 州将王令公于衙署张座。请师说法。师升座。拈拄杖曰。出来也打。不出来也打。僧出曰。崔禅𫆏。师掷下拄杖曰。久立令公。伏惟珍重
sayings:
- text: 僧问。如何是祖师西来意。师曰。定州瓷器似钟鸣。曰。学人不会意旨如何。师曰。口口分明没㖞斜
  ref: X80n1565_p0397a07（五灯会元）
