bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0266a08。
sayings:
- text: 僧问。如何是法法不生。师曰。生也。有儒者博覧古今。时呼为张百会。谒师
  ref: X80n1565_p0266a08（五灯会元）
- text: 师问。莫是张百会么。曰。不敢。师以手于空画一画曰。会么。曰。不会。师曰。一尚不会。甚么处得百会来
  ref: X80n1565_p0266a08（五灯会元）
