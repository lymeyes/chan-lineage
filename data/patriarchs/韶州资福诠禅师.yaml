id: 韶州资福诠禅师
name: 韶州资福诠
school: 云门宗
teacher: 云门文偃禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0569a15。
sayings:
- text: 僧问。不问宗乘。请师心印。师曰。不答这话。曰。为甚么不答。师曰。不副前言
  ref: X80n1565_p0569a15（五灯会元）
- text: 问。觌面难逢处。如何顾鉴咦。乞师垂半偈。免使后人疑。师曰。锋前一句超调御。拟问如何历劫违。曰。恁么则东山西岭时人知有。未审资福庭前谁家风月。师曰。且领前话
  ref: X80n1565_p0569a15（五灯会元）
