school: 杨岐派
teacher: 保宁勇
status: draft
bio: 开堂日。乃横按拄杖曰。大众。到这里无亲无疏。自然不孤。无内无外。纵横自在。自在不孤。清净毗卢。释迦举令。弥勒分疏。观根逗教。更相回互。看取宝积拄杖子。黑漆光生。两头相副。阿呵呵。是何言欤。良久曰。世事但将公道断。人心难与月轮齐。卓一下。下座
