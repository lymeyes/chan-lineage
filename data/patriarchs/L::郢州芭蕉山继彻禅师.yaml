id: L::郢州芭蕉山继彻禅师
name: 郢州芭蕉山继彻
school: 沩仰宗
teacher: 芭蕉清
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0336b11。
sayings:
- text: 问。如何是正法眼。师曰。泥弹子。穴异之。次谒先芭蕉。蕉
  ref: X80n1565_p0336b11（五灯会元）
- text: 上堂举仰山道。两口一无舌。此是吾宗旨。师豁然有省。住后
  ref: X80n1565_p0336b11（五灯会元）
- text: 僧问。如何是林溪境。师曰。有山有水。曰。如何是境中人。师曰。三门前。佛殿后
  ref: X80n1565_p0336b11（五灯会元）
- text: 问。如何是深深处。师曰。石人开石户。石锁两头摇
  ref: X80n1565_p0336b11（五灯会元）
- text: 上堂。昔日如来于波罗奈国。梵王请转法轮。如来不已而已。有屈宗风。随机逗教。遂有三乘名字。流传于天上人间。至今光扬不坠。若据祖宗门下。天地悬殊。上上根机。顿超不异。作么生是混融一句。还有人道得么。若道得。有参学眼。若道不得。天宽地窄。便下座
  ref: X80n1565_p0336b11（五灯会元）
- text: 上堂。眼中无翳。空里无花。水长船高。泥多佛大。莫将问来。我也无答。会么。问在答处。答在问处。便下座
  ref: X80n1565_p0336b11（五灯会元）
- text: 问。三乘十二分教即不
  ref: X80n1565_p0336b11（五灯会元）
- text: 问。如何是宗门一句。师曰。七纵八横。曰。如何领会。师曰。泥里倒。泥里起
  ref: X80n1565_p0336b11（五灯会元）
- text: 问。如何是祖师西来意。师曰。著体汗衫
  ref: X80n1565_p0336b11（五灯会元）
- text: 问。有一人不舍生死。不证涅槃。师还提携也无。师曰。不提携。曰。为甚么不提携。师曰。林溪粗识好恶
  ref: X80n1565_p0336b11（五灯会元）
- text: 问。如何是吹毛剑。师曰。透。曰。用者如何。师曰。钝
  ref: X80n1565_p0336b11（五灯会元）
- text: 问。寂寂无依时如何。师曰。未是衲僧分上事。曰。如何是衲僧分上事。师曰。要行即行。要坐即坐。师有偈曰。芭蕉的旨。不挂唇齿。木童唱和。石人侧耳
  ref: X80n1565_p0336b11（五灯会元）
