id: 吉州禾山楚材禅智禅师
name: 吉州禾山楚材禅智
school: 云门宗
teacher: 德山远
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0594b06。
sayings:
- text: 僧问。佛令祖令。诸方并行。未审和尚如何。师曰。山僧退后。曰。恁么则诸方不别也。师曰。伏惟伏惟
  ref: X80n1565_p0594b06（五灯会元）
- text: 问。如何是离凡圣底句。师曰。山河安掌上。曰。恁么则迥超今古外。师曰。展缩在当人
  ref: X80n1565_p0594b06（五灯会元）
- text: 问。一毫未发时如何。师曰。海晏河清。曰。发后如何。师曰。遍界无知己
  ref: X80n1565_p0594b06（五灯会元）
- text: 问。如何是和尚说法底口。师曰。放一线道
  ref: X80n1565_p0594b06（五灯会元）
- text: 问。抱璞投师。请师雕琢。师曰。不雕琢。曰。为甚么不雕琢。师曰。弄巧翻成拙
  ref: X80n1565_p0594b06（五灯会元）
