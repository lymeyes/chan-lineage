id: 温州瑞鹿寺上方遇安禅师
name: 温州瑞鹿寺上方遇安
school: 法眼宗
teacher: 天台德韶国师
status: draft
bio: 福州人也。得法于天台。又常阅首楞严经。到知见立知。即无明本。知见无见。斯即涅槃。师乃破句读曰。知见立。知即无明本。知见无。见斯即涅槃。于此有省。有人语师曰。破句了也。师曰。此是我悟处。毕生不易。时谓之安楞严。至道元年春。将示寂。有嗣子蕴仁侍立。师乃说偈示之。不是岭头𢹂得事。岂从鸡足付将来。自古圣贤皆若此。非吾今日为君裁。付嘱已。澡身易衣。安坐。令舁棺至室。良久。自入棺。经三日。门人启棺。睹师右胁吉祥而卧。四众哀恸。师乃再起。升堂说法。诃责垂诫。此度更启吾棺者。非吾之子。言讫。复入棺长往
