id: 育王介谌禅师
name: 育王介谌
alias: 育王谌
school: 黄龙派
teacher: 天宁卓禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《续传灯录》T51n2077_p0673c05。
sayings:
- text: 上堂。尺头有寸鉴者犹稀。秤尾无星且莫错认。若欲定古今轻重较佛祖短长。但请于中著一只眼果能。一尺还他十寸。八两元是半斤。自然内外和平家国无事。山僧今日已是两手分付。汝等诸人还肯信受奉行也无。尺量刀剪遍世间。志公不是闲和尚
  ref: T51n2077_p0673c05（续传灯录）
- text: 上堂。文殊智普贤行。多年历日。德山棒临济喝。乱世英雄。汝等诸人穿僧堂入佛殿。还知崄过铁围关么。忽然踏著释迦顶𩕳。磕著圣僧额头。不免一场祸事
  ref: T51n2077_p0673c05（续传灯录）
- text: 上堂。我若说有尔为有碍。我若说无尔为无碍。我若横说尔又跨不过。我若竖说尔又跳不出。若欲丛林平怙大家无事。不如推倒育王。且道育王如何推得倒去。召大众曰。著力著力。复曰。苦哉苦哉。育王被人推倒了也。还有路见不平拔剑相为底么。若无山僧不免自倒自起击拂子下座。师性刚毅莅众有古法。时以谌铁面称之
  ref: T51n2077_p0673c05（续传灯录）
