id: 襄州居士庞蕴
name: 庞蕴
alias: 庞居士
school: 南岳系
teacher: 马祖一
bio: 唐代著名在家禅者，世称庞居士，与马祖道一、石头希迁皆有机缘。举家参禅，其女灵照尤奇。以通俗偈颂演说禅理，影响深远。
sayings:
- text: 居士偈：「空手把锄头，步行骑水牛；人从桥上过，桥流水不流。」
  ref: 五灯会元·卷三·庞蕴居士
- text: 居士将终，谓女灵照：「视日早晚，及午以报。」照遽报：「日已中矣，而有蚀也。」士出户观，灵照即登父座合掌而逝——居士乃更延七日。
  ref: 五灯会元·卷三·庞蕴居士
