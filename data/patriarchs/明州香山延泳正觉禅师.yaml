bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0630a17。
sayings:
- text: 上堂。心随境现。境逐心生。心境两忘。是个甚么。拈起拄杖曰。且道这个甚处得来。若道是拄杖。瞎却汝眼。若道不是拄杖。眼在甚么处。是与不是。一时拈却。且骑拄杖出三门去也。遂曳杖下座
  ref: X80n1565_p0630a17（五灯会元）
