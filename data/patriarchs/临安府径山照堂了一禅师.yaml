sayings:
- text: 上堂。参玄之士。触境遇缘。不能直下透脱者。葢为业识深重。情妄胶固。六门未息。一处不通。绝点纯清。含生难到。直须入林不动草。入水不动波。始可顺生死流。入人间世。诸人要会么。以拄杖画曰。祇向这里荐取
  ref: X80n1565_p0647a07（五灯会元）
