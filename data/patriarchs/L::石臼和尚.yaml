id: L::石臼和尚
name: 石臼
school: 南岳系
teacher: 马祖一
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0115a06。
sayings:
- text: 问。甚么处来。师曰。乌臼来。祖曰。乌臼近日有何言句。师曰。几人于此茫然。祖曰。茫然且置。悄然一句作么生。师乃近前三步。祖曰。我有七棒寄打乌臼。你还甘否。师曰。和尚先吃。某甲后甘
  ref: X80n1565_p0115a06（五灯会元）
