id: 船子德诚禅师
name: 船子德诚
honorific: 华亭船子德诚禅师（药山惟俨法嗣）
school: 青原系
dynasty: 唐
region: 华亭（今上海松江）江边，以舟渡人为业
teacher: 药山惟俨禅师
source_ref: 五灯会元·卷五·华亭船子德诚 / 景德传灯录·卷十五
cbeta: T51n2076 卷十五
bio: 药山惟俨之法嗣，与道吾宗智、云岩昙晟为友。终身不居丛林，泛舟于华亭江上，渡人而接机，世称「船子和尚」。道吾荐夹山善会来参，船子以「垂丝千尺」之钓勘验，夹山言下大悟；船子嘱「须藏身处没踪迹」，遂覆舟入水而逝，示「竿头丝线」之脱洒。
sayings:
- text: 钓偈：「千尺丝纶直下垂，一波才动万波随。夜静水寒鱼不食，满船空载月明归。」（嘱夹山「离钩三寸，子何不道」）
  ref: 五灯会元·卷五·船子德诚
- text: 师谓夹山「尔将谓别有，直须藏身处没踪迹、没踪迹处莫藏身；吾三十年只钓丝上，今日钓得一个鲵鳞」；夹山悟，师覆舟而逝。
  ref: 五灯会元·卷五·船子德诚 / 夹山善会机缘
