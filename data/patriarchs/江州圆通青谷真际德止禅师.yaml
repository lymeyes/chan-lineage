id: 江州圆通青谷真际德止禅师
name: 江州圆通青谷真际德止
school: 法眼宗
teacher: 宝峰照
status: draft
bio: 金紫徐闳中之季子也。世居历阳。师双瞳绀碧。神光射人。十岁未知书。多喜睡。其父目为懵然子。暨成童。强记过人。学文有奇语。弱冠梦异僧授四句偈。已而有以南安岩主像遗之者。即傍所载聪明偈。自是持念不忘。后五年。随金紫将漕西洛。一夕忽大悟。连作数偈。一曰。不因言句不因人。不因物色不因声。夜半吹灯方就枕。忽然这里已天明。每啸歌自若。众莫测之。乃力求出家。父弗许。欲以官授之。师曰。某方将脱世网。不著三界。岂复刺头于利名中邪。请移授从兄玨。遂祝发受具。未数载名振京师。宣和三年春。徽宗皇帝赐号真际。俾居圆通
sayings:
- text: 上堂。山僧二十年前两目皆盲。了无所睹。唯是闻人说道。青天之上有大日轮。照三千大千世界。无有不遍之处。筹䇿万端。终不能见。二十年后。眼光渐开。又值天色连阴。浓云乱涌。四方观察。上下推穷。见云行时。便于行处作计较。见云住时。便于住处立个窠臼。正如是间。忽遇著个多知汉。问道。莫是要见日轮么。何不向高山顶上去。山僧却征他道。那里是高山顶上。他道。红尘不到处是。诸仁者。好个端的消息。还会么。长连床上佛陀耶
  ref: X80n1565_p0543a09（五灯会元）
- text: 上堂。昨夜黄面瞿昙。将三千大千世界来一口吞尽。如人饮汤水。踪迹不留。应时消散。当尔时诸大菩萨．声闻罗汉．及与一切众生。尽皆不觉不知。唯有文殊普贤瞥然󳬇见。虽然得见。渺渺茫茫。恰似向大洋海里头出头没。诸人且道是甚么消息。若也检点得破。许他顶门上具一只眼。示寂阇维。烟气所及。悉成设利。塔司空山。分窆叠石原
  ref: X80n1565_p0543a09（五灯会元）
