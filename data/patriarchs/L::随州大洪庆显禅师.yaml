sayings:
- text: 僧问。须菩提岩中宴坐。帝释雨华。和尚新据洪峰。有何祥瑞。师曰。铁牛耕破扶桑国。迸出金乌照海门。曰。未审是何宗旨。师曰。熨斗煎荼铫不同
