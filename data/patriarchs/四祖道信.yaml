bio: '嗣法于僧璨，后住黄梅破头山（双峰山）三十年，门人云集，号「东山之法」之先声。

  倡导「守一不移」「农禅并重」，令徒众「坐作并重」，为后世丛林制度奠基。传法于弘忍。'
sayings:
- text: 示众：「夫百千法门，同归方寸；河沙妙德，总在心源。一切戒门、定门、慧门，神通变化，悉自具足，不离汝心。」
  ref: 五灯会元·卷一·道信
