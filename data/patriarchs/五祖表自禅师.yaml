id: 五祖表自禅师
name: 五祖表自
alias: 五祖自
school: 杨岐派
teacher: 五祖法演禅师
status: draft
bio: 怀安人也。初依祖最久未有省。时圆悟为座元。师往请益。悟曰。兄有疑处试语我。师遂举德山小参不答话问话者三十棒。悟曰。礼拜著我作得尔师举话尚不会。师作礼竟。悟令再举前话。师曰。德山小参不答话。悟掩其口曰。但恁么看。师出扬声曰。屈屈。岂有公案。只教人看一句底道理。有僧谓师曰。兄不可如此说。首座须有方便。因静坐体究及旬。顿释所疑。诣悟礼谢。悟曰。兄始知吾不汝欺。又诣方丈。祖迎笑。自尔日深玄奥。祖将归寂。遗言郡守。命嗣其席。衲子四至不可遏。师榜侍者门曰。东山有三句。若人道得即挂搭。衲子皆披靡。一日有僧携坐具径造丈室。谓师曰。某甲道不得只要挂搭。师大喜。呼维那于明窗下安排
sayings:
- text: 上堂。世尊拈华迦叶微笑时。人只知拈花微笑。要且不识世尊
  ref: T51n2077_p0639a27（续传灯录）
- text: 僧问。如何是祖师西来意。师曰。荆棘林中舞柘枝。曰如何是佛。师曰。新生孩子掷金盆
  ref: T51n2077_p0639a27（续传灯录）
