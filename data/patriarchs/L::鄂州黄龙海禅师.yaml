school: 黄龙派
teacher: 智门祚
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0592b01。
sayings:
- text: 僧问。如何是黄龙家风。师曰。看。曰。忽遇客来。如何祇待。师以拄杖点之
  ref: X80n1565_p0592b01（五灯会元）
- text: 问。如何是最初一句。师曰。掘地讨天
  ref: X80n1565_p0592b01（五灯会元）
