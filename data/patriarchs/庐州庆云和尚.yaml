id: 庐州庆云和尚
name: 庐州庆云
school: 云门宗
teacher: 云门文偃禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0575a16。
sayings:
- text: 僧问。三乘十二分教即不
  ref: X80n1565_p0575a16（五灯会元）
- text: 问。如何是直截根源。师曰。十进九退。曰。如何即是。师曰。何日得休时
  ref: X80n1565_p0575a16（五灯会元）
- text: 问。一言道断时如何。师曰。未是极则处。曰。如何是极则处。师曰。冬后一阳生
  ref: X80n1565_p0575a16（五灯会元）
- text: 问。诸法实相义。和尚如何说。师曰。口挂东壁上
  ref: X80n1565_p0575a16（五灯会元）
- text: 问。佛令祖令今已委。向上机锋事若何。师曰。令。曰。学人不晓。如何指示。师曰。收
  ref: X80n1565_p0575a16（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0575a16），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
