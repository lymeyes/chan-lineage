sayings:
- text: 僧问。杨广失橐𫘞。到处无人见。未审是甚么人得见。师以拂子约曰。退后退后。妨他别人所
  ref: X80n1565_p0686b07（五灯会元）
- text: 问。曰。毕竟落在甚么处。师曰。可煞不识好恶。便打
  ref: X80n1565_p0686b07（五灯会元）
