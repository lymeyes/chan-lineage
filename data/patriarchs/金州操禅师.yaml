id: 金州操禅师
name: 金州操
school: —
teacher: 章敬𣍯禅师
status: draft
bio: 请米和尚斋。不排坐位。米到。展坐具礼拜。师下禅床。米乃坐师位。师却席地而坐。斋讫。米便去。侍者曰。和尚受一切人钦仰。今日坐位被人夺却。师曰。三日后若来即受救在。米三日后果来。曰。前日遭贼
sayings:
- text: 僧问镜清。古人道。前日遭贼。意旨如何。清云。祇见锥头利。不见凿头方
  ref: X80n1565_p0145b05（五灯会元）
