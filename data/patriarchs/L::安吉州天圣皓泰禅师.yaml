id: L::安吉州天圣皓泰禅师
name: 安吉州天圣皓泰
school: —
teacher: 汾阳昭
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0432a05。
sayings:
- text: 问。埋兵掉鬬。未是作家。匹马单枪。便请相见。师指邪曰。将头不猛。带累三军。邪打师一坐具。师亦打邪一坐具。邪接住曰。适来一坐具。是山僧令行。上座一坐具。落在甚么处。师曰。伏惟尚飨。邪拓开曰。五更侵早起。更有夜行人。师曰。贼过后张弓。邪曰。且坐吃茶。住后
  ref: X80n1565_p0432a05（五灯会元）
- text: 僧问。如何是佛。师曰。黑漆圣僧。曰。如何是佛法大意。师曰。看墙似土色
  ref: X80n1565_p0432a05（五灯会元）
