sayings:
- text: 僧问。如何是兴阳境。师曰。松竹乍栽山影绿。水流穿过院庭中
  ref: X80n1565_p0310b16（五灯会元）
- text: 问。如何是佛。师曰。更是甚么
  ref: X80n1565_p0310b16（五灯会元）
