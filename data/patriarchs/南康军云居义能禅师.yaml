status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0380a06。
sayings:
- text: 上堂。不用上来。堂中㤭陈如上座为诸上座转第一义法轮。还得么。若信得及。各自归堂参取。下座后却问一僧。祇如山僧适来教上座参取圣僧。圣僧还道个甚么。僧曰。特谢和尚再举
  ref: X80n1565_p0380a06（五灯会元）
- text: 问。如何是佛。师曰。即心是佛。曰。学人不会。乞师方便。师曰。方便呼为佛。回光返照看。身心是何物
  ref: X80n1565_p0380a06（五灯会元）
