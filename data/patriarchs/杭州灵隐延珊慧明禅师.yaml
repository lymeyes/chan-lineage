id: 杭州灵隐延珊慧明禅师
name: 杭州灵隐延珊慧明
school: 法眼宗
teacher: 灵隐胜禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0385b09。
sayings:
- text: 僧问。如何是道。师曰。道远乎哉
  ref: X80n1565_p0385b09（五灯会元）
- text: 问。如何是正真一路。师曰。丝发不通。曰。恁么则依而行之。师曰。莫乱走
  ref: X80n1565_p0385b09（五灯会元）
- text: 上堂。与上座一线道。且作么生持论佛法。若也水泄不通。便教上座无安身立命处。当此之时。祖佛出头来。也有二十棒分。恁么道。山僧还有过也无。不见世尊生下。周行七步。目顾四方。一手指天。一手指地。云。天上天下。唯吾独尊。云门云。我当初若见。一棒打杀与狗子吃却。何以如此。贵图天下太平。且道云门恁么说话。有佛法道理也无。虽然如此。云门祇具一只眼。久立。珍重
  ref: X80n1565_p0385b09（五灯会元）
