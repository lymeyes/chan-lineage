id: 福州长生山皎然禅师
name: 福州长生山皎然
school: —
teacher: 雪峰存
status: draft
bio: 本郡人。久依雪峰。一日与僧斫树次。峰曰。斫到心且住。师曰。斫却著。峰曰。古人以心传心。汝为甚么道斫却。师掷下斧曰。传。峰打一拄杖而去
sayings:
- text: 僧问雪峰。如何是第一句。峰良久。僧举似师。师曰。此是第二句。峰再令其僧来
  ref: X80n1565_p0264a01（五灯会元）
- text: 问。如何是第一句。师曰。苍天。苍天。普请次。雪峰
  ref: X80n1565_p0264a01（五灯会元）
- text: 问。古人道。谁知席帽下。元是昔愁人。古人意作么生。师侧戴笠子曰。这个是甚么人语。峰问师。持经者能荷担如来。作么生是荷担如来。师乃捧雪峰向禅床上。普请次。雪峰负一束藤。路逢一僧便抛下。僧拟取。峰便蹋倒。归谓师曰。我今日蹋这僧快。师曰。和尚却替这僧入涅槃堂始得。峰便休去。雪峰
  ref: X80n1565_p0264a01（五灯会元）
- text: 问。光境俱亡。复是何物。师曰。放皎然过有道处。峰曰。放汝过作么生道。曰。皎然亦放和尚过。峰曰。放汝二十棒。师便礼拜。住后
  ref: X80n1565_p0264a01（五灯会元）
- text: 僧问。古人有言。无明即佛性。烦恼不须除。如何是无明即佛性。师忿然作色。举拳呵曰。今日打这师僧去也。曰。如何是烦恼不须除。师以手拏头曰。这师僧得恁么发人业
  ref: X80n1565_p0264a01（五灯会元）
- text: 问。路逢达道人。不将语默对。未审将甚么对。师曰。上纸墨堪作甚么。闽帅署禅主大师。莫知所终
  ref: X80n1565_p0264a01（五灯会元）
