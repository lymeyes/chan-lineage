bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0337a14。
sayings:
- text: 僧问。大通智胜佛。十劫坐道场。佛法不现前。不得成佛道时如何。师曰。其问甚谛当。曰。既是坐道场。为甚么不得成佛道。师曰。为伊不成佛
  ref: X80n1565_p0337a14（五灯会元）
