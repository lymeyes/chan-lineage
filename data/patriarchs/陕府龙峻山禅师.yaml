id: 陕府龙峻山禅师
name: 陕府龙峻山
school: 青原系
teacher: 大光诲
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0209a05。
sayings:
- text: 僧问。如何是不知善恶底人。师曰。千圣近不得。曰。此人还知有向上事也无。师曰。不知。曰。为甚么不知。师曰。不识善恶。说甚么向上事。曰。毕竟如何。师曰。不见道犴𤞞
  ref: X80n1565_p0209a05（五灯会元）
- text: 问。如何是佛向上人。师曰。不带容
  ref: X80n1565_p0209a05（五灯会元）
- text: 问。凡有展拓尽落今时。不展拓时如何。师曰。不展。不展。曰。毕竟如何。师曰。不拓。不拓
  ref: X80n1565_p0209a05（五灯会元）
