name: 潭州兴化绍铣
school: 曹洞宗
teacher: 北禅贤
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0606b18。
sayings:
- text: 上堂拈拄杖曰。一大藏教。是拭不净故纸。超佛越祖之谈。是诳𧬵闾阎汉。若论衲僧门下。一点也用不得。作么生是衲僧门下事。良久曰。多虗不如少实。击香台。下座
  ref: X80n1565_p0606b18（五灯会元）
