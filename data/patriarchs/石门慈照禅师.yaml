bio: |
  宋代临济宗禅师，汾阳善昭之法嗣。住石门，学者云集。驸马都尉李遵勗居士为其在家弟子，问道甚切，
  尝问「世间何物最苦」，慈照以「地狱众生无始无明最苦」答之。
