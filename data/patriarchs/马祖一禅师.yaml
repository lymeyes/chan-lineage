id: 马祖一禅师
name: 马祖道一
honorific: 马祖道一禅师 · 大寂禅师（谥）
school: 南岳系
dynasty: 唐
region: 洪州开元寺 / 江西
teacher: 南岳怀让
source_ref: 五灯会元·卷三·江西马祖道一 / 景德传灯录·卷六
cbeta: T51n2076 卷六
bio: '汉州什邡人，容貌奇异，牛行虎视。初习坐禅，南岳怀让以「磨砖作镜」启之，言下悟入。

  后住建阳、钟陵、洪州，大阐禅法，世称「洪州宗」。倡「即心即佛」「非心非佛」「平常心是道」，机用杀活自如，门下八十八人各为一方，百丈怀海、南泉普愿、西堂智藏皆其高弟。'
sayings:
- text: 示众：「若欲直会其道，平常心是道。谓平常心无造作、无是非、无取舍、无断常、无凡无圣。」
  ref: 五灯会元·卷三·马祖道一
- text: 「即心即佛」；后又曰「非心非佛」；「道不用修，但莫污染。」
  ref: 五灯会元·卷三·马祖道一
