id: 台州般若寺敬遵通慧禅师
name: 台州般若寺敬遵通慧
school: 法眼宗
teacher: 清凉益
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0363b02。
sayings:
- text: 上堂。皎皎炟赫地。亘古互今。也未曾有纤毫间断相。无时无节。长时拶定上座无通气处。所以道。山河大地是上座善知识。放光动地。触处露现。实无丝头许法可作隔碍。如今因甚么却不会。特地生疑去。无事。不用久立
  ref: X80n1565_p0363b02（五灯会元）
- text: 僧问。优昙花拆人皆睹。般若家风赐一言。师曰。不因上座
  ref: X80n1565_p0363b02（五灯会元）
- text: 问。不曾举似人。曰。恁么则般若雄峰。讵齐今古。师曰。也莫错会
  ref: X80n1565_p0363b02（五灯会元）
- text: 问。牛头未见四祖时。为甚么百鸟衔华。师曰。汝甚么处见。曰。见后为甚么不衔华。师曰。且领话好
  ref: X80n1565_p0363b02（五灯会元）
- text: 问。灵山一会。迦叶亲闻。未审今日一会。何人得闻。师曰。试举迦叶闻底看。曰。恁么则迦叶亲闻去也。师曰。乱道作么。师自述真赞曰。真兮寥廓。郢人图雘。岳耸云空。澄潭月跃
  ref: X80n1565_p0363b02（五灯会元）
