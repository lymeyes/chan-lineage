id: 参政李邴居士
name: 参政李邴
school: 杨岐派
teacher: 径山杲
status: draft
bio: 字汉老。醉心祖道有年。闻大慧排默照为邪禅。疑怒相半。及见慧
sayings:
- text: 示众。举赵州庭柏。垂语曰。庭前柏树子。今日重新举。打破赵州关。特地寻言语。敢问大众。既是打破赵州关。为甚么却特地寻言语。良久曰。当初祇道茆长短。烧了方知地不平。公领悟。谓慧曰。无老师后语。几蹉过。后以书咨决曰。某近扣筹室。承击发蒙滞。忽有省入。顾惟根识暗钝。平生学解。尽落情见。一取一舍。如衣坏絮行草棘中。适自缠绕。今一笑顿释所疑。欣幸可量。非大宗匠委曲垂慈。何以致此。自到城中。著衣吃饭。抱子弄孙。色色仍旧。既无拘执之情。亦不作奇特之想。其余夙习旧障。亦稍轻微。临行叮咛之语。不敢忘也。重念始得入门。而大法未明。应机接物。触事未能无碍。更望有以提诲。使卒有所至。庶无玷于法席矣。又书曰。某比蒙诲答。备悉深旨。某自验者三。一．事无逆顺。随缘即应。不留𮌎中。二．宿习浓厚。不加排遣。自尔轻微。三．古人公案。旧所茫然。时复瞥地。此非自昧者。前书大法未明之语。盖恐得少为足。当扩而充之。岂别求胜解耶。净胜现流。理则不无。敢不铭佩
