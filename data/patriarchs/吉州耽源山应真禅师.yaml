id: 吉州耽源山应真禅师
name: 吉州耽源山应真
school: —
teacher: 南阳忠国师
status: draft
bio: 为国师侍者时。一日国师在法堂中。师入来。国师乃放下一足。师见便出。良久却回。国师曰。适来意作么生。师曰。向阿谁说即得。国师曰。我问你。师曰。甚么处见某甲。师又
sayings:
- text: 问。极则事如何。国师曰。幸自可怜生。须要觅个护身符子作么。异日。师携篮子归方丈。国
  ref: X80n1565_p0069a18（五灯会元）
- text: 师问。篮里甚么物。师曰。青梅。国师曰。将来何用。师曰。供养。国师曰。青在争堪供养。师曰。以此表献。国师曰。佛不受供养。师曰。某甲只恁么。和尚如何。国师曰。我不供养。师曰。为甚么不供养。国师曰。我无果子。百丈海和尚在泐潭山牵车次。师曰。车在这里。牛在甚么处。丈斫额。师乃拭目。麻谷
  ref: X80n1565_p0069a18（五灯会元）
- text: 问。十二面观音岂不是圣。师曰。是。麻谷与师一掴。师曰。想汝未到此境。国师讳日设斋。有
  ref: X80n1565_p0069a18（五灯会元）
- text: 僧问曰。国师还来否。师曰。未具他心。曰。又用设斋作么。师曰。不断世谛
  ref: X80n1565_p0069a18（五灯会元）
