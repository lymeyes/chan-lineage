bio: 密州𡺸山宁禅师，雪窦重显（明禅师）法嗣，云门宗传人。
sayings:
- text: 上堂：「有时孤峰顶上啸月眠云，有时大洋海中翻波走浪，有时十字街头七穿八穴。诸人还相委悉么？樟树花开盛，芭蕉叶最多。」
  ref: 五灯会元·卷十六·雪窦明禅师法嗣
