id: L::明州光孝了堂思彻禅师
name: 明州光孝了堂思彻
school: 法眼宗
teacher: 天童觉
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0549b17。
sayings:
- text: 上堂。羊头车子推明月。没底船儿载晓风。一句顿超情量外。道无南北与西东。所以劫前消息。非口耳之所传。格外真规。岂思量之能解。须知佛佛祖祖。了无一法为人。子子孙孙。直下全身荷负。既已万机寝削。自然一糁不留。湛湛之波。碧水冷涵于秋色。灵灵之照。霁天净洗于冰轮。宛转旁参。叶通兼带。梦手推开玉户。翻身拨动机轮。正令才行。又见一阳萌动。化工密运。俄惊三世变迁。虽则默尔无言。争奈炽然常说。无迁无变。今朝拈置一边。有故有新。且道如何话会。诸人还委悉么。群阴消剥尽。来日是书云
  ref: X80n1565_p0549b17（五灯会元）
