id: 临安府净慈象禅师
name: 临安府净慈象
school: 云门宗
teacher: 净慈明
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0646a03。
sayings:
- text: 上堂。古者道。一翳在眼。空花乱坠。拈拄杖曰。净慈拈起拄杖。岂不是一翳在眼。百千诸佛总在拄杖头。现丈六紫磨金色之身。乘其国土。游历十方。说一切法。度一切众。岂不是空花乱坠。即今莫有向拄杖未拈已前坐断得么。出来与净慈相见。如无。切忌向空本无花．眼本无翳处著倒。乃掷拄杖。下座
  ref: X80n1565_p0646a03（五灯会元）
