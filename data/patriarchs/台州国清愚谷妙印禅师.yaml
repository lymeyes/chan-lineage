- text: 上堂。满口道得底。为甚么不知有。十分知有底。为甚么满口道不得。且道誵讹在甚么处。若也知得。许你照用同时。明暗俱了。其或未然。道得道不得。知有不知有。南山石大虫。解作师子吼
