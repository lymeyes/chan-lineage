id: L::新罗国清院禅师
name: 新罗国清院
school: 青原系
teacher: 九峰虔
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0209a17。
sayings:
- text: 僧问。奔马争球。谁是得者。师曰。谁是不得者。曰。恁么则不在争也。师曰。直得不争。亦有过在。曰。如何免得此过。师曰。要且不曾失。曰。不失处如何锻炼。师曰。两手捧不起
  ref: X80n1565_p0209a17（五灯会元）
