id: L::浮槎山福严守初禅师
name: 浮槎山福严守初
school: 云门宗
teacher: 法云秀
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0632b02。
sayings:
- text: 僧问。如何是受用三昧。师曰。拈匙放箸
  ref: X80n1565_p0632b02（五灯会元）
- text: 问。如何是正直一路。师曰。踏不著。曰。踏著后如何。师曰。四方八面。乃曰。若论此事。放行则曹谿路上月白风清。把定则少室峰前云收雾卷。如斯语论。已涉多途。但由一念相应。方信不从人得。大众且道。从甚么处得。良久曰。水流元在海。月落不离天
  ref: X80n1565_p0632b02（五灯会元）
- text: 上堂。即性之相。一亘晴空。即相之性。千波竞起。若彻来源。清流无阻。所以举一念而尘沙法门顿显。拈一毫而无边刹境齐彰。且道文殊普贤在甚么处。下坡不走。快便难逢。便下座
  ref: X80n1565_p0632b02（五灯会元）
