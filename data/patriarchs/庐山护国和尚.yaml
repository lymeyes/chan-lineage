id: 庐山护国和尚
name: 庐山护国
school: 云门宗
teacher: 云门文偃禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0574b16。
sayings:
- text: 上堂曰。有解问话者么。出来对众问看。时有僧出礼拜。师曰。来朝更献楚王看。便归方丈
  ref: X80n1565_p0574b16（五灯会元）
- text: 上堂。实际理地。不受一尘。佛事门中。不舍一法。又曰。一法若有。毗卢堕在凡夫。万法若无。普贤失其境界。诸上座。作么生理论。朝夕恁么上来。向诸上座说个甚么即得。若说三乘十二分教。自有座主律师。若说世谛因缘。又非僧家之所议。若论佛法。从上祖宗。多少佛法。可与评量。总不如是。须知各各当人分上事。作么生是诸上座分上事。知有底。对众吐露个消息。以表平生行脚。参善知识。具烁迦罗目。不被人谩。岂不快哉。还有么。良久云。若无人出头。买卖不当价。徒劳更商量。珍重
  ref: X80n1565_p0574b16（五灯会元）
- text: 僧问。佛未出世时如何。师曰。云遮海门树。曰。出世后如何。师曰。擘破铁围山
  ref: X80n1565_p0574b16（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0574b16），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
