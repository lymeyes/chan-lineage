id: L::郢州大阳如汉禅师
name: 郢州大阳如汉
school: —
teacher: 石霜永
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0452a09。
sayings:
- text: 僧问。如何是敲磕底句。师曰。槛外竹摇风。惊起幽人睡。曰。观音门大启也。师曰。师子𫜪人。廼曰。闻声悟道。失却观音眼睛。见色明心。昧了文殊巴鼻。一出一入。半开半合。泥牛昨夜游沧海。直至如今不见回。咄
  ref: X80n1565_p0452a09（五灯会元）
