id: 杨歧会禅师
name: 杨岐方会
honorific: 杨岐方会禅师 · 甄叔/慈明下临济宗匠
school: 杨岐派
dynasty: 北宋
region: 袁州杨岐山（普通院）
teacher: 石霜楚圆（慈明楚圆）
source_ref: 五灯会元·卷十二·袁州杨岐方会 / 建中靖国续灯录
cbeta: X77n1524 相关章次
bio: 宜春冷氏子，与黄龙慧南同出石霜楚圆（慈明）之门。初为县小吏，后出家，嗣慈明。住袁州杨岐山普通院，门风刚柔并济、简洁明快，开杨岐派——临济宗下二派之一。其后大慧宗杲倡话头禅，杨岐派遂成临济宗乃至禅宗之主流法脉。（注：谱系图中杨岐派节点标作「杨歧会禅师」，歧为异体，即杨岐方会。）
sayings:
- text: 示众：「杨岐无旨的，种田博饭吃；说禅似吞栗蒲，开口便落地。」（本色住山、不尚玄谈）
  ref: 五灯会元·卷十二·杨岐方会
status: draft
verify: 待 CBETA 校对；图谱节点名称「杨歧会禅师」之「歧」为「岐」异体，对应杨岐方会。
