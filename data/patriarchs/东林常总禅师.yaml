id: 东林常总禅师
name: 东林常总
alias: 东林总
school: 黄龙派
teacher: 黄龙慧南禅师
status: draft
bio: 延平施氏子。久依黄龙密授大法决旨。出住泐潭次迁东林。皆符谶记
sayings:
- text: 僧问。乾坤之内宇宙之间中有一宝秘在形山。如何是宝。师曰。白月现黑月隐。曰非但闻名今日亲见。师曰。且道宝在甚么处。曰古殿户开光灿烂。白莲池畔社中人。师曰。别宝还他碧眼胡。又僧出众提起坐具曰。请师答话。师曰。放下著。僧又作展势。师曰收。曰昔年寻剑客今朝遇作家。师曰。这里是甚么所在。僧便喝。师曰。喝老僧那。僧又喝。师曰。放过又争得便打
  ref: T51n2077_p0573c26（续传灯录）
- text: 上堂。乾坤大地常演圆音。日月星辰每谈实相。翻忆先黄龙道秋雨淋漓连宵彻曙。点点无弘不落别处。复云。滴穿汝眼睛浸烂汝鼻孔。东林则不然。终归大海作波涛。击禅床下座
  ref: T51n2077_p0573c26（续传灯录）
- text: 上堂。老卢不识字顿明佛意。佛意离文墨故。白兆不识书圆悟宗乘。宗乘非言诠故。如此老婆心分明入泥水。今时人犹尚把桥柱澡洗把缆放船。良久曰。争怪得老僧
  ref: T51n2077_p0573c26（续传灯录）
