sayings:
- text: 上堂。一不做二不休。捩转鼻孔捺下云头。禾山解打盐官鼓。僧繇不写戴嵩牛。卢陵米投子油。雪峰依旧辊双球。夜来风送衡阳信。寒雁一声霜月幽
  ref: T51n2077_p0588c27（续传灯录）
