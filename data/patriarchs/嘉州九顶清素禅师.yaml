id: 嘉州九顶清素禅师
name: 嘉州九顶清素
school: 杨岐派
teacher: 五祖演
status: draft
bio: 本郡郭氏子。于乾明寺剃染。遍扣禅扄。晚谒五祖。闻举首山答西来意语。倏然契悟。述偈曰。颠倒颠。颠倒颠。新妇骑驴阿家牵。便恁么。太无端。回头不觉布衫穿。祖见。乃
sayings:
- text: 问。百丈野狐话。又作么生。师曰。来说是非者。便是是非人。祖大悦。久之辞归。住清溪。次迁九顶。太守吕公来瞻大像。问曰。既是大像。因甚么肩负两楹。师曰。船上无散工。至阁下。睹观音像又
  ref: X80n1565_p0750a06（五灯会元）
- text: 问。弥勒化境。观音何来。师曰。家富小儿娇。守乃礼敬。勤老宿至
  ref: X80n1565_p0750a06（五灯会元）
- text: 师问。舞剑当咽时如何。曰。伏惟尚飨。师诟曰。老贼死去。你问我。勤理前语问之。师叉手揖曰。拽破。绍兴乙卯四月二十四日。得微疾。书偈遗众曰。木人备舟。铁人备马。丙丁童子稳稳登。喝散白云归去也。竟尔趋寂
  ref: X80n1565_p0750a06（五灯会元）
