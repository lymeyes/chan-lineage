id: L::福州东禅契讷禅师
name: 福州东禅契讷
school: —
teacher: 长庆棱
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0288a11。
sayings:
- text: 上堂。未曾暂失。全体现前。恁么道亦是分外。既恁么道不得。向兄弟前合作么生道。莫是无道处不受道么。莫错会好
  ref: X80n1565_p0288a11（五灯会元）
- text: 僧问。如何是现前三昧。师曰。何必更待道
  ref: X80n1565_p0288a11（五灯会元）
- text: 问。己事未明。乞师指示。师曰。何不礼谢
  ref: X80n1565_p0288a11（五灯会元）
- text: 问。如何是东禅家风。师曰。一人传虗。万人传实
  ref: X80n1565_p0288a11（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0288a11），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
