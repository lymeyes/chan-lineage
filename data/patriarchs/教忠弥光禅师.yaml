id: 教忠弥光禅师
name: 教忠弥光
alias: 教忠光
school: 杨岐派
teacher: 大慧宗杲禅师
status: draft
bio: 闽之李氏子。儿时寡言笑。闻梵呗则喜。十五依幽岩文慧禅师圆顶。犹喜阅群书。一日曰。既剃发染衣当期悟彻。岂醉于俗典邪。遂出岭谒圆悟禅师于云居。次参黄檗祥高庵悟机语皆契。以淮楚盗起归谒佛心。会大慧寓广因往从之。慧谓曰。汝在佛心处所得者试举一二看。师举佛心
sayings:
- text: 上堂拈普化公案曰。佛心即不然。总不恁么来时如何。劈脊便打。从教遍界分身。慧曰。汝意如何。师曰。某不肯他后头下个注脚。慧曰。此正是以病为法。师毅然无信可意。慧曰。汝但揣么看。师竟以为不然。经旬因记海印信禅师拈曰。雷声浩大雨点全无。始无滞趋告慧。慧以举道者见琅邪并玄沙未彻语诘之。师对已。慧笑曰。虽进得一步只是不著所在。如人斫树根下一刀则命根断矣。汝向枝上斫其能断命根乎。今诸方浩浩说禅者。见处总如此何益于事。其杨岐正传三四人而已。师愠而去。翌日慧
  ref: T51n2077_p0686a07（续传灯录）
- text: 问。汝还疑否。师曰。无可疑者。慧曰。只如古人相见未开口时已知虚实。或闻其语便识浅深。此理如何。师悚然汗下莫知所诣。慧令究有句无句。慧过云门庵。师侍行。一日问曰。某到这里不能得彻。病在甚处。慧曰。汝病最癖世医拱手。何也别人死了活不得。汝今活了未曾死。要到大安乐田地。须是死一回始得。师疑情愈深。后入室。慧
  ref: T51n2077_p0686a07（续传灯录）
- text: 问。吃粥了也洗钵盂了也。去却药忌道将一句来。师曰。裂破。慧震威喝曰。尔又说禅也。师即大悟。慧挝鼓告众曰。龟毛拈得笑咍咍。一击万重关锁开。庆快平生在今日。孰云千里赚吾来。师亦以颂呈之曰。一拶当机怒雷吼。惊起须弥藏北斗。洪波浩渺浪滔天。拈得鼻孔失却口。住后
  ref: T51n2077_p0686a07（续传灯录）
- text: 上堂。有句无句如藤倚树。放憨作么。及乎树倒藤枯句归何处。情知汝等诸人卒讨头鼻不著。为甚如此。只为分明极翻令所得迟
  ref: T51n2077_p0686a07（续传灯录）
- text: 上堂。梦幻空花何劳把捉。得失是非一时放却。掷拂子曰。山僧今日已是放下了也。汝等诸人又作么生。复曰。侍者收取拂子
  ref: T51n2077_p0686a07（续传灯录）
- text: 僧问。文殊为甚么出女子定不得。师曰。山僧今日困。曰罔明为甚么却出得。师曰。令人疑著。曰恁么则擘开华岳千峰秀。放出黄河一派清。师曰。一任卜度
  ref: T51n2077_p0686a07（续传灯录）
