id: L::抚州永安院怀烈净悟禅师
name: 抚州永安院怀烈净悟
school: —
teacher: 长庆棱
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0288b14。
sayings:
- text: 上堂顾视左右曰。患謇作么。便归方丈
  ref: X80n1565_p0288b14（五灯会元）
- text: 上堂。良久曰。幸自可怜生。又被污却也
  ref: X80n1565_p0288b14（五灯会元）
- text: 上堂。大众。正是著力处。切莫容易
  ref: X80n1565_p0288b14（五灯会元）
- text: 僧问。怡山亲闻一句。请师为学人道。师曰。向后莫错举似人
  ref: X80n1565_p0288b14（五灯会元）
