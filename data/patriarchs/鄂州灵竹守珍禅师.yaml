bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0521a06。
sayings:
- text: 僧问。如何是西来意。师曰。锡带胡天雪。瓶添汉地泉
  ref: X80n1565_p0521a06（五灯会元）
- text: 问。迷悟不入诸境时如何。师曰。境从何来。曰。恁么则无诸境去也。师曰。龙头蛇尾汉
  ref: X80n1565_p0521a06（五灯会元）
