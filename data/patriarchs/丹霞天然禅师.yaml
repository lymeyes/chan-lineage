id: 丹霞天然禅师
name: 丹霞天然
honorific: 邓州丹霞天然禅师（石头希迁 / 马祖道一法嗣）
school: 青原系
dynasty: 唐（739—824）
region: 邓州丹霞山（今河南内乡）
teacher: 石头希迁（亦谒马祖）
source_ref: 五灯会元·卷五·邓州丹霞天然 / 景德传灯录·卷十四
cbeta: T51n2076 卷十四
bio: 本习儒业，赴举途遇僧，劝「选官不如选佛」，遂入道。初谒马祖，马祖指参石头；于石头处得「天然」之号（天然，本然也）。后住邓州丹霞山，机用奇特，不拘格仪。其「烧木佛」之举，以破学人著相，为禅宗著名公案。
sayings:
- text: 丹霞烧佛：天寒，师取寺中木佛烧火向火，院主诃之，师以杖拨灰云「吾烧取舍利」，主云「木佛何有舍利」，师云「既无舍利，更取两尊来烧」。
  ref: 五灯会元·卷五·丹霞天然
- text: 师于慧林寺遇寒，遂取木佛烧火；又尝「骑圣僧颈而坐」，人问「何得骑圣僧」，师云「我骑你，你何不识」。
  ref: 景德传灯录·卷十四·丹霞天然
