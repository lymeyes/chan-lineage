id: 栖贤智迁禅师
name: 栖贤智迁
alias: 栖贤迁
school: 云门宗
teacher: 天衣义怀禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《续传灯录》T51n2077_p0514a20。
sayings:
- text: 僧问。一问一答尽是建化门庭。未审向上更有事也无。师曰有。曰如何是向上事。师曰。云从龙风从虎。曰恁么则龙得水时添意气。虎逢山则长威狞。师曰。兴云致雨又作么生。僧便喝。师曰。莫更有在。僧拟议。师咄曰。念话杜家。问如何是本来心。师曰。拆东篱补西壁。曰恁么则今日斋晏。师曰。退后著
  ref: T51n2077_p0514a20（续传灯录）
- text: 上堂。闻佛法二字早是。污我耳目。诸人未跨法堂门。脚跟下好与三十棒。虽然如是。山僧。今日也是为众竭力。珍重
  ref: T51n2077_p0514a20（续传灯录）
- text: 上堂。是甚么物得恁顽顽嚚嚚𥈅𥈅𪾢𪾢。拊掌呵呵大笑曰。今朝巴鼻直是黄面瞿昙。通身是口。也分疏不下。久立
  ref: T51n2077_p0514a20（续传灯录）
