id: 本童禅师
name: 本童
school: 青原系
teacher: 丹霞天然禅师
status: draft
bio: 因僧写师真呈。师曰。此若是我。更呈阿谁。曰。岂可分外也。师曰。若不分外。汝却收取。僧拟收。师打曰。正是分外强为。曰。若恁么即须呈于师也。师曰。收取。收取
