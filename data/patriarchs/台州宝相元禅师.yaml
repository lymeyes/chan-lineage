bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0686b11。
sayings:
- text: 僧问。一切诸佛及诸佛阿耨多罗三藐三菩提。皆从此经出。如何是此经。师曰。长时诵不停。非义亦非声。曰。如何受持。师曰。若欲受持者。应须用眼听。信州永丰慧日庵主信州永丰慧日庵主本郡丘氏子。丱岁出家。于明心寺得度。自机契云居。熟游湘汉。暨归永丰。或处岩谷。或居鄽市。令乡民称丘师伯。凡有所
  ref: X80n1565_p0686b11（五灯会元）
- text: 问。以莫晓答之。忽语邑人曰。吾明日行脚去。汝等可来相送。于是賮路者毕集。师笑不已。众问其故。即书偈曰。丘师伯莫哓。寂寂明皎皎。日午打三更。谁人打得了。投笔而逝
  ref: X80n1565_p0686b11（五灯会元）
