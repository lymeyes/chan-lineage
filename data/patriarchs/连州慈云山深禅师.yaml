sayings:
- text: 僧问。宝镜当轩时如何。师曰。天地皆失色
  ref: X80n1565_p0574a13（五灯会元）
- text: 问。如何是教外别传一句。师曰。扣牙恐惊齿
  ref: X80n1565_p0574a13（五灯会元）
