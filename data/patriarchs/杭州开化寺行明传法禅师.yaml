id: 杭州开化寺行明传法禅师
name: 杭州开化寺行明传法
school: 法眼宗
teacher: 天台韶
status: draft
bio: 本州于氏子。礼雪窦智觉禅师为师。及智觉迁永明。遂入天台国师之室。蒙授记莂。复归永明。翊赞廼师。海众倾仰。忠懿王建六和寺本朝赐开化额。延请住持。聚徒说法
sayings:
- text: 僧问。如何是开化门中流出方便。师曰。日日潮音两度闻
  ref: X80n1565_p0373a16（五灯会元）
- text: 问。如何是无尽灯。师曰。谢阇黎照烛
  ref: X80n1565_p0373a16（五灯会元）
