id: 投子大同禅师
name: 投子大同
honorific: 舒州投子大同禅师（翠微无学法嗣）
school: 青原系
dynasty: 唐（819—914）
region: 舒州投子山（今安徽桐城）
teacher: 翠微无学（石头希迁再传）
source_ref: 五灯会元·卷五·舒州投子大同 / 景德传灯录·卷十五
cbeta: T51n2076 卷十五
bio: 翠微无学之法嗣，住舒州投子山，世称「投子」。行履高古，机辩超绝，常以「油糍」「劫火」之喻接人，门下众多，为唐末禅门一大宗匠。
sayings:
- text: 僧问「一切声是佛声否」，师云「是」。僧云「和尚莫沸碗鸣声」，师云「唤作沸碗鸣声，他亦不管」。
  ref: 五灯会元·卷五·投子大同
- text: 僧问「如何是佛」，师云「魔即是」；僧云「魔即是，何名作佛」，师云「即这魔」。
  ref: 五灯会元·卷五·投子大同
