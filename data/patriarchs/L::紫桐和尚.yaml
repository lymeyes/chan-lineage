name: 紫桐
school: 南岳系
teacher: 子湖踪
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0158a03。
sayings:
- text: 僧问。如何是紫桐境。师曰。汝眼里著沙得么。曰。大好紫桐境也不识。师曰。老僧不讳此事。其僧拟出去。师下禅床擒住曰。今日好个公案。老僧未得分文入手。曰。赖遇某甲是僧。师拓开曰。祸不单行
  ref: X80n1565_p0158a03（五灯会元）
