sayings:
- text: 上堂。灵源不动。妙体何依。历历孤明。是谁光彩。若道真如实际。大似好肉剜疮。更作祖意商量。正是迷头认影。老胡四十九年说梦即且止。僧堂里㤭陈如上座为你诸人举觉底。还记得么。良久曰。惜取眉毛好
  ref: X80n1565_p0641b04（五灯会元）
