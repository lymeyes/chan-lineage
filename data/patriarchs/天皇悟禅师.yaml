id: 天皇悟禅师
name: 天皇道悟
honorific: 荆州天皇道悟禅师（石头希迁法嗣）
school: 青原系
dynasty: 唐（748—807）
region: 荆州天皇寺（今湖北江陵）
teacher: 石头希迁
source_ref: 五灯会元·卷七·荆州天皇道悟 / 景德传灯录·卷十四
cbeta: T51n2076 卷十四
bio: 石头希迁之法嗣，青原系重要传人。住荆州天皇寺，传法于龙潭崇信，下开德山宣鉴，云门、法眼二宗皆其远裔。唐末以来有「天皇道悟／天王道悟」法系之辨，关乎云门、法眼之源出，今据主流灯录以天皇道悟为正。
sayings:
- text: 师示众：「汝等诸人，各各唤什么作禅？」僧无对；师自代云「唤作禅，早是赚汝了也。」（不立一法）
  ref: 五灯会元·卷七·天皇道悟
status: draft
