id: L::韶州温门山满禅师
name: 韶州温门山满
school: 云门宗
teacher: 云门偃
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0570a06。
sayings:
- text: 僧问。如何是佛。师曰。胸题卍字。曰。如何是祖。师曰。不游西土。有人指壁上画
  ref: X80n1565_p0570a06（五灯会元）
- text: 问。既是千尺松。为甚么却在屋下。师曰。芥子纳须弥作么生
  ref: X80n1565_p0570a06（五灯会元）
- text: 问。隔墙见角。便知是牛时如何。师便打
  ref: X80n1565_p0570a06（五灯会元）
- text: 问。如何是和尚家风。师曰。汝曾读书么
  ref: X80n1565_p0570a06（五灯会元）
- text: 问。太子初生为甚么不识父母。师曰。迥然尊贵
  ref: X80n1565_p0570a06（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0570a06），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
