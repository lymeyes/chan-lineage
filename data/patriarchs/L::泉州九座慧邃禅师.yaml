sayings:
- text: 上堂。九座今日向孤峰绝顶驾一只铁船。截断天下人要津。教他挥篙动棹不得。有个锦标子。且道在甚么人手里。拈拄杖曰。看。看。向道是龙刚不信。等闲夺得始惊人
  ref: X80n1565_p0648a02（五灯会元）
