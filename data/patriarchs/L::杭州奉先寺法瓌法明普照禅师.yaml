bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0366a02。
sayings:
- text: 僧问。释迦出世。天雨四华。地摇六动。未审今日有何祥瑞。师曰。大众尽见。曰。法王法如是。师曰。人王见在
  ref: X80n1565_p0366a02（五灯会元）
- text: 问。法眼宝印。和尚亲传。今日一会。当付何人。师曰。谁人无分。曰。恁么则雷音普震无边刹去也。师曰。也须善听
  ref: X80n1565_p0366a02（五灯会元）
