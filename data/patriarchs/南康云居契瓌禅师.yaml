bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0381b14。
sayings:
- text: 僧问。路逢死蛇莫打杀。无底篮子盛将归。未审师还受也无。师曰。你甚么处得来。曰。恁么则不虗施也。师曰。却且提取去
  ref: X80n1565_p0381b14（五灯会元）
- text: 问。如何是佛。师曰。赞叹不及。曰。莫祇这个便是么。师曰。不令人赞叹
  ref: X80n1565_p0381b14（五灯会元）
