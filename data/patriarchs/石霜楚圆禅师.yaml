id: 石霜楚圆禅师
name: 石霜楚圆
alias: 慈明楚圆
honorific: 石霜楚圆禅师·慈明（汾阳善昭法嗣）
school: 临济宗
dynasty: 北宋（986—1039）
region: 潭州石霜山（今湖南浏阳）
teacher: 汾阳善昭
source_ref: 五灯会元·卷十二·潭州石霜楚圆 / 建中靖国续灯录
cbeta: X77n1524（建中靖国续灯录）相关章次
bio: 汾阳善昭之法嗣，临济宗第七代，号「慈明」。性豪逸，机辩无碍，行止不羁而大用现前，以峻烈钳锤接人。住潭州石霜山，后迁南源、道吾。门人杨岐方会、黄龙慧南，分创杨岐、黄龙二派，临济宗遂大行天下。楚圆亦以「诙谐怒骂」之风格著称，谓「佛法无用功处」。
sayings:
- text: 师示众：「一切佛法，自心本有；将心外求，舍父逃走。」（痛斥向外驰求）
  ref: 五灯会元·卷十二·石霜楚圆
- text: 杨岐方会初参，师每于食后辄出，遇方会于道，以「汝总不遇我」折之；方会屡请入室，师终以「汝去，吾不畜沙弥」却之，后乃印可。（接人之辣）
  ref: 五灯会元·卷十二·石霜楚圆 / 杨岐方会机缘
