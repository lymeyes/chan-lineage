id: 承天简禅师
name: 承天简
school: 云门宗
teacher: 泐潭澄
status: draft
bio: 五则举：法灯禅师问僧：禅客相逢祇弹指，此心能有几人知？作么生会？僧弹指一下。灯云：恁么会又争得？
sayings:
- text: 僧云：未审和尚尊意如何？灯弹指一下。师拈云：将谓众生苦，更有苦众生。举：玄沙和尚到三斗庵主处，三斗乃云：住山年深，不怪无坐具。沙云：庵主来在那？后法灯别三斗语云：当时但触礼。师拈云：玄沙不解作客，劳烦主人；法灯大似将砖换玉。举南泉和尚有书与茱萸和尚，书中云：理随事变，宽廓非外；事从理变，寂寥非内。茱萸看了呈起，问大众云：谁能与山僧作得回书？乃有
  ref: X78n1556_p0366a02（建中靖国续灯录）
- text: 僧问：如何是宽廓非外？茱萸云：问一答百也无妨。僧曰：如何是寂寥非内？茱萸云：睹对颜色不好手。僧又问长沙和尚：如何是宽廓非外？长沙闭目良久。僧曰：如何是寂寥非内？长沙开目视之。僧又问赵州和尚：如何是宽廓非外？州作吃饭势。僧曰：如何是寂寥非内？州作拭口势。僧便举似南泉，泉云：此之三人不谬为吾嫡子。师拈云：此三人，一人得皮，一人得肉，一人秦不収、魏不管。举：
  ref: X78n1556_p0366a02（建中靖国续灯录）
- text: 僧问大颠：和尚不昧本来人，请师高著眼。颠低头，僧曰：大颠法道今日亲晓，未审灵山事若何？颠举头，僧曰：一等勿弦琴，唯师弹得妙。颠合掌，僧展两手，颠云：赖遇老僧。僧礼拜，颠便皈方丈，
  ref: X78n1556_p0366a02（建中靖国续灯录）
- text: 僧云：弄巧成拙。师拈云：遮僧虽能掉斗，不解理兵，大颠大似生钱放债。举：有一梵僧来参仰山，仰山于地上𦘕一半月相，僧添成圆月相，乃以脚抹却。山展两手，
  ref: X78n1556_p0366a02（建中靖国续灯录）
- text: 僧云：此土有小释迦出现。师拈云：仰山大似哑子吃苦瓜
  ref: X78n1556_p0366a02（建中靖国续灯录）
