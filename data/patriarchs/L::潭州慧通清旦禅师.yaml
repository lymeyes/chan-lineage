id: L::潭州慧通清旦禅师
name: 潭州慧通清旦
school: 杨岐派
teacher: 大沩泰
status: draft
bio: 蓬州严氏子。初出关至德山。值泰
sayings:
- text: 上堂。举。赵州曰。台山婆子已为汝勘破了也。且道意在甚么处。良久曰。就地撮将黄叶去。入山推出白云来。师闻释然。翌日入室。山
  ref: X80n1565_p0809b05（五灯会元）
- text: 问。前百丈不落因果。因甚么堕野狐。后百丈不昧因果。因甚么脱野狐。师曰。好与一坑埋却。住后
  ref: X80n1565_p0809b05（五灯会元）
- text: 上堂。说佛说祖。正如好肉剜疮。举古举今。犹若残羹馊饭。一闻便悟。已落第二头。一举便行。早是不著便。须知个事。如天普盖。似地普擎。师子游行。不求伴侣。壮士展臂。不借他力。佛祖拈掇不起。衲僧愿见无门。迷悟双忘。圣凡路绝。且道从上诸圣以何法示人。喝一喝曰。莫妄想。佛性和尚忌日
  ref: X80n1565_p0809b05（五灯会元）
- text: 上堂。三脚驴子弄蹄行。步步相随不相到。树头惊起双双鱼。拈来一老一不老。为怜松竹引清风。其奈出门便是草。因唤檀郎识得渠。大机大用都推倒。烧香勘证见根源。粪埽堆头拾得宝。丛林浩浩谩商量。劝君莫谤先师好
  ref: X80n1565_p0809b05（五灯会元）
