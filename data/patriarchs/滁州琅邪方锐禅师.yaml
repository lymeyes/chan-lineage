bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0453b04。
sayings:
- text: 上堂。造化无生物之心。而物物自成。雨露非润物之意。而灵苗自荣。所以药剂不食而病自损。良师不亲而心自明。故知妙慧灵光。不从缘得。到这里方许你进步。琅邪与你别作个相见。还有么。若无。不可压良为贱
  ref: X80n1565_p0453b04（五灯会元）
