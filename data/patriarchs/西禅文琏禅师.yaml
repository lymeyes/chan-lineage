id: 西禅文琏禅师
name: 西禅文琏
alias: 西禅琏
school: 杨岐派
teacher: 龙门清远禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《续传灯录》T51n2077_p0668b13。
sayings:
- text: 上堂。一向恁么去。直得凡圣路绝水泄不通。铁蛇钻不入。铁锤打不破。至于千里万里鸟飞不度。一向恁么来。未免灰头土面带水拕泥。唱九作十指鹿为马。非唯孤负先圣。亦乃埋没己灵。敢问大众。且道恁么去底是。恁么来底是。芍药花开菩萨面。棕榈叶散夜叉头
  ref: T51n2077_p0668b13（续传灯录）
- text: 上堂。诸方浩浩谈玄。每日撞钟打鼓。西禅无法可说。勘破灯笼露柱。门前不置下马台。免被傍人来借路。若借路须照顾脚下。若参差邯郸学唐步
  ref: T51n2077_p0668b13（续传灯录）
- text: 上堂。心生种种法生。森罗万象纵横信手拈来便用。日轮午后三更。心灭种种法灭。四句百非路绝。直饶达磨出头。也是眼中著屑。心生心灭是谁。木人携手同归。归到故乡田地。犹遭顶上一锤
  ref: T51n2077_p0668b13（续传灯录）
- text: 上堂。正月孟春犹寒。直下言端语端。拈起衲僧鼻孔。穿开祖佛心肝。知有者。达磨不来东土。二祖不往西天。不知有者。谁知当面蹉过。迢迢十万八千。山僧为尔重说偈言。大众莫教孤负。孟春犹寒
  ref: T51n2077_p0668b13（续传灯录）
- text: 僧问。师子未出窟时如何。师曰。爪牙已露。曰出窟后如何。师曰。龙头蛇尾。曰出与未出时如何。师曰。正好吃棒。问以一重去一重即不
  ref: T51n2077_p0668b13（续传灯录）
- text: 问。不以一重去一重时如何。师曰。阇黎有许多工夫
  ref: T51n2077_p0668b13（续传灯录）
