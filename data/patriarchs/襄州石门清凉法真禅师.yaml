id: 襄州石门清凉法真禅师
name: 襄州石门清凉法真
school: 法眼宗
teacher: 天童觉
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《续传灯录》T51n2077_p0632b18。
sayings:
- text: 上堂。柳色含烟春光迥秀。一峰孤峻万卉争芳。白云淡泞已无心。满目青山元不动。渔翁垂钓。一溪寒雪未曾消。野渡无人。万古碧潭清似镜。宾中有主。拄杖横挑日月轮。主中有宾。踏破草鞋赤脚走。直得宾主互显杀活自由。理事混融正偏不滞。入荒田不拣。信手拈来草。且道如何委悉。尘中虽有隐身术。争似全身入帝乡
  ref: T51n2077_p0632b18（续传灯录）
