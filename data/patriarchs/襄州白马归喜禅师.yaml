id: 襄州白马归喜禅师
name: 襄州白马归喜
school: 法眼宗
teacher: 大阳玄禅师
status: draft
bio: 初问大阳。学人蒙昧。乞指个入路。阳曰。得。良久。乃召师。师应诺。阳曰。与你个入路。师于言下有省。住后
sayings:
- text: 僧问。如何是佛法大意。师曰。善犬带牌
  ref: X80n1565_p0527a08（五灯会元）
- text: 问。如龟藏六时如何。师曰。布袋里弓箭
  ref: X80n1565_p0527a08（五灯会元）
- text: 问。不著佛求。不著法求。当于何求。师曰。村人跪拜石师子。曰。意旨如何。师曰。社树下设斋
  ref: X80n1565_p0527a08（五灯会元）
- text: 上堂。急走即蹉过。慢行趁不上。没量大衲僧无计奈何。有多口饶舌底出来
  ref: X80n1565_p0527a08（五灯会元）
- text: 问。如何是半句。师曰。投身掷下。曰。这个是一句也。师曰。半句也摸不著
  ref: X80n1565_p0527a08（五灯会元）
- text: 问。如何是閴寂之门。师曰。莫闹。莫闹
  ref: X80n1565_p0527a08（五灯会元）
