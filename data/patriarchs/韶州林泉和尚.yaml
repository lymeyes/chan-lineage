id: 韶州林泉和尚
name: 韶州林泉
school: 云门宗
teacher: 云门偃
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0571a12。
sayings:
- text: 僧问。如何是林泉主。师曰。岩下白石。曰。如何是林泉家风。师曰。迎宾待客
  ref: X80n1565_p0571a12（五灯会元）
- text: 问。如何是道。师曰。迢迢。曰。便恁么领会时如何。师曰。久久忘缘者。宁怀去住情
  ref: X80n1565_p0571a12（五灯会元）
