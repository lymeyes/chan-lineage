bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0716a07。
sayings:
- text: 上堂。同云欲雪未雪。爱日似晖不晖。寒雀啾啾闹篱落。朔风冽冽舞帘帷。要会韶阳亲切句。今朝觌面为提撕。卓拄杖。下座
  ref: X80n1565_p0716a07（五灯会元）
