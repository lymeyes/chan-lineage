id: 广州文殊院圆明禅师
name: 广州文殊院圆明
school: 南岳系
teacher: 长庆大安禅师
status: draft
bio: 福州陈氏子。参大沩得旨后。造雪峰请益。法无异味。尝游五台山。睹文殊化现。乃随方建院。以文殊为额。开宝中枢密使李崇矩巡护南方。因入院睹地藏菩萨像。问僧。地藏何以展手。僧曰。手中珠被贼偷却也。李却问师。既是地藏。为甚么遭贼。曰。今日捉下也。李礼谢之
