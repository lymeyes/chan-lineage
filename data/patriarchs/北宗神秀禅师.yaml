id: 北宗神秀禅师
name: 北宗神秀
alias: 北宗秀
school: —
teacher: 五祖大满旁出
status: draft
bio: 耶舍三藏志云。艮地生玄旨。通尊媚亦尊。比肩三九族。足下一毛分开封人也。姓李氏。少亲儒业。博综多闻。俄舍爱出家。寻师访道。至蕲州双峰东山寺。遇五祖以坐禅为务。乃叹伏曰。此真吾师也。誓心苦节。以樵汲自役。而求其道。祖默识之。深加器重。祖既示灭。秀遂住江陵当阳山。唐武后闻之。召至都下。于内道场供养。特加钦礼。命于旧山置度门寺。以旌其德。时王公士庶皆望尘拜伏。暨中宗即位。尤加礼重。大臣张说尝问法要。执弟子礼。师有偈
sayings:
- text: 示众曰。一切佛法。自心本有。将心外求。舍父逃走。神龙二年于东都天宫寺入灭。谥大通禅师。羽仪法物。送殡于龙门。帝送至桥。王公士庶皆至葬所。张说及征士卢鸿一各为碑诔。门人普寂．义福等。并为朝野所重。嵩岳慧安国师嵩岳慧安国师耶舍三藏志云。九女出人伦。八女绝婚姻。朽床添六脚。心祖众中尊荆州枝江人也。姓卫氏。隋开皇十七年括天下私度僧尼。勘师。师曰。本无名。遂遁于山谷。大业中。大发丁夫开通济渠。饥殍相枕。师乞食以救之。获济者众。炀帝征师。不赴。潜入大和山。暨帝幸江都。海内扰攘。乃杖锡登衡岳。行头陀行。唐贞观中。至黄梅谒忍祖。遂得心要。麟德元年游终南山石壁。因止焉。高宗尝召。师不奉诏。于是遍历名迹。至嵩少。云。是吾终焉之地也。自尔禅者辐凑。有坦然．怀让二僧来参问曰。如何是祖师西来意。师曰。何不问自己意。曰。如何是自己意。师曰。当观密作用。曰。如何是密作用。师以目开合示之。然于言下知归。让乃即谒曹溪。武后征至辇下。待以师礼。与秀禅师同加钦重。后尝问师。甲子多少。师曰。不记。后曰。何不记邪。师曰。生死之身。其若循环。环无起尽。焉用记为。况此心流注。中间无间。见沤起灭者。乃妄想耳。从初识至动相灭时。亦只如此。何年月而可记乎。后闻稽颡。信受。神龙二年中宗赐紫袈裟。度弟子二七人。仍延入禁中供养。三年。又赐摩衲。辞归嵩岳。是年三月三日。嘱门人曰。吾死已。将尸向林中。待野火焚之。俄尔万回公来。见师猖狂。握手言论。傍侍倾耳。都不体会。至八日。闭户偃身而寂。春秋一百二十八隋开皇二年壬寅生。唐景龙三年己酉灭。时称老安国师。门人遵旨。舁置林间。果野火自然。阇维得舍利八十粒。内五粒色紫。留于宫中。至先天二年门人建浮图焉
