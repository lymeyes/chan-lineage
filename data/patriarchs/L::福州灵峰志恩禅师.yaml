id: L::福州灵峰志恩禅师
name: 福州灵峰志恩
school: —
teacher: 白龙希
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《景德传灯录》T51n2076_p0402a04。
sayings:
- text: 僧问。如何是吹毛剑。师曰。我进前汝退后。曰恁么即学人丧身命去也。师曰。不打水鱼自惊。问如何是佛。师曰。更是阿谁。曰既然如此为什么迷妄有差殊。师曰。但自不亡羊何须泣岐路。问如何是灵峰境。师曰。万叠青山如饤出。两条绿水若图成。曰如何是境中人。师曰。明明密密密密明明
  ref: T51n2076_p0402a04（景德传灯录）
