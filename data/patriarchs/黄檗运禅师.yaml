bio: '闽人，嗣百丈怀海。居洪州黄檗山，机锋峻烈，倡「即心是佛」「无心是道」，谓「汝等诸人，尽是喫酒糟汉，恁么行脚，何处有今日？」

  临济义玄三度问「如何是佛法的大意」，三度被打，后谒大愚，言下大悟。师著有《传心法要》《宛陵录》，裴休集录，为洪州宗重要文献。'
sayings:
- text: 示众：「即心是佛。无心者，无一切心也。空中无物，即是真心。」
  ref: 传心法要
- text: 临济问「如何是佛法大意」，师便打；三度问，三度被打。
  ref: 五灯会元·卷三·黄檗希运
