bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0398a16。
sayings:
- text: 僧问。如何是佛。师曰。老僧并不知。曰。和尚是大善知识。为甚么不知。师曰。老僧不曾接下机
  ref: X80n1565_p0398a16（五灯会元）
- text: 问。如何是道。师曰。往来无障碍。复曰。忽遇大海。作么生过。僧拟议。师便打
  ref: X80n1565_p0398a16（五灯会元）
