sayings:
- text: 上堂。顾视左右曰。诸人还知么。夜明帘外之主。万化不渝。瑠璃殿上之尊。四臣不昧。端拱而治。不令而行。寿逾百亿须弥。化洽大千沙界。且道正恁么时。如何行履。野老不知黄屋贵。六街慵听静鞭声
  ref: X80n1565_p0538a02（五灯会元）
