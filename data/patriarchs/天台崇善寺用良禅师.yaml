bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0599b16。
sayings:
- text: 僧问。三门与自己。是同是别。师曰。八两移来作半斤。曰。恁么则秋水泛渔舟去也。师曰。东家点灯。西家为甚么却觅油。曰。山高月上迟。师曰。道甚么。曰。莫瞌睡。师曰。入水见长人
  ref: X80n1565_p0599b16（五灯会元）
