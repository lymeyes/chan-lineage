id: L::泉州龟洋慧忠禅师
name: 泉州龟洋慧忠
school: 曹洞宗
teacher: 草庵义
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0513a12。
sayings:
- text: 问。何方来。师曰。六眸峰。庵曰。还见六眸否。师曰。患非重瞳。庵然之。师寻回故山。属唐武宗废教。例民其衣。暨宣宗中兴。师曰。古人有言。上升道士不受箓。成佛沙弥不具戒。祇为白衣。过中不食。不宇而禅。迹不出山者三十年。述三偈以自见曰。雪后始知松柏操。云收方见济河分。不因世主教还俗。那辨鸡群与鹤群。多年尘事谩腾腾。虽著方袍未是僧。今日修行依善慧。满头留发候然灯。形仪虽变道常存。混俗心源亦不昏。试读善财巡礼偈。当时岂例作沙门。谓门弟子曰。众生不能解脱者。情累尔。悟道易。明道难
  ref: X80n1565_p0513a12（五灯会元）
- text: 僧问。如何得明道去。师曰。但脱情见。其道自明矣。夫明之为言。信也。如禁蛇人。信其咒力药力。以蛇绾弄揣怀袖中无难。未知咒药等力者怖骇弃去。但谛见自心。情见便破。今千疑万虑不得用者。未见自心者也。忽索香焚罢。安然而化。全身葬于无了禅师塔之东。后数年。塔忽坼裂。连阶丈余。主僧将发视之。是夜宴寂中见无了曰。不必更发也。今为沈陈二真身。无了姓沈。见马祖
  ref: X80n1565_p0513a12（五灯会元）
