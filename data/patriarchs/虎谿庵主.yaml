id: 虎谿庵主
name: 虎谿
school: 临济宗
teacher: 临济义玄禅师
status: draft
bio: 僧到抽坐具相看。师不顾。僧曰。知道庵主有此机锋。师鸣指一声。僧曰。是何宗旨。师便掴之。僧曰。知道今日落人便宜。师曰。犹要棒在。有僧才入门。师便喝。僧默然。师打之。僧却喝。师曰。好个草贼。僧到不审。师曰。阿谁。僧喝。师曰。得恁么无宾主。僧曰。犹要第二喝在。师乃喝之。有
sayings:
- text: 僧问。和尚何处人事。师云。陇西人
  ref: T51n2076_p0296a05（景德传灯录）
- text: 僧云。承闻陇西有鹦鹉还实也无。师云是
  ref: T51n2076_p0296a05（景德传灯录）
- text: 僧云。和尚莫不是也无。师便作鹦鹉声
  ref: T51n2076_p0296a05（景德传灯录）
- text: 僧云。好个鹦鹉。师便棒之
  ref: T51n2076_p0296a05（景德传灯录）
