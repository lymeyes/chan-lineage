bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0312b09。
sayings:
- text: 僧问。如何是佛法大意。师便喝。僧曰。尊意如何。师曰。会么。曰。不会。师又喝
  ref: X80n1565_p0312b09（五灯会元）
- text: 问。太阳一显人皆羡。鼓声绝罢意如何。师曰。季秋凝后好晴天
  ref: X80n1565_p0312b09（五灯会元）
