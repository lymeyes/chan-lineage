id: L::南岳高台寺宣明佛印禅师
name: 佛印了元
school: 黄龙派
teacher: 黄龙南
bio: 北宋黄龙派名僧，住云居、金山等刹。与苏轼（东坡）交游甚密，「佛印」「东坡」之问答、玉带镇山门等轶事广为流传，为宋儒释交游之代表。
sayings:
- text: 东坡问：「秃驴何在？」佛印应声：「学士姓苏（苏/俗），不姓佛。」二人相与大笑。
  ref: 五灯会元·卷十二·佛印了元禅师（并见东坡禅喜集）
- text: 佛印住金山，东坡访之，印曰：「此间无坐处。」坡曰：「暂借佛印四大为座。」印曰：「学士带玉带，老僧有一转语，若答得，即留玉带。」
  ref: 五灯会元·卷十二·佛印了元禅师
