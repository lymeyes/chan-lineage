sayings:
- text: 僧问。如何是苏台境。师曰。山横师子。秀。水接太湖清。曰。如何是境中人。师曰。衣冠皇宋后。礼乐大周前。师凡见僧。必
  ref: X80n1565_p0643a07（五灯会元）
- text: 问。近日如何。僧拟对。即拊其背曰。不可思议。将示寂。众集。复曰。不可思议。乃合掌而终
  ref: X80n1565_p0643a07（五灯会元）
