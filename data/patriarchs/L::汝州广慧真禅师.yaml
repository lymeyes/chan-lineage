id: L::汝州广慧真禅师
name: 汝州广慧真
school: 临济宗
teacher: 风穴沼
status: draft
bio: 尝在风穴作园头。穴问曰。会昌沙汰时。护法善神向甚么处去。师曰。常在阛阓中。要且无人识。穴曰。汝彻也。师礼拜。出世。开堂日
sayings:
- text: 僧问。如何是广慧境。师曰。小寺前。资庆后
  ref: X80n1565_p0412b16（五灯会元）
- text: 问。如何是和尚家风。师曰。锨𭺗镢子
  ref: X80n1565_p0412b16（五灯会元）
