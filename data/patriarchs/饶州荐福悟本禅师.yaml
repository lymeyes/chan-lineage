id: 饶州荐福悟本禅师
name: 饶州荐福悟本
school: 杨岐派
teacher: 径山杲
status: draft
bio: 江州人也。自江西云门参侍妙喜。至泉南小谿。于时英俊毕集。受印可者多矣。师私谓其弃已。且欲发去。妙喜知而语之曰。汝但专意参究。如有所得。不待开口。吾已识也。既而有闻师入室者。故谓师曰。本侍者参禅许多年。逐日只道得个不会。师诟之曰。这小鬼你未生时。我已三度霍山庙里退牙了。好教你知。由是益锐志。以狗子无佛性话。举无字而提撕。一夕将三鼓。倚殿柱昏寐间。不觉无字出口吻。忽尔顿悟。后三日。妙喜归自郡城。师趋丈室。足才越阃。未及吐词。妙喜曰。本胡子这回方是彻头也。住后
sayings:
- text: 上堂。高揖释迦．不拜弥勒者。与三十拄杖。何故。为他祇会步步登高。不会从空放下。东家牵犂．西家拽耙者。与三十拄杖。何故。为他祇会从空放下。不会步步登高。山僧恁么道。还有过也无。众中莫有点检得出者么。若点检得出。须弥南畔。把手共行。若点检不出。布袋里老鸦。虽活如死
  ref: X80n1565_p0797a18（五灯会元）
- text: 上堂。释迦掩室于摩竭。净名杜口于毗耶。须菩提唱无说而显道。释梵绝视听而雨华。大众。这一队不唧𠺕汉。无端将祖父田园私地结契。各据四至界分。方圆长短。一时花擘了也。致令后代儿孙。千载之下。上无片瓦盖头。下无卓锥之地。博山当时若见。十字路头掘个无底深坑。唤来一时埋却。免见𮞏相钝置。何谓如此。不见道。家肥生孝子。国霸有谋臣
  ref: X80n1565_p0797a18（五灯会元）
- text: 上堂。乾闼婆王曾奏乐。山河大地皆作舞。争如跛脚老云门。解道腊月二十五。博山今日有条攀条。无条攀例。也要应个时节。蓦拈拄杖。横按膝上。作抚琴势云。还有闻弦赏音者么。良久云。直饶便作凤凰鸣。毕竟有谁知指法。卓一下。下座
  ref: X80n1565_p0797a18（五灯会元）
