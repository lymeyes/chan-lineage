id: 福州中际可遵禅师
name: 福州中际可遵
school: —
teacher: 报本兰
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0624a11。
sayings:
- text: 上堂。咄咄咄。井底啾啾是何物。直饶三千大千。也祇是个鬼窟。咄
  ref: X80n1565_p0624a11（五灯会元）
- text: 上堂。昨夜四更起来。呵呵大笑不歇。幸然好一觉睡。霜钟撞作两橛
  ref: X80n1565_p0624a11（五灯会元）
- text: 上堂。禾山普化忽颠狂。打鼓摇铃戏一场。劫火洞然宜煮茗。岚风大作好乘凉。四蛇同箧看他弄。二鼠侵藤不自量。沧海月明何处去。广寒宫殿白银床。咄
  ref: X80n1565_p0624a11（五灯会元）
- text: 上堂。八万四千深法门。门门有路超乾坤。如何个个踏不著。祇为蜈蚣太多脚。不唯多脚亦多口。钉觜铁舌徒增丑。拈椎竖拂泥洗泥。扬眉瞬目笼中鸡。要知佛祖不到处。门掩落花春鸟啼。邢州开元法明上座邢州开元法明上座依报本未久。深得法忍。后归里事落魄。多嗜酒呼卢。每大醉唱柳词数阕。日以为常。乡民侮之。召斋则拒。召饮则从。如是者十余年。咸指曰醉和尚。一日谓寺众曰。吾明旦当行。汝等无他往。众窃笑之。翌晨。摄衣就座。大呼曰。吾去矣。听吾一偈。众闻奔视。师乃曰。平生醉里颠蹶。醉里却有分别。今宵酒醒何处。杨柳岸晓风残月。言讫寂然。撼之已委蜕矣
  ref: X80n1565_p0624a11（五灯会元）
