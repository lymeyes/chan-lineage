bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0588b06。
sayings:
- text: 僧问。无法可说。是名说法。既是无法可说。又将何说。师曰。霜寒地冻。曰。空生不解岩中坐。惹得天花动地来。师曰。日出冰消。僧拟议。师曰。何不进语。僧又无语。师曰。车不横推。理无曲断
  ref: X80n1565_p0588b06（五灯会元）
