id: L::潭州龙兴禅师
name: 潭州龙兴
school: 青原系
teacher: 大光诲
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0208b06。
sayings:
- text: 僧问。一拨便转时如何。师曰。根不利
  ref: X80n1565_p0208b06（五灯会元）
- text: 问。得坐披衣时如何。师曰。不端严。曰。为甚么不端严。师曰。不从修证得
  ref: X80n1565_p0208b06（五灯会元）
- text: 问。如何是道中人。师曰。终日寂攒眉
  ref: X80n1565_p0208b06（五灯会元）
- text: 问。文不加点时如何。师曰。无目童儿不出户
  ref: X80n1565_p0208b06（五灯会元）
- text: 问。宾主未分时如何。师曰。双陆盘中不喝彩。曰。分后如何。师曰。骰子未曾抛
  ref: X80n1565_p0208b06（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0208b06），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
