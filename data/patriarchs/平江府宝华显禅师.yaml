bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0768b04。
sayings:
- text: 上堂曰。吃粥了也。头上安头。洗钵盂去。为虵画足。更问如何。自纳败阙。良久。高声召大众。众举首。师曰。归堂吃茶
  ref: X80n1565_p0768b04（五灯会元）
- text: 上堂。禅莫参。道休学。歇意忘机常廓落。现成公案早周遮。祇个无心已穿凿。直饶坐断未生前。难透山僧错错错
  ref: X80n1565_p0768b04（五灯会元）
