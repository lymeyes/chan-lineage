id: L::沂水蒙山光宝禅师
name: 沂水蒙山光宝
school: —
teacher: 荷泽会
status: draft
bio: 并州人也．姓周氏。初谒荷泽。泽谓之曰。汝名光宝。名以定体。宝即己有。光非外来。纵汝意用而无少乏。长夜蒙照而无间歇。汝还信否。师曰。信则信矣。未审光之与宝。同邪异邪。泽曰。光即宝。宝即光。何有同异之名乎。师曰。眼耳缘声色时。为复抗行。为有回互。泽曰。抗互且置。汝指何法为声色之体乎。师曰。如师所说。即无有声色可得。泽曰。汝若了声色体空。亦信眼耳诸根。及与凡与圣。平等如幻。抗行回互。其理昭然。师由是领悟。礼辞而去。初隐沂水蒙山。于唐元和二年圆寂。　不列章次
