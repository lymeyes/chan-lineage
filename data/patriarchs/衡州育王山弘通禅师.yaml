id: 衡州育王山弘通禅师
name: 衡州育王山弘通
school: 曹洞宗
teacher: 曹山本寂禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0496b17。
sayings:
- text: 僧问。混沌未分时如何。师曰。混沌。曰。分后如何。师曰。混沌
  ref: X80n1565_p0496b17（五灯会元）
- text: 上堂。释迦如来四十九年说不到底句。今夜山僧不避羞耻。与诸尊者共谭。良久曰。莫道错。珍重
  ref: X80n1565_p0496b17（五灯会元）
- text: 僧问。学人有病。请师医。师曰。将病来。与汝医。曰。便请。师曰。还老僧药价钱来
  ref: X80n1565_p0496b17（五灯会元）
- text: 问。曹源一路即不
  ref: X80n1565_p0496b17（五灯会元）
- text: 问。衡阳江畔事如何。师曰。红炉焰上无根草。碧潭深处不逢鱼
  ref: X80n1565_p0496b17（五灯会元）
- text: 问。心法双亡时如何。师曰。三脚虾蟆背大象
  ref: X80n1565_p0496b17（五灯会元）
- text: 问。如何是西来意。师曰。老僧毛竖
  ref: X80n1565_p0496b17（五灯会元）
- text: 问。如何是佛法大意。师曰。直侍文殊过。即向你道。曰。文殊过也。请和尚道。师便打
  ref: X80n1565_p0496b17（五灯会元）
- text: 问。如何是和尚家风。师曰。浑身不直五文钱。曰。大贫寒生。师曰。古代如是。曰。如何施设。师曰。随家丰俭
  ref: X80n1565_p0496b17（五灯会元）
- text: 问。如何是急切处。师曰。针眼里打筋斗
  ref: X80n1565_p0496b17（五灯会元）
- text: 问。如何是本来身。师曰。回光影里见方亲
  ref: X80n1565_p0496b17（五灯会元）
