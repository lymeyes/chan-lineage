id: 东京普净院常觉禅师
name: 东京普净院常觉
school: 曹洞宗
teacher: 归宗弘章禅师
status: draft
bio: 陈留李氏子。初访归宗。闻法省悟。遂求出家。未几。归宗将顺寂。召师抚之曰。汝于法有缘。他后济众人。莫测其量也。仍以披剃事。嘱诸门人。师至唐乾化二年落发。明年纳戒于东林寺甘露坛。寻游五台山。还上都。于丽景门外独居二载。间有北邻信士张生者。请师供养。张素探玄理。因叩师垂诲。师乃随宜开诱。张生于言下悟入。设榻留宿。至深夜。与妻窃窥之。见师体遍一榻。头足俱出。及令婢仆视之。即如常。倍加钦慕。曰。弟子夫妇垂老。今愿割宅之前堂。以裨丈室。师欣然受之。至后唐天成三年。遂成大院。赐额曰普净。师以时机浅昧。难任极旨。苟启之非器。令彼招谤讟之咎。我宁不务开法。每月三八施浴。僧道万计。师尝谓诸徒曰。但得慧门无壅。则福何滞哉。一日。给事中陶谷入院。致礼而问曰。经云。离一切相则名诸佛。今目前诸相纷然。如何离得。师曰。给事见个甚么。陶欣然仰重。自是王公大人。屡荐章服师号。皆却而不受。以开宝四年十二月二日示疾。十一日告众。嘱付讫。右胁而化
