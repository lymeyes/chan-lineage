id: 庐山开先清耀禅师
name: 庐山开先清耀
school: 云门宗
teacher: 云门文偃禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0573b01。
sayings:
- text: 僧问。如何是灯灯不绝。师曰。青杨翻递植。曰。学人不会。师曰。无根树下唱虗名
  ref: X80n1565_p0573b01（五灯会元）
- text: 问。披云一句师亲唱。长庆今朝事若何。师曰。家家观世音
  ref: X80n1565_p0573b01（五灯会元）
- text: 问。如何是披云境。师曰。一缾渌水安窗下。便当生涯度几秋。曰。如何是长庆境。师曰。堂里老僧头雪白。曰。二境同归。应当别理。师曰。在处得人疑
  ref: X80n1565_p0573b01（五灯会元）
- text: 问。古㵎寒泉。谁人能到。师曰。干。曰。恁么则到也。师曰。深多少
  ref: X80n1565_p0573b01（五灯会元）
