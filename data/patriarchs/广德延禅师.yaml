id: 广德延禅师
name: 广德延
school: 曹洞宗
teacher: 青林虔
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0506a09。
sayings:
- text: 僧问。如何是和尚家风。师曰。山前人不住。山后人更忙
  ref: X80n1565_p0506a09（五灯会元）
- text: 问。如何是透法身句。师曰。无力登山水。茅户绝知音
  ref: X80n1565_p0506a09（五灯会元）
- text: 问。如何是佛法大意。师曰。始嗟黄叶落。又见柳条青
  ref: X80n1565_p0506a09（五灯会元）
- text: 问。尽大地是个死尸。向甚么处葬。师曰。北邙山下。千丘万丘。师不安
  ref: X80n1565_p0506a09（五灯会元）
- text: 僧问。和尚患个甚么。师曰。无私不坠的。曰。恁么则已知和尚病源也。师曰。你道老僧患甚么。曰。和尚忌口好。师便打
  ref: X80n1565_p0506a09（五灯会元）
- text: 问。如何是佛。师曰。画戟门开见坠仙。僧后问悟空。画戟门开见坠仙。意旨如何。空曰。直饶亲见释迦来。智者咸言不是佛
  ref: X80n1565_p0506a09（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0506a09），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
