id: 天台德韶国师
name: 天台德韶
honorific: 天台德韶国师（法眼文益法嗣，吴越国师）
school: 法眼宗
dynasty: 五代（891—972）
region: 天台山 / 吴越国（今浙江）
teacher: 法眼文益
source_ref: 五灯会元·卷十·天台德韶国师 / 景德传灯录·卷二十五
cbeta: T51n2076 卷二十五
bio: 法眼文益之法嗣，法眼宗第二代，吴越忠懿王钱俶礼为国师。遍参五十四员善知识，后于法眼言下契悟。住天台山，力劝钱俶遣使从高丽、日本寻回天台宗散佚典籍，并重兴台宗教观，使「教禅一致」之风大行于江南。天台宗之中兴，德韶实有力焉。门下永明延寿为其高弟。
sayings:
- text: 师于通玄峰顶有偈：「通玄峰顶，不是人间；心外无法，满目青山。」（法眼「一切现成」之旨）
  ref: 五灯会元·卷十·天台德韶国师
- text: 师常示：「法界无边，心亦无际；既无际已，更无有法为对。」
  ref: 五灯会元·卷十·天台德韶国师
