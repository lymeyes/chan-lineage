bio: 石霜庆诸禅师法嗣（或云得法于岩头全奯），住邵武龙湖。机缘见于《五灯会元》青原下石霜法嗣章。
sayings:
- text: 僧问：「如何是龙湖境？」师曰：「龙湖无水，鱼从何来？」
