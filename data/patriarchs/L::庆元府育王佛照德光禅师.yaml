id: L::庆元府育王佛照德光禅师
name: 庆元府育王佛照德光
school: 杨岐派
teacher: 径山杲
status: draft
bio: 临江军彭氏子。志学之年。依本郡东山光化寺吉禅师落发。一日入室。吉
sayings:
- text: 问。不是心。不是佛。不是物。是甚么。师罔措。遂致疑。通夕不寐。次日。诣方丈请益。昨日蒙和尚垂
  ref: X80n1565_p0795a03（五灯会元）
- text: 问。既不是心。又不是佛。又不是物。毕竟是甚么。望和尚慈悲指示。吉震威一喝曰。这沙弥。更要我与你下注脚在。拈棒劈脊打出。师于是有省。后谒月庵杲．应庵华．百丈震。终不自肯。适大慧领育王。四海英材鳞集。师亦与焉。大慧室中问师。唤作竹篦则触。不唤作竹篦则背。不得下语。不得无语。师拟对。慧便棒。师豁然大悟。从前所得。瓦解冰消。初住台之光孝
  ref: X80n1565_p0795a03（五灯会元）
- text: 僧问。浩浩尘中。如何辨主。师曰。中峰顶上塔心尖
  ref: X80n1565_p0795a03（五灯会元）
- text: 上堂。临济三遭痛棒。大愚言下知归。兴化于大觉棒头。明得黄檗意旨。若作棒会。入地狱如箭射。若不作棒会。入地狱如箭射。众中商量。尽道赤心片片。恩大难酬。总是识情卜度。未出阴界。且如临济悟去。是得黄檗力。是得大愚力。若也见得。许你顶门眼正。肘后符灵。其或未然。鸿福更为诸人通个消息。丈夫气宇冲牛斗。一踏鸿门两扇开
  ref: X80n1565_p0795a03（五灯会元）
- text: 上堂。七手八脚。三头两面。耳听不闻。眼󳬇不见。苦乐逆顺。打成一片。且道是甚么。路逢死虵莫打杀。无底篮子盛将归
  ref: X80n1565_p0795a03（五灯会元）
- text: 上堂。闻声悟道。落二落三。见色明心。错七错八。生机一路。犹在半途。且道透金刚圈．吞栗棘蓬底是甚么人。披蓑侧立千峰外。引水浇蔬五老前。师住灵隐日。孝宗皇帝尝诏问道。留宿内观堂。奏对机缘。备于本录。后示寂。塔全身于鄮峰东庵
  ref: X80n1565_p0795a03（五灯会元）
