id: 相国裴休居士
name: 相国裴休
school: 南岳系
teacher: 黄檗希运禅师
status: draft
bio: 字公美。河东闻喜人也。守新安日。属运禅师初于岭南黄檗山舍众入大安精舍。混迹劳侣。扫洒殿堂。公入寺烧香。主事祇接。因观壁画。乃
sayings:
- text: 问。是何图相。主事对曰。高僧真仪。公曰。真仪可观。高僧何在。主事无对。公曰。此间有禅人否。曰。近有一僧。投寺执役。颇似禅者。公曰。可请来询问得否。于是遽寻檗至。公睹之欣然曰。休适有一
  ref: X80n1565_p0151a15（五灯会元）
- text: 问。诸德吝辞。今请上人代酬一语。檗曰。请相公垂
  ref: X80n1565_p0151a15（五灯会元）
- text: 问。公举前话。檗朗声曰。裴休。公应诺。檗曰。在甚么处。公当下知旨。如获髻珠。曰。吾师真善知识也。示人克的若是。何故汩没于此乎。寺众愕然。自此延入府署。执弟子礼。屡辞不已。复坚请住黄檗山。荐兴祖道。有暇即躬入山顶谒。或渴闻玄论。即请入州中。公既通彻祖意。复博综教相。诸方禅学咸谓裴相不浪出黄檗之门也。至迁镇宣城。还思瞻礼。亦创精蓝。迎请居之。虽圭峰该通禅讲。为裴之所重。未若归心于黄檗而倾竭服膺者也。又撰圭峰碑云。休与师于法为昆仲。于义为交友。于恩为善知识。于教为内外护。斯可见矣。仍集黄檗语要。亲书序引。冠于编首。留镇山门。又亲书大藏经五百函号。迄今宝之。又圭峰禅师著禅源诠．原人论及圆觉经疏注．法界观。皆为之序。公笃志内典。深入法会。有发愿文传于世
  ref: X80n1565_p0151a15（五灯会元）
