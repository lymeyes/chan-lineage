bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0266a16。
sayings:
- text: 僧问。风恬浪静时如何。师曰。吹倒南墙
  ref: X80n1565_p0266a16（五灯会元）
- text: 问。如何是道中宝。师曰。不露光。曰。莫便是否。师曰。是即露也
  ref: X80n1565_p0266a16（五灯会元）
