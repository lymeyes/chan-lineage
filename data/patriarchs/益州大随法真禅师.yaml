id: 益州大随法真禅师
name: 益州大随法真
school: 南岳系
teacher: 长庆大安禅师
status: draft
bio: 梓州王氏子。妙龄夙悟。决志寻师。于慧义寺出家。圆具后南游。初见药山．道吾．云岩．洞山．次至岭外大沩会下。数载食不至充。卧不求暖。清苦炼行。操履不群。沩深器之。一日问曰。阇黎在老僧此间。不曾问一转话。师曰。教某甲向甚么处下口。沩曰。何不道如何是佛。师便作手势掩沩口。沩叹曰。子真得其髓。从此名传四海。尔后还蜀。寄锡天彭堋口山龙怀寺。于路旁煎茶普施三年。因往后山。见一古院号大随。群峰矗秀。㵎水清冷。中有一树。围四丈余。南开一门。中空无碍。不假斤斧。自然一庵。时自为木禅庵。师乃居之十余载。影不出山。声闻于外。四方玄学。千里趋风。蜀主钦尚。遣使屡征。师皆辞以老病。署神照大师
sayings:
- text: 上堂。此性本来清净。具足万德。但以染净二缘。而有差别。故诸圣悟之。一向净用。而成觉道。凡夫迷之。一向染用。没溺轮回。其体不二。故般若云。无二无二分。无别无断故
  ref: X80n1565_p0152a02（五灯会元）
- text: 僧问。劫火洞然。大千俱坏。未审这个坏不坏。师曰。坏。曰。恁么则随他去也。师曰。随他去。僧不肯。后到投子。举前话。子遂装香遥礼曰。西川古佛出世。谓其僧曰。汝速回去忏悔。僧回。大随师已殁。僧再至投子。子亦迁化
  ref: X80n1565_p0152a02（五灯会元）
- text: 问。如何是大人相。师曰。肚上不贴榜
  ref: X80n1565_p0152a02（五灯会元）
- text: 问。僧甚处去。曰。西山住庵去。师曰。我向东山头唤汝。汝便来得么。曰。不然。师曰。汝住庵未得
  ref: X80n1565_p0152a02（五灯会元）
- text: 问。生死到来时如何。师曰。遇茶吃茶。遇饭吃饭。曰。谁受供养。师曰。合取钵盂。庵侧有一龟
  ref: X80n1565_p0152a02（五灯会元）
- text: 僧问。一切众生皮裹骨。这个众生为甚骨裹皮。师拈草履覆龟背上。僧无语
  ref: X80n1565_p0152a02（五灯会元）
- text: 问。如何是诸佛法要
  ref: X80n1565_p0152a02（五灯会元）
- text: 师举拂子曰。会么。曰。不会。师曰。麈尾拂子
  ref: X80n1565_p0152a02（五灯会元）
- text: 问。如何是学人自己。师曰。是我自己。曰。为甚么却是和尚自己。师曰。是汝自己
  ref: X80n1565_p0152a02（五灯会元）
- text: 问。如何是大随一面事。师曰。东西南北
  ref: X80n1565_p0152a02（五灯会元）
- text: 问。佛法遍在一切处。教学人向甚么处驻足。师曰。大海从鱼跃。长空任鸟飞
  ref: X80n1565_p0152a02（五灯会元）
- text: 问。父子至亲。岐路各别时如何。师曰。为有父子
  ref: X80n1565_p0152a02（五灯会元）
- text: 问。如何是无缝塔。师曰。高五尺。曰。学人不会。师曰。鹘仑砖
  ref: X80n1565_p0152a02（五灯会元）
- text: 问。和尚百年后法付何人。师曰。露柱火𬬻。曰。还受也无。师曰。火𬬻露柱。行者领众参
  ref: X80n1565_p0152a02（五灯会元）
- text: 师问。参得底人唤东作甚么。曰。不可唤作东。师咄曰。臭驴汉。不唤作东唤作甚么。者无语
  ref: X80n1565_p0152a02（五灯会元）
- text: 问。如何是和尚家风。师曰。赤土画簸箕。曰。未审此理如何。师曰。簸箕有唇。米跳不出
  ref: X80n1565_p0152a02（五灯会元）
- text: 问。僧讲甚么教法。曰。百法论。师拈杖曰。从何而起。曰。从缘而起。师曰。苦哉。苦哉
  ref: X80n1565_p0152a02（五灯会元）
- text: 问。僧甚处去。曰。峨嵋礼普贤去
  ref: X80n1565_p0152a02（五灯会元）
- text: 师举拂子曰。文殊．普贤总在这里。僧作圆相抛向后。乃礼拜。师唤侍者取一贴茶与这僧。众僧参次。师以口作患风势。曰。还有人医得吾口么。众僧竞送药以至。俗士闻之。亦多送药。师并不受。七日后。师自掴口令正。乃曰。如许多时鼓这两片皮。至今无人医得。即端坐而逝
  ref: X80n1565_p0152a02（五灯会元）
