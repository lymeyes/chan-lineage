bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0290b09。
sayings:
- text: 僧问。诸佛出世。震动乾坤。和尚出世。未审如何。师曰。向汝道甚么。曰。恁么则不异诸圣去也。师曰。莫乱道
  ref: X80n1565_p0290b09（五灯会元）
- text: 问。如何是万安家风。师曰。苔羹仓米饭。曰。忽遇上客来。将何祇待。师曰。饭后三巡茶
  ref: X80n1565_p0290b09（五灯会元）
- text: 问。如何是万安境。师曰。一塔松萝望海青
  ref: X80n1565_p0290b09（五灯会元）
