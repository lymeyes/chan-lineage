id: 育王端裕禅师
name: 育王端裕
alias: 育王裕
school: 杨岐派
teacher: 圆悟克勤禅师
status: draft
bio: 绍兴府人姓钱氏。自圆悟得旨遍住大刹。奉诏住径山。赐号佛智大师。又移育王。尝
sayings:
- text: 示众曰。一法若有重重铁壁银山。万法若无处处沈空滞寂。己眼若正见刺亦除。一法不堕缘尘万法本无罣碍。山是山水是水。俗是俗僧是僧。不异不同。直饶恁么。犹是闭门造车。未是出门合辙。更须知有顶上一著作么生明。今古团栾无缝罅。大力那罗擘不开。又曰。行时绝行迹。说时无说踪。行说若到则垛生招箭。行说未明则神锋划断。就使说无渗漏行不迷方。犹滞壳漏在。若是大鹏金翅奋迅百千由旬。十影神驹驰骤四方八极。不取次啖啄。不随处埋身。且总不依倚。还有履践分也无。刹刹尘尘是要津。又
  ref: T51n2077_p0654b20（续传灯录）
- text: 示众举。南泉道。老僧十八上便解作活计。赵州道。我十八上便解破家散宅。会么。作活计底始解破家散宅。破家散宅底始解作活计。假使黄金为城白银为壁。禅悦为食解义为浆。本色衲子不肯回顾。何也岂不见道。明眼汉投窠臼。纵饶万里空寥寥。正好一捶俱摵碎。且道不落进修一句作么生道。良久曰。樗蒲若识本面彩。尽教骰子满盘红。击拂子一下。又
  ref: T51n2077_p0654b20（续传灯录）
- text: 示众曰。未恁么时一句子超释迦越弥勒及乎明破不直半分。何也只为见惯若裁方就圆。如虎头戴角龙背插翼。为瑞为祥若平榻榻地。睡来合眼饭来开口。且道裁方就圆即是。平榻榻地即是。还辨得出么。直饶辨得也是碗脱丘。又曰。尽大地是沙门眼。尽大地是自己光。为什么东弗于逮打鼓西瞿耶尼不闻。南赡部洲点灯北郁单越黑暗。直饶向个里道得十全。犹是光影活计。以拂子一摵曰。百杂碎作么生是出身一路。若果不见随路摘杨花。又曰。一锤便成不是性懆汉。一跃千里不是汗血驹。锋铓不露。无孔铁锤。八面玲珑。多虚少实。直须肘后悬夜明符。顶门具金刚眼。彻头彻尾生杀交驰。任他魔佛现前。便好利刀截却。且道据个什么便如此要知么。玉󰚁轻提海岳昏
  ref: T51n2077_p0654b20（续传灯录）
