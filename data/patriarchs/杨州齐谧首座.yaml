id: 杨州齐谧首座
name: 杨州齐谧首座
school: 黄龙派
teacher: 死心悟新禅师
status: draft
bio: 本郡人也。死心称为饱参。诸儒屡以名山致之。不可。后示化于潭之谷山。异迹颇众。门人尝绘其像。请赞。为书曰。个汉灰头土面。寻常不欲露现。而今写出人前。大似虗空著箭。怨怨。可惜人间三尺绢。空室道人智通空室道人智通者龙图范珣女也。幼聪慧。长归丞相苏颂之孙悌。未几厌世相。还家求祝发。父难之。遂清修。因看法界观。顿有省。连作二偈见意。一曰。浩浩尘中体一如。纵横交互印毗卢。全波是水波非水。全水成波水自殊。次曰。物我元无异。森罗镜像同。明明超主伴。了了彻真空。一体含多法。交参帝网中。重重无尽处。动静悉圆通。后父母俱亡。兄涓领分宁尉。通偕行。闻死心名重。往谒之。心见知其所得。便
sayings:
- text: 问。常啼菩萨卖却心肝。教谁学般若。通曰。你若无心我也休。又
  ref: X80n1565_p0694b08（五灯会元）
- text: 问。一雨所滋。根苗有异。无阴阳地上生个甚么。通曰。一华五叶。复
  ref: X80n1565_p0694b08（五灯会元）
- text: 问。十二时中向甚么处安身立命。通曰。和尚惜取眉毛好。心打曰。这妇女乱作次第。通礼拜。心然之。于是道声籍甚。政和间居金陵。尝设浴于保宁。揭榜于门曰。一物也无。洗个甚么。纤尘若有。起自何来。道取一句子玄。乃可大家入浴。古灵祇解揩背。开士何曾明心。欲证离垢地时。须是通身汗出。尽道水能洗垢。焉知水亦是尘。直饶水垢顿除。到此亦须洗却。后为尼。名惟久。挂锡姑苏之西竺。缁白日夕
  ref: X80n1565_p0694b08（五灯会元）
- text: 师问。得其道者颇众。俄示疾书偈。趺坐而终。有明心录行于世
  ref: X80n1565_p0694b08（五灯会元）
