id: 延州伏龙山奉璘禅师
name: 延州伏龙山奉璘
school: —
teacher: 疏山仁
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0505a05。
sayings:
- text: 僧问。如何是和尚家风。师曰。横身卧海。日里挑灯
  ref: X80n1565_p0505a05（五灯会元）
- text: 问。如何是伏龙境。师曰。山峻水流急。三冬发异华
  ref: X80n1565_p0505a05（五灯会元）
- text: 问。和尚还爱财色也无。师曰。爱。曰。既是善知识。为甚么却爱财色。师曰。知恩者少。师问火头。培火了也未。曰。低声。师曰。甚么处得这消息来。曰。不假多言。师曰。省钱易饱。吃了还饥
  ref: X80n1565_p0505a05（五灯会元）
- text: 问。如何是和尚家风。师曰。长虀冷饭。曰。大寂寞生。师曰。僧家合如是
  ref: X80n1565_p0505a05（五灯会元）
