id: 处州连云道能禅师
name: 处州连云道能
school: 杨岐派
teacher: 径山杲
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0800a08。
sayings:
- text: 僧问。镜清六刮。意旨如何。师曰。穿却你鼻孔。曰。学人有鼻孔即穿。无鼻孔又穿个甚么。师曰。抱赃叫屈。曰。如何是就毛刮尘。师曰。筠袁䖍吉。头上插笔。曰。如何是就皮刮毛。师曰。石城虔化。说话厮骂。曰。如何是就肉刮皮。师曰。嘉眉果阆。怀里有状。曰。如何是就骨刮肉。师曰。漳泉福建。头匾如扇。曰。如何是就髓刮骨。师曰。洋澜左蠡。无风浪起。曰。髓又如何刮。师曰。十八十九。痴人夜走。曰。六刮已蒙师指示。一言直截意如何。师曰。结舌有分
  ref: X80n1565_p0800a08（五灯会元）
