bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0310b12。
sayings:
- text: 僧问。匿王请佛。既奉法于当时。我后延师。葢兴宗于此日。幸施方便。无吝举扬。师曰。不烦再
  ref: X80n1565_p0310b12（五灯会元）
- text: 问。问。如何是大圆镜。师曰。著
  ref: X80n1565_p0310b12（五灯会元）
- text: 问。如何是向上事。师曰。分明听取
  ref: X80n1565_p0310b12（五灯会元）
