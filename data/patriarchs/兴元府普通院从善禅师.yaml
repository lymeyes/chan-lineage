bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0313a05。
sayings:
- text: 僧问。法轮再转时如何。师曰。助上座喜。曰。合谭何事。师曰。异人掩耳。曰。便恁么领会时如何。师曰。错
  ref: X80n1565_p0313a05（五灯会元）
- text: 问。佩剑叩松关时如何。师曰。莫乱作。曰。谁不知有。师曰。出
  ref: X80n1565_p0313a05（五灯会元）
