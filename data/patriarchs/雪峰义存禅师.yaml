id: 雪峰义存禅师
name: 雪峰义存
honorific: 雪峰义存禅师 · 真觉大师（谥）
school: 青原系
dynasty: 唐末
region: 福州雪峰山（广福院）
teacher: 德山宣鉴（亦参洞山、石头等）
source_ref: 五灯会元·卷七·福州雪峰义存 / 景德传灯录·卷十六
cbeta: T51n2076 卷十六
bio: 泉州曾氏子，参德山宣鉴，洞明大事，后住福州雪峰山，徒众至千五百人，唐僖宗赐号「真觉大师」。门人云门文偃、玄沙师备，法眼文益亦出其再传，为云门、法眼二宗之源，于禅门承先启后。
sayings:
- text: 示众：「尽大地是个解脱门，把手牵他行不得。唯有释迦老子（自肯）一人，半人天眼目。」
  ref: 五灯会元·卷七·雪峰义存
