sayings:
- text: 僧问。真性缘起。其义云何。威良久。师遽召曰。大德。正兴一念问时。是真性中缘起。其僧言下大悟。或
  ref: X80n1565_p0045b05（五灯会元）
- text: 问。南宗自何而立。曰。心宗非南北
  ref: X80n1565_p0045b05（五灯会元）
