name: 河中府中条山智封
school: —
teacher: 北宗神秀禅师
status: draft
bio: 姓吴氏。初习唯识论。滞于名相。为知识所诘。乃发愤罢讲。游方见秀禅师。疑心顿释。乃辞去。居于蒲津安峰。不下山十年。木食㵎饮。州牧卫文升建安国院居之。缁素归依。憧憧不绝。使君问曰。某今日后如何。师曰。日从蒙汜出。照树全无影。使君初不能谕。拱揖而退。少选开晓。释然自得。师来往中条山二十余年。得其道者不可胜纪。灭后。门人于州城北建塔焉
