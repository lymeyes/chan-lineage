id: 灌谿闲禅师
name: 灌谿闲
school: 临济宗
teacher: 临济义玄禅师
bio: 临济义玄禅师法嗣，住灌谿（今属江西）。机锋迅捷，上堂多示「无门」之旨。
sayings:
- text: 上堂：「十方无壁落，四面亦无门；净裸裸，赤洒洒，没可把。」
  ref: 五灯会元·卷十一·灌谿闲禅师
- text: 临济问：「甚处来？」师曰：「邢州来。」济曰：「我圃里作么生？」师曰：「蒺藜生满地。」
  ref: 五灯会元·卷十一·灌谿闲禅师
status: draft
verify: 据《五灯会元》整理，待 CBETA 逐字校核原文与卷次；师承以谱系父节点为准。
