id: L::福州雪峰慧深首座
name: 福州雪峰慧深首座
school: 法眼宗
teacher: 大洪预
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《续传灯录》T51n2077_p0632c28。
sayings:
- text: 示众。未得入头应切切。入头已得须教彻。虽然得入本无无。莫守无无无间歇。大洪闻之乃曰。深兄说禅若此。惜福缘不胜耳。一日普说罢。挥偈辞众以笔一拍而化
  ref: T51n2077_p0632c28（续传灯录）
