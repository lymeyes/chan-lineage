status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《续传灯录》T51n2077_p0572b04。
sayings:
- text: 僧问。如何是宗乘中事。师曰。动唇吻得么。问如何是正法眼。师曰。拣择得么。问如何是法身。师曰。道汝不会得么。问莲华未出水时如何。师曰。看不见
  ref: T51n2077_p0572b04（续传灯录）
- text: 僧云。出水后如何。师曰。清香满路
  ref: T51n2077_p0572b04（续传灯录）
- text: 上堂曰。一念信心一念佛。念念更非是别物。六门出入岂神通。一道光明无轨则。行亦行坐亦坐。或语或笑非两个。目下若也认得渠。青山万里无寸草。佛印宣明禅师南岳高台寺宣明佛印禅师
  ref: T51n2077_p0572b04（续传灯录）
- text: 僧问。正法眼藏涅槃妙心便请拈出。师直上觑。僧曰。恁么则人天有赖。师曰。金屑虽贵。灵岩重确禅师齐州灵岩山重确正觉禅
  ref: T51n2077_p0572b04（续传灯录）
- text: 师上堂。祖师心印状似铁牛之机。针挑不出匙挑不上。过在阿谁。绿虽千种草香只一株兰
  ref: T51n2077_p0572b04（续传灯录）
- text: 上堂。不方不圆不上不下。驴鸣狗吠十方无价。拍禅床下座
  ref: T51n2077_p0572b04（续传灯录）
