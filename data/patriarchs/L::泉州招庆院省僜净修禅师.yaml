id: L::泉州招庆院省僜净修禅师
name: 泉州招庆院省僜净修
school: —
teacher: 保福展
status: draft
bio: 初参保福。福一日入大殿睹佛像。乃举手。问师曰。佛恁么意作么生。师曰。和尚也是横身。福曰。一撅我自收取。师曰。和尚非唯横身。福然之。后住招庆。开堂升座。良久乃曰。大众。向后到处遇道伴。作么生举似他。若有人举得。试对众举看。若举得。免孤负上祖。亦免埋没后来。古人道。通心君子。文外相见。还有这个人么。况是曹谿门下子孙。合作么生理论。合作么生提唱
sayings:
- text: 僧问。如何得不伤于己。不负于人。师曰。莫屈著汝这问么。曰。恁么上来已蒙师指也。师曰。汝又屈著我作么
  ref: X80n1565_p0292b01（五灯会元）
- text: 问。当锋一句。请师道。师曰。嗄。僧再
  ref: X80n1565_p0292b01（五灯会元）
- text: 问。师曰。瞌睡汉
  ref: X80n1565_p0292b01（五灯会元）
- text: 问。僧近离甚处。曰。报恩。师曰。僧堂大小。曰。和尚试道看。师曰。何不待
  ref: X80n1565_p0292b01（五灯会元）
- text: 问。问。学人全身不会。请师指示。师曰。还解笑得么。乃曰。丛林先达者。不敢相触忤。若是初心后学。未信直须信取。未省直须省取。不用掠虗。诸人本分去处。未有一时不显露。未有一物解葢覆得。如今若要知。不用移丝发地。不用少许工夫。但向博地凡夫位中承当取。岂不省心力。既能省得。便与诸佛齐肩。依而行之。缘此事是个白净去处。今日须得白净身心合他始得。自然合古合今。脱生离死。古人云。识心达本。解无为法。方号沙门。如今诸官大众。各须体取好。莫全推过师僧分上。佛法平等。上至诸佛。下至一切。共同此事。既然如此。谁有谁无。王事之外。亦须努力。适来说如许多般。葢不得已而已。莫道从上宗门。合恁么语话。祇如从上宗门。合作么生。还相悉么。若有人相悉。山僧今日雪得去也。久立。大众珍重。示坐禅方便颂曰。四威仪内坐为先。澄滤身心渐坦然。瞥尔有缘随浊界。当须莫续是天年。修持祇学从功路。至理宁论在那边。一切时中常管带。因缘相凑豁通玄。示执坐禅者曰。大道分明绝点尘。何须长坐始相亲。遇缘傥解无非是。处愦那能有故新。散诞肯齐支遁侣。逍遥曷与慧休邻。或游泉石或阛阓。可谓烟霞物外人
  ref: X80n1565_p0292b01（五灯会元）
