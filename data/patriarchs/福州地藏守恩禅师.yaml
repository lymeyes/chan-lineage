id: 福州地藏守恩禅师
name: 福州地藏守恩
school: 云门宗
teacher: 慧林本禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0629b11。
sayings:
- text: 僧问。如何是佛。师曰。昼眠无益。曰。意旨如何。师曰。早起甚长
  ref: X80n1565_p0629b11（五灯会元）
- text: 问。如何是西来祖意。师曰。风吹满面尘
  ref: X80n1565_p0629b11（五灯会元）
- text: 上堂。竖起拳曰。或时为拳。复开曰。或时为掌。若遇衲僧有功者赏。遂放下曰。直是土旷人稀。相逢者少
  ref: X80n1565_p0629b11（五灯会元）
- text: 上堂。雨后鸠鸣。山前麦熟。何处牧童儿。骑牛笑相逐。更把短笛横吹。风前一曲两曲。参
  ref: X80n1565_p0629b11（五灯会元）
- text: 上堂。山僧今日略通一线。不用狐疑。麦中有面
  ref: X80n1565_p0629b11（五灯会元）
- text: 上堂。拈拄杖击禅床一下。曰。有智若闻。则能信解。无智疑悔。则为永失。三十年后。不得道山僧今日
  ref: X80n1565_p0629b11（五灯会元）
- text: 上堂。祇念法华经。参
  ref: X80n1565_p0629b11（五灯会元）
- text: 上堂。衲僧现前三昧。释迦老子不会。住世四十九年。说得天花乱坠。争似饥餐渴饮。展脚堂中打睡
  ref: X80n1565_p0629b11（五灯会元）
- text: 上堂。诸人知处。山僧尽知。山僧知处。诸人不知。今日不免布施诸人。良久曰。头上是天。脚下是地。参
  ref: X80n1565_p0629b11（五灯会元）
