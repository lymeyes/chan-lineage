sayings:
- text: 僧问。如何是和尚家风。师曰。开门作活计。曰。忽遇贼来。又作么生。师曰。然。新到参。师揭帘以手作除帽势。僧拟欲近前。师曰。赚杀人。因事有偈曰。虎头生角人难措。石火电光须密布。假饶烈士也应难。懵底那能解回互
  ref: X80n1565_p0276a06（五灯会元）
