sayings:
- text: 僧问。如何是佛。师当面一唾。乃曰。当面一唾切忌蹉过。幽谷猿啼乔林鹊噪。闹市纭纭相头买帽。白日同归不知几个。又曰。日面佛月面佛。马师一别经年。谁辨铜头铁额。百丈耳聋未为埋没。临济吃棒莫言受屈。三圣瞎驴能始能卒。兴化帐中抛撒将来。不是骊龙颔下之物。上根不动干戈。自然清风拂拂。中下恰恰用心。落在无生窠窟。又曰。野华飘尽古城根。渐渐蝉鸣湘水渡。霏霏梅雨洒高空。匝地薰风满庭户。三十三兮老古锥。象转龙蟠曾显露。才显露成点污。谨白参玄人。光阴莫虚度
