id: 兴国军智通大死翁景深禅师
name: 兴国军智通大死翁景深
school: 曹洞宗
teacher: 宝峰惟照禅师
status: draft
bio: 台州王氏子。自幼不群。年十八。依广度院德芝披剃。始谒净慈象禅师。一日闻象曰。思而知。虑而解。皆鬼家活计。兴不自遏。遂往宝峰求入室。峰曰。直须断起灭念。向空劫已前扫除玄路。不涉正偏。尽却今时。全身放下。放尽还放。方有自由分。师闻顿领厥旨。峰击鼓告众曰。深得阐提大死之道。后学宜依之。因号大死翁。建炎改元。开法智通
sayings:
- text: 上堂。来不入门。去不出户。来去无痕。如何提唱。直得古路苔封。𦏪羊绝迹。苍梧月鏁。丹凤不栖。所以道。藏身处没踪迹。没踪迹处莫藏身。若能如是。去住无依。了无向背。还委悉么。而今分散如云鹤。你我相忘触处玄
  ref: X80n1565_p0544a03（五灯会元）
- text: 僧问。如何是正中偏。师曰。黑面老婆披白练。曰。如何是偏中正。师曰。白头翁子著皂衫。曰。如何是正中来。师曰。屎里翻筋斗。曰。如何是兼中至。师曰。雪刃笼身不自伤。曰。如何是兼中到。师曰。昆仑夜里行。曰。向上还有事也无。师曰。捉得乌龟唤作鳖。曰。乞师再垂方便。师曰。入山逢虎卧。出谷鬼来牵。曰。何得干戈相待。师曰。三两线。一斤麻。绍兴初。归住宝藏岩。以事民其服。壬申二月示微恙。乃曰。世缘尽矣。三月十三。为众小参。仍说偈曰。不用剃头。何须澡浴。一堆红焰。千足万足。虽然如是。且道向上还有事也无。遂敛目而逝
  ref: X80n1565_p0544a03（五灯会元）
