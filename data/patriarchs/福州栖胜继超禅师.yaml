sayings:
- text: 上堂。拈拄杖。良久曰。三世诸佛。尽在这里𨁝跳。大众还会么。过去诸佛说了。未来诸佛未说。现在诸佛今说。敢问诸人。作么生是说底事。卓一下曰。苏𠰷苏𠰷
  ref: X80n1565_p0458b02（五灯会元）
