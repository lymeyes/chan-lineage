id: L::洪州泐潭匡悟禅师
name: 洪州泐潭匡悟
school: 青原系
teacher: 九峰虔
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0211b05。
sayings:
- text: 僧问。如何是直截一路。师曰。恰好消息。曰。还通向上事也无。师曰。鱼从下过
  ref: X80n1565_p0211b05（五灯会元）
- text: 问。幽关未度。信息不通时如何。师曰。客路如天远。侯门似海深
  ref: X80n1565_p0211b05（五灯会元）
- text: 问。香烟馥郁。大张法筵。从上宗乘。如何举唱。师曰。莫错举似人。曰。恁么则总应如是。师曰。还是没交涉
  ref: X80n1565_p0211b05（五灯会元）
- text: 问。六叶芬芳。师传何叶。师曰。六叶不相续。花开果不成。曰。岂无今日事。师曰。若是今日即有。曰。今日事如何。师曰。叶叶连枝秀。花开处处芳
  ref: X80n1565_p0211b05（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0211b05），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
