id: 盐官安国师
name: 盐官齐安
school: 南岳系
teacher: 马祖一
bio: 马祖道一禅师法嗣，住盐官（今浙江海宁）。以「国家有宝」及与百丈、南泉、麻谷同参之公案见称。
sayings:
- text: 师（盐官）唤侍者：「将犀牛扇子来。」侍者曰：「破也。」师曰：「扇子既破，还我犀牛儿来。」侍者无对。
  ref: 五灯会元·卷三·盐官齐安国师
