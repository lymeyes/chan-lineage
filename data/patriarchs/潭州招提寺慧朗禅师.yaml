id: 潭州招提寺慧朗禅师
name: 潭州招提寺慧朗
school: 青原系
teacher: 石头希迁禅师
status: draft
bio: 始兴曲江人也。初参马祖。祖
sayings:
- text: 问。汝来何求。曰。求佛知见。祖曰。佛无知见。知见乃魔耳。汝自何来。曰。南岳来。祖曰。汝从南岳来。未识曹谿心要。汝速归彼。不宜他往。师归石头。便
  ref: X80n1565_p0170b08（五灯会元）
- text: 问。如何是佛。头曰。汝无佛性。师曰。蠢动含灵。又作么生。头曰。蠢动含灵。却有佛性。曰。慧朗为甚么却无。头曰。为汝不肯承当。师于言下信入。住后。凡学者至。皆曰。去。去。汝无佛性。其接机大约如此时谓大朗
  ref: X80n1565_p0170b08（五灯会元）
