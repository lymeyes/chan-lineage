bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0713b10。
sayings:
- text: 上堂。举。僧问古德。生死到来。如何免得。德曰。柴鸣竹爆惊人耳。僧曰。不会。德曰。家犬声狞夜不休。师曰。诸人要会么。柴鸣竹爆惊人耳。大洋海底红尘起。家犬声狞夜不休。陆地行船三万里。坚牢地神笑呵呵。须弥山王眼󳬇鼻。把手东行却向西。南山声应北山里。千手大悲开眼看。无量慈悲是谁底。良久曰。头长脚短。少喜多瞋
  ref: X80n1565_p0713b10（五灯会元）
- text: 上堂。问侍者曰。还记得昨日因缘么。曰。记不得。复顾大众曰。还记得么。众无对。竖起拂子曰。还记得么。良久曰。也忘却了也。三处不成。一亦非有。诸人不会方言。露柱且莫开口。以拂子击禅床。下座
  ref: X80n1565_p0713b10（五灯会元）
