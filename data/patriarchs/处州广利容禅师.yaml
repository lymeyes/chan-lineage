id: 处州广利容禅师
name: 处州广利容
school: 曹洞宗
teacher: 曹山本寂禅师
status: draft
bio: 初住贞溪。僧参。师举拂子曰。贞溪老僧还具眼么。曰。某甲不敢见和尚过。师曰。老僧死在阇黎手里也
sayings:
- text: 问。如何是和尚家风。师曰。谢阇黎道破
  ref: X80n1565_p0497a18（五灯会元）
- text: 问。西院拍手笑呵呵。意作么生。师曰。卷上帘子著
  ref: X80n1565_p0497a18（五灯会元）
- text: 问。自己不明。如何得明。师曰。不明。曰。为甚么不明。师曰。不见道自己事
  ref: X80n1565_p0497a18（五灯会元）
- text: 问。鲁祖面壁。意作么生。师良久曰。还会么。曰。不会。师曰。鲁祖面壁。因郡守受代归。师出送接话次。守
  ref: X80n1565_p0497a18（五灯会元）
- text: 问。和尚远出山门。将甚么物来。师曰。无尽之宝呈献。守无对。后有人进语曰。便请。师曰。大守尊严
  ref: X80n1565_p0497a18（五灯会元）
- text: 问。千途路绝。语思不通时如何。师曰。犹是堦下汉。曰。如何是堦上汉。师曰。龙楼不举手。乃曰。作么生是尊贵底人。试道看。莫祇向长连床上坐地。见他人不肯。忽被明眼人拶著。便向铁围山里藏身。若到广利门下。须道得第一句。即开一线道与兄弟商量。时有僧出礼拜。师曰。将谓是异国舶主。元来是此土商人
  ref: X80n1565_p0497a18（五灯会元）
