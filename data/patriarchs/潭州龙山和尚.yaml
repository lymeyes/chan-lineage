id: 潭州龙山和尚
name: 潭州龙山
school: 南岳系
teacher: 马祖道一禅师
status: draft
bio: 亦云隐山问僧。甚么处来。曰。老宿处来。师曰。老宿有何言句。曰。说则千句万句。不说则一字也无。师曰。恁么则蝇子放卵。僧礼拜。师便打。洞山与密师伯经由。见溪流菜叶。洞曰。深山无人。因何有菜随流。莫有道人居否。乃共议拨草溪行。五七里间。忽见师羸形异貌。放下行李问讯。师曰。此山无路。阇黎从何处来。洞曰。无路且置。和尚从何而入。师曰。我不从云水来。洞曰。和尚往此山多少时邪。师曰。春秋不涉。洞曰。和尚先住。此山先住。师曰。不知。洞曰。为甚么不知。师曰。我不从人天来。洞曰。和尚得何道理。便住此山。师曰。我见两个泥牛鬬入海。直至于今绝消息。洞山始具威仪礼拜。便
sayings:
- text: 问。如何是主中宾。师曰。青山覆白云。曰。如何是宾中主。师曰。长年不出户。曰。宾主相去几何。师曰。长江水上波。曰。宾主相见。有何言说。师曰。清风拂白月。洞山辞退。师乃述偈曰。三间茅屋从来住。一道神光万境闲。莫把是非来辨我。浮生穿凿不相关。因兹烧庵。入深山不见。后人号为隐山和尚
