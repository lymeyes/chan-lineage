bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0575a11。
sayings:
- text: 僧问。如何是一大藏教。师曰。高座不曾登。曰。登后如何。师曰。三段不同。今当第一。向下文长。付在来日。东家篱。西家壁。自己分上又作么生。僧无对。师便打
  ref: X80n1565_p0575a11（五灯会元）
- text: 问。如何是从天降下。师曰。风雨顺时。曰。如何是从地涌出。师曰。稻麻竹苇
  ref: X80n1565_p0575a11（五灯会元）
