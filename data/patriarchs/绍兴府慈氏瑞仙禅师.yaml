id: 绍兴府慈氏瑞仙禅师
name: 绍兴府慈氏瑞仙
school: 黄龙派
teacher: 开先行瑛禅师
status: draft
bio: 本郡人。年二十去家。以试经披削。习毗尼。因睹戒性如虗空。持者为迷倒。师谓。戒者。束身之法也。何自缚乎。遂探台教。又阅诸法不自生。亦不从他生。不共不无因。是故说无生。疑曰。又不自他。不共不无因。生毕竟从何而生。即省曰。因缘所生。空假三观。抑扬性海。心佛众生。名异体同。十境十乘。转识成智。不思议境。智照方明。非言诠所及。弃谒诸方。后至投子。广鉴
sayings:
- text: 问。乡里甚处。师曰。两浙东越。鉴曰。东越事作么生。师曰。秦望峰高。鉴湖水阔。鉴曰。秦望峰与你自己是同是别。师曰。西天梵语。此土唐言。鉴曰。此犹是丛林祇对。毕竟是同是别。师便喝。鉴便打。师曰。恩大难酬。便礼拜。后归里。开法慈氏。室中尝问僧。三个橐驼两只脚。日行万里趁不著。而今收在玉泉山。不许时人乱斟酌。诸人向甚么处与仙上座相见
