id: 幽州盘山禅师
name: 幽州盘山
school: 青原系
teacher: 投子同
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0207b16。
sayings:
- text: 僧问。如何出得三界。师曰。在里头来多少时邪。曰。如何出得。师曰。青山不碍白云飞
  ref: X80n1565_p0207b16（五灯会元）
- text: 问。承教有言。如化人烦恼。如石女儿。此理如何。师曰。阇黎直如石女儿去
  ref: X80n1565_p0207b16（五灯会元）
