id: 瑞州瑞相子来禅师
name: 瑞州瑞相子来
school: 云门宗
teacher: 法云法秀禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0633a01。
sayings:
- text: 上堂。顾视众曰。夫为宗匠。随处提纲。应机问答。杀活临时。心眼精明。那容妖怪。若也棒头取证。喝下承当。埋没宗风。耻他先作。转身一路。不在迟疑。一息不来。还同死汉。大众。直饶到这田地。犹是句语埋藏。未有逶脱一路。敢问诸人。作么生是透脱一路。还有人道得么。若无。山僧不免与诸人说破。良久曰。玉离荆岫寒光动。剑出丰城紫气横
  ref: X80n1565_p0633a01（五灯会元）
