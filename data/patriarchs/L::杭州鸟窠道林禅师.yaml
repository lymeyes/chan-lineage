id: L::杭州鸟窠道林禅师
name: 杭州鸟窠道林
school: —
teacher: 径山国一钦
status: draft
bio: 本郡富阳人也。姓潘氏。母朱氏。梦日光入口。因而有娠。及诞。异香满室。遂名香光。九岁出家。二十一于荆州果愿寺受戒。后诣长安西明寺复礼法师学华严经．起信论礼示以真妄颂。俾修禅那。师问曰。初云何观。云何用心。礼久而无言。师三礼而退。属代宗诏国一禅师至阙。师乃谒之。遂得正法。及南归孤山永福寺。有辟支佛塔。时道俗共为法会。师振锡而入。有灵隐寺韬光法师问曰。此之法会。何以作声。师曰。无声谁知是会。后见秦望山有长松。枝叶繁茂。盘屈如葢。遂栖止其上。故时人谓之鸟窠禅师。复有鹊巢于其侧。自然驯狎。人亦目为鹊巢和尚。有侍者会通。忽一日欲辞去。师问曰。汝今何往。对曰。会通为法出家。和尚不垂慈诲。今往诸方学佛法去。师曰。若是佛法。吾此间亦有少许。曰。如何是和尚佛法。师于身上拈起布毛吹之。通遂领悟玄旨。元和中。白居易侍郎出守兹郡。因入山谒师。问曰。禅师住处甚危险。师曰。太守危险尤甚。白曰。弟子位镇江山。何险之有。师曰。薪火相交。识性不停。得非险乎。又
sayings:
- text: 问。如何是佛法大意。师曰。诸恶莫作。众善奉行。白曰。三岁孩儿也解恁么道。师曰。三岁孩儿虽道得。八十老人行不得。白作礼而退。师于长庆四年二月十日告侍者曰。吾今报尽。言讫坐亡有云师名圆修者。恐是谥号
