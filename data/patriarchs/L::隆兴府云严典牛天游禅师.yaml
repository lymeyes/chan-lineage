id: L::隆兴府云严典牛天游禅师
name: 隆兴府云严典牛天游
school: 黄龙派
teacher: 泐潭准
status: draft
bio: 成都郑氏子。初试郡庠。复往梓州试。二处皆与贡籍。师不敢承。窜名出关。适会山谷道人西还。因见其风骨不凡。议论超卓。乃同舟而下。竟往庐山。投师剃发。不改旧名。首参死心不契。遂依湛堂于泐潭。一日。潭普说曰。诸人苦苦就准上座觅佛法。遂拊膝曰。会么。雪上加霜。又拊膝曰。若也不会。岂不见干峰
sayings:
- text: 示众曰。举一不得举二。放过一著。落在第二。师闻脱然颖悟。出世云盖。次迁云岩。尝和忠道者牧牛颂曰。两角指天。四足踏地。拽断鼻绳。牧甚屎屁。张无尽见之。甚击节。后退云岩。过庐山栖贤。主翁意不欲纳。乃曰。老老大大。正是质库中典牛也。师闻之。述一偈而去。曰。质库何曾解典牛。祇缘价重实难酬。想君本领无多子。毕竟难禁这一头。因庵于武宁。扁曰典牛。终身不出。涂毒见之。已九十三矣
  ref: X80n1565_p0707b14（五灯会元）
- text: 上堂。卓拄杖曰。久雨不晴。札。金乌飞在钟楼角。又卓一下曰。犹在㲉。复卓曰。一任衲僧名邈
  ref: X80n1565_p0707b14（五灯会元）
- text: 上堂。马祖一喝。百丈蹉过。临济小厮儿。向粪扫堆头拾得一只破草鞋。胡喝乱喝。师震声喝曰。唤作胡喝乱喝。得么
  ref: X80n1565_p0707b14（五灯会元）
- text: 上堂。象骨辊球能已尽。玄沙斫牌伎亦穷。还知么。火星入袴口。事出急家门
  ref: X80n1565_p0707b14（五灯会元）
- text: 上堂。三百五百。铜头铁额。木笛横吹。谁来接拍。时有僧出。师曰。也是贼过后张弓
  ref: X80n1565_p0707b14（五灯会元）
- text: 上堂。宝峰有一诀。对众分明说。昨夜三更前。乌龟吞却鳖。至节
  ref: X80n1565_p0707b14（五灯会元）
- text: 上堂。晷运推移。日南长至。布裩不洗。无来换替。大小玉泉。无风浪起。云岩路见不平。直下一锤粉碎。遂高声曰。看脚下
  ref: X80n1565_p0707b14（五灯会元）
- text: 上堂。举梁山曰。南来者与你三十棒。北来者与你三十棒。然虽与么。未当宗乘。后来琅瑘和尚道。梁山好一片真金。将作顽铁卖却。琅瑘则不然。南来者与你三十棒。北来者与你三十棒。从教天下贬剥。师拈曰。一人能舒不能卷。一人能卷不能舒。云岩门下。一任南来北来。且恁么过。蓦然洗面摸著鼻头。却来与你三十
  ref: X80n1565_p0707b14（五灯会元）
- text: 上堂。日可冷。月可热。众魔不能坏真说。作么生是真说。初三十一。中九下七。若信不及。云岩与汝道破。万人齐指处。一雁落寒空。病起
  ref: X80n1565_p0707b14（五灯会元）
- text: 上堂。举马大师日面佛．月面佛。后来东山演和尚颂曰。丫鬟女子画蛾眉。鸾镜台前语似痴。自说玉颜难比并。却来架上著罗衣。师曰。东山老翁满口赞叹则故是。点检将来。未免有乡情在。云岩又且不然。打杀黄莺儿。莫教枝上啼。几回惊妾梦。不得到辽西
  ref: X80n1565_p0707b14（五灯会元）
