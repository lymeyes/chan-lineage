id: 福州极乐元俨禅师
name: 福州极乐元俨
school: —
teacher: 雪峰存
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0268a12。
sayings:
- text: 僧问。如何是极乐家风。师曰。满目看不尽
  ref: X80n1565_p0268a12（五灯会元）
- text: 问。万法本无根。未审教学人承当甚么。师曰。莫寐语
  ref: X80n1565_p0268a12（五灯会元）
- text: 问。久处暗室。未达其源。今日上来。乞师一接。师曰。莫闭眼作夜好。曰。恁么即优昙华拆。曲为今时。向上宗风。如何垂示。师曰。汝还识也无。曰。恁么即息疑去也。师曰。莫向大众前寐语
  ref: X80n1565_p0268a12（五灯会元）
- text: 问。摩腾入汉即不
  ref: X80n1565_p0268a12（五灯会元）
- text: 问。达磨来梁时如何。师曰。如今岂谬。曰。恁么即理出三乘。华开五叶。师曰。说甚么三乘五叶。出去
  ref: X80n1565_p0268a12（五灯会元）
