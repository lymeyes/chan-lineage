id: 石霜琳禅师
name: 石霜琳
school: —
teacher: —
status: draft
bio: 初行脚时与夹山龄同行。久依佛日才禅师罢参矣。因与龄同游黄蘗。见慧南禅师小参。不喻其旨。师遂求入室。龄大怒痛驱一顿而去。师独留未几大悟黄龙宗旨。机锋颕脱名振丛林。在南公坐下与文关西英邵武等齐名。遂开法于石霜
sayings:
- text: 上堂示众曰。霜华一境极目萧然。枯木堂前风行草偃。渌水滔滔无尽。白云合而还开。往来禅客饱足。观光林下相逢。呵呵大笑。且道笑个什么。良久曰。烟村三四月别是一家春。下坐。又曰。或谈玄或说妙。德山临济拍手笑。更言无说是菩提。多年梁上生芝草咦
  ref: T51n2077_p0571a16（续传灯录）
- text: 僧问。拈槌举拂拈放一边请师答话。师曰。高著眼
  ref: T51n2077_p0571a16（续传灯录）
- text: 僧云。作家宗师。师曰。脚下蹉过。僧以坐具画一画。师曰。自领出去。又
  ref: T51n2077_p0571a16（续传灯录）
- text: 问。法王出世请施号令。师曰一二三四五
  ref: T51n2077_p0571a16（续传灯录）
- text: 僧云。法令施行。师曰。潇湘船子。问慈云蔼蔼慧日辉辉。大众欣然乞师一接。师曰好
  ref: T51n2077_p0571a16（续传灯录）
- text: 僧云。不言含有象。何处谢无私。师曰。石女溪边笑点头。问石霜枯木重生时如何。师曰。海底金龟走。天边玉兔明
  ref: T51n2077_p0571a16（续传灯录）
- text: 僧云。恁么则觉花开有地。果熟自然香。师曰。须弥顶上面南行。师说法颇类真净。然于真净不相识而心敬之。在石霜时真净在洞山。师以颂送僧。见之有曰。憧憧四海求禅者。不到新丰也是痴。师于元丰七年三月初八日净发沐浴。至夜小参曰。平生行脚方始见人。平生参禅始终得力。成佛作祖不离方寸。镬汤炉炭只在如今。这个消息如人饮水冷暖自知。听吾一颂。大幻一段。光明灿烂。芒恼众生。早晚分散。夜半端然示寂。阇维得舍利葬于本山
  ref: T51n2077_p0571a16（续传灯录）
