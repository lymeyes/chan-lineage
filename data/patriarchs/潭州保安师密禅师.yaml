id: 潭州保安师密禅师
name: 潭州保安师密
school: 云门宗
teacher: 云门文偃禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0573b18。
sayings:
- text: 僧问。辊芥投针时如何。师曰。落在甚么处梁山云。落在汝眼里
  ref: X80n1565_p0573b18（五灯会元）
- text: 问。不犯词锋时如何。师曰。天台南岳。曰。便恁么去时如何。师曰。江西湖南
  ref: X80n1565_p0573b18（五灯会元）
