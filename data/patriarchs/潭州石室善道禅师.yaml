id: 潭州石室善道禅师
name: 潭州石室善道
school: 青原系
teacher: 长髭旷禅师
status: draft
bio: 作沙弥时。长髭遣令受戒。谓之曰。汝回日须到石头和尚处礼拜。师受戒后。仍参石头。一日随头游山次。头曰。汝与我斫却面前树子。免碍我。师曰。不将刀来。头乃抽刀倒与。师曰。何不过那头来。头曰。你用那头作甚么。师即大悟。便归长髭。髭
sayings:
- text: 问。汝到石头否。师曰。到即到。只是不通号。髭曰。从谁受戒。师曰。不依他。髭曰。在彼即恁么。来我这里作么生。师曰。不违背。髭曰。太忉忉生。师曰。舌头未曾点著在。髭喝曰。沙弥出去。师便出。髭曰。争得不遇于人。师寻值沙汰。乃作行者。居于石室。每见僧。便竖起杖子曰。三世诸佛。尽由这个。对者少得冥契。长沙闻。乃曰。我若见即令放下拄杖。别通个消息。三圣将此语只对。被师认破是长沙语。杏山闻三圣失机。乃亲到石室。师见杏山。僧众相随。潜入碓坊碓米。杏曰。行者接待不易。贫道难消。师曰。开心椀子盛将来。无葢盘子合取去。说甚么难消。杏便休。仰山
  ref: X80n1565_p0180b12（五灯会元）
- text: 问。佛之与道。相去几何。师曰。道如展手。佛似握拳。曰。毕竟如何的当。可信可依。师以手拨空三下曰。无恁么事。无恁么事。曰。还假看教否。师曰。三乘十二分教是分外事。若与他作对。即是心境两法。能所双行。便有种种见解。亦是狂慧。未足为道。若不与他作对。一事也无。所以祖师道本来无一物。汝不见小儿出胎时。可道我解看教．不解看教。当恁么时。亦不知有佛性义．无佛性义。及至长大。便学种种知解出来。便道我能我解。不知总是客尘烦恼。十六行中。婴儿行为最哆哆和和时。喻学道之人离分别取舍心。故赞叹婴儿。可况喻取之。若谓婴儿是道。今时人错会。师一夕与仰山玩月。山
  ref: X80n1565_p0180b12（五灯会元）
- text: 问。这个月尖时。圆相甚么处去。圆时。尖相又甚么处去。师曰。尖时圆相隐。圆时尖相在云岩云。尖时圆相在。圆时无尖相。道吾云。尖时亦不尖。圆时亦不圆。仰山辞。师送出门。乃召曰。阇黎。山应诺。师曰。莫一向去。却回这边来
  ref: X80n1565_p0180b12（五灯会元）
- text: 僧问。曾到五台否。师曰。曾到。曰。还见文殊么。师曰。见。曰。文殊向行者道甚么。师曰。文殊道。你生身父母在深草里。青原下四世青原下四世
  ref: X80n1565_p0180b12（五灯会元）
