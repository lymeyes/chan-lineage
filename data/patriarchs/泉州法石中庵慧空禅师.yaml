id: 泉州法石中庵慧空禅师
name: 泉州法石中庵慧空
school: 杨岐派
teacher: 教忠弥光禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0824b08。
sayings:
- text: 上堂。拈拄杖卓一下曰。先打春牛头。又卓一下曰。后打春牛尾。惊起虗空入藕丝里。释迦无路潜踪。弥勒急走千里。文殊却知落处。拊掌大笑欢喜。且道欢喜个甚么。春风昨夜入门来。便见千华生碓觜
  ref: X80n1565_p0824b08（五灯会元）
- text: 上堂。千家楼阁。一霎秋风。祇知襟袖凉生。不觉园林落叶。于斯荐得。触处全真。其或未然。且作寒温相见
  ref: X80n1565_p0824b08（五灯会元）
- text: 上堂。举金刚经云。佛告须菩提。尔所国土中。所有众生若干种心。如来悉知。何以故。如来说。诸心皆为非心。是名为心。要会么。春风得意马蹄疾。一日看尽长安华
  ref: X80n1565_p0824b08（五灯会元）
- text: 僧问。先佛垂范。禁足安居。未审是何宗旨。曰。瑠璃钵内拓须弥。僧便喝。师便打
  ref: X80n1565_p0824b08（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0824b08），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
