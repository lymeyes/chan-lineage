sayings:
- text: 僧问。如何是佛。师曰。多年桃核。曰。意旨如何。师曰。打破里头人
  ref: X80n1565_p0581b03（五灯会元）
- text: 问。如何是祖师西来意。师曰。三年逢一闰。曰。合谈何事。师曰。九日是重阳
  ref: X80n1565_p0581b03（五灯会元）
