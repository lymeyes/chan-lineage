bio: 天童华（应庵昙华）之法嗣，虎丘派第三代。住庆元府天童寺，门庭广大，学者奔凑。其法嗣破庵祖先、松源崇岳分灯并峙；破庵出无准师范、雪窦元聪，松源出天童如净——虎丘一派遂为南宋临济之正宗，元代高峰原妙、中峰明本皆其远裔，元明以后临济一脉尽出虎丘。
sayings:
- text: 师示：「参禅须是起疑情，疑来疑去，蓦然喷地一发，方知元来只是旧时人，不改丝毫。」
  ref: 五灯会元·卷二十·密庵咸杰
- text: 又云：「佛法不是鲜鱼，怕烂却怎地——只是你不肯承当。」（以平常语破学人迟疑）
  ref: 嘉泰普灯录·密庵咸杰
