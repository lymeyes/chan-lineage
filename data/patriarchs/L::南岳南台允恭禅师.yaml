bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0687b02。
sayings:
- text: 上堂。稀逢难遇。正在此时。何谓释迦已灭。弥勒未生。拈拂子曰。正当今日。佛法尽在这个拂子头上。放行把住。一切临时。放行也。风行草偃。瓦砾生光。拾得寒山。点头拊掌。把住也。水泄不通。精金失色。德山临济。饮气吞声。当恁么时。放行即是。把住即是。良久曰。后五日看
  ref: X80n1565_p0687b02（五灯会元）
