id: 漳州报恩院行崇禅师
name: 漳州报恩院行崇
school: —
teacher: 保福展
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0291b08。
sayings:
- text: 僧问。如何是佛法大意。师曰。碓捣磨磨
  ref: X80n1565_p0291b08（五灯会元）
- text: 问。曹谿一路。请
  ref: X80n1565_p0291b08（五灯会元）
- text: 师举扬。师曰。莫屈著曹谿么。曰。恁么则群生有赖。师曰。也是老鼠吃盐
  ref: X80n1565_p0291b08（五灯会元）
- text: 问。不涉公私。如何言论。师曰。吃茶去
  ref: X80n1565_p0291b08（五灯会元）
- text: 问。丹霞烧木佛。意作么生。师曰。时寒烧火向。曰。翠微迎罗汉。意作么生。师曰。别是一家春
  ref: X80n1565_p0291b08（五灯会元）
