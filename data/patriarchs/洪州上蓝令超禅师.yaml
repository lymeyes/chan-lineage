id: 洪州上蓝令超禅师
name: 洪州上蓝令超
school: 青原系
teacher: 夹山善会禅师
status: draft
bio: 初住瑞州上蓝山。唱夹山之道。学侣俱会。后于洪井创禅苑。还以上蓝为名。化道益盛
sayings:
- text: 僧问。如何是上蓝本分事。师曰。不从千圣借。岂向万机求。曰。祇如不借不求时如何。师曰。不可拈放汝手里。得么
  ref: X80n1565_p0206a06（五灯会元）
- text: 问。锋前如何辨的。师曰。锋前不露影。莫向舌头寻
  ref: X80n1565_p0206a06（五灯会元）
- text: 问。如何是无舌人唱歌。师曰。韵震青霄。宫商不犯
  ref: X80n1565_p0206a06（五灯会元）
- text: 问。二龙争珠。谁是得者。师曰。其珠遍地。目睹如泥
  ref: X80n1565_p0206a06（五灯会元）
- text: 问。善财见文殊后。为甚却往南方。师曰。学𠗦入室。知乃通方。曰。为甚么弥勒却遣见文殊。师曰。道广无涯。逢人不尽。至唐大顺正月初。告众曰。吾本约住此十年。今化事既毕。当即行矣。斋毕声钟。端坐长往。谥元真禅师
  ref: X80n1565_p0206a06（五灯会元）
