id: 上蓝顺禅师
name: 上蓝顺
school: —
teacher: —
status: draft
bio: 西蜀人。有远识为人勤渠纯至。丛林后进皆敬爱之。初出蜀时与圜通讷偕行。已而又与大觉琏游甚久。又善于老苏公。故黄门后赞其像云。与讷偕行与琏偕处。得法于南为南长子。然缘薄所居皆远方小刹。又住景福香城双峰。学者过其门莫肯留。师亦超然自得。视世境如飞埃过目。寿八十余坐脱于香城山。颜貌如生。平生与潘延之善。将终使邀延之叙别。廷之至而师已化矣。其
sayings:
- text: 示众多为偈皆德言也。有偈曰。夏日人人把扇摇。冬来以炭满炉烧。若能于此全知晓。尘劫无明当下消。又作赵州勘婆子偈曰。赵州问路婆子。答云直恁么去。皆言勘破老婆。婆子无尔雪处。又作黄龙三关颂曰。长江雪散水滔滔。忽尔狂风浪便高。不识渔家玄妙意。偏于浪里觇风涛。又曰。南海波斯入大唐。有人别宝便商量。或时遇贱或时贵。日到西峰影渐长。又曰。黄龙老和尚。有个生缘语。山僧承嗣伊。今日为君举。为君举。猫儿偏解捉老鼠。颇为丛林称颂云
