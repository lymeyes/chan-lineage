sayings:
- text: 上堂。辽天鹘。万重云。祇一突。是甚么。咄。师元祐元年十二月望日。沐浴净发。说偈曰。山僧住瑞筠。未尝形言句。七十三年来。七十三年去。言毕而逝。五日后须发再生。南岳下十三世南岳下十三世
  ref: X80n1565_p0459a05（五灯会元）
