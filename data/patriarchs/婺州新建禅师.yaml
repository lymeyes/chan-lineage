id: 婺州新建禅师
name: 婺州新建
school: 南岳系
teacher: 赵州谂
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0156b13。
sayings:
- text: 僧问。和尚年老。何不畜一童子侍奉。师曰。有瞽瞆者为吾讨来。僧辞
  ref: X80n1565_p0156b13（五灯会元）
- text: 师问。甚处去。曰。府下开元寺去。师曰。我有一信附与了寺主。汝将去得否。曰。便请。师曰。想汝也不奈何
  ref: X80n1565_p0156b13（五灯会元）
