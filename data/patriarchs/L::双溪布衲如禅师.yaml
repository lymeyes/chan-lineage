id: L::双溪布衲如禅师
name: 双溪布衲如
school: —
teacher: 未详
status: draft
bio: 因嵩禅师戏以诗悼之曰。继祖当吾代。生缘行可规。终身常在道。识病懒寻医。貌古笔难写。情高世莫知。慈云布何处。孤月自相宜。师读罢举笔答曰。道契平生更有谁。闲卿于我最心知。当初未欲成相别。恐误同参一首诗。投笔坐亡。于六十年后。塔户自启。其真容俨然
