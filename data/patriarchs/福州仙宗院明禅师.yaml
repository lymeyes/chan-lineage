sayings:
- text: 上堂曰。幸有如是门风。何不炟赫地绍续取去。若也绍得。不在三界。若出三界。即坏三界。若在三界。即碍三界。不碍不坏。是出三界。是不出三界。恁么彻去。堪为佛法种子。人天有赖。时有
  ref: X80n1565_p0300b18（五灯会元）
- text: 僧问。拏云不假风雷便。迅浪如何透得身。师曰。何得弃本逐末
  ref: X80n1565_p0300b18（五灯会元）
