id: 世奇首座
name: 世奇首座
school: 杨岐派
teacher: 龙门清远禅师
status: draft
bio: 成都人也。遍依师席。晚造龙门。一日燕坐。瞌睡间群蛙忽鸣。误听为净发版响。亟趋往。有晓之者曰。蛙鸣非版也。师恍然。诣方丈剖露。佛眼曰。岂不见罗睺罗。师遽止曰。和尚不必举。待去自看。未几有省。乃占偈曰。梦中闻版响。觉后虾蟆啼。虾蟆与版响。山岳一时齐。由是益加参究。洞臻玄奥。眼命分座。师固辞。曰。此非细事也。如金针刺眼。毫发若差。睛则破矣。愿生生居学地。而自煅炼。眼因以偈美之曰。有道只因频退步。谦和元自惯回光。不知已在青云上。犹更将身入众藏。暮年。学者力请。不容辞。后因说偈曰。诸法空故我心空。我心空故诸法同。诸法我心无别体。祇在而今一念中。且道是那一念。众罔措。师喝一喝而终
