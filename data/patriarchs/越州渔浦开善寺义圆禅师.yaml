id: 越州渔浦开善寺义圆禅师
name: 越州渔浦开善寺义圆
school: 法眼宗
teacher: 天台德韶国师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0373b04。
sayings:
- text: 僧问。一年去。一年来。方便门中请师开。师曰。分明记取。曰。恁么则昔时师子吼。今日象王回也。师曰。且喜没交涉
  ref: X80n1565_p0373b04（五灯会元）
