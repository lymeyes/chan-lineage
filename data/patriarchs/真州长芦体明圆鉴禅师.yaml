bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0620b12。
sayings:
- text: 上堂。顾视左边曰。师子之状。岂免嚬呻。顾右边曰。象王之仪。宁忘回顾。取此逃彼。上士奚堪。识变知机。野狐窠窟。到这里须知有凡圣不历处。古今不到处。且道是甚么人行履。良久曰。丈夫自有冲天志。莫向如来行处来
  ref: X80n1565_p0620b12（五灯会元）
