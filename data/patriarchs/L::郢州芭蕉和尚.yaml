id: L::郢州芭蕉和尚
name: 郢州芭蕉
school: 曹洞宗
teacher: 青林虔
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0198a03。
sayings:
- text: 僧问。从上宗乘。如何举唱。师曰。已被人冷眼󳬇破了
  ref: X80n1565_p0198a03（五灯会元）
- text: 问。不落诸缘。请师直指。师曰。有问有答
  ref: X80n1565_p0198a03（五灯会元）
- text: 问。如何是和尚为人一句。师曰。祗恐阇黎不
  ref: X80n1565_p0198a03（五灯会元）
- text: 问。问。如何是向去底人。师曰。董家稚子声声哭。曰。如何是却来底人。师曰。枯木骊龙露爪牙
  ref: X80n1565_p0198a03（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0198a03），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
