id: 台州胜光和尚
name: 台州胜光
school: 南岳系
teacher: 子湖踪禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0157b12。
sayings:
- text: 僧问。如何是和尚家风。师曰。福州荔枝。泉州刺桐
  ref: X80n1565_p0157b12（五灯会元）
- text: 问。如何是佛法两字。师曰。要道即道。曰。请师道。师曰。穿耳胡僧笑点头。龙华照和尚来。师把住曰。作么生。照曰。莫错。师乃放手。照曰。久向胜光。师默然。照乃辞。师门送曰。自此一别。甚么处相见。照呵呵而去
  ref: X80n1565_p0157b12（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0157b12），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
