id: L::天台山云居智禅师
name: 天台山云居智
school: —
teacher: 佛窟则
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0047a17。
sayings:
- text: 问。见性成佛。其义云何。师曰。清净之性。本来湛然。无有动摇。不属有无．净秽．长短．取舍．体自翛然。如是明见。乃名见性。性即佛。佛即性。故曰见性成佛。曰。性既清净。不属有无。因何有见。师曰。见无所见。曰。既无所见。何更有见。师曰。见处亦无。曰。如是见时。是谁之见。师曰。无有能见者。曰。究竟其理如何。师曰。汝知否。妄计为有。即有能所。乃得名迷。随见生解。便堕生死。明见之人即不然。终日见。未尝见。求名处体相不可得。能所俱绝。名为见性。曰。此性遍一切处否。师曰。无处不遍。曰。凡夫具否。师曰。上言无处不遍。岂凡夫而不具乎。曰。因何诸佛菩萨不被生死所拘。而凡夫独萦此苦。何曾得遍。师曰。凡夫于清净性中计有能所。即堕生死。诸佛大士善知清净性中不属有无。即能所不立。曰。若如是说。即有能了不了人。师曰。了尚不可得。岂有能了人乎。曰。至理如何。师曰。我以要言之。汝即应念清净性中无有凡圣。亦无了不了人。凡之与圣。二俱是名。若随名生解。即堕生死。若知假名不实。即无有当名者。又曰。此是极究竟处。若云我能了．彼不能了。即是大病。见有净秽．凡圣。亦是大病。作无凡圣解。又属拨无因果。见有清净性可栖止。亦大病。作不栖止解。亦大病。然清净性中。虽无动摇。且不坏方便应用。及兴慈运悲。如是兴运之处。即全清净之性。可谓见性成佛矣。继宗踊跃。礼谢而退
