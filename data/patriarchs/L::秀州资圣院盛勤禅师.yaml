id: L::秀州资圣院盛勤禅师
name: 秀州资圣院盛勤
school: 云门宗
teacher: 德山远
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0594b14。
sayings:
- text: 僧问。如何是正法眼。师曰。山青水绿
  ref: X80n1565_p0594b14（五灯会元）
- text: 问。四威仪中如何履践。师曰。鹭鹚立雪。曰。恁么则闻钟持钵。日上栏干。师曰。鱼跃千江水。龙腾万里云。曰。毕竟如何。师曰。山中逢猛虎。天上见文星
  ref: X80n1565_p0594b14（五灯会元）
- text: 上堂。多生觉悟非干衲。一点分明不在灯。拈拄杖曰。拄杖头上祖师。灯笼脚下弥勒。须弥山腰鼓细即不问你。作么生是分明一点。你若道得。无边刹境总在你眉毛上。你若道不得。作么生过得罗刹桥。良久曰。水流千派月。山锁一溪云。卓拄杖。下座
  ref: X80n1565_p0594b14（五灯会元）
