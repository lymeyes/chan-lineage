id: 杭州灵凤山万寿法诠禅师
name: 杭州灵凤山万寿法诠
school: —
teacher: 净土善思禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0461a11。
sayings:
- text: 僧问。如何是佛。师曰。抱桩打拍浮。曰。如何是法。师曰。黄泥弹子。曰。如何是僧。师曰。剃除须发。曰。三宝外。还别有为人处也无
  ref: X80n1565_p0461a11（五灯会元）
- text: 师举起一指。僧曰。不会。师曰。指在唯观月。风来不动幡
  ref: X80n1565_p0461a11（五灯会元）
- text: 上堂。德山棒。临济喝。尽是无风波匝匝。灯笼𨁝跳过青天。露柱魂惊头脑裂。虽然如是。大似食盐加得渴。喝一喝
  ref: X80n1565_p0461a11（五灯会元）
