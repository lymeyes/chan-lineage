id: 洞山价禅师
name: 洞山良价
honorific: 洞山良价禅师 · 悟本禅师（谥）
school: 曹洞宗
dynasty: 唐
region: 瑞州洞山（普利院）
teacher: 云岩昙晟（药山惟俨下）
source_ref: 五灯会元·卷十三·瑞州洞山良价 / 景德传灯录·卷十五
cbeta: T51n2076 卷十五
bio: 会稽俞氏子，参云岩昙晟，问「无情说法」而悟。后过水睹影，大彻，偈曰「切忌从他觅，迢迢与我疏；我今独自往，处处得逢渠。渠今正是我，我今不是渠。」著《宝镜三昧》《五位君臣颂》，立曹洞宗纲宗，与弟子曹山本寂共开曹洞宗。
sayings:
- text: 过水睹影偈：「渠今正是我，我今不是渠。应须恁么会，方得契如如。」
  ref: 五灯会元·卷十三·洞山良价
- text: 僧问「如何是佛」，师曰「麻三斤」。
  ref: 五灯会元·卷十三·洞山良价
