id: L::实性大师
name: 实性
school: —
teacher: 未详
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0220a07。
sayings:
- text: 上堂。以右手拈拄杖。倚放左边。良久曰。此事若不是芙蓉师兄。也大难委悉。便下座。茶陵郁山主茶陵郁山主不曾行脚。因庐山有化士至。论及宗门中事。教令看
  ref: X80n1565_p0220a07（五灯会元）
- text: 僧问法灯。百尺竿头。如何进步。灯云。恶。凡三年。一日乘驴度桥。一踏桥板而堕。忽然大悟。遂有颂云。我有神珠一颗。久被尘劳关鏁。今朝尘尽光生。照破山河万朵。因兹更不游方。师乃白云端和尚得度师。云有赞曰。百尺竿头曾进步。溪桥一踏没山河。从兹不出茶川上。吟啸无非啰哩啰。僧肇法师僧肇法师遭秦王难。临就刑说偈曰。四大元无主。五阴本来空。将头临白刃。犹似斩春风玄沙云。大小肇法师。临死犹寱语
  ref: X80n1565_p0220a07（五灯会元）
