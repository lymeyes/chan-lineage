id: 本觉守一禅师
name: 本觉守一
alias: 本觉一
school: 云门宗
teacher: 慧林本禅师
status: draft
bio: 姓沈氏江阴人。幼慕空门。圆照居瑞光时遂投出家。更不他游。晨夕参叩顿悟宗旨。出世说法
sayings:
- text: 僧问。选佛选官应在。我祖席登科事若何。师曰。大鹏展翼天衢遥。巨鳌转身海水窄
  ref: T51n2077_p0557c02（续传灯录）
- text: 僧云。夫子家声遗旧业。法王基绪得中兴。师曰。后五日看
  ref: T51n2077_p0557c02（续传灯录）
- text: 僧云。且道昔日今时是同是别。师曰。一言已出。问春气已随红雨散。薰风初度绿阴凉。学人借问西来意。乞师方便为敷扬。师曰。分明举似大众。云可谓一句截流万机顿削。师曰。筑著磕著作么生道。云落落清规今古同。相逢会有知音举。师曰。不妨伶利。问离群狮子踞地全威。不露爪牙愿闻哮吼。师曰。大家著力。云当年卢老曾饶舌。今日亲闻第一机。师曰。脚根下事作么生。云宝杖拨开千圣眼。当场辨取火中莲。师曰。果然作家。乃曰。此一法印非有所传。旷劫佩持不从人得。包六虚而无外。浑十世以同时。全提则佛祖踪沈。放下则圣凡交起。昭昭日用森罗顿现于灵光。荡荡目前彼此无分于实际。虽廓然泯迹。流通于无量义门。閴尔无依。迥超于一切智地。非文字相离见闻缘。诸乘由是莫能诠。列祖于斯提不起。此日人天既集不可徒然。略于建化门中普示诸人。各请端心正视。乃顾左右曰。还见么。若恁么承当得。便乃机衡在握同归阃外之权。刹海澄波共助寰中之化。珍重。又曰。诸人知有道不得。山僧道得不知有。且道此两语是一理是二义。若人定当得出。许尔顶门眼正参。又曰。本分相见不在如何。撩起便行犹为钝汉若也分宾分主。俱为念话杜家。更乃说妙谈玄。不当宗门苗裔。山僧恁么道已是雪上加霜。汝等诸人。更拟觅个什么。以拄杖一时趁下
  ref: T51n2077_p0557c02（续传灯录）
