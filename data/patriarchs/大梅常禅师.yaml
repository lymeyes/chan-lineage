id: 大梅常禅师
name: 大梅法常
school: 南岳系
teacher: 马祖一
bio: 马祖道一禅师法嗣，隐居大梅山。马祖以「非心非佛」勘验之，梅曰「任汝非心非佛，我只管即心即佛」；后马祖遣人问「梅子熟也未」，梅曰「熟也」，遂成著名公案。
sayings:
- text: 祖（马祖）闻师住山，令僧问：「和尚见马祖得个什么，便住此山？」师曰：「马祖向我道『即心是佛』，我便向这里住。」僧曰：「马祖近日佛法又别。」师曰：「作么生别？」僧曰：「又道『非心非佛』。」师曰：「这老汉惑乱人未有了日！任他非心非佛，我只管即心即佛。」
  ref: 五灯会元·卷三·大梅法常禅师
status: draft
verify: 据《五灯会元》整理，待 CBETA 逐字校核原文与卷次；师承以谱系父节点为准。
