id: 智门祚禅师
name: 智门光祚
school: 云门宗
teacher: 香林远
bio: 云门文偃禅师法嗣，住智门寺。门下出雪窦重显，为云门宗中兴之关键链环。
sayings:
- text: 僧问：「如何是佛？」师（智门）曰：「踏破草鞋赤脚走。」
