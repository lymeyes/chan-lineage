id: L::韶州黄连山义初明微禅师
name: 韶州黄连山义初明微
school: 沩仰宗
teacher: 南塔涌
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0335b06。
sayings:
- text: 僧问。三乘十二分教即不
  ref: X80n1565_p0335b06（五灯会元）
- text: 问。请师开口不答话。师曰。宝华台上定古今。曰。如何是宝华台上定古今。师曰。一点墨子。轮流不移。曰。学人全体不会。请师指示。师曰。灵觉虽转。空华不坠
  ref: X80n1565_p0335b06（五灯会元）
- text: 问。古路无踪。如何进步。师曰。金乌绕须弥。元与劫同时。曰。恁么则得达于彼岸也。师曰。黄河三千年一度清。广主刘氏向师道化。请入府内说法
  ref: X80n1565_p0335b06（五灯会元）
- text: 僧问。人王与法王相见时如何。师曰。两镜相照。万象历然。曰。法王心要。达磨西来。五祖付与曹谿。自此不传衣钵。未审碧玉阶前。将何付嘱。师曰。石羊水上行。木马夜翻驹。曰。恁么则我王有感。万国归朝。师曰。时人尽唱太平歌
  ref: X80n1565_p0335b06（五灯会元）
- text: 问。如何是佛。师曰。𮌎题卍字。背负圆光
  ref: X80n1565_p0335b06（五灯会元）
- text: 问。如何是道。师展两手示之。僧曰。佛之与道。相去几何。师曰。如水如波
  ref: X80n1565_p0335b06（五灯会元）
