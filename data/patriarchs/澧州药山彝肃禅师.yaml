sayings:
- text: 僧问。佛未出世时如何。师曰。大树大皮裹。曰。出世后如何。师曰。小树小皮缠
  ref: X80n1565_p0589a15（五灯会元）
- text: 问。如何是不动尊。师曰。四王擡不起
  ref: X80n1565_p0589a15（五灯会元）
