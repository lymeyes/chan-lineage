id: 清凉益禅师
name: 法眼文益
honorific: 法眼文益禅师 · 大法眼禅师（谥）· 清凉国师之称
school: 法眼宗
dynasty: 五代（南唐）
region: 金陵清凉院
teacher: 罗汉桂琛（玄沙师备下，雪峰义存再传）
source_ref: 五灯会元·卷十·金陵清凉法眼文益 / 景德传灯录·卷二十四
cbeta: T51n2076 卷二十四
bio: 余杭鲁氏子，参罗汉桂琛，因「溪水深浅」机缘悟入，桂琛印可。后居金陵清凉院，谥「大法眼禅师」，学者尊为清凉。倡「一切现成」，著《宗门十规论》，匡正当时禅病，开法眼宗——五家七宗中最晚出者，后以永明延寿《宗镜录》光大。
sayings:
- text: 示众：「佛法现成，一切具足，岂假外求？」
  ref: 五灯会元·卷十·法眼文益
- text: 僧问「如何是曹源一滴水」，师曰「是曹源一滴水」（桂琛所印之境）。
  ref: 五灯会元·卷十·法眼文益
status: draft
