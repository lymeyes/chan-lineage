alias: 昭觉元
school: 杨岐派
teacher: 圆悟克勤禅师
status: draft
bio: 绵州邓氏子。幼于降寂寺圆具。东游谒大别道禅师。因看廓然无圣之语。忽尔失笑曰。达磨元来在这里。道誉之。往参佛鉴佛眼。蒙赏识。依圆悟于金山。以所见告。悟弗之许。悟被诏住云居。师从之。虽有信入。终以鲠胸之物未去为疑。会悟问参徒。生死到来时如何。僧曰。香台子笑和尚。次问师。汝作么生。师曰。草贼大败。悟曰。有人问尔时如何。师拟答。悟凭陵曰。草贼大败。师即彻证。圆悟以拳击之。师抚掌大笑。悟曰。汝见甚么便如此。师曰。毒拳未报永劫不忘。悟归昭觉命首众。悟将顺世以师继席焉
