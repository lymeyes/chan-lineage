id: L::平江府虎丘雪庭元净禅师
name: 平江府虎丘雪庭元净
school: 杨岐派
teacher: 昭觉勤
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0767b04。
sayings:
- text: 上堂。知有底人。过万年如同一日。不知有者。过一日如同万年。不见死心和尚道。山僧行脚三十余年。以九十日为一夏。增一日也不得。减一日也不得。取不得。舍不得。不可得中祇么得。翠云见处又且不然。山僧行脚三十来年。谁管他一日九十日。也无得。也无不得。处处当来见弥勒。且道弥勒在甚么处。金风吹渭水。落叶满长安
  ref: X80n1565_p0767b04（五灯会元）
- text: 上堂。说得须是见得。见得又须说得。见得说不得。落在阴界。见解偏枯。说得见不得。落在时机。堕在毒海。若是翠云门下。直饶说得见得。好与三十棒。说不得见不得。也好与三十棒。翠云恁么道。也好与三十棒。遂高声召大众曰。崄
  ref: X80n1565_p0767b04（五灯会元）
- text: 上堂。日日日东出。日日日西没。是时人知有。自古自今。如麻似粟。忽然捩转话头。亦不从东出。亦不从西没。且道从甚处出没。若是透关底人。闻恁么道。定知五里牌在郭门外。若是透不过者。往往道半山热瞒人
  ref: X80n1565_p0767b04（五灯会元）
- text: 僧问。如何是到家一句。师曰。坐观成败
  ref: X80n1565_p0767b04（五灯会元）
- text: 问。不与万法为侣者是甚么人。师曰。远亲不如近邻。曰。待汝一口吸尽西江水。即向汝道。又作么生。师曰。近邻不如远亲
  ref: X80n1565_p0767b04（五灯会元）
- text: 问。亡僧迁化向甚么处去。师曰。粪堆头。曰。意旨如何。师曰。筑著磕著
  ref: X80n1565_p0767b04（五灯会元）
