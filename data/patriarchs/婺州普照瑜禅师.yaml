bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0305a03。
sayings:
- text: 上堂。三十年后。大有人向这里亡锋结舌去在。良久曰。还会么。灼然。若不是真师子儿。争识得上来之机。时有
  ref: X80n1565_p0305a03（五灯会元）
- text: 僧问。师子未出窟时如何。师曰。众兽徒然。曰。出窟后如何。师曰。狐绝万里。曰。欲出不出时如何。师曰。当冲者丧。曰。向去事如何。师曰。决在临锋。僧礼拜。师有颂曰。决在临锋处。天然师子机。嚬呻出三界。非祖莫能知
  ref: X80n1565_p0305a03（五灯会元）
