sayings:
- text: 僧问。了然无所得。为甚么天高地阔。师曰。窄
  ref: X80n1565_p0621a09（五灯会元）
- text: 上堂。若论此事。眨上眉毛。早是蹉过。那堪进步向前。更要山僧说破。而今说破了也。还会么。昨日雨。今日晴
  ref: X80n1565_p0621a09（五灯会元）
