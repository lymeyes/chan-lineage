id: 清田和尚
name: 清田
school: 南岳系
teacher: 百丈海
status: draft
bio: 与瑫上座煎茶次。师敲绳床三下。瑫亦敲三下。师曰。老僧敲。有个善巧。上座敲。有何道理。瑫曰。某甲敲。有个方便。和尚敲作么生。师举起盏子。瑫曰。善知识眼应须恁么。茶罢。瑫却
sayings:
- text: 问。和尚适来举起盏子。意作么生。师曰。不可更别有也
  ref: X80n1565_p0127a11（五灯会元）
