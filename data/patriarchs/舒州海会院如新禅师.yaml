id: 舒州海会院如新禅师
name: 舒州海会院如新
school: —
teacher: 保福展
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0290a08。
sayings:
- text: 上堂。良久曰。礼繁即乱。便下座
  ref: X80n1565_p0290a08（五灯会元）
- text: 僧问。从上宗乘。如何举唱。师曰。转见孤独。曰。亲切处乞师一言。师曰。不得雪也听他
  ref: X80n1565_p0290a08（五灯会元）
- text: 问。如何是迦叶顿领底事。师曰。汝若领得。我即不悋。曰。恁么则不烦于师去也。师曰。又须著棒。争得不烦
  ref: X80n1565_p0290a08（五灯会元）
- text: 问。牛头横说竖说。犹未知向上关捩子。如何是向上关捩。师曰。赖遇娘生臂短
  ref: X80n1565_p0290a08（五灯会元）
- text: 问。如何是祖师意。师曰。要道何难。曰。便请师道。师曰。将谓灵利。又不仙陀
  ref: X80n1565_p0290a08（五灯会元）
