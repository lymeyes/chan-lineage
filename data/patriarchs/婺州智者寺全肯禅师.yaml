id: 婺州智者寺全肯禅师
name: 婺州智者寺全肯
school: 法眼宗
teacher: 天台韶
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0372a11。
sayings:
- text: 问。汝名甚么。师曰。全肯。国师曰。肯个甚么。师于言下有省。乃礼拜。住后
  ref: X80n1565_p0372a11（五灯会元）
- text: 僧问。有人不肯。还甘也无。师曰。若人问我。即向伊道
  ref: X80n1565_p0372a11（五灯会元）
