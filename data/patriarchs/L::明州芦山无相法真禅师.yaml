sayings:
- text: 上堂。欲明向上事。须具顶门眼。若具顶门眼。始契出家心。既契出家心。常具顶门眼。要会顶门眼么。四京人著衣吃饭。两浙人饱暖自如。通玄峰顶香风清。花发蟠桃三四株。南岳下十五世南岳下十五世
  ref: X80n1565_p0465b09（五灯会元）
