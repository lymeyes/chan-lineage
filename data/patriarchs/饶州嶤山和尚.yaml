id: 饶州嶤山和尚
name: 饶州嶤山
school: 南岳系
teacher: 长庆大安禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0154b17。
sayings:
- text: 僧问。如何是西来意。师曰。仲冬严寒
  ref: X80n1565_p0154b17（五灯会元）
- text: 问。如何是和尚深深处。师曰。待汝舌头落地。即向汝道
  ref: X80n1565_p0154b17（五灯会元）
- text: 问。如何是丈六金身。师曰。判官断案相公改。长庆
  ref: X80n1565_p0154b17（五灯会元）
- text: 问。从上宗乘。此间如何言论。师曰。有愿不负先圣。庆曰。不负先圣作么生。师曰。不露。庆曰。恁么则请师领话。师曰。甚么处去来。庆曰。祇守甚么处去来
  ref: X80n1565_p0154b17（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0154b17），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
