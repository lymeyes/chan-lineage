id: 归宗弘章禅师
name: 归宗弘章
alias: 归宗章
school: 曹洞宗
teacher: 归宗恽禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0514a06。
sayings:
- text: 僧问。学人有疑时如何。师曰。疑来多少时也
  ref: X80n1565_p0514a06（五灯会元）
- text: 问。小船渡大海时如何。师曰。较些子。曰。如何得渡。师曰。不过来
  ref: X80n1565_p0514a06（五灯会元）
- text: 问。枯木生华时如何。师曰。把一朵来
  ref: X80n1565_p0514a06（五灯会元）
- text: 问。混然觅不得时如何。师曰。是甚么
  ref: X80n1565_p0514a06（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0514a06），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
