id: 常州芙蓉山太毓禅师
name: 常州芙蓉山太毓
school: 南岳系
teacher: 马祖一
status: draft
bio: 金陵范氏子。因行食到庞居士前。士拟接。师乃缩手曰。生心受施。净名早诃。去此一机。居士还甘否。士曰。当时善现。岂不作家。师曰。非关他事。士曰。食到口边。被他夺却。师乃下食。士曰。不消一句。士又
sayings:
- text: 问。马大师著实为人处。还分付吾师否。师曰。某甲尚未见他。作么生知他著实处。士曰。祇此见知。也无讨处。师曰。居士也不得一向言说。士曰。一向言说。师又失宗。若作两向三向。师还开得口否。师曰。直是开口不得。可谓实也。士抚掌而出。宝历中。归齐云入灭。谥大宝禅师
