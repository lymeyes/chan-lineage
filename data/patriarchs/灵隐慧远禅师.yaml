id: 灵隐慧远禅师
name: 灵隐慧远
alias: 灵隐远
school: 杨岐派
teacher: 圆悟克勤禅师
status: draft
bio: 眉之眉山人。族彭氏，世业儒。年十三，因兄从释，师问曰：出家何为？兄曰：求解脱法。师曰：如是我亦可为。遂白母宋氏，愿偕往。母欣然，遂事药师院宗辨为僧，诣大慈习经论。四年，去依灵岩徽禅师。久之，微有契会。圆悟领昭觉，师即之，闻悟普说，忽顿悟仆于众。众掖之，乃曰：吾梦觉矣。至暮，与悟问答无滞。悟大喜，以偈赠之。自此机锋峻发。绍兴乙卯春，眉守以象耳命师开法，不就。是岁圆悟顺世，师东下抵淮南，出住蟠龙，迁琅瑘，又移婺普济、衢定业。光孝郡王赵公令衿、侍郎曾公开皆问道于师。后居南台。未几，过天台，历护国、国清、鸿福三寺。尚书沉公介守平江，以虎丘久废，邀师振之。乾道乙丑，敕居崇先。明年，被　旨补灵隐。孝宗皇帝　召入　禁中，与酬酢，其道愈尊。癸巳春，特　赐佛海禅师
sayings:
- text: 上堂曰：道绝名言，法离闻见。打破虗空，成七八片。直饶锢鏴完全，也是由基副箭
  ref: X79n1559_p0232b07（嘉泰普灯录）
- text: 上堂：昨夜来报五参，正值老僧洗脚。起来抖擞精神，末上输他一著
  ref: X79n1559_p0232b07（嘉泰普灯录）
- text: 上堂：天道亏盈，地道变盈。鬼神害盈，人道恶盈。老僧本贯眉州眉山县人事，行年癸未十二月十六日巳时建生。自小出家，横草不拈，竖草不把。路转山回君自看，南不龟头北不厦
  ref: X79n1559_p0232b07（嘉泰普灯录）
- text: 上堂：滴水冰生分外寒，冻云环合鏁峰峦。根尘不昧心珠露，眨上眉毛子细看
  ref: X79n1559_p0232b07（嘉泰普灯录）
- text: 上堂：新岁有来由，烹茶上酒楼。一双无两脚，半个有三头。穿出神难辨，相逢鬼见愁。倒吹无孔笛，促拍舞凉州。咄！
  ref: X79n1559_p0232b07（嘉泰普灯录）
- text: 上堂：好是仲春渐暖，那堪寒食清明。万叠云山耸翠，一天风月为邻。在处华红柳绿，湖天浪稳风平。山禽枝上语谆谆，再三琐琐碎碎，嘱付叮叮咛咛。你且道他叮咛嘱付个甚么？卓拄杖曰：记取明年今日，依旧寒食清明
  ref: X79n1559_p0232b07（嘉泰普灯录）
- text: 上堂，举僧问睦州：以一重去一重即不问，不以一重去一重时如何？州曰：昨日栽茄子，今朝种冬瓜。师曰：问者善问不解答，答者善答不解
  ref: X79n1559_p0232b07（嘉泰普灯录）
- text: 问。山僧今日向饥鹰爪下夺肉，猛虎口里横身，为你诸人说个样子。登坛道士羽衣轻，咒力虽穷法转新。拇指破开天地暗，蛇头攧落鬼神惊
  ref: X79n1559_p0232b07（嘉泰普灯录）
- text: 僧问：十二时中教学人如何用心？曰：蘸雪吃冬瓜
  ref: X79n1559_p0232b07（嘉泰普灯录）
- text: 问：浩浩尘中如何辨主？曰：木狗头边镰切菜。云：莫便是和尚为人处也无？曰：研槌撩撩饦
  ref: X79n1559_p0232b07（嘉泰普灯录）
- text: 问：即心即佛时如何？曰：顶分丫角。云：非心非佛时如何？曰：耳坠金环。云：不是心，不是佛，不是物，又作么生？曰：秃顶修罗舞柘枝
  ref: X79n1559_p0232b07（嘉泰普灯录）
- text: 问：东山水上行，意旨如何？曰：初三十一，不用择日
  ref: X79n1559_p0232b07（嘉泰普灯录）
- text: 问：文殊是七佛之师，为甚么出女子定不得？曰：担头不挂针
  ref: X79n1559_p0232b07（嘉泰普灯录）
- text: 问：昔有一秀才作无鬼论，论成时有一鬼叱曰：你争奈我何！意作么生？师以手斫额曰：何似生？
  ref: X79n1559_p0232b07（嘉泰普灯录）
- text: 僧云：只如五祖以手作鹁鸠觜，云谷呱呱，又且如何？曰：自领出去
  ref: X79n1559_p0232b07（嘉泰普灯录）
- text: 问：庵内人为甚么不知庵外事？曰：拄杖横挑铁蒺䔧
  ref: X79n1559_p0232b07（嘉泰普灯录）
- text: 问：不与万法为侣者是甚么人？曰：脚踏辘轳。　一日鸣鼓升堂，师潜坐帐中，侍僧寻之。师忽拨开帐曰：只在这里，因甚么不见？僧无对。师曰：大斧斫三门。　问僧：一大藏教是恶口，如何是本身卢舍那？
  ref: X79n1559_p0232b07（嘉泰普灯录）
- text: 僧云：天台普请，南岳游山。师升座别曰：阿耨达池深四十丈，阔四十丈。乙未秋，
  ref: X79n1559_p0232b07（嘉泰普灯录）
- text: 师示众曰：淳凞二年闰季秋九月旦，闹处莫出头，冷地著眼看。明暗不相干，彼此分一半。一种作贵人，教谁卖柴炭？向你道：不可毁，不可赞，体若虗空没涯岸。相唤相呼归去来，记取明年正月半。都下喧传之。果于丙申得辛。后一日感微疾，至上元挥偈安坐而化。偈曰：拗折秤锤，掀翻露布。突出机先，鸦飞不度。留七日，颜色不异。是月二十五日，塔全身于寺之乌峰，送者几万人。世寿七十四，僧腊五十九
  ref: X79n1559_p0232b07（嘉泰普灯录）
