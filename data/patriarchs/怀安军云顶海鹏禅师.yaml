bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0527b15。
sayings:
- text: 僧问。如何是大疑底人。师曰。毕钵岩中。面面相󳬇。曰。如何是不疑底人。师曰。如是我闻。须弥粉碎
  ref: X80n1565_p0527b15（五灯会元）
- text: 问。祖意教意。是同是别。师曰。达磨逢梁武。摩腾遇汉明
  ref: X80n1565_p0527b15（五灯会元）
