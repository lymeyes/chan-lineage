id: 佛日智才禅师
name: 佛日智才
alias: 佛日才
school: 云门宗
teacher: 天衣义怀禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《续传灯录》T51n2077_p0513b21。
sayings:
- text: 僧问。如何是道。师曰。水冷生冰。曰如何是道中人。师曰。春雪易消。曰如何谈论。师鸣指一下。问东西密相付。为甚么众人皆知。师曰。春无三日晴。曰特伸请益。师曰。拕泥带水。曰学人到这里却不会。师曰。贼身已露
  ref: T51n2077_p0513b21（续传灯录）
- text: 上堂。城里喧繁空山寂静。然虽如此。动静一如死生不二。四时轮转物理湛然。夏不去而秋自来。风不凉而人自爽。今也古也不改丝毫。谁少谁多身无二用。诸禅德既身。无二用。为甚么龙女现十八变。君不见。弄潮须是弄潮人。珍重
  ref: T51n2077_p0513b21（续传灯录）
- text: 上堂。风雨萧骚塞汝耳根。落叶交加塞汝眼根。香臭丛杂塞汝鼻根。冷热甘甜塞汝舌根。衣绵温冷塞汝身根。颠倒妄想塞汝意根。诸禅德。直饶汝翻得转。也是平地骨堆参
  ref: T51n2077_p0513b21（续传灯录）
- text: 上堂。严风刮地大野清寒。万里草离衰。千山树黯黪。苍鹰得势俊鹘横飞。颇称衲僧钵囊高挂独步遐方。似猛将出荒郊临机须扣敌。今日还有么。良久曰。匣中宝剑袖里金锤。幸遇太平挂向壁上。参
  ref: T51n2077_p0513b21（续传灯录）
- text: 上堂。诸禅德还知么。山僧生身父母一时丧了。直是无依倚处。以手槌胸曰。苍天苍天。复顾大众良久曰。尔等诸人也是铁打心肝。便下座
  ref: T51n2077_p0513b21（续传灯录）
- text: 上堂举柏树子话。师曰。赵州庭柏说与禅客。黑漆屏风松罗亮隔
  ref: T51n2077_p0513b21（续传灯录）
- text: 僧问。如何是无为师曰。山前雪半消。曰请师方便。师曰。水声转呜咽。天钵重元禅师北京天钵寺重元文慧禅师。青州千乘孙氏子。母梦于佛前吞一金果后乃诞。师相仪殊特迥异群童。十七出家冠岁圆具。初游讲肆颇达宗教。尝宴坐古室。忽闻空中有告师。学上乘者无滞于此。惊骇出视杳无人迹。翌日客至出寒山集。师一览之即慕参玄。至天衣法席。遇众请益。豁然大悟。衣印可曰。此吾家千里驹也。出世后
  ref: T51n2077_p0513b21（续传灯录）
- text: 僧问。如何是禅。师曰。入笼入槛。僧拊掌。师曰。跳得出是好手。僧拟议。师曰了。问如何是透法身句。师曰。上是天下是地
  ref: T51n2077_p0513b21（续传灯录）
- text: 上堂。冬不受寒夏不受热。身上衣口中食应时应节。即非天。然自然。尽是人人膏血。诸禅德山僧恁么说话。为是世法为是佛法。若也择得分明。万两黄金亦消得。喝一喝
  ref: T51n2077_p0513b21（续传灯录）
- text: 上堂福胜一片地。行也任尔行。住也任尔住。步步踏著始知落处。若未然者。直须退步脚下看取咄
  ref: T51n2077_p0513b21（续传灯录）
- text: 上堂。古今天地万象森然。岁岁秋收冬藏。人人道我总会。还端的也无。直饶端的比他。鸡足峰前。是甚么闲事。良久曰。今朝十月初旬天寒不得普请参。师四易名蓝。缁白仰童。示寂正盛暑中。清风透室异香馥郁。荼毘烟焰到处获舍利五色。大师文公彦博以上。赐白琉璃瓶贮之。籍以锦褥。躬葬于塔。居士何震所获额骨齿牙舍利别创浮图。瑞岩子鸿禅师台州瑞岩子鸿禅师本郡吴氏子
  ref: T51n2077_p0513b21（续传灯录）
- text: 僧问。如何是道。师曰。开眼觑不见。问法尔不尔如何指南。师曰。话堕也。曰乞师指示。师呵呵大笑
  ref: T51n2077_p0513b21（续传灯录）
- text: 上堂。一不守二不向上下四维无等量。大洋海里泛銕船。须弥顶上翻鲸浪。临济缩却舌头。德山阁却拄杖。千古万古独巍巍。留与人间作榜样
  ref: T51n2077_p0513b21（续传灯录）
