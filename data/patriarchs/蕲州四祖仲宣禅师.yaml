bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0709b18。
sayings:
- text: 上堂。诸佛出世。为一大事因缘。祖师西来。直指人心是佛。凡圣本来不二。迷悟岂有殊途。非涅槃之可欣。非死生之可厌。但能一言了悟。不起坐而即证无生。一念回光。不举步而遍周沙界。如斯要径。引曰宗门。山僧既到这里。不可徒然。乃举拂子曰。看看。山河大地。日月星辰。若凡若圣。是人是物。尽在拂子头上一毛端里出入游戏。诸人还见么。设或便向这里见得倜傥分明。更须知有向上一路。试问诸人。作么生是向上一路。良久曰。六月长天降大雪。三冬岭上火云飞
  ref: X80n1565_p0709b18（五灯会元）
