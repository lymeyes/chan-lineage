id: 郢州兴阳归静禅师
name: 郢州兴阳归静
school: 临济宗
teacher: 西院明禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0409b11。
sayings:
- text: 问。拟问不问时如何。院便打。师良久。院曰。若唤作棒。眉须堕落。师于言下大悟。住后
  ref: X80n1565_p0409b11（五灯会元）
- text: 僧问。师唱谁家曲。宗风嗣阿谁。师曰。少室山前无异路。南岳下八世南岳下八世
  ref: X80n1565_p0409b11（五灯会元）
