id: 舒州投子道宣禅师
name: 舒州投子道宣
school: 曹洞宗
teacher: 天衣聪禅师
status: draft
bio: 久侍天衣。无所契。衣叱之。师忘寝食者月余。一夕。闻巡更铃声。忽猛省曰。住。住。一声直透青霄路。寒潭月皎有谁知。泥牛触折珊瑚树。衣闻。命职藏司。住后。凡有所
sayings:
- text: 问。以拂子作摇铃势。青原下十五世青原下十五世
