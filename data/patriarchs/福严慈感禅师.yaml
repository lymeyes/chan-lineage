sayings:
- text: 上堂。古佛心祇如今。若不会若沈吟。秋雨微微秋风飒飒。乍此乍彼若为酬答。沙岸芦花青黄交杂。禅者何依。良久曰。札。续传灯录目录续传灯录目录大鉴下第十三世黄龙慧南禅师法嗣下五十九人石霜琳禅师开元子琦禅师上蓝顺禅师三祖法宗禅师四祖法演禅师五祖晓常禅师佛印宣明禅师灵岩重确禅师大沩颕诠禅师九棕法明禅师廉泉昙秀禅师灵鹫慧觉禅师兴化法澄禅师花药元恭禅师兴国契雅禅师宝盖子勤禅师云峰道圆禅师延庆洪准禅师胜业惟亨禅师登云超及禅师积翠永庵主灵隐德滋禅师东林常总禅师保宁圆玑禅师云居元佑禅师报本慧元禅师建隆昭庆禅师清隐清源禅师禾山德普禅师慧林德逊禅师祐圣法𡨢禅师三角慧泽禅师法轮文昱禅师归宗志芝庵主已上三十四人见录隆庆利俨禅师黄龙自庆禅师大光应犀禅师水南智秘禅师升山绍南禅师南华清桂禅师芭蕉仁珂禅师清泉崇雅禅师章法觉信禅师慧日富禅师归宗进首座涌泉以禅师石鼓洞珠禅师金粟慧英禅师宝胜澄甫禅师慧日普觉禅师西峰正信禅师普宁惠因禅师翠岩宝赟禅师鹅湖崇坚禅师云门希晏禅师吉祥有臻禅师乾明超莹禅师景德本隆禅师云顶清泰禅师已上二十五人无录慧林若冲禅师法嗣八人华严智明禅师永泰智航禅师寿圣子邦禅师广福昙章禅师扬州石塔戒禅师已上五人见录福昌义端禅师景德元泰禅师白鹿仲豫禅师已上三人无录瑞岩子鸿禅师法嗣六人佛窟可英禅师岳林昙振禅师已上二人见录中竺禅慧禅师景德嵩禅师资圣本禅师寿圣文谅禅师已上四人无录天钵重元禅师法嗣六人祖印善丕禅师元丰清满禅师善胜真悟禅师定慧法本禅师已上四人见录洞山仙禅师义安慧深禅师已上二人无录三祖冲会禅师法嗣二人临安居润禅师一人见录甘露明广禅师一人无录续传灯录目录终续传灯录大鉴下第十三世2 黄龙慧南禅师法嗣黄龙南禅师法嗣
