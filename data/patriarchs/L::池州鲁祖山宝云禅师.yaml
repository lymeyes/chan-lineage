id: L::池州鲁祖山宝云禅师
name: 池州鲁祖山宝云
school: 南岳系
teacher: 马祖一
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0111a01。
sayings:
- text: 僧问。如何是诸佛师。师曰。头上有宝冠者不是。曰。如何即是。师曰。头上无宝冠。洞山来参。礼拜。起。侍立。少顷而出。却再入来。师曰。祇恁么。祇恁么。所以如此。山曰。大有人不肯。师曰。作么取汝口辩。山便礼拜
  ref: X80n1565_p0111a01（五灯会元）
- text: 僧问。如何是不言言。师曰。汝口在甚么处。曰。无口。师曰。将甚么吃饭。僧无对洞山代云。他不饥。吃甚么饭。师寻常见僧来。便面壁。南泉闻曰。我寻常向师僧道。向佛未出世时会取。尚不得一个半个。他恁么驴年去玄觉云。为复唱和语。不肯语。保福问长庆。祇如鲁祖。节文在甚么处。被南泉恁么道。长庆云。退己让于人。万中无一个。罗山云。陈老师当时若见背上与五火抄。何故为伊解放不解收。玄沙云。我当时若见。也与五火抄。云居锡云。罗山．玄沙总恁么道。为复一般。别有道理。若择得出许上座佛法有去处。玄觉云。且道玄沙五火抄。打伊著不著
  ref: X80n1565_p0111a01（五灯会元）
