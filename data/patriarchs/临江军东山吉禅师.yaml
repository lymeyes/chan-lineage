id: 临江军东山吉禅师
name: 临江军东山吉
school: —
teacher: 道场琳
status: draft
bio: 因李朝请与甥芗林居士向公子𬤇谒之。遂
sayings:
- text: 问。家贼恼人时如何。师曰。谁是家贼。李竖起拳。师曰。贼身已露。李曰。莫茶糊人好。师曰。赃证见在。李无语。师示以偈曰。家贼恼人孰奈何。千圣回机祇为他。遍界遍空无影迹。无依无住绝笼罗。贼。贼。猛将雄兵收不得。疑杀天下老禅和。笑倒闹市古弥勒。休。休。不用将心向外求。回头瞥尔贼身露。和赃捉获世无俦。世无俦。真可仰。从兹不复夸伎俩。怗怗安家乐业时。万象森罗齐拊掌
