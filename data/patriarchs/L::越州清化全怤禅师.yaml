id: L::越州清化全怤禅师
name: 越州清化全怤
school: 沩仰宗
teacher: 南塔涌
status: draft
bio: 吴郡昆山人也。初参南塔。塔
sayings:
- text: 问。从何而来。师曰。鄂州。塔曰。鄂州使君名甚么。师曰。化下不敢相触忤。曰。此地道不畏。师曰。大丈夫何必相试。塔冁丑忍切然而笑。遂乃印可。时庐陵安福县宰建应国禅苑。迎师聚徒。本道上闻。赐名清化
  ref: X80n1565_p0335a03（五灯会元）
- text: 僧问。如何是和尚急切为人处。师曰。朝看东南。暮看西北。曰。不会。师曰。徒夸东阳客。不识西阳珍
  ref: X80n1565_p0335a03（五灯会元）
- text: 问。如何是正法眼。师曰。我却不知。曰。和尚为甚么不知。师曰。不可青天白日尿床也。师后还故国。钱氏文穆王特加礼重。晋天福二年丁酉岁。钱氏戍将辟云峰山建院。亦以清化为名。延师开堂
  ref: X80n1565_p0335a03（五灯会元）
- text: 僧问。如何是佛法大意。师曰。华表柱头木鹤飞
  ref: X80n1565_p0335a03（五灯会元）
- text: 问。路逢达道人。不将语默对。未审将甚么对。师曰。眼里瞳人吹叫子
  ref: X80n1565_p0335a03（五灯会元）
- text: 问。和尚年多少。师曰。始见去年九月九。如今又见秋叶黄。曰。恁么则无数也。师曰。问取黄叶。曰。毕竟事如何。师曰。六只骰子满盆红
  ref: X80n1565_p0335a03（五灯会元）
- text: 问。亡僧迁化向甚么处去。师曰。长江无间断。聚沫任风飘。曰。还受祭祀也无。师曰。祭祀即不无。曰。如何祭祀。师曰。渔歌举櫂。谷里闻声。忠献王赐紫方袍。师不受。王改以衲衣。仍号纯一禅师。师曰。吾非饰让也。虑后人仿吾而逞欲耳。开运四年秋。示寂。时大风摧震竹木
  ref: X80n1565_p0335a03（五灯会元）
