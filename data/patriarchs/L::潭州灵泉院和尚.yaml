id: L::潭州灵泉院和尚
name: 潭州灵泉院
school: 临济宗
teacher: 风穴沼
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0413a07。
sayings:
- text: 僧问。如何是和尚活计。师曰。一物也无。曰。未审日用何物。师便喝。僧礼拜。师便打
  ref: X80n1565_p0413a07（五灯会元）
- text: 问。先师道。金沙滩上马郎妇。意旨如何。师曰。上东门外人无数。曰。便恁么会时如何。师曰。天津桥上往来多。南岳下九世南岳下九世
  ref: X80n1565_p0413a07（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0413a07），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
