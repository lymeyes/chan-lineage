id: L::庆元府东山全庵齐己禅师
name: 庆元府东山全庵齐己
school: 杨岐派
teacher: 灵隐远
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0813b09。
sayings:
- text: 上堂。举。修山主偈曰。是柱不见柱。非柱不见柱。是非已去了。是非里荐取。召大众曰。荐得是。移华兼蝶至。荐得非。担泉带月归。是也好。郑州棃胜青州枣。非也好。象山路入蓬莱岛。是亦没交涉。踏著秤锤硬似铁。非亦没交涉。金刚宝剑当头截。阿呵呵。会也么。知事少时烦恼少。识人多处是非多。莲社会道友。请
  ref: X80n1565_p0813b09（五灯会元）
- text: 上堂。渐渐鸡皮鹤发。父少而子老。看看行步𨀁蹱。疑杀木上座。直饶金玉满堂。照顾白拈贼。岂免衰残老病。正好著精彩。任汝千般快乐。渠侬合自由。无常终是到来。归堂吃茶去。唯有径路修行。依旧打之绕。但念阿弥陀佛。念得不济事。复曰。恶。这条活路。已被善导和尚直截指出了。也是你诸人。朝夕在径路中往来。因甚么当面蹉过阿弥陀佛。这里荐得。便可除迷倒障。󳫠犹豫箭。截疑惑网。断痴爱河。伐心稠林。浣心垢浊。正心谄曲。绝心生死。然后转入那边。擡起脚。向佛祖履践不到处进一步。开却口。向佛祖言诠不到处说一句。唤回善导和尚。别求径路修行。其或准前。舍父逃走。流落他乡。撞东磕西。苦哉。阿弥陀佛
  ref: X80n1565_p0813b09（五灯会元）
