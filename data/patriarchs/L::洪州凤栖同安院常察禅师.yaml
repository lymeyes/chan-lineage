id: L::洪州凤栖同安院常察禅师
name: 洪州凤栖同安院常察
school: 青原系
teacher: 九峰虔
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0210a11。
sayings:
- text: 僧问。如何是凤栖家风。师曰。凤栖无家风。曰。既是凤栖。为甚么无家风。师曰。不迎宾。不待客。曰。恁么则四海参寻。当为何事。师曰。盘饤自有旁人施
  ref: X80n1565_p0210a11（五灯会元）
- text: 问。如何是凤栖境。师曰。千峰连岳秀。万嶂不知春。曰。如何是境中人。师曰。孤岩倚石坐。不下白云心
  ref: X80n1565_p0210a11（五灯会元）
- text: 问。祖意教意。是同是别。师曰。铁狗吠石牛。幻人看月色
  ref: X80n1565_p0210a11（五灯会元）
- text: 问。如何是披毛戴角底人。师曰。蓑衣箬笠卖黄金。几个相逢不解唤
  ref: X80n1565_p0210a11（五灯会元）
- text: 问。学人未晓时机。乞师指示。师曰。参差松竹烟笼薄。重叠峰峦月上迟。僧拟进语。师曰。剑甲未施。贼身已露。僧曰。何也。师曰。精阳不剪霜前竹。水墨徒夸海上龙。僧绕禅床而出。师曰。闭目食蜗牛。一场酸涩苦
  ref: X80n1565_p0210a11（五灯会元）
- text: 问。返本还源时如何。师曰。蟭蟟虽脱壳。不免抱寒枝
  ref: X80n1565_p0210a11（五灯会元）
- text: 问。如何是猛利底人。师曰。石牛步步吼深潭。纸马声声火中叫。新到持锡绕师三匝。振锡一下曰。凡圣不到处。请师道。师鸣指三下。僧曰。同安今日吓得忘前失后。师曰。阇黎发足何处。僧珍重便出。师曰。五湖衲子。一锡禅人。未到同安。不妨疑著。僧回首。曰。远闻不如近见。师曰。贪他一杯酒。失却满船鱼
  ref: X80n1565_p0210a11（五灯会元）
- text: 问。如何是大没惭愧底人。师曰。老僧见作这业次
  ref: X80n1565_p0210a11（五灯会元）
- text: 问。如何是祖师西来意。师曰。犀因玩月纹生角。象被雷惊花入牙
  ref: X80n1565_p0210a11（五灯会元）
- text: 问。如何是向去底人。师曰。寒蝉抱枯木。泣尽不回头。曰。如何是却来底人。师曰。火里芦花秀。逢春恰似秋。曰。如何是不来不去底人。师曰。石羊遇石虎。相看早晚休。座主
  ref: X80n1565_p0210a11（五灯会元）
- text: 问。三乘十二分教。某甲粗知。未审和尚说何法示人。师曰。我说一乘法。曰。如何是一乘法。师曰。几般云色出峰顶。一样泉声落槛前。曰。不问这个。如何是一乘法。师曰。你不妨灵利。玩月次。谓僧曰。奇哉。奇哉。星明月朗。足可观瞻。岂异道乎。僧曰。如何是道。师曰。汝试道看。曰。彼自无疮。勿伤之也。师曰。负笈攻文。不闲弓矢。问僧。近离何处。曰。江西。师曰。江西法道何似此间。曰。赖遇问著某甲。若问别人。则祸生也。师曰。老僧适来造次。曰。某甲不是婴儿。徒用止啼黄叶。师曰。伤鳖恕龟。杀活由我。问僧。甚处来。曰。五台。师曰。还见文殊么。僧展两手。师曰。展手颇多。文殊谁睹。曰。气急杀人。师曰。不睹云中雁。焉知沙塞寒
  ref: X80n1565_p0210a11（五灯会元）
- text: 问。远趋丈室。乞师一言。师曰。孙膑门下。徒话钻龟。曰。名不浪得。师曰。吃茶去。僧便珍重。师曰。虽得一场荣。刖却一双足。师看经次。有僧来问讯。师曰。古佛今佛。皆无别理。曰。和尚如何。师打一掌。僧曰。如是。如是。师曰。这风颠汉。曰。今古皆然。师曰。拟欲降龙。却逢死虎。曰。同安甚生光彩。师曰。守株停舶。非汝而谁。曰。和尚𫆏。师曰。胡羊往楚。抱屈而归。师问僧。眼界无光。如何得见。曰。北斗东转。南斗西移。师曰。夫子入太庙。曰。与么则同安门下。道绝人荒去也。师曰。横抱𪧀孩。拟彰皇简。师闻鹊声。谓众曰。喜鹊鸣寒桧。心印是渠传。僧出问曰。何别。师曰。众中有人在。曰。同安门下。道绝人荒。师曰。胡人饮乳。返怪良医。曰。休。休。师曰。老鹤入枯池。不见鱼踪迹
  ref: X80n1565_p0210a11（五灯会元）
