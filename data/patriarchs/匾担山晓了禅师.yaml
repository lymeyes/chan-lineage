id: 匾担山晓了禅师
name: 匾担山晓了
school: —
teacher: 六祖大鉴旁出
status: draft
bio: 传记不载。唯北宗门人忽雷澄禅师撰塔碑盛行于世。其略曰。师住匾担山。号晓了。六祖之嫡嗣也。师得无心之心。了无相之相。无相者森罗眩目。无心者分别炽然。绝一言一响。响莫可传。传之行矣。言莫可穷。穷之非矣。师得无无之无。不无于无也。吾今以有有之有。不有于有也。不有之有。去来非增。不无之无。涅槃非灭。呜呼。师住世兮曹谿明。师寂灭兮法舟倾。师谭无说兮寰宇盈。师示迷徒兮了义乘。匾担山色垂兹色。空谷犹留晓了名
