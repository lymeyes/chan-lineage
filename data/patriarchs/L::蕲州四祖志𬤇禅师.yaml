bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0581a16。
sayings:
- text: 僧问。如何是透法身句。师曰。多年松树老𥻘皴
  ref: X80n1565_p0581a16（五灯会元）
- text: 问。叶落归根时如何。师曰。一岁一枯荣
  ref: X80n1565_p0581a16（五灯会元）
