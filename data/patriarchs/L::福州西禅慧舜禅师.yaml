sayings:
- text: 上堂。五日一参。三八普说。千说万说。横说竖说。忽有个汉出来道。说即不无。争奈三门头两个不肯。山僧即向他道。瞎汉若不得他两个。西禅大似不遇知音。青原下十五世青原下十五世
