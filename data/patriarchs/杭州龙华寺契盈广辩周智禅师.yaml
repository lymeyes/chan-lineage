bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0289b02。
sayings:
- text: 僧问。如何是龙华境。师曰。翠竹摇风。寒松锁月。曰。如何是境中人。师曰。切莫唐突
  ref: X80n1565_p0289b02（五灯会元）
- text: 问。如何是三世诸佛道场。师曰。莫别瞻礼。曰。恁么则亘古亘今。师曰。是甚么年中
  ref: X80n1565_p0289b02（五灯会元）
