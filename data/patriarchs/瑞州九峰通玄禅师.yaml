id: 瑞州九峰通玄禅师
name: 瑞州九峰通玄
school: 曹洞宗
teacher: 洞山价
status: draft
bio: 郢州程氏子。初参德山。后于洞山言下有省。住后
sayings:
- text: 僧问。自心他心。得相见否。师曰。自己尚不见。他人何可观
  ref: X80n1565_p0493b01（五灯会元）
- text: 问。罪福之性。如何了达。得无同异。师曰。𫄨绤不御寒。青原下六世青原下六世
  ref: X80n1565_p0493b01（五灯会元）
