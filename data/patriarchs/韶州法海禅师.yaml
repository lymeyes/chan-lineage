id: 韶州法海禅师
name: 韶州法海
school: —
teacher: 六祖大鉴旁出
status: draft
bio: 曲江人也。初见六祖。问曰。即心即佛。愿垂指喻。祖曰。前念不生即心。后念不灭即佛。成一切相即心。离一切相即佛。吾若具说。穷劫不尽。听吾偈曰。即心名慧。即佛乃定。定慧等持。意中清净。悟此法门。由汝习性。用本无生。双修是正。师信受。以偈赞曰。即心元是佛。不悟而自屈。我知定慧因。双修离诸物
