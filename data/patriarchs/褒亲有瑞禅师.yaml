id: 褒亲有瑞禅师
name: 褒亲有瑞
alias: 褒亲瑞
school: 黄龙派
teacher: 东林常总禅师
status: draft
bio: 姓陈氏兴化军仙游县人。幼异尘俗默坐终日。父母奇之舍令出家。依东京景德寺重全上人为师落发。受具。造黄龙南禅师法席南公曰。汝为人事来为佛法来。师曰。为佛法来。南公曰。若为佛法来即今便分付。遂打一拂子。师曰。和尚也不得恼乱人。南公器之。然师终未彻。后依泐潭总禅师始悟玄奥。给侍久之众推上首。出世安州太平旌德。被诏住东京褒亲。哲宗皇帝五七入内。赐大觉师名。百日入内。又赐佛海禅师号。开堂问答罢。师曰问得亦好不问亦强。一问若不达翻成戏论法。问若有旨答亦随机。为什么宗乘道著千圣退步。宝杖敲时三乘失辙。盖为此事似秦镜当台千里邪心自怖。如镆鎁在袖百亿魔军碎胆。直得大圣不说说迦叶绝闻闻。大底只要诸人回光返本敛念收心。善恶都莫思量。自然得入心体湛寂。妙用恒沙物我混同。有人便于此承当得。犹属抱桥柱澡洗及乎。舍之似万里望乡关。执之堕在魔王境界。唤作迷时人逐法悟后法随人。盖无私法要千古同规。一句同机唯人自鉴。到这里若会得。便见终始一如古今齐致。至于赵州庭柏清风长在。若不会得便见云门凳子天地悬殊。于是不得已便乃琉璃殿上日午打更。无景林间秋行春令。何也。妙体虽然无异妙用。盖有多门。是故释主能仁应迹迦维引悲沙界。神通妙力不可思议。盖为群生日用三昧而不觉。业识茫然而莫返。遂致前境纷纭本原错杂。繇是金仙久默斯要。于不二境作大佛事。入寂此土经纶三界。道洽大千化均百亿。言满法界捞笼群生。敷玄籍以晓果因。垂天真以育情性。无何机有大小乘分顿渐。故使资粮者。可以推微达著寻端见绪。然后为散乱者。诫之以定慧。耽诸乐者。示之以无常。乐小法者。导之以大方。计诸见者。谕之以无动。泥名相者。开不二门。此岂不以因言入道籍教明真。一心皎然万德咸著。良为于此。末后却曰。如标月指空拳谕实。噫如此兴慈大似有过无功。未如我金色头陀随身活计瑠璃钵盂传来无底。任是千眼大士莫窥其状。达磨所有生涯大庾岭头掷下。设有万夫之勇提之不动。后来风幡事起卷簟义彰。……（原文更长，见 cbeta 锚点）
