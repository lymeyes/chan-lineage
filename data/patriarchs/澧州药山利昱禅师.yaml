id: 澧州药山利昱禅师
name: 澧州药山利昱
school: 法眼宗
teacher: 梁山观
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0523b07。
sayings:
- text: 上堂。山河大地．日月星辰与诸上座同生。三世诸佛与诸上座同参。三藏圣教与诸上座同时。还信得及么。若也信得及。陕府铁牛吞却乾坤。虽然如是。被法身碍却。转身不得。须知有出身之路。作么生是诸上座出身之路。道。道。良久曰。若道不得。永沉苦海。珍重
  ref: X80n1565_p0523b07（五灯会元）
- text: 僧问。格外之谈。乞师垂示。师曰。要道也不难。曰。恁么则万仞碧潭。许垂一线也。师曰。大众笑你。鼎州罗纹得珍山主鼎州罗纹得珍山主
  ref: X80n1565_p0523b07（五灯会元）
- text: 僧问。亲切处乞师指示。师曰。老僧元是广南人
  ref: X80n1565_p0523b07（五灯会元）
