id: L::福州白鹿山显端禅师
name: 福州白鹿山显端
school: —
teacher: 琅邪觉
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0447a09。
sayings:
- text: 僧问。如何是道。师曰。九州百粤。曰。如何是道中人。师曰。乘肥衣锦
  ref: X80n1565_p0447a09（五灯会元）
- text: 问。如何是大善知识。师曰。持刀按剑。曰。为甚么如此。师曰。礼防君子
  ref: X80n1565_p0447a09（五灯会元）
- text: 问。如何是异类。师曰。鸦巢生凤
  ref: X80n1565_p0447a09（五灯会元）
- text: 上堂。摩腾入汉。肉上剜疮。僧会来吴。眼中添屑。达磨九年面壁。鬼魅之由。二祖立雪求心。翻成不肖。汝等诸人到这里。如何吐露。若也道得。海上横行。若道不得。林间独卧。以拄杖击禅床一下
  ref: X80n1565_p0447a09（五灯会元）
- text: 问。如何是无相佛。师曰。滩头石师子。曰。意旨如何。师曰。有心江上住。不怕浪淘沙
  ref: X80n1565_p0447a09（五灯会元）
- text: 问。凝然湛寂时如何。师曰。不是阇黎安身立命处。曰。如何是学人安身立命处。师曰。云有出山势。水无投㵎声
  ref: X80n1565_p0447a09（五灯会元）
- text: 问。如何是教意。师曰。楞伽会上。曰。如何是祖意。师曰。熊耳山前。曰。教意祖意。相去几何。师曰。寒松连翠竹。秋水对红莲
  ref: X80n1565_p0447a09（五灯会元）
