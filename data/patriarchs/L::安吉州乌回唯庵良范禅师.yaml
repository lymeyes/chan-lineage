id: L::安吉州乌回唯庵良范禅师
name: 安吉州乌回唯庵良范
school: 黄龙派
teacher: 天宁卓
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0715a02。
sayings:
- text: 上堂。尘劫已前事。堂堂无背面。动静莫能该。舒卷快如电。莫道凡不知。佛也󳬇不见。决定在何处。合取这两片。荐不荐。更为诸人通一线。良久曰。天下太平。皇风永扇
  ref: X80n1565_p0715a02（五灯会元）
- text: 上堂。举。僧问赵州。至道无难。唯嫌拣择。是时人窠窟否。州曰。曾有人
  ref: X80n1565_p0715a02（五灯会元）
- text: 问。老僧直得五年分疏不下。师召众曰。赵州具顶门眼。向击石火里分缁素。闪电光中明纵夺。为甚么却五年分疏不下。还委悉么。易分雪里粉。难辨墨中煤
  ref: X80n1565_p0715a02（五灯会元）
