id: 福州普贤元素禅师
name: 福州普贤元素
school: 黄龙派
teacher: 上封本才禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0712b10。
sayings:
- text: 上堂。兵随印转。三千里外绝烟尘。将逐符行。二六时中净裸裸。不用铁旗铁鼓。自然草偃风行。何须七纵七擒。直得无思不服。所谓大丈夫秉慧剑。般若锋兮金刚𦦨。非但能摧外道心。早曾落却天魔胆。正恁么时。且道主将是甚么人。喝一喝
  ref: X80n1565_p0712b10（五灯会元）
- text: 上堂。南泉道。我十八上便解作活计。囊无系蚁之丝。厨乏聚蝇之糁。赵州道。我十八上便解破家散宅。南头买贱。北头卖贵。点检将来。好与三十棒。且放过一著。何故。曾为宕子偏怜客。自爱贪杯惜醉人
  ref: X80n1565_p0712b10（五灯会元）
- text: 上堂。未开口时先分付。拟思量处隔千山。莫言佛法无多子。未透玄关也大难。祇如玄关作么生透。喝一喝
  ref: X80n1565_p0712b10（五灯会元）
