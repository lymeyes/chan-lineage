bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0112b15。
sayings:
- text: 僧问。如何是佛法大意。师曰。春日鸡鸣。曰。学人不会。师曰。中秋犬吠
  ref: X80n1565_p0112b15（五灯会元）
- text: 上堂。大众出来出来。老汉有个法要。百年后不累汝。众曰。便请和尚说。师曰。不消一堆火
  ref: X80n1565_p0112b15（五灯会元）
