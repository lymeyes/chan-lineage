id: 庆元府天童无用净全禅师
name: 庆元府天童无用净全
school: 杨岐派
teacher: 大慧宗杲禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0796a04。
sayings:
- text: 上堂。学佛止言真不立。参禅多与道相违。忘机忘境急回首。无地无锥转步归。佛不是。心亦非。觌体承当绝所依。万古碧潭空界月。再三捞摝始应知
  ref: X80n1565_p0796a04（五灯会元）
- text: 上堂。良久召众曰。还知么。复曰。败缺不少
  ref: X80n1565_p0796a04（五灯会元）
- text: 示众曰。百尺竿头坐底人。虽然得入未为真。百尺竿头须进步。十方世界现全身。大慧先师道。要见长沙么。更进一步。保宁则不然。要见长沙么。更退一步。毕竟如何。换骨洗肠重整顿。通身是眼更须参。师到灵隐。请
  ref: X80n1565_p0796a04（五灯会元）
- text: 上堂。灵山正派。达者犹迷。明来暗来。谁当辨的。双收双放。孰辨端倪。直饶千圣出来。也祇结舌有分。何故。人归大国方为贵。水到潇湘始是清。复曰。适来松源和尚举竹篦话。令天童纳败缺。诸人要知么。听取一颂。黑漆竹篦握起。迅雷不及掩耳。德山临济茫然。懵底如何插觜。大慧尝举灵云悟桃华问师。师曰。灵云一见两眉横。引得渔翁良计生。白浪起时抛一钓。任教鱼鳖竞头争。师自赞曰。匙挑不上个村夫。文墨𮌎中一点无。曾把虗空揣出骨。恶声嬴得满江湖。后示寂。塔于本山
  ref: X80n1565_p0796a04（五灯会元）
