id: L::庐山归宗慧诚禅师
name: 庐山归宗慧诚
school: 法眼宗
teacher: 报恩安
status: draft
bio: 杨州人也。开堂日。于法堂前谓众曰。天人得道。以此为证。恁么便散去。已是周遮。其如未晓。即为重说。遂升座
sayings:
- text: 僧问。知郡临筵。请师演法。师曰。我不及汝
  ref: X80n1565_p0380b05（五灯会元）
- text: 问。如何是佛。师曰。如何不是
  ref: X80n1565_p0380b05（五灯会元）
- text: 问。如何是祖师西来意。师曰。不知。乃曰。问话且住。直饶问到穷劫。问也不著。答到穷劫。答也不及。何以故。祇为诸人各有本分事。圆满十方。亘古亘今。乃至诸佛也不敢错悮诸人。便谓之顶族。祇是助发上座。所以道。十方法界诸有情。念念以证善逝果。彼既丈夫我亦尔。何得自轻而退屈。诸上座。不要退屈。信取便休。祖师西来。祇道见性成佛。其余所说。不及此说。更有个奇特方便。举似诸人。良久曰。分明记取。若到诸方。不得错举。久立。珍重
  ref: X80n1565_p0380b05（五灯会元）
- text: 僧问。不通风处如何过得。师曰。汝从甚么处来。僧举南泉问邓隐峰曰。铜缾是境。缾中有水。不得动著境。与老僧将水来。峰便拈缾泻水。未审此意如何。师曰。邓隐峰甚奇怪。要且乱泻
  ref: X80n1565_p0380b05（五灯会元）
