id: 台州紫凝普闻寺智勤禅师
name: 台州紫凝普闻寺智勤
school: 法眼宗
teacher: 天台韶
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0370b14。
sayings:
- text: 僧问。如何是空手把鉏头。师曰。但恁么谛信。曰。如何是步行骑水牛。师曰。汝自何来。有偈
  ref: X80n1565_p0370b14（五灯会元）
- text: 示众曰。今年五十五。脚未蹋寸土。山河是眼睛。大海是我肚。太平兴国四年。有旨试僧经业。山门老宿。各写法名。唯师不闲书札。时通判李宪
  ref: X80n1565_p0370b14（五灯会元）
- text: 问。世尊还解书也无。师曰。天下人知。淳化初。不疾。命侍僧开浴。浴讫垂诫徒众。安坐而逝。塔于本山。三年后。门人迁塔发龛。睹师容仪俨若。髭发仍长。遂迎入新塔
  ref: X80n1565_p0370b14（五灯会元）
