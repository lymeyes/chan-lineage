bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0682b07。
sayings:
- text: 上堂。有利无利。莫离行市。镇州萝卜极贵。庐陵米价甚贱。争似大平这里。时丰道泰。商贾骈阗。白米四文一升。萝卜一文一束。不用北头买贱。西头卖贵。自然物及四生。自然利资王化。又怎生说个佛法道理。良久云。劝君不用镌顽石。路上行人口似碑
  ref: X80n1565_p0682b07（五灯会元）
