bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0290b04。
sayings:
- text: 僧问。如何是诸佛境。师曰。雨来云雾暗。晴干日月明
  ref: X80n1565_p0290b04（五灯会元）
- text: 问。如何是妙觉明心。师曰。今冬好晚稻。出自秋雨成
  ref: X80n1565_p0290b04（五灯会元）
- text: 问。如何是妙用河沙。师曰。云生碧岫。雨降青天
  ref: X80n1565_p0290b04（五灯会元）
- text: 问。如何是平常心合道。师曰。吃茶吃饭随时过。看水看山实畅情
  ref: X80n1565_p0290b04（五灯会元）
