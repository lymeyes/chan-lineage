id: L::彭州土溪智陀子言庵主
name: 彭州土溪智陀子言
school: 杨岐派
teacher: 大随静
status: draft
bio: 绵州人也。初至大随闻举石头和尚
sayings:
- text: 示众偈倏然领旨。归隐土溪悬崖绝壑间。有石若蹲异兽。师凿以为室。中发异泉无涸溢。四众讶之。居三十年化风盛播室成日作偈曰。一击石庵全。纵横得自然。清凉无暑气。涓洁有甘泉。宽廓含沙界。寂寥绝众缘。个中无限意。风月一床眠。剑门南修造者。淳厚之士也。自大随一语契投服勤不怠。归谒崇化赟禅师。坐次赟以宗门三印问之。南曰。印空印泥印水。平地寒涛竞起。假饶去就十分。也是灵龟曳尾。莫将尚书少虚居士莫将尚书字少虚。家世豫章分宁。因官西蜀谒南堂静禅师咨决心要。堂使其向一切处提撕。适如厕俄闻秽气急以手掩鼻遂有省。即呈以偈曰。从来姿韵爱风流。几笑时人向外求。万别千差无觅处。得来元在鼻尖头。南堂答曰。一法才通法法周。纵横妙用更何求。青蛇出匣魔军伏。碧眼胡僧笑点头
