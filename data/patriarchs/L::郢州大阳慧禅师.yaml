id: L::郢州大阳慧禅师
name: 郢州大阳慧
school: 法眼宗
teacher: 大阳玄
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0527a18。
sayings:
- text: 僧问。汉君七十二阵。大霸寰中。和尚临筵。不施寸刃。承谁恩力。师曰。杲日当轩际。森罗一样观。曰。恁么则金乌凝秀色。玉兔瑞云深。师曰。滴沥无私旨。通方一念玄
  ref: X80n1565_p0527a18（五灯会元）
- text: 问。如何是和尚家风。师曰。麤布直裰重重补。日用鉏头旋旋揩。曰。向上客来。如何祇待。师曰。要用便用
  ref: X80n1565_p0527a18（五灯会元）
- text: 问。如何是西来意。师曰。日出东方。月落西户。复示颂曰。朝朝日出东方。夜夜月落西户。如今大宋宫家。尽是金枝玉树
  ref: X80n1565_p0527a18（五灯会元）
