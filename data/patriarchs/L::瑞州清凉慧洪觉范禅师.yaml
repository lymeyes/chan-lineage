id: L::瑞州清凉慧洪觉范禅师
name: 瑞州清凉慧洪觉范
school: 黄龙派
teacher: 宝峰文
status: draft
bio: 郡之彭氏子。年十四。父母俱亡。乃依三峰靘禅师为童子。日记数千言。览群书殆尽。靘器之。十九。试经于东京天王寺。得度。从宣秘讲成实唯识论。逾四年。弃谒真净于归宗。净迁石门。师随至。净患其深闻之毙。每举玄沙未彻之语。发其疑。凡有所对。净曰。你又说道理耶。一日顿脱所疑。述偈曰。灵云一见不再见。红白枝枝不著华。尀耐钓鱼船上客。却来平地摝鱼𫚥。净见为助喜。命掌记。未久。去谒诸老。皆蒙赏音。由是名振丛林。显谟朱公彦请开法抚州北景德。后住清凉
sayings:
- text: 示众。举首楞严如来语阿难曰。汝应齅此炉中栴檀。此香若复然于一铢。室罗筏城四十里内同时闻气。于意云何。此香为复生栴檀木。生于汝鼻。为生于空。阿难。若复此香生于汝鼻。称鼻所生。当从鼻出。鼻非栴檀。云何鼻中有栴檀气。称汝闻香。当于鼻入。鼻中出香。说闻非义。若生于空。空性常恒。香应常在。何藉炉中𦶟此枯木。若生于木。则此香质。因𦶟成烟。若鼻得闻。合蒙烟气。其烟腾空。未及遥远。四十里内。云何已闻。是故。当知香鼻与闻。俱无处所。即齅与香。二处虗妄。本非因缘。非自然性。师曰。入此鼻观。亲证无生。又大智度论。问曰。闻者云何。闻用耳根闻邪。用耳识闻邪。用意识闻邪。若耳根闻。耳根无觉识知。故不能闻。若耳识闻。耳识一念。故不能分别。不应闻。若意识闻。意识亦不能闻。何以故。先五识识五尘。然后意识识意识。不能识现在五尘。唯识过去未来五尘。若意识能识现在五尘者。盲聋人亦应识声也。何以故。意识不破故。师曰。究此闻尘。则合本妙。既证无生。又合本妙。毕竟是何境界。良久曰。白猿已叫千岩晚。碧缕初横万字𬬻。住景德日
  ref: X80n1565_p0684a03（五灯会元）
- text: 僧问。南有景德。北有景德。德即不
  ref: X80n1565_p0684a03（五灯会元）
- text: 问。如何是景。师曰。颈在顶上。崇宁二年。会无尽居士张公于峡之善溪。张尝自谓得龙安悦禅师末后句。丛林畏与语。因夜话及之。曰。可惜云庵不知此事。师问所以。张曰。商英顷自金陵酒官移知豫章。过归宗见之。欲为点破。方叙悦末后句未卒。此老大怒。骂曰。此吐血秃丁．脱空妄语。不得信。既见其盛怒。更不欲叙之。师笑曰。相公但识龙安口传末后句。而真药现前不能辨也。张大惊。起执师手曰。老师真有此意耶。曰。疑则别参。乃取家藏云庵顶相。展拜赞之。书以授师。其词曰。云庵纲宗。能用能照。天鼓希声。不落凡调。冷面严眸。神光独耀。孰传其真。觌面为肖。前悦后洪。如融如肇。大慧处众日。尝亲依之。每叹其妙悟辩慧。建炎二年五月。示寂于同安。大尉郭公天民奏赐宝觉圆明之号
  ref: X80n1565_p0684a03（五灯会元）
