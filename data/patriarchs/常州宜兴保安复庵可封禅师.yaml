sayings:
- text: 上堂。天宽地大。风清月白。此是海宇清平底时节。衲僧家等闲问著。十个有五双知有。祇如夜半华严池吞却杨子江。开明桥撞倒平山塔。是汝诸人还知么。若也知去。试向非非想天道将一句来。其或未知。掷下拂子曰。须是山僧拂子始得
  ref: X80n1565_p0824a04（五灯会元）
