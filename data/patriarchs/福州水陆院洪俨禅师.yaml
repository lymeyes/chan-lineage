bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0287a09。
sayings:
- text: 上堂。大众集定。师下座。捧香𬬻巡行大众前。曰。供养十方诸佛。便归方丈
  ref: X80n1565_p0287a09（五灯会元）
- text: 僧问。离却百非兼四句。请师尽力与提纲。师曰。落在甚么处。曰。恁么则人天有赖去也。师曰。莫将恶水泼人好
  ref: X80n1565_p0287a09（五灯会元）
