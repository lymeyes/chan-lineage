id: 龙潭信禅师
name: 龙潭崇信
honorific: 澧州龙潭崇信禅师（天皇道悟法嗣）
school: 青原系
dynasty: 唐
region: 澧州龙潭寺（今湖南澧县）
teacher: 天皇道悟
source_ref: 五灯会元·卷七·澧州龙潭崇信 / 景德传灯录·卷十四
cbeta: T51n2076 卷十四
bio: 天皇道悟之法嗣，出家前以卖饼为业，常供饼于道悟，悟令「饼即是法」，遂悟入。后住澧州龙潭寺，传法于德山宣鉴。其「吹灯」之勘，为禅宗著名公案。
sayings:
- text: 龙潭吹灯：德山辞去，师问「外面黑」，山云「点灯笼去」。才出门，师复唤「阇梨」，山应诺，师云「灯笼灭也」——言下德山大悟。
  ref: 五灯会元·卷七·龙潭崇信 / 德山宣鉴机缘
- text: 师尝藏饼与道悟，悟每食毕留饼一枚还之，曰「惠汝以阴雨之势」；后谓「吾种饼以荫汝」而度之。
  ref: 景德传灯录·卷十四·龙潭崇信
status: draft
verify: 待 CBETA 校对龙潭崇信机缘与卖饼、吹灯公案。
