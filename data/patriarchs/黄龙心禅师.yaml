id: 黄龙心禅师
name: 晦堂祖心
honorific: 隆兴黄龙祖心禅师·晦堂（黄龙慧南法嗣，黄龙派第二代）
school: 黄龙派
dynasty: 北宋（1025—1100）
region: 隆兴黄龙寺 / 庐山（今江西）
teacher: 黄龙慧南（黄龙南禅师）
source_ref: 五灯会元·卷十二·隆兴府黄龙祖心 / 建中靖国续灯录
cbeta: X77n1524（建中靖国续灯录）相关章次
bio: 黄龙慧南之法嗣，黄龙派第二代，临济宗名匠。名祖心，号晦堂。黄龙慧南门下以祖心、宝峰克文、东林常总为「黄龙三大士」。祖心机锋峻洁而接物温厚，黄庭坚（山谷）从其问道，为士大夫参禅之典范。传法死心悟新、灵源惟清，黄龙派赖以大行，南宋后渐并入杨岐一派。
sayings:
- text: 黄庭坚问「圣人不出世，佛祖不西来时如何」，祖心云「公学佛多年，尚作这般见解」；又问「如何是祖师西来意」，祖心曰「待公一口吸尽西江水，即向汝道」。（类马祖之峻机）
  ref: 五灯会元·卷十二·黄龙祖心 / 山谷问道
- text: 师常举「有句无句，如藤倚树；树倒藤枯，句归何处」勘验学人——此话头后为大慧宗杲所承，实开看话禅之先声。
  ref: 五灯会元·卷十二·黄龙祖心
status: draft
verify: 待 CBETA 校对晦堂祖心机缘；与黄庭坚问道事须核实。
