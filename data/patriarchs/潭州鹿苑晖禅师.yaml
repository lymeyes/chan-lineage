id: 潭州鹿苑晖禅师
name: 潭州鹿苑晖
school: 青原系
teacher: 石霜诸禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0198a13。
sayings:
- text: 僧问。不假诸缘。请师道。师敲火炉曰。会么。曰。不会。师曰。瞌睡汉
  ref: X80n1565_p0198a13（五灯会元）
- text: 问。牛头未见四祖时如何。师曰。如月在水。曰。见后如何。师曰。如水在月
  ref: X80n1565_p0198a13（五灯会元）
- text: 问。祖祖相传。未审传个甚么。师曰。汝问我。我问汝。曰。恁么则缁素不分也。师曰。甚么处去来
  ref: X80n1565_p0198a13（五灯会元）
