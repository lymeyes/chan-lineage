id: 眉州昌福达禅师
name: 眉州昌福达
school: 黄龙派
teacher: 黄龙机禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0303b18。
sayings:
- text: 僧问。学人来问师则对。不问时师意如何。师曰。谢师兄指示
  ref: X80n1565_p0303b18（五灯会元）
- text: 问。如何是今日事。师曰。师兄这问大好。曰。学人不会时如何。师曰。谩得即得
  ref: X80n1565_p0303b18（五灯会元）
- text: 问。国有宝刀。谁人得见。师曰。师兄远来不易。曰。此刀作何形状。师曰。要也道。不要也道。曰。请师道。师曰。难逢难遇
  ref: X80n1565_p0303b18（五灯会元）
- text: 问。石牛水上卧时如何。师曰。异中还有异。妄计不浮沉。曰。便恁么去时如何。师曰。翅天日落。把土成金。吕岩真人吕岩真人字洞宾。京川人也。唐末三举不第。偶于长安酒肄遇钟离权。授以延命术。自尔人莫之究。尝游庐山归宗。书钟楼壁曰。一日清闲自在身。六神和合报平安。丹田有宝休寻道。对境无心莫问禅。未几。道经黄龙山。睹紫云成葢。疑有异人。乃入谒。值龙击鼓升堂。龙见。意必吕公也。欲诱而进。厉声曰。座傍有窃法者。吕毅然出
  ref: X80n1565_p0303b18（五灯会元）
- text: 问。一粒粟中藏世界。半升铛内煮山川。且道此意如何。龙指曰。这守尸鬼。吕曰。争奈囊有长生不死药。龙曰。饶经八万劫。终是落空亡。吕薄讶。飞剑胁之。剑不能入。遂再拜。求指归。龙诘曰。半升铛内煮山川即不
  ref: X80n1565_p0303b18（五灯会元）
- text: 问。如何是一粒粟中藏世界。吕于言下顿契。作偈曰。弃却瓢囊摵碎琴。如今不恋汞中金。自从一见黄龙后。始觉从前错用心。龙嘱令加护。后谒潭州智度觉禅师。有曰。余游韶郴。东下湘江。今见觉公。观其禅学精明。性源淳洁。促膝静坐。收光内照。一衲之外无余衣。一钵之外无余食。达生死岸。破烦恼壳。方今佛衣寂寂兮无传。禅理悬悬兮几绝。扶而兴者。其在吾师乎。聊作一绝奉记。达者推心方济物。圣贤传法不离真。请师开说西来意。七祖如今未有人
  ref: X80n1565_p0303b18（五灯会元）
