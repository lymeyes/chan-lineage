id: 乌巨道行禅师
name: 乌巨道行
alias: 乌巨行
school: 杨岐派
teacher: 龙门清远禅师
status: draft
bio: 处州叶氏子。依泗州普照英禅师得度。去参佛眼。一日闻举玄沙筑著脚指话遂大悟。住后
sayings:
- text: 上堂。会即便会玉本无瑕。若言不会碓嘴生花。试问九年面壁。何如大会拈花。南明恁么商确。也是顺风撒沙。参
  ref: T51n2077_p0669a05（续传灯录）
- text: 上堂。云笼岳顶百鸟无声。月隐寒潭龙珠自耀。正当恁么时直得石梁忽然大悟。石洞顿尔心休。虚空开口作证。溪北石僧点头。诸人总在这里瞌睡。笑杀陕府铁牛
  ref: T51n2077_p0669a05（续传灯录）
- text: 上堂。佛说三乘十二分顿渐偏圆。痴人面前不得说梦。祖师西来直指人心见性成佛。痴人面前不得说梦。临济三玄。云门三句。洞山五位。痴人面前不得说梦。南明恁么道。还免得遭人检责也无。所以古人道。石人机似汝也解唱巴歌。汝若似石人雪曲也应和。还有和雪曲底么。若有唤来与老僧洗脚
  ref: T51n2077_p0669a05（续传灯录）
- text: 上堂。通身是口说得一半。通身是眼用得一橛。用不到处说有余。说不到处用无尽。所以道。当用无说。当说无用。用说同时用说不同时。诸人若也拟议。西峰在尔脚底。到国清众请
  ref: T51n2077_p0669a05（续传灯录）
- text: 上堂。句亦刬意亦刬。绝毫绝牦处如山如岳。句亦到意亦到。如山如岳处绝毫绝牦。忽若拶通一线。意句俱到俱不到。俱刬俱不刬。直得三句外绝牢笼。六句外无标的。正当恁么时一句作么生道。倾盖同途不同辙。相将携手上高台
  ref: T51n2077_p0669a05（续传灯录）
- text: 上堂举赵州示众云。老僧除却二时斋粥是杂用心处。师曰。今朝六月旦。行者击鼓长老升堂。尔诸人总来这里杂用心
  ref: T51n2077_p0669a05（续传灯录）
- text: 上堂举。僧问云门。如何是惊人句。门曰响。师曰。云门答这僧话不得便休。却鼓粥饭气以当平生
  ref: T51n2077_p0669a05（续传灯录）
- text: 上堂。黄梅雨麦秋寒。恁么会太无端。时节因缘佛性义。大都须是髑髅干
  ref: T51n2077_p0669a05（续传灯录）
- text: 示众举。玑和尚问僧。禅以何为义。众下语皆不契理。僧请益玑。玑代云。以谤为义。师曰。三世诸佛是谤。西天二十八祖是谤。唐土六祖是谤。天下老和尚是谤。诸人是谤。山僧是谤。于中还有不谤者也无。谈玄说妙河沙数。争似双峰谤得亲。师示疾。门弟子教授汪公乔年至省候。师以后事委之。示以偈曰。识则识自本心。见则见自本性。识得本心本性。正是宗门大病。注曰。烂泥中有刺。莫道不疑好。黎明沐浴更服跏趺而逝。阇维五色设利烟所至处累然。齿舌不坏。塔于寺之西
  ref: T51n2077_p0669a05（续传灯录）
