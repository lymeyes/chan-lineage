id: L::泉州云台因禅师
name: 泉州云台因
school: 云门宗
teacher: 智门祚
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0592b07。
sayings:
- text: 僧问。如何是和尚家风。师曰。嗔拳不打笑面。曰。如何施设。师曰。天台则有。南岳则无
  ref: X80n1565_p0592b07（五灯会元）
- text: 问。如何是佛。师曰。月不破五。曰。意旨如何。师曰。初三十一
  ref: X80n1565_p0592b07（五灯会元）
- text: 问。如何是佛法大意。师曰。今日好晒麦。曰。意旨如何。师曰。问取磨头
  ref: X80n1565_p0592b07（五灯会元）
- text: 上堂。菩萨子。不在内。不在外。不在中间。且道落在甚么处。良久曰。南赡部洲。北郁单越
  ref: X80n1565_p0592b07（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0592b07），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
