id: L::幽州传法禅师
name: 幽州传法
school: 青原系
teacher: 青峰楚
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0218b17。
sayings:
- text: 僧问。教意祖意。是同是别。师曰。华开金线秀。古洞白云深
  ref: X80n1565_p0218b17（五灯会元）
- text: 问。别人为甚么徒弟多。师为甚么无徒弟。师曰。海岛龙多隐。茅茨凤不栖
  ref: X80n1565_p0218b17（五灯会元）
