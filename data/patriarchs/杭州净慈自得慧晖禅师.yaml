id: 杭州净慈自得慧晖禅师
name: 杭州净慈自得慧晖
school: 法眼宗
teacher: 天童觉
status: draft
bio: 会稽张氏子。幼依澄照道凝。染削进具。甫二十。扣真歇于长芦。微有所证。旋里谒宏智。智举当明中有暗。不以暗相遇。当暗中有明。不以明相睹。问之。语不契。初夜定。回往圣僧前烧香。而宏智适至。师见之。顿明前话。次日入室。智举堪嗟去日颜如玉。却叹回时𩯭似霜。诘之。师曰。其入离。其出微。自尔问答无滞。智许为室中真子。绍兴丁巳开法补陀。徙万寿及吉祥．雪窦。淳熙三年。𠡠补净慈
sayings:
- text: 上堂。朔风凛凛扫寒林。叶落归根露赤心。万派朝宗船到岸。六窗虗暎芥投针。本成现。莫他寻。性地闲闲耀古今。户外冻消春色动。四山浑作木龙吟
  ref: X80n1565_p0548a06（五灯会元）
- text: 上堂。释迦老子。穷理尽性。金口敷宣。一代时教。珠回玉转。被人唤作拭不净故纸。达磨祖师。以一乘法直指单传。面壁九年。不立文字。被人唤作壁观婆罗门。且道作么生行履。免被傍人指注去。衲帔蒙头万事休。此时山僧都不会
  ref: X80n1565_p0548a06（五灯会元）
- text: 上堂。巢知风。穴知雨。甜者甜兮苦者苦。不须计较作思量。五五从来二十五。万般施设到平常。此是丛林饱参句。诸人还委悉么。野老不知尧舜力。冬冬打鼓祭江神
  ref: X80n1565_p0548a06（五灯会元）
- text: 上堂。谷之神。枢之要。里许旁参。回途得妙。云虽动而常闲。月虽晦而弥照。宾主交参。正偏兼到。十洲春尽花凋残。珊瑚树林日杲杲
  ref: X80n1565_p0548a06（五灯会元）
- text: 僧问。如何是正中偏。师曰。昨夜三更星满天。曰。如何是偏中正。师曰。白云笼岳顶。终不露崔嵬。曰。如何是正中来。师曰。莫谓鲲鲸无羽翼。今日亲从鸟道来。曰。如何是偏中至。师曰。应无迹。用无痕。曰。如何是兼中到。师曰。石人衫子破。大地没人缝
  ref: X80n1565_p0548a06（五灯会元）
- text: 上堂。皮肤脱落绝方隅。明了身心一物无。妙入道寰深静处。玉人端驭白牛车。妙明田地。达者还稀。识情不到。唯证方知。白云儿灵灵自照。青山父卓卓常存。机分顶后光。智契劫前眼。所以道新丰路兮峻仍皾。新丰洞兮湛然沃。登者登兮不动摇。游者游兮莫忽速。亭堂虽有到人稀。林泉不长寻常木。诸禅德。向上一著尊贵难明。瑠璃殿上不称尊。翡翠帘前还合伴。正与么时。针线贯通。真宗不坠。合作么生施设。满头白发离岩谷。半夜穿云入市鄽
  ref: X80n1565_p0548a06（五灯会元）
- text: 上堂。举傅大士法身颂云。空手把锄头。步行骑水牛。人从桥上过。桥流水不流。云门大师道。诸人东来西来。南来北来。各各骑一头水牯牛来。然虽如是。千头万头。祇要识取这一头。师曰。云门寻常干𪹼𪹼地。锥札不入。到这里。也解拖泥带水。诸人祇今要见这一头么。天色稍寒。各自归堂
  ref: X80n1565_p0548a06（五灯会元）
- text: 上堂。举风幡话。师曰。风幡动处著得个眼。却是上座。风幡动处失却个眼。即是风幡。其或未然。不是风幡不是心。衲僧徒自强锥针。岩房雨过昏烟净。卧听凉风生竹林。七年秋。退归雪窦。十年仲冬二十九日中夜。沐浴而逝。窆全身于明觉塔右
  ref: X80n1565_p0548a06（五灯会元）
