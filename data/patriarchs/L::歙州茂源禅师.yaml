id: L::歙州茂源禅师
name: 歙州茂源
school: 青原系
teacher: 孝义性空
status: draft
bio: 因平田参。师欲起身。田乃把住曰。开口即失。闭口即丧。去此二途。请师速道。师以手掩耳。田放手曰。一步易。两步难。师曰。有甚么死急。田曰。若非此个。师不免诸方点检。师不对
