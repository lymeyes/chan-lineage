id: L::洪州大善慧海禅师
name: 洪州大善慧海
school: 曹洞宗
teacher: 云居膺
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0502a10。
sayings:
- text: 僧问。不坐青山顶时如何。师曰。且道是甚么人
  ref: X80n1565_p0502a10（五灯会元）
- text: 问。如何是解作客底人。师曰。不占上
  ref: X80n1565_p0502a10（五灯会元）
- text: 问。灵泉忽逢时如何。师曰。从甚么处来
  ref: X80n1565_p0502a10（五灯会元）
- text: 问。如何道即不违于师。师曰。莫惜口。曰。道后如何。师曰。道甚么
  ref: X80n1565_p0502a10（五灯会元）
- text: 问。如何道得相亲去。师曰。快道。曰。恁么则不道也。师曰。用口作甚么
  ref: X80n1565_p0502a10（五灯会元）
- text: 问。如何是西来意。师曰。三界平沉
  ref: X80n1565_p0502a10（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0502a10），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
