id: L::南康军归宗真牧正贤禅师
name: 南康军归宗真牧正贤
school: 杨岐派
teacher: 龙门远
status: draft
bio: 潼川陈氏子。世为名儒。幼从三圣海澄为苾𫇴。具满分戒。游成都。依大慈秀公习经论。凡典籍过目成诵。义亦顿晓。秀称为经藏子。出蜀谒诸尊宿。后扣佛眼。一日入室。眼举殷勤抱得旃檀树。语声未绝。师顿悟。眼曰。经藏子漏逗了也。自是与师商确渊奥。亹亹无尽。眼称善。因手书真牧二字授之。绍兴己巳。归宗虗席。郡侯以礼请。坚卧不应。宝文李公懋尝问道于师。同属官强之。乃就
sayings:
- text: 上堂。且第一句如何道。汝等若向世界未成时．父母未生时．佛未出世时．祖师未西来时道得。已是第二句。且第一句如何道。直饶你十成道得。未免左之右之。卓拄杖。下座
  ref: X80n1565_p0781a08（五灯会元）
- text: 上堂。良久召大众曰。作么生。若也拟议。贤上座谩你诸人去也。打地和尚。瞋他秘魔岩主擎个叉儿。胡说乱道。遂将一掴成虀粉。散在十方世界。还知么。举拂子曰。而今却在拂子头上。说一切智智清净无二。无二分无别无断故。还闻么。阎老子知得。乃曰。贤上座。你若相当去。不妨奇特。或不相当。总在我手里。祇向他道。阎老子你也退步。摸索鼻孔看。击禅床。下座
  ref: X80n1565_p0781a08（五灯会元）
- text: 僧问。久默斯要。已泄真机。学人上来。请师开示。师曰。耳朵在甚么处。曰。一句分明该万象。师曰。分明底事作么生。曰。台星照临。枯木回春。师曰。换却你眼睛
  ref: X80n1565_p0781a08（五灯会元）
