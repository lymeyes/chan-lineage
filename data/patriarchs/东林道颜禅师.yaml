id: 东林道颜禅师
name: 东林道颜
alias: 东林颜
school: 杨岐派
teacher: 大慧宗杲禅师
status: draft
bio: 潼川人族鲜于氏。久参圆悟微有省发。洎悟还蜀嘱。依妙喜仍以书致喜曰。颜川彩绘已毕。但欠点眼耳。他日嗣其后未可量也。喜居云门及洋屿。师皆在焉朝夕质疑方大悟。住后
sayings:
- text: 上堂。一叶落天下秋。一尘起大地收。鸟窠吹布毛。便有人悟去。今时学者为甚么却不识自己。良久曰。莫错怪人好
  ref: T51n2077_p0686b20（续传灯录）
- text: 上堂。欲识诸佛心。但向众生心行中识取。欲识常住不凋性。但向万物迁变处会取。还识得么。欲得不招无间业。莫谤如来正法轮
  ref: T51n2077_p0686b20（续传灯录）
- text: 上堂。诸人知处良遂总知。良遂知处诸人不知。作么生是良遂知处。乃曰。鸬󰭇语鹤
  ref: T51n2077_p0686b20（续传灯录）
- text: 上堂。仲冬严寒三界无安。富者快乐贫者饥寒。不识玄旨错认定盘。何也。牛头安尾上。北斗面南看
  ref: T51n2077_p0686b20（续传灯录）
- text: 上堂。一滴滴水一滴滴冻。天寒人寒风动幡动。云门扇子𨁝跳上三十三天筑著帝释鼻孔。东海鲤鱼打一棒雨似盆倾。不出诸人十二时中寻常受用
  ref: T51n2077_p0686b20（续传灯录）
- text: 上堂云。圆通门户八字打开若是从门入得不堪共语。须是入得无门之门。方可坐登堂奥。所以道。过去诸如来斯门已成就。现在诸菩萨今各入圆明。未来参学人当依如是法。从上诸圣幸有如此广大门风。不能继绍。甘自鄙弃。穿窬墙壁好不丈夫。敢问大众。无门之门作么生入良久云。非唯观世音。我亦从中证
  ref: T51n2077_p0686b20（续传灯录）
- text: 上堂元宵已过化主出门。六群比丘各从其类。此众无复枝叶纯有贞实。如是增上慢人退亦佳矣。麒麟不为瑞𬸚𬸦不为荣。麦秀两岐禾登九穗总不消得。但愿官中无事。林下栖禅水牯牛饱卧斜阳。担板汉清贫长乐。粥足饭足俯仰随时。箸笼不乱搀匙。老鼠不咬甑箄。山家活计澹泊长情。不敬功德天。谁嫌黑暗女。有智主人二俱不受。良久曰。君子爱财取之以道
  ref: T51n2077_p0686b20（续传灯录）
- text: 上堂。去年寒食后。今年寒食前。日日是好日。不是正中偏
  ref: T51n2077_p0686b20（续传灯录）
- text: 上堂。客舍久留连。家乡夕照边。檐悬三月雨。水没两湖莲。镬漏烧灯盏。柴生满灶烟。已忘南北念。入望尽平川
  ref: T51n2077_p0686b20（续传灯录）
- text: 上堂。旃檀林无杂树。郁密深沈师子住。所以旃檀丛林旃檀围绕。荆棘丛林荆棘围绕。一人为主两人为伴。成就万亿国土士农工商若夜叉若罗刹见行魔业。优哉游哉聊以卒岁
  ref: T51n2077_p0686b20（续传灯录）
- text: 僧问。香严上树话意旨如何。师曰。描不成画不就。曰李陵虽好手争奈陷番何。师曰。甚么处去来。问如何是佛。师曰。汝是元固。僧近前曰。喏喏。师曰。裩无裆袴无口。问如何是佛。师曰
  ref: T51n2077_p0686b20（续传灯录）
