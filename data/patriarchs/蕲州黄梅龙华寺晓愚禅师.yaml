id: 蕲州黄梅龙华寺晓愚禅师
name: 蕲州黄梅龙华寺晓愚
school: —
teacher: 汾阳善昭禅师
status: draft
bio: 到五祖戒和尚处。祖问曰。不落唇吻一句。作么生道。师曰。老老大大。话头也不照顾。祖便喝。师亦喝。祖拈棒。师拍手便出。祖召曰。阇黎且住。话在。师将坐具搭在肩上。更不回首
sayings:
- text: 上堂。摩腾入汉。已涉繁词。达磨西来。不守己分。山僧今日与么道。也是为他闲事长无明
