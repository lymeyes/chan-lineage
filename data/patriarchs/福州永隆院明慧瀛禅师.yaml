bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0291a12。
sayings:
- text: 上堂。谓言侵早起。更有夜行人。似则似。是即不是。珍重
  ref: X80n1565_p0291a12（五灯会元）
- text: 问。无为无事人为甚么却是金锁难。师曰。为断麤纤。贵重难留。曰。为甚么道无为无事人逍遥实快乐。师曰。为闹乱且要断送。僧参。师曰。不要得许多般数。速道。速道。僧无对
  ref: X80n1565_p0291a12（五灯会元）
- text: 上堂。日出卯。用处不须生善巧。便下座
  ref: X80n1565_p0291a12（五灯会元）
- text: 僧问。如何进向。得达本源。师曰。依而行之
  ref: X80n1565_p0291a12（五灯会元）
