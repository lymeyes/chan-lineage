id: L::洪州上蓝院守讷禅师
name: 洪州上蓝院守讷
school: 法眼宗
teacher: 清凉益
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0365b13。
sayings:
- text: 上堂。尽令提纲。无人扫地。丛林兄弟。相共证明。晚进之流。有疑请
  ref: X80n1565_p0365b13（五灯会元）
- text: 问。僧问。愿开甘露门。当观第一义。不落有无中。请师垂指示。师曰。大众证明。曰。恁么则莫相屈去也。师曰。闲言语
  ref: X80n1565_p0365b13（五灯会元）
- text: 问。如何是佛。师曰。更问阿谁
  ref: X80n1565_p0365b13（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0365b13），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
