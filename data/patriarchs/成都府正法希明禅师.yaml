id: 成都府正法希明禅师
name: 成都府正法希明
school: 黄龙派
teacher: 青原信
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0700a13。
sayings:
- text: 上堂。林叶纷纷落。乾坤报早秋。分明西祖意。何用更驰求。若恁么会得。始信佛祖之道。本自平夷。大解脱门。元无关钥。弥纶宇宙。偪塞虗空。量不可穷。智不能测。若也未明此旨。不达其源。任是百劫熏功。千生炼行。徒自疲苦。了无交涉。若深明此旨。洞达其源。乃知动静施为。经行坐卧。头头合道。念念朝宗。祖不云乎。迷生寂乱。悟无好恶。得失是非。一时放却。如是则谁迷谁悟。谁是谁非。自是诸人。独生异见。观大观小。执有执无。己灵独耀。不肯承当。心月孤圆。自生违背。何异家中舍父。衣内忘珠。致使菩提路上。荆棘成林。解脱空中。迷云蔽日。山僧今日。幸值众僧自恣。化主还山。诸上善人得得光访。不可缄默。随分葛藤。曲为今时。少开方便。也须是诸人著眼。各自谛观。若更拟议寻思。白云万里。遂拈拄杖曰。于斯明得。灵山一会。俨在目前。其或未然。更待来晨分付。祖庵主祖庵主见青原之后。缚屋衡岳间。三十余年。人无知者。偶遣兴作偈曰。小锅煮菜上蒸󰕖。菜熟󰕖香人正饥。一补饥疮了无事。明朝依样画猫儿。由是衲子披榛扣之。无尽张公力挽其开法。不从。竟终于此山
  ref: X80n1565_p0700a13（五灯会元）
