id: L::虔州处微禅师
name: 虔州处微
school: 南岳系
teacher: 西堂藏
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《景德传灯录》T51n2076_p0269a09。
sayings:
- text: 僧问。三乘十二分教体理得妙。与祖师意为同为别。师云。恁么即须向六句。外鉴不得随他声色转。僧曰。如何是六句。师曰。语底默底不语不默。总是总不是。汝合作么生。僧无对。师问仰山。汝名什么。对曰。慧寂。师曰。那个是慧那个是寂。曰只在目前。师曰。犹有前后在。寂曰。前后且置。和尚见什么。师曰。吃茶去
  ref: T51n2076_p0269a09（景德传灯录）
