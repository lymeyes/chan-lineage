id: L::西京善胜真悟禅师
name: 西京善胜真悟
school: 云门宗
teacher: 天钵元
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0635b03。
sayings:
- text: 上堂。扬声止响。不知声是响根。弄影逃形。不知形为影本。以法问法。不知法本非法。以心传心。不知心本无心。心本无心。知心如幻。了法非法。知法如梦。心法不实。莫谩追求。梦幻空花。何劳把捉。到这里。三世诸佛．一大藏教．祖师言句．天下老和尚路布葛藤尽使不著。何故。太平本是将军致。不许将军见太平
  ref: X80n1565_p0635b03（五灯会元）
