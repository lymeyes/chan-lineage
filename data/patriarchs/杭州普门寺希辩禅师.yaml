id: 杭州普门寺希辩禅师
name: 杭州普门寺希辩
school: 法眼宗
teacher: 天台韶
status: draft
bio: 苏州人也。忠懿王命主越州清泰。署慧智。后迁上寺
sayings:
- text: 上堂。山僧素乏知见。复寡闻持。顷虽侍立于国师。不蒙一句开示。以致今日与诸仁者聚会。更无一法可相助发。何况能为诸仁者区别缁素。商量古今。还怪得山僧么。若有怪者。且道此人具眼不具眼。有宾主义。无宾主义。晚学初机。必须审细
  ref: X80n1565_p0371a08（五灯会元）
- text: 僧问。如何是普门示现神通事。师曰。恁么则阇黎怪老僧去也。曰。不怪时如何。师曰。汝且下堂里思惟去。太平兴国三年。吴越王入觐。师随宝塔至。见于滋福殿。赐紫衣。号慧明禅师。端拱中乞还故里。诏从之。赐御制诗。忠懿王施金于常熟本山院。创砖浮图七级。高二百尺。功既就。至道三年八月示寂。塔于院之西北隅
  ref: X80n1565_p0371a08（五灯会元）
