id: 汉州三圣继昌禅师
name: 汉州三圣继昌
school: 黄龙派
teacher: 黄龙心
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0670b04。
sayings:
- text: 上堂。木佛不度火。甘露台前逢达磨。惆怅洛阳人未来。面壁九年空冷坐。金佛不度炉。坐叹劳生走道途。不向华山图上看。岂知潘阆倒骑驴。泥佛不度水。一道灵光照天地。堪羡玄沙老古锥。不要南山要鳖鼻
  ref: X80n1565_p0670b04（五灯会元）
- text: 上堂。举赵州访二庵主。师曰。五陵公子争夸富。百衲高僧不厌贫。近来世俗多颠倒。祇重衣衫不重人
  ref: X80n1565_p0670b04（五灯会元）
