bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0625b01。
sayings:
- text: 上堂。善慧遗风五百年。云黄山色祇依然。而今祖令重行也。一句流通遍大千。大众且道。是甚么句。莫是函葢乾坤．截断众流．随波逐浪底么。吽。有甚交涉。自从有佛祖已来。未曾动著。今日不可漏泄真机去也。顾视大众曰。若到诸方。不得错举
  ref: X80n1565_p0625b01（五灯会元）
