id: 吉州禾山用安禅师
name: 吉州禾山用安
school: 云门宗
teacher: 金山善宁禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0640a10。
sayings:
- text: 僧问。莲华未出水时如何。师曰。鱼挨鳖倚。曰。出水后如何。师曰。水仙头上戴。好手绝跻攀。曰。出与未出时如何。师曰。应是乾坤措。不教容易看
  ref: X80n1565_p0640a10（五灯会元）
