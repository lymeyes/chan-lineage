id: 杭州慧日永明延寿智觉禅师
name: 永明延寿
honorific: 杭州慧日永明延寿智觉禅师（法眼宗，吴越国师）
school: 法眼宗
dynasty: 五代北宋（904—975）
region: 杭州慧日永明寺（今净慈寺）
teacher: 天台德韶国师
source_ref: 五灯会元·卷十·杭州永明延寿 / 宗镜录
cbeta: T48n2016（宗镜录）一百卷
bio: 天台德韶之法嗣，法眼宗第三代，住杭州永明寺，吴越王钱俶尊为国师。博览经论，融贯禅教律净，著《宗镜录》一百卷，以「一心为宗、照万法如镜」统摄群经；又著《万善同归集》，力倡「禅净双修」「万善同归」。其「四料简」开净土指归之先，对后世净土信仰与禅净合流影响深远。
sayings:
- text: 《宗镜录》纲宗：「举一心为宗，照万法如镜；如举镜以鉴容，对骋而现像。」
  ref: 宗镜录·卷一
- text: 四料简（净土指归）：「有禅有净土，犹如戴角虎；现世为人师，来生作佛祖。无禅有净土，万修万人去……」（禅净双修之纲）
  ref: 五灯会元·卷十·永明延寿 / 净土指归集所引
status: draft
