id: 福州芙蓉山灵训禅师
name: 福州芙蓉山灵训
school: 南岳系
teacher: 归宗常
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0141a18。
sayings:
- text: 问。如何是佛。宗曰。我向汝道。汝还信否。曰。和尚诚言。安敢不信。宗曰。即汝便是。师曰。如何保任。宗曰。一翳在眼。空华乱坠法眼云。若无后语。有甚么归宗也。师辞。宗
  ref: X80n1565_p0141a18（五灯会元）
- text: 问。甚么处去。师曰。归岭中去。宗曰。子在此多年。装束了却来。为子说一上佛法。师结束了上去。宗曰。近前来。师乃近前。宗曰。时寒。途中善为。师聆此言。顿忘前解。归寂。谥弘照大师
  ref: X80n1565_p0141a18（五灯会元）
