bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0453b09。
sayings:
- text: 僧问。如何是悬崖撒手底句。师曰。明月照幽谷。曰。如何是绝后再苏底句。师曰。白云生太虗。曰。恁么则樵夫出林丘。处处歌春色。师曰。是人道得
  ref: X80n1565_p0453b09（五灯会元）
- text: 上堂。了见不见。见了未了。路上行人。林间宿鸟。月里塔高十二层。天外星缠五百杪。要会么。手执夜明符。几个知天晓。参
  ref: X80n1565_p0453b09（五灯会元）
