id: L::潭州法轮应端禅师
name: 潭州法轮应端
school: 黄龙派
teacher: 黄龙清
status: draft
bio: 南昌徐氏子。少依化度善月。圆颅登具。谒真净文禅师。机不谐。至云居。会灵源分座。为众激昂。师扣其旨。然以妙入诸经自负。源尝痛札之。师乃援马祖百丈机语。及华严宗旨为表。源笑曰。马祖百丈固错矣。而华严宗旨与个事喜没交涉。师愤然欲他往。因请辞。及揭帘。忽大悟。汗流浃背。源见乃曰。是子识好恶矣。马祖．百丈．文殊．普贤几被汝带累。由此誉望四驰。名士夫争挽应世。皆不就。政和末。太师张公司成以百丈坚命开法。师不得已。始从
sayings:
- text: 上堂。举大隋劫火洞然话。遂曰。六合倾翻劈面来。暂披麻缕混尘埃。因风吹火浑闲事。引得游人不肯回。坏不坏。随不随。徒将闻见强针锥。太湖三万六千顷。月在波心说向谁
  ref: X80n1565_p0696b07（五灯会元）
- text: 僧问。如何是宾中宾。师曰。芒鞋竹杖走红尘。曰。如何是宾中主。师曰。十字街头逢上祖。曰。如何是主中宾。师曰。御马金鞭混四民。曰。如何是主中主。师曰。金门谁敢擡眸󳬇。曰。宾主已蒙师指示。向上宗乘又若何。师曰。昨夜霜风刮地寒。老猿岭上啼残月
  ref: X80n1565_p0696b07（五灯会元）
