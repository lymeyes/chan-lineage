id: 明州雪窦常通禅师
name: 明州雪窦常通
school: 南岳系
teacher: 长沙岑
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0157a08。
sayings:
- text: 问。何处人。师曰。邢州人。沙曰。我道汝不从彼来。师曰。和尚还曾住此否。沙然之。乃容入室。住后
  ref: X80n1565_p0157a08（五灯会元）
- text: 僧问。如何是密室。师曰。不通风信。曰。如何是密室中人。师曰。诸圣求睹不见。僧作礼。师曰。千圣不能思。万圣不能议。乾坤坏不坏。虗空包不包。一切无比伦。三世唱不起
  ref: X80n1565_p0157a08（五灯会元）
- text: 问。如何是三世诸佛出身处。师曰。伊不肯知有汝三世。僧良久。师曰。荐否。不然者且向著佛不得处体取。时中常在。识尽功亡。瞥然而起。即是伤他。而况言句乎。天祐二年七月示寂。塔于寺西南隅
  ref: X80n1565_p0157a08（五灯会元）
