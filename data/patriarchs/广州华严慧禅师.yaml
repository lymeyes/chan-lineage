bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0571a03。
sayings:
- text: 僧问。承古有言。妄心无处即菩提。正当妄时。还有菩提也无。师曰。来音已照。曰。不会。师曰。妄心无处即菩提
  ref: X80n1565_p0571a03（五灯会元）
