id: 广州罗山崇禅师
name: 广州罗山崇
school: 云门宗
teacher: 云门文偃禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0570b03。
sayings:
- text: 僧问。如何是大汉国境。师曰。玉狗吠时天未晓。金鸡啼处五更初
  ref: X80n1565_p0570b03（五灯会元）
- text: 问。丹霞访居士。女子不𢹂篮时如何。师曰。也要到这里一转
  ref: X80n1565_p0570b03（五灯会元）
- text: 问。如何是罗山境。师曰。布水千寻
  ref: X80n1565_p0570b03（五灯会元）
