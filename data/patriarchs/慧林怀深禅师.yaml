id: 慧林怀深禅师
name: 慧林怀深
alias: 慧林深
school: —
teacher: 长芦崇信禅师
status: draft
bio: 寿春六安人，族夏氏。生而祥光现舍。文殊行坚禅师遥见，疑火也，诘且知师始生。坚叹曰：非凡儿！往访之。师见坚辄笑。母张氏，许出家。十四割爱冠祝发。后四年，访道方外。崇宁初，往嘉禾，依净照于资圣。照举良遂见麻谷因缘，问曰：如何是良遂知处？师即洞明。照徙长芦，命首众。政和初，仪真守吏部季公釜以城南资福邀师，屦满户外。蒋山佛鉴懃禅师渡江行化，见之。茶退，师引巡寮，至千人街坊。鉴
sayings:
- text: 问：既是千人街坊，为甚么只有一人？师曰：多虗不如少实。鉴曰：恁么那？师𧹞然。偶　朝廷以资福为神霄宫，因弃往蒋山，留西庵，陈请益。鉴曰：资福知是般事便休。曰：某实未稳，望和尚不外。鉴举倩女离魂话，反复穷之，大豁疑碍。呈偈曰：只是旧时行李处，等闲举著便殽讹。夜来一阵狂风起，吹落桃华知几多？鉴拊几曰：这底岂不是活祖师意？未几，被　旨居焦山。阅四稔，　诏住慧林。靖康改元，匃归，不听。秋，再辞，乃　允。径之天台石桥，寻徙灵岩。久之，　𠡠补蒋山。未数月，退居洞庭之包山。复应王氏请，为圆觉第一祖
  ref: X79n1559_p0146a07（嘉泰普灯录）
- text: 上堂曰：不是境，亦非心，唤作佛时也陆沉。个中本自无堦级，切忌无堦级处寻。总不寻，过犹深，打破云门饭袋子，方知赤土是黄金
  ref: X79n1559_p0146a07（嘉泰普灯录）
- text: 上堂：古者道：忍！忍！三世如来从此尽。饶！饶！万祸千殃从此消。默！默！无上菩提从此得。师曰：会得此三种语了，好个不快活汉！山僧只是得人一牛，还人一马，泼水相唾，插觜厮骂。卓拄杖曰：平出！平出！
  ref: X79n1559_p0146a07（嘉泰普灯录）
- text: 上堂：云自何山起？风从甚㵎生？好个入头处，官路少人行
  ref: X79n1559_p0146a07（嘉泰普灯录）
- text: 上堂：昔有人获一块铁，铸作一座方响，人闻之便生逸乐之情，谓之乐器。后将方响打作一口磬，人闻之便生善。此后因人从军，却将磬铸成一口剑，人见之便生惊怖。更后时，又将剑铸成一尊佛，人见之便生归向。诸仁者！大都只是一块铁，因甚么起得许多惊喜善恶之念？试思之
  ref: X79n1559_p0146a07（嘉泰普灯录）
- text: 僧问：甚么人不被无常吞？曰：只恐他无下口处。云：恁么则一念通玄箭，三尸鬼失姧也。曰：汝有一念，定被他吞了。云：无一念时如何？曰：捉著阇梨
  ref: X79n1559_p0146a07（嘉泰普灯录）
- text: 问：知有道不得时如何？曰：哑子吃蜜。云：道得不知有时如何？曰：鹦鹉唤人。僧礼拜，师叱曰：这传语汉！
  ref: X79n1559_p0146a07（嘉泰普灯录）
- text: 问：如何是佛？曰：面黄不是真金贴。云：如何是佛向上事？曰：一箭一莲华。僧作礼，师弹指三下。绍兴二年四月望，为众小参，
  ref: X79n1559_p0146a07（嘉泰普灯录）
- text: 僧问末后句，师良久曰：后五日看。至二十日，果示微疾，竟尔告终，寿五十六，腊三十六。火浴戒体，光分五色，获设利者无数。竹石草木，烟所及处，累累如缀珠。穴土为坑，随镢亦有之。分灵骨塔于包山之显庆、思溪之圆觉
  ref: X79n1559_p0146a07（嘉泰普灯录）
