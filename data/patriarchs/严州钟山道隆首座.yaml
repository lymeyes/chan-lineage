bio: 桐庐董氏子，于钟山寺得度。自游方所至，耆衲皆推重。晚抵黄龙，死心延为座元。心顺世，遂归隐钟山。慕陈尊宿高世之风，掩关不事事。日鬻数籰自适，人无识者。手常穿一袜，凡有禅者至，提以示之曰：老僧这袜著三十年了也。有寺僧戏问云：如何是无诤三昧？师便掌
