id: 邓州香严下堂义端禅师
name: 邓州香严下堂义端
school: 南岳系
teacher: 南泉愿
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0139a04。
sayings:
- text: 上堂。兄弟。彼此未了。有甚么事相共商量。我三五日即发去也。如今学者。须了却今时。莫爱他向上人无事。兄弟。纵学得种种差别义路。终不代得自己见解。毕竟著力始得。空记持他巧妙章句。即转加烦乱去。汝若欲相应。但恭恭地尽。莫停留纤毫。直似虗空。方有少分。以虗空无锁闭。无壁落。无形段。无心眼。时有
  ref: X80n1565_p0139a04（五灯会元）
- text: 僧问。古人相见时如何。师曰。老僧不曾见古人。曰。今时血脉不断处。如何仰羡。师曰。有甚么仰羡处
  ref: X80n1565_p0139a04（五灯会元）
- text: 问。某甲不问闲事。请和尚答话。师曰。更从我觅甚么。曰。不为闲事。师曰。汝教我道。乃曰。兄弟。佛是尘。法是尘。终日驰求。有甚么休歇。但时中不用挂情。情不挂物。无善可取。无恶可弃。莫教他笼󰋪著。始是学处也
  ref: X80n1565_p0139a04（五灯会元）
- text: 问。某甲曾辞一老宿。宿曰。去则亲良朋。附善友。某今辞和尚。未审有何指示。师曰。礼拜著。僧礼拜。师曰。礼拜一任礼拜。不得认奴作郎
  ref: X80n1565_p0139a04（五灯会元）
- text: 上堂。僧问。如何是直截根源。师乃掷下拄杖。便归方丈
  ref: X80n1565_p0139a04（五灯会元）
- text: 上堂。语是谤。寂是诳。语寂向上有路在。老僧口门窄。不能与汝说得。便下座
  ref: X80n1565_p0139a04（五灯会元）
- text: 上堂。问。正因为甚么无事。师曰。我不曾停留。乃曰。假饶重重剥得。净尽无停留。权时施设。亦是方便接人。若是那边事。无有是处
  ref: X80n1565_p0139a04（五灯会元）
