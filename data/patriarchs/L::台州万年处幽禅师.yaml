id: L::台州万年处幽禅师
name: 台州万年处幽
school: —
teacher: 瑞岩居
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0641b10。
sayings:
- text: 上堂。先圣行不到处。凡流恰到。凡流既到。先圣莫知。到与不到。知与不知。总置一壁。祇如
  ref: X80n1565_p0641b10（五灯会元）
- text: 僧问干峰。十方薄伽梵。一路涅槃门。未审路头在甚么处。峰以拄杖画一画曰。在这里。且道此老与他先圣凡流。相去几何。南山虎𫜪石羊儿。须向其中识生死
  ref: X80n1565_p0641b10（五灯会元）
