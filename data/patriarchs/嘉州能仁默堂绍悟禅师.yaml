id: 嘉州能仁默堂绍悟禅师
name: 嘉州能仁默堂绍悟
school: 杨岐派
teacher: 大随静
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0787b10。
sayings:
- text: 上堂。最初一步。十方世界现全身。末后一言。一微尘中深锁断。有时提起。如倚天长剑。光耀乾坤。有时放下。似红炉点雪。虗含万象。得到恁么田地。天魔外道。拱手归降。三世诸佛。一时稽首。便可以大圆觉为我伽蓝。于一毫端现宝王刹。如是则朝往西天。暮归东土。亦是禁足。百华丛里坐。淫坊酒肆行。亦是禁足。虽然如是。不曾动著这里一步。恁么则九旬无虗弃之功。百劫有今时之用。堪报不报之恩。以助无为之化。此即是涅槃妙心。金刚王宝剑。敢问大众。作么生得到这田地去。如人上山。各自努力
  ref: X80n1565_p0787b10（五灯会元）
- text: 上堂。举赵州访二庵主公案。颂曰。一重山尽一重山。坐断孤峰子细看。雾卷云收山岳静。楚天空阔一轮寒。彭州土溪智陀子言庵主彭州土溪智陀子言庵主绵州人也。初至大随。闻举石头和尚
  ref: X80n1565_p0787b10（五灯会元）
- text: 示众偈。倏然领旨。归隐土溪。悬崖绝壑间有石若蹲异兽。师凿以为室。中发异泉。无涸溢。四众讶之。居三十年。化风盛播。室成日。作偈曰。一击石庵全。纵横得自然。清凉无暑气。涓洁有甘泉。宽廓含沙界。寂寥绝众缘。个中无限意。风月一床眠。剑门南修道剑门南修道者淳厚之士也。自大随一语契投。服勤不怠。归谒崇化赟禅师。坐次。赟以宗门三印问之。南曰。印空印泥印水。平地寒涛竞起。假饶去就十分。也是灵龟曳尾。莫将尚书莫将尚书字少虗。家世豫章分宁。因官西蜀。谒南堂静禅师咨决心要。堂使其向好处提撕。适如厕。俄闻秽气。急以手掩鼻。遂有省。即呈以偈曰。从来姿韵爱风流。几笑时人向外求。万别千差无觅处。得来元在鼻尖头。南堂答曰。一法才通法法周。纵横妙用更何求。青虵出匣魔军伏。碧眼胡僧笑点头
  ref: X80n1565_p0787b10（五灯会元）
