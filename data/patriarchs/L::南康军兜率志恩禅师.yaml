sayings:
- text: 上堂。落落魄魄。居村居郭。莽莽卤卤。何今何古。不重己灵。休话佛祖。搊定释迦鼻孔。揭却观音耳朵。任他雪岭辊球。休管禾山打鼓。若是本色衲僧。终不守株待兔。参
