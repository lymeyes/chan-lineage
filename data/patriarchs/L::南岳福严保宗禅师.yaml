id: L::南岳福严保宗禅师
name: 南岳福严保宗
school: —
teacher: 石霜永
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0451b15。
sayings:
- text: 上堂。世尊周行七步。举足全乖。目顾四方。触途成滞。金襕授去。殃及儿孙。玉偈传来。挂人唇吻。风幡悟性。未离色尘。钵水投针。全成管见。祖师九年面壁。不见纤毫。卢公六代传衣。图他小利。江西一喝。不解慎初。德峤全施。未知护末。南山鳖鼻。谩指踪由。北院枯松。徒彰风彩。云门顾鉴。落二落三。临济全提。错七错八。若说君臣五位。直如纸马过江。更推宾主交参。恰似泥人澡洗。独超象外。且非捉兔走鹰。混迹尘中。未是𫜪猪之狗。何异趒坑堕壍。正是避溺投罝。如斯之解。正在常途。出格道人。如何话会。岂不见陶潜俗子尚自睹事见机。而今祖室子孙。不可皮下无血。喝一喝
  ref: X80n1565_p0451b15（五灯会元）
