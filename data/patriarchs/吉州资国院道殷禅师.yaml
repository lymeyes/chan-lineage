id: 吉州资国院道殷禅师
name: 吉州资国院道殷
school: —
teacher: 长庆棱
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0289a09。
sayings:
- text: 僧问。如何是祖师西来意。师曰。普通八年遭梁怪。直至如今不得雪
  ref: X80n1565_p0289a09（五灯会元）
- text: 问。千山万山。如何是龙须山。师曰。千山万山。曰。如何是山中人。师曰。对面千里
  ref: X80n1565_p0289a09（五灯会元）
- text: 问。不落有无。请师道。师曰。汝作么生
  ref: X80n1565_p0289a09（五灯会元）
