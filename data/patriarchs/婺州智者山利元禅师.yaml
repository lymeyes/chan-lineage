bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0614a03。
sayings:
- text: 上堂。拈拄杖曰。大用现前。不存轨则。东方一指。乾坤肃静。西方一指。瓦解冰消。南方一指。南斗作窜。北方一指。北斗潜藏。上方一指。筑著帝释鼻孔。下方一指。穿过金刚水际。诸人面前一指。成得甚么边事。良久。卓一下曰。路上指奔鹿。门前打犬儿
  ref: X80n1565_p0614a03（五灯会元）
