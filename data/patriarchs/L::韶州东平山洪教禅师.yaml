bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0583b13。
sayings:
- text: 僧问。如何是向上关。师竖起拂子。僧曰。学人未晓。乞师再指。师曰。非公境界。曰。和尚岂无方便。师曰。再犯不容
  ref: X80n1565_p0583b13（五灯会元）
