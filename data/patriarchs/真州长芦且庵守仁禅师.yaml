id: 真州长芦且庵守仁禅师
name: 真州长芦且庵守仁
school: 杨岐派
teacher: 乌巨行
status: draft
bio: 越之上虞人。依雪堂于乌巨。闻普说曰。今之兄弟做工夫。正如习射。先安其足。后习其法。后虽无心。以久习故。箭发皆中。喝一喝云。只今箭发也。看。看。师不觉倒身作避箭势。忽大悟
sayings:
- text: 上堂。百千三昧。无量妙门。今日且庵不惜穷性命。祇做一句子说与诸人。乃卓拄杖。下座。尝颂台山婆话云。开个灯心皂角铺。日求升合度朝昏。只因风雨连绵久。本利一空愁倚门
  ref: X80n1565_p0820b05（五灯会元）
