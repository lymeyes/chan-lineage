id: L::兖州降魔藏禅师
name: 兖州降魔藏
school: —
teacher: 北宗秀
status: draft
bio: 赵郡人也。姓王氏。父为豪掾。师七岁出家。时属野多妖鬼魅惑于人。师孤形制伏曾无少畏。故得降魔名焉。即依广福院明赞禅师。出家服勤。受法后遇北宗盛化便誓抠衣。秀师问曰。汝名降魔。此无山精木怪。汝翻作魔耶。师曰。有佛有魔。秀曰。汝若是魔必住不思议境界。师曰。是佛亦空何境界之有。秀悬记之曰。汝与少皡之墟有缘。师寻入泰山。数稔学者云集。一日告门人曰。吾今老朽物极有归。言讫而逝寿九十一
