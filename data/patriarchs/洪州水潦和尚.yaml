id: 洪州水潦和尚
name: 洪州水潦
school: 南岳系
teacher: 马祖一
status: draft
bio: 初参马祖。问曰。如何是西来的的意。祖曰。礼拜著。师才礼拜。祖乃当𮌎蹋倒。师大悟。起来拊掌呵呵大笑曰。也大奇。也大奇。百千三昧无量妙义。祇向一毫头上。识得根源去。礼谢而退。住后。每告众曰。自从一吃马祖蹋。直至如今笑不休。有僧作一圆相。以手撮向师身上。师乃三拨。亦作一圆相。却指其僧。僧便礼拜。师打曰。这虗头汉
sayings:
- text: 问。如何是沙门行。师曰。动则影现。觉则冰生
  ref: X80n1565_p0118b14（五灯会元）
- text: 问。如何是佛法大意。师乃拊掌呵呵大笑。凡接机。大约如此
  ref: X80n1565_p0118b14（五灯会元）
