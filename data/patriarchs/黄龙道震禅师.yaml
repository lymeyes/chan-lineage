id: 黄龙道震禅师
name: 黄龙道震
alias: 黄龙震
school: 黄龙派
teacher: 泐潭善清禅师
status: draft
bio: 金陵赵氏子。少依觉印英禅师为童子。英移居泗之普照。适淑妃择度童行。师得圆具久之辞。谒丹霞淳禅师。一日与论洞上宗旨。师呈偈曰。白云深覆古寒岩。异草灵花彩凤衔。夜半天明日当午。骑牛背面著靴衫。淳器之。师自以为碍。弃依草堂一见契合。日取藏经读之。一夕闻晚参鼓。步出经堂。举头见月。遂大悟。亟趋方丈。堂望见即为印可。初住曹山。次迁广寿黄龙
sayings:
- text: 上堂曰。举个古人因缘问阇梨。阇梨不得作古会。若作古会失却当面眼。举个即今因缘问阇梨。阇梨不得作今会。若作今会障却阇梨本来眼。假饶不失不障非古非今。犹是药病相治止啼之说。只如透脱一句阇梨还道得也无。若道不得。直待罗汉峰深谈实相即向汝道
  ref: T51n2077_p0625c28（续传灯录）
- text: 上堂。少林冷坐门人各说异端大似众盲摸象。神光礼三拜依位而立。达磨云。汝得吾髓。这黑面婆罗门。脚跟也未点地在
  ref: T51n2077_p0625c28（续传灯录）
- text: 上堂。石人问枯桩。何时汝发华。枯桩怒石人。何得口吧吧。石人呵呵笑。枯桩吐异葩。红霞辉玉象。白玉碾金沙。借问通玄士。何人不到家
  ref: T51n2077_p0625c28（续传灯录）
