id: L::潭州道吾悟真禅师
name: 潭州道吾悟真
school: —
teacher: 石霜圆
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0443a10。
sayings:
- text: 上堂。古今日月。依旧山河。若明得去。十方薄伽梵。一路涅槃门。若明不得。谤斯经故。获罪如是
  ref: X80n1565_p0443a10（五灯会元）
- text: 上堂。师子儿哮吼。龙马驹𨁝跳。古佛镜中明。三山孤月皎。遂作舞。下座
  ref: X80n1565_p0443a10（五灯会元）
- text: 上堂。举。洞山道。五台山上云蒸饭。佛殿堦前狗尿天。刹竿头上煎甚子。三个猢狲夜簸钱。老僧即不然。三面狸奴脚踏月。两头白牯手拏烟。戴冠碧兔立庭柏。脱壳乌龟飞上天。老僧葛藤尽被汝诸人󳬇破了也。洞山老人。甚是奇特。虽然如是。祇行得三步四步。且不过七跳八跳。且道誵讹在甚么处。老僧今日不惜眉毛。一时布施。良久曰。叮咛损君德。无言真有功。任从沧海变。终不为君通
  ref: X80n1565_p0443a10（五灯会元）
- text: 问。凝然便会时如何。师曰。老鼠尾上带研槌
  ref: X80n1565_p0443a10（五灯会元）
- text: 问。如何是真如体。师曰。夜叉屈膝眼睛黑。曰。如何是真如用。师曰。金刚杵打铁山摧
  ref: X80n1565_p0443a10（五灯会元）
- text: 问。如何是常照。师曰。针锋上须弥。曰。如何是寂照。师曰。眉毛里海水。曰。如何是本来照。师曰。草鞋里𨁝跳。僧退。师曰。寂照常照本来照。草鞋底下常𨁝跳。更会针锋上须弥。眉毛中水常渺渺
  ref: X80n1565_p0443a10（五灯会元）
- text: 问。如何是佛。师曰。洞庭无葢
  ref: X80n1565_p0443a10（五灯会元）
- text: 上堂。山前麦熟。庐陵米价。镇州萝卜。更有一般。良久曰。时挑野菜和根煮。旋斫生柴带叶烧
  ref: X80n1565_p0443a10（五灯会元）
- text: 上堂。古人道。认著依前还不是。实难会。土宿颔下髭须多。波斯眼深鼻孔大。甚奇怪。歘然透过新罗界。问僧。甚处来。曰。堂中来。师曰。圣僧道甚么。僧近前不审。师曰。东家作驴。西家作马。曰。过在甚么处。师曰。万里崖州。师不安
  ref: X80n1565_p0443a10（五灯会元）
- text: 僧问。和尚近日尊位如何。师曰。粥饭头不了事。僧无语。师鸣指一下
  ref: X80n1565_p0443a10（五灯会元）
- text: 上堂。普化明打暗打。布袋横撒竖撒。石室行者踏碓。因甚忘却下脚
  ref: X80n1565_p0443a10（五灯会元）
- text: 问。如何是第一玄。师曰。释尊光射阿难肩。曰。如何是第二玄。师曰。孤轮众象攒。曰。如何是第三玄。师曰。泣向枯桑泪涟涟。曰。如何是第一要。师曰。最好精麤照。曰。如何是第二要。师曰。闪电乾坤光晃耀。曰。如何是第三要。师曰。路夹青松老
  ref: X80n1565_p0443a10（五灯会元）
- text: 上堂。举。僧问首山。如何是佛。山曰。新妇骑驴阿家牵。师曰。手提巴鼻脚踏尾。仰面看天听流水。天明送出路傍边。夜静还归茅屋里
  ref: X80n1565_p0443a10（五灯会元）
