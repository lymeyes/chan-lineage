sayings:
- text: 僧问。不假言诠。请师示诲。师曰。大众总见汝恁么
  ref: X80n1565_p0455b10（五灯会元）
- text: 问。曰。莫祇这便是也无。师曰。罕逢穿耳客
  ref: X80n1565_p0455b10（五灯会元）
