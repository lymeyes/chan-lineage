id: L::明州蓬莱卿禅师
name: 明州蓬莱卿
school: 杨岐派
teacher: 太平懃
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0773b09。
sayings:
- text: 上堂。有句无句。如藤倚树。且任诸方点头。及乎树倒藤枯。上无冲天之计。下无入地之谋。灵利汉这里著得一只眼。便见七纵八横。举拂子曰。看。看。一曲两曲无人会。雨过夜塘秋水深
  ref: X80n1565_p0773b09（五灯会元）
- text: 上堂。杜䳌声里春光暮。满地落华留不住。瑠璃殿上绝行踪。谁人解插无根树。举拄杖曰。这个是无根底。且道解开华也无。良久曰。祇因连夜雨。又过一年春
  ref: X80n1565_p0773b09（五灯会元）
- text: 上堂。举法眼道。识得凳子。周匝有余。云门道。识得凳子。天地悬殊。师曰。此二老人。一人向高高山顶立。一人向深深海底行。然虽如是。一不是。二不成。落华流水里啼莺。闲亭雨歇夜将半。片月还从海底生
  ref: X80n1565_p0773b09（五灯会元）
