bio: 潭州龙兴裕禅师，法眼宗延寿轮禅师法嗣（据谱系树）。《景德传灯录》卷二十四载其机缘语一段，含「学人自己」与「和尚家风」两问。
sayings:
- text: 僧问：「是何是学人自己？」师曰：「张三李四。」曰：「比来问自己，为什么道张三李四？」师曰：「汝且莫草草。」问：「诸余即不问，如何是和尚家风？」师曰：「家风即且置，阿那个是汝不问底诸余？」
  ref: 景德传灯录·卷二十四（T51n2076_p0403b28-c03）
verify: 已对校 CBETA XML P5：《景德传灯录》卷二十四 T51n2076_p0403b28-c03 逐字命中。末句原文作「阿那箇是汝不問底諸餘」，旧录作「阿那个是汝自己」；「諸餘」承上句「諸餘即不問」而来，文意相衔，旧录显然误改，已据原文更正。
