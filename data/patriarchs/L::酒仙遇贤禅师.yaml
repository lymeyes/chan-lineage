id: L::酒仙遇贤禅师
name: 酒仙遇贤
school: —
teacher: 龙华球
status: draft
bio: 姑苏长洲林氏子。母梦吞大珠而孕。生多异祥。貌伟怪。口容双拳。七岁尝沈大渊。而衣不润。遂去家。师嘉禾永安可依。三十剃染圆具。往参龙华。发明心印。回居明觉院。唯事饮酒。醉则成歌颂．警道俗。因号酒仙。偈曰。绿水红桃华。前街后巷走百余遭。张三也识我。李四也识我。识我不识我。两个拳头那个大。两个之中一个大。曾把虗空一𭣟破。摩挲令教却恁么。拈取须弥枕头卧。杨子江头浪最深。行人到此尽沈吟。他时若到无波处。还似有波时用心。金斝又闻泛。玉山还报颓。莫教更漏促。趁取月明回。贵买朱砂画月。算来枉用工夫。醉卧绿杨阴下。起来强说真如。泥人再三叮嘱。莫教失却衣珠。一六二六。其事已足。一九二九。我要吃酒。长伸两脚眠一𮄔。起来天地还依旧。门前绿树无啼鸟。庭下苍苔有落花。聊与东风论个事。十分春色属谁家。秋至山寒水冷。春来柳绿花红。一点动随万变。江村烟雨蒙蒙。有不有。空不空。笊篱捞取西北风。生在阎浮世界。人情几多爱恶。祇要吃些酒子。所以倒街卧路。死后却产娑婆。不愿超生净土。何以故。西方净土且无酒酤。师于祥符二年上元凌晨。浴罢就室。合拳右举。左张其口而化
