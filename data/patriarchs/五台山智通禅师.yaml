id: 五台山智通禅师
name: 五台山智通
school: 南岳系
teacher: 归宗常
status: draft
bio: 自称大禅佛初在归宗会下。忽一夜连叫曰。我大悟也。众骇之。明日
sayings:
- text: 上堂众集。宗曰。昨夜大悟底僧出来。师出曰。某甲。宗曰。汝见甚么道理。便言大悟。试说看。师曰。师姑元是女人作。宗异之。师便辞去。宗门送。与提笠子。师接得笠子。戴头上便行。更不回顾。后居台山法华寺。临终有偈曰。举手攀南斗。回身倚北辰。出头天外看。谁是我般人
  ref: X80n1565_p0141b14（五灯会元）
