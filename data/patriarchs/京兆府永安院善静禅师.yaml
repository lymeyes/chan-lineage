id: 京兆府永安院善静禅师
name: 京兆府永安院善静
school: 青原系
teacher: 洛浦安
status: draft
bio: 郡之王氏子。母梦金像。觉而有娠。师幼习儒学。博通群言。年二十七。忽厌浮幻。潜诣终南山礼广度禅师披削。唐天复中。南谒洛浦。浦器之。容其入室。乃典园务。力营众事。一日。有僧辞浦。浦曰。四面是山。阇黎向甚么处去。僧无对。浦曰。限汝十日。下语得中。即从汝去。其僧经行冥搜。偶入园中。师问曰。上座既是辞去。今何在此。僧具陈所以。坚请代语。师曰。竹密岂妨流水过。山高那阻野云飞。其僧喜踊。师嘱之曰。不得道是某甲语。僧遂白浦。曰。谁语。曰。某甲语。浦曰。非汝语。僧具言园头见教。浦至晚
sayings:
- text: 上堂谓众曰。莫轻园头。他日座下有五百人在。后住永安。众余五百。果符洛浦之记
  ref: X80n1565_p0214b15（五灯会元）
- text: 僧问。知有道不得时如何。师曰。知有个甚么。曰。不可无去也。师曰。恁么则合道得。曰。道即不无。争奈语偏。师曰。水冻鱼难跃。山寒花发迟
  ref: X80n1565_p0214b15（五灯会元）
- text: 问。如何是和尚家风。师曰。木马背斜阳。入草无踪迹
  ref: X80n1565_p0214b15（五灯会元）
- text: 问。如何是一色。师曰。易分雪里粉。难辩墨中煤
  ref: X80n1565_p0214b15（五灯会元）
- text: 问。如何是衲衣向上事。师曰。龙鱼不出海。水月不吞光
  ref: X80n1565_p0214b15（五灯会元）
- text: 问。不可以智知。不可以识识时如何。师曰。鹤鹭并头踏雪睡。月明惊起两迟疑
  ref: X80n1565_p0214b15（五灯会元）
- text: 问。牛头未见四祖时如何。师曰。异境灵松。睹者皆羡。曰。见后如何。师曰。叶落已枝摧。风来不得韵
  ref: X80n1565_p0214b15（五灯会元）
- text: 问。如何得生如来家。师曰。披衣望晓。论劫不明。曰。明后如何。师曰。一句不可得。曰。如何是不坐如来座。师曰。抱头石女归来晚。祇园会里没踪由。师往游𭶚道。避昭宗蒙尘之乱。以汉开运丙午冬。鸣犍槌集僧。嘱累入方丈。东向右胁而化。谥净悟禅师
  ref: X80n1565_p0214b15（五灯会元）
