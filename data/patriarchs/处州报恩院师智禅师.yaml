id: 处州报恩院师智禅师
name: 处州报恩院师智
school: 法眼宗
teacher: 灵隐耸
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0377b01。
sayings:
- text: 僧问。如何是和尚家风。师曰。谁人不见
  ref: X80n1565_p0377b01（五灯会元）
- text: 问。如何是一相三昧。师曰。青黄赤白。曰。一相何在。师曰。汝却灵利
  ref: X80n1565_p0377b01（五灯会元）
- text: 问。祖祖相传传祖印。师今法嗣嗣何人。师曰。灵鹫峰前。月轮皎皎
  ref: X80n1565_p0377b01（五灯会元）
