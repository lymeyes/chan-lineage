id: 湘南道吾从盛禅师
name: 湘南道吾从盛
school: 青原系
teacher: 罗山闲
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0276a14。
sayings:
- text: 僧问。如何是觌面事。师曰。新罗国去也
  ref: X80n1565_p0276a14（五灯会元）
- text: 问。如何是龙回家风。师曰。纵横射直
  ref: X80n1565_p0276a14（五灯会元）
- text: 问。穷子投师。乞师拯济。师曰。莫是屈著汝么。曰。争奈穷何。师曰。大有人见
  ref: X80n1565_p0276a14（五灯会元）
