bio: 生平部分原文未载，仅存机缘语（见下）；据《续传灯录》T51n2077_p0550a26。
sayings:
- text: 上堂云。咄咄咄。临济德山尽该抹。棒头荐得不作家。喝下承当未奇绝。山僧宗旨不恁么。觌面相呈辨贤哲。声前一句早迟疑。语后持来底时节。劝禅人休饶舌。神龙尚自不知源。岂说盲龟敌跛鳖。不看神光传祖位。才见老胡心便歇。真妙诀。堂堂自己可怜生。直下承当第二月。大丈夫须剿绝。现成公案早多端。莫学痴人被摩捋。伤嗟末法有多途。邪党成郡安可遏。初机入门无道眼。佛手生缘徒施设。禅流学得遍参游。问著元来打不迭。古人开口便知音。尚言弄巧翻成拙。那堪看话得心通。正是虚空钉铁橛。自惭道薄整颓纲。饮气吞声共谁说。特将鄙句报同风。本分禅人能辨别。大地山河尽放光。南无观世音菩萨
  ref: T51n2077_p0550a26（续传灯录）
