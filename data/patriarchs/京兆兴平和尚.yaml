id: 京兆兴平和尚
name: 京兆兴平
school: 南岳系
teacher: 马祖道一禅师
status: draft
bio: 洞山来礼拜。师曰。莫礼老朽。山曰。礼非老朽。师曰。非老朽者不受礼。山曰。他亦不止。洞山却
sayings:
- text: 问。如何是古佛心。师曰。即汝心是。山曰。虽然如此。犹是某甲疑处。师曰。若恁么。即问取木人去。山曰。某甲有一句子。不借诸圣口。师曰。汝试道看。山曰。不是某甲。山辞。师曰。甚么处去。山曰。㳂流无定止。师曰。法身㳂流。报身㳂流。山曰。总不作此解。师乃拊掌保福云。洞山自是一家。乃别云。觅得几人
