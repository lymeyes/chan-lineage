bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0686a17。
sayings:
- text: 僧问。如何是古佛心。师曰。赤脚䟕泥冷似冰。曰。未审意旨如何。师曰。休要拖泥带水
  ref: X80n1565_p0686a17（五灯会元）
- text: 问。泗洲大圣为甚么杨州出现。师曰。业在其中。曰。意旨如何。师曰。降尊就卑。曰。谢和尚答话。师曰。贼是小人。智过君子
  ref: X80n1565_p0686a17（五灯会元）
