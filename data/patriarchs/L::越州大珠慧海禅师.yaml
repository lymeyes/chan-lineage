id: L::越州大珠慧海禅师
name: 大珠慧海
school: 南岳系
teacher: 马祖一
bio: 马祖道一禅师法嗣。著《顿悟入道要门论》一卷，系统阐「顿悟」之义，为马祖门下说理明晰之代表。
sayings:
- text: 祖（马祖）问：「从何处来？」曰：「越州大云寺来。」祖曰：「来此拟须何事？」曰：「来求佛法。」祖曰：「我这里一物也无，求什么佛法？自家宝藏不顾，抛家散走作么！」师遂礼拜，识自本心。
  ref: 五灯会元·卷三·大珠慧海禅师
- text: 师著《顿悟入道要门论》曰：「顿者，顿除妄念；悟者，悟无所得。」
  ref: 五灯会元·卷三·大珠慧海禅师
status: draft
