id: L::泉州福清院师巍通玄禅师
name: 泉州福清院师巍通玄
school: 青原系
teacher: 逍遥忠
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0216a02。
sayings:
- text: 僧问。枝分夹岭。的绍逍遥。宝座既登。法雷请震。师曰。逍遥迥物外。物外霞不生
  ref: X80n1565_p0216a02（五灯会元）
- text: 问。如何是西来的的意。师曰。立雪未为劳。断臂方为的。曰。恁么则一华开五叶。芬芳直至今。师曰。因圆三界外。果满十方知
  ref: X80n1565_p0216a02（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0216a02），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
