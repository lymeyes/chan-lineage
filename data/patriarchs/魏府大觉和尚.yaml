id: 魏府大觉和尚
name: 魏府大觉
school: 临济宗
teacher: 临济义玄禅师
bio: 临济义玄禅师法嗣，住魏府（今河北大名）大觉寺。于临济、大愚处参学得法，以峻机接人。
sayings:
- text: 师（临济）举拂子，大觉展坐具；师掷下拂子，大觉收坐具，参堂去。
  ref: 五灯会元·卷十一·临济义玄禅师
- text: 大觉在大愚处，愚问：「这汉来来去去，有甚了期？」大觉云：「莫错，莫错。」
  ref: 五灯会元·卷十一·临济义玄禅师
status: draft
verify: 据《五灯会元》整理，待 CBETA 逐字校核原文与卷次；师承以谱系父节点为准。
