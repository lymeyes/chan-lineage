id: 投子感温禅师
name: 投子感温
school: 青原系
teacher: 投子大同禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0207a08。
sayings:
- text: 僧问。师登宝座。接示何人。师曰。如月赴千溪。曰。恁么则满地不亏也。师曰。莫恁么道
  ref: X80n1565_p0207a08（五灯会元）
- text: 问。父不投。为甚么却投子。师曰。岂是别人屋里事。曰。父与子还属功也无。师曰。不属。曰。不属功底如何。师曰。父子各自脱。曰。为甚么如此。师曰。汝与我会。师游山见蝉蜕。侍者问曰。壳在这里。蝉向甚么处去也。师拈壳就耳畔摇三五下。作蝉声。侍者于是开悟
  ref: X80n1565_p0207a08（五灯会元）
