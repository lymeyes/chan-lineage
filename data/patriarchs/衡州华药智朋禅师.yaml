id: 衡州华药智朋禅师
name: 衡州华药智朋
school: 法眼宗
teacher: 宝峰照
status: draft
bio: 四明黄氏子。依宝峰有年。无省。因为众持钵。峰自题其像曰。雨洗淡红桃萼嫩。风摇浅碧柳丝轻。白云影里怪石露。绿水光中古木清。噫。你是何人。至焦山。枯木成禅师见之。叹曰。今日方知此老亲见先师来。师遂请益其赞。成曰。岂不见法眼拈夹山境话。曰我二十年祇作境会。师即契悟萝湖野录云。成指以问师曰。汝会么。师曰。不会。成曰。汝记得法灯拟寒山否。师遂诵。至谁人知此意。令我忆南泉。于忆字处。成遽以手掩师口曰。住。住。师豁然有省。乃曰。元来恁么地。成曰。汝作么生会。师曰。春生夏长。秋收冬藏。成曰。直须保任。师应喏。绍兴初。出住华药．婺之天宁。后迁清凉
sayings:
- text: 上堂。海风吹梦。岭猿啼月。敢问诸人。是何时节。恁么会得。无影树下任遨游。其或未然。三条椽下。直须打彻。后退居明之瑞岩。建康再以清凉挽之。明守亦勉其行。师不从。作偈送使者曰。相烦专使入烟霞。灰冷无汤不点茶。寄语甬东贤太守。难教枯木再生花。未几而终
