id: L::临安府径山涂毒智策禅师
name: 临安府径山涂毒智策
school: —
teacher: 云岩游
status: draft
bio: 天台陈氏子。幼依护国僧楚光落发。十九造国清谒寂室光洒然有省。次谒大圆于明之万寿。圆问曰。甚处来。师曰。天台来。曰见智者大师么。师曰。即今亦不少。曰因甚在汝脚跟下师曰。当面蹉过。圆曰。上人不耘而秀不扶而直。一日辞去圆送之门。拊师背曰。宝所在近此城非实。师颔之。往豫章谒典牛。道由云居风雪塞路。坐阅四十二日。午初版声铿然豁尔大悟。及造门典牛独指师曰。甚处见神见鬼来。师曰。云居闻版声来。牛曰。是甚么。师曰。打破虚空全无柄靶。牛曰。向上事未在。师曰。东家暗坐西家厮骂。牛曰。崭然超出佛祖。他日起家一麟足矣。住后
sayings:
- text: 上堂举。教中道。若以色见我以音声求我是人行邪道不能见如来。虽然恁么。正是捕得老鼠打破油瓮。怀禅师道。尔眼在甚么处。虽则识破释迦老子。争奈拈𫗰舐指。若是涂毒即不然。色见声求也不妨。百华影里绣鸳鸯。自从识得金针后。一任风吹满袖香。师将示寂升座别众。嘱门人以文祭之。师危坐倾听。至尚飨为之一笑。越两日沐浴更衣集众说偈曰。四大既分飞。烟云任意归。秋天霜夜月。万里转光辉。俄顷泊然而逝。塔全身于东岗之麓
