id: L::英州观音和尚
name: 英州观音
school: 云门宗
teacher: 云门偃
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0571a08。
sayings:
- text: 僧问。井深多少。师曰。没汝鼻孔
  ref: X80n1565_p0571a08（五灯会元）
- text: 问。牛头未见四祖时如何。师曰。英州观音。曰。见后如何。师曰。英州观音
  ref: X80n1565_p0571a08（五灯会元）
- text: 问。如何是观音妙智力。师曰。风射破窗鸣
  ref: X80n1565_p0571a08（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0571a08），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
