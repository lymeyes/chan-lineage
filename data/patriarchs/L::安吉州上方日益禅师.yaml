id: L::安吉州上方日益禅师
name: 安吉州上方日益
school: 杨岐派
teacher: 保宁勇
status: draft
bio: 开堂日。上首白槌罢。师曰。白槌前观一又不成。白槌后观二又不是。到这里任是铁眼铜睛。也须百杂碎。莫有不避危亡底衲僧。试出来看。时有两僧齐出。师曰。一箭落双雕。僧曰。某甲话犹未
sayings:
- text: 问。何得著忙。师曰。莫是新罗僧么。僧拟议。师曰。撞露柱汉。便打
  ref: X80n1565_p0737b09（五灯会元）
- text: 问。如何是未出世边事。师曰。井底虾蟆吞却月。曰。如何是出世边事。师曰。鹭鸶踏折枯芦枝。曰。去此二途。如何是和尚为人处。师曰。十成好个金刚钻。摊向街头卖与谁
  ref: X80n1565_p0737b09（五灯会元）
- text: 问。如何是多年水牯牛。师曰。齿疏眼暗
  ref: X80n1565_p0737b09（五灯会元）
- text: 问。闹市相逢事若何。师曰。东行买贱。西行卖贵。曰。忽若不作贵不作贱。又作么生。师曰。镇州萝卜
  ref: X80n1565_p0737b09（五灯会元）
- text: 问。一切含灵具有佛性。既有佛性。为甚么却撞入驴胎马腹。师曰。知而故犯。曰。未审向甚么处忏悔。师打曰。且作死马医
  ref: X80n1565_p0737b09（五灯会元）
- text: 问。觌面相呈时如何。师曰。左眼半斤。右眼八两。僧提起坐具。曰。这里𫆏。师曰。不劳拈出。乃左右顾视曰。黄面老周行七步。脚根下正好一锥。碧眼胡兀坐九年。顶门上可惜一札。当时若有个为众竭力底衲僧。下得这毒手。也免得拈花微笑。空破面颜。立雪齐腰。翻成辙迹。自此将错就错。相篓打篓。遂有五叶芬芳。千灯续焰。向曲录木上唱二作三。于楖栗杖头指南为北。直得进前退后。有问法问心之徒。倚门傍墙。有觅佛觅祖底汉。庭前指柏。便唤作祖意西来。日里看山。更错认学人自己。殊不知此一大事。本自灵明。尽未来际。未尝间断。不假修证。岂在思惟。虽鹙子有所不知。非满慈之所能辩。不见马祖一喝。百丈三日耳聋。宝寿令行。镇州一城眼瞎。大机大用。如迅雷不可停。一唱一提。似断崖不可履。正当恁么时。三世诸佛。祇可傍观。六代祖师。证明有分。大众且道。今日还有证明底么。良久曰。札
  ref: X80n1565_p0737b09（五灯会元）
- text: 上堂。拾得搬柴。寒山烧火。唯有丰干。岩中冷坐。且道丰干有甚么长处。良久曰。家无小使。不成君子。南岳下十四世南岳下十四世
  ref: X80n1565_p0737b09（五灯会元）
