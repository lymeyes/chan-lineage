bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0572b07。
sayings:
- text: 僧问。如何是湘潭境。师曰。山连大岳。水接潇湘。曰。如何是境中人。师曰。便合知时
  ref: X80n1565_p0572b07（五灯会元）
- text: 问。如何是佛法大意。师曰。百惑谩劳神
  ref: X80n1565_p0572b07（五灯会元）
