id: 嘉兴府华亭性空妙普庵主
name: 嘉兴府华亭性空妙普
school: 黄龙派
teacher: 黄龙新
status: draft
bio: 汉州人。久依死心获证。乃抵秀水追船子遗风。结茅青龙之野。吹铁笛以自娱。多赋咏。得之者必珍藏。其山居曰。心法双忘犹隔妄。色尘不二尚余尘。百鸟不来春又过。不知谁是住庵人。又警众曰。学道犹如守禁城。昼防六贼夜惺惺。中军主将能行令。不动干戈治太平。又曰。不畊而食不蚕衣。物外清闲适圣时。未透祖师关棙子。也须存意著便宜。又曰。十二时中莫住工。穷来穷去到无穷。直须洞彻无穷底。踏倒须弥第一峰。建炎初。徐明叛。道经乌镇。肆杀戮。民多逃亡。师独荷策而往。贼见其伟异。疑必诡伏者。问其来。师曰。吾禅者欲抵密印寺。贼怒欲斩之。师曰。大丈夫要头便斫取。奚以怒为。吾死必矣。愿得一饭以为送终。贼奉肉食。师如常斋出。生毕。乃曰。孰当为我文之以祭。贼笑而不答。师索笔大书曰。呜呼惟灵。劳我以生则大块之过。役我以寿则阴阳之失。乏我以贫则五行不正。困我以命则时日不吉。吁哉至哉。赖有出尘之道。悟我之性。与其妙心。则其妙心孰与为邻。上同诸佛之真化。下合凡夫之无明。纤尘不动本自圆成。妙矣哉妙矣哉。日月未足以为明。乾坤未足以为大。磊磊落落无罣无碍。六十余年和光混俗。四十二腊逍遥自在。逢人则喜见佛不拜。笑矣乎笑矣乎。可惜少年郎。风流太光彩。坦然归去付春风。体似虚空终不坏。尚飨。遂举箸饫飡。贼徒大笑。食罢复曰。劫数既遭离乱。我是快活烈汉。如今正好乘时。便请一刀两段。乃大呼斩斩。贼方骇累稽首谢过。令卫而出。乌镇之庐舍免焚。实师之惠也。道俗闻之愈敬。有僧睹师见佛不拜歌逆问曰。既见佛为甚么不拜。师掌之曰。会么。云不会。师又掌曰。家无二主。绍兴庚申冬造大盆穴而塞之。修书寄雪窦持禅师曰。吾将水葬矣。壬戌岁持至见其尚存。作偈嘲之曰。咄哉老性空。刚要𫗪鱼鳖。去不索性去。只管向人说。师阅偈笑曰。待兄来证明耳。令遍告四众。众集师为说法要。仍说偈曰。坐脱立亡不若水葬。一省柴烧二省开圹。撒手便行不妨快畅。谁是知音船子和尚。高风难继百千年。一曲渔歌少……（原文更长，见 cbeta 锚点）
