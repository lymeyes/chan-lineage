name: 嘉兴府报恩法常首座
school: 黄龙派
teacher: 万年一
status: draft
bio: 开封人也。丞相薛居正之裔。宣和七年。依长沙益阳华严元轼下发。遍依丛林。于首楞严经。深入义海。自湖湘至万年谒雪巢。机契。命掌笺翰。后首众报恩。室中唯一矮榻。余无长物。庚子九月中。语寺僧曰。一月后不复留此。十月二十一往方丈。谒饭。将晓。书渔父词于室门。就榻收足而逝。词曰。此事楞严尝露布。梅华雪月交光处。一笑寥寥空万古。风瓯语。迥然银汉横天宇。蝶梦南华方栩栩。斑斑谁跨丰干虎。而今忘却来时路。江山暮。天涯目送鸿飞去。岳山祖庵主法嗣岳山祖庵主法嗣
