id: 鼎州德山志先禅师
name: 鼎州德山志先
school: 云门宗
teacher: 德山晏
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0587a16。
sayings:
- text: 僧问。见色便见心时如何。师曰。角弓弯似月。宝剑利如霜。曰。如何领会。师曰。金甲似鱼鳞。朱旗如火焰
  ref: X80n1565_p0587a16（五灯会元）
- text: 问。远远投师。乞师一接。师曰。不接。曰。恁么则虗伸一
  ref: X80n1565_p0587a16（五灯会元）
- text: 问。师曰。少逢穿耳客。多遇刻舟人
  ref: X80n1565_p0587a16（五灯会元）
- text: 问。大通智胜佛。十劫坐道场。为甚么不得成佛道。师曰。贪观天上月。失却掌中珠
  ref: X80n1565_p0587a16（五灯会元）
- text: 问。军期急速时如何。师曰。十字街头满面尘。曰。为甚么如此。师曰。知而故犯
  ref: X80n1565_p0587a16（五灯会元）
- text: 问。如何是无为之谈。师曰。石羊石虎喃喃语。曰。是何言教。师曰。长行书不尽。短偈绝人闻
  ref: X80n1565_p0587a16（五灯会元）
- text: 问。如何是一称南无佛。师曰。皆以成佛道
  ref: X80n1565_p0587a16（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0587a16），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
