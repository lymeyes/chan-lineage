id: L::瑞州九峰勤禅师
name: 瑞州九峰勤
school: 云门宗
teacher: 智门祚
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0592a07。
sayings:
- text: 僧问。方便门中。请师垂示。师曰。佛不夺众生愿。曰。恁么则谢师方便。师曰。却须吃棒
  ref: X80n1565_p0592a07（五灯会元）
- text: 上堂。口罗舌沸。千唤万唤。露柱因甚么不回头。良久曰。美食不中饱人吃。便下座
  ref: X80n1565_p0592a07（五灯会元）
