id: 元丰清满禅师
name: 元丰清满
alias: 元丰满
school: 云门宗
teacher: 天钵元禅师
status: draft
bio: 姓田氏沧州盐山人。幼以孝闻。母丧出家剃落禀戒。诣青州元禅师丛席入室咨参。一日山行取叶净手豁然契悟。投机颂曰。大奇大寄。动用还迷。更问如何。蓦口便槌。山居苦行绝粒七年。太守钱公请师出世
sayings:
- text: 僧问。禅关创辟祖道重兴。千圣灵机愿
  ref: T51n2077_p0577b29（续传灯录）
- text: 师举唱。师曰。秋观黄叶落
  ref: T51n2077_p0577b29（续传灯录）
- text: 僧云。千圣灵机蒙举唱。我师关棙意如何。师曰。冬见万木枯
  ref: T51n2077_p0577b29（续传灯录）
- text: 僧云。恁么则木马嘶时花遍地。泥牛行处海云凝。师曰。也须会始得。问如何是祖师印。师曰。地静天宁
  ref: T51n2077_p0577b29（续传灯录）
- text: 僧云。如何是心印。师拍膝一下
  ref: T51n2077_p0577b29（续传灯录）
- text: 僧云。佛祖心印相去几何。师曰。言浅理深。问如何是衲僧得力处。师曰。月上青天
  ref: T51n2077_p0577b29（续传灯录）
- text: 僧云。未审有何凭验。师曰。莫瞌睡。乃横按拂子曰。要扣玄关须是有节操极慷慨斩钉截铁剥剥地汉始得。若是隈刀避箭碌碌之徒看即有分。击禅床下坐。又
  ref: T51n2077_p0577b29（续传灯录）
- text: 上堂顾视大众曰。无异思惟谛听谛听。昨日热今日寒。抖擞精神著力看著力看。看来看去转颟顸。要得不颟顸。看看
  ref: T51n2077_p0577b29（续传灯录）
