bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0620a16。
sayings:
- text: 僧问。如何是佛法大意。师曰。铁牛生石卵。曰。如何是接人句。师曰。三门前合掌。曰。如何是大用句。师曰。脑门著地。曰。如何是无事句。师曰。横眠大道。曰。如何是奇特句。师曰。的
  ref: X80n1565_p0620a16（五灯会元）
