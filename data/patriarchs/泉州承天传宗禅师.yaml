bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0605a16。
sayings:
- text: 僧问。大用现前。不存轨则时如何。师曰。承天今日高竖降旗。僧便喝。师曰。临济儿孙。僧又喝。师便打
  ref: X80n1565_p0605a16（五灯会元）
- text: 问。如何是般若体。师曰。云笼碧峤。曰。如何是般若用。师曰。月在清池
  ref: X80n1565_p0605a16（五灯会元）
