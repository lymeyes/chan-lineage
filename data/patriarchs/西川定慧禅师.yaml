id: 西川定慧禅师
name: 西川定慧
school: 青原系
teacher: 罗山闲
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0275a17。
sayings:
- text: 问。甚么处来。师曰。远离西蜀。近发开元。却近前
  ref: X80n1565_p0275a17（五灯会元）
- text: 问。即今事作么生。山揖曰。吃茶去。师拟议。山曰。秋气稍热去。师出至法堂。叹曰。我在西蜀峨嵋山脚下拾得一只蓬蒿箭。拟拨乱天下。今日打罗山寨。弓折箭尽也。休。休。乃下参众。山来日
  ref: X80n1565_p0275a17（五灯会元）
- text: 上堂。师出问。豁开户牗。当轩者谁。山便喝。师无语。山曰。毛羽未备。且去。师因而抠衣。久承印记。后谒台州胜光。光坐次。师直入身边。叉手而立。光
  ref: X80n1565_p0275a17（五灯会元）
- text: 问。甚处来。师曰。犹待答话在。便出。光拈得拂子。趁至僧堂前。见师乃提起拂子曰。阇黎唤这个作甚么。师曰。敢死喘气。光低头归方丈
  ref: X80n1565_p0275a17（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0275a17），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
