school: —
teacher: 长庆慧稜禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0288b08。
sayings:
- text: 上堂。大众入方丈参。师曰。今夜与大众同请假。未审还给假也无。若未闻给假。即先言者负。珍重
  ref: X80n1565_p0288b08（五灯会元）
- text: 僧问。十二时中常在底人。还消得人天供养也无。师曰。消不得。曰。为甚么消不得。师曰。为汝常在。曰。祇如常不在底人。还消得也无。师曰。驴年
  ref: X80n1565_p0288b08（五灯会元）
- text: 问。请师答无宾主话。师曰。向无宾主处问将来
  ref: X80n1565_p0288b08（五灯会元）
