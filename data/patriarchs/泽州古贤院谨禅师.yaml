id: 泽州古贤院谨禅师
name: 泽州古贤院谨
school: 法眼宗
teacher: 法眼文益禅师
status: draft
bio: 侍立法眼次。眼问一僧曰。自离此间。甚么处去来。曰。入岭来。眼曰。不易。曰。虗涉他如许多山水。眼曰。如许多山水也不恶。其僧无语。师于此有省。住后
sayings:
- text: 僧问。如何是佛。师曰。筑著你鼻孔。问僧曰。唯一坚密身。一切尘中现。如何是坚密身。僧竖指。师曰。现则现。你作么生会。僧无语
