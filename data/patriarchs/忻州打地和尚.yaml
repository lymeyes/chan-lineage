id: 忻州打地和尚
name: 忻州打地
school: 南岳系
teacher: 马祖一
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0117b06。
sayings:
- text: 问。唯以棒打地示之。时谓之打地和尚。一日被僧藏却棒然后致
  ref: X80n1565_p0117b06（五灯会元）
- text: 问。师但张其口
  ref: X80n1565_p0117b06（五灯会元）
- text: 僧问门人曰。只如和尚每日有人问便打地。意旨如何。门人即于灶内取柴一片。掷在釜中
  ref: X80n1565_p0117b06（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0117b06），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
