bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0537a16。
sayings:
- text: 上堂。清虗之理。佛祖同归。毕竟无身。圣凡一体。理则如是。满目森罗事作么生。纤尘绝际。渠侬有眼。岂在旁窥。官不容针。私通车马。若到恁么田地。始可随机受用。信手拈来。妙应无方。当风玄路。直得金针锦缝。线脚不彰。玉殿宝阶。珠帘未卷。正当此时。且道是甚么人境界。古渡秋风寒飒飒。芦花红蓼满江湾
  ref: X80n1565_p0537a16（五灯会元）
