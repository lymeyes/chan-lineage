id: 怀州玄泉二世和尚
name: 怀州玄泉二世
school: 青原系
teacher: 玄泉彦
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0272b04。
sayings:
- text: 僧问。辞穷理尽时如何。师曰。不入理。岂同尽
  ref: X80n1565_p0272b04（五灯会元）
- text: 问。妙有玄珠。如何取得。师曰。不似摩尼绝影艳。碧眼胡人岂能见。曰。有口道不得时如何。师曰。三寸不能齐鼓韵。痖人解唱木人歌
  ref: X80n1565_p0272b04（五灯会元）
