id: L::知府葛郯居士
name: 知府葛郯
school: 杨岐派
teacher: 灵隐远
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0815a09。
sayings:
- text: 问。号信斋。少擢上第。玩意禅悦。首谒无庵全禅师。求指南。庵令究即心即佛。久无所契。请曰。师有何方便。使其得入。庵曰。居士太无厌生。已而佛海来居剑池。公因从游。乃举无庵所示之语。请为众普说。海发挥之曰。即心即佛眉拖地。非心非佛双眼横。蝴蝶梦中家万里。子规枝上月三更。留旬日而后返。一日。举不是心。不是佛。不是物。豁然顿明。颂曰。非心非佛亦非物。五凤楼前山突兀。艶阳影里倒翻身。野狐跳入金毛窟。无庵肯之。即遣书颂呈佛海。海报曰。此事非纸笔可既。居士能过我。当有所闻矣。遂复至虎丘。海迎之曰。居士见处。止可入佛境界。入魔境界。犹未得在。公加礼不已。海正容曰。何不道金毛跳入野狐窟。公乃痛领。尝问诸禅曰。夫妇二人相打。通儿子作证。且道证父即是。证母即是。或庵体禅师著语曰。小出大遇。淳熙六年。守临川。八年感疾。一夕忽索笔书偈曰。大洋海里打鼓。须弥山上闻钟。业镜忽然扑破。翻身透出虗空。召僚属示之曰。生之与死。如昼与夜。无足怪者。若以道论。安得生死。若作生死会。则去道远矣。语毕。端坐而化
  ref: X80n1565_p0815a09（五灯会元）
