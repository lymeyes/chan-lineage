id: 常州正勤院蕴禅师
name: 常州正勤院蕴
school: —
teacher: 疏山仁
status: draft
bio: 魏府韩氏子。幼而出家。老有童颜
sayings:
- text: 僧问。师唱谁家曲。宗风事若何。师曰。迥出箫韶外。六律岂能过。曰。不过底事作么生。师曰。声前拍不散。句后觅无踪
  ref: X80n1565_p0505b12（五灯会元）
- text: 问。如何是正勤一路。师曰。泥深三尺。曰。如何到得。师曰。阇黎从甚么处来
  ref: X80n1565_p0505b12（五灯会元）
- text: 问。如何是禅。师曰。石上莲华火里泉。曰。如何是道。师曰。楞伽峰顶一茎草。曰。禅道相去几何。师曰。泥人落水木人捞。晋天福中顺寂。葬于院侧。经二稔。门人发塔。睹全身俨然。发爪俱长。乃阇维。收舍利真骨重建塔焉
  ref: X80n1565_p0505b12（五灯会元）
