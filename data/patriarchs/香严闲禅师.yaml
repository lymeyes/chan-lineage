id: 香严闲禅师
name: 香严智闲
school: 沩仰宗
teacher: 沩山祐
bio: 沩山灵祐禅师法嗣。初以博闻强记自负，沩山问「父母未生时」一句，智闲茫然，烧却生平经籍，入南阳香严山除草，因击竹而悟，为沩仰宗著名公案。
sayings:
- text: 师（香严）因瓦砾击竹作声，忽然省悟，作偈：「一击忘所知，更不假修持；动容扬古路，不堕悄然机……」
  ref: 五灯会元·卷九·香严智闲禅师
status: draft
