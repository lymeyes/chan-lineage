status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0294b17。
sayings:
- text: 上堂。幸自分明。须作这个节目。作么到这里便成节目。便成增语。便成尘玷。未有如许多事时作么生
  ref: X80n1565_p0294b17（五灯会元）
- text: 僧问。古佛化导。今祖重兴。人天辐辏于禅庭。至理若为于开示。师曰。亦不敢孤负大众。曰。恁么则人天不谬殷勤请。顿使凡心作佛心。师曰。仁者作么生。曰。退身礼拜。随众上下。师曰。我识得汝也
  ref: X80n1565_p0294b17（五灯会元）
