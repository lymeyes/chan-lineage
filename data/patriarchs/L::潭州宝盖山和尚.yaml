id: L::潭州宝盖山和尚
name: 潭州宝盖山
school: 曹洞宗
teacher: 洞山价
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0491b10。
sayings:
- text: 僧问。一间无漏舍。合是何人居。师曰。无名不挂体。曰。还有位也无。师曰。不处
  ref: X80n1565_p0491b10（五灯会元）
- text: 问。如何是宝盖。师曰。不从人天得。曰。如何是宝盖中人。师曰。不与时人知。曰。佛来时如何。师曰。觅他路不得
  ref: X80n1565_p0491b10（五灯会元）
- text: 问。世界坏时。此物何处去。师曰。千圣寻不得。曰。时人如何归向。师曰。直须似他去。曰。还有的当也无。师曰。不立标则
  ref: X80n1565_p0491b10（五灯会元）
- text: 问。不居正位底人。如何行履。师曰。红焰丛中骏马嘶
  ref: X80n1565_p0491b10（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0491b10），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
