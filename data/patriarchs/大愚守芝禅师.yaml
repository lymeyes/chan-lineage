id: 大愚守芝禅师
name: 大愚守芝
alias: 大愚芝
school: —
teacher: 汾阳善昭禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《续传灯录》T51n2077_p0485a29。
sayings:
- text: 僧问。如何是和尚家风。师曰。一言出口驷马难追。问如何是城里佛。师曰。十字街头石幢子。问不落三寸时如何。师曰。干三长坤六短。曰意旨如何。师曰。切忌地盈虚。问昔日灵山分半座。二师相见事如何。师曰。记得么。僧良久。师打禅床一下曰。多年忘却也。乃曰。且住且住。若向言中取则句里明机。也似迷头认影。若也举唱宗乘。大似一场寐语。虽然如是。官不容针私通车马。放一线道有个葛藤处。遂敲禅林一下曰。三世诸佛尽皆头痛。且道大众。还有免得底么。若一人免得无有是处。若免不得海印发光。师乃竖起拂子曰。这个是印那个是光。这个是光那个是印。掣电之机徒劳伫思。会么老僧说梦。且道梦见个甚么。南柯十更。若不会听取一颂。北斗挂须弥。杖头挑日月。林泉好商量。夏末秋风切。珍重。问如何是祖师西来意。师曰。天寒日短问心法无形如何雕琢。师曰。一丁两丁。曰未晓者如何领会。师曰。透七透八
  ref: T51n2077_p0485a29（续传灯录）
- text: 上堂。一击响玲珑。喧轰宇宙通。知音才侧耳。项羽过江东。与么会恰认得驴鞍桥作阿爷下颔
  ref: T51n2077_p0485a29（续传灯录）
- text: 上堂。大愚相接大雄孙。五湖云水竞头奔。竞头奔有何门。击箭宁知枯木存。枯木存。一年还曾两度春。两度春。帐里珍珠撒与人。撒与人。思量也是慕西秦
  ref: T51n2077_p0485a29（续传灯录）
- text: 上堂。竖穷三际横遍十方。拈起也帝释心惊。放下也地神胆战。不拈不放唤作甚么。自云。虾蟆
  ref: T51n2077_p0485a29（续传灯录）
- text: 上堂。三世诸佛不知有。狸奴白牯却知有。乃拈起拂子云。狸奴白牯总在这里放光动地。何谓如此。两段不同。问如何是佛。师曰。锯解秤锤
  ref: T51n2077_p0485a29（续传灯录）
- text: 上堂。大众集定。乃曰。现成公案也是打堞不办。便下座
  ref: T51n2077_p0485a29（续传灯录）
- text: 上堂。大洋海底排班立。从头第二鬓毛斑。为甚么不道第一鬓毛斑。要会么。金蕋银丝成玉露。高僧不坐凤皇台
  ref: T51n2077_p0485a29（续传灯录）
- text: 上堂。众集。乃曰。为众竭力祸出私门。便下座
  ref: T51n2077_p0485a29（续传灯录）
- text: 上堂。翠岩路崄巇。举步涉千溪更有洪源水。滔滔在岭西。击禅床下座
  ref: T51n2077_p0485a29（续传灯录）
- text: 示众擎起香合云。明头合暗头合。道得天下横行。若道不得且合却。下座。问如何是为人一句。师曰。四角六张。曰意旨如何。师曰。八凹九凸
  ref: T51n2077_p0485a29（续传灯录）
- text: 上堂。沙里无油事可哀翠岩嚼饭𫗪婴孩。他时好恶知端的。始觉从前满面埃。击禅床下座
  ref: T51n2077_p0485a29（续传灯录）
