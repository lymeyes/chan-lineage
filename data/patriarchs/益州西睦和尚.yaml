id: 益州西睦和尚
name: 益州西睦
school: 南岳系
teacher: 赵州从谂禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0157a03。
sayings:
- text: 上堂。有俗士举手曰。和尚便是一头驴。师曰。老僧被汝骑。士无语。去后三日再来。白言。某甲三日前著贼。师拈杖趁出。师有时蓦唤侍者。者应诺。师曰。更深夜静。共伊商量
  ref: X80n1565_p0157a03（五灯会元）
