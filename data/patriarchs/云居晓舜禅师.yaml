id: 云居晓舜禅师
name: 云居晓舜
alias: 云居舜
school: 云门宗
teacher: 洞山聪禅师
status: draft
bio: 筠阳人也。少年麤猛，忽悟浮幻，投师出家，乃修细行，参聦禅师。一日入室，聦问云：古镜未磨时如何？曰：黑似漆。聦云：磨后如何？曰：照天照地。聦云：我即不恁么。师便
sayings:
- text: 问：古镜未磨时如何？曰：此去朗州不远。师云：磨后如何？曰：黄鶴楼前鹦鹉洲。师忽有省。由是道誉远布，禅徒依之。后住筠州大愚庐山栖贤。治平中，一日召大众云：本来无事，临行何语？片时片时，便去便去。言毕而逝
  ref: X78n1556_p0099a05（建中靖国续灯录）
- text: 问：师唱谁家曲，宗风嗣阿谁？师云：云有出山势，水无投㵎声。僧曰：新丰一箭，直射大愚。师云：今日几遭雨水
  ref: X78n1556_p0099a05（建中靖国续灯录）
- text: 问：如何是为人一句？师云：晴天日出。僧曰：与么则从此无疑。师云：雨下云阴
  ref: X78n1556_p0099a05（建中靖国续灯录）
- text: 问：千里特来即不问，旧店新开事若何？师云：儞要买个甚么？僧提起坐具，云：还有遮个么？师云：东行不见西行利。僧曰：有钱堪作好儿郎。师云：吽！儞谑我
  ref: X78n1556_p0099a05（建中靖国续灯录）
- text: 问：承师有言：不谈玄，不说妙。去此二途，如何指示？师云：虾䗫赶󳬲子。僧曰：全因此
  ref: X78n1556_p0099a05（建中靖国续灯录）
- text: 问。师云：老鼠弄猴狲
  ref: X78n1556_p0099a05（建中靖国续灯录）
- text: 上堂云：唯一坚密身，一切尘中现，虾䗫蚯蚓各有窟穴，乌鹊鸠鸽亦有窠巢。正当与么时，为甚么人说法？良久，云：方以类聚，物以群分
  ref: X78n1556_p0099a05（建中靖国续灯录）
- text: 上堂云：学道莫生分别，分别便成解会。但信自心是佛，历劫更无迷昧。久立
  ref: X78n1556_p0099a05（建中靖国续灯录）
- text: 上堂，云：三峡道无别，朝朝只么说，僧繇会写真，镇府出镔铁。珍重！
  ref: X78n1556_p0099a05（建中靖国续灯录）
- text: 上堂，云：不长不短，不小不大，此个道理是谁境界？咄！
  ref: X78n1556_p0099a05（建中靖国续灯录）
- text: 上堂云：尽力提不起，放下绝无踪，借问诸禅者，此理若为通？
  ref: X78n1556_p0099a05（建中靖国续灯录）
- text: 上堂云：言不假繁，道不假修。若人会得，任性随流。久立
  ref: X78n1556_p0099a05（建中靖国续灯录）
