bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0196b07。
sayings:
- text: 僧问。法尚应舍。何况非法。如何是法尚应舍。师曰。空里撒醍醐。曰。如何是非法。师曰。嵩山道士诈明头
  ref: X80n1565_p0196b07（五灯会元）
- text: 问。逼迫出来时如何。师曰。还曾拶著汝么
  ref: X80n1565_p0196b07（五灯会元）
