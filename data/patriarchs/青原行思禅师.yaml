cbeta: T51n2076 卷五
bio: 庐陵刘氏子，闻曹溪法席，往参六祖，得印可。六祖谓「众角虽多，一麟足矣」，深加器重。后住青原山静居寺，门人石头希迁、天皇道悟出其下，下衍曹洞、云门、法眼三宗，与南岳并列为禅门两大干。
sayings:
- text: 六祖问：「汝曾作什么来？」思曰：「圣谛亦不为。」祖曰：「落何阶级？」思曰：「圣谛尚不为，何阶级之有？」
  ref: 五灯会元·卷三·青原行思
