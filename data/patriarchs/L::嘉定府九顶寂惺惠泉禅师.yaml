name: 嘉定府九顶寂惺惠泉
school: 黄龙派
teacher: 黄龙新
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0693a07。
sayings:
- text: 僧问。心迷法华转。心悟转法华。未审意旨如何。师曰。风暖鸟声碎。日高华影重
  ref: X80n1565_p0693a07（五灯会元）
- text: 上堂。昔日云门有三句。谓函盖乾坤句。截断众流句。随波逐浪句。九顶今日亦有三句。所谓饥来吃饭句。寒即向火句。困来打睡句。若以佛法而论。则九顶望云门。直立下风。若以世谛而论。则云门望九顶。直立下风。二语相违。且如何是九顶为人处。嘉兴府华亭性空妙普庵主嘉兴府华亭性空妙普庵主汉州人。久依死心获证。乃抵秀水。追船子遗风。结茅青龙之野。吹铁笛以自娱。多赋咏。得之者必珍藏。其山居曰。心法双忘犹隔妄。色尘不二尚余尘。百鸟不来春又过。不知谁是住庵人。又警众曰。学道犹如守禁城。昼防六贼夜惺惺。中军主将能行令。不动干戈治太平。又曰。不耕而食不蚕衣。物外清闲适圣时。未透祖师关棙子。也须存意著便宜。又曰。十二时中莫住工。穷来穷去到无穷。直须洞彻无穷底。踏倒须弥第一峰。建炎初。徐明叛。道经乌镇。肆杀戮。民多逃亡。师独荷䇿而往。贼见其伟异。疑必诡伏者。问其来。师曰。吾禅者。欲抵密印寺。贼怒。欲斩之。师曰。大丈夫要头便斫取。奚以怒为。吾死必矣。愿得一饭以为送终。贼奉肉食。师如常斋出生毕。乃曰。孰当为我文之以祭。贼笑而不答。师索笔大书曰。呜呼。惟灵劳我以生。则大块之过。没我以寿。则阴阳之失。乏我以贫。则五行不正。困我以命。则时日不吉。吁哉。至哉。赖有出尘之道。悟我之性。与其妙心。则其妙心。孰与为邻。上同诸佛之真化。下合凡夫之无明。纤尘不动。本自圆成。妙矣哉。妙矣哉。日月未足以为明。乾坤未足以为大。磊磊落落。无罣无碍。六十余年。和光混俗。四十二腊。逍遥自在。逢人则喜。见佛不拜。笑矣乎。笑矣乎。可惜少年郎。风流太光彩。坦然归去付春风。体似虗空终不坏。尚飨。遂举箸饫䬸。贼徒大笑。食罢。复曰。劫数既遭离乱。我是快活烈汉。如今正好乘时。便请一刀两段。乃大呼。斩。斩。贼方骇异。稽首谢过令卫而出。乌镇之庐舍免焚。实师之惠也。道俗闻之愈敬。有僧睹师见佛不拜歌。逆问曰。既见佛。为甚么不拜。师掌之。曰。会么。云。不会。师又掌曰。家无二主。绍兴庚申冬。造大盆。穴而塞之。修书寄雪窦持禅师曰。吾将水葬矣。壬戌岁。持至。见其尚存。作偈嘲之曰。咄哉老性空。刚要𫗪鱼鳖。去不索性去。祇管向人说。师阅偈。笑曰。待兄来证明耳。令遍告四众。众集。师为说法要。仍说偈曰。坐脱立亡。不若水葬。一省柴烧。二省开圹。撒手便行。不妨快畅。谁是知音。船子和尚。高风难继百千年。一曲渔歌少人唱。遂盘坐盆中。顺潮而下。众皆随至海濵。望欲断目。师取塞。戽水而回。众拥观水无所入。复乘流而往。唱曰。船子当年返故乡。没踪迹处妙难量。真风遍寄知音者。铁笛横吹作散场。其笛声呜咽。顷于苍茫间。见以笛掷空而没。众号慕。图像事之。后三日。于沙上趺坐如生。道俗争往迎归。留五日。阇维。设利大如菽者莫计。二鹤徘徊空中。火尽始去。众奉设利灵骨。建塔于青龙
  ref: X80n1565_p0693a07（五灯会元）
