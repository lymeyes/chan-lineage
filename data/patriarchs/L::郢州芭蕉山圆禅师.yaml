id: L::郢州芭蕉山圆禅师
name: 郢州芭蕉山圆
school: 沩仰宗
teacher: 芭蕉清
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0337b06。
sayings:
- text: 僧问。如何是和尚接人一句。师曰。要头截取去。曰。岂无方便。师曰。心不负人。面无惭色
  ref: X80n1565_p0337b06（五灯会元）
- text: 上堂。三千大千世界。夜来被老僧都合成一块。辊向须弥顶上。帝释大怒。拈得扑成粉碎。诸上座还觉头痛也无。良久曰。莫不识痛痒好。珍重
  ref: X80n1565_p0337b06（五灯会元）
