id: 双林用禅师
name: 双林用
school: 杨岐派
teacher: 龙翔珪
status: draft
bio: 郡之金华人，族戴氏。年十四，往智者寺出家，试所习得度，乃游江表。初谒长芦信、保宁玑、甘露卓，后至龙门。久之，高庵过庐陵，天宁迁云居，师随至。一日，庵升座，举：
sayings:
- text: 僧问投子：如何是十身调御？投子下禅床，叉手而立。师闻，罔知所诣。归坐纸帐中，因垂手褰帐，忽悟。由是往来三佛会下，皆蒙肯诺。初住闽之中际，次居东西二禅，后补天宁双林
  ref: X79n1559_p0288a15（嘉泰普灯录）
- text: 上堂曰：拈槌竖拂，祖师门下将黄叶以止啼；说妙谈玄，衲僧面前望梅林而止渴。际山今日去却之乎者也，更不指东画西，向三世诸佛命脉中、六代祖师骨髓里，尽情倾倒，为诸人说破。良久，曰：啼得血流无用处，不如缄口过残春
  ref: X79n1559_p0288a15（嘉泰普灯录）
