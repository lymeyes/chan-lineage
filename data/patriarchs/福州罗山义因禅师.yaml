id: 福州罗山义因禅师
name: 福州罗山义因
school: 青原系
teacher: 罗山闲
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0276a18。
sayings:
- text: 上堂良久曰。若是宗师门下客。必不怪于罗山。珍重
  ref: X80n1565_p0276a18（五灯会元）
- text: 僧问。承古有言。自从认得曹谿路。了知生死不相关。曹谿路即不
  ref: X80n1565_p0276a18（五灯会元）
- text: 问。如何是罗山路。师展两手。僧曰。恁么则一路得通。诸路亦然。师曰。甚么诸路。僧近前叉手。师曰。灵鹤烟霄外。钝鸟不离窠
  ref: X80n1565_p0276a18（五灯会元）
- text: 问。教中道。顺法身万象俱寂。随智用万象齐生。如何是万象俱寂。师曰。有甚么。曰。如何是万象齐生。师曰。绳床倚子
  ref: X80n1565_p0276a18（五灯会元）
