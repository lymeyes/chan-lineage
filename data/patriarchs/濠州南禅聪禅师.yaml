bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0524a15。
sayings:
- text: 僧问。如何是西来意。师曰。冬月深林雨。三春平地风
  ref: X80n1565_p0524a15（五灯会元）
- text: 问。如何是大道根源。师曰。云兴当午夜。石虎叫连霄。青原下十世青原下十世
  ref: X80n1565_p0524a15（五灯会元）
