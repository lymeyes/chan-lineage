id: 龙翔士珪禅师
name: 龙翔士珪
alias: 龙翔珪
school: 杨岐派
teacher: 龙门清远禅师
status: draft
bio: 成都史氏子。初依大慈宗雅。心醉楞严逾五秋。南游谒诸尊宿始登龙门。即以平时所得白佛眼眼曰。汝解心已极但欠著力开眼耳。遂俾职堂司。一日侍立次问云。绝对待时如何。眼曰。如汝僧堂中白椎相似。师罔措。眼至晚抵堂司。师理前话。眼曰。闲言语。师于言下大悟。政和末出世和之天宁。屡迁名刹。绍兴间奉诏开山雁荡能仁。时真歇居江心闻师至。恐缘法未熟。特过江迎归方丈大展九拜以诱温人。由是翕然归敬。未视篆。其徒惧行规法深夜放火鞠为瓦砾之墟。师竟就树缚屋。升座
sayings:
- text: 示众云。爱闲不打鼓山鼓。投老来看雁荡山。杰阁危楼浑不见。溪边茅屋两三间。还有共相出手者么。喝一喝下座。听法檀施并力营建。未几复成宝坊。次补江心
  ref: T51n2077_p0667c02（续传灯录）
- text: 上堂曰。万年一念一念万年。和衣泥里辊。洗脚上床眠。历劫来事只在如今。大海波涛涌。小人方寸深。拈起拄杖曰。汝等诸人未得个入头。须得个入头。既得个入头。须有出身一路始得。大众且作么生。是出身一路。良久曰。雪压难摧㵎底松。风吹不动天边月。卓拄杖下座
  ref: T51n2077_p0667c02（续传灯录）
- text: 上堂。万机不到。眼见色耳闻声。一句当阳。头戴天脚踏地。尔诸人只知今日是五月初一。殊不知金乌半夜忙忙去。玉兔天明上海东。以拂子击禅床下座
  ref: T51n2077_p0667c02（续传灯录）
- text: 上堂。明明无悟有法即迷。诸人向这里立不得。诸人向这里住不得。若立则危。若住则瞎。直须意不停玄。句不停意。用不停机。此三者既明。一切处不须管带自然现前。不须照顾自然明白。虽然如是。更须知有向上事。久雨不晴。咄
  ref: T51n2077_p0667c02（续传灯录）
- text: 上堂。一叶落天下秋。欲穷千里目。更上一层楼。一尘起大地收。嘉州打大像。陕府灌铁牛。明眼汉合作么生。良久曰。久旱檐头句桥流水不流。卓拄杖下座
  ref: T51n2077_p0667c02（续传灯录）
- text: 上堂。见见之时见非是见。见犹离见见不能及。落花有意随流水。流水无情恋落花。诸可还者自然非汝。不汝还者非汝而谁。长恨春归无觅处。不知转入此中来。喝一喝曰。三十年后莫道能仁教坏人家男女
  ref: T51n2077_p0667c02（续传灯录）
- text: 上堂僧问。如何是祖师西来意。师曰。东家点灯西家暗坐。曰未审意旨如何。师曰。马便搭鞍驴便推磨。僧礼拜。师曰灵利衲僧只消一个。遂曰。马搭鞍驴推磨。灵利衲僧只消一个。纵使东家明点灯。未必西家暗中坐。西来意旨问如何。多口阿师自招祸
  ref: T51n2077_p0667c02（续传灯录）
- text: 僧问。如何是第一义。师曰。尔问底是第二义。问狗子还有佛性也无。赵州道无。意旨如何。师曰。一度著蛇咬怕见断井索。问燕子深谈实相善说法要此理如何。师曰。不及雁啣芦。问如何是佛。师曰。华阳洞口乌龟。问鲁祖面壁意旨如何。师曰。金木水火土。罗睺计都星。问有句无句如藤倚树时如何。师曰。作贼人心虚。曰国师三唤侍者又作么生。师曰。打鼓弄猢狲鼓破猢狲走。丙寅七月十八日召法属长老宗范付后事。次日沐浴声钟集众就座泊然而逝。荼毘日送者均获设利。奉灵骨塔于鼓山
  ref: T51n2077_p0667c02（续传灯录）
