id: 袁州杨岐山甄叔禅师
name: 袁州杨岐山甄叔
school: 杨岐派
teacher: 马祖一
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0113b09。
sayings:
- text: 上堂。群灵一源。假名为佛。体竭形销而不灭。金流朴散而常存。性海无风。金波自涌。心灵绝非。万象齐照。体斯理者。不言而遍历沙界。不用而功益玄化。如何背觉。反合尘劳。于阴界中。妄自囚执。禅月
  ref: X80n1565_p0113b09（五灯会元）
- text: 问。如何是祖师西来意。师呈起数珠。月罔措。师曰。会么。曰。不会。师曰。某甲参见石头来。曰。见石头得何意旨。师指庭前鹿曰。会么。曰。不会。师曰。渠侬得自由。唐元和十五年归寂。茶毗获舍利七百粒。于东峰下建塔
  ref: X80n1565_p0113b09（五灯会元）
