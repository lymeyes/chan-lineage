id: 北禅智贤禅师
name: 北禅智贤
alias: 北禅贤
school: 曹洞宗
teacher: 福严雅禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《续传灯录》T51n2077_p0479a22。
sayings:
- text: 僧问。师唱谁家曲宗风嗣阿谁。师曰。掷盋峰峦秀名高海外传
  ref: T51n2077_p0479a22（续传灯录）
- text: 僧云。昔日福严亲得旨。今朝此地化迷途。师曰。终是饱丛林。问如何是佛。师曰。匙挑不起
  ref: T51n2077_p0479a22（续传灯录）
- text: 僧云。如何是道。师曰。险路架桥。除夕
  ref: T51n2077_p0479a22（续传灯录）
- text: 示众曰。年穷岁尽。无可与大众分岁。老僧烹一头露地白牛。炊土田米饭。煮菜根烧榾柮火。与大众围炉唱归田乐。何以如此。免得倚他门户傍他墙致使时人唤作郎。下座。时有僧从后大呼曰。县有吏至。师反顾问其所以
  ref: T51n2077_p0479a22（续传灯录）
- text: 僧云。和尚杀牛未纳皮角。师笑掷煖帽于地与之。僧就地拾得跪进云。天寒还和尚帽子。师顾问侍者倚遇曰。如何。遇云。近日城中纸贵一状领过。又
  ref: T51n2077_p0479a22（续传灯录）
- text: 上堂良久曰。冤苦冤苦。作什么百丈不在。老僧今日困下座。又
  ref: T51n2077_p0479a22（续传灯录）
- text: 上堂呵呵大笑曰。争怪得老僧。衡岳振禅师南岳衡岳寺振禅
  ref: T51n2077_p0479a22（续传灯录）
- text: 师示众曰。阿呵呵。瘦松寒竹锁清波。有时独坐磐陀上。无人共唱太平歌。朝看白云生洞口。暮观明月照娑婆。有人问我居山事。三尺杖子搅黄河
  ref: T51n2077_p0479a22（续传灯录）
