id: L::临安府净慈水庵师一禅师
name: 临安府净慈水庵师一
school: 杨岐派
teacher: 育王裕
status: draft
bio: 婺州马氏子。十六披削。首参雪峰慧照禅师。照举藏身无迹话问之。师数日方明。呈偈曰。藏身无迹更无藏。脱体无依便厮当。古镜不劳还自照。淡烟和雾湿秋光。照质之曰。毕竟那里是藏身无迹处。师曰。嗄。照曰。无踪迹处因甚么莫藏身。师曰。石虎吞却木羊儿。照深肯之。住后
sayings:
- text: 上堂。举。圆悟师翁道。参禅参到无参处。参到无参始彻头。水庵则不然。参禅参到无参处。参到无参未彻头。若也欲穷千里目。直须更上一层楼
  ref: X80n1565_p0808a16（五灯会元）
- text: 上堂。冻云欲雪未雪。普贤象驾峥嵘。岭梅半合半开。少室风光漏泄。便恁么去犹是半提。作么生是全提底事。无智人前莫说。打你头破额裂
  ref: X80n1565_p0808a16（五灯会元）
- text: 示众曰。尽十方世界明皎皎地。若有一丝头。即是一丝头。师竖起拂子曰。还见么。穿过髑髅犹未觉。法灯云。尽十方世界自然明皎皎地。若有一丝头。不是一丝头。师曰。夜来月色十分好。今日秋山无限清
  ref: X80n1565_p0808a16（五灯会元）
- text: 上堂。寂然不动。感而遂通古人恁么说话。大似预搔待痒。若教渠踏著衲僧关捩。管取别有生涯。喝一喝。卓拄杖下座
  ref: X80n1565_p0808a16（五灯会元）
