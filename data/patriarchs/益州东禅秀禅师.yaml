bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0579b11。
sayings:
- text: 僧问。既是善神。为甚么却被雷打。师曰。世乱奴欺主。年衰鬼弄人
  ref: X80n1565_p0579b11（五灯会元）
- text: 问。如何是一代时教。师曰。多年故纸
  ref: X80n1565_p0579b11（五灯会元）
