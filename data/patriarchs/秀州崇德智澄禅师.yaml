sayings:
- text: 上堂。觌面相呈。更无余事。若也如此。岂不俊哉。山僧盖不得已曲为诸人。若向衲僧面前。一点也著不得。诸禅德。且道衲僧面前说个甚么即得。良久曰。深秋帘幕千家雨。落日楼台一笛风
  ref: X80n1565_p0621a15（五灯会元）
