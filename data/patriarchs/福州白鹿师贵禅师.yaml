id: 福州白鹿师贵禅师
name: 福州白鹿师贵
school: —
teacher: 安国瑫禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0299a09。
sayings:
- text: 僧问。西峡一派。不异马头。白鹿千峰。何似鸡足。师曰。大众验看
  ref: X80n1565_p0299a09（五灯会元）
- text: 问。如何是白鹿家风。师曰。向汝道甚么。曰。恁么则便知时去也。师曰。知时底人合到甚么田地。曰。不可更口喃喃也。师曰。放过即不可
  ref: X80n1565_p0299a09（五灯会元）
- text: 问。牛头未见四祖时。百鸟衔花供养。见后为甚么不来。师曰。曙色未分人尽望。及乎天晓也如常
  ref: X80n1565_p0299a09（五灯会元）
