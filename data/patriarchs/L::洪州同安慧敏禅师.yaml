bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0512a10。
sayings:
- text: 问。诸圣以何为命。山曰。以不间断。师曰。还有向上事也无。山曰。有。师曰。如何是向上事。山曰。不从间断。师于言下有省。住后
  ref: X80n1565_p0512a10（五灯会元）
- text: 僧问。请师一句。师曰。好记取
  ref: X80n1565_p0512a10（五灯会元）
