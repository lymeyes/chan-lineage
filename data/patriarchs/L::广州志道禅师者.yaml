id: L::广州志道禅师者
name: 广州志道
school: —
teacher: 六祖大鉴旁出
status: draft
bio: 者南海人也。初参六祖。问曰。学人自出家覧涅槃经仅十余载。未明大意。愿和尚垂诲。祖曰。汝何处未了。对曰。诸行无常。是生灭法。生灭灭已。寂灭为乐。于此疑惑。祖曰。汝作么生疑。对曰。一切众生皆有二身。谓色身．法身也。色身无常。有生有灭。法身有常。无知无觉。经云生灭灭已。寂灭为乐者。未审是何身寂灭。何身受乐。若色身者。色身灭时。四大分散。全是苦。苦不可言乐。若法身寂灭。即同草木瓦石。谁当受乐。又法性是生灭之体。五蕴是生灭之用。一体五用。生灭是常。生则从体起用。灭则摄用归体。若听更生。即有情之类不断不灭。若不听更生。即永归寂灭。同于无情之物。如是则一切诸法。被涅槃之所禁伏。尚不得生。何乐之有。祖曰。汝是释子。何习外道断常邪见。而议最上乘法。据汝所解。即色身外。别有法身。离生灭求于寂灭。又推涅槃常乐。言有身受者。斯乃执吝生死。耽著世乐。汝今当知。佛为一切迷人。认五蕴和合为自体相。分别一切法为外尘相。好生恶死。念念迁流。不知梦幻虗假。枉受轮回。以常乐涅槃翻为苦相。终日驰求。佛愍此故。乃示涅槃真乐。刹那无有生相。刹那无有灭相。更无生灭可灭。是则寂灭见前。当见前之时。亦无见前之量。乃谓常乐。此乐无有受者。亦无不受者。岂有一体五用之名。何况更言涅槃禁伏诸法。令永不生。斯乃谤佛毁法。听吾偈曰。无上大涅槃。圆明常寂照。凡愚谓之死。外道执为断。诸求二乘人。目以为无作。尽属情所计。六十二见本。妄立虗假名。何为真实义。唯有过量人。通达无取舍。以知五蕴法。及以蕴中我。外现众色象。一一音声相。平等如梦幻。不起凡圣见。不作涅槃解。二边三际断。常应诸根用。而不起用想。分别一切法。不起分别想。劫火烧海底。风鼓山相击。真常寂灭乐。涅槃相如是。吾今强言说。令汝舍邪见。汝勿随言解。许汝知少分。师闻偈踊跃。作礼而退
