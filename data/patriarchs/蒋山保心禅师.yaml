id: 蒋山保心禅师
name: 蒋山保心
school: —
teacher: 石霜楚圆禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0444a08。
sayings:
- text: 僧问。月未圆时如何。师曰。顺数将去。曰。圆后如何。师曰。倒数将来
  ref: X80n1565_p0444a08（五灯会元）
- text: 问。如何是吹毛剑。师曰。黑漆露柱
  ref: X80n1565_p0444a08（五灯会元）
- text: 问。声色两字如何透得。师曰。一手吹。一手拍
  ref: X80n1565_p0444a08（五灯会元）
