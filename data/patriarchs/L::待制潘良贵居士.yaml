id: L::待制潘良贵居士
name: 待制潘良贵
school: 杨岐派
teacher: 何山珣
status: draft
bio: 字义荣。年四十。回心祖闱。所至挂钵。随众参扣。后依佛灯。久之不契。因诉曰。某祇欲死去时如何。灯曰。好个封皮。且留著使用。而今不了不当。后去忽被他换却封皮。卒无整理处。公又以南泉斩猫儿话问曰。某看此甚久。终未透彻。告和尚慈悲。灯曰。你祇管理会别人家猫儿。不知走却自家狗子。公于言下如醉醒。灯复曰。不易。公进此一步。更须知有向上事始得。如今士大夫说禅说道。祇依著义理便快活。大率似将钱买油糍。吃了便不饥。其余便道是瞒他。亦可笑也。公唯唯
