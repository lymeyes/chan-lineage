id: 襄州关南道吾和尚
name: 襄州关南道吾
school: 南岳系
teacher: 关南常禅师
status: draft
bio: 始经村墅。闻巫者乐神云识神无。忽然省悟。后参常禅师。印其所解。复游德山之门。法味弥著。住后。凡
sayings:
- text: 上堂。戴莲华笠。披襕执简。击鼓吹笛。口称鲁三郎神。识神不识神。神从空里来。却往空里去。便下座。有时曰。打动关南鼓。唱起德山歌
  ref: X80n1565_p0158a12（五灯会元）
- text: 僧问。如何是祖师西来意。师以简揖曰。喏。有时执木剑。横肩上作舞
  ref: X80n1565_p0158a12（五灯会元）
- text: 僧问。手中剑甚处得来。师掷于地。僧却置师手中。师曰。甚处得来。僧无对。师曰。容汝三日内。下取一转语。其僧亦无对。师自代拈剑横肩上。作舞曰。须恁么始得。赵州访师。师乃著豹皮裩。执吉獠棒。在三门下翘一足等候。才见州便高声唱喏而立。州曰。小心祇候著。师又唱喏一声而去
  ref: X80n1565_p0158a12（五灯会元）
- text: 问。如何是和尚家风。师下禅床作女人拜曰。谢子远来。无可祇待。问灌溪。作么生。溪曰。无位。师曰。莫同虗空么。溪曰。这屠儿。师曰。有生可杀即不倦
  ref: X80n1565_p0158a12（五灯会元）
