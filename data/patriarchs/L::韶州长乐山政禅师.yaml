bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0571a06。
sayings:
- text: 僧问。祖师心印。何人提掇。师曰。石人妙手在。曰。学人还有分也无。师曰。木人整不齐
