id: L::百丈山涅槃和尚
name: 百丈山涅槃
school: 南岳系
teacher: 百丈海
status: draft
bio: 一日谓众曰。汝等与我开田。我与汝说大义。众开田了。归请说大义。师乃展两手。众罔措洪觉范林间录云。百丈第二代法正禅师。大智之高弟。其先尝诵涅槃经。不言姓名。时呼为涅槃和尚。住成法席。师功最多。使众开田。方说大义者。乃师也。黄檗。古灵诸大士皆推尊之。唐文人黄武翊撰其󳬴甚详。柳公权书。妙绝今古。而传灯所载百丈惟政禅师。又系于马祖法嗣之列。悮矣。及观正宗记。则有惟政．法正。然百丈第代可数。明教但皆见其名。不能辨而俱存也。今当以柳󳬴为正
