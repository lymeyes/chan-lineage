id: L::温州大宁院可弘禅师
name: 温州大宁院可弘
school: 法眼宗
teacher: 天台韶
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0368a03。
sayings:
- text: 僧问。如何是正真一路。师曰。七颠八倒。曰。恁么则法门无别去也。师曰。我知汝错会去
  ref: X80n1565_p0368a03（五灯会元）
- text: 问。皎皎地无一丝头时如何。师曰。话头已堕。曰。乞师指示。师曰。适来亦不虗设
  ref: X80n1565_p0368a03（五灯会元）
- text: 问。向上宗乘。请
  ref: X80n1565_p0368a03（五灯会元）
- text: 师举扬。师曰。汝问太迟生。曰。恁么则不仙陀去也。师曰。深知汝恁么去
  ref: X80n1565_p0368a03（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0368a03），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
