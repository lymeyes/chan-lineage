bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0665b17。
sayings:
- text: 上堂。寒风激水成冰。杲日照冰成水。冰水本自无情。各各应时而至。世间万物皆然。不用强生拟议
  ref: X80n1565_p0665b17（五灯会元）
- text: 上堂。先师初事栖贤𬤊泐潭澄历二十年。宗门奇奥。经论玄要。莫不贯穿。及因云峰指见慈明。则一字无用。遂设三关语以验学者。而学者如叶公画龙。龙现即怖
  ref: X80n1565_p0665b17（五灯会元）
