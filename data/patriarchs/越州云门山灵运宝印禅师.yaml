id: 越州云门山灵运宝印禅师
name: 越州云门山灵运宝印
school: 云门宗
teacher: 大阳玄禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0527b08。
sayings:
- text: 上堂。夜来云雨散长空。月在森罗万象中。万象灵光无内外。当明一句若为通。不见
  ref: X80n1565_p0527b08（五灯会元）
- text: 僧问大哥和尚云。月生云际时如何。大哥曰。三个孩儿抱花鼓。莫来拦我球门路。月生云际。是明甚么边事。三个孩儿抱花鼓。拟思即隔。莫来拦我球门路。须有出身处始得。若无出身处。也似黑牛卧死水。出身一句作么生道。不劳久立
  ref: X80n1565_p0527b08（五灯会元）
