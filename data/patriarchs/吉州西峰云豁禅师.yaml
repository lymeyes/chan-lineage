id: 吉州西峰云豁禅师
name: 吉州西峰云豁
school: 云门宗
teacher: 清凉明
status: draft
bio: 郡之曾氏子。早扣诸方。晚见清凉
sayings:
- text: 问。佛未出世时如何。凉曰。云遮海门树。曰。出世后如何。凉曰。擘破铁围山。师于言下大悟。凉印可之。归住宝龙。云侣骈集。真宗皇帝遣使召至。访问宗要。留上苑。经时冥坐不食。上嘉异。赐号圆净。辞归。珍锡甚隆。皆不受。以诗宠其行。改宝龙曰祥符。旌师之居也。尝有问易中要旨者。师曰。夫神生于无形。而成于有形。从有以至于无。然后能合乎妙圆正觉之道。故自四十九衍。以至于万有一千五百二十。以穷天下之理。以尽天下之性。不异吾圣人之教也。示寂日。为众曰。天不高。地不厚。自是时人󳬇不透。但看腊月二十五。依旧面南看北斗。瞑然而逝。茶毗获设利建塔。青原下九世青原下九世
