id: 玄沙备禅师
name: 玄沙师备
honorific: 福州玄沙师备禅师（雪峰义存法嗣）
school: 青原系
dynasty: 唐末（835—908）
region: 福州玄沙院（今福建闽侯）
teacher: 雪峰义存
source_ref: 五灯会元·卷七·福州玄沙师备 / 景德传灯录·卷十八
cbeta: T51n2076 卷十八
bio: 雪峰义存之法嗣，与师兄罗汉桂琛齐名，法眼文益出其再传（桂琛→文益）。苦行精严，常以「山僧见处，与三世诸佛、六代祖师无异」勘验学人，力倡「备头陀」之躬行。玄沙一系，下启法眼宗之「一切现成」。
sayings:
- text: 师示众：「诸方老宿，有百步千里、千里百步底，你诸人，各各有一坐具地，且道：那里是你诸人坐具地？」
  ref: 五灯会元·卷七·玄沙师备
- text: 师常云：「若论此事，如一片田地相似，一任众人耕种，无有一人不承此力。」（示人人本具佛性）
  ref: 五灯会元·卷七·玄沙师备
status: draft
verify: 待 CBETA 校对玄沙师备机缘。
