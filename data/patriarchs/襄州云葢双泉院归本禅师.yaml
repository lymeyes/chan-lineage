id: 襄州云葢双泉院归本禅师
name: 襄州云葢双泉院归本
school: —
teacher: 雪峰存
status: draft
bio: 京兆府人也。初谒雪峰。礼拜次。峰下禅床。跨背而坐。师于此有省。住后
sayings:
- text: 僧问。如何是双泉。师曰。可惜一双眉。曰。学人不会。师曰。不曾烦禹力。湍流事不知
  ref: X80n1565_p0266a01（五灯会元）
- text: 问。如何是西来的的意。师乃搊住。其僧变色。师曰。我这里无这个。师手指纤长。特异于人。号手相大师
  ref: X80n1565_p0266a01（五灯会元）
