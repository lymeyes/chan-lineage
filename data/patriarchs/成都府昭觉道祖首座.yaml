id: 成都府昭觉道祖首座
name: 成都府昭觉道祖首座
school: 杨岐派
teacher: 昭觉勤
status: draft
bio: 初见圆悟。于即心是佛语下发明。久之。悟命分座。一日为众入室。余二十许人。师忽问曰。生死到来。如何回避。僧无对。师掷下拂子。奄然而逝。众皆愕眙。亟以闻悟。悟至。召曰。祖首座。师张目视之。悟曰。抖擞精神透关去。师点头。竟尔趋寂
