id: 新罗国龟山和尚
name: 新罗国龟山
school: —
teacher: 长庆慧稜禅师
status: draft
bio: 有人举裴相国启建法会。问僧。看甚么经。曰。无言童子经。公曰。有几卷。曰。两卷。公曰。既是无言。为甚么却有两卷。僧无对。师代曰。若论无言。非唯两卷
