id: L::陇州国清院奉禅师
name: 陇州国清院奉
school: 南岳系
teacher: 赵州谂
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0156a13。
sayings:
- text: 僧问。祖意教意是同是别。师曰。雨滋三草秀。春风不裹头。曰。毕竟是一是二。师曰。祥云竞起。岩洞不亏
  ref: X80n1565_p0156a13（五灯会元）
- text: 问。如何是和尚家风。师曰。台盘椅子。火炉窗牗
  ref: X80n1565_p0156a13（五灯会元）
- text: 问。如何是出家人。师曰。铜头铁额。鸟觜鹿身。曰。如何是出家人本分事。师曰。早起不审。夜间珍重
  ref: X80n1565_p0156a13（五灯会元）
- text: 问。牛头未见四祖时。为甚么百鸟衔花。师曰。如陕府人送钱财与铁牛。曰。见后为甚么不衔花。师曰。木马投明行八百
  ref: X80n1565_p0156a13（五灯会元）
- text: 问。十二时中如何降伏其心。师曰。敲冰求火。论劫不逢
  ref: X80n1565_p0156a13（五灯会元）
- text: 问。十二分教是止啼之义。离却止啼。请师一句。师曰。孤峰顶上双角女
  ref: X80n1565_p0156a13（五灯会元）
- text: 问。如何是佛法大意。师曰。释迦是牛头狱卒。祖师是马面阿旁
  ref: X80n1565_p0156a13（五灯会元）
- text: 问。如何是西来意。师曰。东壁打西壁
  ref: X80n1565_p0156a13（五灯会元）
- text: 问。如何是扑不破底句。师曰。不隔毫牦。时人远向
  ref: X80n1565_p0156a13（五灯会元）
