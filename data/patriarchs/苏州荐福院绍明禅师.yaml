bio: 生平部分原文未载，仅存机缘语（见下）；据《景德传灯录》T51n2076_p0419c02。
sayings:
- text: 问。如何是和尚家风。师曰。一切处看取。泽州古贤谨禅师泽州古贤院谨禅师。师勘
  ref: T51n2076_p0419c02（景德传灯录）
- text: 僧云。如来坚密身一功尘中现。如何是坚密身。僧竖指。师云。现即现尔怎生会。僧无语。师侍立次见净慧问一
  ref: T51n2076_p0419c02（景德传灯录）
- text: 僧云。自离此间什么处去来。曰入岭来。净慧曰。不易。曰虚涉他如许多山水。净慧曰。如许多山水也不恶。其僧无语。师于此言下大悟
  ref: T51n2076_p0419c02（景德传灯录）
- text: 僧问。如何是佛。师曰。筑著汝鼻孔
  ref: T51n2076_p0419c02（景德传灯录）
