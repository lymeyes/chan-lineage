id: 玉泉承皓禅师
name: 玉泉承皓
alias: 玉泉皓
school: 云门宗
teacher: 北塔思广禅师
status: draft
bio: 姓王氏。眉州丹棱人也。依大力院出家登具。后游方参北塔发明心要。得大自在三昧。制犊鼻裩书历代祖师名字。乃曰。唯有文殊普贤较些子。且书于带上。故丛林目为皓布裩。元丰间首众于襄阳谷隐。有乡僧亦效之。师见而诟曰。汝具何道理敢以为戏事耶。呕血无及耳。寻于鹿门如所言而逝。张无尽奉使京西南路就谒之。致开法于郢州大阳。时谷隐主者私为之喜。师受请升座曰。某在谷隐十年。不曾饮谷隐一滴水嚼谷隐一粒米。汝若不会来。大阳为汝说破。携拄杖下座傲然而去。寻迁玉泉。有
sayings:
- text: 示众曰。一夜雨霶烹打倒蒲萄棚。知事头首行者人力。拄底拄撑底撑。撑撑拄拄到天明。依旧可怜生。自赞粥稀后。坐床窄先卧。耳聩爱高声。眼昏宜字大。冬至
  ref: T51n2077_p0496a21（续传灯录）
- text: 示众曰。晷运推移布裩赫赤。莫怪不洗无来换替。僧入室次狗子在室中。师叱一声。狗便出去。师曰。狗却会尔却不会。师示疾门人围绕。师笑曰。吾年八十一。老死舁尸出。儿郎齐著力。一年三百六十日。言毕而逝
  ref: T51n2077_p0496a21（续传灯录）
