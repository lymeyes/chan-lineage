id: 宝寿沼禅师
name: 宝寿沼
school: 临济宗
teacher: 临济义玄
bio: 临济义玄禅师法嗣，住宝寿院。以「宝寿问讯」等机缘见称。
sayings:
- text: 师（临济）在僧堂内，宝寿入来问讯，师曰：「宝寿长老，作么生？」寿曰：「喏。」
  ref: 五灯会元·卷十一·临济义玄禅师
- text: 宝寿开堂，有僧问：「师唱谁家曲？」寿曰：「我在临济处学得来。」
  ref: 五灯会元·卷十一·宝寿沼禅师
status: draft
verify: 据《五灯会元》整理，待 CBETA 逐字校核原文与卷次；师承以谱系父节点为准。
