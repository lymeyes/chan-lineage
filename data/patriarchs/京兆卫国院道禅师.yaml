school: 南岳系
teacher: 百丈海
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0126b09。
sayings:
- text: 问。何方来。曰。河南来。师曰。黄河清也未。僧无对沩山代云。小小狐儿。要过但过。用疑作甚么。师不安。不见客。有人来谒。乃曰。久聆和尚道德。忽承法体违和。略请和尚相见。师将钵𫔁盛钵楮。令侍者擎出呈之。其人无对
  ref: X80n1565_p0126b09（五灯会元）
