id: 镇州普化和尚
name: 镇州普化
school: 南岳系
teacher: 盘山宝积禅师
status: draft
bio: 不知何许人也。师事盘山。密受真诀。而徉狂出言无度。暨盘山顺世。乃于北地行化。或城市。或冢间。振一铎曰。明头来。明头打。暗头来。暗头打。四方八面来。旋风打。虗空来。连架打。一日。临济令僧捉住曰。总不恁么来时如何。师拓开曰。来日大悲院里有斋。僧回举似济。济曰。我从来疑着这汉。凡见人无高下。皆振铎一声。时号普化和尚。或将铎就人耳边振之。或附其背。有回顾者。即展手曰。乞我一钱。非时遇食亦吃。尝暮入临济院吃生菜。济曰。这汉大似一头驴。师便作驴鸣。济谓直岁曰。细抹草料著。师曰。少室人不识。金陵又再来。临济一只眼。到处为人开。师见马步使出喝道。师亦喝道作相扑势。马步使令人打五棒。师曰。似即似。是即不是。师尝于阛阓间摇铎唱曰。觅个去处不可得。时道吾遇之。把住问曰。汝拟去甚么处。师曰。汝从甚么处来。吾无语。师掣手便去。临济一日与河阳木塔长老同在僧堂内坐。正说师每日在街市掣风掣颠。知他是凡是圣。师忽入来。济便
sayings:
- text: 问。汝是凡是圣。师曰。汝且道我是凡是圣。济便喝。师以手指曰。河阳新妇子。木塔老婆禅。临济小厮儿。却具一只眼。济曰。这贼。师曰。贼。贼。便出去。唐咸通初。将示灭。乃入市谓人曰。乞我一个直裰。人或与披袄。或与布裘。皆不受。振铎而去。临济令人送与一棺。师笑曰。临济厮儿饶舌。便受之。乃辞众曰。普化明日去东门死也。郡人相率送出城。师厉声曰。今日葬不合青乌。乃曰。明日南门迁化。人亦随之。又曰。明日出西门。方吉。人出渐稀。出已还返。人意稍怠。第四日。自擎棺出北门外。振铎入棺而逝。郡人奔走出城。揭棺视之。已不见。唯闻空中铎声渐远。莫测其由
