bio: 生平部分原文未载，仅存机缘语（见下）；据《续传灯录》T51n2077_p0516a02。
sayings:
- text: 僧问。如何是道。师曰。十字街头踏不著。曰便恁么去时如何。师曰。且缓缓
  ref: T51n2077_p0516a02（续传灯录）
- text: 上堂。清平过水投子卖油。一年三百六十日。不须频向数中求。以拂击禅床下座
  ref: T51n2077_p0516a02（续传灯录）
