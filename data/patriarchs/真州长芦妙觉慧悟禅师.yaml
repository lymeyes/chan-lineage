id: 真州长芦妙觉慧悟禅师
name: 真州长芦妙觉慧悟
school: 曹洞宗
teacher: 长芦清了禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0546b07。
sayings:
- text: 上堂。尽大地是个解脱门。把手拽不肯入。雪峰老汉抑逼人作么。既到这里。为甚么鼻孔在别人手里。良久曰。贪观天上月。失却手中桡
  ref: X80n1565_p0546b07（五灯会元）
- text: 僧问。雁过长空。影沈寒水。雁无遗踪之意。水无沈影之心。还端的也无。师曰。芦花两岸雪。江水一天秋。曰。便恁么去时如何。师曰。雁过长空𫆏。僧拟议。师曰。灵利衲子
  ref: X80n1565_p0546b07（五灯会元）
