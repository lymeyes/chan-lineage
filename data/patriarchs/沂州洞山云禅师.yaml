bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0533b18。
sayings:
- text: 上堂。秋风卷地。夜雨翻空。可中别有清凉。个里更无热恼。是谁活计。到者方知。才落见闻。即居途路。且道到家后如何。任运独行无伴侣。不居正位不居偏
  ref: X80n1565_p0533b18（五灯会元）
