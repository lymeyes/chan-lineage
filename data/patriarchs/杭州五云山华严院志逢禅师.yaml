id: 杭州五云山华严院志逢禅师
name: 杭州五云山华严院志逢
school: 法眼宗
teacher: 天台韶
status: draft
bio: 余杭人也。生恶荤血。肤体香洁。幼岁出家。于临安东山朗瞻院。依年受具。通贯三学。了达性相。尝梦升须弥山。睹三佛列坐。初释迦。次弥勒。皆礼其足。唯不识第三尊。但仰视而已。释尊谓之曰。此是补弥勒处师子月佛。师方作礼。觉后因阅大藏经。乃符所梦。天福中。游方抵天台云居。参国师。宾主缘契。顿发玄秘。一日入普贤殿中宴坐。倏有一神人跪膝于前。师
sayings:
- text: 问。汝其谁乎。曰。护戒神也。师曰。吾患有宿愆未殄。汝知之乎。曰。师有何罪。唯一小过耳。师曰。何也。曰。凡折钵水。亦施主物。师每倾弃。非所宜也。言讫而隐。师自此洗钵水尽饮之。积久因致脾疾。十载方愈凡折退饮食。及涕唾便利等。并宜鸣指。默念咒。发施心而倾弃之。吴越国王向师道风。召赐紫衣。署普觉禅师。命住临安功臣院
  ref: X80n1565_p0368a09（五灯会元）
- text: 上堂。诸上座舍一知识。参一知识。尽学善财南游之式样。且问上座。祇如善财礼辞文殊。拟登妙峰谒德云比丘。及到彼所。何以德云却于别峰相见。夫教意祖意。同一方便。终无别理。彼若明得。此亦昭然。诸上座即今簇著老僧。是相见是不相见。此处是妙峰。是别峰。脱或从此省去。可谓不孤负老僧。亦常见德云比丘。未尝刹那相舍离。还信得及么
  ref: X80n1565_p0368a09（五灯会元）
- text: 僧问。丛林举唱曲为今时。如何是功臣的的意。师曰。见么。曰。恁么则大众咸欣也。师曰。将谓师子儿
  ref: X80n1565_p0368a09（五灯会元）
- text: 问。佛佛授手。祖祖传心。未审和尚传个甚么。师曰。汝承当得么。曰。学人承当不得。还别有人承当得否。师曰。大众笑汝
  ref: X80n1565_p0368a09（五灯会元）
- text: 问。如何是如来藏。师曰。恰问著
  ref: X80n1565_p0368a09（五灯会元）
- text: 问。如何是诸佛机。师曰。道是得么
  ref: X80n1565_p0368a09（五灯会元）
- text: 上堂。良久曰。大众看看。便下座
  ref: X80n1565_p0368a09（五灯会元）
- text: 上堂。古德为法行脚。不惮勤劳。如雪峰三到。投子九上。洞山盘桓往返。尚求个入路不得。看汝近世参学人。才跨门来。便要老僧接引。指示说禅。且汝欲造玄极之道。岂同等闲。而况此事亦有时节。躁求焉得。汝等要知悟时么。如今各且下去。堂中静坐。直待仰家峰点头。老僧即为汝说。时有僧出。曰。仰家峰点头也。请师说。师曰。大众且道。此僧会老僧语。不会老僧语。僧礼拜。师曰。今日偶然失鉴。有人问僧。无为无事人。为甚么却有金锁难。僧无对。师代云。祇为无为无事
  ref: X80n1565_p0368a09（五灯会元）
- text: 僧问。教中道。文殊忽起佛见法见。被佛威神摄向二铁围山。意旨如何。师曰。甚么处是二铁围山。僧无语。师曰。还会么。如今若有人起佛法之见。吾与烹茶两瓯。且道赏伊罚伊。同教意不同教意。开宝四年。大将凌超于五云山创院。奉师为终老之所。师每𢹂大扇乞钱。买肉饲虎。虎每迎之。载以还山。雍熙二年示寂。塔于本院
  ref: X80n1565_p0368a09（五灯会元）
