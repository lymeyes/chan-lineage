id: 荆门上泉和尚
name: 荆门上泉
school: 法眼宗
teacher: 清凉益
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0366b06。
sayings:
- text: 僧问。二龙争珠。谁是得者。师曰。我得
  ref: X80n1565_p0366b06（五灯会元）
- text: 问。远远投师。如何一接。师按杖视之。其僧礼拜。师便喝
  ref: X80n1565_p0366b06（五灯会元）
- text: 问。尺璧无瑕时如何。师曰。我不重。曰。不重后如何。师曰。火里蝍蟟飞上天
  ref: X80n1565_p0366b06（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0366b06），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
