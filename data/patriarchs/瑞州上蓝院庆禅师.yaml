id: 瑞州上蓝院庆禅师
name: 瑞州上蓝院庆
school: 曹洞宗
teacher: 洞山延禅师
status: draft
bio: 初游方。问雪峰。如何是雪峰的的意。峰以杖子敲师头。师应诺。峰大笑。师后承洞山印解。开法上蓝
sayings:
- text: 僧问。如何是上蓝无刃剑。师曰。无。曰。为甚么无。师曰。阇黎。诸方自有
  ref: X80n1565_p0512a06（五灯会元）
