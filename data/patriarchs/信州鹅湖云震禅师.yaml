bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0573a14。
sayings:
- text: 僧问。如何是佛。师曰。阇黎不是。问僧。近离甚处。曰。两浙。师曰。还将得吹毛剑来否。僧展两手。师曰。将谓是个烂柯仙。元来却是樗蒲汉
  ref: X80n1565_p0573a14（五灯会元）
- text: 问。如何是鹅湖家风。师曰。客是主人相师。曰。恁么则谢师周旋去也。师曰。难下陈蕃之榻
  ref: X80n1565_p0573a14（五灯会元）
