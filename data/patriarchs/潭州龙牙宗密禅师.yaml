id: 潭州龙牙宗密禅师
name: 潭州龙牙宗密
school: 黄龙派
teacher: 泐潭干禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0701b05。
sayings:
- text: 僧问。如何是佛。师曰。莫寐语
  ref: X80n1565_p0701b05（五灯会元）
- text: 问。如何是一切法。师曰。早落第二
  ref: X80n1565_p0701b05（五灯会元）
- text: 上堂。大众集。师曰。已是团𪢮。不劳雕琢。归堂吃茶
  ref: X80n1565_p0701b05（五灯会元）
- text: 上堂。休把庭华类此身。庭华落后更逢春。此身一往知何处。三界茫茫愁杀人
  ref: X80n1565_p0701b05（五灯会元）
