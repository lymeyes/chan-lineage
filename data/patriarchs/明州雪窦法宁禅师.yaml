bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0644b06。
sayings:
- text: 上堂。百川异流。以海为极。森罗万象。以空为极。四圣六凡。以佛为极。明眼衲子。以拄杖子为极。且道拄杖子以何为极。有人道得。山僧两手分付。傥或未然。不如闲倚禅床畔。留与儿孙指路头
  ref: X80n1565_p0644b06（五灯会元）
