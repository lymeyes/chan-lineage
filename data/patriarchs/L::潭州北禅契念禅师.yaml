bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0520a11。
sayings:
- text: 僧问。如何是大道之源。师曰。众流混不得。曰。独脱事如何。师曰。穿云透石
  ref: X80n1565_p0520a11（五灯会元）
- text: 问。如何是不坠古今句。师曰。十五十六。日月相逐
  ref: X80n1565_p0520a11（五灯会元）
