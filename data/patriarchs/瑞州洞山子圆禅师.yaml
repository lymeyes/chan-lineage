sayings:
- text: 上堂。有僧出抛下坐具。师曰。一钓便上。僧提起坐具。师曰。弄巧成拙。僧曰。自古无生曲。须是遇知音。师曰。波斯入唐土。僧大笑归众
  ref: X80n1565_p0451b11（五灯会元）
