bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0380b02。
sayings:
- text: 问。某甲收金陵。布阵杀人无数。还有罪也无。师曰。老僧祇管看
  ref: X80n1565_p0380b02（五灯会元）
- text: 问。如何是祖师西来意。师曰。洋澜左蠡。无风浪起
  ref: X80n1565_p0380b02（五灯会元）
