bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0624b12。
sayings:
- text: 上堂。横按拄杖。召大众曰。还识上蓝老汉么。眼似木𣔻。口如匾担。无问精粗。不知咸淡。与么住持。百千过犯。诸禅德。还有为山僧忏悔底么。良久曰。气急杀人。卓拄杖。下座
  ref: X80n1565_p0624b12（五灯会元）
