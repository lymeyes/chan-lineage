id: L::京兆草堂和尚
name: 京兆草堂
school: 南岳系
teacher: 马祖一
status: draft
bio: 自罢参大寂。至海昌和尚处。昌
sayings:
- text: 问。甚么处来。师曰。道场来。昌曰。这里是甚么处。师曰。贼不打贫人家
  ref: X80n1565_p0118a06（五灯会元）
- text: 僧问。未有一法时。此身在甚么处。师作一圆相。于中书身字
  ref: X80n1565_p0118a06（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0118a06），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
