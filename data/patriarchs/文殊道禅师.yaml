bio: 四首野狐野狐石崇富贵篯铿寿，潘岳容仪子建才。但愿东风齐著力，一时吹入我门来。勘婆勘婆三月春光上国游，祥云瑞气鏁龙楼。亲从宣德门前过，更问行人觅汴州。狗子无佛性狗子无佛性狗子佛性无，老蚌吐明珠。西川鸣杜宇，江南啼鹧鸪。烧木佛烧木佛彭祖八百乞延寿，秦皇登位更求仙。昨向天津桥上过，石崇犹自送穷船
