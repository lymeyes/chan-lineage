sayings:
- text: 上堂云。汝等诸人只得大体不得大用。师抽身出去。沩山召之。师更不回顾。沩山云。此子堪为法器。师一日辞沩山入岭云。某甲辞违和尚。千里之外不离左右。沩山动容曰。善为
