id: 庐山开先照禅师
name: 庐山开先照
school: 云门宗
teacher: 披云寂禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0584b11。
sayings:
- text: 僧问。向上宗乘。乞师垂示。师曰。白云断处见明月。曰。犹是学人疑处。师曰。黄叶落时闻捣衣
  ref: X80n1565_p0584b11（五灯会元）
- text: 问。如何是和尚家风。师曰。一条寒㵎木。得力胜儿孙。曰。用者如何。师曰。百杂碎
  ref: X80n1565_p0584b11（五灯会元）
- text: 上堂。丛林规矩。古佛家风。一参一请。一粥一饭。且道明得个甚么。祇如诸人心心不停。念念不住。若能不停处停。念处无念。自合无生之理。与么说话。笑破他人口。参
  ref: X80n1565_p0584b11（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0584b11），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
