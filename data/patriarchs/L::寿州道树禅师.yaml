id: L::寿州道树禅师
name: 寿州道树
school: —
teacher: 北宗秀
status: draft
bio: 唐州人也。姓闻氏。幼探经籍。年将五十。因遇高僧诱谕。遂誓出家。礼本部明月山慧文为师。师耻乎年长。求法淹迟。励志游方。无所不至。后归东洛。遇秀禅师。言下知微。乃卜寿州三峰山。结茅而居。常有野人。服色素朴。言谭诡异。于言笑外化作佛形及菩萨．罗汉．天仙等形。或放神光。或呈声响。师之学徒睹之。皆不能测。如此涉十年。后寂无形影。师告众曰。野人作多色伎俩。眩惑于人。只消老僧不见不闻。伊伎俩有穷。吾不见不闻无尽。唐宝历元年。示疾而终。嵩岳安国师法嗣嵩岳安国师法嗣
