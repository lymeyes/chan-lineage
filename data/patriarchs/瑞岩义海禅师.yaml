id: 瑞岩义海禅师
name: 瑞岩义海
alias: 瑞岩海
school: 法眼宗
teacher: 云居齐禅师
status: draft
bio: 霅川胡氏子。造云居法席。居
sayings:
- text: 问。甚么物恁么来。师于言下大悟。遂有颂曰。云居甚么物。问著头恍忽。直下便承当。犹是生埋没。出世住报本
  ref: T51n2077_p0533a14（续传灯录）
- text: 僧问。如何是祖师西来意。师曰。若到诸方。但道报本不解答话。问如何是和尚家风。师曰。无忌讳。曰忽遇触忤又且如何。师曰。不解作客劳烦主人。问释迦掩室于磨竭。净名杜口于毘耶。未审如何
  ref: T51n2077_p0533a14（续传灯录）
- text: 示众。师曰。汝不欲我开谈。曰未晓师机。师曰。且退。问如何是无位真人。师曰。这里无安排尔处。广慧智全禅师明州广慧志全禅师杭州卫氏子
  ref: T51n2077_p0533a14（续传灯录）
- text: 上堂僧问。如何是衲僧本分事。师曰。尔莫钝置我。僧礼拜。师曰。却是大众钝置阇梨。便下座。问贼不打贫儿家时如何。师曰。说向人也不信。僧曰。恁么则礼拜而退。师曰。得个甚么
  ref: T51n2077_p0533a14（续传灯录）
