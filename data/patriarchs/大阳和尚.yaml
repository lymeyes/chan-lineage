id: 大阳和尚
name: 大阳
school: 南岳系
teacher: 马祖道一禅师
status: draft
bio: 因伊禅师相见。乃问伊禅。近日有一般知识。向目前指教人。了取目前事。作这个为人。还会文彩未兆时也无。曰。拟向这里致一
sayings:
- text: 问。不知可否。师曰。答汝已了。莫道可否。曰。还识得目前也未。师曰。若是目前。作么生识。曰。要且遭人检点。师曰。谁。曰。某甲。师便喝。伊退步而立。师曰。汝只解瞻前。不解顾后。曰。雪上更加霜。师曰。彼此无便宜
  ref: X80n1565_p0116a07（五灯会元）
