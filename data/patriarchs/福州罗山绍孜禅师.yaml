id: 福州罗山绍孜禅师
name: 福州罗山绍孜
school: 青原系
teacher: 罗山闲禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0275a13。
sayings:
- text: 上堂。有数僧争出问话。师曰。但一齐出来
  ref: X80n1565_p0275a13（五灯会元）
- text: 问。待老僧一齐与汝答。僧便
  ref: X80n1565_p0275a13（五灯会元）
- text: 问。请师一齐答。师曰。得
  ref: X80n1565_p0275a13（五灯会元）
- text: 问。学人乍入丛林。祖师的的意。请师直指。师曰。好
  ref: X80n1565_p0275a13（五灯会元）
