id: 袁州南源道明禅师
name: 袁州南源道明
school: 南岳系
teacher: 马祖一
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0107a09。
sayings:
- text: 上堂。快马一鞭。快人一言。有事何不出头来。无事各自珍重
  ref: X80n1565_p0107a09（五灯会元）
- text: 僧问。一言作么生。师乃吐舌云。待我有广长舌相。即向汝道。洞山参。方上法堂。师曰。已相见了也。山便下去。明日却上。问曰。昨日已蒙和尚慈悲。不知甚么处是与某甲已相见处。师曰。心心无间断。流入于性海。山曰。几合放过。山辞。师曰。多学佛法。广作利益。山曰。多学佛法即不
  ref: X80n1565_p0107a09（五灯会元）
- text: 问。如何是广作利益。师曰。一物莫违
  ref: X80n1565_p0107a09（五灯会元）
- text: 僧问。如何是佛。师曰。不可道你是也
  ref: X80n1565_p0107a09（五灯会元）
