id: 庐州南天王永平禅师
name: 庐州南天王永平
school: 云门宗
teacher: 云门文偃禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0572a17。
sayings:
- text: 僧问。如何是西来意。师曰。不撒沙
  ref: X80n1565_p0572a17（五灯会元）
- text: 问。如何是南天王境。师曰。一任观看。曰。如何是境中人。师曰。且领前话
  ref: X80n1565_p0572a17（五灯会元）
- text: 问。久战沙场。为甚么功名不就。师曰。祇为眠霜卧雪深。曰。恁么则罢息干戈。束手归朝去也。师曰。指挥使未到你在
  ref: X80n1565_p0572a17（五灯会元）
