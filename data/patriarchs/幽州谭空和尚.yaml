id: 幽州谭空和尚
name: 幽州谭空
school: 临济宗
teacher: 临济义玄禅师
status: draft
bio: 镇州牧有姑为尼。行脚回。欲开堂为人。牧令师勘过。师问曰。见说汝欲开堂为人。是否。尼曰。是。师曰。尼是五障之身。汝作么生为人。尼曰。龙女八岁。南方无垢世界成等正觉又作么生。师曰。龙女有十八变。你试一变看。尼曰。设使变得。也祇是个野狐精。师便打。牧闻举乃曰。和尚棒折那
sayings:
- text: 僧问。德山棒。临济喝。未审那个最亲。师曰。已前在众里。老僧也曾商量来。僧便喝。师曰。却是汝会。僧曰。错。师便打
  ref: X80n1565_p0397b03（五灯会元）
- text: 上堂。众集。有僧出曰。拟问不问时如何。师曰。嗄。僧便喝。师曰。㘞。僧又喝。师拈拄杖。僧曰。瞎。师抛下拄杖。曰。今日失利。僧曰。草贼大败。便归众。师以手向空点一点。曰。大众。还有人辩得么。若有辩得者。出来对众道看。师良久。曰。顶门上眼。也鉴不破。便下座。宝寿和尚
  ref: X80n1565_p0397b03（五灯会元）
- text: 问。除却中上二根人来时。师兄作么生。师曰。汝适来举早错也。寿曰。师兄也不得无过。师曰。汝却与我作师兄。寿侧掌曰。这老贼
  ref: X80n1565_p0397b03（五灯会元）
