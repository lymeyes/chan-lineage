id: 台州护国守昌禅师
name: 台州护国守昌
school: 法眼宗
teacher: 净因成
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0542b06。
sayings:
- text: 上堂。拈拄杖卓曰。三十六旬之开始。七十二候之起元。万󳬛迎和气之时。东帝布生成之令。直得天垂瑞彩。地拥贞祥。微微细雨洗寒空。淡淡春光笼野色。可谓应时纳祐。庆无不宜。尽大地人。皆添一岁。敢问诸人。且道那一人年多少。良久曰。千岁老儿颜似玉。万年童子鬓如丝
  ref: X80n1565_p0542b06（五灯会元）
