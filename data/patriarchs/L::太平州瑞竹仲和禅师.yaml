sayings:
- text: 僧问。得坐披衣人尽委。向上宗乘事若何。师曰。但知冰是水。曰。更有事也无。师曰。休问水成冰。曰。弄潮须是弄潮人。师曰。这僧从浙中来
  ref: X80n1565_p0454a12（五灯会元）
