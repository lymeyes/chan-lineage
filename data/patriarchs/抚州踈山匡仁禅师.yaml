id: 抚州踈山匡仁禅师
name: 抚州踈山匡仁
school: 曹洞宗
teacher: 洞山良价禅师
status: draft
bio: 吉州新淦人。投本州元证禅师出家。一日。告其师。往东都。听习未经岁月。忽曰。寻行数墨。语不如默。舍己求人。假不如真。遂造洞山。值山早参。出
sayings:
- text: 问。未有之言。请师示诲。山曰。不诺无人肯。师曰。还可功也无。山曰。你即今还功得么。师曰。功不得即无讳处。山他日
  ref: X80n1565_p0482a10（五灯会元）
- text: 上堂曰。欲知此事。直须如枯木生花。方与他合
  ref: X80n1565_p0482a10（五灯会元）
- text: 师问。一切处不乖时如何。山曰。阇黎。此是功勋边事。幸有无功之功。子何不
  ref: X80n1565_p0482a10（五灯会元）
- text: 问。师曰。无功之功。岂不是那边人。山曰。大有人笑子恁么
  ref: X80n1565_p0482a10（五灯会元）
- text: 问。师曰。恁么则迢然去也。山曰。迢然非迢然。非不迢然。师曰。如何是迢然。山曰。唤作那边人。即不得。师曰。如何是非迢然。山曰。无辨处。山问师。空劫无人家。是甚么人住处。师曰。不识。山曰。人还有意旨也无。师曰。和尚何不问他。山曰。现问次。师曰。是何意旨。山不对。洎洞山顺世。弟子礼终。乃到潭州大沩。值沩
  ref: X80n1565_p0482a10（五灯会元）
- text: 示众。曰。行脚高士。直须向声色里睡眠。声色里坐卧。始得。师出
  ref: X80n1565_p0482a10（五灯会元）
- text: 问。如何是不落声色句。沩竖起拂子。师曰。此是落声色句。沩放下拂子。归方丈。师不契。便辞香严。严曰。何不且住。师曰。某甲与和尚无缘。严曰。有何因缘。试举看。师遂举前话。严曰。某甲有个语。师曰。道甚么。严曰。言发非声。色前不物。师曰。元来此中有人。遂嘱香严曰。向后有住处。某甲却来相见。乃去。沩问严曰。问声色话底矮阇黎在么。严曰。已去也。沩曰。曾举向子么。严曰。某甲亦曾对他来。沩曰。试举看。严举前语。沩曰。他道甚么。严曰。深肯某甲。沩失笑曰。我将谓这矮子有长处。元来祇在这里。此子向去。若有个住处。近山无柴烧。近水无水吃。师闻福州大沩安和尚
  ref: X80n1565_p0482a10（五灯会元）
- text: 示众曰。有句无句。如藤倚树。师特入岭到彼。值沩泥壁。便
  ref: X80n1565_p0482a10（五灯会元）
- text: 问。承闻和尚道。有句无句。如藤倚树。是否。沩曰。是。师曰。忽遇树倒藤枯。句归何处。沩放下泥槃。呵呵大笑。归方丈。师曰。某甲三千里卖却布单。特为此事而来。和尚何得相弄。沩唤侍者。取二百钱与这上座去。遂嘱曰。向后有独眼龙为子点破在。沩山次日
  ref: X80n1565_p0482a10（五灯会元）
- text: 上堂。师出问。法身之理。理绝玄微。不夺是非之境。犹是法身边事。如何是法身向上事。沩举起拂子。师曰。此犹是法身边事。沩曰。如何是法身向上事。师夺拂子。折折掷向地上。便归众。沩曰。龙蛇易辨。衲子难瞒。后闻婺州明招谦和尚出世谦眇一目。径往礼拜。招
  ref: X80n1565_p0482a10（五灯会元）
- text: 问。甚处来。师曰。闽中来。招曰。曾到大沩否。师曰。到。招曰。有何言句
  ref: X80n1565_p0482a10（五灯会元）
- text: 师举前话。招曰。沩山可谓头正尾正。祇是不遇知音。师亦不省。复
  ref: X80n1565_p0482a10（五灯会元）
- text: 问。忽遇树倒藤枯。句归何处。招曰。却使沩山笑转新。师于言下大悟。乃曰。沩山元来笑里有刀。遥望礼拜。悔过。招一日
  ref: X80n1565_p0482a10（五灯会元）
- text: 问。虎生七子。那个无尾巴。师曰。第七个无尾巴。香严出世。师不爽前约。遂往访之。严
  ref: X80n1565_p0482a10（五灯会元）
- text: 上堂。僧问。不求诸圣．不重己灵时如何。严曰。万机休罢。千圣不𢹂。师在众作呕声。曰。是何言欤。严闻便下座。曰。适对此僧语必有不是。致招师叔如是。未审过在甚么处。师曰。万机休罢。犹有物在。千圣不携。亦从人得。如何无过。严曰。却请师叔道。师曰。若教某甲道。须还师资礼始得。严乃礼拜。蹑前
  ref: X80n1565_p0482a10（五灯会元）
- text: 问。师曰。何不道肯诺不得全。严曰。肯又肯个甚么。诺又诺于阿谁。师曰。肯即肯他千圣。诺即诺于己灵。严曰。师叔恁么道。向去倒屙三十年在。师到夹山。山
  ref: X80n1565_p0482a10（五灯会元）
- text: 上堂。师问。承师有言。目前无法。意在目前。如何是非目前法。山曰。夜月流辉。澄潭无影。师作掀禅床势。山曰。阇黎作么生。师曰。目前无法。了不可得。山曰。大众看取。这一员战将。师参岩头。头见来。乃低头佯睡。师近前而立。头不顾。师拍禅床一下。头回首曰。作甚么。师曰。和尚且瞌睡。拂袖便行。头呵呵大笑曰。三十年弄马骑。今日被驴扑。回谒石霜机语具石霜章。遂归故里。出主蓝田。信士张霸迁
  ref: X80n1565_p0482a10（五灯会元）
- text: 问。和尚有何言句。师示偈曰。吾有一宝琴。寄之在旷野。不是不解弹。未遇知音者。后迁踈山
  ref: X80n1565_p0482a10（五灯会元）
- text: 上堂。病僧咸通年前。会得法身边事。咸通年后。会得法身向上事。云门出
  ref: X80n1565_p0482a10（五灯会元）
- text: 问。如何是法身边事。师曰。枯桩。曰。如何是法身向上事。师曰。非枯桩。曰。还许某甲说道理也无。师曰。许。曰。枯桩岂不是明法身边事。师曰。是。曰。非枯桩岂不是明法身向上事。师曰。是。曰。祇如法身。还该一切也无。师曰。法身周遍。岂得不该。门指净瓶曰。祇如净瓶。还该法身么。师曰。阇黎莫向净瓶边觅。门便礼拜。师问镜清。肯诺不得全。子作么生会。清曰。全归肯诺。师曰。不得全又作么生。清曰。个中无肯路。师曰。始惬病僧意。问僧。甚处来。曰。雪峰来。师曰。我已前到时。事事不足。如今足也未。曰。如今足也。师曰。粥足饭足。僧无对云门代云。粥足饭足。有僧为师造寿塔毕。白师。师曰。将多少钱与匠人。曰。一切在和尚。师曰。为将三钱与匠人。为将两钱与匠人。为将一钱与匠人。若道得。与吾亲造塔来。僧无语。后僧举似大岭庵闲和尚即罗山也。岭曰。还有人道得么。僧曰。未有人道得。岭曰。汝归与踈山道。若将三钱与匠人。和尚此生决定不得塔。若将两钱与匠人。和尚与匠人共出一只手。若将一钱与匠人。累他匠人眉须堕落。僧回如教而说。师具威仪望大岭作礼。叹曰。将谓无人。大岭有古佛放光。射到此间。虽然如是。也是腊月莲花。大岭后闻此语。曰。我恁么道。早是龟毛长三尺
  ref: X80n1565_p0482a10（五灯会元）
- text: 僧问。如何是诸佛师。师曰。何不问踈山老汉。僧无对。师常握木蛇。有
  ref: X80n1565_p0482a10（五灯会元）
- text: 僧问。手中是甚么。师提起曰。曹家女
  ref: X80n1565_p0482a10（五灯会元）
- text: 问。如何是和尚家风。师曰。尺五头巾。曰。如何是尺五头巾。师曰。圆中取不得。因鼓山举威音王佛师。师乃
  ref: X80n1565_p0482a10（五灯会元）
- text: 问。作么生是威音王佛师。山曰。莫无惭愧好。师曰。阇黎恁么道即得。若约病僧即不然。山曰。作么生是威音王佛师。师曰。不坐无贵位
  ref: X80n1565_p0482a10（五灯会元）
- text: 问。灵机未运时如何。师曰。夜半放白牛
  ref: X80n1565_p0482a10（五灯会元）
- text: 问。如何是一句。师曰。不道。曰。为甚么不道。师曰。少时辈
  ref: X80n1565_p0482a10（五灯会元）
- text: 问。久负不逢时如何。师曰。饶你雄信解拈枪。比逐秦王较百步。曰。正当恁么时如何。师曰。将军不上便桥。金牙徒劳拈筈
  ref: X80n1565_p0482a10（五灯会元）
- text: 问。如何是直指。师曰。珠中有水君不信。拟向天边问太阳。冬至
  ref: X80n1565_p0482a10（五灯会元）
- text: 上堂。僧问。如何是冬来意。师曰。京师出大黄
  ref: X80n1565_p0482a10（五灯会元）
- text: 问。和尚百年后向甚么处去。师曰。背抵芒丛。四脚指天。师临迁化。有偈
  ref: X80n1565_p0482a10（五灯会元）
- text: 示众曰。我路碧空外。白云无处闲。世有无根树。黄叶风送还。偈终而逝。塔于本山
  ref: X80n1565_p0482a10（五灯会元）
