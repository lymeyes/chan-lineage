id: 潭州衡岳寺奉能禅师
name: 潭州衡岳寺奉能
school: 临济宗
teacher: 浮山法远禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0453a13。
sayings:
- text: 上堂。宗风才举。万里云收。法令若行。千峰寒色。须弥顶上。白浪滔天。大海波中。红尘满地。应思黄梅昔日。少室当年。不能退己让人。遂使舂糠答志。断臂酬心。何似衡岳这里。山畬粟米饭。一桶没盐羹。苦乐共住。随高就低。且不是南头买贵。北头卖贱。直教文殊稽首。迦叶攒眉。龙树马鸣吞声饮气。目连鹙子且不能为。为甚如此。谛观法王法。法王法如是
  ref: X80n1565_p0453a13（五灯会元）
