id: L::天台山云峰光绪至德禅师
name: 天台山云峰光绪至德
school: —
teacher: 玄沙备
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《景德传灯录》T51n2076_p0373b29。
sayings:
- text: 上堂曰。但以众生日用而不知。譬如三千大千世界日月星辰江河淮济一切含灵从一毛孔入一毛孔。毛孔不小世界不大。其中众生不觉不知。若要易会上坐日用亦复不知
  ref: T51n2076_p0373b29（景德传灯录）
- text: 僧问。日里僧驮像夜里像驮僧。未审此意如何。师曰。阇梨岂不是从茶堂里来。福州大章山契如庵主福州大章山契如庵主福州永泰人也。泉州百丈村兜率院受业。素蕴孤操志探祖道。预玄沙之宫颖悟幽旨。玄沙记曰。子禅已逸格则他后要一人侍立也无。师自此不务聚徒不畜童侍。隐于小界山。刳大朽杉若小庵但容身而已。凡经游僧至随叩而应无定开示
  ref: T51n2076_p0373b29（景德传灯录）
- text: 僧问。生死到来如何回避。师曰。符到奉行。曰恁么即被生死拘将去也。师曰。阿邪邪。问西天持锡意作么生。师拈锡杖卓地振之。僧曰。未审此是什么义。师曰。遮个是张家打。僧拟进语。师以锡撺苍峦切之清豁冲煦二长老向师名未尝会遇。一旦同访之值师釆粟。豁问曰。道者如庵主在何所。师曰。从什么处来。曰山下来。师曰。因什么得到遮里。曰遮里是什么处所。师揖曰。去那下吃茶去。二公方省是师。遂诣庵所颇味高论。晤坐于左右不觉及夜。睹豺虎奔至庵前自然驯扰。豁因有诗曰。行不等闲行。谁知去住情。一餐犹未饱。万户勿聊生。非道应难伏。空拳莫与争。龙吟云起处。闲啸两三声。二公寻于大章山创庵请师居之。两处孤坐垂五十二载而卒。豁虽承指喻。而后于睡龙印可乃嗣睡龙。住漳州保福
  ref: T51n2076_p0373b29（景德传灯录）
