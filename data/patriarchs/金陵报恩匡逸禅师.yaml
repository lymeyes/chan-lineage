id: 金陵报恩匡逸禅师
name: 金陵报恩匡逸
school: 法眼宗
teacher: 法眼文益禅师
status: draft
bio: 明州人也。江南国主请居上院。署凝密禅师
sayings:
- text: 上堂。顾视大众曰。依而行之。即无累矣。还信么。如太阳赫弈皎然地。更莫思量。思量不及。设尔思量得及。唤作分限智慧。不见先德云。人无心合道。道无心合人。人道既合。是名无事。人且自何而凡。自何而圣。于此若未会。可谓为迷情所覆。便去离不得。迷时即有窒碍。为对为待。种种不同。忽然惺去。亦无所得。譬如演若达多认影迷头。岂不担头觅头。然正迷之时。头且不失。及乎悟去。亦不为得。何以故。人迷谓之失。人悟谓之得。得失在于人。何关于动静
  ref: X80n1565_p0359a17（五灯会元）
- text: 僧问。诸佛说法。普润群机。和尚说法。甚么人得闻。师曰。祇有汝不闻
  ref: X80n1565_p0359a17（五灯会元）
- text: 问。如何是报恩一句。师曰。道不是得么
  ref: X80n1565_p0359a17（五灯会元）
- text: 问。十二时中思量不到处。如何行履。师曰。汝如今在甚么处
  ref: X80n1565_p0359a17（五灯会元）
- text: 问。祖嗣西来。如何举唱。师曰。不违所请
  ref: X80n1565_p0359a17（五灯会元）
- text: 问。如何是一句。师曰。我答争似汝举
  ref: X80n1565_p0359a17（五灯会元）
- text: 问。佛为一大事因缘出世。未审和尚出世如何。师曰。恰好。曰。恁么则大众有赖。师曰。莫错会。金陵报慈文遂导师金陵报慈文遂导师杭州陆氏子。尝究首楞严。甄会真妄缘起。本末精博。于是节科注释。文句交络。厥功既就。谒于法眼。述己所业。深符经旨。眼曰。楞严岂不是有八还义。师曰。是。曰。明还甚么。师曰。明还日轮。曰。日还甚么。师懵然无对。眼诫令禁其所注之文。师自有服膺请益。始忘知解。金陵国主署雷音觉海大导师
  ref: X80n1565_p0359a17（五灯会元）
- text: 上堂。天人群生类。皆承此恩力。威权三界。德被四方。共禀灵光。咸称妙义。十方诸佛常顶戴汝。谁敢是非。及乎向这里。唤作开方便门。对根设教。便有如此如彼。流出无穷。若能依而奉行。有何不可。所以清凉先师道。佛是无事人。且如今觅个无事人也不可得
  ref: X80n1565_p0359a17（五灯会元）
- text: 僧问。巅山岩崖。还有佛法也无。师曰。汝唤甚么作巅山岩崖
  ref: X80n1565_p0359a17（五灯会元）
- text: 问。如何是道。师曰。妄想颠倒。乃曰。老僧平生。百无所解。日日一般。虽住此间。随缘任运。今日诸上座与本无异。珍重
  ref: X80n1565_p0359a17（五灯会元）
- text: 僧问。如何是无异底事。师曰。千差万别。僧再
  ref: X80n1565_p0359a17（五灯会元）
- text: 问。师曰。止。止。不须说。且会取千差万别
  ref: X80n1565_p0359a17（五灯会元）
- text: 问。如何是和尚家风。师曰。方丈板门扇
  ref: X80n1565_p0359a17（五灯会元）
- text: 问。如何是无相道场。师曰。四郎五郎庙
  ref: X80n1565_p0359a17（五灯会元）
- text: 问。如何是吹毛剑。师曰。簳面杖
  ref: X80n1565_p0359a17（五灯会元）
- text: 问。如何是正直一路。师曰。远远近近。曰。便恁么去时如何。师曰。咄哉。痴人。此是险路
  ref: X80n1565_p0359a17（五灯会元）
- text: 问。僧从甚么处来。曰。曹山来。师曰。几程到此。曰。七程。师曰。行却许多山林谿㵎。何者是汝自己。曰。总是。师曰。众生颠倒。认物为己。曰。如何是学人自己。师曰。总是。乃曰。诸上座。各在此经冬过夏。还有人悟自己也无。山僧与汝证明。令汝真见不被邪魔所惑
  ref: X80n1565_p0359a17（五灯会元）
- text: 问。如何是学人自己。师曰。好个师僧。眼目甚分明
  ref: X80n1565_p0359a17（五灯会元）
