bio: 生平部分原文未载，仅存机缘语（见下）；据《续传灯录》T51n2077_p0630b03。
sayings:
- text: 僧问。飞来山色示清净法身。合㵎溪声演广长舌相。正当恁么时如何是云门一曲。师曰。芭蕉叶上三更雨。曰一句全提超佛祖。满筵朱紫尽知音。师曰。逢人不得错举
  ref: T51n2077_p0630b03（续传灯录）
- text: 上堂。不用求真何须息见。倒骑牛兮入佛殿。羌笛一声天地空。不知谁识瞿昙面
  ref: T51n2077_p0630b03（续传灯录）
