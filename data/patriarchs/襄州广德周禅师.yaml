id: 襄州广德周禅师
name: 襄州广德周
school: 曹洞宗
teacher: 广德延禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0516a14。
sayings:
- text: 僧问。鱼向深潭难避网。龙居浅水却难寻时如何。师曰。遍体昆仑黑。通身一点霜
  ref: X80n1565_p0516a14（五灯会元）
- text: 问。贫子归家时如何。师曰。入门不见面。处处故园春
  ref: X80n1565_p0516a14（五灯会元）
- text: 问。命尽禄绝时如何。师曰。死。曰。此人落归何道。师曰。薰薰弥宇宙。烂坏莫能拈
  ref: X80n1565_p0516a14（五灯会元）
- text: 问。闻话不觉时如何。师曰。遍界没聋人。谁是知音者。曰。如何是知音者。师曰。断弦续不得。历劫响泠泠
  ref: X80n1565_p0516a14（五灯会元）
- text: 问。教中道。阿逸多不断烦恼。不修禅定。佛记此人成佛无疑。此理如何。师曰。盐又尽。炭又无。曰。盐尽炭无时如何。师曰。愁人莫向愁人说。说向愁人愁杀人
  ref: X80n1565_p0516a14（五灯会元）
- text: 问。如何得念念相应去。师曰。惊水鱼龙散。曰。念念相应后如何。师曰。海北天南各自行。不劳鱼雁通消息
  ref: X80n1565_p0516a14（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0516a14），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
