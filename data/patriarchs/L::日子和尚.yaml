id: L::日子和尚
name: 日子
school: 南岳系
teacher: 南泉愿
status: draft
bio: 因亚谿来参。师作起势。谿曰。这老山鬼。犹见某甲在。师曰。罪过。罪过。适来失祗对。谿欲进语。师便喝。谿曰。大阵当前。不妨难御。师曰。是。是。谿曰。不是。不是赵州云。可怜两个汉。不识转身句
