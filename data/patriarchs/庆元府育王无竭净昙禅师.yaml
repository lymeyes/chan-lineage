id: 庆元府育王无竭净昙禅师
name: 庆元府育王无竭净昙
school: 黄龙派
teacher: 保宁圆玑禅师
status: draft
bio: 嘉禾人也。晚归钱塘之法慧。一日
sayings:
- text: 上堂。本自深山卧白云。偶然来此寄闲身。莫来问我禅兼道。我是吃饭屙屎人。绍兴丙寅夏。辞朝贵归付院事。四众拥视。挥扇久之。书偈曰。这汉从来没缝罅。五十六年成话霸。今朝死去见阎王。剑树刀山得人怕。遂打一圆相。曰。嗄。一任诸方。钻龟打瓦。收足而化。火后设利如霰。门人持骨。归阿育王山建塔
  ref: X80n1565_p0691a09（五灯会元）
