bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0632b12。
sayings:
- text: 僧问。如何是不动尊。师曰。来千去万。曰。恁么则脚跟不点地也。师曰。却是汝会
  ref: X80n1565_p0632b12（五灯会元）
- text: 上堂。至道无难。唯嫌拣择。但莫憎爱。洞然明白。山僧即不然。至道最难。须是拣择。若无憎爱。争见明白
  ref: X80n1565_p0632b12（五灯会元）
