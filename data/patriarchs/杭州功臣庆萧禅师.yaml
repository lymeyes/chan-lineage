school: 法眼宗
teacher: 天台韶
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0372b11。
sayings:
- text: 僧问。如何是功臣家风。师曰。明暗色空。曰。恁么则诸法无生去也。师曰。汝唤甚么作诸法。僧礼拜。师曰。听取一偈。功臣家风。明暗色空。法法非异。心心自通。恁么会得。诸佛真宗
  ref: X80n1565_p0372b11（五灯会元）
