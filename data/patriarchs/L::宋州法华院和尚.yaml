id: L::宋州法华院和尚
name: 宋州法华院
school: 临济宗
teacher: 魏府大觉
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0404a08。
sayings:
- text: 僧问。如何是佛。师曰。独坐五峰前
  ref: X80n1565_p0404a08（五灯会元）
- text: 问。如何是初生月。师曰。不高不低。曰。还许学人瞻敬也无。师曰。三日后看
  ref: X80n1565_p0404a08（五灯会元）
- text: 问。如何是法华家风。师曰。寒时寒杀。热时热杀。曰。如何是寒时寒杀。师曰。三三两两抱头行。曰。如何是热时热杀。师曰。东西南北见者嗤
  ref: X80n1565_p0404a08（五灯会元）
- text: 问。学人手持白刃。直进化门时如何。师曰。你试用看。僧便喝。师擒住。僧随手打一掌。师拓开曰。老僧今日失利。僧作舞而出。师曰。贼首头犯
  ref: X80n1565_p0404a08（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0404a08），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
