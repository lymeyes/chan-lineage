id: 齐峰和尚
name: 齐峰
school: 南岳系
teacher: 马祖一
status: draft
bio: 庞居士来。师曰。俗人频频入僧院。讨个甚么。士回顾两边曰。谁恁么道。师乃咄之。士曰。在这里。师曰。莫是当阳道么。士曰。背后底𫆏。师回首。曰。看。看。士曰。草贼大败。士却
sayings:
- text: 问。此去峰顶有几里。师曰。甚么处去来。士曰。可谓峻硬。不得问者。师曰。是多少。士曰。一二三。师曰。四五六。士曰。何不道七。师曰。才道七。便有八。士曰。住得也。师曰。一任添取。士喝便出去。师随后亦喝
