bio: 生平部分原文未载，仅存机缘语（见下）；据《续传灯录》T51n2077_p0676c17。
sayings:
- text: 僧问。山河大地与自己是同是别。师曰。长亭凉夜月多为客铺舒。曰谢师答话。师曰。网大难为鸟纶稠始得鱼。僧作舞归众。师曰。长江为研墨频写断交书
  ref: T51n2077_p0676c17（续传灯录）
- text: 上堂举百丈野狐话。乃曰。不是翻涛手。徒夸跨海鲸。由基方撚镞。枝上众猿惊
  ref: T51n2077_p0676c17（续传灯录）
- text: 上堂至座前师搊一僧上法座。僧慞惶欲走。师遂指座曰。这棚子若牵一头驴上去。他亦须就上屙在。汝诸人因甚么却不肯。以拄杖一时赶散。顾侍者曰崄
  ref: T51n2077_p0676c17（续传灯录）
