id: 吉州清平惟旷真寂禅师
name: 吉州清平惟旷真寂
school: 青原系
teacher: 罗山闲禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0276a01。
sayings:
- text: 上堂。不动神情。便有输赢之意。还有么。出来。时有僧出礼拜。师曰。不是作家。便归方丈
  ref: X80n1565_p0276a01（五灯会元）
- text: 问。如何是第一句。师曰。要头将取去
  ref: X80n1565_p0276a01（五灯会元）
- text: 问。如何是活人剑。师曰。会么。曰。如何是杀人刀。师叱之
  ref: X80n1565_p0276a01（五灯会元）
- text: 问。如何是师子儿。师曰。毛头排宇宙
  ref: X80n1565_p0276a01（五灯会元）
