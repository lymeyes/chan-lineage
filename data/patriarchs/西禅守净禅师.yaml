id: 西禅守净禅师
name: 西禅守净
alias: 西禅净
school: 杨岐派
teacher: 大慧宗杲禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《续传灯录》T51n2077_p0688a01。
sayings:
- text: 上堂。谈玄说妙撒屎撒尿。行棒行喝将盐止渴。立主立宾华擘宗乘。设或总不恁么。又是鬼窟里坐。到这里山僧已是打退鼓。且道诸人寻常心愤愤口悱悱合作么生。莫将闲学解。埋没祖师心
  ref: T51n2077_p0688a01（续传灯录）
- text: 上堂。若也单明自己不悟目前。此人有眼无足。若也只悟目前不明自己。此人有足无眼。直得眼足相资。如车二轮如鸟二翼。正好勘过了打
  ref: T51n2077_p0688a01（续传灯录）
- text: 上堂。九夏炎炎大热木人汗流不辍。夜来一雨便凉。莫道山僧不说。以拂子击禅床下座
  ref: T51n2077_p0688a01（续传灯录）
- text: 上堂。若欲正提纲。直须大地荒。欲来冲雪刃。未免露锋铓。当恁么时释迦老子出头不得即不
  ref: T51n2077_p0688a01（续传灯录）
- text: 问。尔诸人只如马镫里藏身又作么生话会
  ref: T51n2077_p0688a01（续传灯录）
- text: 上堂。道是常道心是常心。汝等诸人闻山僧恁么道。便道我会也。大尽三十日小尽二十九。头上是天脚下是地。耳里闻声鼻里出气。忽若四大海水在汝头上。毒蛇穿尔眼睛。虾蟆入尔鼻孔。又作么生
  ref: T51n2077_p0688a01（续传灯录）
- text: 上堂。文殊普贤谈理事。临济德山行棒喝。东禅一觉到天明。偏爱风从凉处发。咄
  ref: T51n2077_p0688a01（续传灯录）
- text: 上堂。善斗者不顾其首。善战者必获其功。其功既获坐致太平。太平既致高枕无忧。罢拈三尺剑。休弄一张弓。归马于华山之阳。放牛于桃林之野。风以时而雨以时。渔父歌而樵人舞。虽然如是。尧舜之君犹有化在。争似乾坤收不得。尧舜不知名。浑家不管兴亡事偏爱和云占洞庭
  ref: T51n2077_p0688a01（续传灯录）
- text: 上堂。闭却口时时说。截却舌无间歇。无间歇最奇绝。最奇绝眼中屑。既是奇绝为甚么却成眼中屑。了了了时无可了。玄玄玄处亦须呵
  ref: T51n2077_p0688a01（续传灯录）
- text: 上堂。佛祖顶𩕳上。有泼天大路。未透生死关。如何敢进步。不进步。大千没遮护。一句绝言诠。那咤擎铁柱。开堂拈香罢就座。南堂和尚白槌曰。法筵龙象众当观第一义。师随声便喝曰。此是第几义。久参先德已辨来端。后学有疑不妨请
  ref: T51n2077_p0688a01（续传灯录）
- text: 问。僧问。阿难问迦叶。世尊传金襕外别传何物。迦叶唤阿难。阿难应喏。未审此意如何。师曰。切忌动著。曰只如迦叶道倒却门前刹竿著。又作么生。师曰。石牛横古路。曰只如和尚于佛日处还有这个消息也无。师曰。无这个消息。曰争奈定光金地遥招手。智者江陵暗点头。师曰。莫将庭际柏。轻比路傍嵩。僧礼拜。师乃曰。定光金地遥招手。智者江陵暗点头。已是白云千万里。那堪于此未知休。设或于此便休去。一场狼藉不少。还有检点得出者么。如无山僧今日失利
  ref: T51n2077_p0688a01（续传灯录）
- text: 僧问。佛佛授手祖祖相传未审传个甚么。师曰。速礼三拜。问不施寸刃请师相见。师曰。逢强即弱。曰何得埋兵掉斗。师曰。只为阇𪏭寸刃不施。曰未审向上还有事也无。师曰有。曰如何是向上事。师曰。败将不斩。问古佛堂前甚么人先到。师曰。无眼村翁。曰未审如何趣向。师曰。楖栗横担
  ref: T51n2077_p0688a01（续传灯录）
