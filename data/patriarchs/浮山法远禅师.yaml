id: 浮山法远禅师
name: 浮山法远
school: 临济宗
teacher: 叶县归省禅师
bio: 叶县归省禅师法嗣，住浮山（今安徽枞阳）。宋初临济宗名匠，以「铁面」严冷著称，曾为欧阳修说禅，撰有「浮山九带」以摄禅门纲要。
sayings:
- text: 师参叶县，县每见必诟骂、以水沃之，师不退；县曰：「你再犯，我打你。」师曰：「某虽蒙和尚慈悲，如以水沃石。」县曰：「我是为你，如石上栽花。」由是印可。
  ref: 五灯会元·卷十二·浮山法远禅师
- text: 浮山九带：佛正法眼藏带、佛法藏带、理贯带、事贯带、理事纵横带、屈曲垂带、妙协兼带、金针双锁带、平怀常实带——以「带」摄禅门开合之机。
  ref: 五灯会元·卷十二·浮山法远禅师（浮山九带）
