id: L::福州龙山文义禅师
name: 福州龙山文义
school: —
teacher: 鼓山晏
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0295a11。
sayings:
- text: 上堂。若举宗乘。即院寂径荒。若留委
  ref: X80n1565_p0295a11（五灯会元）
- text: 问。更待个甚么。还有人委悉么。出来验看。若无人委悉。且莫掠虗好。便下座
  ref: X80n1565_p0295a11（五灯会元）
- text: 问。如何是人王。师曰。威风人尽惧。曰。如何是法王。师曰。一句令当行。曰。二王还分不分。师曰。适来道甚么
  ref: X80n1565_p0295a11（五灯会元）
