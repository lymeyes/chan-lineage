bio: 不知何许人也。自号碧落道人。尝以触衣书七佛名。丛林称为兰布裩。有拟草庵歌一篇行于世。具载普灯。建炎末逆虏犯淮执师见酋长。长曰。闻我名否。师曰。我所闻者唯大宋天子之名。长恚令左右以锤击之。锤至辄断坏。长惊异延麾下敬事之。经旬师索薪自焚。无敢供者。亲拾薪成龛怡然端坐。烟焰一起流光四腾。虏跪伏灼肤者多。火绝得五色舍利。并其骨而北归。所执僧尼悉得自便。和人至今咏之
