id: 乌臼和尚
name: 乌臼
school: 南岳系
teacher: 马祖一
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0114b08。
sayings:
- text: 问。二禅客发足甚么处。玄曰。江西。师便打。玄曰。久知和尚有此机要。师曰。汝既不会。后面个师僧祇对看。绍拟近前。师便打。曰。信知同坑无异土。参堂去。问僧。近离甚处。曰。定州。师曰。定州法道何似这里。曰。不别。师曰。若不别。更转彼中去。便打。僧曰。棒头有眼。不得草草打人。师曰。今日打著一个也。又打三下。僧便出去。师曰。屈棒元来有人吃在。曰。争柰杓柄在和尚手里。师曰。汝若要。山僧回与汝。僧近前夺棒。打师三下。师曰。屈棒。屈棒。曰。有人吃在。师曰。草草打著个汉。僧礼拜。师曰。却与么去也。僧大笑而出。师曰。消得恁么。消得恁么
  ref: X80n1565_p0114b08（五灯会元）
