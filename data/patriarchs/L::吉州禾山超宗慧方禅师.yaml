name: 吉州禾山超宗慧方
school: 黄龙派
teacher: 黄龙新
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0692b09。
sayings:
- text: 上堂举拂子曰。看。看。祇这个。在临济．则照用齐行。在云门则理事俱备。在曹洞则偏正叶通。在沩山则暗机圆合。在法眼则何止唯心。然五家宗派。门庭施设则不无。直饶辩得倜傥分明去。犹是光影边事。若要抵敌生死。则霄壤有隔。且超越生死一句作么生道。良久曰。洎合错下注脚
  ref: X80n1565_p0692b09（五灯会元）
