bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0670b14。
sayings:
- text: 僧问。如何是宾中宾。师曰。巢父饮牛。曰。如何是宾中主。师曰。许由洗耳。曰。如何是主中宾。师便喝。曰。如何是主中主。师曰。礼拜了。退
  ref: X80n1565_p0670b14（五灯会元）
- text: 上堂。田地稳密。过犯弥天。灼然擡脚。不起神通游戏。无疮自伤。特地下脚不得。且道过在甚么处。具参学眼底出来。共相理论。要见本分家山。不支岐路。莫祇管自家点头。蹉过岁月。他时异日。顶上一椎。莫言不道
  ref: X80n1565_p0670b14（五灯会元）
