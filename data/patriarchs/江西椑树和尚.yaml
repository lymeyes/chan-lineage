id: 江西椑树和尚
name: 江西椑树
school: 南岳系
teacher: 马祖道一禅师
status: draft
bio: 卧次。道吾近前。牵被覆之。师曰。作么。吾曰。葢覆。师曰。卧底是。坐底是。吾曰。不在这两处。师曰。争奈葢覆何。吾曰。莫乱道。师向火次。吾
sayings:
- text: 问。作么。师曰。和合。吾曰。恁么即当头脱去也。师曰。隔阔来多少时邪。吾便拂袖而去。吾一日从外归
  ref: X80n1565_p0117b17（五灯会元）
- text: 师问。甚么处去来。吾曰。亲近来。师曰。用簸这两片皮作么。吾曰。借。师曰。他有从汝借。无作么生。吾曰。只为有。所以借
  ref: X80n1565_p0117b17（五灯会元）
