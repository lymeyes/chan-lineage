bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0704a04。
sayings:
- text: 僧问。中秋不见月时如何。师曰。更待夜深看。曰。忽若黑云未散。又且如何。师曰。争怪得老僧
  ref: X80n1565_p0704a04（五灯会元）
- text: 上堂。悟心容易息心难。息得心源到处闲。斗转星移天欲晓。白云依旧覆青山
  ref: X80n1565_p0704a04（五灯会元）
