id: L::温州净光了威佛日禅师
name: 温州净光了威佛日
school: —
teacher: 圆通仙
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0703b14。
sayings:
- text: 僧问。如何是祖师西来意。师曰。一宿二宿程。千山万山月。曰。意旨如何。师曰。朝看东南。暮看西北。曰。向上更有事也无。师曰。人心难满。谿壑易填
  ref: X80n1565_p0703b14（五灯会元）
- text: 问。时节因缘即不
  ref: X80n1565_p0703b14（五灯会元）
- text: 问。惠超佛话事如何。师曰。波斯弯弓面转黑。曰。意旨如何。师曰。穿过髑髅笑未休。曰。学人好好借
  ref: X80n1565_p0703b14（五灯会元）
- text: 问。师曰。黄泉无邸店。今夜宿谁家
  ref: X80n1565_p0703b14（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0703b14），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
