id: 宝寿和尚
name: 宝寿
school: 临济宗
teacher: 宝寿沼禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0402b14。
sayings:
- text: 问。父母未生前。还我本来面目来。师立至夜深。下语不契。翌日辞去。寿曰。汝何往。师曰。昨日蒙和尚设
  ref: X80n1565_p0402b14（五灯会元）
- text: 问。某甲不契。往南方参知识去。寿曰。南方禁夏不禁冬。我此间禁冬不禁夏。汝且作街坊过夏。若是佛法。阛阓之中。浩浩红尘。常说正法。师不敢违。一日。街头见两人交争。挥一拳曰。你得恁么无面目。师当下大悟。走见宝寿。未及出语。寿便曰。汝会也。不用说。师便礼拜。寿临迁化时。嘱三圣请师开堂。师开堂日。三圣推出一僧。师便打。圣曰。与么为人。非但瞎却这僧眼。瞎却镇州一城人眼去在法眼云。甚么处是瞎却人眼处。师掷下拄杖。便归方丈
  ref: X80n1565_p0402b14（五灯会元）
- text: 僧问。不占阃域。请师不谤。师曰。莫
  ref: X80n1565_p0402b14（五灯会元）
- text: 问。种种庄严．殷勤奉献时如何。师曰。莫污我心田。师将顺寂。谓门人曰。汝还知吾行履处否。曰。知和尚长坐不卧。师又召僧近前来。僧近前。师曰。去。非吾眷属。言讫而化
  ref: X80n1565_p0402b14（五灯会元）
