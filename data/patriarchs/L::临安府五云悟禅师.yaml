id: L::临安府五云悟禅师
name: 临安府五云悟
school: 云门宗
teacher: 净慈昌
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0649a02。
sayings:
- text: 上堂。月堂老汉道。行不见行。是个甚么。坐不见坐。是个甚么。著衣时不见著衣。是个甚么。吃饭时不见吃饭。是个甚么。山僧虽与他同床打睡。要且各自做梦。何故。行见行。坐见坐。著衣时见著衣。吃饭时见吃饭。无有不见底道理。亦无个是甚么。诸人且道。老汉底是。五云底是。拈拄杖卓一下。曰。桃红李白蔷薇紫。问著春风总不知
  ref: X80n1565_p0649a02（五灯会元）
