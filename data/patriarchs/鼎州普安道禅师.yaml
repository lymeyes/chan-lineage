id: 鼎州普安道禅师
name: 鼎州普安道
school: 云门宗
teacher: 德山密禅师
status: draft
bio: 三句颂。函葢乾坤曰。乾坤并万象。地狱及天堂。物物皆真见。头头用不伤。截断众流曰。堆山积岳来。一一尽尘埃。更拟论玄妙。冰消瓦解摧。随波逐浪曰。辩口利舌
sayings:
- text: 问。高低总不亏。还如应病药。诊候在临时。三句外曰。当人如举唱。三句岂能该。有问如何事。南岳与天台。擡荐商量曰。相见不扬眉。君东我亦西。红霞穿碧落。白日绕须弥
