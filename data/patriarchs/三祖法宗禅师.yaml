id: 三祖法宗禅师
name: 三祖法宗
alias: 三祖宗
school: 黄龙派
teacher: 黄龙慧南禅师
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《续传灯录》T51n2077_p0572a05。
sayings:
- text: 僧问。如何是佛。师曰。吃盐添得渴。问如何是道。师曰。十里双牌五里单堠。曰如何是道中人。师曰。少避长贱避贵。问如何是善知识所为底心。师曰。十字街头一片砖。曰如何是十字街头一片砖。师曰。不知。曰既不知却恁么说。师曰。无人踏著
  ref: T51n2077_p0572a05（续传灯录）
- text: 上堂。五五二十五。时人尽解数。倒拈第二筹。茫茫者无据。为甚么无据。爱他一缕失却一端
  ref: T51n2077_p0572a05（续传灯录）
- text: 上堂。明晃晃活鱍鱍。十方世界一毫末。抛向面前知不知。莫向意根上拈掇。拍一拍
  ref: T51n2077_p0572a05（续传灯录）
- text: 上堂架梯可以攀高。虽升而不能达河汉。铸锹可以掘凿。虽利而不能到风轮。其器者费功。其谋者益妄。不如归家坐。免使走尘壤。大众那个是尘壤。祖佛禅道
  ref: T51n2077_p0572a05（续传灯录）
