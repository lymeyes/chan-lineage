id: 鼎州大龙山炳贤禅师
name: 鼎州大龙山炳贤
school: 云门宗
teacher: 双泉宽
status: draft
bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0581b12。
sayings:
- text: 僧问。昔日先师语。如何透法身。师曰。万仞峰前句。不与白云齐
  ref: X80n1565_p0581b12（五灯会元）
- text: 问。如何是动乾坤句。师曰。透出龙宫翻大海。掌开日月倒须弥
  ref: X80n1565_p0581b12（五灯会元）
- text: 问。如何是出家人。师曰。深。曰。如何是出家法。师曰。苦。自岩上座自岩上座
  ref: X80n1565_p0581b12（五灯会元）
- text: 僧问。如何是无缝塔。师曰。砖瓦泥土。曰。如何是塔中人。师曰。含齿戴发
  ref: X80n1565_p0581b12（五灯会元）
- text: 问。如何是大人相。师曰。不曾作模样。曰。如何是老人相。师曰。无力把拄杖
  ref: X80n1565_p0581b12（五灯会元）
- text: 问。洞山麻三斤。意旨如何。师曰。八十婆婆不妆梳
  ref: X80n1565_p0581b12（五灯会元）
verify: 机器抽取自 CBETA《五灯会元》原文条目（起于 X80n1565_p0581b12），已做简繁转换与章节标题清洗；尚未逐字人工校订（切分边界、异体字、法系归属仍待核）。原卡「未载生平事迹与语录原文」之断言，经本次语料核对为误，已订正。
