sayings:
- text: 僧问。如何是道。师良久曰。会么。曰。学人不会。师曰。听取一偈。话道语下无声。举扬奥旨丁宁。禅要如今会取。不须退后消停
  ref: X80n1565_p0337a18（五灯会元）
