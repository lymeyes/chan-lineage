id: L::平江府南峰云辩禅师
name: 平江府南峰云辩
school: 杨岐派
teacher: 昭觉勤
status: draft
bio: 本郡人。依闽之瑞峰章得度。旋里谒穹窿圆。忽有得。遂通所见。圆曰。子虽得入。未至当也。切宜著鞭。乃辞扣诸席。后参圆悟。值入室。才踵门。悟曰。看脚下。师打露柱一下。悟曰。何不著实道取一句。师曰。师若摇头。弟子摆尾。悟曰。你试摆尾看。师翻筋斗而出。悟大笑。由是知名。住后
sayings:
- text: 僧问。如何是夺人不夺境。师曰。霸主到乌江。曰。如何是夺境不夺人。师曰。筑坛拜将。曰。如何是人境两俱夺。师曰。万里山河获太平。曰。如何是人境俱不夺。师曰。龙吟雾起。虎啸风生。曰。向上还有事也无。师曰。当面蹉过。曰。真个作家。师曰。白日鬼迷人。一日入城。与道俗行至十郎巷。有
  ref: X80n1565_p0762a06（五灯会元）
- text: 问。巷在这里。十郎在甚处。师奋臂曰。随我来
  ref: X80n1565_p0762a06（五灯会元）
