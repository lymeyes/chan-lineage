id: 覆盆庵主
name: 覆盆
school: 临济宗
teacher: 临济玄
status: draft
bio: 问僧。甚处来。僧曰。覆盆山下来。师曰。还见庵主么。僧便喝。师便打。僧曰。作甚么。师住棒。僧拟议。师又打。一日。有僧从山下哭上。师闭却门。僧于门上画一圆相。门外立地。师从庵后出。却从山下哭上。僧喝曰。犹作这个去就在。师便换手捶胸曰。可惜先师一场埋没。僧曰。苦。苦。师曰。庵主被谩
