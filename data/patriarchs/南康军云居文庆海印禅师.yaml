bio: 生平部分原文未载，仅存机缘语（见下）；据《五灯会元》X80n1565_p0601a10。
sayings:
- text: 僧问。如何是函葢乾坤句。师曰。合。曰。如何是随波逐浪句。师曰。阔。曰。如何是截断众流句。师曰。窄
  ref: X80n1565_p0601a10（五灯会元）
- text: 上堂。道本无为。法非延促。一念万年。千古在目。月白风恬。山青水绿。法法现前。头头具足。祖意教意。非直非曲。要识庐陵米价。会取山前麦熟。以拂子击禅床。下座
  ref: X80n1565_p0601a10（五灯会元）
