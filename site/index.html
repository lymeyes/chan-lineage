<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>禅宗法脉 · 交互谱系</title>
<style>
  :root{
    --bg:#ffffff; --panel:#f8fafc; --line:#e2e8f0; --ink:#1e293b; --muted:#64748b;
    --accent:#0f172a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}
  #app{display:flex;height:100vh}
  #left{width:360px;min-width:300px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel)}
  #head{padding:12px 14px;border-bottom:1px solid var(--line)}
  #head h1{font-size:15px;margin:0 0 8px}
  #head .sub{font-size:11px;color:var(--muted);margin-bottom:8px}
  #tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  #tools input{flex:1;min-width:120px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;font-size:12px}
  #tools button{padding:5px 9px;border:1px solid var(--line);background:#fff;border-radius:6px;font-size:12px;cursor:pointer}
  #tools button:hover{background:#eef2f7}
  #tree{flex:1;overflow:auto;padding:8px 6px;font-size:13px;line-height:1.5}
  ul.t{list-style:none;margin:0;padding-left:14px}
  ul.t.root{padding-left:0}
  li.t{margin:1px 0}
  .row{display:flex;align-items:center;gap:5px;padding:2px 4px;border-radius:5px;cursor:pointer;white-space:nowrap}
  .row:hover{background:#eef2f7}
  .row.sel{background:#dbeafe}
  .tg{width:14px;text-align:center;color:var(--muted);font-size:10px;user-select:none}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .nm{overflow:hidden;text-overflow:ellipsis}
  .nm.hit{background:#fde68a}
  #right{flex:1;overflow:auto;padding:26px 34px}
  .empty{color:var(--muted);margin-top:40px;text-align:center}
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;color:#fff;font-size:12px;margin-left:8px;vertical-align:middle}
  h2{font-size:22px;margin:0 0 4px}
  .hon{color:var(--muted);font-size:14px;margin-bottom:14px}
  .crumbs{font-size:12px;color:var(--muted);margin-bottom:18px;line-height:1.8}
  .crumbs b{color:var(--ink)}
  .meta-grid{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin-bottom:18px}
  .meta-grid .k{color:var(--muted)}
  .sec{margin-top:22px}
  .sec h3{font-size:14px;border-left:3px solid var(--accent);padding-left:8px;margin:0 0 8px}
  .bio{white-space:pre-wrap;font-size:14px;line-height:1.9;background:var(--panel);padding:12px 14px;border-radius:8px}
  .say{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px;background:#fff}
  .say .t{white-space:pre-wrap;font-size:14px;line-height:1.8}
  .say .r{font-size:12px;color:var(--muted);margin-top:6px}
  .todo{border:1px dashed #cbd5e1;color:var(--muted);border-radius:8px;padding:12px 14px;font-size:13px}
  code{background:#f1f5f9;padding:1px 5px;border-radius:4px;font-size:12px}
</style>
</head>

为东土禅宗之远源。其传次如下（括注略迹）：\n三祖商那和修（持鉴而度、手生瑞瑞）、四祖优波毱多（无相好佛、度人无数）、五祖提多迦、六祖弥遮迦、七祖婆须蜜、八祖佛陀难提、九祖伏驮蜜多、十祖胁尊者（胁不至席）、十一祖富那夜奢、十二祖马鸣（造《大乘起信论》传统所归）、十三祖迦毗摩罗、十四祖龙树（造《中论》，立八不）、十五祖迦那提婆（破邪显正）、十六祖罗睺罗、十七祖僧伽难提、十八祖伽耶舍多、十九祖鸠摩罗多、二十祖阇夜多、二十一祖婆修盘头（世亲，唯识宗祖）、二十二祖摩拏罗、二十三祖鹤勒那、二十四祖师子尊者（为罽宾王所害）、二十五祖婆舍斯多、二十六祖不如蜜多、二十七祖般若多罗、二十八祖菩提达摩（东来，为东土初祖）。\n此节点在谱系图中为「西天二十八祖」汇总；各祖之独立节点未逐一展开，后续可按 CBETA 补为独立卡片。", "sayings": [{"text": "十四祖龙树付法偈：「为明隐显法，方说解脱理；于法心不证，无瞋亦无喜。」", "ref": "景德传灯录·卷二·龙树尊者"}, {"text": "龙树《中论》：「不生亦不灭，不常亦不断，不一亦不异，不来亦不出。」（八不偈）", "ref": "中论·观因缘品"}], "status": "draft", "verify": "综述性质；各祖生平与付法偈须逐条以 CBETA 校对，并补为独立节点卡。", "evidence": "primary", "verify_status": "anchor_only"}, "PRE::七佛": {"id": "PRE::七佛", "name": "过去七佛", "honorific": "过去七佛（庄严劫三佛 + 贤劫四佛）", "school": "源头", "dynasty": "佛教传说时代（劫）", "source_ref": "景德传灯录·卷一·七佛 / 五灯会元·卷一·七佛", "cbeta": "T51n2076（景德传灯录）卷一", "bio": "禅宗「教外别传、不立文字」之远源，上溯至过去七佛。灯录以七佛偈提纲，显「心法无形、罪福皆空」之旨，为后世祖师机缘之先声。\n七佛依次为：毗婆尸（Vipasyin）、尸弃（Sikhin）、毗舍浮（Visvabhu）、拘留孙（Krakucchanda）、拘那含牟尼（Kanakamuni）、迦叶（Kasyapa）、释迦牟尼（Sakyamuni）。", "sayings": [{"text": "身从无相中受生，犹如幻出诸形像；幻人心识本来无，罪福皆空无所住。", "ref": "景德传灯录·卷一·毗婆尸佛"}, {"text": "假借四大以为身，心本无生因境有；前境若无心亦无，罪福如幻起亦灭。", "ref": "景德传灯录·卷一·毗舍浮佛"}, {"text": "一切众生性清净，从本无生无可灭；即此身心是幻生，幻化之中无罪福。", "ref": "景德传灯录·卷一·迦叶佛"}, {"text": "法本法无法，无法法亦法；今付无法时，法法何曾法。", "ref": "景德传灯录·卷一·释迦牟尼佛"}], "status": "draft", "verify": "待 CBETA 逐字校对七佛偈；status 拟核后改 core。", "evidence": "primary", "verify_status": "anchor_only"}, "PRE::三祖僧璨": {"id": "PRE::三祖僧璨", "name": "僧璨", "honorific": "东土三祖 · 鉴智禅师（谥）", "school": "东土祖师", "dynasty": "隋", "region": "舒州皖公山", "teacher": "慧可", "source_ref": "五灯会元·卷一·三祖僧璨 / 景德传灯录·卷三", "cbeta": "T51n2076 卷三", "bio": "初以居士身患风疾，谒二祖求忏罪，言下契悟，嗣法。隐于舒州皖公山，往来太湖县司空山，不与世接。\n著《信心铭》一卷，为禅宗早期重要文献，开「至道无难，唯嫌拣择」之旨，扫荡情尘、直显性源。后传法于道信。", "sayings": [{"text": "《信心铭》：「至道无难，唯嫌拣择。但莫憎爱，洞然明白。」", "ref": "信心铭 / 景德传灯录·卷三"}], "status": "draft", "verify": "待 CBETA 校对《信心铭》原文。", "evidence": "primary", "verify_status": "anchor_only"}, "PRE::东土初祖菩提达摩": {"id": "PRE::东土初祖菩提达摩", "name": "菩提达摩", "honorific": "东土初祖 · 圆觉大师（谥）", "school": "东土祖师", "dynasty": "南朝梁", "region": "嵩山少林寺 / 广州 / 建康", "teacher": "西天二十七祖般若多罗", "source_ref": "五灯会元·卷一·东土初祖菩提达摩 / 景德传灯录·卷三", "cbeta": "T51n2076 卷三", "bio": "南天竺香至王第三子，从般若多罗得法，嘱其「待震旦（中国）缘熟而后往」。\n梁武帝普通年间泛海至广州，北上见武帝。帝问「如何是圣谛第一义」，答「廓然无圣」；问「对朕者谁」，答「不识」。机缘不契，遂一苇渡江，止于嵩山少林寺，面壁而坐，终日默然，世称「壁观婆罗门」，历九年。\n后付法于慧可，并授袈裟与《楞伽经》四卷，谓「吾灭后二百年，此经盛行」。临别授偈：「吾本来兹土，传法救迷情。一花开五叶，结果自然成。」", "sayings": [{"text": "帝问：「如何是圣谛第一义？」师曰：「廓然无圣。」帝曰：「对朕者谁？」师曰：「不识。」", "ref": "五灯会元·卷一·菩提达摩"}, {"text": "师付慧可偈：「吾本来兹土，传法救迷情。一花开五叶，结果自然成。」", "ref": "景德传灯录·卷三·菩提达摩"}], "status": "draft", "verify": "待 CBETA 校对武帝机缘与付法偈。", "evidence": "primary", "verify_status": "anchor_only"}, "PRE::二祖慧可": {"id": "PRE::二祖慧可", "name": "慧可", "honorific": "东土二祖 · 断臂求法", "school": "东土祖师", "dynasty": "南北朝", "region": "嵩山 / 邺都", "teacher": "菩提达摩", "source_ref": "五灯会元·卷一·二祖慧可 / 景德传灯录·卷三", "cbeta": "T51n2076 卷三", "bio": "武牢姬氏子，少通世典，博览群书。闻达摩少林面壁，往参承，晨夕参寻。\n雪夜坚立，积雪过膝，复断臂置师前，曰：「弟子心未安，乞师安心。」达摩曰：「将心来，与汝安。」可良久曰：「觅心了不可得。」达摩曰：「我与汝安心竟。」言下大悟，嗣法。\n后传法于僧璨，晚年行化邺都，屡遭非难，从容就义。", "sayings": [{"text": "达摩曰：「将心来，与汝安。」慧可良久曰：「觅心了不可得。」达摩曰：「我与汝安心竟。」", "ref": "五灯会元·卷一·慧可"}], "status": "draft", "verify": "待 CBETA 校对断臂安心公案。", "evidence": "primary", "verify_status": "anchor_only"}, "PRE::五祖弘忍": {"id": "PRE::五祖弘忍", "name": "弘忍", "honorific": "东土五祖 · 大满禅师（谥）", "school": "东土祖师", "dynasty": "唐", "region": "黄梅冯茂山（东山）", "teacher": "道信", "source_ref": "五灯会元·卷一·五祖弘忍 / 景德传灯录·卷三", "cbeta": "T51n2076 卷三", "bio": "七岁依道信出家，尽得其法，后住黄梅冯茂山（东山），弘化一方，世称「东山法门」。\n门下盛极，神秀、慧能皆出其门。以「菩提本无树」偈勘验大众，遂传衣法于慧能。", "sayings": [{"text": "尝令徒众各述一偈呈心，神秀书：「身是菩提树，心如明镜台；时时勤拂拭，莫使惹尘埃。」", "ref": "六祖坛经·行由品 / 五灯会元·卷一·弘忍"}], "status": "draft", "verify": "待 CBETA 校对。", "evidence": "primary", "verify_status": "anchor_only"}, "PRE::四祖道信": {"id": "PRE::四祖道信", "name": "道信", "honorific": "东土四祖 · 大医禅师（谥）", "school": "东土祖师", "dynasty": "唐", "region": "蕲州黄梅破头山（双峰山）", "teacher": "僧璨", "source_ref": "五灯会元·卷一·四祖道信 / 景德传灯录·卷三", "cbeta": "T51n2076 卷三", "bio": "嗣法于僧璨，后住黄梅破头山（双峰山）三十年，门人云集，号「东山之法」之先声。\n倡导「守一不移」「农禅并重」，令徒众「坐作并重」，为后世丛林制度奠基。传法于弘忍。", "sayings": [{"text": "示众：「夫百千法门，同归方寸；河沙妙德，总在心源。一切戒门、定门、慧门，神通变化，悉自具足，不离汝心。」", "ref": "五灯会元·卷一·道信"}], "status": "draft", "verify": "待 CBETA 校对。", "evidence": "primary", "verify_status": "anchor_only"}, "PRE::西天二祖阿难": {"id": "PRE::西天二祖阿难", "name": "阿难陀", "honorific": "西天二祖 · 多闻尊者", "school": "西天祖师", "dynasty": "佛在世", "teacher": "摩诃迦叶", "source_ref": "五灯会元·卷一·西天二祖阿难尊者 / 景德传灯录·卷一", "cbeta": "T51n2076 卷一", "bio": "佛之堂弟，博闻强记、多闻第一。佛灭后，迦叶集众结集，阿难登座诵出经藏，诸经首标「如是我闻」即始于此，以证信于众。\n迦叶将入鸡足山灭度前，以正法付阿难，阿难传法于商那和修。灯录载二人机缘：迦叶索「世尊传金襕袈裟外更传何物」，阿难于言下领悟。", "sayings": [{"text": "阿难问迦叶：「世尊传金襕袈裟外，别传何物？」迦叶召阿难，阿难应诺，迦叶曰：「倒却门前刹竿著！」阿难言下领悟。", "ref": "五灯会元·卷一·阿难尊者"}], "status": "draft", "verify": "待 CBETA 校对。", "evidence": "primary", "verify_status": "anchor_only"}, "PRE::西天初祖摩诃迦叶": {"id": "PRE::西天初祖摩诃迦叶", "name": "摩诃迦叶", "honorific": "西天初祖 · 饮光尊者 · 金色头陀", "school": "西天祖师", "dynasty": "佛在世（约公元前 5 世纪）", "region": "摩竭陀国", "teacher": "释迦牟尼佛", "source_ref": "五灯会元·卷一·西天一祖摩诃迦叶尊者 / 景德传灯录·卷一", "cbeta": "T51n2076 卷一", "bio": "佛之弟子，少欲头陀第一，人称「金色头陀」「饮光尊者」。\n世尊于灵山会上拈花示众，人天百万悉皆默然，唯迦叶破颜微笑；世尊曰：「吾有正法眼藏、涅槃妙心、实相无相、微妙法门，不立文字、教外别传，付嘱摩诃迦叶。」此即禅宗「以心传心」之始。\n佛灭后，迦叶于王舍城结集三藏（窟内结集），为僧团统摄者，传法于阿难。", "sayings": [{"text": "世尊付法偈：「法本法无法，无法法亦法；今付无法时，法法何曾法。」", "ref": "五灯会元·卷一·摩诃迦叶"}], "status": "draft", "verify": "待 CBETA 校对；拈花付法出自《大梵天王问佛决疑经》及灯录传承，属宗门根本公案。", "evidence": "primary", "verify_status": "anchor_only"}, "万年一禅师": {"id": "万年一禅师", "name": "万年一", "school": "黄龙派", "teacher": "泐潭清", "status": "named_only", "bio": "《灯录》仅列其名，列为「泐潭清」之法嗣，未载生平事迹与语录原文。此卡为结构占位，待据 CBETA 数字化藏经（《五灯会元》《景德传灯录》《祖堂集》《联灯会要》《五灯全书》）逐条补全。", "sayings": [], "verify": "structural stub derived from lineage tree; no lamp-record content yet."}, "万年贲禅师": {"id": "万年贲禅师", "name": "万年贲", "school": "黄龙派", "teacher": "育王谌", "status": "named_only", "bio": "《灯录》仅列其名，列为「育王谌」之法嗣，未载生平事迹与语录原文。此卡为结构占位，待据 CBETA 数字化藏经（《五灯会元》《景德传灯录》《祖堂集》《联灯会要》《五灯全书》）逐条补全。", "sayings": [], "verify": "structural stub derived from lineage tree; no lamp-record conte function makeNode(n, depth){
  const li = document.createElement('li'); li.className='t';
  const row = document.createElement('div'); row.className='t row';
  const hasKids = n.children && n.children.length;
  const tg = document.createElement('span'); tg.className='tg';
  tg.textContent = hasKids ? '▾' : '';
  const dot = document.createElement('span'); dot.className='dot';
  dot.style.background = HOUSES[n.house]||'#9ca3af';
  const nm = document.createElement('span'); nm.className='nm'; nm.textContent=n.name;
  nm.dataset.id = n.id;
  row.appendChild(tg); row.appendChild(dot); row.appendChild(nm);
  li.appendChild(row);
  let ul=null;
  if(hasKids){
    ul=document.createElement('ul'); ul.className='t';
    n.children.forEach(c=>ul.appendChild(makeNode(c, depth+1)));
    li.appendChild(ul);
  }
  // 默认折叠深层
  if(depth>=4 && hasKids){ ul.style.display='none'; tg.textContent='▸'; }
  tg.onclick = (e)=>{ e.stopPropagation();
    if(!hasKids) return;
    const open = ul.style.display!=='none';
    ul.style.display = open?'none':'block';
    tg.textContent = open?'▸':'▾';
  };
  row.onclick = ()=>select(n.id);
  row._tg = tg; row._ul = ul; row._hasKids = hasKids;
  nm._row = row; ROWBYID[n.id] = row;
  return li;
}

    else h+=`<div class="k">师承</div><div>${teacher}</div>`;
    if(b.source_ref) h+=`<div class="k">首要出处</div><div>${b.source_ref}</div>`;
    if(b.cbeta) h+=`<div class="k">CBETA</div><div>${b.cbeta}</div>`;
    if(b.status) h+=`<div class="k">状态</div><div>${b.status}</div>`;
    if(b.evidence) h+=`<div class="k">证据等级</div><div>${b.evidence==='primary'?'引自正典（一手灯录）':'汇编级（二手综述）'}</div>`;
    if(b.verify_status) h+=`<div class="k">核验状态</div><div>${b.verify_status==='line_verified'?'已逐字校核':'已锚定·待逐字校核'}</div>`;
  } else {
    h+=`<div class="k">师承</div><div>${teacher}</div>`;
  }
  h += `</div>`;
  if(b && b.bio){
    h += `<div class="sec"><h3>生平</h3><div class="bio">${escapeHtml(b.bio)}</div></div>`;
  }
  if(b && b.sayings && b.sayings.length){
    h += `<div class="sec"><h3>代表公案 / 语录</h3>`;
    b.sayings.forEach(s=>{
      h += `<div class="say"><div class="t">${escapeHtml(s.text)}</div>`+
           (s.ref?`<div class="r">出处：${escapeHtml(s.ref)}</div>`:'')+`</div>`;
    });
    h += `</div>`;
  }
  if(!b){
    h += `<div class="todo">生平 / 引文：<b>待补</b>。请编辑 <code>data/patriarchs/${id}.yaml</code>，`+
         `按 <code>data/schema.md</code> 填写（须标注精确出处，不得杜撰）。</div>`;
  } else if(b.status==='sample'){
    h += `<div class="todo">此卡为 <b>样例种子</b>（status: sample），内容取自灯录并标注出处，`+
         `待 CBETA 电子佛典逐字校核后改为 core。</div>`;
  }
  rightEl.innerHTML = h;
}
function escapeHtml(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

// 搜索
document.getElementById('q').addEventListener('input', e=>{
  const v=e.target.value.trim();
  if(!v){ document.querySelectorAll('.nm.hit').forEach(x=>x.classList.remove('hit')); return; }
  let first=null;
  document.querySelectorAll('.nm').forEach(nm=>{
    const hit = nm.textContent.indexOf(v)>=0;
    nm.classList.toggle('hit', hit);
    if(hit){
      // 展开所有祖先（按 id 回溯父链）
      let pid = ID2PARENT[nm.dataset.id];
      while(pid){ const r=ROWBYID[pid]; if(r && r._hasKids && r._ul){ r._ul.style.display='block'; r._tg.textContent='▾'; } pid=ID2PARENT[pid]; }
      if(!first) first=nm.dataset.id;
    }
  });
  if(first) select(first);
});
document.getElementById('expand').onclick=()=>{
  document.querySelectorAll('#tree .tg').forEach(tg=>{ if(tg.textContent==='▸'){tg.click();} });
};
document.getElementById('reset').onclick=()=>{ location.reload(); };
</script>
